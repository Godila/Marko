name: marko

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    <<: *logging
    image: postgres:16
    environment: { POSTGRES_USER: marko, POSTGRES_PASSWORD: "${PG_PASSWORD}", POSTGRES_DB: marko }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U marko"], interval: 10s, retries: 5 }
    restart: unless-stopped

  api:
    <<: *logging
    build: { context: ../app }
    env_file: .env
    volumes: ["../secrets:/srv/secrets:ro"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      retries: 3
    restart: unless-stopped

  worker:
    <<: *logging
    build: { context: ../app }
    command: ["python", "-m", "marko.worker"]
    env_file: .env
    volumes: ["../secrets:/srv/secrets:ro"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped

  ui:
    <<: *logging
    build: { context: ../ui }
    restart: unless-stopped

  caddy:
    <<: *logging
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data"]
    restart: unless-stopped

  backup:
    <<: *logging
    image: postgres:16
    volumes: ["../backups:/backups", "./backup.sh:/backup.sh:ro"]
    entrypoint: ["/bin/sh", "-c", "while true; do /backup.sh; sleep 86400; done"]
    environment: { PGHOST: postgres, PGUSER: marko, PGDATABASE: marko, PGPASSWORD: "${PG_PASSWORD}" }
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped

volumes: { pgdata: {}, caddy_data: {} }

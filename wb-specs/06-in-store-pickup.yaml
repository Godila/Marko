"openapi: 3.0.1\ninfo:\n  title: Самовывоз\n  x-file-name: in-store-pickup\n  description: |\n    <div class=\"api-block\">\n\n    Управление [сборочными заданиями](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders) и [идентификаторами маркировки](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers) Самовывоза.<br><br>\n\n    Вы можете протестировать методы Самовывоза в [песочнице](/sandbox). Также в песочнице доступны [специальные методы](/docs/openapi-other/sandbox-environment#tag/Marketplejs-Samovyvoz) для эмуляции действий пользователя\n\n    </div>\n  version: instorepickup\nservers:\n  - url: https://marketplace-api.wildberries.ru\nsecurity:\n  - HeaderApiKey: []\ntags:\n  - name: Сборочные задания Самовывоз\n    x-displayName: Сборочные задания Самовывоз\n    description: ''\n  - name: Идентификаторы маркировки Самовывоз\n    x-displayName: Идентификаторы маркировки Самовывоз\n    description: ''\npaths:\n  /api/v3/click-collect/orders/new:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      operationId: getV3ClickCollectOrdersNew\n      x-readonly-method: true\n      x-category: marketplace\n      tags:\n        - Сборочные задания Самовывоз\n      summary: Получить список новых сборочных заданий\n      description: |\n        Метод возвращает список всех новых [сборочных заданий](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders), которые есть у продавца на момент запроса.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий Самовывоз</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.NewOrders'\n              examples:\n                NewOrderClick:\n                  $ref: '#/components/examples/NewOrderClick'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/click-collect/orders:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      operationId: getV3ClickCollectOrders\n      x-readonly-method: true\n      x-category: marketplace\n      tags:\n        - Сборочные задания Самовывоз\n      summary: Получить информацию о завершённых сборочных заданиях\n      description: |\n        Метод возвращает информацию о завершённых сборочных заданиях после продажи или отмены заказа.\n        <br><br>\n        Можно получить данные за заданный период, максимум 30 календарных дней одним запросом.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий Самовывоз</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - name: limit\n          in: query\n          description: |\n            Количество элементов в ответе\n          required: true\n          schema:\n            type: integer\n            minimum: 1\n            maximum: 1000\n        - name: next\n          in: query\n          description: |\n            Параметр пагинации. Чтобы получить полный список данных, укажите `0` в первом запросе. Чтобы получить следующий пакет данных, используйте значение `next` из ответа\n          required: true\n          schema:\n            type: integer\n        - name: dateFrom\n          in: query\n          description: Дата начала периода в формате Unix timestamp\n          required: true\n          schema:\n            type: integer\n        - name: dateTo\n          in: query\n          description: Дата конца периода в формате Unix timestamp\n          required: true\n          schema:\n            type: integer\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.Orders'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/click-collect/orders/final-price:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    post:\n      operationId: postV3ClickCollectOrdersFinalPrice\n      x-readonly-method: true\n      x-category: marketplace\n      tags:\n        - Сборочные задания Самовывоз\n      summary: Получить цены продавца и суммы к оплате\n      description: |\n        Метод возвращает:\n          - цены продавца без учёта скидок\n          - суммы к оплате покупателем с учетом всех скидок и кэшбека\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>получения и удаления идентификаторов маркировки Самовывоз</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 150 запросов | 400 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.OrdersFinalPriceResponse'\n              examples:\n                GetFinalPriceSuccess:\n                  $ref: '#/components/examples/GetFinalPriceSuccess'\n        '400':\n          $ref: '#/components/responses/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          $ref: '#/components/responses/AccessDeniedBatch'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/click-collect/orders/status/confirm:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV3ClickCollectOrdersStatusConfirm\n      x-readonly-method: false\n      x-category: marketplace\n      tags:\n        - Сборочные задания Самовывоз\n      summary: Перевести сборочные задания на сборку\n      description: |\n        Метод переводит [сборочные задания](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders) из [статуса](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersStatusInfo) `new` — новый — в статус `confirm` — на сборке.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 сек | 1 запрос | 1 сек | 10 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersRequestV2'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.StatusSetResponses'\n        '400':\n          $ref: '#/components/responses/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDeniedBatch'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/click-collect/orders/status/prepare:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV3ClickCollectOrdersStatusPrepare\n      x-readonly-method: false\n      x-category: marketplace\n      tags:\n        - Сборочные задания Самовывоз\n      summary: Сообщить, что сборочные задания готовы к выдаче\n      description: |\n        Метод переводит [сборочные задания](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders) из [статуса](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersStatusInfo) `confirm` — на сборке — в статус `prepare` — готово к выдаче.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 сек | 1 запрос | 1 сек | 10 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersRequestV2'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.MetaDetailsResponse'\n        '400':\n          $ref: '#/components/responses/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDeniedBatch'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/click-collect/orders/client:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV3ClickCollectOrdersClient\n      x-readonly-method: true\n      x-category: marketplace\n      tags:\n        - Сборочные задания Самовывоз\n      summary: Информация о покупателе\n      description: |\n        Метод возвращает информацию о покупателе по ID сборочного задания.\n        <br><br>\n        Доступно только для сборочных заданий в статусах:\n          - `confirm` — на сборке\n          - `prepare` — готов к выдаче\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий Самовывоз</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersRequest'\n        required: true\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.OrderClientInfoResp'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/click-collect/orders/client/identity:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV3ClickCollectOrdersClientIdentity\n      x-readonly-method: true\n      x-category: marketplace\n      tags:\n        - Сборочные задания Самовывоз\n      summary: Проверить, что заказ принадлежит покупателю\n      description: |\n        Метод сообщает, принадлежит ли проверяемый заказ покупателю или нет по переданному коду.\n        <br><br>\n        Доступно, если хотя бы одно сборочное задание из заказа находится в статусе prepare - готов к выдаче.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 30 запросов | 2 сек | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.CheckIdentityRequest'\n        required: true\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.CheckedIdentity'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          description: Не найдено\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.Error'\n              examples:\n                OrderNotFound:\n                  $ref: '#/components/examples/OrderNotFound'\n        '409':\n          description: Введён неверный проверочный код\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.Error'\n              examples:\n                InvalidPasscode:\n                  $ref: '#/components/examples/InvalidPasscode'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/click-collect/orders/status/receive:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV3ClickCollectOrdersStatusReceive\n      x-readonly-method: false\n      x-category: marketplace\n      tags:\n        - Сборочные задания Самовывоз\n      summary: Сообщить, что заказы приняты покупателями\n      description: |\n        Метод переводит [сборочные задания](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders) из [статуса](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersStatusInfo) `prepare` — готово к выдаче — в статус `receive` — получено покупателем.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 сек | 1 запрос | 1 сек | 10 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersRequestV2'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.StatusSetResponses'\n        '400':\n          $ref: '#/components/responses/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDeniedBatch'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/click-collect/orders/status/reject:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV3ClickCollectOrdersStatusReject\n      x-readonly-method: false\n      x-category: marketplace\n      tags:\n        - Сборочные задания Самовывоз\n      summary: Сообщить об отказе от заказов\n      description: |\n        Метод переводит [сборочные задания](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders) из [статуса](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersStatusInfo) `prepare` — готово к выдаче — в статус `reject` — отказ при получении.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 сек | 1 запрос | 1 сек | 10 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersRequestV2'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.StatusSetResponses'\n        '400':\n          $ref: '#/components/responses/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDeniedBatch'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/click-collect/orders/status/info:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV3ClickCollectOrdersStatusInfo\n      x-readonly-method: true\n      x-category: marketplace\n      tags:\n        - Сборочные задания Самовывоз\n      summary: Получить статусы сборочных заданий\n      description: \"Метод возвращает статусы [сборочных заданий](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders) по их ID.\\n<br><br>\\n`supplierStatus` — статус сборочного задания. Триггер его изменения - действие самого продавца.\\n\\nВозможные значения `supplierStatus`:\\n| Статус   | Описание            | Как перевести сборочное задание в данный статус |\\n| -------  | ---------           | --------------------------------------|\\n| `new`      | **Новое сборочное задание** |\\n| `confirm`  | **На сборке**  | \\t[Перевести сборочное задание на сборку](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersStatusConfirm)\\n| `prepare`  | **Готов к выдаче** | \\t[Сообщить, что сборочное задание готово к выдаче](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersStatusPrepare)\\n| `receive`  | **Получено покупателем**   | [Сообщить, что заказ принят покупателем](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersStatusReceive)\\n| `reject`  | **Отказ покупателя при получении**    |  \\t[Сообщить, что покупатель отказался от заказа](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersStatusReject)\\n| `cancel`   | **Отменено продавцом**    |  \\t[Отменить сборочное задание](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersStatusCancel)\\n| `cancel_shelf_life` | **Отмена по истечении срока хранения**    |  \\tПереводится автоматически по возникновению события\\n\\n<br><br>\\n`wbStatus` — статус системы Wildberries.\\n\\nВозможные значения `wbStatus`:\\n- `waiting` - сборочное задание в работе\\n- `sold` - заказ получен покупателем\\n- `canceled` - отмена сборочного задания\\n- `canceled_by_client` - покупатель отменил заказ при получении\\n- `declined_by_client` - покупатель отменил заказ в первый чаc\\n<br> Отмена доступна покупателю в первый час с момента заказа, если заказ не переведён на сборку\\n- `defect` - отмена заказа по причине брака\\n- `ready_for_pickup` - заказ готов к выдаче\\n\\n<div class=\\\"description_limit\\\">\\n<a href=\\\"/openapi/api-information#tag/introduction/Limity-zaprosov\\\">Лимит запросов</a> на один аккаунт продавца:\\n\\n| Период | Лимит | Интервал | Всплеск |\\n| --- | --- | --- | --- |\\n| 1 сек | 1 запрос | 1 сек | 10 запросов |\\n\\nОдин запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\\n\\n<hr>\\n\\nВ <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\\n\\n</div>\\n\"\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersRequestV2'\n        required: true\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.OrderStatusesV2'\n        '400':\n          $ref: '#/components/responses/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDeniedBatch'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/click-collect/orders/status/cancel:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV3ClickCollectOrdersStatusCancel\n      x-readonly-method: false\n      x-category: marketplace\n      tags:\n        - Сборочные задания Самовывоз\n      summary: Отменить сборочные задания\n      description: |\n        Переводит [сборочные задания](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders) из [статусов](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersStatusInfo) `new`, `confirm`, `prepare` в статус `cancel` — отменено продавцом.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 сек | 1 запрос | 1 сек | 10 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersRequestV2'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.StatusSetResponses'\n        '400':\n          $ref: '#/components/responses/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDeniedBatch'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/click-collect/orders/meta/details:\n    post:\n      operationId: postV3ClickCollectOrdersMetaDetails\n      x-readonly-method: true\n      x-category: marketplace\n      tags:\n        - Идентификаторы маркировки Самовывоз\n      summary: Получить идентификаторы маркировки сборочных заданий\n      description: |\n        Метод возвращает идентификаторы маркировки [сборочных заданий ](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders) и статусы их проверки.<br><br>\n\n        Перечень идентификаторов маркировки, доступных для сборочного задания, можно получить в [списке новых сборочных заданий](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/getV3ClickCollectOrdersNew), поле `requiredMeta`. Если поле `requiredMeta` не содержит какой-либо идентификатор маркировки, значит, у сборочного задания не может быть этого идентификатора — и добавить его нельзя.<br>\n        Возможные идентификаторы маркировки:\n          - `imei` — [IMEI](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaImei)\n          - `uin` — [УИН](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaUin)\n          - `gtin` — [GTIN](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaGtin)\n          - `sgtin` — [код маркировки](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaSgtin)\n          - `customsDeclaration` — [номер ДТ](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaCustomsDeclaration)\n          - `originCountryCode` — [числовой код страны происхождения товара](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaCustomsDeclaration) из [Общероссийского классификатора стран мира](https://esnsi.gosuslugi.ru/classifiers/16269)\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>получения и удаления идентификаторов маркировки Самовывоз</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 150 запросов | 400 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersRequestV2'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.OrdersMetaDetailsResponse'\n        '400':\n          $ref: '#/components/responses/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          $ref: '#/components/responses/AccessDeniedBatch'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/click-collect/orders/meta/delete:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV3ClickCollectOrdersMetaDelete\n      x-readonly-method: false\n      x-category: marketplace\n      tags:\n        - Идентификаторы маркировки Самовывоз\n      summary: Удалить идентификаторы маркировки сборочных заданий\n      description: |\n        Метод удаляет значения указанных [идентификаторов маркировки сборочных заданий](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaDetails).\n        <br><br>\n        В одном запросе можно удалить идентификаторы маркировки только одного типа. Укажите тип идентификаторов маркировки в запросе:\n          - `imei` — [IMEI](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaImei)\n          - `uin` — [УИН](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaUin)\n          - `gtin` — [GTIN](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaGtin)\n          - `sgtin` — [код маркировки](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaSgtin)\n          - `customsDeclaration` — [номер ДТ](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaCustomsDeclaration). При удалении номера ДТ также удаляется код страны происхождения товара — `originCountryCode`\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>получения и удаления идентификаторов маркировки Самовывоз</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 150 запросов | 400 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersMetaDeleteRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.OrdersResponses'\n        '400':\n          $ref: '#/components/responses/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/click-collect/orders/meta/sgtin:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV3ClickCollectOrdersMetaSgtin\n      x-readonly-method: false\n      x-category: marketplace\n      tags:\n        - Идентификаторы маркировки Самовывоз\n      summary: Закрепить коды маркировки Честного знака за сборочными заданиями\n      description: |\n        Метод обновляет код маркировки [Честного знака](https://честныйзнак.рф/) в [идентификаторах маркировки сборочных заданий](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaDetails).<br>\n        Закрепить код маркировки можно только за сборочным заданием в [статусе](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersStatusInfo) `confirm` и если в [идентификаторах маркировки сборочного задания](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaDetails) есть поле `sgtin`.\n        <br><br>\n        Получить загруженные маркировки можно в [идентификаторах маркировки сборочного задания](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaDetails).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>закрепления идентификаторов маркировки Самовывоз</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 20 запросов | 3 сек | 500 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersSGTINsSetRequest'\n        required: true\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.MetaSetResponses'\n        '400':\n          $ref: '#/components/responses/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/click-collect/orders/meta/uin:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV3ClickCollectOrdersMetaUin\n      x-readonly-method: false\n      x-category: marketplace\n      tags:\n        - Идентификаторы маркировки Самовывоз\n      summary: Закрепить УИН за сборочными заданиями\n      description: |\n        Метод обновляет УИН, уникальные идентификационные номера, в [идентификаторах маркировки сборочных заданий](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaDetails). У одного сборочного задания может быть только один УИН. <br>\n        Закрепить УИН можно только за сборочным заданием в [статусе](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersStatusInfo) `confirm` и если в [идентификаторах маркировки сборочного задания](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaDetails) есть поле `uin`.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>закрепления идентификаторов маркировки Самовывоз</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 20 запросов | 3 сек | 500 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersUINSetRequest'\n        required: true\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.MetaSetResponses'\n        '400':\n          $ref: '#/components/responses/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/click-collect/orders/meta/imei:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV3ClickCollectOrdersMetaImei\n      x-readonly-method: false\n      x-category: marketplace\n      tags:\n        - Идентификаторы маркировки Самовывоз\n      summary: Закрепить IMEI за сборочными заданиями\n      description: |\n        Метод обновляет IMEI в [идентификаторах маркировки сборочных заданий](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaDetails). <br>\n        У одного сборочного задания может быть только один IMEI. Если у устройства два IMEI — **IMEI** и **IMEI2** или **IMEI1** и **IMEI2** — укажите только **IMEI** или **IMEI1**. **IMEI2** указывать не нужно.<br>\n        Закрепить IMEI можно только за сборочным заданием в [статусе](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersStatusInfo) `confirm` и если в [идентификаторах маркировки сборочного задания](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaDetails) есть поле `imei`.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>закрепления идентификаторов маркировки Самовывоз</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 20 запросов | 3 сек | 500 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersIMEISetRequest'\n        required: true\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.MetaSetResponses'\n        '400':\n          $ref: '#/components/responses/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/click-collect/orders/meta/gtin:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV3ClickCollectOrdersMetaGtin\n      x-readonly-method: false\n      x-category: marketplace\n      tags:\n        - Идентификаторы маркировки Самовывоз\n      summary: Закрепить GTIN за сборочными заданиями\n      description: |\n        Метод обновляет GTIN, уникальный ID товара в Беларуси, в [идентификаторах маркировки сборочных заданий](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaDetails). У одного сборочного задания может быть только один GTIN. <br>\n        Закрепить GTIN можно только за сборочным заданием в [статусе](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersStatusInfo) `confirm` и если в [идентификаторах маркировки сборочного задания](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaDetails) есть поле `gtin`.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>закрепления идентификаторов маркировки Самовывоз</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 20 запросов | 3 сек | 500 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersGTINSetRequest'\n        required: true\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.MetaSetResponses'\n        '400':\n          $ref: '#/components/responses/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/click-collect/orders/meta/customs-declaration:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    post:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Идентификаторы маркировки Самовывоз\n      summary: Закрепить номера ДТ за сборочными заданиями\n      operationId: postV3ClickCollectOrdersMetaCustomsDeclaration\n      description: |\n        Метод обновляет номера ДТ — деклараций на товары — и коды стран происхождения товаров в [идентификаторах маркировки сборочных заданий](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaDetails). У одного сборочного задания может быть только один номер ДТ. <br>\n        Закрепить номер ДТ можно, только если выполняются все условия:\n          - сборочное задание имеет признак B2B-продажи — `\"isB2b\":true` в ответе метода [получения новых сборочных заданий](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/getV3ClickCollectOrdersNew)\n          - сборочное задание находится в [статусах](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersStatusInfo) `confirm` или `prepare`\n          - поле `customsDeclaration` есть в [идентификаторах маркировки сборочного задания](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaDetails)\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>закрепления идентификаторов маркировки Самовывоз</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 20 запросов | 3 сек | 500 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - orders\n              properties:\n                orders:\n                  type: array\n                  maxItems: 1000\n                  items:\n                    type: object\n                    properties:\n                      customsDeclaration:\n                        type: string\n                        minLength: 17\n                        maxLength: 29\n                        description: Номер ДТ\n                        example: 10704010/010624/0000302\n                      orderId:\n                        type: integer\n                        description: ID сборочного задания\n                      originCountryCode:\n                        type: string\n                        description: |\n                          Числовой код страны происхождения товара из [Общероссийского классификатора стран мира](https://esnsi.gosuslugi.ru/classifiers/16269). Необходимо указывать только для сборочных заданий с признаком B2B-продажи \"isB2b\":true\n                        example: '643'\n                        maxLength: 3\n                    required:\n                      - customsDeclaration\n                      - orderId\n                      - originCountryCode\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.CustomsDeclarationSetResponse'\n              examples:\n                CustomsDeclarationResponse:\n                  $ref: '#/components/examples/CustomsDeclarationResponse'\n        '400':\n          $ref: '#/components/responses/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\ncomponents:\n  securitySchemes:\n    HeaderApiKey:\n      type: apiKey\n      name: Authorization\n      in: header\n  examples:\n    GetFinalPriceSuccess:\n      value:\n        requestId: f1787bd2d1fdc35d6f537316514y4a05\n        results:\n          - orderId: 1234567890\n            data:\n              originalPrice: 29000\n              convertedOriginalPrice: 29000\n              originalFinalPrice: 27000\n              convertedOriginalFinalPrice: 27000\n              currencyCode: 643\n              convertedCurrencyCode: 643\n            isError: false\n    NewOrderClick:\n      value:\n        orders:\n          - ddate: 29.10.2024\n            salePrice: 14000\n            requiredMeta:\n              - sgtin\n            article: wb1702fyjh\n            rid: 1234567673554519872.0.0\n            createdAt: '2024-10-29T10:19:30Z'\n            warehouseAddress: Москва, район Якиманка, Софийская набережная, 4 с1\n            orderCode: 23457822-6667\n            payMode: prepaid\n            skus:\n              - '2041546265353'\n            id: 1234567890\n            warehouseId: 1234567\n            nmId: 123456789\n            chrtId: 987654321\n            price: 14000\n            finalPrice: 14000\n            convertedPrice: 14000\n            convertedFinalPrice: 14000\n            currencyCode: 643\n            convertedCurrencyCode: 643\n            cargoType: 1\n            isZeroOrder: false\n            options:\n              isB2b: true\n    CustomsDeclarationResponse:\n      value:\n        requestId: 7849e1c4-d30e-4937-abe3-0e54e85874bd\n        results:\n          - orderId: 567891234\n            isError: false\n          - errors:\n              - detail: InvalidOriginCountryCode\n                code: 400\n            orderId: 987654321\n            isError: true\n          - errors:\n              - detail: OrderNotB2B\n                code: 422\n            orderId: 123456789\n            isError: true\n          - errors:\n              - detail: StatusMismatch\n                code: 409\n            orderId: 543216789\n            isError: true\n    IncorrectRequestBody:\n      value:\n        code: IncorrectRequestBody\n        message: Некорректное тело запроса\n    InvalidPasscode:\n      description: Введён неправильный проверочный код\n      value:\n        code: InvalidPasscode\n    OrderNotFound:\n      description: Заказ не найден\n      value:\n        code: NotFound\n    IncorrectParameter:\n      value:\n        code: IncorrectParameter\n        message: Передан некорректный параметр\n  schemas:\n    api.OrdersFinalPriceResponse:\n      type: object\n      required:\n        - requestId\n        - results\n      properties:\n        requestId:\n          type: string\n          description: Уникальный ID запроса\n        results:\n          type: array\n          description: Данные ответа\n          items:\n            $ref: '#/components/schemas/api.OrderFinalPriceResult'\n    api.OrderFinalPriceResult:\n      type: object\n      required:\n        - orderId\n      properties:\n        orderId:\n          description: ID сборочного задания\n          type: integer\n          nullable: false\n        data:\n          description: |\n            Данные сборочного задания.\n            <br><br>\n            Если `\"data\":{}`, данные формируются. Повторите запрос позднее. Максимальное время формирования данных около 3 минут.\n            <br><br>\n            Если `data` отсутствует, данных по сборочному заданию не предусмотрено. Используйте данные из ответов методов:\n              - [Получить список новых сборочных заданий](/docs/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/getV3ClickCollectOrdersNew)\n              - [Получить информацию о завершенных сборочных заданиях](/docs/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/getV3ClickCollectOrders)\n          type: object\n          nullable: false\n          properties:\n            originalPrice:\n              description: Цена продавца в валюте продажи без учёта скидок, умноженная на 100. Предоставляется в информационных целях\n              type: integer\n              nullable: false\n            convertedOriginalPrice:\n              description: Цена продавца в валюте страны продавца без учёта скидок, умноженная на 100. Предоставляется в информационных целях\n              type: integer\n              nullable: false\n            originalFinalPrice:\n              description: Сумма к оплате покупателем в валюте продажи с учетом всех скидок и кэшбека, умноженная на 100. Код валюты продажи указан в поле `currencyCode`. Предоставляется в информационных целях\n              type: integer\n              nullable: false\n            convertedOriginalFinalPrice:\n              description: Сумма к оплате покупателем в валюте страны продавца с учетом всех скидок и кэшбека, умноженная на 100. Предоставляется в информационных целях\n              type: integer\n              nullable: false\n            currencyCode:\n              type: integer\n              nullable: false\n              format: ISO 4217\n              description: Код валюты продажи\n            convertedCurrencyCode:\n              type: integer\n              nullable: false\n              format: ISO 4217\n              description: Код валюты страны продавца\n        errors:\n          description: Детали ошибки\n          nullable: false\n          type: array\n          items:\n            $ref: '#/components/schemas/api.BatchErrorFinalPriceResponse'\n        isError:\n          type: boolean\n          description: Есть ли ошибки\n          nullable: false\n    api.CheckedIdentity:\n      type: object\n      properties:\n        ok:\n          type: boolean\n          description: |\n            Принадлежит ли заказ покупателю:\n              - `true` — принадлежит\n              - `false` — значение не применяется. Если заказ не принадлежит покупателю, вы получите ответ со статус-кодом `409`\n    Error:\n      type: object\n      nullable: false\n      properties:\n        code:\n          type: string\n          description: Код ошибки\n          nullable: false\n        message:\n          type: string\n          description: Описание ошибки\n          nullable: false\n        data:\n          type: object\n          description: Дополнительные данные, обогащающие ошибку\n          nullable: true\n    api.CheckIdentityRequest:\n      type: object\n      properties:\n        orderCode:\n          type: string\n          description: Уникальный ID заказа покупателя\n        passcode:\n          type: string\n          description: Код подтверждения\n      example:\n        orderCode: 170046918-0011\n        passcode: '4567'\n    api.Error:\n      type: object\n      properties:\n        code:\n          type: string\n        data:\n          type: object\n        message:\n          type: string\n    api.NewOrder:\n      type: object\n      properties:\n        ddate:\n          type: string\n          description: Планируемая дата доставки\n        salePrice:\n          description: |\n            Цена продавца в валюте продажи с учётом скидки продавца, без учёта скидки WB Клуба, умноженная на 100. Предоставляется в информационных целях\n          type: integer\n          nullable: true\n          example: 504600\n        requiredMeta:\n          type: array\n          nullable: true\n          description: |\n            Список идентификаторов маркировки, доступных для сборочного задания\n          items:\n            type: string\n        article:\n          type: string\n          description: Артикул продавца\n        rid:\n          type: string\n          description: |\n            Уникальный ID заказа. <br>\n            Примечание: `rid` — это `srid` в ответах методов:\n              - [Заявки покупателей на возврат](./user-communication#tag/buyersReturns/operation/getV1Claims)\n              - [Лента заказов](./analytics#tag/orderFeed/operation/postV1OrderFeed)\n              - [Заказы](./reports#tag/mainReports/operation/getV1SupplierOrders)\n              - [Продажи](./reports#tag/mainReports/operation/getV1SupplierSales)\n              - [Отчет о возвратах и перемещении товаров](./reports#tag/returnsAndItemMovementReport)\n              - [Детализации к отчётам реализации по ID отчётов](./financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailedReportId)\n              - [Детализации к отчётам реализации за период](./financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailed)\n              - [Детализации к отчётам об издержках на приём платежей по ID отчётов](./financial-reports-and-accounting#tag/financialReports/operation/postV1AcquiringDetailedReportId)\n              - [Детализации к отчётам об издержках на приём платежей за период](./financial-reports-and-accounting#tag/financialReports/operation/postV1AcquiringDetailed)\n        createdAt:\n          type: string\n          description: Дата и время создания сборочного задания\n          format: date-time\n        warehouseAddress:\n          type: string\n          description: |\n            Адрес магазина (склада продавца), на который поступило сборочное\n            задание\n        orderCode:\n          type: string\n          description: |\n            Уникальный ID заказа покупателя\n        payMode:\n          description: |\n            Режим оплаты:\n              - `prepaid` — предоплатный\n              - `postpaid` — постоплатный\n              - `unknown` — неизвестный\n          type: string\n          example: prepaid\n        skus:\n          type: array\n          description: Массив баркодов товара\n          items:\n            type: string\n        id:\n          type: integer\n          description: ID сборочного задания\n        warehouseId:\n          type: integer\n          description: |\n            ID склада продавца, на который поступило сборочное\n            задание\n        nmId:\n          type: integer\n          description: Артикул WB\n        chrtId:\n          type: integer\n          description: ID размера товара в системе WB\n        price:\n          type: integer\n          description: |\n            Цена в валюте продажи с учетом всех скидок, кроме скидки по WB Кошельку, умноженная на 100.\n            Код валюты продажи указан в поле `currencyCode`. Предоставляется в информационных целях\n        finalPrice:\n          description: |\n            Сумма к оплате покупателем в валюте продажи с учётом всех скидок, умноженная на 100.\n            <br>\n            Код валюты продажи указан в поле `currencyCode`.\n            <br>\n            Предоставляется в информационных целях.\n            <br><br>\n            Используйте значение поля `finalPrice`, только если в ответе метода [POST /api/marketplace/v3/click-collect/orders/final-price](./docs/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersFinalPrice) вернулось `\"data\": null`. Во всех остальных случаях используйте значение поля `originalFinalPrice` из ответа указанного метода\n          type: integer\n          example: 5000\n        convertedPrice:\n          description: Цена в валюте страны продавца с учетом всех скидок, кроме скидки по WB Кошельку, умноженная на 100. Код валюты продажи указан в поле `currencyCode`. Предоставляется в информационных целях\n          type: integer\n          example: 5000\n        convertedFinalPrice:\n          description: |\n            Сумма к оплате покупателем в валюте страны продавца с учетом всех скидок, умноженная на 100.\n            <br>\n            Предоставляется в информационных целях.\n            <br><br>\n             Использ
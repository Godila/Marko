"openapi: 3.0.1\ninfo:\n  title: Заказы DBW\n  version: ordersdbw\n  description: |+\n    <div class=\"api-block\">\n\n    С помощью методов Заказы DBW (Доставка курьером WB) вы можете:\n      - получать информацию о [сборочных заданиях](/openapi/orders-dbw#tag/dbwAssemblyOrders), управлять статусами и отменять сборочные задания\n      - получать, добавлять, редактировать и удалять [метаданные](/openapi/orders-dbw#tag/dbwLabelIdentifiers) сборочных заданий\n\n    </div>\n\n\n    <div class=\"description_ref\">\n      Узнать, как использовать методы в бизнес-кейсах, можно в <a href=\"/knowledge-base/articles/019d49a4-036a-7721-98e8-bed5f1a4f72d/zakazy-dbw\">инструкции</a> по работе с <strong>заказами DBW</strong>\n    </div>\n\n  x-file-name: orders-dbw\nsecurity:\n  - HeaderApiKey: []\ntags:\n  - name: Сборочные задания DBW\n    x-displayName: Сборочные задания DBW\n    description: ''\n  - name: Идентификаторы маркировки DBW\n    x-displayName: Идентификаторы маркировки DBW\n    description: ''\npaths:\n  /api/v3/dbw/orders/new:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    get:\n      operationId: getV3DbwOrdersNew\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Сборочные задания DBW\n      summary: Получить список новых сборочных заданий\n      description: |\n        Метод возвращает список всех новых [сборочных заданий](/openapi/orders-dbw#tag/dbwAssemblyOrders), которые есть у продавца на момент запроса.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для следующих методов DBW:\n        <ul>\n            <li>получение и обновление списка контактов</li>\n            <li>получение и удаление идентификаторов маркировки</li>\n            <li>методы сборочных заданий</li>\n        </ul> \n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n        </div>\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                nullable: false\n                properties:\n                  orders:\n                    type: array\n                    nullable: false\n                    description: Список новых сборочных заданий\n                    items:\n                      $ref: '#/components/schemas/OrderNewDBW'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/dbw/orders:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    get:\n      operationId: getV3DbwOrders\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Сборочные задания DBW\n      summary: Получить информацию о завершенных сборочных заданиях\n      description: |\n        Метод возвращает информацию о завершенных [сборочных заданиях](/openapi/orders-dbw#tag/dbwAssemblyOrders).\n        <br><br>\n        Можно получить данные за заданный период, максимум 30 календарных дней одним запросом.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для следующих методов DBW:\n        <ul>\n            <li>получение и обновление списка контактов</li>\n            <li>получение и удаление идентификаторов маркировки</li>\n            <li>методы сборочных заданий</li>\n        </ul> \n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Limit'\n        - $ref: '#/components/parameters/Next'\n        - name: dateFrom\n          in: query\n          required: true\n          schema:\n            type: integer\n          description: |\n            Дата начала периода в формате Unix timestamp\n        - name: dateTo\n          in: query\n          required: true\n          schema:\n            type: integer\n          description: Дата конца периода в формате Unix timestamp\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                nullable: false\n                properties:\n                  next:\n                    $ref: '#/components/schemas/Next'\n                  orders:\n                    type: array\n                    nullable: false\n                    items:\n                      $ref: '#/components/schemas/Order'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/dbw/orders/delivery-date:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    post:\n      operationId: postV3DbwOrdersDeliveryDate\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      summary: Получить дату и время доставки\n      tags:\n        - Сборочные задания DBW\n      description: |\n        Метод возвращает информацию о выбранных покупателем дате и времени доставки сборочных заданий.\n        <br>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для следующих методов DBW:\n        <ul>\n            <li>получение и обновление списка контактов</li>\n            <li>получение и удаление идентификаторов маркировки</li>\n            <li>методы сборочных заданий</li>\n        </ul> \n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/DeliveryDatesRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/DeliveryDatesInfoResp'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest1'\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/dbw/orders/client:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    post:\n      operationId: postV3DbwOrdersClient\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      summary: Информация о покупателе\n      tags:\n        - Сборочные задания DBW\n      description: |\n        Метод возвращает информацию о покупателях по ID сборочных заданий.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для следующих методов DBW:\n        <ul>\n            <li>получение и обновление списка контактов</li>\n            <li>получение и удаление идентификаторов маркировки</li>\n            <li>методы сборочных заданий</li>\n        </ul> \n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/OrdersRequestAPI'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ClientInfoResp'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                allOf:\n                  - $ref: '#/components/schemas/Error'\n                  - $ref: '#/components/schemas/api.BatchError'\n              examples:\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest1'\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                UploadDataLimit:\n                  $ref: '#/components/examples/UploadDataLimit'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/dbw/orders/status:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    post:\n      operationId: postV3DbwOrdersStatus\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Сборочные задания DBW\n      summary: Получить статусы сборочных заданий\n      description: |\n        Метод возвращает статусы сборочных заданий по их ID.\n        <br><br>\n        `supplierStatus` — статус сборочного задания.\n        Триггер его изменения — действие самого продавца.\n\n        Возможные значения `supplierStatus`:\n        | Статус   | Описание            | Как перевести сборочное задание в данный статус |\n        | -------  | ---------           | --------------------------------------|\n        | `new`      | **Новое сборочное задание** | |\n        | `confirm`  | **На сборке**      |  [Перевести сборочное задание на сборку](/openapi/orders-dbw#tag/dbwAssemblyOrders/operation/patchV3DbwOrdersOrderIdConfirm)\n        | `complete` | **В доставке**  | [Перевести сборочное задание в доставку](/openapi/orders-dbw#tag/dbwAssemblyOrders/operation/postV3DbwOrdersStatusDeliver) |\n        | `receive`  | **Получено покупателем**|  Переводится курьером\n        | `reject`   | **Отказ покупателя при получении**| Переводится курьером\n        | `cancel`   | **Отменено продавцом**   |  [Отменить сборочное задание](/openapi/orders-dbw#tag/dbwAssemblyOrders/operation/patchV3DbwOrdersOrderIdCancel)\n        | `cancel_missed_call` | **Отмена по причине недозвона**<br> | Статус меняется автоматически |\n\n        <br><br>\n        `wbStatus` — статус системы Wildberries.\n\n        Возможные значения `wbStatus`:\n        - `waiting` — сборочное задание в работе\n        - `sold` — заказ получен покупателем\n        - `canceled` — отмена сборочного задания\n        - `canceled_by_client` — покупатель отменил заказ при получении\n        - `declined_by_client` — покупатель отменил заказ в первый чаc\n        <br>\n        Отмена доступна покупателю в первый час с момента заказа, если заказ не переведен на сборку\n        - `defect` — отмена заказа по причине брака\n        - `canceled_by_missed_call` — отмена заказа по причине недозвона\n        - `postponed_delivery` — курьерская доставка отложена\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для следующих методов DBW:\n        <ul>\n            <li>получение и обновление списка контактов</li>\n            <li>получение и удаление идентификаторов маркировки</li>\n            <li>методы сборочных заданий</li>\n        </ul> \n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - orders\n              properties:\n                orders:\n                  type: array\n                  minItems: 1\n                  maxItems: 1000\n                  description: Список ID сборочных заданий\n                  items:\n                    type: integer\n                    format: int64\n                    example: 5632423\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  orders:\n                    type: array\n                    nullable: false\n                    items:\n                      type: object\n                      properties:\n                        id:\n                          type: integer\n                          format: int64\n                          nullable: false\n                          description: ID сборочного задания\n                          example: 5632423\n                        supplierStatus:\n                          type: string\n                          nullable: false\n                          description: Статус сборочного задания, установленный продавцом\n                          example: new\n                        wbStatus:\n                          type: string\n                          nullable: false\n                          description: Статус сборочного задания в системе Wildberries\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/dbw/orders/{orderId}/confirm:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    patch:\n      operationId: patchV3DbwOrdersOrderIdConfirm\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Сборочные задания DBW\n      summary: Перевести на сборку\n      description: |\n        Метод переводит [сборочное задание](/openapi/orders-dbw#tag/dbwAssemblyOrders) в [статус](/openapi/orders-dbw#tag/dbwAssemblyOrders/operation/postV3DbwOrdersStatus) `confirm` — на сборке.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для следующих методов DBW:\n        <ul>\n            <li>получение и обновление списка контактов</li>\n            <li>получение и удаление идентификаторов маркировки</li>\n            <li>методы сборочных заданий</li>\n        </ul> \n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Order'\n      responses:\n        '204':\n          description: Подтверждено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '409':\n          description: Ошибка обновления статуса\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                StatusMismatch:\n                  $ref: '#/components/examples/StatusMismatch'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/dbw/orders/stickers:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    post:\n      operationId: postV3DbwOrdersStickers\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Сборочные задания DBW\n      summary: Получить стикеры сборочных заданий\n      description: |\n        Метод возвращает список стикеров для [сборочных заданий](/openapi/orders-dbw#tag/dbwAssemblyOrders/operation/getV3DbwOrdersNew) в [статусах](/openapi/orders-dbw#tag/dbwAssemblyOrders/operation/postV3DbwOrdersStatus):\n          - `confirm` — на сборке\n          - `complete` — в доставке\n\n        За один запрос можно получить максимум 100 стикеров.<br>\n\n        Доступные форматы стикеров:\n          - SVG\n          - ZPLV (вертикальный)\n          - ZPLH (горизонтальный)\n          - PNG\n\n        Доступны размеры:\n          - 580x400 px при `width=58&height=40` в запросе\n          - 400x300 px при `width=40&height=30` в запросе\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для следующих методов DBW:\n        <ul>\n            <li>получение и обновление списка контактов</li>\n            <li>получение и удаление идентификаторов маркировки</li>\n            <li>методы сборочных заданий</li>\n        </ul> \n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n        </div>\n      parameters:\n        - name: type\n          in: query\n          required: true\n          description: Тип стикера\n          schema:\n            type: string\n            enum:\n              - svg\n              - zplv\n              - zplh\n              - png\n        - name: width\n          in: query\n          required: true\n          description: Ширина стикера\n          schema:\n            type: integer\n            enum:\n              - 58\n              - 40\n        - name: height\n          in: query\n          required: true\n          description: Высота стикера\n          schema:\n            type: integer\n            enum:\n              - 40\n              - 30\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                orders:\n                  type: array\n                  minItems: 1\n                  maxItems: 100\n                  description: Список ID сборочных заданий\n                  items:\n                    type: integer\n                    format: int64\n                    example: 5346346\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  stickers:\n                    type: array\n                    nullable: false\n                    items:\n                      type: object\n                      properties:\n                        orderId:\n                          type: integer\n                          format: int64\n                          nullable: false\n                          description: ID сборочного задания\n                          example: 5346346\n                        partA:\n                          type: string\n                          nullable: false\n                          description: Первая часть ID стикера для печати подписи\n                          example: '231648'\n                        partB:\n                          type: string\n                          nullable: false\n                          description: Вторая часть ID стикера для печати подписи\n                          example: '97523'\n                        barcode:\n                          type: string\n                          nullable: false\n                          description: Закодированное значение стикера\n                          example: '!uKEtQZVx'\n                        file:\n                          type: string\n                          nullable: false\n                          description: Полное представление стикера в заданном формате (кодировка base64)\n                          example: \n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/dbw/orders/status/deliver:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    post:\n      operationId: postV3DbwOrdersStatusDeliver\n      x-readonly-method: false\n      x-category: marketplace\n      tags:\n        - Сборочные задания DBW\n      summary: Перевести сборочные задания в доставку\n      description: |\n        Метод переводит [сборочные задания](/openapi/orders-dbw#tag/dbwAssemblyOrders/operation/getV3DbwOrders) из [статуса](/openapi/orders-dbw#tag/dbwAssemblyOrders/operation/postV3DbwOrdersStatus) `confirm` в статус `complete` — в доставке.\n\n        <div class=\"description_important\">\n        Проверяйте ответ метода. Сборочные задания, переведённые в доставку, вернутся с признаком `\"isError\":false`. Для остальных сборочных заданий смотрите причину ошибки в массиве `errors`\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для следующих методов DBW:\n        <ul>\n            <li>получение и обновление списка контактов</li>\n            <li>получение и удаление идентификаторов маркировки</li>\n            <li>методы сборочных заданий</li>\n        </ul> \n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersRequestV2'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.StatusSetResponses'\n              example:\n                requestId: 03615778-eb9e-4f55-b4Of-fd3ac0fad2сc\n                results:\n                  - orderId: 42131238\n                    isError: true\n                    errors:\n                      - code: 409\n                        detail: MetaValidationFail\n                        metaDetails:\n                          - key: sgtin\n                            value: '1234567890123'\n                            decision: sgtinInvalidFormat\n                  - orderId: 4279781545\n                    isError: false\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/dbw/orders/courier:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    post:\n      operationId: postV3DbwOrdersCourier\n      x-readonly-method: true\n      x-category: marketplace\n      tags:\n        - Сборочные задания DBW\n      summary: Информация о курьере\n      description: |\n        Метод возвращает контактные данные и номер автомобиля курьера по ID сборочного задания. <br> Для сборочных заданий в статусах `confirm`, `complete`.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для следующих методов DBW:\n        <ul>\n            <li>получение и обновление списка контактов</li>\n            <li>получение и удаление идентификаторов маркировки</li>\n            <li>методы сборочных заданий</li>\n        </ul> \n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/OrdersRequestAPI'\n        required: true\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/OrderCourierInfoResp'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/dbw/orders/{orderId}/cancel:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    patch:\n      operationId: patchV3DbwOrdersOrderIdCancel\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Сборочные задания DBW\n      summary: Отменить сборочное задание\n      description: |\n        Метод отменяет [сборочное задание](/openapi/orders-dbw#tag/dbwAssemblyOrders) и переводит в [статус](/openapi/orders-dbw#tag/dbwAssemblyOrders/operation/postV3DbwOrdersStatus) `cancel` — отменено продавцом.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов DBW:\n        <ul>\n            <li>получение и обновление списка контактов</li>\n            <li>получение и удаление идентификаторов маркировки</li>\n            <li>управление сборочными заданиями</li>\n        </ul> \n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 300 запросов | 200 мс | 20 запросов |\n        | Сервисный | 1 мин | 300 запросов | 200 мс | 20 запросов |\n        | Базовый с секретом | 1 мин | 300 запросов | 200 мс | 20 запросов |\n        | Базовый | 1 ч | 10 запросов | 6 мин | 1 запрос |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Order'\n      responses:\n        '204':\n          description: Отменено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '409':\n          description: Ошибка обновления статуса\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                StatusMismatch:\n                  $ref: '#/components/examples/StatusMismatch'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/dbw/orders/meta/details:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    post:\n      operationId: postV3DbwOrdersMetaDetails\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Идентификаторы маркировки DBW\n      summary: Получить идентификаторы маркировки сборочных заданий\n      description: |\n        Метод возвращает идентификаторы маркировки [сборочных заданий](/openapi/orders-dbw#tag/dbwAssemblyOrders/operation/getV3DbwOrders) и статусы их проверки.\n        <br><br>\n        Перечень идентификаторов маркировки, доступных для сборочного задания, можно получить в [списке новых сборочных заданий](/openapi/orders-dbw#tag/dbwAssemblyOrders/operation/getV3DbwOrdersNew), поле `requiredMeta`. Если поле `requiredMeta` не содержит какой-либо идентификатор маркировки, значит, у сборочного задания не может быть этого идентификатора — и добавить его нельзя.<br>\n        Возможные идентификаторы маркировки:\n          - `imei` — [IMEI](/openapi/orders-dbw#tag/dbwLabelIdentifiers/operation/putV3DbwOrdersOrderIdMetaImei)\n          - `uin` — [УИН](/openapi/orders-dbw#tag/dbwLabelIdentifiers/operation/putV3DbwOrdersOrderIdMetaUin)\n          - `gtin` — [GTIN](/openapi/orders-dbw#tag/dbwLabelIdentifiers/operation/putV3DbwOrdersOrderIdMetaGtin)\n          - `sgtin` — [код маркировки Честного знака](/openapi/orders-dbw#tag/dbwLabelIdentifiers/operation/postV3DbwOrdersMetaSgtin)\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для следующих методов DBW:\n        <ul>\n            <li>получение и обновление списка контактов</li>\n            <li>получение и удаление идентификаторов маркировки</li>\n            <li>методы сборочных заданий</li>\n        </ul> \n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersRequestV2'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.OrdersMetaDetailsResponse'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.BatchError'\n              example:\n                detail: null\n                origin: dbs-public-api\n                requestId: f1787bd2d1fdс35d6f537316514у4a05\n                title: IncorrectRequest\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.BatchError'\n              example:\n                detail: null\n                origin: dbs-public-api\n                requestId: f1787bd2d1fdс35d6f537316514у4a05\n                title: AccessDenied\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/dbw/orders/meta/delete:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    post:\n      operationId: postV3DbwOrdersMetaDelete\n      x-readonly-method: false\n      x-category: marketplace\n      tags:\n        - Идентификаторы маркировки DBW\n      summary: Удалить идентификаторы маркировки сборочных заданий\n      description: |\n        Метод удаляет значение указанных [идентификаторов маркировки сборочного задания](/openapi/orders-dbw#tag/dbwLabelIdentifiers/operation/postV3DbwOrdersMetaDetails) для переданного ключа.\n        <br><br>\n        В одном запросе можно удалить идентификаторы маркировки только одного типа. Укажите тип идентификаторов маркировки в запросе:\n          - `imei` — [IMEI](/openapi/orders-dbw#tag/dbwLabelIdentifiers/operation/putV3DbwOrdersOrderIdMetaImei)\n          - `uin` — [УИН](/openapi/orders-dbw#tag/dbwLabelIdentifiers/operation/putV3DbwOrdersOrderIdMetaUin)\n          - `gtin` — [GTIN](/openapi/orders-dbw#tag/dbwLabelIdentifiers/operation/putV3DbwOrdersOrderIdMetaImei)\n          - `sgtin` — [код маркировки Честного знака](/openapi/orders-dbw#tag/dbwLabelIdentifiers/operation/postV3DbwOrdersMetaSgtin)\n\n        Можно передать только один ключ.\n\n          <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для следующих методов DBW:\n        <ul>\n            <li>получение и обновление списка контактов</li>\n            <li>получение и удаление идентификаторов маркировки</li>\n            <li>методы сборочных заданий</li>\n        </ul> \n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersMetaDleteRequestV2'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                allOf:\n                  - $ref: '#/components/schemas/api.MetaDeleteResponses'\n                  - example:\n                      requestId: 03615778-eb9e-4f55-b4Of-fd3ac0fad2сc\n                      results:\n                        - orderId: 42131238\n                          isError: true\n                          errors:\n                            - code: 409\n                              detail: FailedToUpdateMeta\n                        - orderId: 4279781545\n                          isError: false\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/dbw/orders/meta/sgtin:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    post:\n      operationId: postV3DbwOrdersMetaSgtin\n      x-readonly-method: false\n      x-category: marketplace\n      tags:\n        - Идентификаторы маркировки DBW\n      summary: Закрепить коды маркировки Честного знака за сборочными заданиями\n      description: |\n        Метод обновляет код маркировки [Честного знака](https://честныйзнак.рф/) в [идентификаторах маркировки сборочных заданий](/openapi/orders-dbw#tag/dbwLabelIdentifiers/operation/postV3DbwOrdersMetaDetails).<br>\n        Закрепить код маркировки можно только за сборочным заданием в [статусе](/openapi/orders-dbw#tag/dbwAssemblyOrders/operation/postV3DbwOrdersStatus) `confirm` и если в [идентификаторах маркировки сборочного задания](/openapi/orders-dbw#tag/dbwLabelIdentifiers/operation/postV3DbwOrdersMetaDetails) есть поле `sgtin`.\n        <br><br>\n        Получить загруженные маркировки можно в [идентификаторах маркировки сборочного задания](/openapi/orders-dbw#tag/dbwLabelIdentifiers/operation/postV3DbwOrdersMetaDetails).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для следующих методов DBW:\n        <ul>\n            <li>получение и обновление списка контактов</li>\n            <li>получение и удаление идентификаторов маркировки</li>\n            <li>методы сборочных заданий</li>\n        </ul> \n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersSGTINsSetRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.StatusSetResponses'\n              example:\n                requestId: 03615778-eb9e-4f55-b4Of-fd3ac0fad2сc\n                results:\n                  - orderId: 42131238\n                    isError: true\n                    errors:\n                      - code: 409\n                        detail: FailedToUpdateMeta\n                  - orderId: 4279781545\n                    isError: false\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/dbw/orders/{orderId}/meta/uin:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    put:\n      operationId: putV3DbwOrdersOrderIdMetaUin\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Идентификаторы маркировки DBW\n      summary: Закрепить УИН за сборочным заданием\n      description: |\n        Метод обновляет УИН, уникальный идентификационный номер, в [идентификаторах маркировки сборочного задания](/openapi/orders-dbw#tag/dbwLabelIdentifiers/operation/postV3DbwOrdersMetaDetails). У одного сборочного задания может быть только один УИН. <br>\n        Закрепить УИН можно только за сборочным заданием в [статусе](/openapi/orders-dbw#tag/dbwAssemblyOrders/operation/postV3DbwOrdersStatus) `confirm` и если в [идентификаторах маркировки сборочного задания](/openapi/orders-dbw#tag/dbwLabelIdentifiers/operation/postV3DbwOrdersMetaDetails) есть поле `uin`.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>закрепления идентификаторов маркировки DBW</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 1000 запросов | 60 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Order'\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                uin:\n                  type: string\n                  minLength: 16\n                  maxLength: 16\n                  description: УИН\n                  example: '1234567890123456'\n              required:\n                - uin\n      responses:\n        '204':\n          description: Обновлено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '409':\n          description: Ошибка добавления идентификаторов маркировки\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                FailedToUpdateMeta:\n                  $ref: '#/components/examples/FailedToUpdateMeta'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/dbw/orders/{orderId}/meta/imei:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    put:\n      operationId: putV3DbwOrdersOrderIdMetaImei\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Идентификаторы маркировки DBW\n      summary: Закрепить IMEI за сборочным заданием\n      description: |\n        Метод обновляет IMEI в [идентификаторах маркировки сборочного задания](/openapi/orders-dbw#tag/dbwLabelIdentifiers/operation/postV3DbwOrdersMetaDetails). <br>\n        У одного сборочного задания может быть только один IMEI. Если у устройства два IMEI — **IMEI** и **IMEI2** или **IMEI1** и **IMEI2** — укажите только **IMEI** или **IMEI1**. **IMEI2** указывать не нужно.<br>\n        Закрепить IMEI можно только за сборочным заданием в [статусе](/openapi/orders-dbw#tag/dbwAssemblyOrders/operation/postV3DbwOrdersStatus) `confirm` и если в [идентификаторах маркировки сборочного задания](/openapi/orders-dbw#tag/dbwLabelIdentifiers/operation/postV3DbwOrdersMetaDetails) есть поле `imei`.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>закрепления идентификаторов маркировки DBW</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 1000 запросов | 60 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Order'\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                imei:\n                  type: string\n                  minLength: 15\n                  maxLength: 15\n                  description: IMEI\n                  example: '123456789012345'\n              required:\n                - imei\n      responses:\n        '204':\n          description: Обновлено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '409':\n          description: Ошибка добавления идентификаторов маркировки\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                FailedToUpdateMeta:\n                  $ref: '#/components/examples/FailedToUpdateMeta'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/dbw/orders/{orderId}/meta/gtin:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    put:\n      operationId: putV3DbwOrdersOrderIdMetaGtin\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Идентификаторы маркировки DBW\n      summary: Закрепить GTIN за сборочным заданием\n      description: |\n        Метод обновляет GTIN, уникальный ID товара в Беларуси, в [идентификаторах маркировки сборочного задания](/openapi/orders-dbw#tag/dbwLabelIdentifiers/operation/postV3DbwOrdersMetaDetails). У одного сборочного задания может быть только один GTIN. <br>\n        Закрепить GTIN можно только за сборочным заданием в [статусе](/openapi/orders-dbw#tag/dbwAssemblyOrders/operation/postV3DbwOrdersStatus) `confirm` и если в [идентификаторах маркировки сборочного задания](/openapi/orders-dbw#tag/dbwLabelIdentifiers/operation/postV3DbwOrdersMetaDetails) есть поле `gtin`.\n        <br><br>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>закрепления идентификаторов маркировки DBW</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 1000 запросов | 60 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Order'\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                gtin:\n                  type: string\n                  minLength: 13\n                  maxLength: 13\n                  description: GTIN\n                  example: '1234567890123'\n              required:\n                - gtin\n      responses:\n        '204':\n          description: Обновлено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '409':\n          description: Ошибка добавления идентификаторов маркировки\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                FailedToUpdateMeta:\n                  $ref: '#/components/examples/FailedToUpdateMeta'\n        '429':\n          $ref: '#/components/responses/429'\ncomponents:\n  securitySchemes:\n    HeaderApiKey:\n      type: apiKey\n      name: Authorization\n      in: header\n  parameters:\n    Order:\n      name: orderId\n      in: path\n      required: true\n      description: ID сборочного задания\n      schema:\n        type: integer\n        format: int64\n        example: 5632423\n    Next:\n      name: next\n      in: query\n      required: true\n      schema:\n        type: integer\n        format: int64\n      description: Параметр пагинации. Устанавливает значение, с которого надо получить следующий пакет данных. Для получения полного списка данных должен быть равен `0` в первом запросе. Для следующих запросов необходимо брать значения из одноименного поля в ответе\n    Limit:\n      name: limit\n      in: query\n      required: true\n      schema:\n        type: integer\n        minimum: 1\n        maximum: 1000\n      description: Параметр пагинации. Устанавливает предельное количество возвращаемых данных\n  examples:\n    IncorrectRequestBody:\n      description: Некорректное тело запроса\n      value:\n        code: IncorrectRequestBody\n        message: ''\n    UploadDataLimit:\n      description: Превышено количество ID заказов в запросе\n      value:\n        origin: dbs-public-api\n        title: UploadDataLimit\n        detail: Upload limit exceeded\n        requestId: fd48ee9a-6ff6-446f-b238-5793a9189f1a\n    IncorrectRequest:\n      value:\n        code: IncorrectRequest\n        message: ''\n    IncorrectRequest1:\n      description: Некорректный запрос\n      value:\n        code: IncorrectRequest\n        message: ''\n    IncorrectParameter:\n      value:\n        code: IncorrectParameter\n        message: ''\n    FailedToUpdateMeta:\n      value:\n        code: FailedToUpdateMeta\n        message: ''\n    StatusMismatch:\n      value:\n        data: {}\n        code: StatusMismatch\n        message: ''\n  responses:\n    '401':\n      description: Не авторизован\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки\n              code:\n                type: string\n                description: Внутренний код ошибки\n              requestId:\n                type: string\n                description: Уникальный ID запроса\n              origin:\n                type: string\n                description: ID внутреннего сервиса WB\n              status:\n                type: number\n                description: HTTP статус-код\n              statusText:\n                type: string\n                description: Расшифровка HTTP статус-кода\n              timestamp:\n                type: string\n                format: date-time\n                description: Дата и время запроса\n          example:\n            title: unauthorized\n            detail: 'token problem; token is malformed: could not base64 decode signature: illegal base64 data at input byte 84'\n            code: 07e4668e--a53a3d31f8b0-[UK-oWaVDUqNrKG]; 03bce=277; 84bd353bf-75\n            requestId: 7b80742415072fe8b6b7f7761f1d1211\n            origin: s2s-api-auth-catalog\n            status: 401\n            statusText: Unauthorized\n            timestamp: '2024-09-30T06:52:38Z'\n    '402':\n      description: Требуется платёж\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки. Ошибка возвращается только сервисам из [Каталога решений для бизнеса](/business-solutions)\n          example:\n            title: payment required\n            detail: wb solution for business has insufficient funds on its balance. please top up the balance in the company's personal account https://dev.wildberries.ru/company\n    '429':\n      description: Слишком много запросов\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки\n              code:\n                type: string\n                description: Внутренний код ошибки\n              requestId:\n                type: string\n                description: Уникальный ID запроса\n              origin:\n                type: string\n                description: ID внутреннего сервиса WB\n              status:\n                type: number\n                description: HTTP статус-код\n              statusText:\n                type: string\n                description: Расшифровка HTTP статус-кода\n              timestamp:\n                type: string\n                format: date-time\n                description: Дата и время запроса\n          example:\n            title: too many requests\n            detail: limited by c122a060-a7fb-4bb4-abb0-32fd4e18d489\n            code: 07e4668e-ac2242c5c8c5-[UK-4dx7JUdskGZ]\n            requestId: 9d3c02cc698f8b041c661a7c28bed293\n            origin: s2s-api-auth-catalog\n            status: 429\n            statusText: Too Many Requests\n            timestamp: '2024-09-30T06:52:38Z'\n    NotFound:\n      description: Не найдено\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n          example:\n            code: NotFound\n            message: ''\n    AccessDenied:\n      description: Доступ запрещён\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n          example:\n            code: AccessDenied\n            message: ''\n  schemas:\n    api.OrdersSGTINsSetRequest:\n      type: object\n      required:\n        - orders\n      properties:\n        orders:\n          type: array\n          maxItems: 1000\n          items:\n            $ref: '#/components/schemas/api.SGTINs'\n    api.SGTINs:\n      type: object\n      required:\n        - orderId\n        - sgtins\n      properties:\n        orderId:\n          description: ID сборочного задания\n          type: integer\n          example: 123456\n        sgtins:\n          type: array\n          minItems: 1\n          maxItems: 24\n          description: Массив кодов маркировки. Допускается от 16 до 135 символов для кода одной маркировки\n          example:\n            - '123456789012345678'\n            - '1234567890123456'\n          items:\n            type: string\n    api.StatusSetResponses:\n      type: object\n      required:\n        - results\n      example:\n        requestId: 03615778-eb9e-4f55-b4Of-fd3ac0fad2сc\n        results:\n          - orderId: 4299281547\n            isError: true\n            errors:\n              - code: 404\n                detail: NotFound\n          - orderId: 4279781545\n            isError: false\n      properties:\n        requestId:\n          type: string\n          description: Уникальный ID запроса, содержащего ошибки.\n        results:\n          type: array\n          items:\n            $ref: '#/components/schemas/api.StatusSetResponse'\n    api.StatusSetResponse:\n      type: object\n      required:\n        - isError\n        - orderId\n      properties:\n        errors:\n          items:\n            $ref: '#/components/schemas/api.BatchErrorResponse'\n          type: array\n          description: Детали ошибки\n        isError:\n          type: boolean\n          description: Есть ли ошибки\n          example: true\n        orderId:\n          type: integer\n          description: ID сборочного задания с успешно обновлёнными данными\n          example: 123456\n    api.BatchErrorResponse:\n      required:\n        - code\n        - detail\n      properties:\n        code:\n          type: integer\n          description: |\n            Код ошибки:\n              - `404`\n              - `409`\n          example: 404\n        detail:\n          type: string\n          description: |\n            - `NotFound` — сборочное задание не найдено\n            - `StatusMismatch` — операция невозможна для этого статуса сборочного задания\n            - `ImeiIsNotFilled` — не заполнен IMEI\n            - `MetaValidationFail` — ошибки валидации идентификаторов маркировки\n          example: NotFound\n        metaDetails:\n          type: array\n          description: Детали ошибки валидации идентификаторов маркировки\n          items:\n            type: object\n            required:\n              - decision\n              - key\n            properties:\n              key:\n                type: string\n                description: Идентификатор маркировки\n                example: sgtin\n              value:\n                type: string\n                nullable: true\n                description: Значение идентификатора маркировки\n                example: '1234567890'\n              decision:\n                type: string\n                description: |\n                  Статус проверки:\n                  - `sgtin`\n                    - `sgtinInvalidFormat` — Неверный формат маркировки\n                    - `sgtinNotFound` — Маркировка не найдена в [Честном знаке](https://chestnyznak.ru)\n                    - `sgtinEmitted` —  Маркировка эмитирована\n                    - `sgtinApplied` — Не пройдена процедура Ввод в оборот\n                    - `sgtinWrittenOff` — Списан\n                    - `sgtinRetired` — Выбыл\n                    - `sgtinWithdrawn` — Выбыл\n                    - `sgtinDisaggregation` — Расформирован\n                    - `sgtinDisaggregated` — Расформирован\n                    - `sgtinAppliedNotPaid` — Не оплачен\n                    - `pending` — Маркировка на проверке\n                example: sgtinEmitted\n      type: object\n    api.MetaDeleteResponses:\n      type: object\n      required:\n        - results\n      properties:\n        requestId:\n          type: string\n          description: Уникальный ID запроса. Отображается для ответов с ошибками\n        results:\n          type: array\n          items:\n            type: object\n            required:\n              - isError\n              - orderId\n            properties:\n              errors:\n                items:\n                  type: object\n                  required:\n                    - code\n                    - detail\n                  properties:\n                    code:\n                      type: integer\n                      description: |\n                        Код ошибки:\n                          - `404`\n                          - `409`\n                    detail:\n                      type: string\n                      description: |\n                        - `NotFound` — сборочное задание не найдено\n                        - `StatusMismatch` — операция невозможна для этого статуса сборочного задания\n                        - `ImeiIsNotFilled` — не заполнен IMEI\n                type: array\n                description: Детали ошибки\n              isError:\n                type: boolean\n                description: Есть ли ошибки\n              orderId:\n                type: integer\n                description: ID сборочного задания с успешно обновлёнными данными\n    api.OrdersRequestV2:\n      type: object\n      required:\n        - ordersIds\n      properties:\n        ordersIds:\n          type: array\n          maxItems: 1000\n          example:\n            - 1234678898\n          items:\n            type: integer\n          description: Список ID сборочных заданий\n    api.OrdersMetaDleteRequestV2:\n      type: object\n      required:\n        - key\n        - ordersIds\n      properties:\n        key:\n          type: string\n          enum:\n            - imei\n            - uin\n            - gtin\n            - sgtin\n          description: Название идентификатора маркировки для удаления. Передаётся только одно значение\n          example: sgtin\n        ordersIds:\n          type: array\n          maxItems: 1000\n          items:\n            type: integer\n          description: Список ID сборочных заданий\n          example:\n            - 123456789\n    ClientInfo:\n      properties:\n        replacementPhone:\n          type: string\n          description: |\n            Подменный номер для связи с покупателем. <br>\n            Пустое значение `\"\"` указывает, что номер ещё не назначен\n          example: '79871234567'\n          nullable: false\n        phone:\n          type: string\n          description: |\n            Номер телефона для связи с покупателем:\n              - если в поле `phoneCode` не указан добавочный код, вы можете позвонить покупателю по указанному номеру. Дополнительные номера телефонов для связи без кодов указаны в поле `additionalPhones`\n              - если в поле `phoneCode` указан добавочный код, используйте его, чтобы связаться с покупателем по указанному номеру и добавочному коду\n          example: '+79871234567'\n          nullable: false\n        firstName:\n          type: string\n          description: Имя покупателя\n          example: Иван\n          nullable: false\n        fullName:\n          type: string\n          description: Полное имя покупателя, используется для оформления документов\n          example: Иванов Иван Иванович\n          nullable: false\n        additionalPhones:\n          nullable: false\n          type: array\n          items:\n            type: string\n          description: |\n            Дополнительные номера телефонов для связи с покупателем. <br>\n            Используйте, чтобы позвонить покупателю, если недоступен основной номер из `phone`. <br>\n            Пустое значение означает, что номер не указан\n          example:\n            - '1234554321'\n        additionalPhoneCodes:\n          nullable: false\n          type: array\n          items:\n            type: integer\n          description: |\n            Дополнительные добавочные коды. <br>\n            Используйте, если не получилось дозвониться по добавочному коду из `phoneCode`.<br>\n            Пустое значение указывает, коды ещё не назначены\n          example:\n            - 12345\n        orderId:\n          type: integer\n          description: ID сборочного задания\n          example: 1345678910\n        phoneCode:\n          type: integer\n          description: |\n            Добавочный код. <br>\n            Используйте, чтобы связаться с покупателем по номеру из `phone`.<br>\n            Если код не указан, вы можете связаться с покупателем без кода\n          example: 0\n          nullable: false\n      type: object\n    ClientInfoResp:\n      properties:\n        orders:\n          description: Информация о покупателях\n          items:\n            $ref: '#/components/schemas/ClientInfo'\n          type: array\n      type: object\n    OrderCourierInfo:\n      type: object\n      properties:\n        courierInfo:\n          type: object\n          description: Информация о курьере\n          allOf:\n            - $ref: '#/components/schemas/CourierInfo'\n        orderID:\n          type: integer\n          description: ID сборочного задания\n          example: 2876979713\n    OrderCourierInfoResp:\n      type: object\n      properties:\n        orders:\n          type: array\n          items:\n            $ref: '#/components/schemas/OrderCourierInfo'\n    CourierContactsResponse:\n      type: object\n      properties:\n        carNumber:\n          type: string\n          description: Номер автомобиля\n          example: х111хх11\n        fullName:\n          type: string\n          description: ФИО курьера\n          example: Иванов Иван Иванович\n        phone:\n          type: string\n          description: Номер телефона\n          example: '71230971931'\n        pTimeFrom:\n          type: string\n          format: date-time\n          description: Дата и время, с которого прибудет курьер\n          nullable: true\n          example: '2025-09-06T08:00:00Z'\n        pTimeTo:\n          type: string\n          format: date-time\n          description: Дата и время, до которого прибудет курьер\n          nullable: true\n          example: '2025-09-06T11:00:00Z'\n    CourierInfo:\n      type: object\n      properties:\n        contacts:\n          type: object\n          nullable: true\n          description: Контактные данные курьера\n          allOf:\n            - $ref: '#/components/schemas/CourierContactsResponse'\n        mustBeAssigned:\n          type: boolean\n          description: |\n            Должен ли быть назначен курьер к текущему моменту:\n              - `false` — нет\n              - `true` — да\n\n              Если `\"mustBeAssigned\":true`, а `\"contacts\":null`, необходимо запросить контакты в [поддержке](https://seller.wildberries.ru/service-desk-v2)\n        updatedAt:\n          type: string\n          format: date-time\n          description: Дата и время обновления информации о курьере. <br> Если `null`, информация не обновлялась\n          nullable: true\n          example: '2025-09-06T11:33:10+03:00'\n    api.OrdersMetaDetailsResponse:\n      type: object\n      required:\n        - requestId\n      properties:\n        requestId:\n          type: string\n          description: Уникальный ID запроса\n          example: f1787bd2d1fdс35d6f537316514у4a05\n        orders:\n          type: array\n          description: Идентификаторы маркировки сборочных заданий и статусы их валидации\n          items:\n            type: object\n            required:\n              - isError\n            properties:\n              orderId:\n                type: integer\n                example: 123456\n                description: ID сборочного задания\n              isError:\n                type: boolean\n                description: Есть ли ошибки\n                example: false\n              errors:\n                type: array\n                example: []\n                description: Информация об ошибке\n                items:\n                  type: object\n                  properties:\n                    code:\n                      type: integer\n                      description: Код ошибки\n                      example: 404\n                    detail:\n                      type: string\n                      example: NotFound\n                      description: Дополнительная информация об ошибке\n              metaDetails:\n                type: array\n                description: Идентификаторы маркировки и статусы их валидации\n                items:\n                  type: object\n                  properties:\n                    key:\n                      type: string\n                      example: sgtin\n                      description: Идентификатор маркировки\n                    value:\n                      type: string\n                      nullable: true\n                      description: Значение идентификатора маркировки\n                      example: '123456789012345'\n                    decision:\n                      type: string\n                      example: sgtinIntroduced\n                      description: |\n                        Статус проверки:\n                        - `imei`\n                          - `pending` — Маркировка на проверке\n                          - `optional` — Маркировка не обязательна\n                          - `filled` — Валидация пройдена\n                          - `deadlineExceeded` — Валидация пройдена\n                          - `imeiMaySell` — Товар допущен к продаже. Валидация пройдена\n                          - `imeiSoldB2B` — Товар продан покупателю B2B, допущен к продаже повторно. Валидация пройдена\n                          - `required` — Обязательная маркировка не заполнена. Валидация не пройдена\n                          - `imeiInvalidFormat` — Неверный формат маркировки. Валидация не пройдена\n                          - `imeiAlreadySold` — Товар с этим IMEI уже продан. Валидация не пройдена\n                        - `uin`\n                          - `optional` — Маркировка не обязательна\n                          - `filled` — Валидация пройдена\n                        - `sgtin`\n                          - `pending` — Маркировка на проверке\n                          - `optional` — Маркировка не обязательна\n                          - `filled` — Валидация пройдена\n                          - `deadlineExceeded` — Валидация пройдена\n                          - `sgtinIntroduced` — Товар допущен к продаже. Валидация пройдена\n                          - `sgtinSoldB2B` — Товар продан покупателю B2B, допущен к продаже повторно. Валидация пройдена\n                          - `required` — Обязательная маркировка не заполнена. Валидация не пройдена\n                          - `sgtinInvalidFormat` — Неверный формат маркировки. Валидация не пройдена\n                          - `sgtinNotFound` — Маркировка не найдена в [Честном Знаке](https://chestnyznak.ru). Валидация не пройдена\n                          - `sgtinEmitted` —  Маркировка эмитирована. Валидация не пройдена\n                          - `sgtinApplied` — Не пройдена процедура Ввод в оборот. Валидация не пройдена\n                          - `sgtinWrittenOff` — Списан. Валидация не пройдена\n                          - `sgtinRetired` — Выбыл. Валидация не пройдена\n                          - `sgtinWithdrawn` — Выбыл. Валидация не пройдена\n                          - `sgtinDisaggregation` — Расформирован. Валидация не пройдена\n                          - `sgtinDisaggregated` — Расформирован. Валидация не пройдена\n                          - `sgtinAppliedNotPaid` — Не оплачен. Валидация не пройдена\n                        - `gtin`\n                          - `optional` — Маркировка не обязательна\n                          - `filled` — Валидация пройдена\n                        - `customsDeclaration`\n                          - `optional` — Маркировка не обязательна\n                          - `filled` — Валидация пройдена\n    api.BatchError:\n      properties:\n        detail:\n          type: string\n          description: Детали ошибки\n          nullable: true\n          example: null\n        origin:\n          type: string\n          description: ID внутреннего сервиса WB\n          example: dbs-public-api\n        requestId:\n          type: string\n          description: Уникальный ID запроса\n          example: f1787bd2d1fdс35d6f537316514у4a05\n        title:\n          type: string\n          description: Заголовок ошибки\n          example: IncorrectRequest\n      type: object\n    Error:\n      type: object\n      nullable: false\n      properties:\n        code:\n          type: string\n          description: Код ошибки\n          nullable: false\n        message:\n          type: string\n          description: Описание ошибки\n          nullable: false\n        data:\n          type: object\n          description: Дополнительные данные ошибки\n          nullable: true\n    OrdersRequestAPI:\n      properties:\n        orders:\n          description: Список ID сборочных заданий\n          maxItems: 1000\n          items:\n            type: integer\n          type: array\n      type: object\n      example:\n        orders:\n          - 987654321\n          - 123456789\n    DeliveryDatesRequest:\n      properties:\n        orders:\n          description: Список ID сборочных заданий\n          items:\n            type: integer\n            minItems: 1\n            maxItems: 1000\n          type: array\n      type: object\n      example:\n        orders:\n          - 1234567890\n    Next:\n      type: integer\n      format: int64\n      nullable: false\n      description: Параметр пагинации. Содержит значение, которое необходимо указать в запросе для получения следующего пакета данных\n      example: 13833711\n    OrderNewDBW:\n      type: object\n      properties:\n        address:\n          type: object\n          nullable: true\n          description: Адрес покупателя для доставки\n          properties:\n            fullAddress:\n              description: Адрес доставки\n              type: string\n              example: Челябинская область, г. Челябинск, 51-я улица Арабкира, д. 10А, кв. 42\n            longitude:\n              type: number\n              format: float64\n              nullable: false\n              description: Долгота\n              example: 44.519068\n            latitude:\n              type: number\n              format: float64\n              nullable: false\n              description: Широта\n              example: 40.20192\n        salePrice:\n          description: |\n            Цена в валюте продажи с учетом скидки продавца, без учета скидки WB Клуба, умноженная на 100. Предоставляется в информационных целях\n          type: integer\n          nullable: true\n          example: 504658\n        requiredMeta:\n          description: Список идентификаторов маркировки, доступных для сборочного задания. [Указывать IMEI](./orders-dbw#tag/dbwLabelIdentifiers/operation/putV3DbwOrdersOrderIdMetaImei) обязательно для [предмета](./work-with-products#tag/categoriesSubcategoriesAndCharacteristics/paths/~1content~1v2~1object~1all/get) `Смартфоны`, `\"subjectId\":515`\n          type: array\n          nullable: true\n          items:\n            type: string\n          example:\n            - uin\n        comment:\n          type: string\n          nullable: false\n          description: Комментарий покупателя\n          maxLength: 300\n          example: Упакуйте в пленку, пожалуйста\n        options:\n          type: object\n          description: Опции заказа\n          properties:\n            isB2b:\n              type: boolean\n              description: |\n                Признак B2B-продажи:\n                  - `false` — не B2B-продажа\n                  - `true` — B2B-продажа\n        orderUid:\n          type: string\n          description: ID транзакции для группировки сборочных заданий. Сборочные задания в одной корзине покупателя будут иметь одинаковый `orderUid`\n          example: 165918930_629fbc924b984618a44354475ca58675\n        groupId:\n          description: ID группы сборочных заданий. <br> Объединяет сборочные задания, поступившие на один склад (`warehouseId`) в рамках одной транзакции покупателя (`orderUid`)\n          type: string\n          format: UUID\n          example: 7a2c8810-1db2-4011-9682-5c7fa33afd83\n        article:\n          type: string\n          nullable: false\n          description: Артикул продавца\n          example: one-ring-7548\n        colorCode:\n          description: Код цвета (только для колеруемых товаров)\n          type: string\n          nullable: false\n          example: RAL 3017\n        rid:\n          type: string\n          nullable: false\n          description: |\n            Уникальный ID заказа. <br>\n            Примечание: `rid` — это `srid` в ответах методов:\n              - [Заявки покупателей на возврат](./user-communication#tag/buyersReturns/operation/getV1Claims)\n              - [Лента заказов](./analytics#tag/orderFeed/operation/postV1OrderFeed)\n              - [Заказы](./reports#tag/mainReports/operation/getV1SupplierOrders)\n              - [Продажи](./reports#tag/mainReports/operation/getV1SupplierSales)\n              - [Отчёт о возвратах и перемещении товаров](./reports#tag/returnsAndItemMovementReport)\n              - [Детализации к отчётам реализации по ID отчётов](./financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailedReportId)\n              - [Детализации к отчётам реализации за период](./financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailed)\n              - [Детализации к отчётам об издержках на приём платежей по ID отчётов](./financial-reports-and-accounting#tag/financialReports/operation/postV1AcquiringDetailedReportId)\n              - [Детализации к отчётам об издержках на приём платежей за период](./financial-reports-and-accounting#tag/financialReports/operation/postV1AcquiringDetailed)\n          example: f884001e44e511edb8780242ac120002\n        createdAt:\n          type: string\n          format: date-time\n          nullable: false\n          description: Дата создания сборочного задания\n          example: '2022-05-04T07:56:29Z'\n        skus:\n          type: array\n          nullable: false\n          description: Массив баркодов товара\n          items:\n            type: string\n            example: '6665956397512'\n        id:\n          type: integer\n          format: int64\n          nullable: false\n          description: ID сборочного задания\n          example: 13833711\n        warehouseId:\n          type: integer\n          nullable: false\n          description: ID склада продавца, на который поступило сборочное задание\n          example: 658434\n        nmId:\n          type: integer\n          nullable: false\n          description: Артикул WB\n          example: 123456789\n        chrtId:\n          type: integer\n          nullable: false\n          description: ID размера товара в системе WB\n          example: 987654321\n        price:\n          type: integer\n          nullable: false\n          description: Цена в валюте продажи с учетом всех скидок, кроме скидки по WB Кошельку, умноженная на 100. Код валюты продажи указан в поле `currencyCode`. Предоставляется в информационных целях\n          example: 1014\n        convertedPrice:\n          type: integer\n          nullable: false\n          description: Цена в валюте страны продавца с учетом всех скидок, кроме скидки по WB Кошельку, умноженная на 100. Предоставляется в информационных целях\n          example: 1014\n        currencyCode:\n          type: integer\n          nullable: false\n          format: ISO 4217\n          description: Код валюты продажи\n          example: 933\n        convertedCurrencyCode:\n          type: integer\n          nullable: false\n          format: ISO 4217\n          description: Код валюты страны продавца\n          example: 643\n        cargoType:\n          type: integer\n          nullable: false\n          description: |\n            Тип товара:\n              - `1` — малогабаритный товар (МГТ)\n              - `2` — сверхгабаритный товар (СГТ)\n              - `3` — крупногабаритный товар (КГТ+)\n          enum:\n            - 1\n            - 2\n            - 3\n        isZeroOrder:\n          type: boolean\n          description: |\n            Признак заказа товара с нулевым остатком:\n              - `false` — заказ сделан на товар с ненулевым остатком\n              - `true` — заказ сделан на товар с нулевым остатком. Такой заказ можно отменить без штрафа за отмену\n          example: false\n    Order:\n      type: object\n      properties:\n        address:\n          type: object\n          nullable: true\n          description: Адрес покупателя для доставки\n          properties:\n            fullAddress:\n              description: Адрес доставки\n              type: string\n              example: Челябинская область, г. Челябинск, 51-я улица Арабкира, д. 10А, кв. 42\n            longitude:\n              type: number\n              format: float64\n              nullable: false\n              description: Долгота\n              example: 44.519068\n            latitude:\n              type: number\n              format: float64\n              nullable: false\n              description: Широта\n              example: 40.20192\n        options:\n          type: object\n          description: Опции заказа\n          properties:\n            isB2b:\n              type: boolean\n              description: |\n                Признак B2B-продажи:\n                  - `false` — не B2B-продажа\n                  - `true` — B2B-продажа\n        orderUid:\n          type: string\n          description: ID транзакции для группировки сборочных заданий. Сборочные задания в одной корзине покупателя будут иметь одинаковый `orderUid`\n          example: 165918930_629fbc924b984618a44354475ca58675\n        groupId:\n          description: ID группы сборочных заданий. <br> Объединяет сборочные задания, поступившие на один склад (`warehouseId`) в рамках одной транзакции покупателя (`orderUid`)\n          type: string\n          format: UUID\n          example: 7a2c8810-1db2-4011-9682-5c7fa33afd83\n        article:\n          type: string\n          nullable: false\n          description: Артикул продавца\n          example: one-ring-7548\n        colorCode:\n          type: string\n          nullable: false\n          description: Код цвета (только для колеруемых товаров)\n          example: RAL 3017\n        rid:\n          type: string\n          nullable: false\n          description: |\n            Уникальный ID заказа. <br>\n            Примечание: `rid` — это `srid` в ответах методов:\n              - [Заявки покупателей на возврат](./user-communication#tag/buyersReturns/operation/getV1Claims)\n              - [Лента заказов](./analytics#tag/orderFeed/operation/postV1OrderFeed)\n              - [Заказы](./reports#tag/mainReports/operation/getV1SupplierOrders)\n              - [Продажи](./reports#tag/mainReports/operation/getV1SupplierSales)\n              - [Отчёт о возвратах и перемещении товаров](./reports#tag/returnsAndItemMovementReport)\n              - [Детализации к отчётам реализации по ID отчётов](./financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailedReportId)\n              - [Детализации к отчётам реализации за период](./financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailed)\n              - [Детализации к отчётам об издержках на приём платежей по ID отчётов](./financial-reports-and-accounting#tag/financialReports/operation/postV1AcquiringDetailedReportId)\n              - [Детализации к отчётам об издержках на приём платежей за период](./financial-reports-and-accounting#tag/financialReports/operation/postV1AcquiringDetailed)\n          example: f884001e44e511edb8780242ac120002\n        createdAt:\n          type: string\n          format: date-time\n          nullable: false\n          description: Дата создания сборочного задания\n          example: '2022-05-04T07:56:29Z'\n        skus:\n          type: array\n          nullable: false\n          description: Массив баркодов товара\n          items:\n            type: string\n            example: '6665956397512'\n        id:\n          type: integer\n          format: int64\n          nullable: false\n          description: ID сборочного задания\n          example: 13833711\n        warehouseId:\n          type: integer\n          nullable: false\n          description: ID склада продавца, на который поступило сборочное задание\n          example: 658434\n        nmId:\n          type: integer\n          nullable: false\n          description: Артикул WB\n          example: 123456789\n        chrtId:\n          type: integer\n          nullable: false\n          description: ID размера товара в системе WB\n          example: 987654321\n        price:\n          type: integer\n          nullable: false\n          description: Цена в валюте продажи с учетом всех скидок, кроме скидки по WB Кошельку, умноженная на 100. Код валюты продажи указан в поле `currencyCode`. Предоставляется в информационных целях\n          example: 1014\n        convertedPrice:\n          type: integer\n          nullable: false\n          description: Цена в валюте страны продавца с учетом всех скидок, кроме скидки по WB Кошельку, умноженная на 100. Предоставляется в информационных целях\n          example: 1014\n        currencyCode:\n          type: integer\n          nullable: false\n          format: ISO 4217\n          description: Код валюты продажи\n          example: 933\n        convertedCurrencyCode:\n          type: integer\n          nullable: false\n          format: ISO 4217\n        
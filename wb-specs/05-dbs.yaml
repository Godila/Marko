"openapi: 3.0.1\ninfo:\n  title: DBS\n  version: dbs\n  description: |\n    <div class=\"description_important\">\n      Узнать больше о модели DBS можно в <a href=\"https://seller.wildberries.ru/instructions/category/6572e024-7428-4db1-86a8-a4c7dbebbfcf?goBackOption=prevRoute&categoryId=5a8e1202-0865-45b7-acae-5d0afc7add56\">справочном центре</a>\n    </div>\n\n    <div class=\"api-block\">\n\n    Управление [сборочными заданиями](/openapi/orders-dbs#tag/dbsAssemblyOrders) и [идентификаторами маркировки](/openapi/orders-dbs#tag/dbsLabelIdentifiers) DBS (Delivery by Seller).<br><br>\n\n    Вы можете протестировать методы DBS в [песочнице](/sandbox). Также в песочнице доступны [специальные методы](/docs/openapi-other/sandbox-environment#tag/Marketplejs-DBS) для эмуляции действий пользователя\n\n    </div>\n  x-file-name: dbs\nsecurity:\n  - HeaderApiKey: []\ntags:\n  - name: Сборочные задания DBS\n    x-displayName: Сборочные задания DBS\n    description: ''\n  - name: Идентификаторы маркировки DBS\n    x-displayName: Идентификаторы маркировки DBS\n    description: ''\npaths:\n  /api/v3/dbs/orders/new:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      operationId: getV3DbsOrdersNew\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Сборочные задания DBS\n      summary: Получить список новых сборочных заданий\n      description: |\n        Метод возвращает список всех новых [сборочных заданий](/openapi/orders-dbs#tag/dbsAssemblyOrders), которые есть у продавца на момент запроса.\n\n        <div class=\"description_limit\">\n        <a href='/docs/openapi/api-information#tag/introduction/Limity-zaprosov'>Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий DBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                nullable: false\n                properties:\n                  orders:\n                    type: array\n                    nullable: false\n                    description: Список новых сборочных заданий\n                    items:\n                      $ref: '#/components/schemas/OrderNewDBS'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/dbs/orders:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      operationId: getV3DbsOrders\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Сборочные задания DBS\n      summary: Получить информацию о завершенных сборочных заданиях\n      description: |\n        Метод возвращает информацию о завершенных [сборочных заданиях](/openapi/orders-dbs#tag/dbsAssemblyOrders) после продажи или отмены заказа.\n        <br><br>\n        Можно получить данные за заданный период, максимум 30 календарных дней одним запросом.\n\n        <div class=\"description_limit\">\n        <a href='/docs/openapi/api-information#tag/introduction/Limity-zaprosov'>Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий DBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Limit'\n        - $ref: '#/components/parameters/Next'\n        - name: dateFrom\n          in: query\n          required: true\n          schema:\n            type: integer\n          description: |\n            Дата начала периода в формате Unix timestamp\n        - name: dateTo\n          in: query\n          required: true\n          schema:\n            type: integer\n          description: Дата конца периода в формате Unix timestamp\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                nullable: false\n                properties:\n                  next:\n                    $ref: '#/components/schemas/Next'\n                  orders:\n                    type: array\n                    nullable: false\n                    items:\n                      $ref: '#/components/schemas/OrderDBS'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/dbs/orders/final-price:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    post:\n      operationId: postV3DbsOrdersFinalPrice\n      x-readonly-method: true\n      x-category: marketplace\n      tags:\n        - Сборочные задания DBS\n      summary: Получить цены продавца и суммы к оплате\n      description: |\n        Метод возвращает:\n          - цены продавца без учёта скидок\n          - суммы к оплате покупателем с учетом всех скидок и кэшбека\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>получения и удаления идентификаторов маркировки DBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 150 запросов | 400 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/OrdersRequestAPI'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.OrdersFinalPriceResponse'\n              examples:\n                GetFinalPriceSuccess:\n                  $ref: '#/components/examples/GetFinalPriceSuccess'\n        '400':\n          $ref: '#/components/responses/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          $ref: '#/components/responses/AccessDeniedBatch'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/dbs/groups/info:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV3DbsGroupsInfo\n      x-readonly-method: true\n      x-category: marketplace\n      description: |\n        Метод возвращает информацию о платной доставке сборочных заданий, которые поступили на один склад (`warehouseId`) в рамках одной транзакции покупателя (`orderUid`).\n\n        <div class=\"description_limit\">\n        <a href='/docs/openapi/api-information#tag/introduction/Limity-zaprosov'>Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий DBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      tags:\n        - Сборочные задания DBS\n      summary: Получить информацию о платной доставке\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrderGroupsRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.OrderGroup'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/dbs/orders/client:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV3DbsOrdersClient\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      summary: Информация о покупателе\n      description: |\n        Метод возвращает информацию о покупателе по ID сборочных заданий.\n\n        <div class=\"description_limit\">\n        <a href='/docs/openapi/api-information#tag/introduction/Limity-zaprosov'>Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий DBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      tags:\n        - Сборочные задания DBS\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/OrdersRequestAPI'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/DbsOnlyClientInfoResp'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/dbs/orders/b2b/info:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    post:\n      operationId: postV3DbsOrdersB2bInfo\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Сборочные задания DBS\n      summary: Информация о покупателе B2B\n      description: |\n        Метод возвращает данные B2B-покупателей по ID сборочных заданий:\n          - ИНН\n          - КПП\n          - Наименование организации\n\n        <div class=\"description_limit\">\n        <a href='/docs/openapi/api-information#tag/introduction/Limity-zaprosov'>Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий DBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersRequestV2'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.B2bClientInfoResponses'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.BatchError'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.BatchError'\n              example:\n                detail: {}\n                origin: dbs-public-api\n                requestId: f1787bd2d1fdс35d6f537316514у4a05\n                title: AccessDenied\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/dbs/orders/delivery-date:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV3DbsOrdersDeliveryDate\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      summary: Получить дату и время доставки\n      description: |\n        Метод возвращает информацию о выбранных покупателем дате и времени доставки заказов.\n        <br>\n\n        <div class=\"description_limit\">\n        <a href='/docs/openapi/api-information#tag/introduction/Limity-zaprosov'>Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий DBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      tags:\n        - Сборочные задания DBS\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/DeliveryDatesRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/DeliveryDatesInfoResp'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest1'\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/dbs/orders/status/info:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV3DbsOrdersStatusInfo\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Сборочные задания DBS\n      summary: Получить статусы сборочных заданий\n      description: |\n        Метод возвращает статусы [сборочных заданий](/openapi/orders-dbs#tag/dbsAssemblyOrders) по их ID.\n        <br><br>\n        `supplierStatus` — статус сборочного задания. Триггер его изменения — действие самого продавца.\n\n        Возможные значения `supplierStatus`:\n        | Статус   | Описание            | Как перевести сборочное задание в данный статус |\n        | -------  | ---------           | --------------------------------------|\n        | `new`      | **Новое сборочное задание** | |\n        | `confirm`  | **На сборке**      |  [Перевести сборочное задание на сборку](/openapi/orders-dbs#tag/dbsAssemblyOrders/operation/postV3DbsOrdersStatusConfirm)\n        | `deliver`  | **В доставке**    | [Перевести сборочное задание в доставку](/openapi/orders-dbs#tag/dbsAssemblyOrders/operation/postV3DbsOrdersStatusDeliver)\n        | `receive`  | **Получено покупателем**       | [Сообщить, что заказ принят покупателем](/openapi/orders-dbs#tag/dbsAssemblyOrders/operation/postV3DbsOrdersStatusReceive) <br>\n        | `reject`   | **Отказ покупателя при получении**           |  [Сообщить, что покупатель отказался от заказа](/openapi/orders-dbs#tag/dbsAssemblyOrders/operation/postV3DbsOrdersStatusReject)\n        | `cancel`   | **Отменено продавцом**   |  [Отменить сборочное задание](/openapi/orders-dbs#tag/dbsAssemblyOrders/operation/postV3DbsOrdersStatusCancel)\n        | `cancel_missed_call` | **Отмена по причине недозвона** | Статус меняется автоматически |\n\n        <br><br>\n        `wbStatus` — статус системы Wildberries.\n\n        Возможные значения `wbStatus`:\n        - `waiting` — сборочное задание в работе\n        - `sold` — заказ получен покупателем\n        - `canceled` — отмена сборочного задания\n        - `canceled_by_client` — покупатель отменил заказ при получении\n        - `declined_by_client` — покупатель отменил заказ в первый чаc\n        <br> Отмена доступна покупателю в первый час с момента заказа, если заказ не переведен на сборку\n        - `defect` — отмена заказа по причине брака\n        - `ready_for_pickup` — заказ прибыл на ПВЗ\n        - `canceled_by_missed_call` — отмена по причине недозвона\n\n        <div class=\"description_limit\">\n        <a href='/docs/openapi/api-information#tag/introduction/Limity-zaprosov'>Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий DBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersRequestV2'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.OrderStatusesV2'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.BatchError'\n              example:\n                detail: {}\n                origin: dbs-public-api\n                requestId: f1787bd2d1fdс35d6f537316514у4a05\n                title: IncorrectRequest\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.BatchError'\n              example:\n                detail: {}\n                origin: dbs-public-api\n                requestId: f1787bd2d1fdс35d6f537316514у4a05\n                title: AccessDenied\n        '404':\n          description: Не найдено\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.BatchError'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/dbs/orders/status/cancel:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV3DbsOrdersStatusCancel\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Сборочные задания DBS\n      summary: Отменить сборочные задания\n      description: |\n        Метод переводит [сборочные задания](/openapi/orders-dbs#tag/dbsAssemblyOrders) из [статусов](/openapi/orders-dbs#tag/dbsAssemblyOrders/operation/postV3DbsOrdersStatusInfo) `new` и `confirm` в статус `cancel` — отменено продавцом.\n        Отменить сборочные задания в статусе `deliver` невозможно.\n\n        <div class=\"description_limit\">\n        <a href='/docs/openapi/api-information#tag/introduction/Limity-zaprosov'>Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 сек | 1 запрос | 1 сек | 10 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersRequestV2'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.StatusSetResponses'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.BatchError'\n              example:\n                detail: {}\n                origin: dbs-public-api\n 
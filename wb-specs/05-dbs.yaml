ive\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Сборочные задания DBS\n      summary: Сообщить о получении заказов\n      description: |\n        Метод переводит [сборочные задания](/openapi/orders-dbs#tag/dbsAssemblyOrders) из [статуса](/openapi/orders-dbs#tag/dbsAssemblyOrders/operation/postV3DbsOrdersStatusInfo) `deliver` в статус `receive` — получено покупателем.\n\n        <div class=\"description_limit\">\n        <a href='/docs/openapi/api-information#tag/introduction/Limity-zaprosov'>Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 сек | 1 запрос | 1 сек | 10 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersCodeRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                example:\n                  requestId: 03615778-eb9e-4f55-b4Of-fd3ac0fad2сc\n                  results:\n                    - orderId: 4299281547\n                      isError: true\n                      errors:\n                        - code: 404\n                          detail: NotFound\n                    - orderId: 4279781545\n                      isError: false\n                properties:\n                  requestId:\n                    type: string\n                    description: Уникальный ID запроса\n                    example: f1787bd2d1fdс35d6f537316514у4a05\n                  results:\n                    
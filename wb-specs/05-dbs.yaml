ties:\n            isB2b:\n              type: boolean\n              description: |\n                Признак B2B-продажи:\n                  - `false` — не B2B-продажа\n                  - `true` — B2B-продажа\n        orderUid:\n          type: string\n          description: ID транзакции для группировки сборочных заданий. Сборочные задания в одной корзине покупателя будут иметь одинаковый `orderUID`\n          example: 165918930_629fbc924b984618a44354475ca58675\n        groupId:\n          description: ID группы сборочных заданий. <br> Объединяет сборочные задания, поступившие на один склад (`warehouseId`) в рамках одной транзакции покупателя (`orderUid`)\n          type: string\n          format: UUID\n          example: 7a2c8810-1db2-4011-9682-5c7fa33afd83\n        article:\n          type: string\n          nullable: false\n          description: Артикул продавца\n          example: one-ring-7548\n        colorCode:\n          type: string\n          nullable: false\n          description: Код цвета (только для колеруемых товаров)\n          example: RAL 3017\n        rid:\n          description: |\n            Уникальный ID заказа. <br>\n            Примечание: `rid` — это `srid` в ответах методов:\n              - [Заявки покупателей на возврат](./user-communication#tag/buyersReturns/operation/getV1Claims)\n              - [Лента заказов](./analytics#tag/orderFeed/operation/postV1OrderFeed)\n              - [Заказы](./reports#tag/mainReports/operation/getV1SupplierOrders)\n              - [Продажи](./reports#tag/mainReports/operation/getV1SupplierSales)\n              - [Отчёт о возвратах и перемещении товаров](./reports#tag/returnsAndItemMovementReport)\n              - [Детализации к отчётам реализации по ID отчётов](./financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailedReportId)\n              - [Детализации к отчётам реализации за период](./financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailed)\n              - [Детализации к отчётам об издержках на приём платежей по ID отчётов](./financial-reports-and-accounting#tag/financialReports/operation/postV1AcquiringDetailedReportId)\n              - [Детализации к отчётам об издержках на приём платежей за период](./financial-reports-and-accounting#tag/financialReports/operation/postV1AcquiringDetailed)\n          example: f884001e44e511edb8780242ac120002\n        createdAt:\n          type: string\n          format: date-time\n          nullable: false\n          description: Дата создания сборочного задания\n          example: '2022-05-04T07:56:29Z'\n        skus:\n          type: array\n          nullable: false\n          description: Массив баркодов товара\n          items:\n            type: string\n            example: '6665956397512'\n        id:\n          type: integer\n          format: int64\n          nullable: false\n          description: ID сборочного задания\n          example: 13833711\n        warehouseId:\n          type: integer\n          nullable: false\n          description: ID склада продавца, на который поступило сборочное задание\n          example: 658434\n        nmId:\n          type: integer\n          nullable: false\n          description: Артикул WB\n          example: 12345678\n        chrtId:\n          type: integer\n          nullable: false\n          description: ID размера товара в системе WB\n          example: 987654321\n        scanPrice:\n          type: integer\n          nullable: true\n          description: Цена приёмки заказов в ПВЗ, в копейках. Отображается только для заказов в ПВЗ\n          example: 50\n        price:\n          type: integer\n          nullable: false\n          description: Цена в валюте продажи с учетом всех скидок, кроме скидки по WB Кошельку, умноженная на 100. Код валюты продажи указан в поле `currencyCode`. Предоставляется в информационных целях\n          example: 1014\n        convertedPrice:\n          type: integer\n          nullable: false\n          description: Цена в валюте страны продавца с учетом всех скидок, кроме скидки по WB Кошельку, умноженная на 100. Предоставляется в информационных целях\n          example: 1014\n        currencyCode:\n          type: integer\n          nullable: false\n          format: ISO 4217\n          description: Код валюты продажи\n          example: 643\n        convertedCurrencyCode:\n          type: integer\n          nullable: false\n          format: ISO 4217\n          description: Код валюты страны продавца\n          example: 643\n        convertedFinalPrice:\n          description: |\n            Сумма к оплате покупателем в валюте страны продавца с учетом всех скидок, умноженная на 100.\n            <br>\n            Предоставляется в информационных целях.\n            <br><br>\n            Используйте значение поля `convertedFinalPrice`, только если в ответе метода [POST /api/marketplace/v3/dbs/orders/final-price](./docs/openapi/orders-dbs#tag/dbsAssemblyOrders/operation/postV3DbsOrdersFinalPrice) вернулось `\"data\": null`. Во всех остальных случаях используйте значение поля `convertedOriginalFinalPrice` из ответа того же метода\n          type: integer\n          example: 1014\n        finalPrice:\n          description: |\n            Сумма к оплате покупателем в валюте продажи с учётом всех скидок, умноженная на 100.\n            <br>\n            Код валюты продажи указан в поле `currencyCode`.\n            <br>\n            Предоставляется в информационных целях.\n            <br><br>\n            Используйте значение поля `finalPrice`, только если в ответе метода [POST /api/marketplace/v3/dbs/orders/final-price](./docs/openapi/orders-dbs#tag/dbsAssemblyOrders/operation/postV3DbsOrdersFinalPrice) вернулось `\"data\": null`. Во всех остальных случаях используйте значение поля `originalFinalPrice` из ответа того же метода\n          type: integer\n          example: 1014\n        cargoType:\n          type: integer\n          nullable: false\n          description: |\n            Тип товара:\n              - `1` — малогабаритный товар (МГТ)\n              - `2` — сверхгабаритный товар (СГТ)\n              - `3` — крупногабаритный товар (КГТ+)\n          enum:\n            - 1\n            - 2\n            - 3\n        comment:\n          type: string\n          nullable: false\n          description: Комментарий покупателя\n          maxLength: 300\n          example: Упакуйте в пленку, пожалуйста\n        isZeroOrder:\n          type: boolean\n          description: |\n            Признак заказа товара с нулевым остатком:\n              - `false` — заказ сделан на товар с ненулевым остатком\n              - `true` — заказ сделан на товар с нулевым остатком. Такой заказ можно отменить без штрафа за отмену\n          example: false\n        wbStickerId:\n          type: integer\n          description: ID стикера. Отображается только для заказов в ПВЗ\n          nullable: false\n          example: 123456\n    DbsOnlyClientInfo:\n      properties:\n        replacementPhone:\n          type: string\n          description: |\n            Подменный номер для связи с покупателем. <br>\n            Пустое значение `\"\"` указывает, что номер еще не назначен <br>\n          example: '79871234567'\n          nullable: false\n        firstName:\n          type: string\n          description: Имя покупателя\n          nullable: false\n        fullName:\n          type: string\n          description: Полное имя, используется для оформления документов. Например, документы на автомобиль\n          example: Иван Иван Иванович\n          nullable: false\n        orderID:\n          type: integer\n          description: ID сборочного задания\n          example: 134567\n        phone:\n          type: string\n          description: |\n            Резервный подменный номер телефона для связи с покупателем. <br>\n            Используйте, если недоступен основной номер из `replacementPhone`.\n            Чтобы позвонить покупателю, наберите этот номер и добавочный код из `phoneCode`. <br>\n            Пустое значение `\"\"` указывает, что номер ещё не назначен\n          example: '+79871234567'\n          nullable: false\n        phoneCode:\n          type: integer\n          description: |\n            Добавочный код. <br>\n            Пустое значение `\"\"` указывает, что код ещё не назначен\n          example: 1234567\n          nullable: false\n        additionalPhoneCodes:\n          nullable: false\n          type: array\n          items:\n            type: string\n          description: |\n            Дополнительные добавочные коды. <br>\n            Используйте, если не получилось дозвониться по добавочному коду из `phoneCode`.<br>\n            Пустое значение `\"\"` указывает, что код ещё не назначен\n          example:\n            - '12345'\n            - '65498'\n      type: object\n    DbsOnlyClientInfoResp:\n      properties:\n        orders:\n          nullable: true\n          description: Информация о покупателе\n          items:\n            $ref: '#/components/schemas/DbsOnlyClientInfo'\n          type: array\n      type: object\n    DeliveryDatesInfoResp:\n      type: object\n      properties:\n        orders:\n          type: array\n          items:\n            type: object\n            properties:\n              dTimeFrom:\n                type: string\n                nullable: true\n                description: Актуальное время доставки \"с\"\n                example: '11:11'\n              dTimeTo:\n                type: string\n                nullable: true\n                description: Актуальное время доставки \"по\"\n                example: '22:22'\n              dTimeFromOld:\n                type: string\n                nullable: true\n                description: Прежнее время доставки \"с\". Доступно первые сутки после изменения\n                example: '12:30'\n              dTimeToOld:\n                type: string\n                nullable: true\n                description: Прежнее время доставки \"по\". Доступно первые сутки после изменения\n                example: '22:30'\n              dDateOld:\n                type: string\n                nullable: true\n                description: Прежняя дата доставки. Доступна первые сутки после изменения\n                example: '2025-01-28'\n              dDate:\n                type: string\n                nullable: false\n                description: Актуальная дата доставки, указанная покупателем\n                example: '2026-01-26'\n              dDateFrom:\n                type: string\n                nullable: true\n                description: Не используется\n                example: ''\n              dDateTo:\n                type: string\n                nullable: true\n                description: Не используется\n                example: ''\n              id:\n                type: integer\n                description: ID сборочного задания\n                example: 1234567890\n    api.OrdersMetaDeleteRequest:\n      type: object\n      required:\n        - key\n        - orderIds\n      properties:\n        key:\n          type: string\n          enum:\n            - imei\n            - uin\n            - gtin\n            - sgtin\n            - customsDeclaration\n          example: imei\n          description: Название идентификатора маркировки для удаления. Передаётся только одно значение\n        orderIds:\n          type: array\n          description: Список ID сборочных заданий\n          maxItems: 1000\n          example:\n            - 123456\n            - 234567\n          items:\n            type: integer\n    api.OrdersGTINSetRequest:\n      type: object\n      required:\n        - orders\n      properties:\n        orders:\n          type: array\n          maxItems: 1000\n          items:\n            $ref: '#/components/schemas/api.GTIN'\n    api.GTIN:\n      type: object\n      required:\n        - orderId\n        - gtin\n      properties:\n        gtin:\n          description: GTIN\n          minLength: 13\n          maxLength: 13\n          type: string\n          example: '1234567890123'\n        orderId:\n          description: ID сборочного задания\n          type: integer\n          example: 123456\n    api.OrdersIMEISetRequest:\n      type: object\n      required:\n        - orders\n      properties:\n        orders:\n          type: array\n          maxItems: 1000\n          items:\n            $ref: '#/components/schemas/api.IMEI'\n    api.IMEI:\n      type: object\n      required:\n        - orderId\n        - imei\n      properties:\n        orderId:\n          description: ID сборочного задания\n          type: integer\n          example: 123456\n        imei:\n          type: string\n          minLength: 15\n          maxLength: 15\n          description: IMEI\n          example: '654321741987258'\n    api.OrdersSGTINsSetRequest:\n      type: object\n      required:\n        - orders\n      properties:\n        orders:\n          type: array\n          maxItems: 1000\n          items:\n            $ref: '#/components/schemas/api.SGTINs'\n    api.SGTINs:\n      type: object\n      required:\n        - orderId\n        - sgtins\n      properties:\n        orderId:\n          description: ID сборочного задания\n          type: integer\n          example: 123456\n        sgtins:\n          type: array\n          minItems: 1\n          maxItems: 24\n          description: Массив кодов маркировки Честного знака. Допускается от 16 до 135 символов для кода одной маркировки\n          example:\n            - '123456789012345678'\n            - '1234567890123456'\n          items:\n            type: string\n    api.OrdersUINSetRequest:\n      type: object\n      required:\n        - orders\n      properties:\n        orders:\n          type: array\n          maxItems: 1000\n          items:\n            $ref: '#/components/schemas/api.UIN'\n    api.UIN:\n      type: object\n      required:\n        - orderId\n        - uin\n      properties:\n        orderId:\n          description: ID сборочного задания\n          type: integer\n          example: 123456\n        uin:\n          type: string\n          minLength: 16\n          maxLength: 16\n          description: УИН\n          example: '1234568909091232'\n    api.OrdersRequestV2:\n      type: object\n      required:\n        - ordersIds\n      properties:\n        ordersIds:\n          description: Список ID сборочных заданий\n          example:\n            - 123456\n            - 234567\n          maxItems: 1000\n          type: array\n          items:\n            type: integer\n    api.StatusSetResponses:\n      type: object\n      example:\n        requestId: 03615778-eb9e-4f55-b4Of-fd3ac0fad2сc\n        results:\n          - orderId: 4299281547\n            isError: true\n            errors:\n              - code: 404\n                detail: NotFound\n          - orderId: 4279781545\n            isError: false\n      properties:\n        requestId:\n          type: string\n          description: Уникальный ID запроса\n          example: f1787bd2d1fdс35d6f537316514у4a05\n        results:\n          type: array\n          items:\n            $ref: '#/components/schemas/api.StatusSetResponse'\n    api.StatusSetResponse:\n      type: object\n      properties:\n        errors:\n          items:\n            $ref: '#/components/schemas/api.BatchErrorResponse'\n          type: array\n          description: Детали ошибки\n        isError:\n          type: boolean\n          description: Есть ли ошибки\n          example: true\n        orderId:\n          type: integer\n          description: ID сборочного задания с успешно обновлёнными данными\n          example: 123456\n    api.StatusSetDeliverResponses:\n      type: object\n      example:\n        requestId: 03615778-eb9e-4f55-b4Of-fd3ac0fad2сc\n        results:\n          - orderId: 4299281547\n            isError: true\n            errors:\n              - code: 404\n                detail: NotFound\n          - orderId: 1234567890\n            isError: true\n            errors:\n              - code: 409\n                detail: MetaValidationFail\n                metaDetails:\n                  - key: sgtin\n                    value: 0102900304495480215KE\n                    decision: sgtinInvalidFormat\n          - orderId: 4279781545\n            isError: false\n      properties:\n        requestId:\n          type: string\n          description: Уникальный ID запроса\n          example: f1787bd2d1fdс35d6f537316514у4a05\n        results:\n          type: array\n          items:\n            $ref: '#/components/schemas/api.StatusSetDeliverResponse'\n    api.StatusSetDeliverResponse:\n      type: object\n      properties:\n        errors:\n          items:\n            $ref: '#/components/schemas/api.BatchErrorDeliverResponse'\n          type: array\n          description: Детали ошибки\n        isError:\n          type: boolean\n          description: Есть ли ошибки\n          example: true\n        orderId:\n          type: integer\n          description: ID сборочного задания с успешно обновлёнными данными\n          example: 123456\n    api.OrdersMetaDetailsResponse:\n      type: object\n      required:\n        - requestId\n      properties:\n        requestId:\n          type: string\n          description: Уникальный ID запроса\n          example: f1787bd2d1fdс35d6f537316514у4a05\n        orders:\n          type: array\n          description: Идентификаторы маркировки сборочных заданий и статусы их валидации\n          items:\n            type: object\n            required:\n              - isError\n            properties:\n              orderId:\n                type: integer\n                example: 123456\n                description: ID сборочного задания\n              isError:\n                type: boolean\n                description: Есть ли ошибки\n                example: false\n              errors:\n                type: array\n                example: []\n                description: Информация об ошибке\n                items:\n                  type: object\n                  properties:\n                    code:\n                      type: integer\n                      description: Код ошибки\n                      example: 404\n                    detail:\n                      type: string\n                      example: NotFound\n                      description: Дополнительная информация об ошибке\n              metaDetails:\n                type: array\n                description: Идентификаторы маркировки и статусы их валидации\n                items:\n                  type: object\n                  properties:\n                    key:\n                      type: string\n                      example: sgtin\n                      description: |\n                        Идентификатор маркировки:\n                          - `imei` — [IMEI](./orders-dbs#tag/dbsLabelIdentifiers/operation/postV3DbsOrdersMetaImei)\n                          - `uin` — [УИН](./orders-dbs#tag/dbsLabelIdentifiers/operation/postV3DbsOrdersMetaUin)\n                          - `gtin` — [GTIN](./orders-dbs#tag/dbsLabelIdentifiers/operation/postV3DbsOrdersMetaGtin)\n                          - `sgtin` — [код маркировки](./orders-dbs#tag/dbsLabelIdentifiers/operation/postV3DbsOrdersMetaSgtin)\n                          - `customsDeclaration` — [номер ДТ](./orders-dbs#tag/dbsLabelIdentifiers/operation/postV3DbsOrdersMetaCustomsDeclaration)\n                          - `originCountryCode` — [числовой код страны происхождения](./orders-dbs#tag/dbsLabelIdentifiers/operation/postV3DbsOrdersMetaCustomsDeclaration) из [Общероссийского классификатора стран мира](https://esnsi.gosuslugi.ru/classifiers/16269) post)\n                    value:\n                      type: string\n                      nullable: true\n                      description: Значение идентификатора маркировки\n                      example: '123456789012345'\n                    decision:\n                      type: string\n                      example: sgtinIntroduced\n                      description: |\n                        Статус проверки:\n                        - `imei`\n                          - `pending` — Маркировка на проверке\n                          - `optional` — Маркировка не обязательна\n                          - `filled` — Валидация пройдена\n                          - `deadlineExceeded` — Валидация пройдена\n                          - `imeiMaySell` — Товар допущен к продаже. Валидация пройдена\n                          - `imeiSoldB2B` — Товар продан покупателю B2B, допущен к продаже повторно. Валидация пройдена\n                          - `required` — Обязательная маркировка не заполнена. Валидация не пройдена\n                          - `imeiInvalidFormat` — Неверный формат маркировки. Валидация не пройдена\n                          - `imeiAlreadySold` — Товар с этим IMEI уже продан. Валидация не пройдена\n                        - `uin`\n                          - `optional` — Маркировка не обязательна\n                          - `filled` — Валидация пройдена\n                        - `sgtin`\n                          - `pending` — Маркировка на проверке\n                          - `optional` — Маркировка не обязательна\n                          - `filled` — Валидация пройдена\n                          - `deadlineExceeded` — Валидация пройдена\n                          - `sgtinIntroduced` — Товар допущен к продаже. Валидация пройдена\n                          - `sgtinSoldB2B` — Товар продан покупателю B2B, допущен к продаже повторно. Валидация пройдена\n                          - `required` — Обязательная маркировка не заполнена. Валидация не пройдена\n                          - `sgtinInvalidFormat` — Неверный формат маркировки. Валидация не пройдена\n                          - `sgtinNotFound` — Маркировка не найдена в [Честном Знаке](https://chestnyznak.ru). Валидация не пройдена\n                          - `sgtinEmitted` —  Маркировка эмитирована. Валидация не пройдена\n                          - `sgtinApplied` — Не пройдена процедура Ввод в оборот. Валидация не пройдена\n                          - `sgtinWrittenOff` — Списан. Валидация не пройдена\n                          - `sgtinRetired` — Выбыл. Валидация не пройдена\n                          - `sgtinWithdrawn` — Выбыл. Валидация не пройдена\n                          - `sgtinDisaggregation` — Расформирован. Валидация не пройдена\n                          - `sgtinDisaggregated` — Расформирован. Валидация не пройдена\n                          - `sgtinAppliedNotPaid` — Не оплачен. Валидация не пройдена\n                        - `gtin`\n                          - `optional` — Маркировка не обязательна\n                          - `filled` — Валидация пройдена\n                        - `customsDeclaration`\n                          - `optional` — Маркировка не обязательна\n                          - `filled` — Валидация пройдена\n    api.OrderStatusesV2:\n      type: object\n      example:\n        orders:\n          - supplierStatus: confirm\n            wbStatus: waiting\n            errors: []\n            orderId: 123456\n          - supplierStatus: ''\n            wbStatus: ''\n            errors:\n              - code: 404\n                detail: NotFound\n            orderId: 789012\n      properties:\n        orders:\n          type: array\n          description: Информация о статусах\n          items:\n            $ref: '#/components/schemas/api.OrderStatusV2'\n    api.OrderStatusV2:\n      type: object\n      properties:\n        errors:\n          description: Информация об ошибке\n          items:\n            $ref: '#/components/schemas/api.BatchErrorResponse'\n          type: array\n        orderId:\n          type: integer\n          description: ID сборочного задания\n          example: 123456\n        supplierStatus:\n          type: string\n          description: Статус сборочного задания, установленный продавцом\n          example: deliver\n        wbStatus:\n          type: string\n          description: Статус сборочного задания в системе Wildberries\n          example: waiting\n    api.OrdersCodeRequest:\n      type: object\n      required:\n        - orders\n      properties:\n        orders:\n          type: array\n          maxItems: 1000\n          items:\n            $ref: '#/components/schemas/api.OrderCodeRequest'\n    api.OrderCodeRequest:\n      type: object\n      properties:\n        code:\n          type: string\n          example: '741852'\n          description: Код подтверждения. <br> Отображается у покупателя на сайте и в приложении Wildberries\n        orderId:\n          type: integer\n          description: ID сборочного задания\n          example: 123456\n    api.BatchError:\n      properties:\n        detail:\n          type: object\n          description: Детали ошибки\n          example: {}\n        origin:\n          type: string\n          description: ID внутреннего сервиса WB\n          example: dbs-public-api\n        requestId:\n          type: string\n          description: Уникальный ID запроса\n          example: f1787bd2d1fdс35d6f537316514у4a05\n        title:\n          type: string\n          description: Заголовок ошибки\n          example: IncorrectRequest\n      type: object\n    api.BatchErrorFinalPriceResponse:\n      required:\n        - code\n        - detail\n      properties:\n        code:\n          type: integer\n          description: |\n            Код ошибки:\n              - `404` — `NotFound`\n              - `400` — `StatusMismatch`\n              - `422` — `PriceNotCalculated`\n          example: 404\n        detail:\n          type: string\n          description: |\n            - `NotFound` — сборочное задание не найдено (`404`)\n            - `StatusMismatch` — операция невозможна для этого статуса сборочного задания (`400`)\n            - `PriceNotCalculated` — операция невозможна для сборочных заданий, созданных ранее 23.07.2026 (`422`)\n          example: NotFound\n      type: object\n    api.BatchErrorDeliverResponse:\n      properties:\n        code:\n          type: integer\n          description: |\n            Код ошибки:\n              - `404`\n              - `409`\n          example: 404\n        detail:\n          type: string\n          description: |\n            - `NotFound` — сборочное задание не найдено\n            - `StatusMismatch` — операция невозможна для этого статуса сборочного задания\n            - `ImeiIsNotFilled` — не заполнен IMEI\n            - `MetaValidationFail` — ошибки валидации идентификатора маркировки\n          example: MetaValidationFail\n        metaDetails:\n          type: array\n          description: Детали ошибки валидации идентификаторов маркировки\n          items:\n            type: object\n            properties:\n              key:\n                type: string\n                description: Идентификатор маркировки\n                example: sgtin\n              value:\n                type: string\n                description: Значение идентификатора маркировки\n                example: '1234567890'\n              decision:\n                type: string\n                description: |\n                  Статус проверки:\n                  - `sgtin`\n                    - `sgtinInvalidFormat` — Неверный формат маркировки\n                    - `sgtinNotFound` — Маркировка не найдена в [Честном знаке](https://chestnyznak.ru)\n                    - `sgtinEmitted` —  Маркировка эмитирована\n                    - `sgtinApplied` — Не пройдена процедура Ввод в оборот\n                    - `sgtinWrittenOff` — Списан\n                    - `sgtinRetired` — Выбыл\n                    - `sgtinWithdrawn` — Выбыл\n                    - `sgtinDisaggregation` — Расформирован\n                    - `sgtinDisaggregated` — Расформирован\n                    - `sgtinAppliedNotPaid` — Не оплачен\n                    - `pending` — Маркировка на проверке\n                example: sgtinEmitted\n      type: object\n    api.BatchErrorResponse:\n      properties:\n        code:\n          type: integer\n          description: |\n            Код ошибки:\n              - `404`\n              - `409`\n              - `400`\n          example: 404\n        detail:\n          type: string\n          description: |\n            - `NotFound` — сборочное задание не найдено\n            - `StatusMismatch` — операция невозможна для этого статуса сборочного задания\n            - `ImeiIsNotFilled` — не заполнен IMEI\n            - `OrderNotB2B` — операция доступна только для сборочных заданий с признаком B2B-продажи `\"isB2b\":true`\n            - `InvalidOriginCountryCode` — некорректный код страны происхождения товара\n          example: NotFound\n      type: object\n    api.Error:\n      properties:\n        detail:\n          type: object\n          description: Детали ошибки\n          example: {}\n        origin:\n          type: string\n          description: ID внутреннего сервиса WB\n          example: dbs-public-api\n        requestId:\n          type: string\n          description: Уникальный ID запроса\n          example: f1787bd2d1fdс35d6f537316514у4a05\n        title:\n          type: string\n          description: Заголовок ошибки\n          example: FailedToUpdateMeta\n      type: object\n    api.B2bClientInfoResponses:\n      type: object\n      required:\n        - requestId\n      example:\n        requestId: 03615778-eb9e-4f55-b4O4-fd3ac0fad2сc\n        results:\n          - orderId: 4299281547\n            isError: true\n            errors:\n              - code: 404\n                detail: NotFound\n          - orderId: 4279781545\n            isError: false\n            data:\n              orgName: ИП Иванов И.И.\n              inn: '8888888888'\n              kpp: ''\n      properties:\n        requestId:\n          type: string\n          description: Уникальный ID запроса\n        results:\n          type: array\n          items:\n            $ref: '#/components/schemas/api.B2bClientInfoResponse'\n    api.B2bClientInfoResponse:\n      type: object\n      required:\n        - isError\n        - orderId\n      properties:\n        data:\n          $ref: '#/components/schemas/api.B2bClientInfo'\n        errors:\n          type: array\n          description: Детали ошибки\n          items:\n            type: object\n            properties:\n              code:\n                type: integer\n                description: Код ошибки\n              detail:\n                type: string\n                description: Описание ошибки\n        isError:\n          type: boolean\n          description: Есть ли ошибки\n          example: true\n        orderId:\n          type: integer\n          description: ID сборочного задания\n          example: 123456\n    api.B2bClientInfo:\n      type: object\n      description: Данные покупателя B2B\n      properties:\n        inn:\n          type: string\n          description: Индивидуальный номер налогоплательщика (ИНН)\n        kpp:\n          type: string\n          description: Код причины постановки на учёт (КПП)\n        orgName:\n          type: string\n          description: Наименование организации\n    Response403General:\n      type: object\n      properties:\n        title:\n          type: string\n          description: Заголовок ошибки\n          example: forbidden\n        detail:\n          type: string\n          description: Детали ошибки\n          example: base token is not allowed\n        code:\n          type: string\n          description: Внутренний код ошибки\n          example: base token is not allowed for this path\n        requestId:\n          type: string\n          description: ID запроса\n          example: 722199b2e15bbca48cc1d488a7989976\n        origin:\n          type: string\n          description: ID внутреннего сервиса WB\n          example: s2s-finance\n        status:\n          type: number\n          description: HTTP статус-код\n          example: 403\n        statusText:\n          type: string\n          description: Расшифровка HTTP статус-кода\n          example: Forbidden\n        timestamp:\n          type: string\n          format: date-time\n          description: Дата и время запроса\n          example: '2026-05-25T02:47:09Z'\n"
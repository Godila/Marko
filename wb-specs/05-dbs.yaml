   summary: Закрепить IMEI за сборочными заданиями\n      description: |\n        Метод обновляет IMEI в [идентификаторах маркировки сборочных заданий](/openapi/orders-dbs#tag/dbsLabelIdentifiers/operation/postV3DbsOrdersMetaDetails).<br>\n        У одного сборочного задания может быть только один IMEI. Если у устройства два IMEI — **IMEI** и **IMEI2** или **IMEI1** и **IMEI2** — укажите только **IMEI** или **IMEI1**. **IMEI2** указывать не нужно.<br>\n        Закрепить IMEI можно только за сборочным заданием в [статусе](/openapi/orders-dbs#tag/dbsAssemblyOrders/operation/postV3DbsOrdersStatusInfo) `confirm` и если в [идентификаторах маркировки сборочного задания](/openapi/orders-dbs#tag/dbsLabelIdentifiers/operation/postV3DbsOrdersMetaDetails) есть поле `imei`.<br>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>закрепления идентификаторов маркировки DBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 500 запросов | 120 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersIMEISetRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.StatusSetResponses'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.BatchError'\n              example:\n                detail: {}\n                origin: dbs-public-api\n                requestId: f1787bd2d1fdс35d6f537316514у4a05\n                title: IncorrectRequest\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.BatchError'\n              example:\n                detail: {}\n                origin: dbs-public-api\n                requestId: f1787bd2d1fdс35d6f537316514у4a05\n                title: IncorrectRequest\n        '409':\n          description: Ошибка обновления идентификаторов маркировки\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.Error'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/dbs/orders/meta/gtin:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV3DbsOrdersMetaGtin\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Идентификаторы маркировки DBS\n      summary: Закрепить GTIN за сборочными заданиями\n      description: |\n        Метод обновляет GTIN, уникальный ID товара в Беларуси, в [идентификаторах маркировки сборочных заданий](/openapi/orders-dbs#tag/dbsLabelIdentifiers/operation/postV3DbsOrdersMetaDetails). У одного сборочного задания может быть только один GTIN. <br>\n        Закрепить GTIN можно только за сборочным заданием в [статусе](/openapi/orders-dbs#tag/dbsAssemblyOrders/operation/postV3DbsOrdersStatusInfo) `confirm` и если в [идентификаторах маркировки сборочного задания](/openapi/orders-dbs#tag/dbsLabelIdentifiers/operation/postV3DbsOrdersMetaDetails) есть поле `gtin`.<br>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>закрепления идентификаторов маркировки DBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 500 запросов | 120 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/api.OrdersGTINSetRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.StatusSetResponses'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.BatchError'\n              example:\n                detail: {}\n                origin: dbs-public-api\n                requestId: f1787bd2d1fdс35d6f537316514у4a05\n                title: IncorrectRequest\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.BatchError'\n              example:\n                detail: {}\n                origin: dbs-public-api\n                requestId: f1787bd2d1fdс35d6f537316514у4a05\n                title: AccessDenied\n        '409':\n          description: Ошибка обновления идентификаторов маркировки\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.Error'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/dbs/orders/meta/customs-declaration:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV3DbsOrdersMetaCustomsDeclaration\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Идентификаторы маркировки DBS\n      summary: Закрепить номера ДТ за сборочными заданиями\n      description: |\n        Метод обновляет номера ДТ — деклараций на товары — и коды стран происхождения товаров в [идентификаторах маркировки сборочных заданий](/openapi/orders-dbs#tag/dbsLabelIdentifiers/operation/postV3DbsOrdersMetaDetails). У одного сборочного задания может быть только один номер ДТ. <br>\n        Закрепить номер ДТ можно, только если выполняются все условия:\n          - сборочное задание имеет признак B2B-продажи — `\"isB2b\":true` в ответе метода [получения новых сборочных заданий](/openapi/orders-dbs#tag/dbsAssemblyOrders/operation/getV3DbsOrdersNew)\n          - сборочное задание находится в [статусах](/openapi/orders-dbs#tag/dbsAssemblyOrders/operation/postV3DbsOrdersStatusInfo) `confirm` или `deliver`\n          - поле `customsDeclaration` есть в [идентификаторах маркировки сборочных заданий](/openapi/orders-dbs#tag/dbsLabelIdentifiers/operation/postV3DbsOrdersMetaDetails)\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>закрепления идентификаторов маркировки DBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 500 запросов | 120 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - orders\n              properties:\n                orders:\n                  type: array\n                  maxItems: 1000\n                  items:\n                    type: object\n                    properties:\n                      customsDeclaration:\n                        type: string\n                        minLength: 17\n                        maxLength: 29\n                        description: Номер ДТ\n                        example: 10704010/010624/0000302\n                      orderId:\n                        type: integer\n                        description: ID сборочного задания\n                      originCountryCode:\n                        type: string\n                        description: |\n                          Числовой код страны происхождения товара из [Общероссийского классификатора стран мира](https://esnsi.gosuslugi.ru/classifiers/16269). Необходимо указывать только для сборочных заданий с признаком B2B-продажи `\"isB2b\":true`\n                        maxLength: 3\n                        example: '643'\n                    required:\n                      - customsDeclaration\n                      - orderId\n                      - originCountryCode\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/api.StatusSetResponses'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '409':\n          description: Ошибка добавления маркировки\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                FailedToUpdateMeta:\n                  $ref: '#/components/examples/FailedToUpdateMeta'\n        '429':\n          $ref: '#/components/responses/429'\ncomponents:\n  securitySchemes:\n    HeaderApiKey:\n      type: apiKey\n      name: Authorization\n      in: header\n  parameters:\n    Next:\n      name: next\n      in: query\n      required: true\n      schema:\n        type: integer\n        format: int64\n      description: Параметр пагинации. Устанавливает значение, с которого надо получить следующий пакет данных. Для получения полного списка данных должен быть равен `0` в первом запросе. Для следующих запросов необходимо брать значения из одноименного поля в ответе.\n    Limit:\n      name: limit\n      in: query\n      required: true\n      schema:\n        type: integer\n        minimum: 1\n        maximum: 1000\n      description: Параметр пагинации. Устанавливает предельное количество возвращаемых данных.\n  examples:\n    IncorrectRequestBody:\n      description: Некорректное тело запроса\n      value:\n        code: IncorrectRequestBody\n        message: Некорректное тело запроса\n    IncorrectRequest:\n      value:\n        code: IncorrectRequest\n        message: Переданы некорректные данные\n    IncorrectRequest1:\n      description: Некорректный запрос\n      value:\n        code: IncorrectRequest\n        message: ''\n    IncorrectParameter:\n      value:\n        code: IncorrectParameter\n        message: Передан некорректный параметр\n    FailedToUpdateMeta:\n      value:\n        code: FailedToUpdateMeta\n        message: Не удалось обновить идентификаторы маркировки сборочного задания. Убедитесь, что сборочное задание удовлетворяет всем необходимым требованиям (сборочное задание существует, находится в статусе \"На сборке\", сборочному заданию доступны идентификаторы маркировки см. описание метода **Получить идентификаторы маркировки сборочного задания**)\n    StatusMismatch:\n      value:\n        code: StatusMismatch\n        message: Несоответствие статусов, проверьте их правильность\n    GetFinalPriceSuccess:\n      value:\n        requestId: f1787bd2d1fdc35d6f537316514y4a05\n        results:\n          - orderId: 1234567890\n            data:\n              originalPrice: 29000\n              convertedOriginalPrice: 29000\n              originalFinalPrice: 27000\n              convertedOriginalFinalPrice: 27000\n              currencyCode: 643\n              convertedCurrencyCode: 643\n            isError: false\n  responses:\n    '401':\n      description: Не авторизован\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки\n              code:\n                type: string\n                description: Внутренний код ошибки\n              requestId:\n                type: string\n                description: Уникальный ID запроса\n              origin:\n                type: string\n                description: ID внутреннего сервиса WB\n              status:\n                type: number\n                description: HTTP статус-код\n              statusText:\n                type: string\n                description: Расшифровка HTTP статус-кода\n              timestamp:\n                type: string\n                format: date-time\n                description: Дата и время запроса\n          example:\n            title: unauthorized\n            detail: 'token problem; token is malformed: could not base64 decode signature: illegal base64 data at input byte 84'\n            code: 07e4668e--a53a3d31f8b0-[UK-oWaVDUqNrKG]; 03bce=277; 84bd353bf-75\n            requestId: 7b80742415072fe8b6b7f7761f1d1211\n            origin: s2s-api-auth-catalog\n            status: 401\n            statusText: Unauthorized\n            timestamp: '2024-09-30T06:52:38Z'\n    '402':\n      description: Требуется платёж\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки. Ошибка возвращается только сервисам из [Каталога решений для бизнеса](/business-solutions)\n          example:\n            title: payment required\n            detail: wb solution for business has insufficient funds on its balance. please top up the balance in the company's personal account https://dev.wildberries.ru/company\n    '429':\n      description: Слишком много запросов\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки\n              code:\n                type: string\n                description: Внутренний код ошибки\n              requestId:\n                type: string\n                description: Уникальный ID запроса\n              origin:\n                type: string\n                description: ID внутреннего сервиса WB\n              status:\n                type: number\n                description: HTTP статус-код\n              statusText:\n                type: string\n                description: Расшифровка HTTP статус-кода\n              timestamp:\n                type: string\n                format: date-time\n                description: Дата и время запроса\n          example:\n            title: too many requests\n            detail: limited by c122a060-a7fb-4bb4-abb0-32fd4e18d489\n            code: 07e4668e-ac2242c5c8c5-[UK-4dx7JUdskGZ]\n            requestId: 9d3c02cc698f8b041c661a7c28bed293\n            origin: s2s-api-auth-catalog\n            status: 429\n            statusText: Too Many Requests\n            timestamp: '2024-09-30T06:52:38Z'\n    IncorrectRequest:\n      description: Неправильный запрос\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/api.BatchError'\n    NotFound:\n      description: Не найдено\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n          example:\n            code: NotFound\n            message: ''\n    AccessDenied:\n      description: Доступ запрещён\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n          example:\n            code: AccessDenied\n            message: ''\n    AccessDeniedBatch:\n      description: Доступ запрещён\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/api.BatchError'\n          example:\n            detail: {}\n            origin: dbs-public-api\n            requestId: f1787bd2d1fdс35d6f537316514у4a05\n            title: AccessDenied\n  schemas:\n    api.OrdersFinalPriceResponse:\n      type: object\n      required:\n        - requestId\n        - results\n      properties:\n        requestId:\n          type: string\n          description: Уникальный ID запроса\n        results:\n          type: array\n          items:\n            $ref: '#/components/schemas/api.OrderFinalPriceResult'\n    api.OrderFinalPriceResult:\n      type: object\n      required:\n        - orderId\n      properties:\n        orderId:\n          description: ID сборочного задания\n          type: integer\n          nullable: false\n        data:\n          description: |\n            Данные сборочного задания.\n            <br><br>\n            Если `\"data\":{}`, данные формируются. Повторите запрос позднее. Максимальное время формирования данных около 3 минут.\n            <br><br>\n            Если `data` отсутствует, данных по сборочному заданию не предусмотрено. Используйте данные из ответов методов:\n              - [Получить список новых сборочных заданий](/docs/openapi/orders-dbs#tag/dbsAssemblyOrders/operation/getV3DbsOrdersNew)\n              - [Получить информацию о завершенных сборочных заданиях](/docs/openapi/orders-dbs#tag/dbsAssemblyOrders/operation/getV3DbsOrders)\n          type: object\n          nullable: false\n          properties:\n            originalPrice:\n              description: Цена продавца в валюте продажи без учёта скидок, умноженная на 100. Предоставляется в информационных целях\n              type: integer\n              nullable: false\n            convertedOriginalPrice:\n              description: Цена продавца в валюте страны продавца без учёта скидок, умноженная на 100. Предоставляется в информационных целях\n              type: integer\n              nullable: false\n            originalFinalPrice:\n              description: Сумма к оплате покупателем в валюте продажи с учетом всех скидок и кэшбека, умноженная на 100. Код валюты продажи указан в поле `currencyCode`. Предоставляется в информационных целях\n              type: integer\n              nullable: false\n            convertedOriginalFinalPrice:\n              description: Сумма к оплате покупателем в валюте страны продавца с учетом всех скидок и кэшбека, умноженная на 100. Предоставляется в информационных целях\n              type: integer\n              nullable: false\n            currencyCode:\n              type: integer\n              nullable: false\n              format: ISO 4217\n              description: Код валюты продажи\n            convertedCurrencyCode:\n              type: integer\n              nullable: false\n              format: ISO 4217\n              description: Код валюты страны продавца\n        errors:\n          description: Детали ошибки\n          nullable: false\n          type: array\n          items:\n            $ref: '#/components/schemas/api.BatchErrorFinalPriceResponse'\n        isError:\n          type: boolean\n          nullable: false\n          description: Есть ли ошибки\n    api.OrderGroupsRequest:\n      type: object\n      properties:\n        groups:\n          type: array\n          maxItems: 1000\n          description: Список значений `groupId`. Можно получить из [новых](./orders-dbs#tag/dbsAssemblyOrders/operation/getV3DbsOrdersNew) и [завершенных](./orders-dbs#tag/dbsAssemblyOrders/operation/getV3DbsOrders) сборочных заданий\n          items:\n            type: string\n      example:\n        groups:\n          - 7a2c8810-1db2-4011-9682-5c7fa33afd83\n          - 5a8f4523-4cf2-5691-9682-5a7fd33afd73\n    Error:\n      type: object\n      nullable: false\n      properties:\n        code:\n          type: string\n          description: Код ошибки\n          nullable: false\n        message:\n          type: string\n          description: Описание ошибки\n          nullable: false\n        data:\n          type: object\n          description: Дополнительные данные ошибки\n          nullable: true\n    OrdersRequestAPI:\n      properties:\n        orders:\n          description: Список ID сборочных заданий\n          items:\n            type: integer\n          type: array\n      type: object\n      example:\n        orders:\n          - 987654321\n          - 123456789\n    api.OrderGroup:\n      type: array\n      nullable: true\n      items:\n        type: object\n        properties:\n          groupID:\n            description: ID группы сборочных заданий\n            type: string\n            format: UUID\n            example: 0596a30a-d11c-4210-a231-ee1c39d61fe4\n          deliveryCost:\n            description: Стоимость платной доставки в валюте продажи, умноженная на 100\n            type: integer\n            example: 1108\n          convertedDeliveryCost:\n            description: Стоимость платной доставки в валюте страны продавца, умноженная на 100. Предоставляется в информационных целях.\n            type: integer\n            example: 29803\n          currencyCode:\n            description: Код валюты продажи\n            format: ISO 4217\n            type: integer\n            example: 933\n          convertedCurrencyCode:\n            description: Код валюты страны продавца\n            type: integer\n            example: 643\n    DeliveryDatesRequest:\n      properties:\n        orders:\n          description: Список ID сборочных заданий\n          items:\n            type: integer\n            minItems: 1\n            maxItems: 1000\n          type: array\n      type: object\n      example:\n        orders:\n          - 1234567890\n    Next:\n      type: integer\n      format: int64\n      nullable: false\n      description: Параметр пагинации. Содержит значение, которое необходимо указать в запросе для получения следующего пакета данных\n      example: 13833711\n    OrderNewDBS:\n      type: object\n      properties:\n        salePrice:\n          description: |\n            Цена в валюте продажи с учетом скидки продавца, без учета скидки WB Клуба, умноженная на 100. Предоставляется в информационных целях\n          type: integer\n          nullable: true\n          example: 504658\n        requiredMeta:\n          description: Список идентификаторов маркировки, доступных для сборочного задания. [Указывать IMEI](./orders-dbs#tag/dbsLabelIdentifiers/operation/postV3DbsOrdersMetaImei) обязательно для [предмета](./work-with-products#tag/categoriesSubcategoriesAndCharacteristics/paths/~1content~1v2~1object~1all/get) `Смартфоны`, `\"subjectId\":515`\n          type: array\n          nullable: true\n          items:\n            type: string\n          example:\n            - uin\n        comment:\n          type: string\n          nullable: false\n          description: Комментарий покупателя\n          maxLength: 300\n          example: Упакуйте в пленку, пожалуйста\n        options:\n          type: object\n          description: Опции заказа\n          properties:\n            isB2b:\n              type: boolean\n              description: |\n                Признак B2B-продажи:\n                  - `false` — не B2B-продажа\n                  - `true` — B2B-продажа\n        address:\n          type: object\n          nullable: false\n          description: |\n            Адрес покупателя для доставки. При доставке заказов в ПВЗ указан адрес ПВЗ\n          properties:\n            fullAddress:\n              description: Адрес доставки\n              type: string\n              example: Челябинская область, г. Челябинск, 51-я улица Арабкира, д. 10А, кв. 42\n            longitude:\n              type: number\n              format: float64\n              nullable: false\n              description: Долгота\n              example: 44.519068\n            latitude:\n              type: number\n              format: float64\n              nullable: false\n              description: Широта\n              example: 40.20192\n        orderUid:\n          type: string\n          description: ID транзакции для группировки сборочных заданий. Сборочные задания в одной корзине покупателя будут иметь одинаковый `orderUID`\n          example: 165918930_629fbc924b984618a44354475ca58675\n        groupId:\n          description: ID группы сборочных заданий. <br> Объединяет сборочные задания, поступившие на один склад (`warehouseId`) в рамках одной транзакции покупателя (`orderUid`)\n          type: string\n          format: UUID\n          example: 7a2c8810-1db2-4011-9682-5c7fa33afd83\n        article:\n          type: string\n          nullable: false\n          description: Артикул продавца\n          example: one-ring-7548\n        colorCode:\n          description: Код цвета (только для колеруемых товаров)\n          type: string\n          nullable: false\n          example: RAL 3017\n        rid:\n          description: |\n            Уникальный ID заказа. <br>\n            Примечание: `rid` — это `srid` в ответах методов:\n              - [Заявки покупателей на возврат](./user-communication#tag/buyersReturns/operation/getV1Claims)\n              - [Лента заказов](./analytics#tag/orderFeed/operation/postV1OrderFeed)\n              - [Заказы](./reports#tag/mainReports/operation/getV1SupplierOrders)\n              - [Продажи](./reports#tag/mainReports/operation/getV1SupplierSales)\n              - [Отчёт о возвратах и перемещении товаров](./reports#tag/returnsAndItemMovementReport)\n              - [Детализации к отчётам реализации по ID отчётов](./financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailedReportId)\n              - [Детализации к отчётам реализации за период](./financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailed)\n              - [Детализации к отчётам об издержках на приём платежей по ID отчётов](./financial-reports-and-accounting#tag/financialReports/operation/postV1AcquiringDetailedReportId)\n              - [Детализации к отчётам об издержках на приём платежей за период](./financial-reports-and-accounting#tag/financialReports/operation/postV1AcquiringDetailed)\n          example: f884001e44e511edb8780242ac120002\n        createdAt:\n          type: string\n          format: date-time\n          nullable: false\n          description: Дата создания сборочного задания\n          example: '2022-05-04T07:56:29Z'\n        deliveryType:\n          type: string\n          nullable: false\n          description: |\n            Тип доставки:\n              - `dbs` — доставка силами продавца\n              - `dbsPickupPoint` — доставка силами продавца в ПВЗ\n              - `edbs` — экспресс-доставка силами продавца\n          enum:\n            - dbs\n            - edbs\n            - dbsPickupPoint\n        skus:\n          type: array\n          nullable: false\n          description: Массив баркодов товара\n          items:\n            type: string\n            example: '6665956397512'\n        id:\n          type: integer\n          format: int64\n          nullable: false\n          description: ID сборочного задания\n          example: 13833711\n        warehouseId:\n          type: integer\n          nullable: false\n          description: ID склада продавца, на который поступило сборочное задание\n          example: 658434\n        nmId:\n          type: integer\n          nullable: false\n          description: Артикул WB\n          example: 123456789\n        chrtId:\n          type: integer\n          nullable: false\n          description: ID размера товара в системе WB\n          example: 987654321\n        price:\n          type: integer\n          nullable: false\n          description: Цена в валюте продажи с учетом всех скидок, кроме скидки по WB Кошельку, умноженная на 100. Код валюты продажи указан в поле `currencyCode`. Предоставляется в информационных целях\n          example: 1014\n        finalPrice:\n          description: |\n            Сумма к оплате покупателем в валюте продажи с учётом всех скидок, умноженная на 100.\n            <br>\n            Код валюты продажи указан в поле `currencyCode`.\n            <br>\n            Предоставляется в информационных целях.\n            <br><br>\n            Используйте значение поля `finalPrice`, только если в ответе метода [POST /api/marketplace/v3/dbs/orders/final-price](./docs/openapi/orders-dbs#tag/dbsAssemblyOrders/operation/postV3DbsOrdersFinalPrice) вернулось `\"data\": null`. Во всех остальных случаях используйте значение поля `originalFinalPrice` из ответа того же метода\n          type: integer\n          example: 1014\n        convertedFinalPrice:\n          description: |\n            Сумма к оплате покупателем в валюте страны продавца с учетом всех скидок, умноженная на 100.\n            <br>\n            Предоставляется в информационных целях.\n            <br><br>\n            Используйте значение поля `convertedFinalPrice`, только если в ответе метода [POST /api/marketplace/v3/dbs/orders/final-price](./docs/openapi/orders-dbs#tag/dbsAssemblyOrders/operation/postV3DbsOrdersFinalPrice) вернулось `\"data\": null`. Во всех остальных случаях используйте значение поля `convertedOriginalFinalPrice` из ответа того же метода\n          type: integer\n          example: 1014\n        convertedPrice:\n          type: integer\n          nullable: false\n          description: Цена в валюте страны продавца с учетом всех скидок, кроме скидки по WB Кошельку, умноженная на 100. Предоставляется в информационных целях\n          example: 1014\n        currencyCode:\n          type: integer\n          nullable: false\n          format: ISO 4217\n          description: Код валюты продажи\n          example: 643\n        convertedCurrencyCode:\n          type: integer\n          nullable: false\n          format: ISO 4217\n          description: Код валюты страны продавца\n          example: 643\n        cargoType:\n          type: integer\n          nulla
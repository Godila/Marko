stupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену, \n                <strong>Сервисному</strong> токену, \n                <strong>Базовому</strong> токену <strong>с секретом</strong>\n        </div>\n\n        Метод возвращает стикеры для сборочных заданий с доставкой в ПВЗ в [статусах](/openapi/orders-dbs#tag/dbsAssemblyOrders/operation/postV3DbsOrdersStatusInfo):\n          - `confirm` — на сборке\n          - `deliver` — в доставке\n\n        Получить стикеры можно только в размере 580x400 px в формате PDF.\n\n        <div class=\"description_limit\">\n        <a href='/docs/openapi/api-information#tag/introduction/Limity-zaprosov'>Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий DBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n\n        </div>\n      parameters:\n        - name: type\n          in: query\n          required: true\n          description: Формат стикера\n          schema:\n            type: string\n            enum:\n              - pdf\n        - name: width\n          in: query\n          required: true\n          description: Ширина стикера\n          schema:\n            type: integer\n            enum:\n              - 58\n        - name: height\n          in: query\n          required: true\n          description: Высота стикера\n          schema:\n            type: integer\n            enum:\n              - 40\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - orders\n              properties:\n                orders:\n                  type: array\n                  minItems: 1\n                  maxItems: 100\n                  description: Список ID сборочных заданий\n                  items:\n                    type: integer\n                    format: int64\n                    example: 5346346\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  stickers:\n                    type: array\n                    nullable: false\n                    description: Стикеры\n                    items:\n                      type: object\n                      required:\n                        - barcode\n                        - file\n                        - orderId\n                        - partA\n                        - partB\n                      properties:\n                        orderId:\n                          type: integer\n                          format: int64\n                          nullable: false\n                          description: ID сборочного задания\n                          example: 5346346\n                        partA:\n                          type: string\n                          nullable: false\n                          description: Первая часть ID стикера\n                          example: '231648'\n                        partB:\n                          type: string\n                          nullable: false\n                          description: Вторая часть ID стикера\n                          example: '9753'\n                        barcode:\n                          type: string\n                          nullable: false\n                          description: Закодированное значение стикера\n                          example: '!uKEtQZVx'\n                        file:\n                          type: string\n                          nullable: false\n                          description: Полное представление стикера, кодировка base64\n                          example: JVBER...ZWYKMTM5MQolJUVPRg==\n        '400':\
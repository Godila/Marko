только сервисам из [Каталога решений для бизнеса](/business-solutions)\n          example:\n            title: payment required\n            detail: wb solution for business has insufficient funds on its balance. please top up the balance in the company's personal account https://dev.wildberries.ru/company\n    '403':\n      description: Доступ запрещён\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки\n              code:\n                type: string\n                description: Внутренний код ошибки\n              requestId:\n                type: string\n                description: ID запроса\n              origin:\n                type: string\n                description: ID внутреннего сервиса WB\n              status:\n                type: number\n                description: HTTP статус-код\n              statusText:\n                type: string\n                description: Расшифровка HTTP статус-кода\n              timestamp:\n                type: string\n                format: date-time\n                description: Дата и время запроса\n          example:\n            title: forbidden\n            detail: base token is not allowed\n            code: base token is not allowed for this path\n            requestId: 722199b2e15bbca48cc1d488a7989976\n            origin: s2s-finance\n            status: 403\n            statusText: Forbidden\n            timestamp: '2026-05-25T02:47:09Z'\n    '429':\n      description: Слишком много запросов\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки\n              code:\n                type: string\n                description: Внутренний код ошибки\n              requestId:\n                type: string\n                description: Уникальный ID запроса\n              origin:\n                type: string\n                description: ID внутреннего сервиса WB\n              status:\n                type: number\n                description: HTTP статус-код\n              statusText:\n                type: string\n                description: Расшифровка HTTP статус-кода\n              timestamp:\n                type: string\n                format: date-time\n                description: Дата и время запроса\n          example:\n            title: too many requests\n            detail: limited by c122a060-a7fb-4bb4-abb0-32fd4e18d489\n            code: 07e4668e-ac2242c5c8c5-[UK-4dx7JUdskGZ]\n            requestId: 9d3c02cc698f8b041c661a7c28bed293\n            origin: s2s-api-auth-catalog\n            status: 429\n            statusText: Too Many Requests\n            timestamp: '2024-09-30T06:52:38Z'\n"
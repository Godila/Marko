"openapi: 3.0.1\ninfo:\n  title: Общее\n  version: general\n  x-file-name: general\n  description: |\n    <div class=\"api-block\">\n\n    В этом разделе:\n    - [общая информация о WB API](/openapi/api-information#tag/introduction)\n    - как [начать работу с WB API](/openapi/api-information#tag/introduction/Kak-nachat-rabotu-s-API)\n    - как [авторизоваться](/openapi/api-information#tag/authorization) и [создавать токены](/openapi/api-information#tag/authorization/Kak-sozdat-personalnyj-bazovyj-ili-testovyj-token)\n    - основные [статус-коды ответов](/openapi/api-information#tag/introduction/Status-kody-HTTP)\n    - [лимиты запросов](/openapi/api-information#tag/introduction/Limity-zaprosov)\n    - как обратиться в [поддержку](/openapi/api-information#tag/introduction/Podderzhka)\n\n    С помощью методов этого раздела вы можете:\n    - проверить [подключение к WB API](/openapi/api-information#tag/connectionCheck/operation/getPing)\n    - получить [новости портала продавцов](/openapi/api-information#tag/newsApi/operation/getV2News)\n    - получить [информацию о продавце](/openapi/api-information#tag/sellerInformation/operation/getV1SellerInfo)\n    - [управлять пользователями продавца](/openapi/api-information#tag/sellerUserManagement)\n\n    </div>\nsecurity:\n  - HeaderApiKey: []\ntags:\n  - name: Введение\n    x-displayName: Введение\n    description: ''\n  - name: Авторизация\n    x-displayName: Авторизация\n    description: ''\n  - name: Проверка подключения к WB API\n    x-displayName: Проверка подключения к WB API\n    description: ''\n  - name: API новостей\n    x-displayName: API новостей\n    description: ''\n  - name: Информация о продавце\n    x-displayName: Информация о продавце\n    description: ''\n  - name: Управление пользователями продавца\n    x-displayName: Управление пользователями продавца\n    description: ''\npaths:\n  /ping:\n    servers:\n      - url: https://common-api.wildberries.ru\n    get:\n      operationId: getPing\n      x-readonly-method: true\n      x-category: all\n      tags:\n        - Проверка подключения к WB API\n      security:\n        - HeaderApiKey: []\n      summary: Проверка подключения\n      description: |\n        Метод проверяет:\n          1. Успешно ли запрос доходит до WB API\n          2. Валидность токена авторизации и URL запроса\n          3. Совпадают ли категория токена и сервис\n\n        <div class=\"description_important\">\n          Метод не предназначен для проверки доступности сервисов WB\n        </div>\n\n        У каждого сервиса есть свой вариант метода в зависимости от домена:\n\n        | Категория | URL запроса |\n        |---------------|-----------------------|\n        | Контент | `https://content-api.wildberries.ru/ping`<br>`https://content-api-sandbox.wildberries.ru/ping` |\n        | Аналитика | `https://seller-analytics-api.wildberries.ru/ping` |\n        | Цены и скидки | `https://discounts-prices-api.wildberries.ru/ping`<br>`https://discounts-prices-api-sandbox.wildberries.ru/ping` |\n        | Маркетплейс | `https://marketplace-api.wildberries.ru/ping` |\n        | Статистика | `https://statistics-api.wildberries.ru/ping`<br>`https://statistics-api-sandbox.wildberries.ru/ping` |\n        | Продвижение | `https://advert-api.wildberries.ru/ping`<br>`https://advert-api-sandbox.wildberries.ru/ping` |\n        | Вопросы и отзывы | `https://feedbacks-api.wildberries.ru/ping`<br>`https://feedbacks-api-sandbox.wildberries.ru/ping` |\n        | Чат с покупателями | `https://buyer-chat-api.wildberries.ru/ping` |\n        | Поставки | `https://supplies-api.wildberries.ru/ping` |\n        | Возвраты покупателями | `https://returns-api.wildberries.ru/ping` |\n        | Документы | `https://documents-api.wildberries.ru/ping` |\n        | Финансы | `https://finance-api.wildberries.ru/ping` |\n        | Тарифы, Новости, Получить информацию о продавце | `https://common-api.wildberries.ru/ping` |\n        | Управление пользователями продавца | `https://user-management-api.wildberries.ru/ping` |\n\n        <div class=\"description_limit\">\n          Максимум 3 запроса за 30 <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">секунд</a>. Если попытаться автоматизировать использование метода, запросы будут временно заблокированы. Лимит действует отдельно для каждого варианта метода в зависимости от домена\n        </div>\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  TS:\n                    type: string\n                    description: Timestamp запроса\n                  Status:\n                    type: string\n                    enum:\n                      - OK\n                    description: Статус\n              example:\n                TS: '2024-08-16T11:19:05+03:00'\n                Status: OK\n        '401':\n          $ref: '#/components/responses/401'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/communications/v2/news:\n    servers:\n      - url: https://common-api.wildberries.ru\n    get:\n      operationId: getV2News\n      x-readonly-method: true\n      x-category: commonapi\n      tags:\n        - API новостей\n      security:\n        - HeaderApiKey: []\n      summary: Получение новостей портала продавцов\n      description: |\n        Метод позволяет получать новости портала продавцов. <br> Для получения успешного ответа необходимо указать\n        один из параметров `from` или `fromID`. <br> За один запрос можно получить не более 100 новостей.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 1 запрос | 1 мин | 10 запросов |\n        | Сервисный | 1 мин | 1 запрос | 1 мин | 10 запросов |\n        | Базовый с секретом | 1 мин | 1 запрос | 1 мин | 10 запросов |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      parameters:\n        - in: query\n          name: from\n          required: false\n          schema:\n            type: string\n            format: date\n            example: '2025-02-06'\n          description: Дата, от которой необходимо выдать новости\n        - in: query\n          name: fromID\n          required: false\n          schema:\n            type: integer\n            format: uint64\n          description: ID новости, начиная с которой — включая её — нужно получить список новостей\n          example: 7369\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    type: array\n                    description: Новости\n                    items:\n                      type: object\n                      properties:\n                        content:\n                          type: string\n                          description: Текст новости\n                          format: plaintext\n                        date:\n                          format: date-time\n                          type: string\n                          description: Дата и время публикации новости\n                        header:\n                          type: string\n                          description: Заголовок новости\n                        id:\n                          type: integer\n                          description: ID новости\n                        types:\n                          type: array\n                          description: Теги новости\n                          items:\n                            type: object\n                            properties:\n                              id:\n                                type: integer\n                                description: ID тега\n                              name:\n                                type: string\n                                description: Название тега\n              example:\n                data:\n                  - content: |\n                      Теперь в кампаниях ВБ.Медиа вы можете размещать баннеры для пользователей, которые взаимодействовали\n                      с товарами из определённой категории: покупали, искали, добавляли в корзину и избранное. Также можно\n                      выбрать период, за который хотите учитывать эти действия.Например, вы продаёте обувь. Рекламу можно\n                      показать людям, которые добавляли в корзину или избранное товары из этой категории за последние 14\n                      дней. Возможно, пользователи, которые попадают под этот критерий, уже совершили покупку. Поэтому вы\n                      можете уточнить настройки показа: добавить параметр «Не покупал товар из категории „Обувь“ в последние\n                      14 дней». Так вероятность того, что ваш баннер приведёт к покупке, будет выше.Чтобы запустить рекламу,\n                      создайте в кабинете ВБ.Медиа кампанию «По показам» и на шаге 4 включите «Поведенческие параметры».\n                      Эти параметры можно комбинировать с таргетированием по предполагаемым интересам, полу, возрасту и\n                      региону.Подробнее о том, как настроить таргетинг, — в инструкции «По показам».Запустить рекламу на\n                      Wildberries\n                    date: '2025-02-05T14:10:35+03:00'\n                    header: |\n                      Новые настройки кампаний в ВБ.Медиа: таргетируйте рекламу в зависимости от того, как аудитория\n                      использует сервисы Wildberries\n                    id: 7369\n                    types:\n                      - id: 4\n                        name: Маркетинг\n                  - content: |\n                      Добавили получение отчётов по текстам поисковых запросов в формате CSV. В описания методов «Создать\n                      отчёт» и «Получить отчёт» добавили описания и примеры моделей: • запросов — SearchReportTextReq, •\n                      успешных ответов (статус-код 200) — SearchReportTextRes.В ответ метода «Поисковые запросы по товару»\n                      добавили 8 полей и структуры price и medianPosition. Узнать больше можно в Журнале изменений.Эти методы\n                      доступны только с подпиской «Джем»\n                    date: '2025-02-06T18:14:58+03:00'\n                    header: Изменения в API «Аналитики и данных»\n                    id: 7373\n                    types:\n                      - id: 8\n                        name: API\n                      - id: 41\n                        name: Аналитика продавца\n        '400':\n          description: Неправильный запрос\n        '401':\n          $ref: '#/components/responses/401'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/seller-info:\n    servers:\n      - url: https://common-api.wildberries.ru\n    get:\n      operationId: getV1SellerInfo\n      x-readonly-method: true\n      x-category: commonapi\n      tags:\n        - Информация о продавце\n      security:\n        - HeaderApiKey: []\n      summary: Получить информацию о продавце\n      description: |\n        <div class=\"description_auth\">\n          Информацию о продавце можно получить с токеном любой <a href=\"/openapi/api-information#tag/authorization/Kategorii-tokenov\">категории</a>\n        </div>\n\n        Метод позволяет получать наименование продавца и ID его профиля.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 1 запрос | 1 мин | 10 запросов |\n        | Сервисный | 1 мин | 1 запрос | 1 мин | 10 запросов |\n        | Базовый с секретом | 1 мин | 1 запрос | 1 мин | 10 запросов |\n        | Базовый | 24 ч | 1 запрос | 24 ч | 1 запрос |\n        </div>\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  name:\n                    type: string\n                    description: Наименование продавца\n                  sid:\n                    format: UUID\n                    type: string\n                    description: Уникальный ID продавца на Wildberries, [находящийся в публичном поле токена](./api-information#tag/authorization/Kak-ustroen-token)\n                  tin:\n                    type: string\n                    description: ИНН\n                  tradeMark:\n                    type: string\n                    description: Торговое наименование продавца\n              example:\n                name: ИП Кружинин В. Р.\n                sid: e8923014-e233-47q8-898e-3cc86d67ea61\n                tin: '1234567890'\n                tradeMark: Flax Store\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/common/v1/rating:\n    servers:\n      - url: https://feedbacks-api.wildberries.ru\n    get:\n      operationId: getV1Rating\n      x-readonly-method: true\n      x-category: questionsandfeedback\n      x-token-types:\n        - service\n      tags:\n        - Информация о продавце\n      security:\n        - HeaderApiKey: []\n      summary: Получить рейтинг продавца\n      description: |\n        <div class=\"description_auth\">\n          Для доступа к методу используйте <a href=\"/openapi/api-information#tag/authorization/Kak-sozdat-personalnyj-bazovyj-ili-testovyj-token\">токен</a> для категории <strong>Вопросы и отзывы</strong>\n        </div>\n\n\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Сервисному</strong> токену\n        </div>\n\n        Метод возвращает пользовательский рейтинг продавца и количество отзывов.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        </div>\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/SupplierRatingModel'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/common/v1/subscriptions:\n    servers:\n      - url: https://common-api.wildberries.ru\n    get:\n      x-readonly-method: true\n      x-category: commonapi\n      operationId: getV1Subscriptions\n      x-token-types:\n        - service\n      tags:\n        - Информация о продавце\n      security:\n        - HeaderApiKey: []\n      summary: Получить информацию о подписке Джем\n      description: |\n        <div class=\"description_auth\">\n          Информацию о подписке Джем можно получить с токеном любой <a href=\"/openapi/api-information#tag/authorization/Kategorii-tokenov\">категории</a>\n        </div>\n\n\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Сервисному</strong> токену\n        </div>\n\n        Метод возвращает информацию о подписке [Джем](https://seller.wildberries.ru/monetization/jam):\n          - Если продавец никогда не подключал подписку Джем, возвращается пустой ответ `200`.\n          - Если продавец активировал и никогда не отменял подписку, возвращается:\n            - дата активации подписки `since`\n            - дата окончания текущего оплаченного периода `till`\n          - Если подписка закончилась или была отменена, но продавец подключил её повторно, возвращается:\n            - дата первой активации подписки `since`\n            - дата окончания текущего оплаченного периода `till`\n          - Если подписка неактивна, возвращается:\n            - дата первой активации подписки `since`\n            - дата окончания последнего оплаченного периода `till`\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 1 запрос | 1 мин | 10 запросов |\n        </div>\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/SubscriptionsJamInfo'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/common/v1/tariff-constructor/options:\n    servers:\n      - url: https://common-api.wildberries.ru\n    get:\n      x-readonly-method: true\n      x-category: commonapi\n      operationId: getV1TariffConstructorOptions\n      x-token-types:\n        - service\n      tags:\n        - Информация о продавце\n      security:\n        - HeaderApiKey: []\n      summary: Получить информацию об опциях Конструктора тарифов\n      description: |\n        <div class=\"description_auth\">\n          Информацию об опциях Конструктора тарифов можно получить с токеном любой <a href=\"/openapi/api-information#tag/authorization/Kategorii-tokenov\">категории</a>\n        </div>\n\n\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Сервисному</strong> токену\n        </div>\n\n        Метод возвращает информацию обо всех опциях и пакетах опций, которые продавец подключил в [Конструкторе тарифов](https://seller.wildberries.ru/tariff-constructor).<br><br>\n\n        Опции, входящие в подключённые пакеты, возвращаются в массиве `packages`. Опции, подключённые вне пакетов, возвращаются в массиве `options`.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 1 запрос | 1 мин | 10 запросов |\n        </div>\n      parameters:\n        - name: locale\n          in: query\n          schema:\n            type: string\n            default: ru\n            example: ru\n            enum:\n              - ru\n              - en\n          description: |\n            Язык полей ответа:\n              - `ru` — русский\n              - `en` — английский\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/PlanBuilderOptionsInfo'\n              examples:\n                PlanBuilderSuccess:\n                  $ref: '#/components/examples/PlanBuilderSuccess'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/PlanBuilderErrors'\n              examples:\n                PlanBuilder400:\n                  $ref: '#/components/examples/PlanBuilder400'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          $ref: '#/components/responses/403'\n        '404':\n          description: Не найдено\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/PlanBuilderErrors'\n              examples:\n                PlanBuilder404:\n                  $ref: '#/components/examples/PlanBuilder404'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/invite:\n    servers:\n      - url: https://user-management-api.wildberries.ru\n    post:\n      operationId: postV1Invite\n      x-readonly-method: false\n      x-category: usermanagement\n      x-token-types:\n        - personal\n      tags:\n        - Управление пользователями продавца\n      security:\n        - HeaderApiKey: []\n      summary: Создать приглашение для нового пользователя\n      description: |\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену\n        </div>\n\n        Метод создаёт приглашение для нового пользователя с настройкой доступов к разделам профиля продавца.<br>\n        Как выдаются права доступа:\n        - Если `access` пустой (`[]`) или не указан — по умолчанию выдаются все доступы, кроме доступов к витрине (`showcase`) и **Джем** (`changeJam`)\n        - Если в `access` указана часть разделов профиля, то кроме тех доступов, что указаны в запросе, также выдаются все доступы по умолчанию\n        - Если в `access` перечислены все возможные разделы, доступы будут выданы согласно запросу, без доступов по умолчанию\n        - Если в `access` дважды указан один и тот же раздел (`code`):\n          - при разных значениях `disabled` (`true` и `false`) доступ не будет выдан\n          - при одинаковых значениях `\"disabled\": true` доступ не будет выдан\n          - при одинаковых значениях `\"disabled\": false` доступ будет выдан\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 сек | 1 запрос | 1 сек | 5 запросов |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/createInviteRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/createInviteResponse'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/errorResponse'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          $ref: '#/components/responses/403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/users:\n    servers:\n      - url: https://user-management-api.wildberries.ru\n    get:\n      operationId: getV1Users\n      x-readonly-method: true\n      x-category: usermanagement\n      x-token-types:\n        - personal\n      tags:\n        - Управление пользователями продавца\n      security:\n        - HeaderApiKey: []\n      summary: Получить список активных или приглашённых пользователей продавца\n      description: |\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену\n        </div>\n\n        Метод возвращает список активных или приглашённых пользователей профиля продавца.<br><br>\n        Чтобы выбрать список, укажите значение параметра `isInviteOnly`:\n          - `isInviteOnly=true` — список приглашённых пользователей, которые ещё не активировали доступ\n          - `isInviteOnly=false` или не указан — список активных пользователей\n\n        По каждому пользователю можно получить:\n          - роль пользователя\n          - разделы, к которым есть доступы\n          - статус приглашения\n\n        Список приглашённых пользователей в ответе всегда отсортирован по дате создания: от новых до старых.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 сек | 1 запрос | 1 сек | 5 запросов |\n        </div>\n      parameters:\n        - in: query\n          name: limit\n          schema:\n            type: integer\n            format: int64\n            maximum: 100\n            default: 100\n          description: Количество активных или приглашённых пользователей в ответе\n        - in: query\n          name: offset\n          schema:\n            type: integer\n            format: int64\n            default: 0\n          description: |\n            Сколько элементов пропустить. Например, для значения 10 ответ начнется с 11 элемента\n        - in: query\n          name: isInviteOnly\n          schema:\n            type: boolean\n            default: false\n          description: |\n            - `true` — список приглашённых пользователей, которые ещё не активировали доступ\n            - `false` или не указан — список активных пользователей профиля продавца\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/getUsersResponse'\n              examples:\n                invitesOnly:\n                  summary: isInviteOnly=true\n                  description: Список приглашённых пользователей\n                  value:\n                    total: 2\n                    countInResponse: 2\n                    users:\n                      - id: 0\n                        role: ''\n                        position: Аналитик\n                        phone: '79998888888'\n                        email: ''\n                        isOwner: false\n                        firstName: ''\n                        secondName: ''\n                        patronymic: ''\n                        goodsReturn: false\n                        isInvitee: true\n                        inviteeInfo:\n                          phoneNumber: '79998888888'\n                          position: Аналитик\n                          inviteUuid: 00000000-0000-4000-8000-000000000001\n                          expiredAt: '2025-12-01T00:00:00Z'\n                          isActive: true\n                        access:\n                          - code: supply\n                            disabled: true\n                          - code: changeJam\n                            disabled: true\n                          - code: showcase\n                            disabled: false\n                          - code: suppliersDocuments\n                            disabled: false\n                          - code: discountPrice\n                            disabled: true\n                          - code: feedbacks\n                            disabled: false\n                          - code: questions\n                            disabled: false\n                          - code: brands\n                            disabled: true\n                          - code: pointsForReviews\n                            disabled: false\n                          - code: pinFeedbacks\n                            disabled: false\n                          - code: finance\n                            disabled: true\n                          - code: balance\n                            disabled: false\n                          - code: oldAnalyticsReports\n                            disabled: false\n                          - code: marketplace\n                            disabled: false\n                          - code: brandsFlow\n                            disabled: false\n                          - code: copyrightComplaints\n                            disabled: false\n                          - code: pretrialClaims\n                            disabled: false\n                          - code: sellersChat\n                            disabled: false\n                          - code: brandzone\n                            disabled: false\n                          - code: brandzoneSubscribe\n                            disabled: false\n                      - id: 0\n                        role: ''\n                        position: ''\n                        phone: 7999XXXX102\n                        email: ''\n                        isOwner: false\n                        firstName: ''\n                        secondName: ''\n                        patronymic: ''\n                        goodsReturn: false\n                        isInvitee: true\n                        inviteeInfo:\n                          phoneNumber: '79996666666'\n                          position: Аналитик\n                          inviteUuid: 00000000-0000-4000-8000-000000000002\n                          expiredAt: '2025-12-10T00:00:00Z'\n                          isActive: false\n                        access:\n                          - code: supply\n                            disabled: true\n                          - code: changeJam\n                            disabled: true\n                          - code: showcase\n                            disabled: false\n                          - code: suppliersDocuments\n                            disabled: false\n                          - code: discountPrice\n                            disabled: true\n                          - code: feedbacks\n                            disabled: false\n                          - code: questions\n                            disabled: false\n                          - code: brands\n                            disabled: true\n                          - code: pointsForReviews\n                            disabled: false\n                          - code: pinFeedbacks\n                            disabled: false\n                          - code: finance\n                            disabled: true\n                          - code: balance\n                            disabled: false\n                          - code: oldAnalyticsReports\n                            disabled: false\n                          - code: marketplace\n                            disabled: false\n                          - code: brandsFlow\n                            disabled: false\n                          - code: copyrightComplaints\n                            disabled: false\n                          - code: pretrialClaims\n                            disabled: false\n                          - code: sellersChat\n                            disabled: false\n                          - code: brandzone\n                            disabled: false\n                          - code: brandzoneSubscribe\n                            disabled: false\n                usersOnly:\n                  summary: isInviteOnly=false\n                  description: Список активных пользователей\n                  value:\n                    total: 2\n                    countInResponse: 2\n                    users:\n                      - id: 1001\n                        role: user\n                        position: Аналитик\n                        phone: '79999999999'\n                        email: user1@example.com\n                        isOwner: true\n                        firstName: Иван\n                        secondName: Иванов\n                        patronymic: ''\n                        goodsReturn: true\n                        isInvitee: false\n                        inviteeInfo: null\n                        access:\n                          - code: supply\n                            disabled: true\n                          - code: changeJam\n                            disabled: true\n                          - code: showcase\n                            disabled: false\n                          - code: suppliersDocuments\n                            disabled: false\n                          - code: discountPrice\n                            disabled: true\n                          - code: feedbacks\n                            disabled: false\n                          - code: questions\n                            disabled: false\n                          - code: brands\n                            disabled: true\n                          - code: pointsForReviews\n                            disabled: false\n                          - code: pinFeedbacks\n                            disabled: false\n                          - code: finance\n                            disabled: true\n                          - code: balance\n                            disabled: false\n                          - code: oldAnalyticsReports\n                            disabled: false\n                          - code: marketplace\n                            disabled: false\n                          - code: brandsFlow\n                            disabled: false\n                          - code: copyrightComplaints\n                            disabled: false\n                          - code: pretrialClaims\n                            disabled: false\n                          - code: sellersChat\n                            disabled: false\n                          - code: brandzone\n                            disabled: false\n                          - code: brandzoneSubscribe\n                            disabled: false\n                      - id: 1002\n                        role: user\n                        position: Менеджер\n                        phone: '79997777777'\n                        email: user2@example.com\n                        isOwner: false\n                        firstName: Владимир\n                        secondName: Смирнов\n                        patronymic: ''\n                        goodsReturn: true\n                        isInvitee: true\n                        inviteeInfo:\n                          phoneNumber: '79997777777'\n                          position: Менеджер\n                          inviteUuid: 00000000-0000-4000-8000-000000000001\n                          expiredAt: '2025-12-01T00:00:00Z'\n                          isActive: true\n                        access:\n                          - code: supply\n                            disabled: true\n                          - code: changeJam\n                            disabled: true\n                          - code: showcase\n                            disabled: false\n                          - code: suppliersDocuments\n                            disabled: false\n                          - code: discountPrice\n                            disabled: true\n                          - code: feedbacks\n                            disabled: false\n                          - code: questions\n                            disabled: false\n                          - code: brands\n                            disabled: true\n                          - code: pointsForReviews\n                            disabled: false\n                          - code: pinFeedbacks\n                            disabled: false\n                          - code: finance\n                            disabled: true\n                          - code: balance\n                            disabled: false\n                          - code: oldAnalyticsReports\n                            disabled: false\n                          - code: marketplace\n                            disabled: false\n                          - code: brandsFlow\n                            disabled: false\n                          - code: copyrightComplaints\n                            disabled: false\n                          - code: pretrialClaims\n                            disabled: false\n                          - code: sellersChat\n                            disabled: false\n                          - code: brandzone\n                            disabled: false\n                          - code: brandzoneSubscribe\n                            disabled: false\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/errorResponse'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          $ref: '#/components/responses/403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/users/access:\n    servers:\n      - url: https://user-management-api.wildberries.ru\n    put:\n      operationId: putV1UsersAccess\n      x-readonly-method: false\n      x-category: usermanagement\n      x-token-types:\n        - personal\n      tags:\n        - Управление пользователями продавца\n      security:\n        - HeaderApiKey: []\n      summary: Изменить права доступа пользователей\n      description: |\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену\n        </div>\n\n        Метод меняет права доступа одному или нескольким пользователям.<br>\n        <br>\n        Обновляются только права доступа, переданные в параметрах запроса. Остальные поля остаются без изменений.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 сек | 1 запрос | 1 сек | 5 запросов |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/updateUserAccessRequest'\n      responses:\n        '200':\n          description: Успешно\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/errorResponse'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          $ref: '#/components/responses/403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/user:\n    servers:\n      - url: https://user-management-api.wildberries.ru\n    delete:\n      operationId: deleteV1User\n      x-readonly-method: false\n      x-category: usermanagement\n      x-token-types:\n        - personal\n      tags:\n        - Управление пользователями продавца\n      security:\n        - HeaderApiKey: []\n      summary: Удалить пользователя\n      description: |\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену\n        </div>\n\n        Метод удаляет пользователя из [списка сотрудников продавца](/openapi/api-information#tag/sellerUserManagement/operation/getV1Users). Этому пользователю будет закрыт доступ в профиль продавца.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 сек | 1 запрос | 1 сек | 10 запросов |\n        </div>\n      parameters:\n        - in: query\n          name: deletedUserID\n          required: true\n          schema:\n            type: integer\n            format: int64\n          description: ID пользователя, которому будет закрыт доступ\n      responses:\n        '200':\n          description: Успешно\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/errorResponse'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          $ref: '#/components/responses/403'\n        '429':\n          $ref: '#/components/responses/429'\ncomponents:\n  securitySchemes:\n    HeaderApiKey:\n      type: apiKey\n      name: Authorization\n      in: header\n  schemas:\n    Access:\n      type: array\n      description: Настройки доступа к разделам профиля продавца\n      items:\n        type: object\n        required:\n          - code\n          - disabled\n        properties:\n          code:\n            type: string\n            description: |\n              Код раздела профиля продавца, к которому пользователь получит доступ:\n              * `balance` — Просмотр баланса и вывод средств\n              * `brands` — Управление брендами\n              * `changeJam` — Доступ к подключению подписки **Джем**: **А/Б тесты**, отметки на фото, автозапуски видео, сравнение карточек\n              * `discountPrice` — Изменение цен на товары, управление скидками и акциями\n              * `finance` — Финансовая аналитика. Статистика по балансу, финансовые отчёты, история платежей\n              * `showcase` — Управление витриной магазина\n              * `suppliersDocuments` — Просмотр и скачивание документов по работе с площадкой\n              * `supply` — Создание и управление поставками FBW\n              * `questions` — Просмотр и ответы на вопросы покупателей\n              * `pinFeedbacks` — Возможность закреплять и откреплять отзывы\n              * `pointsForReviews` — Баллы за отзывы\n              * `feedbacks` — Просмотр и ответы на отзывы покупателей\n              * `oldAnalyticsReports` — Отчёты\n              * `marketplace` — Свой склад\n              * `brandsFlow` — Мои бренды\n              * `copyrightComplaints` — Обращения правообладателей\n              * `pretrialClaims` — Досудебные претензии\n              * `sellersChat` — Чат с покупателями\n              * `brandzone` — Бренд-зона. Публикация изменений\n              * `brandzoneSubscribe` — Управление подпиской бренд-зоны\n            enum:\n              - balance\n              - brands\n              - changeJam\n              - discountPrice\n              - finance\n              - showcase\n              - suppliersDocuments\n              - supply\n              - questions\n              - pinFeedbacks\n              - pointsForReviews\n              - feedbacks\n              - oldAnalyticsReports\n              - marketplace\n              - brandsFlow\n              - copyrightComplaints\n              - pretrialClaims\n              - sellersChat\n              - brandzone\n              - brandzoneSubscribe\n          disabled:\n            type: boolean\n            description: |\n              * `true` — доступ к разделу запрещён\n              * `false` — доступ к разделу разрешён\n      example:\n        - code: balance\n          disabled: false\n        - code: pointsForReviews\n          disabled: false\n        - code: brands\n          disabled: true\n        - code: finance\n          disabled: true\n        - code: supply\n          disabled: true\n    getUsersResponse:\n      type: object\n      required:\n        - users\n        - total\n        - countInResponse\n      properties:\n        total:\n          type: integer\n          description: Общее количество активных или приглашённых пользователей\n        countInResponse:\n          type: integer\n          description: Количество активных или приглашённых пользователей на текущей странице\n        users:\n          type: array\n          description: Информация о пользователях\n          items:\n            type: object\n            required:\n              - id\n              - role\n              - position\n              - phone\n              - email\n              - isOwner\n              - firstName\n              - secondName\n              - patronymic\n              - goodsReturn\n              - isInvitee\n              - inviteeInfo\n              - access\n            properties:\n              id:\n                type: integer\n                description: ID пользователя\n              role:\n                type: string\n                description: |\n                  Роль пользователя:\n                    * `user` — пользователь, который активировал доступ\n                    * ` ` (пустая строка) — пользователь, который не активировал доступ\n                enum:\n                  - user\n                  - ''\n              position:\n                type: string\n                description: Должность пользователя\n              phone:\n                type: string\n                description: Номер телефона пользователя\n              email:\n                type: string\n                description: Email пользователя\n              isOwner:\n                type: boolean\n                description: Является ли пользователь владельцем профиля продавца\n              firstName:\n                type: string\n                description: Имя пользователя\n              secondName:\n                type: string\n                description: Фамилия пользователя\n              patronymic:\n                type: string\n                description: Отчество пользователя\n              goodsReturn:\n                type: boolean\n                description: Может ли пользователь одобрять возвраты товаров\n              isInvitee:\n                type: boolean\n                description: Приглашён ли пользователь\n              inviteeInfo:\n                type: object\n                nullable: true\n                description: Информация о приглашении, если пользователь приглашён\n                properties:\n                  phoneNumber:\n                    type: string\n                    description: Номер телефона приглашённого пользователя\n                  position:\n                    type: string\n                    description: Должность приглашённого пользователя\n                  inviteUuid:\n                    type: string\n                    description: ID приглашения\n                    format: UUID\n                  expiredAt:\n                    type: string\n                    format: date-time\n                    description: Дата и время окончания срока действия приглашения\n                  isActive:\n                    type: boolean\n                    description: |\n                      - `true` — приглашение активно\n                      - `false` — приглашение неактивно\n              access:\n                $ref: '#/components/schemas/Access'\n    createInviteRequest:\n      type: object\n      required:\n        - invite\n      properties:\n        access:\n          $ref: '#/components/schemas/Access'\n        invite:\n          type: object\n          required:\n            - phoneNumber\n          properties:\n            phoneNumber:\n              type: string\n              description: |\n                Номер телефона пользователя для приглашения.\n                <details><summary><strong>Поддерживаются номера телефонов из стран:</strong></summary>• Азербайджан<br>• Армения<br>• Барбадос<br>• Беларусь<br>• Бразилия<br>• Гонконг<br>• Грузия<br>• Италия<br>• Казахстан<br>• Китай<br>• Кыргызстан<br>• Макао<br>• ОАЭ<br>• Россия<br>• Сербия<br>• Таджикистан<br>• Турция<br>• Узбекистан<br>• Чехия<br>• Швеция</details>\n            position:\n              type: string\n              maxLength: 150\n              description: Должность пользователя\n      example:\n        access:\n          - code: balance\n            disabled: false\n          - code: pointsForReviews\n            disabled: false\n          - code: brands\n            disabled: true\n          - code: finance\n            disabled: true\n          - code: supply\n            disabled: true\n        invite:\n          phoneNumber: '79999999999'\n          position: Менеджер\n    createInviteResponse:\n      type: object\n      required:\n        - inviteID\n        - expiredAt\n        - isSuccess\n        - inviteUrl\n      description: Данные приглашения\n      properties:\n        inviteID:\n          type: string\n          format: uuid\n          description: ID приглашения\n        expiredAt:\n          type: string\n          format: date-time\n          description: Дата и время окончания срока действия приглашения\n        isSuccess:\n          type: boolean\n          description: |\n            - `true` — приглашение создано успешно\n            - `false` — повторите запрос\n        inviteUrl:\n          type: string\n          description: URL приглашения, по которому должен перейти пользователь\n      example:\n        inviteID: 741b8aa6-08ac-4782-8a9d-d931bcbbf608\n        expiredAt: '2025-10-06T10:56:04.335060746Z'\n        isSuccess: true\n        inviteUrl: https://seller.wildberries.ru/supplier-settings/supplier-card?inviteId=e5a813c7-65e0-4599-a550-a6b3d85661ed\n    updateUserAccessRequest:\n      type: object\n      required:\n        - usersAccesses\n      properties:\n        usersAccesses:\n          type: array\n          description: Настройки доступа для пользователя\n          items:\n            $ref: '#/components/schemas/UserAccess'\n      example:\n        usersAccesses:\n          - userId: 42334965\n            access:\n              - code: balance\n                disabled: false\n              - code: finance\n                disabled: true\n              - code: feedbacks\n                disabled: false\n          - userId: 52334965\n            access:\n              - code: balance\n                disabled: true\n              - code: changeJam\n                disabled: false\n              - code: showcase\n                disabled: false\n    UserAccess:\n      type: object\n      properties:\n        userId:\n          type: integer\n          description: ID пользователя\n        access:\n          $ref: '#/components/schemas/Access'\n    errorResponse:\n      type: object\n      required:\n        - title\n        - detail\n        - requestId\n        - origin\n        - status\n      properties:\n        title:\n          type: string\n          description: Заголовок ошибки\n        detail:\n          type: string\n          description: Детали ошибки\n        requestId:\n          type: string\n          description: ID запроса\n        origin:\n          type: string\n          description: Название внутреннего сервиса\n        status:\n          type: number\n          description: HTTP статус-код\n      example:\n        title: Bad Request\n        status: 400\n        detail: 'bad request cause: user is not in current supplier'\n        requestId: c479c04d0b576a9ba0b20fdf235004c2\n        origin: public-acl\n    SupplierRatingModel:\n      type: object\n      properties:\n        feedbackCount:\n          description: Количество отзывов\n          type: integer\n          example: 12355\n        valuation:\n          description: Рейтинг продавца\n          type: number\n          format: float\n          example: 4.55\n    SubscriptionsJamInfo:\n      type: object\n      description: Информация о подписке Джем\n      required:\n        - state\n        - activationSource\n        - level\n        - since\n        - till\n      properties:\n        state:\n          type: string\n          example: active\n          enum:\n            - active\n            - inactive\n          description: |\n            Статус подписки:\n              - `active` — активна\n              - `inactive` — истекла или отменена\n        activationSource:\n          type: string\n          enum:\n            - constructor\n            - jam\n          example: jam\n          description: |\n            Источник подключения подписки:\n              - `constructor` — покупка через раздел **Конструктор тарифов**\n              - `jam` — покупка через раздел **Подписка «Джем»**\n        level:\n          type: string\n          enum:\n            - standard\n            - advanced\n            - premium\n          example: premium\n          description: |\n            Уровень подписки:\n              - `standard`\n              - `advanced`\n              - `premium`\n        since:\n          type: string\n          format: date-time\n          example: '2026-03-16T08:38:08.056406Z'\n          description: Дата и время первой активации подписки. Не меняется при продлении или повторной активации\n        till:\n          type: string\n          format: date-time\n          example: '2026-04-25T14:44:28.393587Z'\n          description: Дата и время окончания подписки\n    PlanBuilderOptionsInfo:\n      type: object\n      required:\n        - activeOptionCount\n        - activePackageCount\n        - totalCommissionRate\n        - packages\n        - options\n      properties:\n        activeOptionCount:\n          type: number\n          format: int\n          example: 5\n          description: Количество активных опций, не включённых в пакеты\n        activePackageCount:\n          type: number\n          format: int\n          example: 2\n          description: Количество активных пакетов опций\n        totalCommissionRate:\n          type: number\n          format: float\n          example: 4.6\n          description: Итоговая комиссия за подключённые опции и пакеты, % от оборота\n        packages:\n          type: array\n          items:\n            $ref: '#/components/schemas/PlanBuilderPackage'\n          description: Подключённые пакеты опций\n        options:\n          type: array\n          items:\n            $ref: '#/components/schemas/PlanBuilderOption'\n          description: Подключённые опции\n    PlanBuilderPackage:\n      type: object\n      properties:\n        id:\n          type: string\n          format: uuid\n          example: 79861ed4-ccfd-4998-96a9-c90f8bf98bb9\n          description: ID пакета\n        slug:\n          type: string\n          example: superSeller\n          description: Код пакета\n        name:\n          type: string\n          example: Суперпродавец\n          description: Название пакета на языке из параметра `locale`\n        status:\n          type: string\n          example: active\n          enum:\n            - active\n            - pendingActivation\n            - pendingDeactivation\n          description: |\n            Статус пакета:\n              - `active` — активен\n              - `pendingActivation` — подключён, начнёт работать с 00:00 следующего дня\n              - `pendingDeactivation` — отключён, перестанет работать с 00:00 следующего дня\n        activatedAt:\n          example: '2006-01-02T15:04:05.999+03:00'\n          description: Дата активации пакета\n          type: string\n          format: date-time\n        expiresAt:\n          type: string\n          format: date-time\n          example: '2006-01-02T15:04:05.999+03:00'\n          description: Дата окончания минимального срока действия пакета. До этого дня пакет опций нельзя отключить\n        commissionRate:
        periodDuration:\n          type: number\n          format: int\n          example: 90\n          description: Минимальный срок действия опции в днях\n        promotion:\n          allOf:\n            - $ref: '#/components/schemas/PlanBuilderPromotion'\n            - description: Акция, по которой подключена опция. Не возвращается, если опция подключена без акции или срок действия акции истёк\n            - {}\n    PlanBuilderOptionShort:\n      type: object\n      properties:\n        id:\n          type: string\n          example: 4f134ae7-f768-481e-bac1-bf75d2fdc6f7\n          description: ID опции\n        slug:\n          type: string\n          example: pinReview\n          description: Код опции\n        name:\n          type: string\n          example: Закрепление отзывов и видео\n          description: Название опции на языке из параметра `locale`\n    PlanBuilderPromotion:\n      type: object\n      properties:\n        commissionRate:\n          type: number\n          format: float\n          example: 0.3\n          description: Стоимость подключения опции по акции, % от оборота\n        expiresAt:\n          type: string\n          format: date-time\n          example: '2006-01-02T15:04:05.999+03:00'\n          description: Дата окончания действия цены по акции\n    PlanBuilderErrors:\n      type: object\n      properties:\n        title:\n          type: string\n          description: Заголовок ошибки\n        detail:\n          type: string\n          description: Детали ошибки\n        code:\n          type: string\n          description: Внутренний код ошибки\n        requestId:\n          type: string\n          description: Уникальный ID запроса\n        origin:\n          type: string\n          description: ID внутреннего сервиса WB\n        status:\n          type: number\n          description: HTTP статус-код\n        errors:\n          type: array\n          description: Ошибки запроса с указанием параметров и деталей ошибок\n  examples:\n    PlanBuilderSuccess:\n      value:\n        activeOptionCount: 2\n        activePackageCount: 1\n        totalCommissionRate: 2.3\n        packages:\n          - slug: super-seller\n            name: Суперпродавец\n            status: active\n            periodDuration: 90\n            commissionRate: 0.8\n            activatedAt: '2026-03-15T00:00:00+03:00'\n            expiresAt: '2026-06-15T00:00:00+03:00'\n            options:\n              - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890\n                slug: review-pin\n                name: Закрепление отзыва\n              - id: b2c3d4e5-f6a7-8901-bcde-f12345678901\n                slug: premium-seller-status\n                name: Статус Премиум-продавца\n        options:\n          - id: c3d4e5f6-a7b8-9012-cdef-123456789012\n            slug: daily-withdrawal\n            name: Запрос вывода денег в любой день\n            status: active\n            periodDuration: 90\n            commissionRate: 1\n            activatedAt: '2026-03-15T00:00:00+03:00'\n            expiresAt: '2026-05-20T00:00:00+03:00'\n          - id: d4e5f6a7-b8c9-0123-defa-234567890123\n            slug: priority-support\n            name: Приоритетная поддержка\n            status: pendingDeactivation\n            periodDuration: 30\n            activatedAt: '2026-03-15T00:00:00+03:00'\n            expiresAt: '2026-04-10T00:00:00+03:00'\n            promotion:\n              commissionRate: 0.3\n              expiresAt: '2026-04-30T00:00:00+03:00'\n    PlanBuilder400:\n      value:\n        title: Validation failed\n        detail: 'Invalid locale value ''fr''. Allowed values: ru, en'\n        status: 400\n        origin: options-service\n        code: INVALID_LOCALE\n        requestId: abc123-def456\n        errors:\n          - field: locale\n            message: 'Must be one of: ru, en'\n    PlanBuilder404:\n      value:\n        title: Options not available\n        detail: Options are not available for this supplier\n        
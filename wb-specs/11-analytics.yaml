м запросам без учёта подменного артикула\n    SearchReportItemReq:\n      type: object\n      required:\n        - id\n        - reportType\n        - params\n      properties:\n        id:\n          description: ID отчёта в UUID-формате. Генерируется продавцом самостоятельно\n          type: string\n          format: uuid\n        reportType:\n          description: Тип отчёта `SEARCH_QUERIES_PREMIUM_REPORT_PRODUCT` — Отчёт по параметрам поиска. По артикулам WB\n          type: string\n        userReportName:\n          type: string\n          description: Название отчёта. Если не указано, сформируется автоматически\n        params:\n          description: Параметры отчёта\n          type: object\n          required:\n            - currentPeriod\n            - orderBy\n            - positionCluster\n          properties:\n            currentPeriod:\n              $ref: '#/components/schemas/Period'\n            pastPeriod:\n              $ref: '#/components/schemas/pastPeriod'\n            subjectId:\n              example: 132\n              description: ID предмета. Используйте значение `0`, чтобы получить отчёт по всем предметам\n              type: integer\n              format: int32\n            brandName:\n              example: Abikas\n              description: Бренд\n              type: string\n            tagId:\n              example: 3\n              description: ID ярлыка. Чтобы получить отчёт по всем ярлыкам, укажите значение 0\n              type: integer\n              format: int64\n            nmIds:\n              type: array\n              minItems: 0\n              maxItems: 1000\n              description: |\n                Артикулы WB, по которым составить отчёт. Оставьте пустым, чтобы получить отчёт обо всех товарах\n              items:\n                type: integer\n                format: int64\n            positionCluster:\n              $ref: '#/components/schemas/PositionCluster'\n            orderBy:\n              $ref: '#/components/schemas/OrderBy'\n            includeSubstitutedSKUs:\n              type: boolean\n              default: true\n              example: true\n              description: Показать данные по прямым запросам с [подменным артикулом](https://seller.wildberries.ru/help-center/article/A-524)\n            includeSearchTexts:\n              type: boolean\n              default: true\n              example: false\n              description: Показать данные по поисковым запросам без учёта подменного артикула\n    SearchReportTextReq:\n      type: object\n      required:\n        - id\n        - reportType\n        - params\n      properties:\n        id:\n          description: ID отчёта в UUID-формате. Генерируется продавцом самостоятельно\n          type: string\n          format: uuid\n        reportType:\n          description: Тип отчёта `SEARCH_QUERIES_PREMIUM_REPORT_TEXT` — Отчёт по текстам поисковых запросов\n          type: string\n        userReportName:\n          type: string\n          description: Название отчёта. Если не указано, сформируется автоматически\n        params:\n          description: Параметры отчёта\n          type: object\n          required:\n            - currentPeriod\n            - limit\n            - topOrderBy\n            - orderBy\n          properties:\n            currentPeriod:\n              $ref: '#/components/schemas/Period'\n            pastPeriod:\n              $ref: '#/components/schemas/pastPeriod'\n            nmIds:\n              type: array\n              minItems: 0\n              maxItems: 1000\n              description: |\n                Артикулы WB, по которым составить отчёт. Оставьте пустым, чтобы получить отчёт по всем товарам\n            subjectIds:\n              example:\n                - 64\n                - 334\n              type: array\n              description: Список ID предметов для фильтрации\n              items:\n                type: integer\n                format: int32\n            brandNames:\n              example:\n                - nike\n                - adidas\n              type: array\n              description: Список брендов для фильтрации\n              items:\n                type: string\n            tagIds:\n              example:\n                - 32\n                - 53\n              description: Список ID ярлыков для фильтрации\n              type: array\n              items:\n                type: integer\n                format: int64\n            topOrderBy:\n              example: openToCart\n              description: |\n                Фильтрация по поисковым запросам, по которым больше всего:\n                  - `openCard` — перешли в карточку\n                  - `addToCart` — добавили в корзину\n                  - `openToCart` — конверсия в корзину\n                  - `orders` — заказали товаров\n                  - `cartToOrder` — конверсия в заказ\n              type: string\n              enum:\n                - openCard\n                - addToCart\n                - openToCart\n                - orders\n                - cartToOrder\n            orderBy:\n              $ref: '#/components/schemas/OrderByGrTe'\n            includeSubstitutedSKUs:\n              type: boolean\n              default: true\n              example: true\n              description: Показать данные по прямым запросам с [подменным артикулом](https://seller.wildberries.ru/help-center/article/A-524)\n            includeSearchTexts:\n              type: boolean\n              default: true\n              example: false\n              description: Показать данные по поисковым запросам без учёта подменного артикула\n            limit:\n              $ref: '#/components/schemas/TextLimit'\n    InventoryMetricsReportReq:\n      type: object\n      required:\n        - id\n        - reportType\n        - params\n      properties:\n        id:\n          description: ID отчёта в UUID-формате. Генерируется продавцом самостоятельно\n          type: string\n          format: uuid\n        reportType:\n          description: Тип отчёта `STOCK_HISTORY_REPORT_CSV` — Отчёт по статистике остатков\n          type: string\n        userReportName:\n          type: string\n          description: Название отчёта. Если не указано, сформируется автоматически\n        params:\n          description: Параметры отчёта\n          allOf:\n            - $ref: '#/components/schemas/CommonReportFilters'\n    InventoryHistoryReportReq:\n      type: object\n      required:\n        - id\n        - reportType\n        - params\n      properties:\n        id:\n          description: ID отчёта в UUID-формате. Генерируется продавцом самостоятельно\n          type: string\n          format: uuid\n        reportType:\n          description: Тип отчёта `STOCK_HISTORY_DAILY_CSV` — Отчёт по истории остатков\n          type: string\n        userReportName:\n          type: string\n          description: Название отчёта. Если не указано, сформируется автоматически\n        params:\n          description: Параметры отчёта\n          type: object\n          properties:\n            nmIds:\n              type: array\n              description: Список артикулов WB для фильтрации\n              example:\n                - 111222333\n                - 444555666\n              items:\n                type: integer\n                format: int64\n            subjectIds:\n              type: array\n              description: Список ID предметов для фильтрации\n              example:\n                - 123\n                - 456\n              items:\n                type: integer\n                format: int32\n            brandNames:\n              type: array\n              description: Список брендов для фильтрации\n              example:\n                - Эрк\n                - Дент\n              items:\n                type: string\n            tagIds:\n              type: array\n              description: Список ID ярлыков для фильтрации\n              example:\n                - 3\n                - 4\n                - 5\n              items:\n                type: integer\n                format: int64\n            currentPeriod:\n              $ref: '#/components/schemas/PeriodInv'\n            stockType:\n              $ref: '#/components/schemas/StockType'\n            skipDeletedNm:\n              type: boolean\n              description: Скрыть удалённые товары\n              example: true\n          required:\n            - currentPeriod\n            - stockType\n            - skipDeletedNm\n    NmReportRetryReportRequest:\n      properties:\n        downloadId:\n          type: string\n          description: ID отчёта\n          format: uuid\n          example: 06eea887-9d9f-491f-b16a-bb1766fcb8d2\n    NmReportCreateReportResponse:\n      type: object\n      properties:\n        data:\n          type: string\n          description: Уведомление, что началась генерация отчёта\n          example: Началось формирование файла/отчета\n      required:\n        - data\n    NmReportGetReportsResponse:\n      type: object\n      required:\n        - data\n      properties:\n        data:\n          type: array\n          items:\n            type: object\n            required:\n              - id\n              - status\n              - name\n              - size\n              - startDate\n              - endDate\n              - createdAt\n            properties:\n              id:\n                description: ID отчёта\n                type: string\n                format: uuid\n                example: 06eae887-9d9f-491f-b16a-bb1766fcb8d2\n              createdAt:\n                type: string\n                description: Дата и время завершения генерации\n                example: '2024-06-26 20:05:32'\n              status:\n                type: string\n                description: |\n                  Статус отчёта:\n\n                  * `WAITING` — в очереди на обработку\n                  * `PROCESSING` — генерируется\n                  * `SUCCESS —` готов\n                  * `RETRY` — ожидает повторной обработки\n                  * `FAILED` — не получилось сгенерировать, сгенерируйте повторно\n                example: SUCCESS\n              name:\n                description: Название отчёта\n                type: string\n                example: Card report\n              size:\n                description: Размер отчёта, Б\n                type: integer\n                example: 123\n              startDate:\n                description: Начало периода\n                type: string\n                format: date\n                example: '2024-06-21'\n              endDate:\n                description: Конец периода\n                type: string\n                format: date\n                example: '2024-06-23'\n    NmReportRetryReportResponse:\n      type: object\n      required:\n        - data\n      properties:\n        data:\n          type: string\n          description: Уведомление, что началась повторная генерация отчёта\n          example: Retry\n    response429Download:\n      description: Слишком много запросов\n      type: object\n      properties:\n        title:\n          type: string\n          description: Заголовок ошибки\n        detail:\n          type: string\n          description: Детали ошибки\n        code:\n          type: string\n          description: Внутренний код ошибки\n        requestId:\n          type: string\n          description: Уникальный ID запроса\n        origin:\n          type: string\n          description: ID внутреннего сервиса WB\n        status:\n          type: number\n          description: HTTP статус-код\n        statusText:\n          type: string\n          description: Расшифровка HTTP статус-кода\n        timestamp:\n          type: string\n          format: date-time\n          description: Дата и время запроса\n      example:\n        title: too many requests\n        detail: limited by c122a060-a7fb-4bb4-abb0-32fd4e18d489\n        code: 07e4668e-ac2242c5c8c5-[UK-4dx7JUdskGZ]\n        requestId: 9d3c02cc698f8b041c661a7c28bed293\n        origin: s2s-api-auth-stat\n        status: 429\n        statusText: Too Many Requests\n        timestamp: '2024-09-30T06:52:38Z'\n    response429DownloadDaily:\n      type: object\n      properties:\n        title:\n          type: string\n          description: Заголовок ошибки\n        detail:\n          type: string\n          description: Детали ошибки\n        requestId:\n          type: string\n          description: Уникальный ID запроса\n        origin:\n          type: string\n          description: ID внутреннего сервиса WB\n      required:\n        - title\n        - detail\n        - requestId\n        - origin\n      example:\n        title: Too many requests\n        detail: The daily response limit has been exceeded. The maximum number is 20.\n        requestId: 51b7828b-e298-4dfa-b7cd-45ab179921d393\n        origin: analytics-open-api\n    TableGroupRequestSt:\n      allOf:\n        - $ref: '#/components/schemas/CommonReportFilters'\n        - type: object\n          properties:\n            limit:\n              example: 150\n              description: Количество групп в ответе\n              type: integer\n              format: uint32\n              maximum: 1000\n              default: 100\n            offset:\n              example: 100\n              description: После какого элемента выдавать данные\n              type: integer\n              format: uint32\n          required:\n            - offset\n    CommonReportFilters:\n      description: Общие фильтры по отчёту\n      type: object\n      properties:\n        nmIDs:\n          type: array\n          description: Список артикулов WB для фильтрации\n          example:\n            - 111222333\n            - 444555666\n          items:\n            type: integer\n            format: int64\n        subjectIDs:\n          type: array\n          description: Список ID предметов для фильтрации\n          example:\n            - 123\n            - 456\n          items:\n            type: integer\n            format: int32\n        brandNames:\n          type: array\n          description: Список брендов для фильтрации\n          example:\n            - Эрк\n            - Дент\n          items:\n            type: string\n        tagIDs:\n          type: array\n          description: Список ID ярлыков для фильтрации\n          example:\n            - 3\n            - 4\n            - 5\n          items:\n            type: integer\n            format: int64\n        currentPeriod:\n          $ref: '#/components/schemas/PeriodInv'\n        stockType:\n          $ref: '#/components/schemas/StockType'\n        skipDeletedNm:\n          type: boolean\n          description: Скрыть удалённые товары\n          example: true\n        availabilityFilters:\n          $ref: '#/components/schemas/availabilityFilters'\n        orderBy:\n          $ref: '#/components/schemas/TableOrderBy'\n      required:\n        - availabilityFilters\n        - currentPeriod\n        - stockType\n        - skipDeletedNm\n        - orderBy\n    PeriodInv:\n      type: object\n      description: Период\n      required:\n        - start\n        - end\n      properties:\n        start:\n          type: string\n          description: Дата начала периода. Не позднее `end`. Не ранее 3 месяцев от текущей даты\n          format: date\n          example: '2024-02-10'\n        end:\n          type: string\n          description: Дата окончания периода. Не ранее 3 месяцев от текущей даты\n          format: date\n          example: '2024-02-10'\n    StockType:\n      type: string\n      description: |\n        Тип складов хранения товаров:\n          - `\"\"` — все\n          - `wb` — склады WB\n          - `mp` — склады продавца\n      example: mp\n      enum:\n        - ''\n        - wb\n        - mp\n    availabilityFilters:\n      type: array\n      description: |\n        Доступность товара:\n          - `deficient` — Дефицит\n          - `actual` — Актуальный\n          - `balanced` — Баланс\n          - `nonActual` — Неактуальный\n          - `nonLiquid` — Неликвид\n          - `invalidData` — Не рассчитано\n      example:\n        - deficient\n        - balanced\n      items:\n        type: string\n        enum:\n          - deficient\n          - actual\n          - balanced\n          - nonActual\n          - nonLiquid\n          - invalidData\n    TableOrderBy:\n      type: object\n      description: Вид сортировки данных\n      properties:\n        field:\n          $ref: '#/components/schemas/TableGroupField'\n        mode:\n          $ref: '#/components/schemas/OrderByMode'\n      required:\n        - field\n        - mode\n    TableGroupField:\n      type: string\n      description: |\n        Сортировка по полю:\n          - `ordersCount` — Заказы, шт.\n          - `ordersSum` — Заказы, сумма\n          - `avgOrders` — Среднее количество заказов в день\n          - `buyoutCount` — Выкупы, шт.\n          - `buyoutSum` — Выкупы, сумма\n          - `buyoutPercent` — Процент выкупа\n          - `stockCount` — Остатки на текущий день, шт.\n          - `stockSum` — Стоимость остатков на текущий день\n          - `saleRate` — Оборачиваемость текущих остатков\n          - `avgStockTurnover` — Оборачиваемость средних остатков\n          - `toClientCount` — В пути к клиенту, шт.\n          - `fromClientCount` — В пути от клиента, шт.\n          - `minPrice` — Минимальная цена продавца со скидкой продавца (без учёта скидки WB Клуба)\n          - `maxPrice` — Максимальная цена продавца со скидкой продавца (без учёта скидки WB Клуба)\n          - `officeMissingTime` — Время отсутствия товара на складе\n          - `lostOrdersCount` — Упущенные заказы, шт.\n          - `lostOrdersSum` — Упущенные заказы, сумма\n          - `lostBuyoutsCount` — Упущенные выкупы, шт.\n          - `lostBuyoutsSum` — Упущенные выкупы, сумма\n      enum:\n        - ordersCount\n        - ordersSum\n        - avgOrders\n        - buyoutCount\n        - buyoutSum\n        - buyoutPercent\n        - stockCount\n        - stockSum\n        - saleRate\n        - avgStockTurnover\n        - toClientCount\n        - fromClientCount\n        - minPrice\n        - maxPrice\n        - officeMissingTime\n        - lostOrdersCount\n        - lostOrdersSum\n        - lostBuyoutsCount\n        - lostBuyoutsSum\n      example: avgOrders\n    OrderByMode:\n      type: string\n      description: |\n        Порядок сортировки:\n        - asc — по возрастанию\n        - desc — по убыванию\n      enum:\n        - asc\n        - desc\n      example: asc\n    TableGroupResponseSt:\n      type: object\n      properties:\n        groups:\n          $ref: '#/components/schemas/TableGroups'\n        currency:\n          $ref: '#/components/schemas/Currency'\n      required:\n        - groups\n        - currency\n    TableGroups:\n      type: array\n      description: Множество данных по группам\n      items:\n        $ref: '#/components/schemas/TableGroupItemSt'\n    TableGroupItemSt:\n      type: object\n      description: Данные по группе\n      properties:\n        subjectID:\n          type: integer\n          format: int32\n          description: ID предмета\n          example: 123456789\n        subjectName:\n          type: string\n          description: Название предмета\n          example: Кружка\n        brandName:\n          type: string\n          description: Бренд\n          example: Крутая посуда\n        tagID:\n          type: integer\n          format: int64\n          description: ID ярлыка\n          example: 12345\n        tagName:\n          type: string\n          description: Название ярлыка\n          example: Человек-Паук\n        metrics:\n          description: Метрики группы\n          allOf:\n            - $ref: '#/components/schemas/TableCommonMetrics'\n        items:\n          type: array\n          description: Товары группы\n          items:\n            $ref: '#/components/schemas/TableItemItemSt'\n      required:\n        - subjectID\n        - subjectName\n        - brandName\n        - tagID\n        - tagName\n        - metrics\n        - items\n    TableCommonMetrics:\n      type: object\n      description: Метрики\n      properties:\n        ordersCount:\n          type: integer\n          format: uint64\n          description: Заказы, шт.\n          example: 100\n        ordersSum:\n          type: integer\n          format: uint64\n          description: Заказы, сумма\n          example: 100000\n        avgOrders:\n          type: number\n          format: float64\n          description: Среднее количество заказов в день\n          example: 200\n        avgOrdersByMonth:\n          type: array\n          description: Среднее количество заказов по месяцам\n          items:\n            $ref: '#/components/schemas/FloatGraphByPeriodItem'\n        buyoutCount:\n          type: integer\n          format: uint64\n          description: Выкупы, шт.\n          example: 150\n        buyoutSum:\n          type: integer\n          format: uint64\n          description: Выкупы, сумма\n          example: 150000\n        buyoutPercent:\n          type: integer\n          format: uint32\n          description: Процент выкупа\n          example: 5\n        stockCount:\n          type: integer\n          format: uint64\n          description: Остатки на текущий день, шт.\n          example: 50\n        stockSum:\n          type: integer\n          format: uint64\n          description: Стоимость остатков на текущий день\n          example: 50000\n        saleRate:\n          description: |\n            Оборачиваемость текущих остатков. Особые случаи:\n              1. `\"hours\":-1` — бесконечная длительность\n              2. `\"hours\":-2` — нулевая длительность\n              3. `\"hours\":-3` — нерассчитанная длительность\n          type: object\n          properties:\n            days:\n              type: integer\n              format: int32\n              example: 5\n              description: Количество дней\n            hours:\n              type: integer\n              format: int32\n              example: 15\n              description: Количество часов\n          required:\n            - days\n            - hours\n        avgStockTurnover:\n          description: |\n            Оборачиваемость средних остатков. Особые случаи:\n              1. `\"hours\":-1` — бесконечная длительность\n              2. `\"hours\":-2` — нулевая длительность\n              3. `\"hours\":-3` — нерассчитанная длительность\n          type: object\n          properties:\n            days:\n              type: integer\n              format: int32\n              example: 5\n              description: Количество дней\n            hours:\n              type: integer\n              format: int32\n              example: 15\n              description: Количество часов\n          required:\n            - days\n            - hours\n        toClientCount:\n          type: integer\n          format: uint64\n          description: В пути к клиенту, шт.\n          example: 20\n        fromClientCount:\n          type: integer\n          format: uint64\n          description: В пути от клиента, шт.\n          example: 30\n        officeMissingTime:\n          description: |\n            Время отсутствия товара на складе. Особые случаи:\n              1. `\"hours\":-1` — бесконечная длительность\n              2. `\"hours\":-2` — нулевая длительность\n              3. `\"hours\":-3` — нерассчитанная длительность\n              4. `\"hours\":-4` — отсутствие в течение всего периода\n          type: object\n          properties:\n            days:\n              type: integer\n              format: int32\n              example: 5\n              description: Количество дней\n            hours:\n              type: integer\n              format: int32\n              example: 15\n              description: Количество часов\n          required:\n            - days\n            - hours\n        lostOrdersCount:\n          type: number\n          format: float64\n          description: |\n            Упущенные заказы, шт. Особые случаи:\n              1. Значение меньше `0` и не равно `-2` — значение не рассчитано\n              2. Значение `-2` — нулевое значение\n          example: 1550.52\n        lostOrdersSum:\n          type: number\n          format: float64\n          description: |\n            Упущенные заказы, сумма. Особые случаи:\n              1. Значение меньше `0` и не равно `-2` — значение не рассчитано\n              2. Значение `-2` — нулевое значение\n          example: 155000.25\n        lostBuyoutsCount:\n          type: number\n          format: float64\n          description: |\n            Упущенные выкупы, шт. Особые случаи:\n              1. Значение меньше `0` и не равно `-2` — значение не рассчитано\n              2. Значение `-2` — нулевое значение\n          example: 123.55\n        lostBuyoutsSum:\n          type: number\n          format: float64\n          description: |\n            Упущенные выкупы, сумма. Особые случаи:\n              1. Значение меньше `0` и не равно `-2` — значение не рассчитано\n              2. Значение `-2` — нулевое значение\n          example: 225555.15\n      required:\n        - ordersCount\n        - ordersSum\n        - buyoutCount\n        - buyoutSum\n        - buyoutPercent\n        - avgOrders\n        - avgOrdersByMonth\n        - stockCount\n        - stockSum\n        - saleRate\n        - avgStockTurnover\n        - toClientCount\n        - fromClientCount\n        - officeMissingTime\n        - lostOrdersCount\n        - lostOrdersSum\n        - lostBuyoutsCount\n        - lostBuyoutsSum\n    FloatGraphByPeriodItem:\n      type: object\n      description: Среднее количество заказов за месяц\n      properties:\n        start:\n          type: string\n          format: date\n          description: Начало месяца\n          example: '2025-01-01'\n        end:\n          type: string\n          format: date\n          description: Конец месяца\n          example: '2025-01-31'\n        value:\n          type: number\n          format: float64\n          description: Среднее количество заказов\n          example: 25.55\n      required:\n        - start\n        - end\n        - value\n    TableItemItemSt:\n      type: object\n      description: Данные по товару\n      properties:\n        nmID:\n          type: integer\n          description: Артикул WB\n          example: 123456789\n          format: int64\n        isDeleted:\n          type: boolean\n          description: Является ли товар удалённым\n          example: false\n        subjectName:\n          type: string\n          description: Название предмета\n          example: Принтеры\n        name:\n          type: string\n          description: Название товара\n          example: Печатник 3000\n        vendorCode:\n          type: string\n          description: Артикул продавца\n          example: pechatnik3000\n        brandName:\n          type: string\n          description: Бренд\n          example: Компик\n        mainPhoto:\n          type: string\n          description: Ссылка на главное фото\n          example: https://basket-12.wbbasket.ru/vol1788/part178840/178840836/images/c246x328/1.webp\n        hasSizes:\n          type: boolean\n          description: Является ли товар размерным. Неразмерный товар имеет единственный размер, с `\"techSize\":\"0\"`\n          example: true\n        metrics:\n          description: Метрики товара\n          allOf:\n            - $ref: '#/components/schemas/TableCommonMetrics'\n            - type: object\n              properties:\n                currentPrice:\n                  type: object\n                  description: Текущая цена\n                  properties:\n                    minPrice:\n                      type: integer\n                      format: uint64\n                      description: Минимальная цена продавца со скидкой продавца (без учёта скидки WB Клуба)\n                      example: 50\n                    maxPrice:\n                      type: integer\n                      format: uint64\n                      description: Максимальная цена продавца со скидкой продавца (без учёта скидки WB Клуба)\n                      example: 100\n                  required:\n                    - minPrice\n                    - maxPrice\n                availability:\n                  type: string\n                  description: |\n                    Доступность товара:\n                      - `deficient` — Дефицит\n                      - `actual` — Актуальный\n                      - `balanced` — Баланс\n                      - `nonActual` — Неактуальный\n                      - `nonLiquid` — Неликвид\n                      - `invalidData` — Не рассчитано\n                  example: deficient\n                  enum:\n                    - deficient\n                    - actual\n                    - balanced\n                    - nonActual\n                    - nonLiquid\n                    - invalidData\n              required:\n                - currentPrice\n                - availability\n      required:\n        - nmID\n        - isDeleted\n        - subjectName\n        - name\n        - vendorCode\n        - brandName\n        - mainPhoto\n        - hasSizes\n        - metrics\n    TableItemRequest:\n      description: Параметры запроса об остатках по товарам\n      allOf:\n        - $ref: '#/components/schemas/CommonItemFilters'\n        - type: object\n          properties:\n            limit:\n              example: 150\n              description: Количество товаров в ответе\n              type: integer\n              format: uint32\n              maximum: 1000\n              default: 100\n            offset:\n              example: 100\n              description: После какого элемента выдавать данные\n              type: integer\n              format: uint32\n          required:\n            - offset\n    CommonItemFilters:\n      type: object\n      description: Общие фильтры по товару\n      properties:\n        nmIDs:\n          type: array\n          description: Список артикулов WB для фильтрации\n          example:\n            - 111222333\n            - 444555666\n          items:\n            type: integer\n            format: int64\n        subjectID:\n          type: integer\n          description: ID предмета\n          example: 123456\n          format: int32\n        brandName:\n          type: string\n          description: Бренд\n          example: Спортик\n        tagID:\n          type: integer\n          description: ID ярлыка\n          example: 25345\n          format: int64\n        currentPeriod:\n          $ref: '#/components/schemas/PeriodInv'\n        stockType:\n          $ref: '#/components/schemas/StockType'\n        skipDeletedNm:\n          type: boolean\n          description: Скрыть удалённые товары\n          example: true\n        orderBy:\n          $ref: '#/components/schemas/TableOrderBy'\n        availabilityFilters:\n          $ref: '#/components/schemas/availabilityFilters'\n      required:\n        - currentPeriod\n        - stockType\n        - skipDeletedNm\n        - orderBy\n        - availabilityFilters\n    TableItemResponse:\n      type: object\n      properties:\n        items:\n          type: array\n          description: Множество данных по товарам\n          items:\n            $ref: '#/components/schemas/TableItemItemSt'\n        currency:\n          $ref: '#/components/schemas/Currency'\n      required:\n        - items\n        - currency\n    TableSizeRequest:\n      allOf:\n        - $ref: '#/components/schemas/CommonSizeFilters'\n        - description: Параметры запроса об остатках по размерам товара\n        - {}\n    CommonS
  3. `\"hours\":-3` — нерассчитанная длительность\n          type: object\n          properties:\n            days:\n              type: integer\n              format: int32\n              example: 5\n              description: Количество дней\n            hours:\n              type: integer\n              format: int32\n              example: 15\n              description: Количество часов\n          required:\n            - days\n            - hours\n        toClientCount:\n          type: integer\n          format: uint64\n          description: В пути к клиенту, шт.\n          example: 30\n        fromClientCount:\n          type: integer\n          format: uint64\n          description: В пути от клиента, шт.\n          example: 40\n      required:\n        - stockCount\n        - stockSum\n        - saleRate\n        - toClientCount\n        - fromClientCount\n    ItemsRequest:\n      type: object\n      properties:\n        selectedPeriod:\n          allOf:\n            - type: object\n              description: Запрашиваемый период\n            - $ref: '#/components/schemas/DatePeriod'\n        pastPeriod:\n          allOf:\n            - type: object\n              description: Период для сравнения\n            - $ref: '#/components/schemas/DatePeriod'\n        nmIds:\n          type: array\n          minItems: 0\n          maxItems: 1000\n          description: |\n            Артикулы WB, по которым нужно составить отчёт. Оставьте пустым, чтобы получить отчёт обо всех товарах\n          example:\n            - 1234567\n          items:\n            type: integer\n            format: uint64\n        brandNames:\n          example:\n            - nike\n            - adidas\n          type: array\n          items:\n            type: string\n          description: Список брендов для фильтрации\n        subjectIds:\n          example:\n            - 64\n            - 334\n          type: array\n          description: Список ID предметов для фильтрации\n        
array\n          items:\n            type: string\n          description: Список брендов для фильтрации\n        subjectIds:\n          example:\n            - 64\n            - 334\n          type: array\n          description: Список ID предметов для фильтрации\n          items:\n            type: integer\n            format: uint64\n        tagIds:\n          type: array\n          example:\n            - 32\n            - 53\n          description: Список ID ярлыков для фильтрации\n          items:\n            type: integer\n            format: uint64\n        skipDeletedNm:\n          description: Скрыть удалённые товары\n          type: boolean\n          example: false\n        aggregationLevel:\n          $ref: '#/components/schemas/Level'\n      required:\n        - selectedPeriod\n    ItemsResponse:\n      properties:\n        products:\n          description: Список карточек товаров\n          type: array\n          items:\n            type: object\n            properties:\n              product:\n                allOf:\n                  - type: object\n                    description: Карточка товара\n                  - $ref: '#/components/schemas/Item'\n              statistic:\n                allOf:\n                  - type: object\n                    description: Статистика\n                  - $ref: '#/components/schemas/Statistics'\n            required:\n              - product\n              - statistic\n        currency:\n          $ref: '#/components/schemas/Currency'\n      required:\n        - products\n        - currency\n    ItemHistoryResponse:\n      type: array\n      items:\n        type: object\n        required:\n          - product\n          - history\n          - currency\n        properties:\n          product:\n            allOf:\n              - description: Карточка товара\n                type: object\n              - $ref: '#/components/schemas/HistoryItem'\n          history:\n            type: array\n            description: Статистика за период\n            items:\n              $ref: '#/components/schemas/History'\n          currency:\n            $ref: '#/components/schemas/Currency'\n    GroupedHistoryResponse:\n      type: array\n      description: Статистика\n      items:\n        type: object\n        properties:\n          product:\n            allOf:\n              - description: Карточка товара\n                type: object\n              - $ref: '#/components/schemas/HistoryItem'\n          history:\n            type: array\n            description: Статистика за период\n            items:\n              $ref: '#/components/schemas/History'\n          currency:\n            $ref: '#/components/schemas/Currency'\n        required:\n          - history\n          - product\n          - currency\n    Item:\n      properties:\n        nmId:\n          example: 268913787\n          description: Артикул WB\n          type: integer\n          format: int64\n        title:\n          type: string\n          example: Кроссовки для бега\n          description: Название карточки товара\n          format: int64\n        vendorCode:\n          type: string\n          example: '12345456'\n          description: Артикул продавца\n        brandName:\n          type: string\n          description: Бренд\n          example: Demix\n        subjectId:\n          type: integer\n          format: uint64\n          example: 105\n          description: ID предмета\n        subjectName:\n          type: string\n          example: Кроссовки\n          description: Название предмета\n        tags:\n          type: array\n          items:\n            $ref: '#/components/schemas/Tag'\n          description: Ярлыки\n        productRating:\n          type: number\n          example: 4.5\n          format: float32\n          description: Оценка карточки\n        feedbackRating:\n          type: number\n          example: 4\n          format: float32\n          description: Оценка пользователей\n        stocks:\n          type: object\n          description: Остатки\n          properties:\n            wb:\n              type: integer\n              format: uint32\n              description: Общее количество остатков на складах WB на текущий день, шт.\n              example: 0\n            mp:\n              type: integer\n              format: uint32\n              description: Общее количество остатков на складах продавца на текущий день, шт.\n              example: 0\n            balanceSum:\n              type: integer\n              format: uint32\n              description: Сумма остатков на складах на текущий день, шт.\n              example: 0\n          required:\n            - wb\n            - mp\n            - balanceSum\n      required:\n        - nmId\n        - title\n        - vendorCode\n        - brandName\n        - subjectId\n        - subjectName\n        - tags\n        - productRating\n        - feedbackRating\n        - stocks\n    HistoryItem:\n      properties:\n        nmId:\n          example: 268913787\n          description: Артикул WB\n          type: integer\n          format: int64\n        title:\n          type: string\n          example: Кроссовки для бега\n          description: Название карточки товара\n          format: int64\n        vendorCode:\n          type: string\n          example: '12345456'\n          description: Артикул продавца\n        brandName:\n          type: string\n          description: Бренд\n          example: Demix\n        subjectId:\n          type: integer\n          format: uint64\n          example: 105\n          description: ID предмета\n        subjectName:\n          type: string\n          example: Кроссовки\n          description: Название предмета\n      required:\n        - nmId\n        - title\n        - vendorCode\n        - brandName\n        - subjectId\n        - subjectName\n    Tag:\n      type: object\n      description: Ярлык\n      properties:\n        id:\n          description: ID ярлыка\n          type: integer\n          format: uint64\n          example: 1\n        name:\n          type: string\n          description: Название ярлыка\n          example: Обувь\n      required:\n        - id\n        - name\n    Statistics:\n      properties:\n        selected:\n          allOf:\n            - type: object\n              description: Запрашиваемый период\n            - $ref: '#/components/schemas/Statistic'\n        past:\n          allOf:\n            - type: object\n              description: Период для сравнения\n            - $ref: '#/components/schemas/Statistic'\n        comparison:\n          allOf:\n            - type: object\n              description: Сравнение\n            - $ref: '#/components/schemas/Comparison'\n      required:\n        - selected\n    Conversions:\n      properties:\n        addToCartPercent:\n          description: Конверсия в корзину. Какой процент посетителей, открывших карточку товара, добавили товар в корзину, %\n          type: integer\n          format: int\n          example: 19\n        cartToOrderPercent:\n          description: Конверсия в заказ. Какой процент посетителей, добавивших товар в корзину, сделали заказ, %\n          type: integer\n          format: int\n          example: 65\n        buyoutPercent:\n          type: integer\n          format: int\n          description: Процент выкупа. Какой процент посетителей, заказавших товар, его выкупили. Без учёта товаров, которые еще доставляются покупателю, %\n      required:\n        - addToCartPercent\n        - cartToOrderPercent\n        - buyoutPercent\n    Statistic:\n      properties:\n        period:\n          allOf:\n            - description: Даты периода\n            - $ref: '#/components/schemas/DatePeriod'\n        openCount:\n          type: integer\n          format: uint32\n          example: 45\n          description: Количество переходов в карточку товара\n        cartCount:\n          description: Положили в корзину, шт.\n          type: integer\n          format: int32\n          example: 34\n        orderCount:\n          type: integer\n          format: uint32\n          description: Заказали товаров, шт.\n          example: 19\n        orderSum:\n          type: integer\n          format: uint32\n          description: Заказали на сумму\n          example: 1262\n        buyoutCount:\n          type: integer\n          format: uint32\n          description: Выкупили товаров, шт.\n          example: 19\n        buyoutSum:\n          type: integer\n          format: uint32\n          description: Выкупили на сумму\n          example: 1262\n        cancelCount:\n          type: integer\n          format: uint32\n          description: Отменили и вернули товаров, шт.\n          example: 0\n        cancelSum:\n          type: integer\n          format: uint32\n          description: Отменили и вернули на сумму\n          example: 0\n        avgPrice:\n          type: integer\n          format: uint32\n          description: Средняя цена\n          example: 1262\n        avgOrdersCountPerDay:\n          type: number\n          format: float64\n          description: Среднее количество заказов в день, шт.\n          example: 0.04\n        shareOrderPercent:\n          type: number\n          format: float64\n          description: Доля в выручке\n          example: 3\n        addToWishlist:\n          type: integer\n          description: Добавили в **Отложенные**\n          example: 455\n        timeToReady:\n          allOf:\n            - description: Среднее время доставки\n              type: object\n            - $ref: '#/components/schemas/TimeToReady'\n        localizationPercent:\n          type: integer\n          description: Локальные заказы в рамках одного региона. [На данный момент](https://dev.wildberries.ru/release-notes?id=570) может быть только `100`\n          example: 100\n        wbClub:\n          allOf:\n            - description: Статистика WB Клуба\n              type: object\n            - $ref: '#/components/schemas/WbClubMetrics'\n        conversions:\n          allOf:\n            - description: Конверсии\n              type: object\n            - $ref: '#/components/schemas/Conversions'\n      required:\n        - period\n        - openCount\n        - cartCount\n        - orderCount\n        - orderSum\n        - buyoutCount\n        - buyoutSum\n        - cancelCount\n        - cancelSum\n        - avgPrice\n        - avgOrdersCountPerDay\n        - shareOrderPercent\n        - addToWishlist\n        - timeToReady\n        - localizationPercent\n        - wbClub\n        - conversions\n    Comparison:\n      required:\n        - openCountDynamic\n        - cartCountDynamic\n        - orderCountDynamic\n        - orderSumDynamic\n        - buyoutCountDynamic\n        - buyoutSumDynamic\n        - cancelCountDynamic\n        - cancelSumDynamic\n        - avgOrdersCountPerDayDynamic\n        - avgPriceDynamic\n        - shareOrderPercentDynamic\n        - addToWishlistDynamic\n        - timeToReadyDynamic\n        - localizationPercentDynamic\n        - wbClubDynamic\n        - conversions\n      properties:\n        openCountDynamic:\n          type: integer\n          format: int\n          description: Динамика переходов в карточку товара\n          example: 10\n        cartCountDynamic:\n          type: integer\n          format: int\n          description: Динамика добавлений в корзину\n          example: 30\n        orderCountDynamic:\n          type: integer\n          format: int\n          description: Динамика количества заказов\n          example: -100\n        orderSumDynamic:\n          type: integer\n          format: int\n          description: Динамика суммы заказов\n          example: -100\n        buyoutCountDynamic:\n          type: integer\n          format: int\n          description: Динамика выкупов\n          example: -100\n        buyoutSumDynamic:\n          type: integer\n          format: int\n          description: Динамика суммы выкупов\n          example: -100\n        cancelCountDynamic:\n          type: integer\n          format: int\n          description: Динамика отмен и возвратов товаров\n          example: 0\n        cancelSumDynamic:\n          type: integer\n          format: int\n          description: Динамика сумм отмен и возвратов товаров\n          example: 0\n        avgOrdersCountPerDayDynamic:\n          type: integer\n          format: int\n          example: 0\n          description: Динамика среднего количества заказов в день\n        avgPriceDynamic:\n          type: integer\n          format: int\n          example: -100\n          description: Динамика средней цены на товары. Учитываются скидки для акций\n        shareOrderPercentDynamic:\n          type: integer\n          format: int\n          description: Динамика доли в выручке\n          example: -80\n        addToWishlistDynamic:\n          type: integer\n          format: int\n          description: Динамика добавлений товара в избранное\n          example: 60\n        timeToReadyDynamic:\n          allOf:\n            - description: Динамика среднего времени доставки\n              type: object\n            - $ref: '#/components/schemas/TimeToReady'\n        localizationPercentDynamic:\n          type: integer\n          format: int\n          description: Динамика локальных заказов в рамках одного региона. [На данный момент](https://dev.wildberries.ru/release-notes?id=570) может быть только `0`\n          example: 0\n        wbClubDynamic:\n          allOf:\n            - description: Динамика заказов с WB Клубом\n              type: object\n            - $ref: '#/components/schemas/WbClubMetricsDynamic'\n        conversions:\n          allOf:\n            - description: Конверсии\n              type: object\n            - $ref: '#/components/schemas/Conversions'\n    WbClubMetrics:\n      properties:\n        orderCount:\n          type: integer\n          format: uint32\n          description: Заказали товаров с WB Клубом, шт.\n          example: 19\n        orderSum:\n          type: integer\n          format: uint32\n          description: Заказали с WB Клубом на сумму\n          example: 1262\n        buyoutSum:\n          type: integer\n          format: uint32\n          description: Выкупили с WB Клубом на сумму\n          example: 1262\n        buyoutCount:\n          type: integer\n          format: uint32\n          description: Выкупили товаров с WB Клубом, шт.\n          example: 19\n        cancelSum:\n          type: integer\n          format: uint32\n          description: Отменили и вернули с WB Клубом на сумму\n          example: 0\n        cancelCount:\n          type: integer\n          format: uint32\n          description: Отменили и вернули товаров с WB Клубом, шт.\n          example: 0\n        avgPrice:\n          type: integer\n          format: uint32\n          description: Средняя цена с WB Клубом\n          example: 1262\n        buyoutPercent:\n          type: integer\n          format: uint32\n          description: Процент выкупа с WB Клубом\n          example: 43\n        avgOrderCountPerDay:\n          type: number\n          format: float64\n          description: Среднее количество заказов с WB Клубом в день, шт.\n          example: 0.04\n      required:\n        - orderCount\n        - orderSum\n        - buyoutSum\n        - buyoutCount\n        - cancelSum\n        - cancelCount\n        - avgPrice\n        - buyoutPercent\n        - avgOrderCountPerDay\n    WbClubMetricsDynamic:\n      properties:\n        orderCount:\n          type: integer\n          format: int\n          description: Динамика количества заказов с WB Клубом\n          example: -100\n        orderSum:\n          type: integer\n          format: int\n          description: Динамика суммы заказов с WB Клубом\n          example: -100\n        buyoutSum:\n          type: integer\n          format: int\n          description: Динамика суммы выкупов с WB Клубом\n          example: -100\n        buyoutCount:\n          type: integer\n          format: int\n          description: Динамика выкупов с WB Клубом\n          example: -100\n        cancelSum:\n          type: integer\n          format: int\n          description: Динамика сумм отмен и возвратов товаров с WB Клубом\n          example: 0\n        cancelCount:\n          type: integer\n          format: int\n          description: Динамика отмен и возвратов товаров с WB Клубом\n          example: 0\n        avgPrice:\n          type: integer\n          format: int\n          example: -100\n          description: Динамика средней цены на товары с WB Клубом\n        buyoutPercent:\n          type: integer\n          format: int\n          description: Динамика процента выкупа с WB Клубом\n          example: 43\n        avgOrderCountPerDay:\n          type: number\n          format: int\n          description: Динамика среднего количества заказов с WB Клубом в день\n          example: 0.04\n      required:\n        - orderCount\n        - orderSum\n        - buyoutSum\n        - buyoutCount\n        - cancelSum\n        - cancelCount\n        - avgPrice\n        - buyoutPercent\n        - avgOrderCountPerDay\n    TimeToReady:\n      properties:\n        days:\n          type: integer\n          description: Дни\n          example: 1\n        hours:\n          type: integer\n          description: Часы\n          example: 8\n        mins:\n          type: integer\n          description: Минуты\n          example: 34\n      required:\n        - days\n        - hours\n        - mins\n    History:\n      type: object\n      properties:\n        date:\n          type: string\n          format: date\n          example: '2024-10-23'\n          description: Дата сбора статистики\n        openCount:\n          type: integer\n          format: uint32\n          example: 45\n          description: Количество переходов в карточку товара\n        cartCount:\n          type: integer\n          format: uint32\n          example: 34\n          description: Положили в корзину, шт.\n        orderCount:\n          type: integer\n          format: uint32\n          description: Заказали товаров, шт.\n          example: 19\n        orderSum:\n          type: integer\n          format: uint32\n          description: Заказали на сумму\n          example: 1262\n        buyoutCount:\n          type: integer\n          format: uint32\n          description: Выкупили товаров, шт.\n          example: 19\n        buyoutSum:\n          type: integer\n          format: uint32\n          description: Выкупили на сумму\n          example: 1262\n        buyoutPercent:\n          type: integer\n          format: uint32\n          description: Процент выкупа\n          example: 35\n        addToCartConversion:\n          type: integer\n          format: uint32\n          description: Конверсия в корзину. Какой процент посетителей, открывших карточку товара, добавили товар в корзину, %\n          example: 43\n        cartToOrderConversion:\n          type: integer\n          format: uint32\n          description: Конверсия в заказ. Какой процент посетителей, добавивших товар в корзину, сделали заказ\n        addToWishlistCount:\n          type: integer\n          format: uint32\n          description: Количество добавлений товара в **Отложенные**\n      required:\n        - date\n        - openCount\n        - cartCount\n        - orderCount\n        - orderSum\n        - buyoutCount\n        - buyoutSum\n        - buyoutPercent\n        - addToCartConversion\n        - cartToOrderConversion\n        - addToWishlistCount\n    DatePeriod:\n      required:\n        - start\n        - end\n      properties:\n        start:\n          type: string\n          format: date\n          description: Начало периода\n          example: '2023-06-01'\n        end:\n          type: string\n          format: date\n          description: Конец периода\n          example: '2024-03-01'\n    Level:\n      type: string\n      example: day\n      enum:\n        - day\n        - week\n      default: day\n      description: |\n        Тип агрегации. Если не указано, то по умолчанию используется агрегация по дням. <br> Доступные уровни агрегации `day`, `week`\n    OrderBy:\n      type: object\n      description: Параметры сортировки\n      properties:\n        field:\n          type: string\n          description: |\n            Поле для сортировки:\n              - `openCard` — Перешли в карточку\n              - `addToCart` — Положили в корзину\n              - `orderCount` — Заказали товаров, шт\n              - `orderSum` — Заказали на сумму\n              - `buyoutCount` — Выкупили товаров, шт\n              - `buyoutSum` — Выкупили на сумму\n              - `cancelCount` — Отменили и вернули товаров, шт\n              - `cancelSum` — Отменили и вернули на сумму\n              - `avgPrice` — Средняя цена\n              - `stockMpQty` — Остатки на складах продавца, шт\n              - `stockWbQty` — Остатки на складах WB, шт\n              - `shareOrderPercent` — Доля в выручке\n              - `addToWishlist` — Добавили в **Отложенные**\n              - `timeToReady` — Среднее время доставки\n              - `localizationPercent` — Локальные заказы в рамках одного региона\n              - `wbClub.orderCount` — Заказали товаров с WB Клубом, шт\n              - `wbClub.orderSum` — Заказали с WB Клубом на сумму\n              - `wbClub.buyoutSum` — Выкупили товаров с WB Клубом, шт\n              - `wbClub.buyoutCount` — Процент выкупа с WB Клубом\n              - `wbClub.cancelSum` — Отменили и вернули товаров с WB Клубом на сумму\n              - `wbClub.avgPrice` — Средняя цена с WB Клубом\n              - `wbClub.buyoutPercent` — Процент выкупа с WB Клубом\n              - `wbClub.avgOrderCountPerDay` — Среднее количество заказов в день с WB Клубом, шт\n              - `wbClub.cancelCount` — Отменили и вернули товаров с WB Клубом, шт\n          enum:\n            - openCard\n            - addToCart\n            - orderCount\n            - orderSum\n            - buyoutCount\n            - buyoutSum\n            - cancelCount\n            - cancelSum\n            - avgPrice\n            - stockMpQty\n            - stockWbQty\n            - shareOrderPercent\n            - addToWishlist\n            - timeToReady\n            - localizationPercent\n            - wbClub.orderCount\n            - wbClub.orderSum\n            - wbClub.buyoutSum\n            - wbClub.cancelSum\n            - wbClub.buyoutCount\n            - wbClub.avgPrice\n            - wbClub.buyoutPercent\n            - wbClub.avgOrderCountPerDay\n            - wbClub.cancelCount\n          default: openCard\n          example: openCard\n        mode:\n          type: string\n          enum:\n            - asc\n            - desc\n          default: desc\n          description: |\n            Порядок сортировки:\n              - `asc` — по возрастанию\n              - `desc` — по убыванию\n      required:\n        - field\n        - mode\n    InventoryRequest:\n      description: Параметры запроса текущих остатков на складах WB\n      type: object\n      properties:\n        nmIds:\n          type: array\n          description: Артикулы WB\n          minItems: 0\n          maxItems: 1000\n          example:\n            - 111222333\n            - 47254354\n          items:\n            type: integer\n            format: int64\n        chrtIds:\n          type: array\n          description: ID размеров. Используется только для указанных в массиве `nmIds` артикулов\n          example:\n            - 111222333\n            - 91663228\n          items:\n            type: integer\n            format: int64\n        limit:\n          example: 250000\n          description: Количество строк в ответе\n          type: integer\n          format: uint32\n          maximum: 250000\n          default: 250000\n        offset:\n          example: 500000\n          description: Сколько элементов пропустить. Например, для значения `10` ответ начнётся с 11 элемента\n          type: integer\n          format: uint32\n          default: 0\n    InventoryWbResponse:\n      description: Текущие остатки товаров на складах WB\n      type: object\n      required:\n        - items\n      properties:\n        items:\n          description: Остатки товаров на складах WB по размерам\n          type: array\n          items:\n            type: object\n            properties:\n              nmId:\n                type: integer\n                description: Артикул WB\n                example: 47254354\n                format: int64\n              chrtId:\n                type: integer\n                description: ID размера\n                example: 91663228\n                format: int64\n              warehouseId:\n                type: integer\n                description: ID склада. [На данный момент](https://dev.wildberries.ru/release-notes?id=570) может быть только `-999999`\n                example: -999999\n                format: int64\n              warehouseName:\n                type: string\n                description: Название склада. [На данный момент](https://dev.wildberries.ru/release-notes?id=570) может быть только `Склад WB`\n                example: Склад WB\n              regionName:\n                type: string\n                description: Регион отгрузки. [На данный момент](https://dev.wildberries.ru/release-notes?id=570) может быть только `Склад WB`\n                example: Склад WB\n              quantity:\n                type: integer\n                description: Количество товара на складе, доступное клиентам для добавления в корзину\n                example: 43\n                format: uint64\n              inWayToClient:\n                type: integer\n                description: В пути к клиенту\n                example: 14\n                format: uint64\n              inWayFromClient:\n                type: integer\n                description: В пути от клиента\n                example: 11\n                format: uint64\n            required:\n              - nmId\n              - chrtId\n              - warehouseId\n              - warehouseName\n              - regionName\n              - quantity\n              - inWayToClient\n              - inWayFromClient\n    InventorySellerResponse:\n      description: Текущие остатки товаров на складах продавца\n      type: object\n      required:\n        - items\n      properties:\n        items:\n          description: Остатки товаров на складах продавца по размерам\n          type: array\n          items:\n            type: object\n            properties:\n              nmId:\n                type: integer\n                description: Артикул WB\n                example: 47254354\n                format: int64\n              chrtId:\n                type: integer\n                description: ID размера\n                example: 91663228\n                format: int64\n              warehouseId:\n                type: integer\n                description: ID склада\n                example: 123456\n                format: int64\n              warehouseName:\n                type: string\n                description: Название склада\n                example: склад продавца Иркутск\n              regionName:\n                type: string\n                description: Регион отгрузки\n                example: Дальневосточный и Сибирский\n              quantity:\n                type: integer\n                description: Количество товара на складе, доступное клиентам для добавления в корзину\n                example: 43\n                format: uint64\n            required:\n              - nmId\n              - chrtId\n              - warehouseId\n              - warehouseName\n              - regionName\n              - quantity\n    ItemRatingRequest:\n      type: object\n      required:\n        - currentPeriod\n        - orderBy\n        - offset\n      description: Параметры запроса\n      properties:\n        currentPeriod:\n          $ref: '#/components/schemas/PeriodItemRating'\n        pastPeriod:\n          $ref: '#/components/schemas/PastPeriodItemRating'\n        nmIds:\n          example:\n            - 162579635\n            - 166699779\n          type: array\n          maxItems: 50\n          items:\n            type: integer\n            format: int32\n          description: Список артикулов WB для фильтрации\n        subjectIds:\n          example:\n            - 232\n            - 1364\n          type: array\n          maxItems: 50\n          items:\n            type: integer\n            format: int32\n          description: Список ID предметов для фильтрации\n        brandNames:\n          example:\n            - Abikas\n            - Tike\n          type: array\n          maxItems: 50\n          items:\n            type: string\n          description: Список брендов для фильтрации\n        tagIds:\n          example:\n            - 3\n            - 5\n            - 6\n          maxItems: 50\n          type: array\n          items:\n            type: integer\n            format: int64\n          description: Список ID ярлыков для фильтрации\n        isNotIncludeNmsWithoutSales:\n          example: true\n          type: boolean\n          default: false\n          description: |\n            Не возвращать товары без продаж:\n              - `true` — да, возвращаются только товары с продажами за период, указанный в объекте `currentPeriod`\n              - `false` — нет, возвращаются все товары, если не указаны другие параметры\n        onlyShadowedNms:\n          example: true\n          type: boolean\n          default: false\n          description: |\n            Возвращаются ли в ответе только скрытые товары:\n              - `true` — да, возвращаются только скрытые из каталога товары\n              - `false` — нет, возвращаются все товары, если не указаны другие параметры\n        orderBy:\n          $ref: '#/components/schemas/OrderByItemRating'\n        limit:\n          example: 130\n          type: integer\n          format: uint32\n          default: 100\n          maximum: 1000\n          description: Количество товаров в ответе\n        offset:\n          example: 50\n          type: integer\n          format: uint32\n          description: Сколько элементов пропустить. Например, для значения `10` ответ начнётся с 11 элемента\n    PeriodItemRating:\n      type: object\n      required:\n        - start\n        - end\n      description: Текущий период\n      properties:\n        start:\n          example: '2026-02-10'\n          type: string\n          format: date\n          description: Дата начала периода. Не ранее 364 суток от вчерашнего дня и не позднее `end`\n        end:\n          example: '2026-02-10'\n          type: string\n          format: date\n          description: Дата окончания периода. Не ранее 364 суток от вчерашнего дня\n    PastPeriodItemRating:\n      type: object\n      required:\n        - start\n        - end\n      description: Прошлый период для сравнения. Количество дней — меньше или равно `currentPeriod`\n      properties:\n        start:\n          example: '2026-02-08'\n          type: string\n          format: date\n          description: Дата начала периода. Не ранее 364 суток от вчерашнего дня и не позднее `end`\n        end:\n          example: '2026-02-08'\n          type: string\n          format: date\n          description: Дата окончания периода. Не ранее 364 суток от вчерашнего дня и не позднее даты перед началом `currentPeriod`.\n    OrderByItemRating:\n      type: object\n      required:\n        - field\n        - mode\n      description: Параметры сортировки\n      properties:\n        field:\n          example: feedbackCount\n          type: string\n          enum:\n            - feedbackRating\n            - feedbackCount\n            - fiveStar\n            - fourStar\n            - threeStar\n            - twoStar\n            - oneStar\n            - disqualified\n          description: |\n            Поле для сортировки:\n              - `feedbackRating` — Рейтинг товара по отзывам\n              - `feedbackCount` — Все отзывы за период\n              - `fiveStar` — Отзывы 5 звёзд\n              - `fourStar` — Отзывы 4 звезды\n              - `threeStar` — Отзывы 3 звезды\n              - `twoStar` — Отзывы 2 звезды\n              - `oneStar` — Отзывы 1 звезда\n              - `disqualified` — Отзывы, исключённые из рейтинга\n        mode:\n          example: desc\n          type: string\n          enum:\n            - asc\n            - desc\n          description: |\n            Порядок сортировки:\n              - `asc` — по возрастанию\n              - `desc` — по убыванию\n    ItemRatingResponse:\n      type: object\n      required:\n        - sellerRating\n        - feedbackIncrease\n        - items\n      description: Данные ответа\n      properties:\n        sellerRating:\n          $ref: '#/components/schemas/TableItemFloat'\n        feedbackIncrease:\n          $ref: '#/components/schemas/FeedbacksIncreaseItem'\n        items:\n          type: array\n          description: Данные по товарам\n          items:\n            $ref: '#/components/schemas/DistributionTableItem'\n    TableItemFloat:\n      type: object\n      required:\n        - current\n      description: Рейтинг продавца\n      properties:\n        current:\n          example: 3.56\n          type: number\n          format: float64\n          description: Текущий рейтинг\n        dynamics:\n          example: 0.03\n          type: number\n          format: float64\n          description: Динамика по сравнению с предыдущим периодом, %\n    FeedbacksIncreaseItem:\n      type: object\n      required:\n        - current\n        - total\n        - dynamics\n        - fiveStar\n        - fourStar\n        - threeStar\n        - twoStar\n        - oneStar\n      description: Прирост оценок\n      properties:\n        current:\n          example: 26\n          type: integer\n          description: Прирост оценок за период\n        total:\n          example: 116\n          type: integer\n          description: Всего оценок\n        dynamics:\n          example: 23\n          type: integer\n          description: Динамика по сравнению с предыдущим периодом, %\n        fiveStar:\n          type: object\n          required:\n            - current\n            - total\n          description: Отзывы 5 звёзд\n          properties:\n            current:\n              example: 19\n              type: integer\n              description: Прирост оценок за период\n            dynamics:\n              example: 17\n              type: integer\n              description: Динамика по сравнению с предыдущим периодом, %\n            total:\n              example: 51\n              type: integer\n              description: Всего оценок\n        fourStar:\n          type: object\n          required:\n            - current\n            - total\n          description: Отзывы 4 звезды\n          properties:\n            current:\n              example: 2\n              type: integer\n              description: Прирост оценок за период\n            dynamics:\n              example: 1\n              type: integer\n              description: Динамика по сравнению с предыдущим периодом, %\n            total:\n              example: 13\n              type: integer\n              description: Всего оценок\n        threeStar:\n          type: object\n          required:\n            - current\n            - total\n          description: Отзывы 3 звезды\n          properties:\n            current:\n              example: 1\n              type: integer\n              description: Прирост оценок за период\n            dynamics:\n              example: 1\n              type: integer\n              description: Динамика по сравнению с предыдущим периодом, %\n            total:\n              example: 11\n              type: integer\n              description: Всего оценок\n        twoStar:\n          type: object\n          required:\n            - current\n            - total\n          description: Отзывы 2 звезды\n          properties:\n            current:\n              example: 5\n              type: integer\n              description: Прирост оценок за период\n            dynamics:\n              example: 5\n              type: integer\n              description: Динамика по сравнению с предыдущим периодом, %\n            total:\n              example: 34\n              type: integer\n              description: Всего оценок\n        oneStar:\n          type: object\n          required:\n            - current\n            - total\n          description: Отзывы 1 звезда\n          properties:\n            current:\n              example: -1\n              type: integer\n              description: Прирост оценок за период\n            dynamics:\n              example: -1\n              type: integer\n              description: Динамика по сравнению с предыдущим периодом, %\n            total:\n              example: 7\n              type: integer\n              description: Всего оценок\n    DistributionTableItem:\n      type: object\n      required:\n        - nmId\n        - title\n        - vendorCode\n        - subjectId\n        - subjectName\n        - brandName\n        - tagName\n        - tagId\n        - pinnedFeedback\n        - rating\n        - feedbackRating\n        - feedbackCount\n        - fiveStar\n        - fourStar\n        - threeStar\n        - twoStar\n        - oneStar\n        - disqualified\n        - isShadowed\n      properties:\n        nmId:\n          example: 123456789\n          type: integer\n          format: int64\n          description: Артикул WB\n        title:\n          example: iPh 17 512 ГБ Серебристый\n          type: string\n          description: Название товара\n        vendorCode:\n          example: wb3ha2668w\n          type: string\n          description: Артикул продавца\n        subjectId:\n          example: 50\n          description: ID предмета\n          type: integer\n          format: uint64\n        subjectName:\n          example: Phones\n          type: string\n          description: Название предмета\n        brandName:\n          example: Attlee\n          type: string\n          description: Бренд\n        tagName:\n          example: Phones\n          type: string\n          description: Название ярлыка\n        tagId:\n          example: 65\n          type: integer\n          format: int64\n          description: ID ярлыка\n        pinnedFeedback:\n          example: true\n          type: boolean\n          description: Отзыв закреплён\n        rating:\n          example: 10\n          type: number\n          format: float64\n          description: Рейтинг карточки товара\n        feedbackRating:\n          type: object\n          required:\n            - current\n            - percentile\n          description: Рейтинг товара по отзывам\n          properties:\n            current:\n              example: 3.87\n              type: number\n              format: float64\n              description: Текущий рейтинг\n            dynamics:\n              example: 0.31\n              type: number\n              format: float64\n              description: Динамика по сравнению с предыдущим периодом, %\n            percentile:\n              example: 1.7\n              type: number\n              format: float64\n              nullable: true\n              description: Сколько процентов товаров этого предмета у других продавцов имеют рейтинг ниже, чем у этого товара\n        feedbackCount:\n          type: object\n          required:\n            - current\n          description: Все отзывы за период\n          properties:\n            current:\n              example: 12\n              type: integer\n              description: Прирост оценок за период\n            dynamics:\n              example: 9\n              type: integer\n              description: Динамика по сравнению с предыдущим периодом, %\n        fiveStar:\n          type: object\n          required:\n            - current\n          description: Отзывы 5 звёзд\n          properties:\n            current:\n              example: 9\n              type: integer\n              description: Прирост оценок за период\n            dynamics:\n              example: 7\n              type: integer\n              description: Динамика по сравнению с предыдущим периодом, %\n        fourStar:\n          type: object\n          required:\n            - current\n          description: Отзывы 4 звезды\n          properties:\n            current:\n              example: 0\n              type: integer\n              description: Прирост оценок за период\n            dynamics:\n              example: -1\n              type: integer\n              description: Динамика по сравнению с предыдущим периодом, %\n        threeStar:\n          type: object\n          required:\n            - current\n          description: Отзывы 3 звезды\n          properties:\n            current:\n              example: 1\n              type: integer\n              description: Прирост оценок за период\n            dynamics:\n              example: 1\n              type: integer\n              description: Динамика по сравнению с предыдущим периодом, %\n        twoStar:\n          type: object\n          required:\n            - current\n          description: Отзывы 2 звезды\n          properties:\n            current:\n              example: 2\n              type: integer\n              description: Прирост оценок за период\n            dynamics:\n              example: 2\n              type: integer\n              description: Динамика по сравнению с предыдущим периодом, %\n        oneStar:\n          type: object\n          required:\n            - current\n          description: Отзывы 1 звезда\n          properties:\n            current:\n              example: 0\n              type: integer\n              description: Прирост оценок за период\n            dynamics:\n              example: 0\n              type: integer\n              description: Динамика по сравнению с предыдущим периодом, %\n        disqualified:\n          example: 7\n          type: integer\n          description: Отзывы, исключённые из рейтинга\n        isShadowed:\n          example: true\n          type: boolean\n          description: |\n            Является ли товар скрытым из каталога:\n              - `true` — товар скрыт из каталога\n              - `false` — товар не скрыт из каталога\n    ErrorObject:\n      type: object\n      properties:\n        title:\n          type: string\n          description: Заголовок ошибки\n          example: SKU not found\n        detail:\n          type: string\n          description: Детали ошибки\n          example: SKU xxx doesn't exist\n        requestId:\n          type: string\n          description: Уникальный ID запроса\n          example: fb25c9e9-cae8-52db-b68e-736c1466a3f5\n        origin:\n          type: string\n          description: ID внутреннего сервиса WB\n          example: analytic-open-api\n      required:\n        - title\n        - detail\n        - requestId\n        - origin\n    Currency:\n      type: string\n      example: RUB\n      description: Валюта отчёта\n    OrderFeedRequest:\n      type: object\n      required:\n        - selectedPeriod\n      properties:\n        selectedPeriod:\n          type: object\n          required:\n            - start\n          description: Запрашиваемый период. По дате текущего статуса заказа\n          properties:\n            start:\n              type: string\n              format: date-time\n              description: Дата и время начала периода. Не ранее 31 суток от текущей даты и не позднее `end`\n              example: '2026-07-23T00:00:00.00000+03:00'\n            end:\n              type: string\n              format: date-time\n              description: Дата и время конца периода. Не ранее 31 суток от текущей даты\n              example: '2026-07-31T00:00:00.00000+03:00'\n        nmIds:\n          example:\n            - 162579635\n            - 166699779\n          type: array\n          maxItems: 1000\n          items:\n            type: integer\n            format: uint64\n          description: Список артикулов WB для фильтрации\n        subjectIds:\n          example:\n            - 232\n            - 1364\n          type: array\n          maxItems: 50\n          items:\n            type: integer\n            format: uint64\n          description: Список ID предметов для фильтрации\n        brandNames:\n          example:\n            - Abikas\n            - Tike\n          type: array\n          maxItems: 50\n          items:\n            type: string\n          description: Список брендов для фильтрации\n        tagIds:\n          example:\n            - 3\n            - 5\n            - 6\n          type: array\n          maxItems: 50\n          items:\n            type: integer\n            format: uint64\n          description: Список ID ярлыков для фильтрации\n        pagination:\n          type: object\n          description: Пагинация\n          properties:\n            snapshotTime:\n              type: string\n              format: date-time\n              description: Метка снимка данных, в рамках которого выполняется пагинация.<br>Данные отчёта обновляются асинхронно. Чтобы не пропускать и не дублировать заказы, запросы одной выборки должны быть с одним и тем же `snapshotTime`.<br>В первом запросе выборки (`\"offset\":0`) параметр не указывается, в каждом последующем запросе (`offset`>`0`) указывайте значение поля `snapshotTime` из ответа на <strong>первый</strong> запрос.<br>При изменении значений периода и фильтров начинайте выборку заново с `\"offset\":0` и без `snapshotTime`\n              example: '2026-07-28T15:04:05Z'\n            offset:\n              type: integer\n              format: int32\n              description: Сколько элементов пропустить. Например, для значения `10` ответ начнётся с 11 элемента\n              default: 0\n              example: 211\n            limit:\n              type: integer\n              format: int32\n              description: Количество заказов в ответе\n              maximum: 10000\n              default: 50\n              example: 4030\n    OrderFeedResponse:\n      type: object\n      required:\n        - snapshotTime\n        - orders\n        - currency\n      description: Данные ответа\n      properties:\n        snapshotTime:\n          type: string\n          format: date-time\n          description: Метка снимка данных, в рамках которого выполняется пагинация\n          example: '2026-07-03T15:04:05Z'\n        currency:\n          $ref: '#/components/schemas/Currency'\n        orders:\n          type: array\n          description: Заказы\n          items:\n            $ref: '#/components/schemas/Order'\n    Order:\n      type: object\n      required:\n        - nmId\n        - chrtId\n        - srid\n        - createdAt\n        - updatedAt\n        - status\n        - warehouseName\n        - warehouseRegion\n        - isMp\n        - destinationCity\n        - destinationDistrict\n        - sellerPrice\n        - isB2b\n      description: Заказ\n      properties:\n        nmId:\n          type: integer\n          description: Артикул WB\n          example: 47254354\n          format: int64\n        chrtId:\n          type: integer\n          description: ID размера\n          example: 91663228\n          format: int64\n        srid:\n          type: string\n          description: ID заказа\n          example: 7513432034713632943.1.0\n        createdAt:\n          type: string\n          format: date-time\n          description: Дата и время оформления заказа\n          example: '2026-06-24T12:57:26+03:00'\n        updatedAt:\n          type: string\n          format: date-time\n          description: Дата и время текущего статуса. При `\"status\":\"created\"` возвращается значение поля `createdAt`\n          example: '2026-06-26T19:19:38+03:00'\n        status:\n          type: string\n          description: |\n            Статус заказа:\n              - `created` — оформлен\n              - `buyout` — продан\n              - `cancel` — отменён\n              - `return` — возвращён\n              - `returnDefective` — возвращён по причине брака\n          enum:\n            - created\n            - buyout\n            - cancel\n            - return\n            - returnDefective\n          example: cancel\n        cancelType:\n          type: string\n          description: |\n            Тип отмены (при `\"status\":\"cancel\"`):\n              - `app` — отказ до получения\n              - `receipt` — отказ при получении\n              - `expire` — истёк срок получения\n              - `other` — техническая отмена\n          enum:\n            - app\n            - receipt\n            - expire\n            - other\n          example: app\n        warehouseName:\n          type: string\n          description: Название склада. [На данный момент](https://dev.wildberries.ru/release-notes?id=570) для складов WB может быть только `Склад WB`\n          example: Склад WB\n        warehouseRegion:\n          type: string\n          description: Федеральный округ склада. Если склад не в России, возвращается страна. [На данный момент](https://dev.wildberries.ru/release-notes?id=570) для складов WB может быть только `\"\"`\n          example: ''\n        isMp:\n          type: boolean\n          description: |\n            Тип склада:\n              - `true` — склад продавца\n              - `false` — склад WB\n          example: true\n        destinationCity:\n          type: string\n     
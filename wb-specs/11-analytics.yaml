                 minPrice:\n                            type: integer\n                            format: uint64\n                            description: Минимальная цена продавца со скидкой продавца (без учёта скидки WB Клуба)\n                            example: 50\n                          maxPrice:\n                            type: integer\n                            format: uint64\n                            description: Максимальная цена продавца со скидкой продавца (без учёта скидки WB Клуба)\n                            example: 100\n                        required:\n                          - minPrice\n                          - maxPrice\n                    required:\n                      - currentPrice\n            required:\n              - name\n              - chrtID\n              - metrics\n        currency:\n          $ref: '#/components/schemas/Currency'\n    TableOfficeItem:\n      type: object\n      description: Данные по складу\n      properties:\n        regionName:\n          type: string\n          description: Регион отгрузки. [На данный момент](https://dev.wildberries.ru/release-notes?id=570) для складов WB может быть только `Склад WB`\n          example: Склад WB\n        officeID:\n          type: integer\n          format: int64\n          description: ID склада. [На данный момент](https://dev.wildberries.ru/release-notes?id=570) для складов WB может быть только `-999999`\n          example: -999999\n        officeName:\n          type: string\n          description: Название склада. [На данный момент](https://dev.wildberries.ru/release-notes?id=570) для складов WB может быть только `\"\"`\n          example: ''\n        metrics:\n          description: Метрики склада\n          allOf:\n            - $ref: '#/components/schemas/TableCommonMetrics'\n      required:\n        - regionName\n        - officeID\n        - officeName\n        - metrics\n    TableShippingOfficeRequest:\n      allOf:\n        - $ref: '#/components/schemas/CommonShippingOfficeFilters'\n        - description: Параметры запроса об остатках по складам\n        - {}\n    CommonShippingOfficeFilters:\n      type: object\n      description: Общие фильтры по регионам отгрузки\n      properties:\n        nmIDs:\n          type: array\n          description: Список артикулов WB для фильтрации\n          example:\n            - 111222333\n            - 444555666\n          items:\n            type: integer\n            format: int64\n        subjectIDs:\n          type: array\n          description: Список ID предметов для фильтрации\n          example:\n            - 123\n            - 456\n          items:\n            type: integer\n            format: int32\n        brandNames:\n          type: array\n          description: Список брендов для фильтрации\n          example:\n            - Эшк\n            - ЗлатА\n            - ОТК\n            - арк\n          items:\n            type: string\n        tagIDs:\n          type: array\n          description: Список ID ярлыков для фильтрации\n          example:\n            - 123\n            - 456\n            - 789\n          items:\n            type: integer\n            format: int64\n        currentPeriod:\n          $ref: '#/components/schemas/PeriodInv'\n        stockType:\n          $ref: '#/components/schemas/StockType'\n        skipDeletedNm:\n          type: boolean\n          description: Скрыть удалённые товары\n          example: false\n      required:\n        - currentPeriod\n        - stockType\n        - skipDeletedNm\n    TableShippingOfficeResponse:\n      type: object\n      required:\n        - currency\n      properties:\n        regions:\n          type: array\n          description: Множество данных по регионам отгрузки\n          items:\n            $ref: '#/components/schemas/TableShippingOfficeItem'\n        currency:\n          $ref: '#/components/schemas/Currency'\n    TableShippingOfficeItem:\n      type: object\n      description: Данные по 
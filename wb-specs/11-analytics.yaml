artToOrder` — по конверсии в заказ из поиска\n              - `openToCart` — по конверсии в корзину из поиска\n              - `visibility` — по видимости товара\n          example: avgPosition\n          type: string\n          enum:\n            - avgPosition\n            - openCard\n            - addToCart\n            - openToCart\n            - orders\n            - cartToOrder\n            - visibility\n        mode:\n          type: string\n          example: asc\n          description: |\n            Порядок сортировки:\n              - `asc` — по возрастанию\n              - `desc` — по убыванию\n          enum:\n            - asc\n            - desc\n      required:\n        - field\n        - mode\n    OrderByMainAndDetails:\n      type: object\n      description: Параметры сортировки\n      properties:\n        field:\n          description: |\n            Поле для сортировки:\n              - `avgPosition` — по средней позиции\n              - `addToCart` — по добавлениям в корзину\n              - `openCard` — по открытию карточки (переход на страницу товара)\n              - `orders` — по количеству заказов\n              - `cartToOrder` — по конверсии в заказ из поиска\n              - `openToCart` — по конверсии в корзину из поиска\n              - `visibility` — по видимости товара\n              - `minPrice` — по минимальной цене\n              - `maxPrice` — по максимальной цене\n          example: avgPosition\n          type: string\n          enum:\n            - avgPosition\n            - openCard\n            - addToCart\n            - openToCart\n            - orders\n            - cartToOrder\n            - visibility\n            - minPrice\n            - maxPrice\n        mode:\n          type: string\n          example: asc\n          description: |\n            Порядок сортировки:\n              - `asc` — по возрастанию\n              - `desc` — по убыванию\n          enum:\n            - asc\n            - desc\n      required:\n      
"openapi: 3.0.1\ninfo:\n  title: Аналитика и данные\n  version: analytics\n  description: |\n    <div class=\"description_important\">\n      Узнать больше об аналитике и данных можно в <a href=\"https://seller.wildberries.ru/instructions/ru/ru/subcategory/seller-analytics\">справочном центре</a>\n    </div>\n\n    <div class=\"api-block\">\n\n    В разделе описаны методы получения:\n      1. [Воронки продаж](/openapi/analytics#tag/salesFunnel)\n      2. [Ленты заказов](/openapi/analytics#tag/orderFeed)\n      3. [Поисковых запросов по вашим товарам](/openapi/analytics#tag/searchQueriesForYourItems)\n      4. [Истории остатков](/openapi/analytics#tag/stocksReport)\n      5. [Оценки товара](/openapi/analytics#tag/itemRating)\n      6. [Аналитики продавца в формате CSV](/openapi/analytics#tag/sellerAnalyticsCsv)\n\n    </div>\n  x-file-name: analytics\nsecurity:\n  - HeaderApiKey: []\ntags:\n  - name: Воронка продаж\n    x-displayName: Воронка продаж\n    description: ''\n  - name: Лента заказов\n    x-displayName: Лента заказов\n    description: ''\n  - name: Поисковые запросы по вашим товарам\n    x-displayName: Поисковые запросы по вашим товарам\n    description: ''\n  - name: История остатков\n    x-displayName: История остатков\n    description: ''\n  - name: Оценка товара\n    x-displayName: Оценка товара\n    description: ''\n  - name: Аналитика продавца CSV\n    x-displayName: Аналитика продавца CSV\n    description: ''\npaths:\n  /api/analytics/v3/sales-funnel/products:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    post:\n      x-readonly-method: true\n      x-category: contentanalytics\n      tags:\n        - Воронка продаж\n      summary: Статистика карточек товаров за период\n      operationId: postV3SalesFunnelProducts\n      description: |\n        Метод формирует отчёт о товарах, сравнивая ключевые показатели за текущий период с аналогичным прошлым.<br><br>\n\n        Данные отчёта обновляются 1 раз в час.<br><br>\n\n        В течение часа после события появляется большая часть данных:\n          - о заказах\n          - о переходах в карточку товара\n          - о добавлениях товаров в корзину\n\n        Малая часть этих данных может появляться в течение нескольких дней.<br><br>\n\n        Выкупы, отмены и возвраты отображаются в отчёте за тот день, когда товар был заказан. Например, если заказ был сделан 1 января, а покупатель вернул товар 10 января, данные об этом возврате появятся в отчёте за 1 января.<br>\n        Окончательные итоги продаж вы можете отслеживать с помощью [детализаций к отчётам реализации](/openapi/financial-reports-and-accounting#tag/financialReports).<br><br>\n\n        Параметры `brandNames`,`subjectIds`, `tagIds`, `nmIds` могут быть пустыми `[]`, тогда в ответе возвращаются все карточки продавца.<br><br>\n\n        Если вы указали несколько параметров, в ответе будут карточки, в которых есть одновременно все эти параметры. Если карточки не подходят по параметрам запроса, вернётся пустой ответ `[]`.<br><br>\n\n        Можно получить отчёт максимум за последние 365 дней.<br><br>\n\n        В данных предыдущего периода:\n          * Данные в `pastPeriod` указаны за такой же период, что и в `selectedPeriod`\n          * Если дата начала  `pastPeriod` раньше, чем год назад от текущей даты, она будет приведена к виду: `pastPeriod.start = текущая дата — 365 дней`\n\n        Можно использовать пагинацию.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Сервисный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый с секретом | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/ItemsRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                required:\n                  - data\n                properties:\n                  data:\n                    allOf:\n                      - type: object\n                        description: Статистика\n                      - $ref: '#/components/schemas/ItemsResponse'\n        '400':\n          $ref: '#/components/responses/BadRequestErrorResponse'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AuthorizationErrorResponse'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/analytics/v3/sales-funnel/products/history:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    post:\n      x-readonly-method: true\n      x-category: contentanalytics\n      tags:\n        - Воронка продаж\n      summary: Статистика карточек товаров по дням\n      operationId: postV3SalesFunnelProductsHistory\n      description: |\n        Метод возвращает статистику карточек товаров по дням или неделям.<br>\n        Можно получить данные максимум за последнюю неделю.<br><br>\n\n        Данные отчёта обновляются 1 раз в час.<br><br>\n\n        В течение часа после события появляется большая часть данных:\n          - о заказах\n          - о переходах в карточку товара\n          - о добавлениях товаров в корзину\n\n        Малая часть этих данных может появляться в течение нескольких дней.<br><br>\n\n        Выкупы, отмены и возвраты отображаются в отчёте за тот день, когда товар был заказан. Например, если заказ был сделан 1 января, а покупатель вернул товар 10 января, данные об этом возврате появятся в отчёте за 1 января.<br>\n        Окончательные итоги продаж вы можете отслеживать с помощью [детализаций к отчётам реализации](/openapi/financial-reports-and-accounting#tag/financialReports).\n\n        <div class=\"description_important\">\n          Чтобы получать отчёты за период до года, используйте методы <a href=\"/openapi/analytics#tag/sellerAnalyticsCsv\">Аналитика продавца CSV</a> — тип <code>DETAIL_HISTORY_REPORT</code>. Отчёты этого типа доступны только с подпиской <a href='https://seller.wildberries.ru/monetization/jam'>Джем</a>\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Сервисный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый с секретом | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/ItemHistoryRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ItemHistoryResponse'\n        '400':\n          $ref: '#/components/responses/BadRequestErrorResponse'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AuthorizationErrorResponse'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/analytics/v3/sales-funnel/grouped/history:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    post:\n      x-readonly-method: true\n      x-category: contentanalytics\n      tags:\n        - Воронка продаж\n      summary: Статистика групп карточек товаров по дням\n      operationId: postV3SalesFunnelGroupedHistory\n      description: |\n        Метод возвращает статистику карточек товаров по дням или неделям.<br>\n        Карточки товаров сгруппированы по предметам, брендам и ярлыкам.<br>\n        Можно получить данные максимум за последнюю неделю.<br><br>\n\n        Данные отчёта обновляются 1 раз в час.<br><br>\n\n        В течение часа после события появляется большая часть данных:\n          - о заказах\n          - о переходах в карточку товара\n          - о добавлениях товаров в корзину\n\n        Малая часть этих данных может появляться в течение нескольких дней.<br><br>\n\n        Выкупы, отмены и возвраты отображаются в отчёте за тот день, когда товар был заказан. Например, если заказ был сделан 1 января, а покупатель вернул товар 10 января, данные об этом возврате появятся в отчёте за 1 января.<br>\n        Окончательные итоги продаж вы можете отслеживать с помощью [детализаций к отчётам реализации](/openapi/financial-reports-and-accounting#tag/financialReports).<br><br>\n\n        Параметры `brandNames`, `subjectIds`, `tagIds` могут быть пустыми `[]`, тогда группировка происходит по всем карточкам продавца.<br><br>\n\n        Произведение количества предметов, брендов, ярлыков в запросе может быть не больше 16. Например, 4 бренда и 4 предмета или 2 предмета, 2 ярлыка и 4 бренда.\n\n        <div class=\"description_important\">\n          Чтобы получать отчёты за период до года, используйте методы <a href=\"/openapi/analytics#tag/sellerAnalyticsCsv\">Аналитика продавца CSV</a> — тип <code>GROUPED_HISTORY_REPORT</code>. Отчёты этого типа доступны только с подпиской <a href='https://seller.wildberries.ru/monetization/jam'>Джем</a>\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Сервисный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый с секретом | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/GroupedHistoryRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                required:\n                  - data\n                properties:\n                  data:\n                    $ref: '#/components/schemas/GroupedHistoryResponse'\n        '400':\n          $ref: '#/components/responses/BadRequestErrorResponse'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AuthorizationErrorResponse'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/nm-report/downloads:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    post:\n      operationId: postV2NmReportDownloads\n      x-readonly-method: true\n      x-category: contentanalytics\n      tags:\n        - Аналитика продавца CSV\n      security:\n        - HeaderApiKey: []\n      summary: Создать отчёт\n      description: |\n        Метод создаёт задание на генерацию отчёта с расширенной аналитикой продавца. <br><br>\n\n        Вы можете создать CSV-версии отчётов по [воронке продаж](/openapi/analytics#tag/salesFunnel) или [параметрам поиска](/openapi/analytics#tag/searchQueriesForYourItems) с группировкой по:\n          * артикулам WB\n          * предметам, брендам и ярлыкам\n\n        В отчётах по воронке продаж можно группировать данные по дням, неделям или месяцам.<br><br>\n\n        Также можете создать CSV-версии отчётов по [текстам поисковых запросов](/openapi/analytics#tag/searchQueriesForYourItems/operation/postV2SearchReportProductSearchTexts) и [остаткам](/openapi/analytics#tag/stocksReport).<br><br>\n\n        Каждый новый отчёт должен иметь уникальный ID.\n\n        <div class=\"description_important\">\n          Не используйте одинаковые ID для разных отчётов — это может привести к ошибкам при генерации\n        </div>\n\n        Набор параметров запроса в объекте `params` зависит от типа отчёта. Чтобы получить описание параметров, выберите тип отчёта в раскрывающемся списке в описании параметра `reportType`.<br><br>\n\n        Параметры `includeSubstitutedSKUs` и `includeSearchTexts` не могут одновременно иметь значение `false`.<br><br>\n\n        Если не удалось [получить отчёт](/openapi/analytics#tag/sellerAnalyticsCsv/operation/getV2NmReportDownloadsFileDownloadId), можно создать [повторное задание на генерацию](/openapi/analytics#tag/sellerAnalyticsCsv/operation/postV2NmReportDownloadsRetry). Также можно [получить список и проверить статусы](/openapi/analytics#tag/sellerAnalyticsCsv/operation/getV2NmReportDownloads) отчётов.\n\n        <div class=\"description_important\">\n          Отчёты по <a href=\"https://seller.wildberries.ru/content-analytics/history-remains\">остаткам</a> — типы <code>STOCK_HISTORY_REPORT_CSV</code> и <code>STOCK_HISTORY_DAILY_CSV</code> — можно создать без подписки <a href=\"https://seller.wildberries.ru/monetization/jam\">Джем</a>\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Сервисный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый с секретом | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              oneOf:\n                - $ref: '#/components/schemas/SalesFunnelItemReq'\n                - $ref: '#/components/schemas/SalesFunnelGroupReq'\n                - $ref: '#/components/schemas/SearchReportGroupReq'\n                - $ref: '#/components/schemas/SearchReportItemReq'\n                - $ref: '#/components/schemas/SearchReportTextReq'\n                - $ref: '#/components/schemas/InventoryMetricsReportReq'\n                - $ref: '#/components/schemas/InventoryHistoryReportReq'\n              discriminator:\n                propertyName: reportType\n                mapping:\n                  DETAIL_HISTORY_REPORT: '#/components/schemas/SalesFunnelItemReq'\n                  GROUPED_HISTORY_REPORT: '#/components/schemas/SalesFunnelGroupReq'\n                  SEARCH_QUERIES_PREMIUM_REPORT_GROUP: '#/components/schemas/SearchReportGroupReq'\n                  SEARCH_QUERIES_PREMIUM_REPORT_PRODUCT: '#/components/schemas/SearchReportItemReq'\n                  SEARCH_QUERIES_PREMIUM_REPORT_TEXT: '#/components/schemas/SearchReportTextReq'\n                  STOCK_HISTORY_REPORT_CSV: '#/components/schemas/InventoryMetricsReportReq'\n                  STOCK_HISTORY_DAILY_CSV: '#/components/schemas/InventoryHistoryReportReq'\n            examples:\n              SalesFunnelItemReq:\n                description: Воронка продаж. По артикулам WB\n                value:\n                  id: 06eae887-9d9f-491f-b16a-bb1766fcb8d2\n                  reportType: DETAIL_HISTORY_REPORT\n                  userReportName: Listing report\n                  params:\n                    nmIDs:\n                      - 1234567\n                    subjectIds:\n                      - 1234567\n                    brandNames:\n                      - Name\n                    tagIds:\n                      - 1234567\n                    startDate: '2024-06-21'\n                    endDate: '2024-06-23'\n                    timezone: Europe/Moscow\n                    aggregationLevel: day\n                    skipDeletedNm: false\n              SalesFunnelGroupReq:\n                description: Воронка продаж. По предметам, брендам и ярлыкам\n                value:\n                  id: 06eea887-9d9f-491f-b16a-bb1766fcb8d2\n                  reportType: GROUPED_HISTORY_REPORT\n                  userReportName: Subcategory report\n                  params:\n                    subjectIds:\n                      - 1234567\n                    brandNames:\n                      - Name\n                    tagIds:\n                      - 1234567\n                    startDate: '2024-06-21'\n                    endDate: '2024-06-23'\n                    timezone: Europe/Moscow\n                    aggregationLevel: day\n                    skipDeletedNm: false\n              SearchReportGroupReq:\n                description: Отчёт по параметрам поиска. По предметам, брендам и ярлыкам\n                value:\n                  id: 06eae887-9d9f-491f-b16a-bb1766fcb8d2\n                  reportType: SEARCH_QUERIES_PREMIUM_REPORT_GROUP\n                  userReportName: Subcategory report\n                  params:\n                    currentPeriod:\n                      start: '2024-02-10'\n                      end: '2024-02-10'\n                    pastPeriod:\n                      start: '2024-02-08'\n                      end: '2024-02-08'\n                    nmIds:\n                      - 162579635\n                      - 166699779\n                    subjectIds:\n                      - 64\n                      - 334\n                    brandNames:\n                      - nikkle\n                      - abikas\n                    tagIds:\n                      - 32\n                      - 53\n                    orderBy:\n                      field: avgPosition\n                      mode: asc\n                    positionCluster: all\n                    includeSubstitutedSKUs: true\n                    includeSearchTexts: false\n              SearchReportItemReq:\n                description: Отчёт по параметрам поиска. По артикулам WB\n                value:\n                  id: 06eea887-9d9f-491f-b16a-bb1766fcb8d2\n                  reportType: SEARCH_QUERIES_PREMIUM_REPORT_PRODUCT\n                  userReportName: Listing report\n                  params:\n                    currentPeriod:\n                      start: '2024-02-10'\n                      end: '2024-02-10'\n                    pastPeriod:\n                      start: '2024-02-08'\n                      end: '2024-02-08'\n                    subjectId: 123\n                    brandName: Abble\n                    tagId: 45\n                    nmIds:\n                      - 162579635\n                      - 166699779\n                    orderBy:\n                      field: buyoutCount\n                      mode: asc\n                    positionCluster: all\n                    includeSubstitutedSKUs: false\n                    includeSearchTexts: true\n              SearchReportTextReq:\n                description: Отчёт по текстам поисковых запросов по вашим товарам\n                value:\n                  id: 06eae887-9d9f-491f-b16a-bb1766fcb8d2\n                  reportType: SEARCH_QUERIES_PREMIUM_REPORT_TEXT\n                  userReportName: Subcategory report\n                  params:\n                    currentPeriod:\n                      start: '2024-02-10'\n                      end: '2024-02-10'\n                    pastPeriod:\n                      start: '2024-02-08'\n                      end: '2024-02-08'\n                    nmIds:\n                      - 162579635\n                      - 166699779\n                    subjectIds:\n                      - 64\n                      - 334\n                    brandNames:\n                      - nikkle\n                      - abikas\n                    tagIds:\n                      - 32\n                      - 53\n                    topOrderBy: openCard\n                    orderBy:\n                      field: avgPosition\n                      mode: asc\n                    includeSubstitutedSKUs: true\n                    includeSearchTexts: true\n                    limit: 50\n              InventoryMetricsReportReq:\n                description: Отчёт по статистике остатков\n                value:\n                  id: 06eae887-9d9f-491f-b16a-bb1766fcb8d2\n                  reportType: STOCK_HISTORY_REPORT_CSV\n                  userReportName: Inventory report\n                  params:\n                    nmIDs:\n                      - 111222333\n                      - 444555666\n                    subjectIDs:\n                      - 123\n                      - 456\n                    brandNames:\n                      - ЭгКа\n                      - Stock\n                    tagIDs:\n                      - 3\n                      - 4\n                      - 5\n                    currentPeriod:\n                      start: '2024-02-10'\n                      end: '2024-02-10'\n                    stockType: mp\n                    skipDeletedNm: true\n                    availabilityFilters:\n                      - deficient\n                      - balanced\n                    orderBy:\n                      field: avgOrders\n                      mode: asc\n              InventoryHistoryReportReq:\n                description: Отчёт по истории остатков\n                value:\n                  id: 06eae887-9d9f-491f-b16a-bb1766fcb8d2\n                  reportType: STOCK_HISTORY_DAILY_CSV\n                  userReportName: Inventory report\n                  params:\n                    nmIds:\n                      - 111222333\n                      - 444555666\n                    subjectIds:\n                      - 123\n                      - 456\n                    brandNames:\n                      - ЭгКа\n                      - Stock\n                    tagIds:\n                      - 3\n                      - 4\n                      - 5\n                    currentPeriod:\n                      start: '2025-12-13'\n                      end: '2025-12-15'\n                    stockType: ''\n                    skipDeletedNm: true\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/NmReportCreateReportResponse'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  title:\n                    type: string\n                    description: Заголовок ошибки\n                  detail:\n                    type: string\n                    description: Детали ошибки\n                  requestId:\n                    type: string\n                    description: Уникальный ID запроса\n                  origin:\n                    type: string\n                    description: ID внутреннего сервиса WB\n                required:\n                  - title\n                  - detail\n                  - requestId\n                  - origin\n              examples:\n                errorExample:\n                  value:\n                    title: Invalid request body\n                    detail: userReportName can not contain emojis\n                    requestId: 51b7828b-e298-4dfa-b7cd-45ab179921d3\n                    origin: analytics-open-api\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\
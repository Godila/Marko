ontent:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  title:\n                    type: string\n                    description: Заголовок ошибки\n                  detail:\n                    type: string\n                    description: Детали ошибки\n                  requestId:\n                    type: string\n                    description: Уникальный ID запроса\n                  origin:\n                    type: string\n                    description: ID внутреннего сервиса WB\n              examples:\n                errorExample:\n                  value:\n                    title: Authorization error\n                    detail: Authorization error\n                    requestId: 51b7828b-e298-4dfa-b7cd-45ab179921d3\n                    origin: analytics-open-api\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/nm-report/downloads/retry:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    post:\n      operationId: postV2NmReportDownloadsRetry\n      x-readonly-method: true\n      x-category: contentanalytics\n      tags:\n        - Аналитика продавца CSV\n      security:\n        - HeaderApiKey: []\n      summary: Сгенерировать отчёт повторно\n      description: |\n        Метод создает повторное [задание на генерацию](/openapi/analytics#tag/sellerAnalyticsCsv/operation/postV2NmReportDownloads) отчёта с расширенной аналитикой продавца. Необходимо, если при генерации отчёта вы [получили статус](/openapi/analytics#tag/sellerAnalyticsCsv/operation/getV2NmReportDownloads) `FAILED`.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Сервисный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый с секретом | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/NmReportRetryReportRequest'\n        required: true\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/NmReportRetryReportResponse'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  title:\n                    type: string\n                    description: Заголовок ошибки\n                  detail:\n                    type: string\n                    description: Детали ошибки\n                  requestId:\n                    type: string\n                    description: Уникальный ID запроса\n                  origin:\n                    type: string\n                    description: ID внутреннего сервиса WB\n                required:\n                  - title\n                  - detail\n                  - requestId\n                  - origin\n              examples:\n                errorExample:\n                  value:\n                    title: Invalid request body\n                    detail: invalid download id\n                    requestId: 51b7828b-e298-4dfa-b7cd-45ab179921d3\n                    origin: analytics-open-api\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  title:\n                    type: string\n                    description: Заголовок ошибки\n                  detail:\n                    type: string\n                    description: Детали ошибки\n                  requestId:\n                    type: string\n                    description: Уникальный ID запроса\n                  origin:\n                    type: string\n                    description: ID внутреннего сервиса WB\n              examples:\n                errorExample:\n                  value:\n                    title: Authorization error\n                    detail: Authorization error\n                    requestId: 51b7828b-e298-4dfa-b7cd-45ab179921d3\n                    origin: analytics-open-api\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/nm-report/downloads/file/{downloadId}:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    get:\n      operationId: getV2NmReportDownloadsFileDownloadId\n      x-readonly-method: true\n      x-category: contentanalytics\n      tags:\n        - Аналитика продавца CSV\n      security:\n        - HeaderApiKey: []\n      summary: Получить отчёт\n      description: |\n        Метод возвращает отчёт с расширенной аналитикой продавца по ID [задания на генерацию](/openapi/analytics#tag/sellerAnalyticsCsv/operation/postV2NmReportDownloads).\n        <br><br>\n        Можно получить отчёт, который сгенерирован за последние 48 часов.<br>Отчёт будет загружен внутри архива ZIP в формате CSV.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Сервисный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый с секретом | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      parameters:\n        - in: path\n          name: downloadId\n          description: ID отчёта\n          required: true\n          schema:\n            type: string\n            format: uuid\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/zip:\n              schema:\n                type: string\n                format: binary\n                description: \"Описание полей в файле CSV:\\n<br>\\n<br>\\n**Воронка продаж** — `DETAIL_HISTORY_REPORT` по артикулам WB и `GROUPED_HISTORY_REPORT` по предметам, брендам и ярлыкам\\n\\n| Имя | Тип | Формат | Описание |\\n|-----------------| --- | --- | --- |\\n| nmID (только для `DETAIL_HISTORY_REPORT`) | integer | int32 | Артикул WB |\\n| dt | string | date | Дата |\\n| openCardCount | integer | int32 | Переходы в карточку товара |\\n| addToCartCount | integer | int32 | Положили в корзину, шт. |\\n| ordersCount | integer | int32 | Заказали товаров, шт. |\\n| ordersSumRub | integer | int32 | Заказали на сумму |\\n| buyoutsCount | integer | int32 | Выкупили товаров, шт. |\\n| buyoutsSumRub | integer | int32 | Выкупили на сумму |\\n| cancelCount | integer | int32 | Отменили и вернули товаров, шт. |\\n| cancelSumRub | integer | int32 | Отменили и вернули на сумму |\\n| addToCartConversion | number | int32 | Конверсия в корзину, % (Какой процент посетителей, открывших карточку товара, добавили товар в корзину) |\\n| cartToOrderConversion | integer | int32 | Конверсия в заказ, % (Какой процент посетителей, добавивших товар в корзину, сделали заказ) |\\n| buyoutPercent | integer | int32 | Процент выкупа, % (Какой процент посетителей, заказавших товар, его выкупили. Без учёта товаров, которые еще доставляются покупателю) |\\n| addToWishlist | integer | int32 | Добавили в **Отложенные**|\\n| currency | string | string | Валюта отчёта |\\n\\n\\n**Отчёт по параметрам поиска. По предметам, брендам и ярлыкам** — `SEARCH_QUERIES_PREMIUM_REPORT_GROUP`\\n\\n| Имя | Поле | Формат | Описание |\\n|-----------------| --- | --- | --- |\\n| SubjectName |\\tstring | string | Название предмета |\\n| SubjectID | integer | int32 | ID предмета |\\n| BrandName | string | string  | Бренд |\\n| TagID | integer | int64 | ID ярлыка |\\n| AveragePosition | integer | uint64 | Средняя позиция в поиске в текущий период |\\n| OpenCard | integer | uint64 | Количество переходов в карточку товара из поиска в текущий период |\\n| AddToCart | integer | uint64 | Количество добавлений товара в корзину из поиска в текущий период |\\n| OpenToCart | integer | uint64 |\\tКонверсия в корзину из поиска в текущий период |\\n| Orders | integer | uint64 | Заказали товар из поиска в текущий период |\\n| CartToOrder | integer | uint64 | Конверсия в заказ из поиска в текущий период |\\n| Visibility | integer | uint64 | Видимость товара в поиске в текущий период. Процент вероятности, что пользователь увидит карточку товара. Зависит от средней позиции |\\n| AveragePositionPast | integer | uint64 | Средняя позиция в поиске в предыдущий период (заполняется, если указан прошлый период) |\\n| OpenCardPast | integer | uint64 | Количество переходов в карточку товара из поиска в предыдущий период (заполняется, если указан прошлый период) |\\n| AddToCartPast | integer | uint64 | Количество добавлений товара в корзину из поиска в предыдущий период (заполняется, если указан прошлый период) |\\n| OpenToCartPast | integer | uint64 | Конверсия в корзину из поиска в предыдущий период (заполняется, если указан прошлый период) |\\n| OrdersPast | integer | uint64 | Заказали товар из поиска в предыдущий период (заполняется, если указан прошлый период) |\\n| CartToOrderPast | integer | uint64 | Конверсия в заказ из поиска в предыдущий период (заполняется, если указан прошлый период) |\\n| VisibilityPast | integer | uint64 | Видимость товара в поиске в предыдущий период. Процент вероятности, что пользователь увидит карточку товара. Зависит от средней позиции (заполняется, если указан прошлый период), % |\\n\\n\\n**Отчёт по параметрам поиска. По артикулам WB** — `SEARCH_QUERIES_PREMIUM_REPORT_PRODUCT`\\n\\n| Имя | Поле | Формат | Описание |\\n|-----------------| --- | --- | --- |\\n| NmID | integer | int64 | Артикул WB |\\n| VendorCode | string | string | Артикул продавца |\\n| Name | string\\t| string | Название товара |\\n| SubjectName | string\\t| string | Название предмета |\\n| BrandName | string | string  | Бренд |\\n| IsAdvertised | boolean | bool\\t| Рекламируется ли товар |\\n| IsRated | boolean | bool | Есть ли возможность оценить качество карточки товара |\\n| Rating | float | float64 | Рейтинг карточки товара |\\n| FeedbackRating | float | float64 | Рейтинг по отзывам |\\n| MinPrice | integer | uint64 | Минимальная цена продавца со скидкой продавца (без учёта скидки WB Клуба |\\n| MaxPrice | integer | uint64 | Максимальная цена продавца со скидкой продавца (без учёта скидки WB Клуба) |\\n| AveragePosition | integer | uint64 | Средняя позиция товара в поиске в текущий период |\\n| OpenCard | integer | uint64 | Количество переходов в карточку товара из поиска в текущий период |\\n| AddToCart | integer | uint64 | Количество добавлений товара в корзину из поиска в текущий период |\\n| OpenToCart | integer | uint64 | Конверсия в корзину из поиска в текущий период |\\n| Orders | integer | uint64 | Заказали товар из поиска в текущий период |\\n| CartToOrder | integer | uint64 | Конверсия в заказ из поиска в текущий период |\\n| Visibility | integer | uint64 | Видимость товара в поиске в текущий период. Процент вероятности, что пользователь увидит карточку товара. Зависит от средней позиции |\\n| AveragePositionPast | integer | uint64 | Средняя позиция товара в поиске в предыдущий период (заполняется, если указан прошлый период) |\\n| OpenCardPast | integer | uint64 | Количество переходов в карточку товара из поиска в предыдущий период (заполняется, если указан прошлый период) |\\n| AddToCartPast | integer | uint64 | Количество добавлений товара в корзину из поиска в предыдущий период (заполняется, если указан прошлый период) |\\n| OpenToCartPast | integer | uint64 | Конверсия в корзину из поиска в предыдущий период (заполняется, если указан прошлый период) |\\n| OrdersPast | integer | uint64 | Заказали товар из поиска в предыдущий период (заполняется, если указан прошлый период) |\\n| CartToOrderPast | integer | uint64 | Конверсия в заказ из поиска в предыдущий период (заполняется, если указан прошлый период) |\\n| VisibilityPast | integer | uint64 | Видимость товара в поиске в предыдущий период. Процент вероятности, что пользователь увидит карточку товара. Зависит от средней позиции (заполняется, если указан прошлый период), % |\\n| IsSubstitutedSKU | boolean | bool | Искали ли товар по подменному артикулу. Будет в ответе при наличии в запросе `includeSubstitutedSKUs` и/или `includeSearchTexts` |\\n| Currency | string | string | Валюта отчёта |\\n\\n\\n**Отчёт по текстам поисковых запросов по вашим товарам** — `SEARCH_QUERIES_PREMIUM_REPORT_TEXT`\\n\\n| Имя | Поле | Формат | Описание |\\n|-----------------| --- | --- | --- |\\n| Text | string\\t| string | Текст поискового запроса |\\n| NmID | integer | int64 | Артикул WB |\\n| SubjectName | string\\t| string | Название предмета |\\n| BrandName | string | string  | Бренд |\\n| VendorCode | string | string | Артикул продавца |\\n| Name | string\\t| string | Название товара |\\n| Rating | float | float64 | Рейтинг карточки товара. Если рейтинг отсутствует, то значение будет `no rating` |\\n| FeedbackRating | float | float64 | Рейтинг по отзывам |\\n| MinPrice | integer | uint64 | Минимальная цена продавца со скидкой продавца (без учёта скидки WB Клуба) |\\n| MaxPrice | integer | uint64 | Максимальная цена продавца со скидкой продавца (без учёта скидки WB Клуба) |\\n| Frequency | integer | uint64 | Количество обращений с поисковым запросом в текущий период |\\n| MedianPosition | float | float64 | Медианная позиция товара в поиске в текущий период. Учитываются только те позиции, из которых пользователи добавляли товар в корзину или переходили в его карточку. Серединное значение позиции в поисковой выдаче, которое исключает сильные отклонения данных от среднего значения |\\n| AveragePosition | integer | uint64 | Средняя позиция товара в поиске в текущий период. Учитываются только те позиции, из которых пользователи добавляли товар в корзину или переходили в его карточку |\\n| OpenCard | integer | uint64 | Количество открытий карточки товара из поисковой выдачи в текущий период |\\n| OpenCardPercentile | float | float64 | Процент, на который показатель количества открытий карточки товара выше, чем у карточек других продавцов по поисковому запросу |\\n| AddToCart | integer | uint64 | Количество добавлений товара в корзину из поисковой выдачи в текущий период |\\n| AddToCartPercentile | float | float64 | Процент, на который показатель добавлений в корзину выше, чем у карточек других продавцов по поисковому запросу |\\n| OpenToCart | integer | uint64 | Конверсия в корзину из поиска в текущий период, % |\\n| OpenToCartPercentile\\t| float\\t| float64\\t| Процент, на который показатель конверсии в корзину выше, чем у карточек других продавцов по поисковому запросу |\\n| Orders | integer | uint64 | Заказали товар из поиска в текущий период |\\n| OrdersPercentile | float | float64 | Процент, на который показатель заказов выше, чем у карточек других продавцов по поисковому запросу |\\n| CartToOrder | integer | uint64 | Конверсия в заказ из поиска в текущий период, % |\\n| CartToOrderPercentile | float | float64 | Процент, на который показатель конверсии в заказ выше, чем у карточек других продавцов по поисковому запросу |\\n| Visibility | integer | uint64 | Видимость товара в поиске в текущий период. Процент вероятности, что пользователь увидит карточку товара. Зависит от средней позиции |\\n| FrequencyPast | integer | uint64 | Количество обращений с поисковым запросом за предыдущий период (заполняется, если указан прошлый период) |\\n| MedianPositionPast | float | float64 | Медианная позиция товара в поиске за предыдущий период (заполняется, если указан прошлый период) |\\n| AveragePositionPast | integer | uint64 | Средняя позиция товара в поиске в предыдущий период (заполняется, если указан прошлый период) |\\n| OpenCardPast | integer | uint64 | Количество открытий карточки товара из поисковой выдачи в предыдущий период (заполняется, если указан прошлый период) |\\n| AddToCartPast | integer | uint64 | Количество добавлений товара в корзину в предыдущий период (заполняется, если указан прошлый период) |\\n| OpenToCartPast | integer | uint64 | Конверсия в корзину из поиска в предыдущий период (заполняется, если указан прошлый период) |\\n| OrdersPast | integer | uint64 | Заказали товар из поиска в предыдущий период (заполняется, если указан прошлый период) |\\n| CartToOrderPast | integer | uint64 | Конверсия в заказ из поиска в предыдущий период (заполняется, если указан прошлый период), % |\\n| VisibilityPast | integer | uint64 | Видимость товара в поиске в предыдущий период. Процент вероятности, что пользователь увидит карточку товара. Зависит от средней позиции (заполняется, если указан прошлый период), % |\\n| Currency | string | string | Валюта отчёта |\\n\\n\\n**Отчёт по статистике остатков** — `STOCK_HISTORY_REPORT_CSV`\\n\\n| Имя | Поле | Формат | Описание |\\n|-----------------| --- | --- | --- |\\n| VendorCode | string | string | Артикул продавца |\\n| Name | string\\t| string | Название товара |\\n| NmID | integer | int64 | Артикул WB |\\n| SubjectName | string\\t| string | Название предмета |\\n| BrandName | string | string  | Бренд |\\n| SizeName | string\\t| string | Название размера |\\n| ChrtID | integer | int64 | ID размера |\\n| RegionName | string\\t| string | Регион отгрузки. Для складов продавца значение в строках будет `Маркетплейс`, так как данные по складам продавца приходят в агрегированном виде — по всем сразу, без детализации по конкретным складам. [На данный момент](https://dev.wildberries.ru/release-notes?id=570) для складов WB может быть только `Склад WB` |\\n| OfficeName | string\\t| string | Название склада. Для складов продавца значение в строках будет `Маркетплейс`, так как данные по складам продавца приходят в агрегированном виде — по всем сразу, без детализации по конкретным складам. [На данный момент](https://dev.wildberries.ru/release-notes?id=570) для складов WB может быть только `Склад WB` |\\n| Availability | string\\t| enum | Доступность товара |\\n| OrdersCount | integer\\t| uint64 | Заказы, шт. |\\n| OrdersSum | integer\\t| uint64 | Заказы, сумма |\\n| BuyoutCount | integer\\t| uint64 | Выкупы, шт. |\\n| BuyoutSum | integer\\t| uint64 | Выкупы, сумма |\\n| BuyoutPercent | integer\\t| uint32 | Процент выкупа |\\n| AvgOrders | number\\t| float64 | Среднее количество заказов в день |\\n| StockCount | integer\\t| uint64 | Остатки на текущий день, шт. |\\n| StockSum | integer\\t| uint64 | Стоимость остатков на текущий день |\\n| SaleRate | integer\\t| int32 | Оборачиваемость текущих остатков в часах |\\n| AvgStockTurnover | integer\\t| int32 | Оборачиваемость средних остатков в часах |\\n| ToClientCount | integer\\t| uint64 | В пути к клиенту, шт. |\\n| FromClientCount | integer\\t| uint64 | В пути от клиента, шт. |\\n| Price | integer\\t| uint64 | Текущая цена продавца со скидкой продавца (без учёта скидки WB Клуба) |\\n| OfficeMissingTime | integer\\t| int32 | Время отсутствия товара на складе в часах |\\n| LostOrdersCount | number\\t| float64 | Упущенные заказы, шт. |\\n| LostOrdersSum | number\\t| float64 | Упущенные заказы, сумма |\\n| LostBuyoutsCount | number\\t| float64 | Упущенные выкупы, шт. |\\n| LostBuyoutsSum | number\\t| float64 | Упущенные выкупы, сумма |\\n| AvgOrdersByMonth_MM.YYYY | number\\t| float64 | Среднее количество заказов по месяцам. Столбцы формируются динамически в зависимости от переданного текущего периода. Каждому месяцу текущего периода соответствует один столбец. В случае, если товар не существовал на момент конкретного месяца, то значение будет пропущено |\\n| Currency | string | string | Валюта отчёта |\\n\\n\\n**Отчёт по истории остатков** — `STOCK_HISTORY_DAILY_CSV `\\n\\n| Имя | Поле | Формат | Описание |\\n|-----------------| --- | --- | --- |\\n| VendorCode | string | string | Артикул продавца |\\n| Name | string\\t| string | Название товара |\\n| NmID | integer | int64 | Артикул WB |\\n| SubjectName | string\\t| string | Название предмета |\\n| BrandName | string | string  | Бренд |\\n| SizeName | string\\t| string | Название размера |\\n| ChrtID | integer | int64 | ID размера |\\n| OfficeName | string\\t| string | Название склада. Для складов продавца значение в строках будет `Маркетплейс`, так как данные по складам продавца приходят в агрегированном виде — по всем сразу, без детализации по конкретным складам. [На данный момент](https://dev.wildberries.ru/release-notes?id=570) для складов WB может быть только `Склад WB` |\\n| DD.MM.YYYY | integer| uint64 | Остаток по состоянию на 23:59 дня в заголовке. Столбцы формируются динамически в зависимости от переданного в запросе периода. Каждому дню периода соответствует один столбец. Если товара не было в конкретный день, значение будет пропущено |\\n\"\n              examples:\n                SalesFunnelItemRes:\n                  $ref: '#/components/examples/SalesFunnelItemRes'\n                SalesFunnelGroupRes:\n                  $ref: '#/components/examples/SalesFunnelGroupRes'\n                SearchReportGroupRes:\n                  $ref: '#/components/examples/SearchReportGroupRes'\n                SearchReportItemRes:\n                  $ref: '#/components/examples/SearchReportItemRes'\n                SearchReportTextRes:\n                  $ref: '#/components/examples/SearchReportTextRes'\n                InventoryMetricsReportRes:\n                  $ref: '#/components/examples/InventoryMetricsReportRes'\n                InventoryHistoryReportRes:\n                  $ref: '#/components/examples/InventoryHistoryReportRes'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  title:\n                    type: string\n                    description: Заголовок ошибки\n                  detail:\n                    type: string\n                    description: Детали ошибки\n                  requestId:\n                    type: string\n                    description: Уникальный ID запроса\n                  origin:\n                    type: string\n                    description: ID внутреннего сервиса WB\n                required:\n                  - title\n                  - detail\n                  - requestId\n                  - origin\n              examples:\n                errorExample:\n                  value:\n                    title: Invalid request body\n                    detail: check correctness of download id\n                    requestId: 51b7828b-e298-4dfa-b7cd-45ab179921d3\n                    origin: analytics-open-api\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  title:\n                    type: string\n                    description: Заголовок ошибки\n                  detail:\n                    type: string\n                    description: Детали ошибки\n                  requestId:\n                    type: string\n                    description: Уникальный ID запроса\n                  origin:\n                    type: string\n                    description: ID внутреннего сервиса WB\n              examples:\n                errorExample:\n                  value:\n                    title: Authorization error\n                    detail: Authorization error\n                    requestId: 51b7828b-e298-4dfa-b7cd-45ab179921d3\n                    origin: analytics-open-api\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/search-report/report:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    post:\n      operationId: postV2SearchReportReport\n      x-readonly-method: true\n      x-category: contentanalytics\n      tags:\n        - Поисковые запросы по вашим товарам\n      summary: Основная страница\n      description: |\n        Метод формирует набор данных для основной страницы отчёта по поисковым запросам с:\n         - общей информацией\n         - позициями товаров\n         - данными по видимости и переходам в карточку\n         - данными для таблицы по группам\n\n        Для получения дополнительных данных в таблице используйте отдельный запрос для:\n         - [пагинации по группам](/openapi/analytics#tag/searchQueriesForYourItems/operation/postV2SearchReportTableGroups)\n         - [получения по товарам в группе](/openapi/analytics#tag/searchQueriesForYourItems/operation/postV2SearchReportTableDetails)\n\n        Дополнительный параметр выбора списка товаров в таблице:\n         - `positionCluster` — средняя позиция в поиске\n\n        Параметры `includeSubstitutedSKUs` и `includeSearchTexts` не могут одновременно иметь значение `false`.<br><br>\n\n        Данные отчёта обновляются 1 раз в час.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Сервисный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый с секретом | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/MainRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                allOf:\n                  - $ref: '#/components/schemas/CommonResponseProperties'\n                  - type: object\n                    required:\n                      - data\n                    properties:\n                      data:\n                        $ref: '#/components/schemas/MainResponse'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject400'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/search-report/table/groups:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    post:\n      operationId: postV2SearchReportTableGroups\n      x-readonly-method: true\n      x-category: contentanalytics\n      tags:\n        - Поисковые запросы по вашим товарам\n      summary: Пагинация по группам\n      description: |\n        Метод формирует дополнительные данные к [основному отчёту](/openapi/analytics#tag/searchQueriesForYourItems/operation/postV2SearchReportReport) с пагинацией по группам. Пагинация возможна только при наличии фильтра по бренду, предмету или ярлыку.<br><br>\n\n        Дополнительный параметр выбора списка товаров в таблице:\n         - `positionCluster` — средняя позиция в поиске\n\n        Параметры `includeSubstitutedSKUs` и `includeSearchTexts` не могут одновременно иметь значение `false`.<br><br>\n\n        Данные отчёта обновляются 1 раз в час.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Сервисный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый с секретом | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/TableGroupRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                allOf:\n                  - $ref: '#/components/schemas/CommonResponseProperties'\n                  - type: object\n                    required:\n                      - data\n                    properties:\n                      data:\n                        $ref: '#/components/schemas/TableGroupResponse'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject400'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/search-report/table/details:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    post:\n      operationId: postV2SearchReportTableDetails\n      x-readonly-method: true\n      x-category: contentanalytics\n      tags:\n        - Поисковые запросы по вашим товарам\n      summary: Пагинация по товарам в группе\n      description: |\n        Метод формирует дополнительные данные к [основному отчёту](/openapi/analytics#tag/searchQueriesForYourItems/operation/postV2SearchReportReport) с пагинацией по товарам в группе. Пагинация возможна вне зависимости от наличия фильтров.<br><br>\n\n        Фильтры для пагинации по товарам в группе или без фильтров:\n         - кортеж `subjectId`,`brandName`,`tagId` — фильтр для группы\n         - `nmIds` — фильтр по карточке товара\n\n        Дополнительный параметр выбора списка товаров:\n         - `positionCluster` — средняя позиция в поиске\n\n        Параметры `includeSubstitutedSKUs` и `includeSearchTexts` не могут одновременно иметь значение `false`.<br><br>\n\n        Данные отчёта обновляются 1 раз в час.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Сервисный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый с секретом | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/TableDetailsRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                allOf:\n                  - $ref: '#/components/schemas/CommonResponseProperties'\n                  - type: object\n                    required:\n                      - data\n                    properties:\n                      data:\n                        $ref: '#/components/schemas/TableDetailsResponse'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject400'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/search-report/product/search-texts:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    post:\n      operationId: postV2SearchReportProductSearchTexts\n      x-readonly-method: true\n      x-category: contentanalytics\n      tags:\n        - Поисковые запросы по вашим товарам\n      summary: Поисковые запросы по товару\n      description: |\n        Метод формирует топ поисковых запросов по товару.\n\n        Параметры выбора поисковых запросов:\n         - `limit` — количество запросов, максимум 30. Для тарифов [Джема](https://seller.wildberries.ru/monetization/tariffs) **Продвинутый** и **Премиальный** максимум — 100.\n         - `topOrderBy` — способ выбора топа запросов\n\n        Параметры `includeSubstitutedSKUs` и `includeSearchTexts` не могут одновременно иметь значение `false`.<br><br>\n\n        Данные отчёта обновляются 1 раз в час.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Сервисный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый с секретом | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/ItemSearchTextsRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                allOf:\n                  - $ref: '#/components/schemas/CommonResponseProperties'\n                  - type: object\n                    required:\n                      - data\n                    properties:\n                      data:\n                        $ref: '#/components/schemas/ItemSearchTextsResponse'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject400'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/search-report/product/orders:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    post:\n      operationId: postV2SearchReportProductOrders\n      x-readonly-method: true\n      x-category: contentanalytics\n      tags:\n        - Поисковые запросы по вашим товарам\n      summary: Заказы и позиции по поисковым запросам товара\n      description: |\n        Метод формирует данные для таблицы:\n          - о заказах по каждому поисковому запросу для конкретного товара\n          - о позициях товара в результатах поиска по каждому запросу\n\n        Данные указаны в рамках периода для [запрошенного товара](/openapi/analytics#tag/searchQueriesForYourItems/operation/postV2SearchReportProductSearchTexts) и сгруппированы по дням. Максимальный период — 7 дней.<br><br>\n\n        Данные отчёта обновляются 1 раз в час.\n\n        <div class=\"description_important\">\n          Можно получить отчёт максимум за последние 365 дней с момента выполнения запроса\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Сервисный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый с секретом | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/ItemOrdersRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                allOf:\n                  - $ref: '#/components/schemas/CommonResponseProperties'\n                  - type: object\n                    required:\n                      - data\n                    properties:\n                      data:\n                        $ref: '#/components/schemas/ItemOrdersResponse'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject400'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/analytics/v1/stocks-report/wb-warehouses:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    post:\n      x-readonly-method: true\n      x-category: contentanalytics\n      x-token-types:\n        - personal\n        - service\n        - base-with-secret\n      tags:\n        - История остатков\n      summary: Остатки на складах WB\n      operationId: postV1StocksReportWbWarehouses\n      description: |\n\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену, \n                <strong>Сервисному</strong> токену, \n                <strong>Базовому</strong> токену <strong>с секретом</strong>\n        </div>\n\n        Метод возвращает текущие остатки товаров на складах WB.\n        <br><br>\n        Данные обновляются 1 раз в 30 минут.\n        <br><br>\n        1 строка ответа — данные об 1 размере товара на 1 складе WB.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 3 запроса | 20 сек | 1 запрос |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/InventoryRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    $ref: '#/components/schemas/InventoryWbResponse'\n                required:\n                  - data\n        '204':\n          description: Нет данных\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject400'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject403'\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/Response403General'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/analytics/v1/stocks-report/seller-warehouses:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    post:\n      x-readonly-method: true\n      x-category: contentanalytics\n      x-token-types:\n        - personal\n        - service\n      tags:\n        - История остатков\n      summary: Остатки на складах продавца\n      operationId: postAnalyticsV1StocksReportSellerWarehouses\n      description: |\n\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену, \n                <strong>Сервисному</strong> токену\n        </div>\n\n        Метод возвращает текущие остатки товаров на складах продавца.\n        <br><br>\n        Данные обновляются 1 раз в 30 минут.\n        <br><br>\n        1 строка ответа — данные об 1 размере товара на 1 складе продавца.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 3 запроса | 20 сек | 1 запрос |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/InventoryRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    $ref: '#/components/schemas/InventorySellerResponse'\n                required:\n                  - data\n        '204':\n          description: Нет данных\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject400'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject403'\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/Response403General'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/stocks-report/products/groups:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    post:\n      operationId: postV2StocksReportProductsGroups\n      x-readonly-method: true\n      x-category: contentanalytics\n      tags:\n        - История остатков\n      summary: Данные по группам\n      description: |\n        Метод формирует набор данных об остатках по группам товаров.\n        <br><br>\n        Группа товаров описывается кортежем `subjectID, brandName, tagID`.<br><br>\n\n        Данные отчёта обновляются 1 раз в час.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Сервисный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый с секретом | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/TableGroupRequestSt'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    $ref: '#/components/schemas/TableGroupResponseSt'\n                required:\n                  - data\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject400'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/stocks-report/products/products:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    post:\n      operationId: postV2StocksReportProductsProducts\n      x-readonly-method: true\n      x-category: contentanalytics\n      tags:\n        - История остатков\n      summary: Данные по товарам\n      description: |\n        Метод формирует набор данных об остатках по товарам.\n        <br><br>\n        Можно получить данные как по отдельным товарам, так и в рамках всего отчёта — если в запросе отсутствуют фильтры: `nmIDs`, `subjectID`, `brandName`, `tagID`.<br><br>\n\n        Данные отчёта обновляются 1 раз в час.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Сервисный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый с секретом | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/TableItemRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                nullable: true\n                properties:\n                  data:\n                    $ref: '#/components/schemas/TableItemResponse'\n                required:\n                  - data\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject400'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/stocks-report/products/sizes:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    post:\n      operationId: postV2StocksReportProductsSizes\n      x-readonly-method: true\n      x-category: contentanalytics\n      tags:\n        - История остатков\n      summary: Данные по размерам\n      description: |\n        Метод формирует набор данных об остатках по размерам товара.\n        <br><br>\n        Возможны случаи:\n        1. Товар имеет размеры и `\"includeOffice\":true`, тогда в ответе будут данные об остатках по каждому из размеров с вложенной детализацией по складам.\n        2. Товар имеет размеры и `\"includeOffice\":false`, тогда в ответе будут данные об остатках по каждому из размеров без вложенной детализации по складам.\n        3. Товар не имеет размера и `\"includeOffice\":true`, тогда в ответе будет детализация по складам. Без данных об остатках по каждому из размеров.\n        4. Товар не имеет размера и `\"includeOffice\":false`, тогда тело ответа будет пустым.<br></br>\n        Товар не имеет размера, если у него единственный размер с `\"techSize\":\"0\"`. В ответах метода получения данных по [товарам](/openapi/analytics#tag/stocksReport/operation/postV2StocksReportProductsProducts) у таких товаров `\"hasSizes\":false`.<br></br>\n        Данные по складам продавца приходят в агрегированном виде — по всем сразу, без детализации по конкретным складам — эти записи будут с `\"regionName\":\"Маркетплейс\"` и `\"officeName\":\"\"`.<br><br>\n\n        Данные отчёта обновляются 1 раз в час.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Сервисный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый с секретом | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/TableSizeRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    $ref: '#/components/schemas/TableSizeResponse'\n                required:\n                  - data\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject400'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/stocks-report/offices:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    post:\n      operationId: postV2StocksReportOffices\n      x-readonly-method: true\n      x-category: contentanalytics\n      tags:\n        - История остатков\n      summary: Данные по складам\n      description: |\n        Метод формирует набор данных об остатках по складам.\n        <br><br>\n        Данные по складам продавца приходят в агрегированном виде — по всем сразу, без детализации по конкретным складам — эти записи будут с `\"regionName\":\"Маркетплейс\"` и `\"offices\":[]`.<br><br>\n\n        Данные отчёта обновляются 1 раз в час.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Сервисный | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый с секретом | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/TableShippingOfficeRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    $ref: '#/components/schemas/TableShippingOfficeResponse'\n                required:\n                  - data\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject400'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/analytics/v2/item-rating:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    post:\n      x-readonly-method: true\n      x-category: contentanalytics\n      x-token-types:\n        - personal\n        - service\n      tags:\n        - Оценка товара\n      summary: Получить отчёт\n      operationId: postV2ItemRating\n      description: |\n\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену, \n                <strong>Сервисному</strong> токену\n        </div>\n\n        Метод формирует набор данных об оценках товаров.\n        <br><br>\n        Данные отчёта обновляются 1 раз в час.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 3 запроса | 20 сек | 3 запроса |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/ItemRatingRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    $ref: '#/components/schemas/ItemRatingResponse'\n                required:\n                  - data\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject400'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject403'\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/Response403General'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/analytics/v1/order-feed:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    post:\n      x-readonly-method: true\n      x-category: contentanalytics\n      tags:\n        - Лента заказов\n      summary: Получить отчёт\n      operationId: postV1OrderFeed\n      description: |\n        Метод формирует набор данных о заказах и продажах.\n        <br><br>\n        Данные отчёта обновляются в режиме реального времени.\n        <br><br>\n        > 1 заказ = 1 сборочное задание = 1 единица товара\n\n        Параметры `brandNames`,`subjectIds`, `tagIds`, `nmIds` могут быть пустыми `[]`, тогда в ответе возвращаются все заказы продавца.<br>\n        Если вы указали несколько параметров, в ответе будут заказы, в которых есть одновременно все эти параметры. Если заказы не подходят по параметрам запроса, вернётся пустой массив `[]`.\n        <br><br>\n        Можно получить отчёт максимум за последние 31 день.\n        <br><br>\n        Заказы отдаются по времени текущего статуса, от самого нового к самому раннему.\n        <br><br>\n        Можно использовать пагинацию.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        | Сервисный | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        | Базовый с секретом | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        | Базовый | 3 ч | 1 запрос | 3 ч | 1 запрос |\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/OrderFeedRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    $ref: '#/components/schemas/OrderFeedResponse'\n                required:\n                  - data\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject400'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ErrorObject403'\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/Response403General'\n        '429':\n          $ref: '#/components/responses/429'\ncomponents:\n  schemas:\n    MainRequest:\n      type: object\n      description: |\n        Параметры запроса для формирования главной страницы:\n          - `currentPeriod` — текущий период\n          - `pastPeriod` — предыдущий период для сравнения\n      properties:\n        currentPeriod:\n          $ref: '#/components/schemas/Period'\n        pastPeriod:\n          $ref: '#/components/schemas/pastPeriod'\n        nmIds:\n          type: array\n          example:\n            - 162579635\n            - 166699779\n          description: Список артикулов WB для фильтрации\n          items:\n            type: integer\n            format: int32\n        subjectIds:\n          type: array\n          example:\n            - 32\n            - 64\n          description: Список ID предметов для фильтрации\n          items:\n            type: integer\n            format: int32\n        brandNames:\n          example:\n            - Adidas\n            - Nike\n          type: array\n          description: Список брендов для фильтрации\n          items:\n            type: string\n        tagIds:\n          example:\n            - 3\n            - 5\n            - 6\n          description: Список ID ярлыков для фильтрации\n          type: array\n          items:\n            type: integer\n            format: int64\n        positionCluster:\n          $ref: '#/components/schemas/PositionCluster'\n        orderBy:\n          $ref: '#/components/schemas/OrderByMainAndDetails'\n        includeSubstitutedSKUs:\n          type: boolean\n          default: true\n          example: true\n          description: Показать данные по прямым запросам с [подменным артикулом](https://seller.wildberries.ru/help-center/article/A-524)\n        includeSearchTexts:\n          type: boolean\n          default: true\n          example: false\n          description: Показать данные по поисковым запросам без учёта подменного артикула\n        limit:\n          example: 130\n          type: integer\n          description: Количество групп товаров в ответе\n          format: uint32\n          maximum: 1000\n        offset:\n          example: 50\n          type: integer\n          description: После какого элемента выдавать данные\n          format: uint32\n      required:\n        - currentPeriod\n        - orderBy\n        - positionCluster\n        - limit\n        - offset\n    MainResponse:\n      type: object\n      properties:\n        commonInfo:\n          $ref: '#/components/schemas/CommonInfo'\n        positionInfo:\n          $ref: '#/components/schemas/PositionInfo'\n        visibilityInfo:\n          $ref: '#/components/schemas/VisibilityInfo'\n        groups:\n          description: |\n            Список элементов таблицы\n          type: array\n          items:\n            $ref: '#/components/schemas/TableGroupItem'\n        currency:\n          $ref: '#/components/schemas/Currency'\n      required:\n        - commonInfo\n        - positionInfo\n        - visibilityInfo\n        - currency\n    CommonInfo:\n      type: object\n      description: Общая информация\n      properties:\n        supplierRating:\n          description: Рейтинг продавца\n          type: object\n          properties:\n            current:\n              type: number\n              format: float64\n              example: 5.3\n              description: Текущий рейтинг продавца\n            dynamics:\n              type: number\n              format: float64\n              example: 5.4\n              description: Динамика по сравнению с предыдущим периодом, %\n          required:\n            - current\n        advertisedProducts:\n          description: Количество товаров в рекламе\n          type: object\n          properties:\n            current:\n              example: 5\n              description: Текущее количество товаров в рекламе\n              type: integer\n            dynamics:\n              example: 50\n              description: Динамика по сравнению с предыдущим периодом, %\n              type: integer\n          required:\n            - current\n        totalProducts:\n          example: 150\n          description: Общее количество товаров\n          type: integer\n          format: uint64\n      required:\n        - supplierRating\n        - advertisedProducts\n        - totalProducts\n    PositionInfo:\n      type: object\n      description: Информация о позиции товара\n      properties:\n        average:\n          description: Средняя позиция товара в результатах поиска\n          type: object\n          properties:\n            current:\n              example: 5\n              description: Текущая средняя позиция товара\n              type: integer\n            dynamics:\n              example: 50\n              description: Динамика по сравнению с предыдущим периодом, %\n              type: integer\n          required:\n            - current\n        median:\n          description: Медианная позиция товара в результатах поиска\n          type: object\n          properties:\n            current:\n              example: 5\n              description: Текущая медианная позиция товара\n              type: integer\n            dynamics:\n              example: 50\n              description: Динамика по сравнению с предыдущим периодом, %\n              type: integer\n          required:\n            - current\n        chartItems:\n          type: array\n          description: Данные для чарта по средней и медианной позиции товара в результатах поиска\n          items:\n            $ref: '#/components/schemas/SearchReportPositionChartItem'\n        clusters:\n          $ref: '#/components/schemas/SearchReportPositionClusters'\n      required:\n        - average\n        - median\n        - chartItems\n        - clusters\n    SearchReportPositionChartItem:\n      type: object\n      properties:\n        dt:\n          example: '2024-10-19'\n          type: string\n          description: Дата\n        average:\n          example: 1\n          type: integer\n          description: Средняя позиция товара в результатах поиска\n          format: uint64\n        median:\n          example: 1\n          type: integer\n          description: Медианная позиция товара в результатах поиска\n          format: uint64\n      required:\n        - dt\n        - average\n        - median\n    SearchReportPositionClusters:\n      type: object\n      description: |\n        Количество товаров со средней позицией в поиске:\n          - `firstHundred` — от 1 до 100\n          - `secondHundred` — от 101 до 200\n          - `below` — от 201 и ниже\n      properties:\n        firstHundred:\n          description: от 1 до 100\n          type: object\n          properties:\n            current:\n              example: 5\n              description: Текущее количество товаров\n              type: integer\n            dynamics:\n              example: 50\n              description: Динамика по сравнению с предыдущим периодом, %\n              type: integer\n          required:\n            - current\n        secondHundred:\n          description: от 101 до 200\n          type: object\n          properties:\n            current:\n              example: 5\n              description: Текущее количество товаров\n              type: integer\n            dynamics:\n              example: 50\n              description: Динамика по сравнению с предыдущим периодом, %\n              type: integer\n          required:\n            - current\n        below:\n          description: от 201 и ниже\n          type: object\n          properties:\n            current:\n              example: 5\n              description: Текущее количество товаров\n              type: integer\n            dynamics:\n              example: 50\n              description: Динамика по сравнению с предыдущим периодом, %\n              type: integer\n          required:\n            - current\n      required:\n        - firstHundred\n        - secondHundred\n        - below\n    VisibilityInfo:\n      type: object\n      description: Видимость карточек и переходы в карточки. По дням, неделям, месяцам\n      properties:\n        visibility:\n          description: Видимость — процент вероятности, что пользователь увидит карточку товара. Зависит от средней позиции\n          type: object\n          properties:\n            current:\n              example: 5\n              description: Видимость в текущий период\n              type: integer\n            dynamics:\n              example: 50\n              description: Динамика по сравнению с предыдущим периодом, %\n              type: integer\n          required:\n            - current\n        openCard:\n          description: Количество переходов в карточку товара из поиска\n          type: object\n          properties:\n            current:\n              example: 5\n              description: Текущее количество переходов\n              type: integer\n            dynamics:\n              example: 50\n              description: Динамика по сравнению с предыдущим периодом, %\n              type: integer\n          required:\n            - current\n        byDay:\n          type: array\n          description: Данные для отрисовки графика в личном кабинете по видимости и переходам в карточки по дням\n          items:\n            type: object\n            properties:\n              dt:\n                $ref: '#/components/schemas/Date'\n              visibility:\n                example: 100\n                description: Видимость карточки в результатах поиска, %\n                type: integer\n                format: uint64\n              open:\n                example: 124\n                description: Количество переходов в карточку\n                type: integer\n                format: uint64\n            required:\n              - dt\n              - visibility\n              - open\n        byWeek:\n          type: array\n          description: Данные для отрисовки графика в личном кабинете по видимости и переходам в карточки по неделям\n          items:\n            type: object\n            properties:\n              dt:\n                $ref: '#/components/schemas/Date'\n              visibility:\n                example: 100\n                description: Видимость карточки в результатах поиска, %\n                type: integer\n                format: uint64\n              open:\n                example: 124\n                description: Количество переходов в карточку\n                type: integer\n                format: uint64\n            required:\n              - dt\n              - visibility\n              - open\n        byMonth:\n          type: array\n          description: Данные для отрисовки графика в личном кабинете по видимости и переходам в карточки по месяцам\n          items:\n            type: object\n            properties:\n              dt:\n                $ref: '#/components/schemas/Date'\n              visibility:\n                example: 100\n                description: Видимость карточки в результатах поиска, %\n                type: integer\n                format: uint64\n              open:\n                example: 124\n                description: Количество переходов в карточку\n                type: integer\n                format: uint64\n            required:\n              - dt\n              - visibility\n              - open\n      required:\n        - visibility\n        - openCard\n    TableGroupItem:\n      type: object\n      description: |\n        К группе товаров относятся все карточки, подходящие хотя бы по одному из параметров:\n          - `subjectName` — название предмета\n          - `brandName` — бренд\n          - `tagName` — название ярлыка\n      properties:\n        subjectName:\n          example: Phones\n          description: Название предмета\n          type: string\n        subjectId:\n          example: 50\n          description: ID предмета\n          type: integer\n          format: uint64\n        brandName:\n          example: Apple\n          description: Бренд\n          type: string\n        tagName:\n          example: phones\n          description: Название ярлыка\n          type: string\n        tagId:\n          example: 65\n          description: ID ярлыка\n          type: integer\n          format: int64\n        metrics:\n          type: object\n          description: Метрики товара в таблице\n          properties:\n            avgPosition:\n              description: Средняя позиция товара в результатах поиска\n              type: object\n              properties:\n                current:\n                  example: 5\n                  description: Текущая средняя позиция\n                  type: integer\n                dynamics:\n                  example: 50\n                  description: Динамика по сравнению с предыдущим периодом, %\n                  type: integer\n              required:\n                - current\n            openCard:\n              description: Количество переходов в карточку товара из поиска\n              type: object\n              properties:\n                current:\n                  example: 5\n                  description: Текущее количество переходов\n                  type: integer\n                dynamics:\n                  example: 50\n                  description: Динамика по сравнению с предыдущим периодом, %\n                  type: integer\n              required:\n                - current\n            addToCart:\n              description: Сколько раз товар из поиска добавили в корзину\n              type: object\n              properties:\n                current:\n                  example: 5\n                  description: Текущее количество\n                  type: integer\n                dynamics:\n                  example: 50\n                  description: Динамика по сравнению с предыдущим периодом, %\n                  type: integer\n              required:\n                - current\n            openToCart:\n              description: Конверсия в корзину из поиска — доля добавлений товара в корзину по отношению ко всем переходам в карточку товара из поиска\n              type: object\n              properties:\n                current:\n                  example: 5\n                  description: Текущая конверсия\n                  type: integer\n                dynamics:\n                  example: 50\n                  description: Динамика по сравнению с предыдущим периодом, %\n                  type: integer\n              required:\n                - current\n            orders:\n              description: Сколько раз товары из поиска заказали\n              type: object\n              properties:\n                current:\n                  example: 5\n                  description: Текущее количество\n                  type: integer\n                dynamics:\n                  example: 50\n                  description: Динамика по сравнению с предыдущим периодом, %\n                  type: integer\n              required:\n                - current\n            cartToOrder:\n              description: Конверсия в заказ из поиска — доля заказов товара по отношению ко всем добавлениям товара из поиска в корзину\n              type: object\n              properties:\n                current:\n                  example: 5\n                  description: Текущая конверсия\n                  type: integer\n                dynamics:\n                  example: 50\n                  description: Динамика по сравнению с предыдущим периодом, %\n                  type: integer\n              required:\n                - current\n            visibility:\n              description: Процент видимости товара в результатах поиска\n              type: object\n              properties:\n                current:\n                  example: 5\n                  description: Текущий процент видимости\n                  type: integer\n                dynamics:\n                  example: 50\n                  description: Динамика по сравнению с предыдущим периодом, %\n                  type: integer\n              required:\n                - current\n          required:\n            - avgPosition\n            - openCard\n            - addToCart\n            - openToCart\n            - orders\n            - cartToOrder\n            - visibility\n        items:\n          type: array\n          description: Массив товаров группы\n          items:\n            $ref: '#/components/schemas/TableItemItem'\n      required:\n        - metrics\n        - items\n    TableItemItem:\n      type: object\n      allOf:\n        - type: object\n          properties:\n            nmId:\n              example: 268913787\n              description: Артикул WB\n              type: integer\n              format: int64\n            name:\n              example: iPhone 13 256 ГБ Серебристый\n              description: Название товара\n              type: string\n            vendorCode:\n              example: wb3ha2668w\n              description: Артикул продавца\n              type: string\n            subjectName:\n              example: Смартфоны\n              description: Название предмета\n              type: string\n            brandName:\n              example: Apple\n              description: Бренд\n              type: string\n            mainPhoto:\n              example: https://basket-12.wbbasket.ru/vol1788/part178840/178840836/images/c246x328/1.webp\n              description: URL главного фото карточки товара\n              type: string\n            isAdvertised:\n              example: false\n              description: Находится ли товар в продвижении в Поисковой выдаче\n              type: boolean\n            isSubstitutedSKU:\n              type: boolean\n              example: true\n              description: |\n                Искали ли товар по подменному артикулу.<br>\n                Поле будет в ответе при наличии в запросе `includeSubstitutedSKUs` и/или `includeSearchTexts`\n            isCardRated:\n              example: true\n              description: Есть ли рейтинг у карточки товара\n              type: boolean\n            rating:\n              example: 6\n              description: Рейтинг карточки товара\n              type: number\n              format: float64\n            feedbackRating:\n              example: 1\n              description: Рейтинг по отзывам\n              type: number\n              format: float64\n            price:\n              description: Цена\n              type: object\n              properties:\n                minPrice:\n                  example: 150\n                  description: Минимальная цена продавца со скидкой продавца (без учёта скидки WB Клуба)\n                  type: integer\n                  format: uint64\n                maxPrice:\n                  example: 300\n                  description: Максимальная цена продавца со скидкой продавца (без учёта скидки WB Клуба)\n                  type: integer\n                  format: uint64\n              required:\n                - minPrice\n                - maxPrice\n            avgPosition:\n              description: Средняя позиция товара в результатах поиска\n              type: object\n              properties:\n                current:\n     
"openapi: 3.0.1\ninfo:\n  title: Поставки FBW\n  version: ordersfbw\n  description: |\n    <div class=\"description_important\">\n      Узнать больше о поставках FBW можно в <a href=\"https://seller.wildberries.ru/instructions/subcategory/5a8e1202-0865-45b7-acae-5d0afc7add56?goBackOption=prevRoute&categoryId=479385c6-de01-4b4d-ad4e-ed941e65582e\">справочном центре</a>\n    </div>\n\n    <div class=\"api-block\">\n\n    В разделе описаны методы получения:\n      - [информации для формирования поставок](/openapi/orders-fbw#tag/informationForFormingSupplies)\n      - [информации о поставках](/openapi/orders-fbw#tag/suppliesInformation)\n\n    Вы можете создавать карточки товара в песочнице [Контента](/openapi/api-information#tag/authorization/Kategorii-tokenov), а потом использовать баркоды товаров в <a href='/sandbox'>песочнице</a> Поставок\n\n    </div>\n  x-file-name: orders-fbw\nsecurity:\n  - HeaderApiKey: []\ntags:\n  - name: Информация для формирования поставок\n    x-displayName: Информация для формирования поставок\n    description: ''\n  - name: Информация о поставках\n    x-displayName: Информация о поставках\n    description: ''\npaths:\n  /api/v1/acceptance/options:\n    servers:\n      - url: https://supplies-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://supplies-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV1AcceptanceOptions\n      x-readonly-method: true\n      x-category: supplies\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Информация для формирования поставок\n      summary: Опции приёмки\n      description: |\n        Метод [временно отключён](https://dev.wildberries.ru/release-notes?id=570)\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 6 запросов | 10 сек | 6 запросов |\n        | Сервисный | 1 мин | 6 запросов | 10 сек | 6 запросов |\n        | Базовый с секретом | 1 мин | 6 запросов | 10 сек | 6 запросов |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов.\n\n        </div>\n      parameters:\n        - name: warehouseID\n          in: query\n          description: ID склада. <br> Если параметр не указан, возвращаются данные по всем складам.<br> **Максимум одно значение**\n          schema:\n            type: integer\n          example: 507\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: array\n              maxItems: 5000\n              items:\n                $ref: '#/components/schemas/models.Good'\n            examples:\n              RequestOptions:\n                $ref: '#/components/examples/RequestOptions'\n        required: true\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/models.OptionsResultModel'\n              examples:\n                Response:\n                  $ref: '#/components/examples/OptionsResponse'\n        '400':\n          description: Некорректный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/models.ErrorModel'\n              examples:\n                BadWarehouseIDsParam:\n                  $ref: '#/components/examples/Response400Options'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n        '404':\n          description: Не найдено\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/warehouses:\n    servers:\n      - url: https://supplies-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://supplies-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      operationId: getV1Warehouses\n      x-readonly-method: true\n      x-category: supplies\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Информация для формирования поставок\n      summary: Список складов\n      description: |\n        Метод [временно отключён](https://dev.wildberries.ru/release-notes?id=570)\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 6 запросов | 10 сек | 6 запросов |\n        | Сервисный | 1 мин | 6 запросов | 10 сек | 6 запросов |\n        | Базовый с секретом | 1 мин | 6 запросов | 10 сек | 6 запросов |\n        | Базовый | 12 ч | 1 запрос | 12 ч | 1 запрос |\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов.\n\n        </div>\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: '#/components/schemas/models.WarehousesResultItems'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          description: Доступ запрещён\n        '404':\n          description: Не найдено\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/transit-tariffs:\n    servers:\n      - url: https://supplies-api.wildberries.ru\n    get:\n      operationId: getV1TransitTariffs\n      x-readonly-method: true\n      x-category: supplies\n      tags:\n        - Информация для формирования поставок\n      summary: Транзитные направления\n      description: |\n        Метод [временно отключён](https://dev.wildberries.ru/release-notes?id=570)\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 6 запросов | 10 сек | 10 запросов |\n        | Сервисный | 1 мин | 6 запросов | 10 сек | 10 запросов |\n        | Базовый с секретом | 1 мин | 6 запросов | 10 сек | 10 запросов |\n        | Базовый | 12 ч | 1 запрос | 12 ч | 1 запрос |\n        </div>\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: '#/components/schemas/models.TransitTariff'\n              examples:\n                ResponseTariffs:\n                  $ref: '#/components/examples/ResponseTariffs'\n        '401':\n          $ref: '#/components/responses/401'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/supplies:\n    servers:\n      - url: https://supplies-api.wildberries.ru\n    post:\n      operationId: postV1Supplies\n      x-readonly-method: true\n      x-category: supplies\n      tags:\n        - Информация о поставках\n      summary: Список поставок\n      description: |\n        Метод возвращает список поставок, по умолчанию — последние 1000 поставок.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 30 запросов | 2 сек | 10 запросов |\n        | Сервисный | 1 мин | 30 запросов | 2 сек | 10 запросов |\n        | Базовый с секретом | 1 мин | 30 запросов | 2 сек | 10 запросов |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n        </div>\n      parameters:\n        - name: limit\n          in: query\n          description: Количество записей в ответе\n          schema:\n            type: integer\n            default: 1000\n            maximum: 1000\n            minimum: 1\n        - name: offset\n          in: query\n          description: После какого элемента выдавать данные\n          schema:\n            type: integer\n            default: 0\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/models.SuppliesFiltersRequest'\n            example:\n              dates:\n                - from: '2024-03-04'\n                  till: '2025-03-24'\n                  type: factDate\n              statusIDs:\n                - 5\n                - 6\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: '#/components/schemas/models.Supply'\n              example:\n                - phone: +7 916 *** 44 44\n                  supplyID: null\n                  preorderID: 34597755\n                  createDate: '2024-12-29T16:58:26+03:00'\n                  supplyDate: null\n                  factDate: null\n                  updatedDate: null\n                  statusID: 1\n                  boxTypeID: 1\n                - phone: +7 916 *** 33 33\n                  supplyID: 26596368\n                  preorderID: 34601223\n                  createDate: '2024-12-29T16:57:59+03:00'\n                  supplyDate: '2024-12-29T00:00:00+03:00'\n                  factDate: null\n                  updatedDate: null\n                  statusID: 2\n                  boxTypeID: 5\n                - phone: +7 000 *** 36 76\n                  supplyID: 22677736\n                  preorderID: 27363170\n                  createDate: '2024-08-22T18:10:59+03:00'\n                  supplyDate: '2024-08-22T00:00:00+03:00'\n                  factDate: '2024-08-22T12:24:14+03:00'\n                  updatedDate: '2024-08-22T18:33:45+03:00'\n                  statusID: 6\n                  boxTypeID: 2\n                  isBoxOnPallet: false\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/models.ErrorModel'\n              examples:\n                BadTypeFormat:\n                  $ref: '#/components/examples/BadTypeFormat'\n                BadLimitFormat:\n                  $ref: '#/components/examples/BadLimitFormat'\n                BadOffsetFormat:\n                  $ref: '#/components/examples/BadOffsetFormat'\n                BadFromOrTill:\n                  $ref: '#/components/examples/BadFromOrTill'\n                BadStatusIDs:\n                  $ref: '#/components/examples/BadStatusIDs'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/supplies/{ID}:\n    servers:\n      - url: https://supplies-api.wildberries.ru\n    get:\n      operationId: getV1SuppliesId\n      x-readonly-method: true\n      x-category: supplies\n      tags:\n        - Информация о поставках\n      summary: Детали поставки\n      description: |\n        Метод возвращает детали поставки по ID.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 30 запросов | 2 сек | 10 запросов |\n        | Сервисный | 1 мин | 30 запросов | 2 сек | 10 запросов |\n        | Базовый с секретом | 1 мин | 30 запросов | 2 сек | 10 запросов |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n        </div>\n      parameters:\n        - name: ID\n          in: path\n          description: ID поставки или заказа\n          required: true\n          schema:\n            type: integer\n        - name: isPreorderID\n          in: query\n          description: |\n            Поиск по:\n              - `true` — ID заказа, если в `ID` передаёте ID заказа\n              - `false` — ID поставки, если в `ID` передаёте ID поставки\n          schema:\n            type: boolean\n            default: false\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/models.SupplyDetails'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/models.ErrorModel'\n              examples:\n                BadPathParamFormat:\n                  $ref: '#/components/examples/BadPathParamFormat'\n                BadisPreorderIDFormat:\n                  $ref: '#/components/examples/BadisPreorderIDFormat'\n                PreorderIdSearchError:\n                  $ref: '#/components/examples/PreorderIdSearchError'\n                BadID:\n                  $ref: '#/components/examples/BadID'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '404':\n          description: Не найдено\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/models.ErrorModel'\n              examples:\n                SupplyNotFound:\n                  $ref: '#/components/examples/SupplyNotFound'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/supplies/{ID}/goods:\n    servers:\n      - url: https://supplies-api.wildberries.ru\n    get:\n      operationId: getV1SuppliesIdGoods\n      x-readonly-method: true\n      x-category: supplies\n      tags:\n        - Информация о поставках\n      summary: Товары поставки\n      description: |\n        Метод возвращает информацию о товарах в поставке.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 30 запросов | 2 сек | 10 запросов |\n        | Сервисный | 1 мин | 30 запросов | 2 сек | 10 запросов |\n        | Базовый с секретом | 1 мин | 30 запросов | 2 сек | 10 запросов |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n        </div>\n      parameters:\n        - name: limit\n          in: query\n          description: Количество записей в ответе\n          schema:\n            type: integer\n            default: 100\n            maximum: 1000\n            minimum: 1\n        - name: offset\n          in: query\n          description: После какого элемента выдавать данные\n          schema:\n            type: integer\n            default: 0\n        - name: isPreorderID\n          in: query\n          description: |\n            Поиск по:\n              - `true` — ID заказа, если в `ID` передаёте ID заказа\n              - `false` — ID поставки, если в `ID` передаёте ID поставки\n          schema:\n            type: boolean\n            default: false\n        - name: ID\n          in: path\n          description: ID поставки или заказа\n          required: true\n          schema:\n            type: integer\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: '#/components/schemas/models.GoodInSupply'\n        '400':\n          description: Неправильный запрос\n          content:\n            text/plain; charset=utf-8:\n              schema:\n                $ref: '#/components/schemas/models.ErrorModel'\n              examples:\n                BadOffsetFormat:\n                  $ref: '#/components/examples/BadOffsetFormat'\n                BadisPreorderIDFormat:\n                  $ref: '#/components/examples/BadisPreorderIDFormat'\n                BadPathParamFormat:\n                  $ref: '#/components/examples/BadPathParamFormat'\n                BadLimitFormat:\n                  $ref: '#/components/examples/BadLimitFormat'\n                BadSupplyIDItems:\n                  $ref: '#/components/examples/BadSupplyIDItems'\n                BadID:\n                  $ref: '#/components/examples/BadID'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/supplies/{ID}/package:\n    servers:\n      - url: https://supplies-api.wildberries.ru\n    get:\n      operationId: getV1SuppliesIdPackage\n      x-readonly-method: true\n      x-category: supplies\n      tags:\n        - Информация о поставках\n      summary: Упаковка поставки\n      description: |\n        Метод возвращает информацию об упаковке поставки.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 30 запросов | 2 сек | 10 запросов |\n        | Сервисный | 1 мин | 30 запросов | 2 сек | 10 запросов |\n        | Базовый с секретом | 1 мин | 30 запросов | 2 сек | 10 запросов |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n        </div>\n      parameters:\n        - name: ID\n          in: path\n          description: ID поставки\n          required: true\n          schema:\n            type: integer\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: '#/components/schemas/models.Box'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/models.ErrorModel'\n              examples:\n                BadPathParamFormat:\n                  $ref: '#/components/examples/BadPathParamFormat'\n                BadSupplyIDPackage:\n                  $ref: '#/components/examples/BadSupplyIDPackage'\n                BadID:\n                  $ref: '#/components/examples/BadID'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\ncomponents:\n  securitySchemes:\n    HeaderApiKey:\n      type: apiKey\n      name: Authorization\n      in: header\n  schemas:\n    models.TransitTariff:\n      type: object\n      properties:\n        transitWarehouseName:\n          type: string\n          description: Транзитный склад\n        destinationWarehouseName:\n          type: string\n          description: Склад назначения\n        activeFrom:\n          type: string\n          description: С какого числа доступно транзитное направление\n          format: date-time\n        boxTariff:\n          nullable: true\n          type: array\n          description: Тариф за транзит коробов. Если `null`, транзит для коробов недоступен\n          items:\n            $ref: '#/components/schemas/models.VolumeTariff'\n        palletTariff:\n          type: integer\n          description: Тариф за паллету, ₽\n    models.VolumeTariff:\n      type: object\n      properties:\n        from:\n          type: integer\n          description: Объём поставки от, литры\n        to:\n          type: integer\n          description: Объём поставки до, литры\n        value:\n          type: number\n          description: Тариф, ₽ за литр\n    models.Box:\n      type: object\n      properties:\n        packageCode:\n          type: string\n          description: Штрих-код упаковки\n        quantity:\n          type: integer\n          description: Суммарное количество товара в упаковке, шт\n        barcodes:\n          type: array\n          description: Список упакованных товаров\n          items:\n            $ref: '#/components/schemas/models.GoodInBox'\n      example:\n        packageCode: WB_689\n        quantity: 1\n        barcodes:\n          - barcode: '1234567891234'\n            quantity: 1\n    models.GoodInBox:\n      type: object\n      properties:\n        barcode:\n          type: string\n          description: Баркод\n        quantity:\n          type: integer\n          description: Количество, шт\n    models.SuppliesFiltersRequest:\n      properties:\n        dates:\n          description: Фильтр по датам\n          items:\n            $ref: '#/components/schemas/models.DateFilterRequest'\n          type: array\n        statusIDs:\n          description: |\n            Фильтр поставок по статусам. Возможные значения:\n              - `1` — Не запланировано\n              - `2` — Запланировано\n              - `3` — Отгрузка разрешена\n              - `4` — Идёт приёмка\n              - `5` — Принято\n              - `6` — Отгружено на воротах\n          items:\n            $ref: '#/components/schemas/models.HandySupplyStatus'\n          type: array\n      type: object\n    models.GoodInSupply:\n      type: object\n      properties:\n        barcode:\n          description: Баркод товара\n          type: string\n        vendorCode:\n          type: string\n          description: Артикул продавца\n        nmID:\n          type: integer\n          description: Артикул WB\n        needKiz:\n          description: |\n            Нужен ли [код маркировки Честного знака](https://честныйзнак.рф/) для этого товара:\n              - `false` — не нужен\n              - `true` — нужен\n          type: boolean\n        tnved:\n          type: string\n          description: |\n            Код ТНВЭД.\n            <br>\n            Если `\"needKiz\":true`, а `\"tnved\":null`, нужно заполнить характеристику товара **ТН ВЭД** в [личном кабинете](https://seller.wildberries.ru/new-goods) или по [API](./work-with-products#tag/listings/paths/~1content~1v2~1cards~1update/post)\n          nullable: true\n        techSize:\n          type: string\n          description: Размер товара, указанный продавцом\n        color:\n          description: Цвет товара\n          type: string\n          nullable: true\n        supplierBoxAmount:\n          type: integer\n          nullable: true\n          description: Указано в упаковке, шт\n        quantity:\n          type: integer\n          description: Указано в поставке/заказе, шт\n        readyForSaleQuantity:\n          type: integer\n          nullable: true\n          description: Поступило в продажу, шт\n        acceptedQuantity:\n          type: integer\n          nullable: true\n          description: Принято, шт\n        unloadingQuantity:\n          type: integer\n          nullable: true\n          description: Количество товара на раскладке, шт\n      example:\n        barcode: '1234567891234'\n        vendorCode: wb4sewt0vg\n        nmID: 987456654\n        needKiz: true\n        tnved: '6204430000'\n        techSize: C\n        color: красный\n        supplierBoxAmount: 10\n        quantity: 10\n        readyForSaleQuantity: 0\n        unloadingQuantity: 0\n        acceptedQuantity: 0\n    models.DateFilter
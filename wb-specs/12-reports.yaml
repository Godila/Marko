ос | 1 мин | 1 запрос |\n        | Базовый с секретом | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        | Базовый | 6 ч | 1 запрос | 6 ч | 1 запрос |\n        </div>\n      parameters:\n        - in: query\n          name: dateFrom\n          description: Начало отчётного периода. По умолчанию используется дата, когда были впервые получены данные для отчёта\n          schema:\n            type: string\n            format: date-time\n          example: '2025-02-01T15:00:00Z'\n        - in: query\n          name: dateTo\n          required: true\n          description: Конец отчётного периода\n          schema:\n            type: string\n            format: date-time\n          example: '2025-10-11T18:00:00Z'\n        - name: limit\n          in: query\n          required: true\n          schema:\n            type: integer\n            example: 330\n            maximum: 1000\n          description: Количество удержаний в ответе\n        - name: offset\n          in: query\n          schema:\n            type: integer\n            example: 220\n            default: 0\n          description: Сколько элементов пропустить. Например, для значения `10` ответ начнётся с 11 элемента\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/MeasurementPenalties'\n              examples:\n                MeasurementPenalties:\n                  $ref: '#/components/examples/MeasurementPenalties'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Response400Retentions'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n           
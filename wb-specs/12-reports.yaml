мин | 1 запрос |\n        | Базовый с секретом | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        | Базовый | 1 ч | 4 запроса | 15 мин | 1 запрос |\n        </div>\n      parameters:\n        - name: dateFrom\n          in: query\n          description: Начало отчётного периода. По умолчанию используются дата и время, когда были впервые получены данные для отчёта\n          schema:\n            type: string\n            format: date-time\n          example: '2025-02-01T15:00:00Z'\n        - name: dateTo\n          in: query\n          required: true\n          description: Конец отчётного периода\n          schema:\n            type: string\n            format: date-time\n          example: '2025-10-11T18:00:00Z'\n        - name: sort\n          in: query\n          schema:\n            type: string\n            enum:\n              - nmId\n              - dtBonus\n              - bonusSumm\n            default: dtBonus\n            example: nmId\n          description: |\n            Сортировка:\n            - `nmId` — по артикулу WB\n            - `dtBonus` — по дате и времени удержания\n            - `bonusSumm` — по сумме удержания\n        - name: order\n          in: query\n          schema:\n            type: string\n            enum:\n              - desc\n              - asc\n            default: desc\n            example: asc\n          description: |\n            Порядок выдачи:\n            - `desc` — по убыванию\n            - `asc` — по возрастанию\n        - name: limit\n          in: query\n          required: true\n          schema:\n            type: integer\n            example: 330\n            maximum: 1000\n          description: Количество удержаний в ответе\n        - name: offset\n          in: query\n          schema:\n            type: integer\n            example: 220\n            default: 0\n          description: Сколько элементов пропустить. Например, для значения `10` ответ начнётся с 11 элемента\n      responses:\n        '200':\n          $ref: '#/components/responses/SuccessSubstIncorAttachResponse'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Response400Retentions'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Response403Retentions'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/analytics/antifraud-details:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    get:\n      operationId: getV1AnalyticsAntifraudDetails\n      x-readonly-method: true\n      x-category: contentanalytics\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Отчёты об удержаниях\n      summary: Самовыкупы\n      description: |\n        Метод возвращает отчёт об удержаниях за самовыкупы. Отчёт формируется каждую неделю по средам, до 7:00 по московскому времени, и содержит данные за одну неделю.<br><br>\n\n        Удержание за самовыкуп — 30% от стоимости товаров.<br>Минимальная сумма всех удержаний — 100 000 ₽, если за неделю в ПВЗ привезли ваших товаров больше, чем на сумму 100 000 ₽.<br><br>\n\n        Данные доступны с августа 2023.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 10 мин | 1 запрос | 10 мин | 10 запросов |\n        | Сервисный | 10 мин | 1 запрос | 10 мин | 10 запросов |\n        | Базовый с секретом | 10 мин | 1 запрос | 10 мин | 10 запросов |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Date'\n      responses:\n        '200':\n          $ref: '#/components/responses/SuccessTaskResponse'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/4xxResponse'\n              examples:\n                IncorrectDate:\n                  $ref: '#/components/examples/IncorrectDate'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/analytics/goods-labeling:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    get:\n      operationId: getV1AnalyticsGoodsLabeling\n      x-readonly-method: true\n      x-category: contentanalytics\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Отчёты об удержаниях\n      summary: Маркировка товара\n      description: |\n        Метод возвращает отчёт о штрафах за отсутствие обязательной маркировки товаров.<br>\n\n        В отчёте представлены фотографии товаров, на которых маркировка отсутствует либо не считывается.<br><br>\n\n        Можно получить данные максимум за 31 день. Данные доступны с марта 2024.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 1 запрос | 1 мин | 10 запросов |\n        | Сервисный | 1 мин | 1 запрос | 1 мин | 10 запросов |\n        | Базовый с секретом | 1 мин | 1 запрос | 1 мин | 10 запросов |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/DateFromGoodsLabeling'\n        - $ref: '#/components/parameters/DateToGoodsLabeling'\n      responses:\n        '200':\n          $ref: '#/components/responses/SuccessGoodsLabelingResponse'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/4xxResponse'\n              examples:\n                MissingDateTimeFrom:\n                  $ref: '#/components/examples/MissingDateTimeFrom'\n                MissingDateTimeTo:\n                  $ref: '#/components/examples/MissingDateTimeTo'\n                IncorrectDateTimeFrom:\n                  $ref: '#/components/examples/IncorrectDateTimeFrom'\n                IncorrectDateTimeTo:\n                  $ref: '#/components/examples/IncorrectDateTimeTo'\n                DateRangeExceeded:\n                  $ref: '#/components/examples/DateRangeExceeded'\n                DateRanges:\n                  $ref: '#/components/examples/DateRanges'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/acceptance_report:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    get:\n      operationId: getV1AcceptanceReport\n      x-readonly-method: true\n      x-category: contentanalytics\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Операции при приёмке\n      summary: Создать отчёт\n      description: |\n        Метод создаёт [задание на генерацию](/openapi/reports#tag/acceptanceExpenses/operation/getV1AcceptanceReportTasksTaskIdStatus) отчёта об [операциях при приёмке](/openapi/reports#tag/acceptanceExpenses/operation/getV1AcceptanceReportTasksTaskIdDownload).<br><br>\n\n        Можно получить отчёт максимум за 31 день.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один ак
ion: Неправильный запрос\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/4xxResponse'\n              example:\n                detail: 'Invalid format for parameter task_id: error unmarshaling ''2f071556-ae39-492f-fd8cf1eb0d25'' text as *uuid.UUID: invalid UUID length: 31'\n                origin: api-statistics\n                requestId: 52dd27a91a1a643feae7201b206462df\n                title: Bad Request\n        '401':\n          $ref: '#/components/responses/401'\n        '404':\n          description: Не найдено\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/4xxResponse'\n              example:\n                detail: not found\n                origin: api-statistics\n                requestId: c777731fc180f215a49c9896c2f1200d\n                title: Not Found\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/paid_storage/tasks/{task_id}/download:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    get:\n      operationId: getV1PaidStorageTasksTaskIdDownload\n      x-readonly-method: true\n      x-category: contentanalytics\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Платное хранение\n      summary: Получить отчёт\n      description: |\n        Метод возвращает отчёт о [платном хранении](https://seller.wildberries.ru/analytics-reports/paid-storage/storage) по ID [задания на генерацию](/openapi/reports#tag/paidStorage/operation/getV1PaidStorage).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        | Сервисный | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        | Базовый с секретом | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n        </div>\n      parameters:\n        - name: task_id\n          in: path\n          required: true\n          schema:\n            type: string\n            example: 06e06887-9d9f-491f-b16a-bb1766fcb8d2\n          description: |\n            ID задания на генерацию\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponsePaidStorage'\n              example:\n                - date: '2023-10-01'\n                  logWarehouseCoef: 0\n                  officeId: 0\n                  warehouse: Склад WB РФ\n                  warehouseCoef: 1.7\n                  giId: 123456\n                  chrtId: 1234567\n                  size: '0'\n                  barcode: ''\n                  subject: Маски одноразовые\n                  brand: 1000 Каталог\n                  vendorCode: '567383'\n                  nmId: 1234567\n                  volume: 12\n                  calcType: 'короба: без габаритов'\n                  warehousePrice: 7.65\n                  barcodesCount: 1\n                  palletPlaceCode: 0\n                  palletCount: 0\n                  originalDate: '2023-03-01'\n                  loyaltyDiscount: 10\n                  tariffFixDate: '2023-10-01'\n                  tariffLowerDate: '2023-11-01'\n        '204':\n          description: Нет данных\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/4xxResponse'\n              example:\n                detail: 'Invalid format for parameter task_id: error unmarshaling ''7b8875---9f03-46f1-af21-b9b4b22fe821'' text as *uuid.UUID: invalid UUID format'\n                origin: api-statistics\n                requestId: 44bac63ab29c46cb2d49392e6604c1a0\n                title: Bad Request\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '404':\n          description: Не найдено\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/4xxResponse'\n              example:\n                detail: not found\n                origin: api-statistics\n                requestId: c777731fc180f215a49c9896c2f1200d\n                title: Not Found\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/analytics/region-sale:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    get:\n      operationId: getV1AnalyticsRegionSale\n      x-readonly-method: true\n      x-category: contentanalytics\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Продажи по регионам\n      summary: Получить отчёт\n      description: |\n        Метод возвращает отчёт с [данными продаж, сгруппированных по регионам стран](https://seller.wildberries.ru/analytics-reports/region-sale).<br><br>\n\n        Можно получить отчёт максимум за 31 день.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 10 сек | 1 запрос | 10 сек | 5 запросов |\n        | Сервисный | 10 сек | 1 запрос | 10 сек | 5 запросов |\n        | Базовый с секретом | 10 сек | 1 запрос | 10 сек | 5 запросов |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/DateFrom'\n        - $ref: '#/components/parameters/DateTo'\n      responses:\n        '200':\n          $ref: '#/components/responses/SuccessRegionSaleResponse'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/4xxResponse'\n              examples:\n                MissingDateTimeFrom:\n                  $ref: '#/components/examples/MissingDateTimeFrom'\n                MissingDateTimeTo:\n                  $ref: '#/components/examples/MissingDateTimeTo'\n                IncorrectDateTimeFrom:\n                  $ref: '#/components/examples/IncorrectDateTimeFrom'\n                IncorrectDateTimeTo:\n                  $ref: '#/components/examples/IncorrectDateTimeTo'\n                DateRangeExceeded:\n                  $ref: '#/components/examples/DateRangeExceeded'\n                DateRanges:\n                  $ref: '#/components/examples/DateRanges'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/analytics/brand-share/brands:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    get:\n      operationId: getV1AnalyticsBrandShareBrands\n      x-readonly-method: true\n      x-category: contentanalytics\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Доля бренда в продажах\n      summary: Бренды продавца\n      description: |\n        Метод возвращает список брендов продавца для отчёта о [доле бренда в продажах](https://seller.wildberries.ru/analytics-reports/brand-share). <br><br>\n\n        Можно получить только бренды, которые:\n        - Продавались за последние 90 дней\n        - Есть в наличии, вне зависимости от склада хранения\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 1 запрос | 1 мин | 10 запросов |\n        | Сервисный | 1 мин | 1 запрос | 1 мин | 10 запросов |\n        | Базовый с секретом | 1 мин | 1 запрос | 1 мин | 10 запросов |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      responses:\n        '200':\n          $ref: '#/components/responses/SuccessBrandsResponse'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/analytics/brand-share/parent-subjects:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    get:\n      operationId: getV1AnalyticsBrandShareParentSubjects\n      x-readonly-method: true\n      x-category: contentanalytics\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Доля бренда в продажах\n      summary: Родительские категории бренда\n      description: |\n        Метод возвращает родительские категории бренда продавца для отчёта о [доле бренда в продажах](https://seller.wildberries.ru/analytics-reports/brand-share).<br><br>\n\n        Можно получить отчёт максимум за 365 дней. Данные доступны с 1 ноября 2022.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 5 сек | 1 запрос | 5 сек | 20 запросов |\n        | Сервисный | 5 сек | 1 запрос | 5 сек | 20 запросов |\n        | Базовый с секретом | 5 сек | 1 запрос | 5 сек | 20 запросов |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      parameters:\n        - in: query\n          name: locale\n          schema:\n            type: string\n            example: ru\n            default: ru\n          description: |\n            Язык поля ответа `parentName`:\n              - `ru` — русский\n              - `en` — английский\n              - `zh` — китайский\n        - in: query\n          name: brand\n          schema:\n            type: string\n            example: H%26M\n          required: true\n          description: Бренд\n        - $ref: '#/components/parameters/DateFrom'\n        - $ref: '#/components/parameters/DateTo'\n      responses:\n        '200':\n          $ref: '#/components/responses/SuccessParentsResponse'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/4xxResponse'\n              examples:\n                IncorrectDateFrom:\n                  $ref: '#/components/examples/IncorrectDateFromBS'\n                MissingDateTimeFrom:\n                  $ref: '#/components/examples/MissingDateTimeFrom'\n                MissingDateTimeTo:\n                  $ref: '#/components/examples/MissingDateTimeTo'\n                IncorrectDateTimeFrom:\n                  $ref: '#/components/examples/IncorrectDateTimeFrom'\n                IncorrectDateTimeTo:\n                  $ref: '#/components/examples/IncorrectDateTimeTo'\n                DateRangeExceeded:\n                  $ref: '#/components/examples/DateRangeExceeded365'\n                DateRanges:\n                  $ref: '#/components/examples/DateRanges'\n                LocaleError:\n                  $ref: '#/components/examples/LocaleError'\n                MissingBrand:\n                  $ref: '#/components/examples/MissingBrand'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/analytics/brand-share:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    get:\n      operationId: getV1AnalyticsBrandShare\n      x-readonly-method: true\n      x-category: contentanalytics\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Доля бренда в продажах\n      summary: Получить отчёт\n      description: |\n        Метод возвращает отчёт о [доле бренда продавца в продажах](https://seller.wildberries.ru/analytics-reports/brand-share). <br><br>\n\n        Можно получить отчёт максимум за 365 дней. Данные доступны с 1 ноября 2022.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 5 сек | 1 запрос | 5 сек | 20 запросов |\n        | Сервисный | 5 сек | 1 запрос | 5 сек | 20 запросов |\n        | Базовый с секретом | 5 сек | 1 запрос | 5 сек | 20 запросов |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      parameters:\n        - in: query\n          name: parentId\n          schema:\n            type: integer\n            example: 1\n          required: true\n          description: ID родительской категории\n        - in: query\n          name: brand\n          schema:\n            type: string\n            example: H%26M\n          required: true\n          description: Бренд\n        - $ref: '#/components/parameters/DateFrom'\n        - $ref: '#/components/parameters/DateTo'\n      responses:\n        '200':\n          $ref: '#/components/responses/SuccessBrandShareResponse'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/4xxResponse'\n              examples:\n                IncorrectDateFrom:\n                  $ref: '#/components/examples/IncorrectDateFromBS'\n                MissingDateTimeFrom:\n                  $ref: '#/components/examples/MissingDateTimeFrom'\n                MissingDateTimeTo:\n                  $ref: '#/components/examples/MissingDateTimeTo'\n                IncorrectDateTimeFrom:\n                  $ref: '#/components/examples/IncorrectDateTimeFrom'\n                IncorrectDateTimeTo:\n                  $ref: '#/components/examples/IncorrectDateTimeTo'\n                DateRangeExceeded:\n                  $ref: '#/components/examples/DateRangeExceeded365'\n                DateRanges:\n                  $ref: '#/components/examples/DateRanges'\n                MissingParentId:\n                  $ref: '#/components/examples/MissingParentId'\n                MissingBrand:\n                  $ref: '#/components/examples/MissingBrand'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/analytics/banned-products/blocked:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    get:\n      operationId: getV1AnalyticsBannedProducsBlocked\n      x-readonly-method: true\n      x-category: contentanalytics\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Заблокированные карточки\n      summary: Получить отчёт\n      description: |\n        Метод возвращает список [заблокированных карточек товаров продавца](https://seller.wildberries.ru/analytics-reports/banned-products) с причинами блокировки.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 10 сек | 1 запрос | 10 сек | 6 запросов |\n        | Сервисный | 10 сек | 1 запрос | 10 сек | 6 запросов |\n        | Базовый с секретом | 10 сек | 1 запрос | 10 сек | 6 запросов |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      parameters:\n        - in: query\n          name: sort\n          schema:\n            type: string\n            enum:\n              - brand\n              - nmId\n              - title\n              - vendorCode\n              - reason\n            example: nmId\n          description: |\n            Сортировка\n            - `brand` — по бренду\n            - `nmId` — по артикулу WB\n            - `title` — по наименованию товара\n            - `vendorCode` — по артикулу продавца\n            - `reason` — по причине блокировки\n          required: true\n        - in: query\n          name: order\n          schema:\n            type: string\n            enum:\n              - desc\n              - asc\n            example: asc\n          description: |\n            Порядок выдачи\n            - `desc` — от наибольшего числового значения к наименьшему, от последнего по алфавиту значения к первому\n            - `asc` — от наименьшего числового значения к наибольшему, от первого по алфавиту значения к последнему\n          required: true\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  report:\n                    description: Отчёт\n                    type: array\n                    items:\n                      type: object\n                      properties:\n                        brand:\n                          type: string\n                          example: Тест22\n                          description: Бренд\n                        nmId:\n                          type: integer\n                          example: 82722944\n                          description: Артикул WB\n                        title:\n                          type: string\n                          example: Гуминовые кислоты - биоактивный противовирусный комплекс на\n                          description: Наименование товара\n                        vendorCode:\n                          type: string\n                          example: пкdeир76\n                          description: Артикул продавца\n                        reason:\n                          type: string\n                          example: Контактные данные Продавца и ссылки на иные сайты/группы/сообщества на фотографиях Товара\n                          description: Причина блокировки\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  title:\n                    type: string\n                    description: Заголовок ошибки\n                  status:\n                    type: number\n                    description: HTTP статус-код\n                  detail:\n                    type: string\n                    description: Детали ошибки\n                  requestId:\n                    type: string\n                    description: Уникальный ID запроса\n                  origin:\n                    type: string\n                    description: ID внутреннего сервиса WB\n              example:\n                title: bad request\n                status: 400\n                detail: missing sort\n                requestId: 94b52fca-8403-49fb-85dd-95dfb73160ad\n                origin: banreportsvc-api\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/analytics/goods-return:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    get:\n      operationId: getV1AnalyticsGoodsReturn\n      x-readonly-method: true\n      x-category: contentanalytics\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Отчёт о возвратах и перемещении товаров\n      summary: Получить отчёт\n      description: |\n        Метод возвращает отчёт о [возвратах товаров продавцу](https://seller.wildberries.ru/analytics-reports/goods-return). <br><br>\n\n        Можно получить отчёт максимум за 31 день.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 1 запрос | 1 мин | 10 запросов |\n        | Сервисный | 1 мин | 1 запрос | 1 мин | 10 запросов |\n        | Базовый с секретом | 1 мин | 1 запрос | 1 мин | 10 запросов |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n        </div>\n      parameters:\n        - name: dateFrom\n          in: query\n          required: true\n          schema:\n            type: string\n            format: date\n            example: '2024-08-13'\n          description: Дата начала отчётного периода\n        - name: dateTo\n          in: query\n          required: true\n          schema:\n            type: string\n            format: date\n            example: '2024-08-27'\n          description: Дата окончания отчётного периода\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  report:\n                    description: Отчёт\n                    type: array\n                    items:\n                      type: object\n                      properties:\n                        barcode:\n                          type: string\n                          example: '1680063403480'\n                          description: Баркод\n                        brand:\n                          type: string\n                          example: dub\n                          description: Бренд\n                        completedDt:\n                          type: string\n                          nullable: true\n                          example: '2025-03-31T11:33:53'\n                          description: Дата и время выдачи возврата продавцу\n                        dstOfficeAddress:\n                          type: string\n                          example: Жуковский Улица Маяковского 19\n                          description: Адрес ПВЗ выдачи возврата\n                        dstOfficeId:\n                          type: integer\n                          example: 310105\n                          description: ID ПВЗ выдачи возврата\n                        expiredDt:\n                          type: string\n                          nullable: true\n                          example: '2025-03-31T11:33:53'\n                          description: Дата и время истечения срока хранения возврата\n                        isStatusActive:\n                          type: integer\n                          example: 0\n                          description: |\n                            Тип статуса возврата:\n\n                              * `0` — архивный\n                              * `1` — активный\n                          enum:\n                            - 0\n                            - 1\n                        nmId:\n                          type: integer\n                          example: 12862181\n                          description: Артикул WB\n                        orderDt:\n                          type: string\n                          format: date\n                          example: '2024-08-26'\n                          description: Дата заказа на возврат\n                        orderId:\n                          type: integer\n                          example: 2034240826\n                          description: Номер сборочного задания\n                        readyToReturnDt:\n                          type: string\n                          nullable: true\n                          example: '2025-01-31T08:33:50'\n                          description: Дата и время готовности возврата к выдаче\n                        reason:\n                          type: string\n                          example: Цвет\n                          description: Причина возврата\n                        returnType:\n                          type: string\n                          example: Возврат заблокированного товара\n                          description: Тип возврата\n                        shkId:\n                          type: integer\n                          example: 23411783472\n                          description: Штрихкод\n                        srid:\n                          type: string\n                          example: ad3817664d3046c5a8d55054d8be96d6\n                          description: Уникальный ID заказа на возврат\n                        status:\n                          type: string\n                          example: В пути в пвз\n                          description: Статус возврата\n                        stickerId:\n                          type: string\n                          example: '33811984302'\n                          description: Стикер заказа на возврат\n                        subjectName:\n                          type: string\n                          example: Багажные бирки\n                          description: Предмет\n                        techSize:\n                          type: string\n                          example: '0'\n                          description: Размер\n        '400':\n          description: Неправильный запрос\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/4xxResponse'\n              examples:\n                MissingDateTimeFrom:\n                  $ref: '#/components/examples/MissingDateTimeFrom'\n                MissingDateTimeTo:\n                  $ref: '#/components/exa
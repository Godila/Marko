   barcode:\n          type: string\n          maxLength: 30\n          description: Баркод\n        category:\n          type: string\n          maxLength: 50\n          description: Категория\n        subject:\n          type: string\n          maxLength: 50\n          description: Предмет\n        brand:\n          type: string\n          maxLength: 50\n          description: Бренд\n        techSize:\n          type: string\n          maxLength: 30\n          description: Размер товара\n        incomeID:\n          type: integer\n          description: Номер поставки\n        isSupply:\n          type: boolean\n          description: Договор поставки\n        isRealization:\n          type: boolean\n          description: Договор реализации\n        totalPrice:\n          type: number\n          description: Цена без скидок\n        discountPercent:\n          type: integer\n          description: \"Скидка продавца,\\_%\"\n        spp:\n          type: number\n          description: \"Скидка WB,\\_%\"\n        finishedPrice:\n          type: number\n          description: Цена с учетом всех скидок, кроме суммы по WB Кошельку\n        priceWithDisc:\n          type: number\n          description: Цена со скидкой продавца, в том числе со скидкой WB Клуба\n        isCancel:\n          type: boolean\n          description: |\n            Отмена заказа:\n              - `true` — заказ отменен\n        cancelDate:\n          type: string\n          description: Дата и время отмены заказа. Если заказ не был отменен, то \"0001-01-01T00:00:00\".Если часовой пояс не указан, то берётся Московское время UTC+3.\n        sticker:\n          type: string\n          description: ID стикера\n        gNumber:\n          type: string\n          maxLength: 50\n          description: ID корзины покупателя. Заказы одной транзакции будут иметь одинаковый `gNumber`\n        srid:\n          type: string\n          description: |\n            Уникальный ID заказа.<br>\n            Примечание для использующих API Маркетплейс: `srid` равен `rid` в ответах методов сборочных заданий.\n    SalesItem:\n      type: object\n      properties:\n        date:\n          type: string\n          description: Дата и время продажи. Это поле соответствует параметру `dateFrom` в запросе, если параметр `flag`=1. Если часовой пояс не указан, то берётся Московское время (UTC+3).\n        lastChangeDate:\n          type: string\n          description: Дата и время обновления информации в сервисе. Это поле соответствует параметру `dateFrom` в запросе, если параметр `flag`=0 или не указан. Если часовой пояс не указан, то берётся Московское время (UTC+3).\n        warehouseName:\n          type: string\n          maxLength: 50\n          description: Склад отгрузки\n        warehouseType:\n          type: string\n          description: Тип склада хранения товаров\n          enum:\n            - Склад WB\n            - Склад продавца\n        countryName:\n          type: string\n          maxLength: 200\n          description: Страна\n        oblastOkrugName:\n          type: string\n          maxLength: 200\n          description: Округ\n        regionName:\n          type: string\n          maxLength: 200\n          description: Регион\n        supplierArticle:\n          type: string\n          maxLength: 75\n          description: Артикул продавца\n        nmId:\n          type: integer\n          description: Артикул WB\n        barcode:\n          type: string\n          maxLength: 30\n          description: Баркод\n        category:\n          type: string\n          maxLength: 50\n          description: Категория\n        subject:\n          type: string\n          maxLength: 50\n          description: Предмет\n        brand:\n          type: string\n          maxLength: 50\n          description: Бренд\n        techSize:\n          type: string\n          maxLength: 30\n          description: Размер товара\n        incomeID:\n          type: integer\n          description: Номер поставки\n        isSupply:\n          type: boolean\n          description: Договор поставки\n        isRealization:\n          type: boolean\n          description: Договор реализации\n        totalPrice:\n          type: number\n          description: Цена без скидок\n        discountPercent:\n          type: integer\n          description: \"Скидка продавца,\\_%\"\n        spp:\n          type: number\n          description: \"Скидка WB,\\_%\"\n        paymentSaleAmount:\n          type: integer\n          description: Скидка за оплату WB Кошельком, ₽\n        forPay:\n          type: number\n          description: К перечислению продавцу.<br>Синхронизация данных занимает до 24 часов, в течение этого времени в поле может отображаться значение `0`\n        finishedPrice:\n          type: number\n          description: Фактическая цена с учётом всех скидок (к взиманию с покупателя).<br>Синхронизация данных занимает до 24 часов, в течение этого времени в поле может отображаться значение `0`\n        priceWithDisc:\n          type: number\n          description: Цена со скидкой продавца, в том числе со скидкой WB Клуба, от которой рассчитывается сумма к перечислению продавцу `forPay`.<br>Синхронизация данных занимает до 24 часов, в течение этого времени в поле может отображаться значение `0`\n        saleID:\n          type: string\n          maxLength: 15\n          description: |\n            Уникальный ID продажи/возврата\n            - `S**********` — продажа\n            - `R**********` — возврат (на склад WB)\n        sticker:\n          type: string\n          description: ID стикера\n        gNumber:\n          type: string\n          maxLength: 50\n          description: ID корзины покупателя. Заказы одной транзакции будут иметь одинаковый `gNumber`\n        srid:\n          type: string\n          description: |\n            Уникальный ID заказа.<br>\n            Примечание для использующих API Маркетплейс: `srid` равен `rid` в ответах методов сборочных заданий.\n    responseErrorStatistics:\n      type: object\n      properties:\n        errors:\n          type: array\n          items:\n            type: string\n    responseErrorStatistics2:\n      type: object\n      properties:\n        errors:\n          type: string\n    ExciseReportRequest:\n      type: object\n      properties:\n        countries:\n          type: array\n          description: |\n            Код стран по стандарту ISO 3166-2. Чтобы получить данные по всем странам, оставьте параметр пустым\n          items:\n            type: string\n            enum:\n              - AM\n              - BY\n              - KG\n              - KZ\n              - RU\n              - UZ\n      example:\n        countries:\n          - AM\n          - RU\n    ExciseReportResponse:\n      type: object\n      properties:\n        response:\n          $ref: '#/components/schemas/models.ExciseReportResponse'\n    models.ExciseReportResponse:\n      type: object\n      properties:\n        data:\n          $ref: '#/components/schemas/models.ExciseReportResponseData'\n    models.ExciseReportResponseData:\n      type: array\n      items:\n        type: object\n        properties:\n          name:\n            type: string\n            description: Страна покупателя\n            example: Россия\n          price:\n            type: number\n            description: Цена товара, с НДС\n            example: 100\n          currency_name_short:\n            type: string\n            description: Валюта\n            example: руб\n          excise_short:\n            type: string\n            description: Код маркировки\n            example: 0102900254680370215_Re/=lSbNiGD\n          barcode:\n            type: string\n            description: Баркод\n            example: '2038893425820'\n          nm_id:\n            type: integer\n            description: Артикул WB\n            example: 169085355\n          operation_type_id:\n            type: integer\n     
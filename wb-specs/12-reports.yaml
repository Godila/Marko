"openapi: 3.0.1\ninfo:\n  title: Отчёты\n  version: reports\n  description: |\n    <div class=\"description_important\">\n      Узнать больше об отчётах можно в <a href=\"https://seller.wildberries.ru/instructions/subcategory/5f2162c5-069b-416d-a4e1-48da2a76e6b0\">справочном центре</a>\n    </div>\n\n    <div class=\"api-block\">\n\n    С помощью этих методов вы можете получать [основные отчёты](/openapi/reports#tag/mainReports) и отчёты о:\n      1. [Остатках на складах](/openapi/reports#tag/warehousesInventoryReport)\n      2. [Товарах с обязательной маркировкой](/openapi/reports#tag/reportOnItemsWithMandatoryLabeling)\n      3. [Удержаниях](/openapi/reports#tag/retentionReports)\n      4. [Операциях при приёмке](/openapi/reports#tag/acceptanceExpenses)\n      5. [Платном хранении](/openapi/reports#tag/paidStorage)\n      6. [Продажах по регионам](/openapi/reports#tag/salesByRegions)\n      7. [Доле бренда в продажах](/openapi/reports#tag/shareOfBrandInSales)\n      8. [Заблокированных карточках](/openapi/reports#tag/blockedItems)\n      9. [Возвратах и перемещении товаров](/openapi/reports#tag/returnsAndItemMovementReport)\n\n    </div>\n  x-file-name: reports\nsecurity:\n  - HeaderApiKey: []\ntags:\n  - name: Основные отчёты\n    x-displayName: Основные отчёты\n    description: ''\n  - name: Отчёт об остатках на складах\n    x-displayName: Отчёт об остатках на складах\n    description: ''\n  - name: Отчёт о товарах c обязательной маркировкой\n    x-displayName: Отчёт о товарах c обязательной маркировкой\n    description: ''\n  - name: Отчёты об удержаниях\n    x-displayName: Отчёты об удержаниях\n    description: ''\n  - name: Операции при приёмке\n    x-displayName: Операции при приёмке\n    description: ''\n  - name: Платное хранение\n    x-displayName: Платное хранение\n    description: ''\n  - name: Продажи по регионам\n    x-displayName: Продажи по регионам\n    description: ''\n  - name: Доля бренда в продажах\n    x-displayName: Доля бренда в продажах\n    description: ''\n  - name: Заблокированные карточки\n    x-displayName: Заблокированные карточки\n    description: ''\n  - name: Отчёт о возвратах и перемещении товаров\n    x-displayName: Отчёт о возвратах и перемещении товаров\n    description: ''\npaths:\n  /api/v1/supplier/orders:\n    servers:\n      - url: https://statistics-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://statistics-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      operationId: getV1SupplierOrders\n      x-readonly-method: true\n      x-category: statistics\n      security:\n        - HeaderApiKey: []\n      summary: Заказы\n      description: |\n        Метод возвращает информацию о заказах.<br>Данные обновляются раз в 30 минут.<br><br>\n\n        1 строка = 1 заказ = 1 сборочное задание = 1 единица товара.<br>Для определения заказа рекомендуем использовать поле `srid`.<br><br>\n\n        Информация о заказе хранится 90 дней с момента оформления.<br><br>\n\n        В ответах могут отсутствовать заказы, по которым не подтверждена оплата. Например, заказы с отложенными платежами или оплатой в рассрочку. При этом, если по таким заказам есть продажи, вы можете получить их с помощью [детализаций к отчётам реализации](/openapi/financial-reports-and-accounting#tag/financialReports).<br>\n        Чтобы получить все оформленные заказы, используйте [Ленту заказов](/openapi/analytics#tag/orderFeed).\n\n        <div class=\"description_important\">\n          Данные этого отчёта являются предварительными и служат для оперативного мониторинга\n        </div>\n\n        Для одного ответа на запрос с `flag=0` или без `flag` в системе установлено условное ограничение 80000 строк. Поэтому, чтобы получить все заказы, может потребоваться более, чем один запрос. Во втором и далее запросе в параметре `dateFrom` используйте полное значение поля `lastChangeDate` из последней строки ответа на предыдущий запрос.<br> Если в ответе отдаётся пустой массив `[]`, все заказы уже выгружены.<br><br>\n\n        В песочнице для параметров `dateFrom` и `dateTo` можно задать диапазон только за последние 4 месяца от текущей даты.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 1 запрос | 1 мин | 10 запросов |\n        | Сервисный | 1 мин | 1 запрос | 1 мин | 10 запросов |\n        | Базовый с секретом | 1 мин | 1 запрос | 1 мин | 10 запросов |\n        | Базовый | 3 ч | 1 запрос | 3 ч | 1 запрос |\n        </div>\n      tags:\n        - Основные отчёты\n      parameters:\n        - name: dateFrom\n          in: query\n          schema:\n            type: string\n          required: true\n          description: |\n            Дата и время последнего изменения по заказу. <br>\n            Дата в формате RFC3339. Можно передать дату или дату со временем.\n            Время можно указывать с точностью до [секунд](./api-information#tag/introduction/Limity-zaprosov) или миллисекунд. <br>\n            Время передаётся в часовом поясе Москва (UTC+3).\n            <br>Примеры:\n              - `2019-06-20`\n              - `2019-06-20T23:59:59`\n              - `2019-06-20T00:00:00.12345`\n              - `2017-03-25T00:00:00`\n        - $ref: '#/components/parameters/flag'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: '#/components/schemas/OrdersItem'\n              example:\n                - date: '2022-03-04T18:08:31'\n                  lastChangeDate: '2022-03-06T10:11:07'\n                  warehouseName: Склад WB РФ\n                  warehouseType: Склад продавца\n                  countryName: Россия\n                  oblastOkrugName: Центральный федеральный округ\n                  regionName: Московская\n                  supplierArticle: '12345'\n                  nmId: 1234567\n                  barcode: '123453559000'\n                  category: Бытовая техника\n                  subject: Мультистайлеры\n                  brand: Тест\n                  techSize: '0'\n                  incomeID: 56735459\n                  isSupply: false\n                  isRealization: true\n                  totalPrice: 1887\n                  discountPercent: 18\n                  spp: 26\n                  finishedPrice: 1145\n                  priceWithDisc: 1547\n                  isCancel: true\n                  cancelDate: '2022-03-09T00:00:00'\n                  sticker: '926912515'\n                  gNumber: '34343462218572569531'\n                  srid: 11.rf9ef11fce1684117b0nhj96222982382.3.0\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                oneOf:\n                  - $ref: '#/components/schemas/responseErrorStatistics'\n                  - $ref: '#/components/schemas/responseErrorStatistics2'\n              examples:\n                DateFromFieldRequired:\n                  $ref: '#/components/examples/DateFromFieldRequired'\n                DateFromValueNotValidated:\n                  $ref: '#/components/examples/DateFromValueNotValidated'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/supplier/sales:\n    servers:\n      - url: https://statistics-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://statistics-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      operationId: getV1SupplierSales\n      x-readonly-method: true\n      x-category: statistics\n      security:\n        - HeaderApiKey: []\n      summary: Продажи\n      description: |\n        Метод возвращает информацию о продажах и возвратах.<br>Данные обновляются раз в 30 минут.<br><br>\n\n        1 строка = 1 заказ = 1 сборочное задание = 1 единица товара.<br>Для определения заказа рекомендуем использовать поле `srid`.<br><br>\n\n        Информация о заказе хранится 90 дней с момента оформления.\n\n        <div class=\"description_important\">\n          Данные этого отчёта являются предварительными и служат для оперативного мониторинга\n        </div>\n\n          - В ответах могут отсутствовать заказы, по которым не подтверждена оплата, даже если эти заказы есть в детализациях к отчётам реализации. Например, заказы с отложенными платежами или оплатой в рассрочку\n          - Значения полей `priceWithDisc` и `forPay` рассчитываются по упрощённой логике и могут отличаться от `retail_price_withdisc_rub` и `ppvz_for_pay` соответственно в детализациях к отчётам реализации\n          - Поля `finishedPrice`, `priceWithDisc`, `forPay` могут временно иметь значение `0`: данные заполняются асинхронно, актуализируются в течение 24 часов\n          - Для заказов, которые оплачены в валюте, отличной от валюты продавца, возможны округления цен из-за конвертации валют\n\n        Для точных финансовых расчётов, сверки и отчётности используйте [детализации к отчётам реализации](/openapi/financial-reports-and-accounting#tag/financialReports).<br><br>\n\n        Для одного ответа на запрос с `flag=0` или без `flag` в системе установлено условное ограничение 80000 строк. Поэтому, чтобы получить все продажи и возвраты, может потребоваться более, чем один запрос. Во втором и далее запросе в параметре `dateFrom `используйте полное значение поля `lastChangeDate` из последней строки ответа на предыдущий запрос.<br> Если в ответе отдаётся пустой массив `[]`, все продажи и возвраты уже выгружены.<br><br>\n\n        В песочнице для параметров `dateFrom` и `dateTo` можно задать диапазон только за последние 4 месяца от текущей даты.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        | Сервисный | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        | Базовый с секретом | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        | Базовый | 2 ч | 1 запрос | 2 ч | 1 запрос |\n        </div>\n      tags:\n        - Основные отчёты\n      parameters:\n        - name: dateFrom\n          in: query\n          schema:\n            type: string\n          required: true\n          description: |\n            Дата и время последнего изменения по продаже/возврату. <br>\n            Дата в формате RFC3339. Можно передать дату или дату со временем.\n            Время можно указывать с точностью до [секунд](./api-information#tag/introduction/Limity-zaprosov) или миллисекунд. <br>\n            Время передаётся в часовом поясе Москва (UTC+3).\n            <br>Примеры:\n              - `2019-06-20`\n              - `2019-06-20T23:59:59`\n              - `2019-06-20T00:00:00.12345`\n              - `2017-03-25T00:00:00`\n        - $ref: '#/components/parameters/flag'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: '#/components/schemas/SalesItem'\n              example:\n                - date: '2022-03-04T18:08:31'\n                  lastChangeDate: '2022-03-06T10:11:07'\n                  warehouseName: Склад WB РФ\n                  warehouseType: Склад продавца\n                  countryName: Россия\n                  oblastOkrugName: Центральный федеральный округ\n                  regionName: Московская\n                  supplierArticle: '12345'\n                  nmId: 1234567\n                  barcode: '123453559000'\n                  category: Бытовая техника\n                  subject: Мультистайлеры\n                  brand: Тест\n                  techSize: '0'\n                  incomeID: 56735459\n                  isSupply: false\n                  isRealization: true\n                  totalPrice: 1887\n                  discountPercent: 18\n                  spp: 20\n                  paymentSaleAmount: 93\n                  forPay: 1284.01\n                  finishedPrice: 1145\n                  priceWithDisc: 1547\n                  saleID: S9993700024\n                  sticker: '926912515'\n                  gNumber: '34343462218572569531'\n                  srid: 11.rf9ef11fce1684117b0nhj96222982382.3.0\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                oneOf:\n                  - $ref: '#/components/schemas/responseErrorStatistics'\n                  - $ref: '#/components/schemas/responseErrorStatistics2'\n              examples:\n                DateFromFieldRequired:\n                  $ref: '#/components/examples/DateFromFieldRequired'\n                DateFromValueNotValidated:\n                  $ref: '#/components/examples/DateFromValueNotValidated'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/analytics/excise-report:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    post:\n      operationId: postV1AnalyticsExciseReport\n      x-readonly-method: true\n      x-category: contentanalytics\n      tags:\n        - Отчёт о товарах c обязательной маркировкой\n      summary: Получить отчёт\n      description: |\n        Метод возвращает отчёт с [операциями по товарам с обязательной маркировкой](https://seller.wildberries.ru/analytics-reports/excise-report).<br><br>\n\n        Данный отчёт можно сохранить в [формате таблиц](/knowledge-base/articles/019d49a4-650c-7b04-9596-ba441936f9d3).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 5 ч | 10 запросов | 30 мин | 10 запросов |\n        | Сервисный | 5 ч | 10 запросов | 30 мин | 10 запросов |\n        | Базовый с секретом | 5 ч | 10 запросов | 30 мин | 10 запросов |\n        | Базовый | 24 ч | 2 запроса | 12 ч | 1 запрос |\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/DateFrom'\n        - $ref: '#/components/parameters/DateTo'\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/ExciseReportRequest'\n        required: false\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ExciseReportResponse'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/4xxResponse'\n              example:\n                detail: 'request body has an error: doesn''t match schema #/components/schemas/ExciseReportRequest: Error at \"/countries/0\": value is not one of the allowed values [\"AM\",\"BY\",\"KG\",\"KZ\",\"RU\",\"UZ\"]'\n                origin: tariffs\n                requestId: 8bbd7db59522d09926dd059892dbeff0\n                title: Bad Request\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/warehouse_remains:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    get:\n      operationId: getV1WarehouseRemains\n      x-readonly-method: true\n      x-category: contentanalytics\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Отчёт об остатках на складах\n      summary: Создать отчёт\n      description: |\n        Метод создаёт [задание на генерацию](/openapi/reports#tag/warehousesInventoryReport/operation/getV1WarehouseRemainsTasksTaskIdStatus) отчёта об [остатках на складах WB](/openapi/reports#tag/warehousesInventoryReport/operation/getV1WarehouseRemainsTasksTaskIdDownload).<br><br>\n\n        Параметры `groupBy` и `filter` (группировки и фильтры) можно задать в любой комбинации — аналогично [версии](https://seller.wildberries.ru/analytics-reports/warehouse-remains) в личном кабинете.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 1 запрос | 1 мин | 5 запросов |\n        | Сервисный | 1 мин | 1 запрос | 1 мин | 5 запросов |\n        | Базовый с секретом | 1 мин | 1 запрос | 1 мин | 5 запросов |\n        | Базовый | 1 ч | 4 запроса | 15 мин | 1 запрос |\n        </div>\n      parameters:\n        - in: query\n          name: locale\n          schema:\n            type: string\n            example: ru\n            default: ru\n          description: |\n            Язык полей ответа `subjectName` и `warehouseName`:\n              - `ru` — русский\n              - `en` — английский\n              - `zh` — китайский. Значения `warehouseName` на английском\n        - name: groupByBrand\n          in: query\n          schema:\n            type: boolean\n            example: true\n            default: false\n          description: Разбивка по брендам\n        - name: groupBySubject\n          in: query\n          schema:\n            type: boolean\n            example: true\n            default: false\n          description: Разбивка по предметам\n        - name: groupBySa\n          in: query\n          schema:\n            type: boolean\n            example: true\n            default: false\n          description: Разбивка по артикулам продавца\n        - name: groupByNm\n          in: query\n          schema:\n            type: boolean\n            example: true\n            default: false\n          description: Разбивка по артикулам WB. Если `groupByNm=true`, в ответе будет поле `volume`\n        - name: groupByBarcode\n          in: query\n          schema:\n            type: boolean\n            example: true\n            default: false\n          description: Разбивка по баркодам\n        - name: groupBySize\n          in: query\n          schema:\n            type: boolean\n            example: true\n            default: false\n          description: Разбивка по размерам\n        - name: filterPics\n          in: query\n          schema:\n            type: integer\n            example: 1\n            default: 0\n          description: |\n            Фильтр по фото:\n              - `-1` — без фото\n              - `0` — не применять фильтр\n              - `1` — с фото\n        - name: filterVolume\n          in: query\n          schema:\n            type: integer\n            example: 3\n            default: 0\n          description: |\n            Фильтр по объёму:\n              - `-1` — без габаритов\n              - `0` — не применять фильтр\n              - `3` — свыше трёх литров\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/CreateTaskResponse'\n              examples:\n                CreateResponseData:\n                  $ref: '#/components/examples/CreateResponseData'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/4xxResponse'\n              example:\n                detail: 'parameter \"groupByNm\" in query has an error: empty value is not allowed'\n                origin: api-statistics\n                requestId: 6a6c2fba81f08e58670a7dab835ff0d7\n                title: Bad Request\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/warehouse_remains/tasks/{task_id}/status:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    get:\n      operationId: getV1WarehouseRemainsTasksTaskIdStatus\n      x-readonly-method: true\n      x-category: contentanalytics\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Отчёт об остатках на складах\n      summary: Проверить статус\n      description: |\n        Метод возвращает статус [задания на генерацию](/openapi/reports#tag/warehousesInventoryReport/operation/getV1WarehouseRemains) отчёта об [остатках на складах WB](/openapi/reports#tag/warehousesInventoryReport/operation/getV1WarehouseRemainsTasksTaskIdDownload).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 5 сек | 1 запрос | 5 сек | 5 запросов |\n        | Сервисный | 5 сек | 1 запрос | 5 сек | 5 запросов |\n        | Базовый с секретом | 5 сек | 1 запрос | 5 сек | 5 запросов |\n        | Базовый | 1 ч | 4 запроса | 15 мин | 1 запрос |\n        </div>\n      parameters:\n        - name: task_id\n          in: path\n 
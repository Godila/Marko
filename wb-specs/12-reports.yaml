e: string\n            example: 06e06887-9d9f-491f-b16a-bb1766fcb8d2\n          description: |\n            ID задания на генерацию\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  type: object\n                  properties:\n                    count:\n                      type: integer\n                      description: Количество товаров, шт.\n                      example: 40\n                    giCreateDate:\n                      type: string\n                      format: date\n                      description: Дата создания поставки\n                      example: '2025-03-04'\n                    incomeId:\n                      type: integer\n                      description: Номер поставки\n                      example: 11834106\n                    nmID:\n                      type: integer\n                      description: Артикул WB\n                      example: 123456789\n                    shkCreateDate:\n                      type: string\n                      format: date\n                      description: Дата приёмки\n                      example: '2025-03-14'\n                    subjectName:\n                      type: string\n                      description: Предмет\n                      example: Добавки пищевые\n                    total:\n                      type: number\n                      description: Суммарная стоимость приёмки, ₽ с копейками\n                      example: 873.04\n        '204':\n          description: Нет данных\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/4xxResponse'\n              example:\n                detail: 'Invalid format for parameter task_id: error unmarshaling ''2f071556-ae39-492f-fd8cf1eb0d25'' text as *uuid.UUID: invalid UUID length: 31'\n                origin: api-statistics\n                requestId: 52dd27a91a1a643feae7201b206462df\n                title: Bad Request\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '404':\n          description: Не найдено\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/4xxResponse'\n              example:\n                detail: not found\n                origin: api-statistics\n                requestId: c777731fc180f215a49c9896c2f1200d\n                title: Not Found\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/paid_storage:\n    servers:\n      - url: https://seller-analytics-api.wildberries.ru\n    get:\n      operationId: getV1PaidStorage\n      x-readonly-method: true\n      x-category: contentanalytics\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Платное хранение\n      summary: Создать отчёт\n      description: |\n        Метод создаёт [задание на генерацию](/openapi/reports#tag/paidStorage/operation/getV1PaidStorageTasksTaskIdStatus) отчёта о [платном хранении](/openapi/reports#tag/paidStorage/operation/getV1PaidStorageTasksTaskIdDownload).<br><br>\n\n        Можно получить отчёт максимум за 8 дней.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 1 запрос | 1 мин | 5 запросов |\n        | Сервисный | 1 мин | 1 запрос | 1 мин | 5 запросов |\n        | Базовый с секретом | 1 мин | 1 запрос | 1 мин | 5 запросов |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      parameters:\n        - name: dateFrom\n          in: query\n          required: true\n          schema:\n            type: string\n            example: '2022-01-01'\n          description: |\n            Начало отчётного периода в формате RFC3339. Можно передать дату или дату со временем. Примеры:\n\n              * `2019-06-20`\n              * `2019-06-20T23:59:59`\n              * `2019-06-20T00:00:00.12345`\n              * `2017-03-25T00:00:00`\n        - name: dateTo\n          in: query\n          required: true\n          schema:\n            type: string\n            example: '2022-01-09'\n          description: |\n            Конец отчётного периода в формате RFC3339. Можно передать дату или дату со временем. Примеры:\n\n              * `2019-06-20`\n              * `2019-06-20T23:59:59`\n              * `2019-06-20T00:00:00.12345`\n              * `2017-03-25T00:00:00`\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/CreateTaskResponse'\n              examples:\n                CreateResponseData:\n                  $ref: '#/components/examples/CreateResponseData'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/4xxResponse'\n              examples:\n                MissingDateTimeFrom:\n                  $ref: '#/components/examples/MissingDateTimeFrom'\n                MissingDateTimeTo:\n                  $ref: '#/components/examples/MissingDateTimeTo'\n                IncorrectDateTimeFrom:\n                  $ref: '#/components/examples/IncorrectDateTimeFrom'\n                IncorrectDateTimeTo:\n                  $ref: '#/components/examples/IncorrectDateTimeTo'\n                DateRangeExceeded:\n                  $ref: '#/components/examples/DateRangeExceeded8'\n                DateRanges:\n                  $ref: '#/components/
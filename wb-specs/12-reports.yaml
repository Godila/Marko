т об [остатках на складах WB](https://seller.wildberries.ru/analytics-reports/warehouse-remains) по ID [задания на генерацию](/openapi/reports#tag/warehousesInventoryReport/operation/getV1WarehouseRemains).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        | Сервисный | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        | Базовый с секретом | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        | Базовый | 1 ч | 4 запроса | 15 мин | 1 запрос |\n        </div>\n      parameters:\n        - name: task_id\n          in: path\n          required: true\n          schema:\n            type: string\n            example: 06e06887-9d9f-491f-b16a-bb1766fcb8d2\n          description: |\n            ID задания на генерацию\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  type: object\n                  properties:\n                    brand:\n                      type: string\n                      example: Wonderful\n                      description: Бренд\n                    subjectName:\n                      type: string\n                      example: Фотоальбомы\n                      description: Название предмета\n                    vendorCode:\n                      type: string\n                      example: 41058/прозрачный\n                      description: Артикул продавца\n                    nmId:\n                      type: integer\n                      example: 183804172\n                      description: Артикул WB\n                    barcode:\n                      type: string\n                      example: '2037031652319'\n                      description: Баркод\n                    techSize:\n                      type: string\n                      example: '0'\n                      description: Размер\n                    volume:\n                      type: number\n                      example: 1.33\n                      description: Объём, л\n                    warehouses:\n                      type: array\n                      description: Остатки на складах и товары в пути. Будут в ответе только при ненулевом `quantity`\n                      items:\n                        type: object\n                        properties:\n                          warehouseName:\n                            type: string\n                            example: Невинномысск\n                            description: Название склада\n                          quantity:\n                            type: integer\n                            example: 134\n                            description: |\n                              Количество, шт.\n              example:\n                - brand: Wonderful\n                  subjectName: Фотоальбомы\n                  vendorCode: 41058/прозрачный\n                  nmId: 183804172\n                  barcode: '2037031652319'\n                  techSize: '0'\n                  volume: 1.33\n                  warehouses:\n                    - warehouseName: В пути до получателей\n                      quantity: 14\n                    - warehouseName: В пути возвраты на склад WB\n                      quantity: 4\n                    - warehouseName: Всего находится на складах\n                      quantity: 267\n                    - warehouseName: Склад WB РФ\n                      quantity: 134\n                    - warehouseName: Склад WB СГТ РФ\n                      quantity: 10\n                    - warehouseName: Минск\n                      quantity: 123\n        '204':\n          description: Нет данных\n        '400':\n 
"openapi: 3.0.0\ninfo:\n  title: Тарифы\n  version: rates\n  description: |\n    <div class=\"description_important\">\n      Узнать больше о тарифах можно в <a href=\"https://seller.wildberries.ru/instructions/ru/ru/material/fees-site-section\">справочном центре</a>\n    </div>\n\n    <div class=\"api-block\">\n\n    В разделе описаны методы получения:\n      1. [Комиссий](/openapi/wb-tariffs#tag/fees)\n      2. [Тарифов на поставку](/openapi/wb-tariffs#tag/supplyRates)\n      3. [Тарифов на остаток](/openapi/wb-tariffs#tag/stockRates)\n      4. [Тарифов на возврат товаров продавцу](/openapi/wb-tariffs#tag/returnCostToSeller)\n\n    </div>\n  x-file-name: rates\nsecurity:\n  - HeaderApiKey: []\ntags:\n  - name: Комиссии\n    x-displayName: Комиссии\n    description: ''\n  - name: Тарифы на поставку\n    x-displayName: Тарифы на поставку\n    description: ''\n  - name: Тарифы на остаток\n    x-displayName: Тарифы на остаток\n    description: ''\n  - name: Стоимость возврата продавцу\n    x-displayName: Стоимость возврата продавцу\n    description: ''\npaths:\n  /api/v1/tariffs/commission:\n    servers:\n      - url: https://common-api.wildberries.ru\n    get:\n      operationId: getV1TariffsCommission\n      x-readonly-method: true\n      x-category: commonapi\n      summary: Комиссия по категориям товаров\n      tags:\n        - Комиссии\n      description: |\n        Метод возвращает данные о [комиссии](https://seller.wildberries.ru/dynamic-product-categories/commission) WB по [родительским категориям товаров](/openapi/work-with-products#tag/categoriesSubcategoriesAndCharacteristics/paths/~1content~1v2~1object~1parent~1all/get) согласно модели продаж.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 1 запрос | 1 мин | 2 запроса |\n        | Сервисный | 1 мин | 1 запрос | 1 мин | 2 запроса |\n        | Базовый с секретом | 1 мин | 1 запрос | 1 мин | 2 запроса |\n        | Базовый | 1 ч | 5 запросов | 12 мин | 1 запрос |\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Locale'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                oneOf:\n                  - $ref: '#/components/schemas/Fee'\n                  - $ref: '#/components/schemas/FeeChina'\n                  - $ref: '#/components/schemas/FeeTurkey'\n                  - $ref: '#/components/schemas/FeeUzbekistan'\n                  - $ref: '#/components/schemas/FeeUAE'\n              examples:\n                Fee:\n                  $ref: '#/components/examples/Fee'\n                FeeChina:\n                  $ref: '#/components/examples/FeeChina'\n                FeeTurkey:\n                  $ref: '#/components/examples/FeeTurkey'\n                FeeUzbekistan:\n                  $ref: '#/components/examples/FeeUzbekistan'\n                FeeUAE:\n                  $ref: '#/components/examples/FeeUAE'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/BadRequest'\n              example:\n                detail: 'parameter \"locale\" in query has an error: value is not one of the allowed values [\"ru\",\"en\",\"zh\"]'\n                origin: api-statistics\n                requestId: 102d2641a931c41bed60649d6c99d80a\n                title: Bad Request\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/tariffs/v1/acceptance/coefficients:\n    servers:\n      - url: https://common-api.wildberries.ru\n    get:\n      operationId: getV1AcceptanceCoefficients\n      x-readonly-method: true\n      x-category: commonapi\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Тарифы на поставку\n      summary: Тарифы на поставку\n      description: |\n        Метод [временно отключён](https://dev.wildberries.ru/release-notes?id=570)\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 6 запросов | 10 сек | 6 запросов |\n        | Сервисный | 1 мин | 6 запросов | 10 сек | 6 запросов |\n        | Базовый с секретом | 1 мин | 6 запросов | 10 сек | 6 запросов |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      parameters:\n        - name: warehouseIDs\n          in: query\n          description: ID складов.<br>По умолчанию возвращаются данные по всем складам\n          schema:\n            type: string\n          example: 507,117501\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: '#/components/schemas/models.AcceptanceCoefficient'\n              examples:\n                ResponseCoefficients:\n                  $ref: '#/components/examples/ResponseCoefficients'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/models.ErrorModel'\n              examples:\n                BadWarehouseIDsParamNew:\n                  $ref: '#/components/examples/Response400CoefficientsNew'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n        '404':\n          description: Не найдено\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/tariffs/box:\n    servers:\n      - url: https://common-api.wildberries.ru\n    get:\n      operationId: getV1TariffsBox\n      x-readonly-method: true\n      x-category: commonapi\n      summary: Тарифы для коробов\n      tags:\n        - Тарифы на остаток\n      description: \"Для остатков товаров, которые поставляются на\\_склад в коробах, метод возвращает [тарифы](https://seller.wildberries.ru/dynamic-product-categories) на:\\n  - доставку со склада или пункта приёма до покупателя\\n  - доставку от покупателя до пункта приёма\\n  - хранение на\\_складе WB\\n\\n<div class=\\\"description_important\\\">\\n  Тарифы для коробов совпадают с тарифами для <strong>Суперсейфа</strong>\\n</div>\\n\\n<div class=\\\"description_limit\\\">\\n<a href=\\\"/openapi/api-information#tag/introduction/Limity-zaprosov\\\">Лимит запросов</a> на один аккаунт продавца:\\n\\n\\n| Тип | Период | Лимит | Интервал | Всплеск |\\n| --- | --- | --- | --- | --- |\\n| Персональный | 1 мин | 60 запросов | 1 сек | 5 запросов |\\n| Сервисный | 1 мин | 60 запросов | 1 сек | 5 запросов |\\n| Базовый с секретом | 1 мин | 60 запросов | 1 сек | 5 запросов |\\n| Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\\n</div>\\n\"\n      parameters:\n        - $ref: '#/components/parameters/Date'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/RatesBoxResponse'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/BadRequest'\n              example:\n                detail: Invalid date param\n                origin: tariffs\n                requestId: 70da980b108e6f52ce7630921bd05b1a\n                title: Bad Request\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/tariffs/pallet:\n    servers:\n      - url: https://common-api.wildberries.ru\n    get:\n      operationId: getV1TariffsPallet\n      x-readonly-method: true\n      x-category: commonapi\n      summary: Тарифы для монопаллет\n      tags:\n        - Тарифы на остаток\n      description: \"Для товаров, которые поставляются на\\_склад WB на\\_монопаллетах, метод возвращает [стоимость](https://seller.wildberries.ru/dynamic-product-categories):\\n  - доставки со склада до покупателя\\n  - доставки от покупателя до склада\\n  - хранения на\\_складе WB\\n\\n<div class=\\\"description_important\\\">\\n  Тарифы для монопаллет совпадают с тарифами для <strong>Поштучных паллет</strong>\\n</div>\\n\\n<div class=\\\"description_limit\\\">\\n<a href=\\\"/openapi/api-information#tag/introduction/Limity-zaprosov\\\">Лимит запросов</a> на один аккаунт продавца:\\n\\n\\n| Тип | Период | Лимит | Интервал | Всплеск |\\n| --- | --- | --- | --- | --- |\\n| Персональный | 1 мин | 60 запросов | 1 сек | 5 запросов |\\n| Сервисный | 1 мин | 60 запросов | 1 сек | 5 запросов |\\n| Базовый с секретом | 1 мин | 60 запросов | 1 сек | 5 запросов |\\n| Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\\n</div>\\n\"\n      parameters:\n        - $ref: '#/components/parameters/Date'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/RatesPalletResponse'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/BadRequest'\n              example:\n                detail: 'parameter \"date\" in query has an error: value is required but missing'\n                origin: tariffs\n                requestId: 7bc5c30d95933058d0e0bddc79b9da547\n                title: Bad Request\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/tariffs/return:\n    servers:\n      - url: https://common-api.wildberries.ru\n    get:\n      operationId: getV1TariffsReturn\n      x-readonly-method: true\n      x-category: commonapi\n      summary: \"Тарифы на\\_возврат\"\n      tags:\n        - Стоимость возврата продавцу\n      description: \"Метод возвращает [тарифы](https://seller.wildberries.ru/dynamic-product-categories/return-cost):\\n  - на\\_перевозку товаров со склада WB или из пункта приёма до продавца\\n  - на\\_обратную перевозку возвратов, которые не забрал продавец\\n\\n<div class=\\\"description_limit\\\">\\n<a href=\\\"/openapi/api-information#tag/introduction/Limity-zaprosov\\\">Лимит запросов</a> на один аккаунт продавца:\\n\\n\\n| Тип | Период | Лимит | Интервал | Всплеск |\\n| --- | --- | --- | --- | --- |\\n| Персональный | 1 мин | 60 запросов | 1 сек | 5 запросов |\\n| Сервисный | 1 мин | 60 запросов | 1 сек | 5 запросов |\\n| Базовый с секретом | 1 мин | 60 запросов | 1 сек | 5 запросов |\\n| Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\\n</div>\\n\"\n      parameters:\n        - $ref: '#/components/parameters/Date'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ReturnRatesResponse'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/BadRequest'\n              example:\n                detail: 'parameter \"date\" in query has an error: empty value is not allowed'\n                origin: tariffs\n                requestId: e8096bddcfe5e3ff75f1afd26755364c\n                title: Bad Request\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\ncomponents:\n  examples:\n    ResponseCoefficients:\n      value:\n        - date: '2024-04-11T00:00:00Z'\n          coefficient: -1\n          warehouseID: 217081\n          warehouseName: Сц Брянск 2\n          allowUnload: false\n          boxTypeID: 6\n          storageCoef: null\n          deliveryCoef: null\n          deliveryBaseLiter: null\n          deliveryAdditionalLiter: null\n          storageBaseLiter: null\n          storageAdditionalLiter: null\n          isSortingCenter: true\n    Response400CoefficientsNew:\n      value:\n        status: 400\n        title: bad request\n        detail: Неверный формат warehouseIDs\n        requestId: a6bdc2a4d2fde51c2036fa8af2483886\n        origin: supply-api\n      description: Значение параметра `warehouseIDs` не указано, или некорректно\n    Fee:\n      summary: Fee\n      description: Комиссия\n      value:\n        report:\n          - kgvpBooking: 14.5\n            kgvpMarketplace: 15.5\n            kgvpPickup: 14.5\n            kgvpSupplier: 12.5\n            kgvpSupplierExpress: 3\n            paidStorageKgvp: 15.5\n            parentID: 657\n            parentName: Бытовая техника\n            subjectID: 6461\n            subjectName: Оборудование зуботехническое\n    FeeChina:\n      summary: FeeChina\n      description: Комиссия Китай\n      value:\n        report:\n          - kgvpChina: 15.5\n            parentID: 657\n            parentName: 国内设备\n            subjectID: 6461\n            subjectName: 牙齿矫正设备\n    FeeTurkey:\n      summary: FeeTurkey\n      description: Комиссия Турция\n      value:\n        report:\n          - kgvpTurkey: 15.5\n            parentID: 657\n            parentName: Home appliance\n            subjectID: 6461\n            subjectName: Dental equipment\n    FeeUzbekistan:\n      summary: FeeUzbekistan\n      description: Комиссия Узбекистан\n      value:\n        report:\n          - kgvpMarketplaceUz: 15.5\n            kgvpPaidStorageUz: 15.5\n            kgvpSupplierUz: 15.5\n            parentID: 657\n            parentName: Бытовая техника\n            subjectID: 6461\n            subjectName: Оборудование зуботехническое\n    FeeUAE:\n      summary: FeeUAE\n      description: Комиссия ОАЭ\n      value:\n        report:\n          - kgvpUAE: 15.5\n            parentID: 657\n            parentName: Home appliance\n            subjectID: 6461\n            subjectName: Dental equipment\n  securitySchemes:\n    HeaderApiKey:\n      type: apiKey\n      name: Authorization\n      in: header\n  parameters:\n    Date:\n      in: query\n      name: date\n      required: true\n      example: '2026-08-15'\n      description: Дата в формате ГГГГ-ММ-ДД\n      schema:\n        type: string\n    Locale:\n      name: locale\n      in: query\n      schema:\n        type: string\n        example: ru\n      description: |\n        Язык полей ответа `parentName` и `subjectName`:\n          - `ru` — русский\n          - `en` — английский\n          - `zh` — китайский\n  schemas:\n    models.RatesBoxResponse:\n      type: object\n      properties:\n        data:\n          $ref: '#/components/schemas/models.WarehousesBoxRates'\n    models.WarehousesBoxRates:\n      type: object\n      properties:\n        currency:\n          type: string\n          description: Валюта тарифов\n          example: RUB\n        dtNextBox:\n          type: string\n          description: Дата начала следующего тарифа\n          example: '2024-02-01'\n        dtTillMax:\n          type: string\n          description: Дата окончания последнего установленного тарифа\n          example: '2024-03-31'\n        warehouseList:\n          type: array\n          items:\n            $ref: '#/components/schemas/models.WarehouseBoxRates'\n          nullable: true\n          description: Тарифы для коробов, сгруппированные по складам\n    models.WarehouseBoxRates:\n      type: object\n      properties:\n        boxDeliveryBase:\n          type: string\n          description: \"Логистика, первый литр,\\_₽\"\n          example: '48'\n        boxDeliveryCoefExpr:\n          type: string\n          description: \"Коэффициент **Логистика**,\\_%. На\\_него умножается стоимость логистики. Уже учтён в\\_тарифах\"\n          example: '160'\n        boxDeliveryLiter:\n          type: string\n          description: \"Логистика, дополнительный литр,\\_₽\"\n          example: 11,2\n        boxDeliveryMarketplaceBase:\n          type: string\n          description: \"Логистика FBS, первый литр,\\_₽\"\n          example: '40'\n        boxDeliveryMarketplaceCoefExpr:\n          type: string\n          description: \"Коэффициент **FBS**,\\_%. На\\_него умножается стоимость логистики FBS. Уже учтён в\\_тарифах\"\n          example: '125'\n        boxDeliveryMarketplaceLiter:\n          type: string\n          description: \"Логистика FBS, дополнительный литр,\\_₽\"\n          example: '11'\n        boxStorageBase:\n          type: string\n          description: \"Хранение в\\_день, первый литр,\\_₽\"\n          example: 0,14\n        boxStorageCoefExpr:\n          type: string\n          description: \"Коэффициент **Хранение**,\\_%. На\\_него умножается стоимость хранения в день. Уже учтён в\\_тарифах\"\n          example: '115'\n        boxStorageLiter:\n          type: string\n          description: \"Хранение в\\_день, дополнительный литр,\\_₽\"\n          example: 0,07\n        geoName:\n          type: string\n          description: Местонахождение склада\n          example: Россия\n        warehouseName:\n          type: string\n          description: Название склада\n          example: Свой склад СГТ РФ\n    models.RatesPalletResponse:\n      type: object\n      properties:\n        data:\n          $ref: '#/components/schemas/models.WarehousesPalletRates'\n    models.WarehousesPalletRates:\n      type: object\n      properties:\n        currency:\n          type: string\n          description: Валюта тарифов\n          example: RUB\n        dtNextPallet:\n          type: string\n          description: Дата начала следующего тарифа\n          example: '2024-02-01'\n        dtTillMax:\n          type: string\n          description: Дата окончания последнего установленного тарифа\n          example: '2024-03-31'\n        warehouseList:\n          type: array\n          items:\n            $ref: '#/components/schemas/models.WarehousePalletRates'\n          nullable: true\n          description: Тарифы для монопаллет, сгруппированные по складам\n    models.WarehousePalletRates:\n      type: object\n      properties:\n        palletDeliveryExpr:\n          type: string\n          description: Коэффициент доставки, %. На него умножается стоимость доставки. Во всех тарифах этот коэффициент уже учтён\n          example: '170'\n        palletDeliveryValueBase:\n          type: string\n          description: \"Доставка 1\\_литра,\\_₽\"\n          example: '51'\n        palletDeliveryValueLiter:\n          type: string\n          description: \"Доставка каждого дополнительного литра,\\_₽\"\n          example: 11,9\n        palletStorageExpr:\n          type: string\n          description: Коэффициент хранения, %. На него умножается стоимость хранения. Во всех тарифах этот коэффициент уже учтён\n          example: '155'\n        palletStorageValueExpr:\n          type: string\n          description: \"Хранение 1\\_монопаллеты,\\_₽\"\n          example: '35.65'\n        warehouseName:\n          type: string\n          description: Название склада\n          example: СЦ Брест\n    models.ReturnRatesResponse:\n      type: object\n      properties:\n        data:\n          $ref: '#/components/schemas/models.WarehousesReturnRates'\n    models.WarehousesReturnRates:\n      type: object\n      properties:\n        currency:\n          type: string\n          description: Валюта тарифов\n          example: RUB\n        dtNextDeliveryDumpKgt:\n          type: string\n          description: Дата начала следующего тарифа при грузовой доставке\n          example: '2024-02-01'\n        dtNextDeliveryDumpSrg:\n          type: string\n          description: Дата начала следующего тарифа для неопознанных товаров\n          example: '2024-02-01'\n        dtNextDeliveryDumpSup:\n          type: string\n          description: Дата начала следующего тарифа при обычной доставке\n          example: '2024-02-01'\n        warehouseList:\n          type: array\n          items:\n            $ref: '#/components/schemas/models.WarehouseReturnRates'\n          nullable: true\n          description: \"Тарифы на\\_возврат, сгруппированные по складам:\\n  - стоимость возврата брака и возврата по инициативе продавца при грузовой доставке.\\n  - стоимость возврата неопознанного складом товара.\\n  - стоимость возврата брака, возврата по инициативе продавца и автовозвратов Маркетплейс (в пункт выдачи и обратно).\\n\\nМожно получить стоимость возврата в пункт выдачи (ПВЗ) и обратной логистики\\_— если продавец не забрал товары из пункта выдачи за\\_7 дней.\\n\"\n    models.WarehouseReturnRates:\n      type: object\n      properties:\n        deliveryDumpKgtOfficeBase:\n          type: string\n          description: \"**Стоимость возврата при грузовой доставке, доставка на\\_ПВЗ (базовая цена\\_за\\_1\\_л),\\_₽**\\nПрименяется для крупногабаритных товаров, когда:\\n  - продавец хочет вывезти товары со склада WB;\\n  - на\\_складе обнаружили бракованные товары;\\n  - покупатель возвращает товар, но его нельзя вернуть в продажу.\\n\"\n          example: 1 039\n        deliveryDumpKgtOfficeLiter:\n          type: string\n          description: \"**Стоимость возврата при грузовой доставке, доставка на\\_ПВЗ (доп. литр),\\_₽**<br>\\nСтоимость за\\_каждый дополнительный литр.\\n\"\n          example: 9,1\n        deliveryDumpKgtReturnExpr:\n          type: string\n          description: \"**Стоимость возврата при грузовой доставке, обратная логистика невостребованного возврата,\\_₽**<br>\\nГрузовая доставка невостребованного возврата обратно на\\_склад WB. За единицу товара.\\n\"\n          example: 1 050\n        deliveryDumpSrgOfficeExpr:\n          type: string\n          description: |\n            **Стоимость возврата неопознанного складом товара за каждую единицу, доставка на ПВЗ, ₽**<br>\n            Применяется для товаров, которые не смогли принять на складе.\n          example: '170'\n        deliveryDumpSrgReturnExpr:\n          type: string\n          description: |\n            **Стоимость возврата неопознанного складом товара за каждую единицу, обратная логистика невостребованного возврата, ₽** <br>Доставка невостребованного возврата обратно на склад WB.\n          example: '170'\n        deliveryDumpSupCourierBase:\n          type: string\n          description: |\n            **Стоимость возврата, доставка курьером (базовая цена за 1 л), ₽**\n\n            Применяется, когда:\n              - продавец хочет вывезти товары со склада Wildberries\n              - на складе обнаружили бракованные товары\n              - покупатель возвращает товар, но его нельзя вернуть в продажу\n              - подключён автовозврат товаров, продаваемых по схеме Маркетплейс\n          example: '229'\n        deliveryDumpSupCourierLiter:\n          type: string\n          description: |\n            **Стоимость возврата, доставка курьером (доп. л), ₽**\n            <br>Стоимость за каждый дополнительный литр.\n          example: 9,1\n        deliveryDumpSupOfficeBase:\n          type: string\n          description: |\n            **Стоимость возврата, доставка на ПВЗ (базовая цена за 1 л), ₽**\n\n            Применяется, когда:\n              - продавец хочет вывезти товары со склада Wildberries\n              - на складе обнаружили бракованные товары\n              - покупатель возвращает товар, но его нельзя вернуть в продажу\n              - подключён автовозврат товаров, продаваемых по схеме Маркетплейс\n          example: '129'\n        deliveryDumpSupOfficeLiter:\n          type: string\n          description: |\n            **Стоимость возврата, доставка на ПВЗ (доп. литр), ₽** <br>Стоимость за каждый дополнительный литр\n          example: 9,1\n        deliveryDumpSupReturnExpr:\n          type: string\n          description: |\n            **Стоимость возврата, обратная логистика невостребованного возврата, за единицу товара, ₽**<br>\n            Доставка невостребованного возврата обратно на склад Wildberries.\n\n            Применяется, когда:\n              - продавец хочет вывезти товары со склада Wildberries\n              - на складе обнаружили бракованные товары\n              - покупатель возвращает товар, но его нельзя вернуть в продажу\n              - подключён автовозврат товаров, продаваемых по схеме Маркетплейс\n          example: '250'\n        warehouseName:\n          type: string\n          description: Название склада\n          example: Склад WB РФ\n    models.ErrorModel:\n      type: object\n      properties:\n        status:\n          type: integer\n          description: HTTP статус-код\n        title:\n          type: string\n          description: ID ошибки\n        detail:\n          type: string\n          description: Описание ошибки\n        requestId:\n          type: string\n          description: ID запроса\n        origin:\n          type: string\n          description: Сервис, вернувший ошибку\n    models.AcceptanceCoefficient:\n      type: object\n      properties:\n        date:\n          type: string\n          description: Дата начала действия коэффициента\n        coefficient:\n          type: number\n          description: |\n            Коэффициент приёмки:\n              - `-1` — приёмка недоступна, вне зависимости от значения поля `allowUnload`\n              - `0` — бесплатная приёмка\n              - от `1` — множитель стоимости приёмки\n        warehouseID:\n          type: integer\n          description: ID склада. По нему можно получить [информацию о складе](./orders-fbw#tag/informationForFormingSupplies/operation/getV1Warehouses)\n        warehouseName:\n          type: string\n          description: Название склада\n        allowUnload:\n          type: boolean\n          description: |\n            Доступность приёмки для поставок данного типа, смотри значение поля `boxTypeID`:\n\n             - `true` — приёмка доступна\n             - `false` — приёмка не доступна\n        boxTypeID:\n          type: integer\n          description: |\n            ID типа поставки:\n              - `2` — Короба\n              - `5` — Монопаллеты\n              - `6` — Суперсейф\n            <br>Для типа поставки **QR-поставка с коробами** поле не возвращается\n        storageCoef:\n          type: string\n          nullable: true\n          description: Коэффициент хранения\n        deliveryCoef:\n          type: string\n          nullable: true\n          description: Коэффициент логистики\n        deliveryBaseLiter:\n          type: string\n          nullable: true\n          description: Стоимость логистики первого литра\n        deliveryAdditionalLiter:\n          type: string\n          nullable: true\n          description: Стоимость логистики каждого следующего литра\n        storageBaseLiter:\n          type: string\n          nullable: true\n          description: |\n            Стоимость хранения:\n              - для паллет — стоимость за одну паллету\n              - для коробов — стоимость хранения за первый литр\n        storageAdditionalLiter:\n          type: string\n          nullable: true\n          description: |\n            Стоимость хранения каждого последующего литра:\n              - для паллет — всегда будет `null`, т.к. стоимость хранения за единицу паллеты определяется в `StorageBaseLiter`\n              - для коробов — стоимость хранения за каждый последующий литр\n        isSortingCenter:\n          type: boolean\n          description: |\n            Тип склада:\n\n             - `true` — сортировочный центр (СЦ)\n             - `false` — обычный\n    RatesBoxResponse:\n      type: object\n      properties:\n        response:\n          $ref: '#/components/schemas/models.RatesBoxResponse'\n    RatesPalletResponse:\n      type: object\n      properties:\n        response:\n          $ref: '#/components/schemas/models.RatesPalletResponse'\n    ReturnRatesResponse:\n      type: object\n      properties:\n        response:\n          $ref: '#/components/schemas/models.ReturnRatesResponse'\n    Fee:\n      additionalProperties: false\n      type: object\n      properties:\n        report:\n          type: array\n          description: Список комиссий\n          items:\n            type: object\n            properties:\n              kgvpBooking:\n                type: number\n                description: Комиссия по модели **Бронирование**, %\n              kgvpMarketplace:\n                type: number\n                description: Комиссия по модели **Маркетплейс** (`FBS`), %\n              kgvpPickup:\n                type: number\n                description: Комиссия по модели **Самовывоз из магазина продавца** (`C&C`), %\n              kgvpSupplier:\n                type: number\n                description: Комиссия по моделям **Витрина** (`DBS`) и **Курьер WB** (`DBW`), %\n              kgvpSupplierExpress:\n                type: number\n                description: Комиссия по модели **Витрина экспресс** (`EDBS`), %\n              paidStorageKgvp:\n                type: number\n                description: Комиссия по модели **Склад WB** (`FBW`), %\n              parentID:\n                type: integer\n                description: ID родительской категории\n              parentName:\n                type: string\n                description: Название родительской категории\n              subjectID:\n                type: integer\n                description: ID предмета\n              subjectName:\n                type: string\n                description: Название предмета\n    FeeChina:\n      type: object\n      properties:\n        report:\n          type: array\n          description: Список комиссий\n          items:\n            type: object\n            properties:\n              kgvpChina:\n                type: number\n                description: Комиссия для продавцов из Китая, %\n              parentID:\n                type: integer\n                description: ID родительской категории\n              parentName:\n                type: string\n                description: Название родительской категории\n              subjectID:\n                type: integer\n                description: ID предмета\n              subjectName:\n                type: string\n                description: Название предмета\n    FeeTurkey:\n      type: object\n      properties:\n        report:\n          type: array\n          description: Список комиссий\n          items:\n            type: object\n            properties:\n              kgvpTurkey:\n                type: number\n                description: Комиссия для продавцов из Турции, %\n              parentID:\n                type: integer\n                description: ID родительской категории\n              parentName:\n                type: string\n                description: Название родительской категории\n              subjectID:\n                type: integer\n                description: ID предмета\n              subjectName:\n                type: string\n                description: Название предмета\n    FeeUzbekistan:\n      type: object\n      properties:\n        report:\n          type: array\n          description: Список комиссий\n          items:\n            type: object\n            properties:\n              kgvpMarketplaceUz:\n                type: number\n                description: Комиссия по модели **Маркетплейс** (`FBS`), %\n              kgvpPaidStorageUz:\n                type: number\n                description: Комиссия по модели **Склад WB** (`FBW`), %\n              kgvpSupplierUz:\n                type: number\n                description: Комиссия по модели **Витрина** (`DBS`), %\n              parentID:\n                type: integer\n                description: ID родительской категории\n              parentName:\n                type: string\n                description: Название родительской категории\n              subjectID:\n                type: integer\n                description: ID предмета\n              subjectName:\n                type: string\n                description: Название предмета\n    FeeUAE:\n      type: object\n      properties:\n        report:\n          type: array\n          description: Список комиссий\n          items:\n            type: object\n            properties:\n              kgvpUAE:\n                type: number\n                description: Комиссия для продавцов из ОАЭ, %\n              parentID:\n                type: integer\n                description: ID родительской категории\n              parentName:\n                type: string\n                description: Название родительской категории\n              subjectID:\n                type: integer\n                description: ID предмета\n              subjectName:\n                type: string\n                description: Название предмета\n    BadRequest:\n      type: object\n      properties:\n        detail:\n          type: string\n          description: Детали ошибки\n        origin:\n          type: string\n          description: ID внутреннего сервиса WB\n        requestId:\n          type: string\n          description: Уникальный ID запроса\n        title:\n          type: string\n          description: Заголовок ошибки\n  responses:\n    '401':\n      description: Не авторизован\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки\n              code:\n                type: string\n                description: Внутренний код ошибки\n              requestId:\n                type: string\n                description: Уникальный ID запроса\n              origin:\n                type: string\n                description: ID внутреннего сервиса WB\n              status:\n                type: number\n                description: HTTP статус-код\n              statusText:\n                type: string\n                description: Расшифровка HTTP статус-кода\n              timestamp:\n                type: string\n                format: date-time\n                description: Дата и время запроса\n          example:\n            title: unauthorized\n            detail: 'token problem; token is malformed: could not base64 decode signature: illegal base64 data at input byte 84'\n            code: 07e4668e--a53a3d31f8b0-[UK-oWaVDUqNrKG]; 03bce=277; 84bd353bf-75\n            requestId: 7b80742415072fe8b6b7f7761f1d1211\n            origin: s2s-api-auth-catalog\n            status: 401\n            statusText: Unauthorized\n            timestamp: '2024-09-30T06:52:38Z'\n    '402':\n      description: Требуется платёж\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки. Ошибка возвращается только сервисам из [Каталога решений для бизнеса](/business-solutions)\n          example:\n            title: payment required\n            detail: wb solution for business has insufficient funds on its balance. please top up the balance in the company's personal account https://dev.wildberries.ru/company\n    '429':\n      description: Слишком много запросов\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки\n              code:\n                type: string\n                description: Внутренний код ошибки\n              requestId:\n                type: string\n                description: Уникальный ID запроса\n              origin:\n                type: string\n                description: ID внутреннего сервиса WB\n              status:\n                type: number\n                description: HTTP статус-код\n              statusText:\n                type: string\n                description: Расшифровка HTTP статус-кода\n              timestamp:\n                type: string\n                format: date-time\n                description: Дата и время запроса\n          example:\n            title: too many requests\n            detail: limited by c122a060-a7fb-4bb4-abb0-32fd4e18d489\n            code: 07e4668e-ac2242c5c8c5-[UK-4dx7JUdskGZ]\n            requestId: 9d3c02cc698f8b041c661a7c28bed293\n            origin: s2s-api-auth-catalog\n            status: 429\n            statusText: Too Many Requests\n            timestamp: '2024-09-30T06:52:38Z'\n"
"openapi: 3.0.1\ninfo:\n  title: Работа с товарами\n  version: items\n  description: |+\n    <div class=\"api-block\">\n\n    С помощью методов этого раздела вы можете:\n      - [создавать](/openapi/work-with-products#tag/listingItems) и [редактировать](/openapi/work-with-products#tag/listings) карточки товаров\n      - получать [категории, предметы, характеристики и бренды товаров](/openapi/work-with-products#tag/categoriesSubcategoriesAndCharacteristics)\n      - загружать [медиафайлы](/openapi/work-with-products#tag/mediaFiles) в карточки товаров\n      - настраивать [ярлыки](/openapi/work-with-products#tag/labels) для поиска товаров\n      - работать с [рекомендациями](/openapi/work-with-products#tag/recommendations) для товаров\n      - устанавливать [цены и скидки](/openapi/work-with-products#tag/Ceny-i-skidki)\n      - управлять [остатками товаров](/openapi/work-with-products#tag/Ostatki-na-skladah-prodavca) и [складами](/openapi/work-with-products#tag/Sklady-prodavca), если вы работаете по модели продаж со склада продавца\n\n    Вы можете протестировать методы работы с товарами в [песочнице](/sandbox). Также в песочнице доступны [специальные методы](/docs/openapi-other/sandbox-environment#tag/Rabota-s-tovarami) для управления карточками товаров\n\n    </div>\n\n\n    <div class=\"description_ref\">\n      Узнать, как использовать методы в бизнес-кейсах, можно в <a href=\"/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami\">инструкции</a> по <strong>работе с товарами</strong>\n    </div>\n\n  x-file-name: items\nsecurity:\n  - HeaderApiKey: []\ntags:\n  - name: Категории, предметы и характеристики\n    x-displayName: Категории, предметы и характеристики\n    description: ''\n  - name: Создание карточек товаров\n    x-displayName: Создание карточек товаров\n    description: ''\n  - name: Карточки товаров\n    x-displayName: Карточки товаров\n    description: ''\n  - name: Медиафайлы\n    x-displayName: Медиафайлы\n    description: ''\n  - name: Ярлыки\n    x-displayName: Ярлыки\n    description: ''\n  - name: Рекомендации\n    x-displayName: Рекомендации\n    description: ''\n  - name: Цены и скидки\n    description: ''\n  - name: Склады продавца\n    description: ''\n  - name: Остатки на складах продавца\n    description: ''\npaths:\n  /content/v2/object/parent/all:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: content\n      security:\n        - HeaderApiKey: []\n      summary: Родительские категории товаров\n      description: |\n        Метод возвращает названия и ID всех родительских категорий для [создания карточек товаров](/openapi/work-with-products#tag/listingItems): например, `Электроника`, `Бытовая химия`, `Рукоделие`.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Контент</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 100 запросов | 600 мс | 5 запросов |\n\n        Исключение — методы:\n\n        <ul>\n            <li><a href=\"/openapi/work-with-products#tag/listingItems/paths/~1content~1v2~1cards~1upload/post\">создания карточек товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/listingItems/paths/~1content~1v2~1cards~1upload~1add/post\">создания карточек товаров с присоединением</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/listings/paths/~1content~1v2~1cards~1update/post\">редактирования карточек товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/listings/paths/~1content~1v2~1cards~1recover/post\">восстановления карточек товаров из корзины</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/recommendations/operation/postV1RecommendationsList\">получения списка рекомендаций в карточках товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/recommendations/operation/postV1RecommendationsSet\">установки рекомендаций для товаров</a></li>\n        </ul>\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      tags:\n        - Категории, предметы и характеристики\n      parameters:\n        - name: locale\n          in: query\n          description: |\n            Язык поля ответа `name`:\n              - `ru` — русский\n              - `en` — английский\n              - `zh` — китайский\n\n            Не используется в песочнице. Данные песочницы возвращаются только на русском языке\n          schema:\n            type: string\n            example: en\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    items:\n                      type: object\n                      properties:\n                        name:\n                          description: Название категории\n                          type: string\n                          example: Электроника\n                        id:\n                          description: ID родительской категории\n                          type: integer\n                          example: 479\n                        isVisible:\n                          description: Виден на сайте\n                          type: boolean\n                          example: true\n                  error:\n                    description: Флаг наличия ошибки\n                    type: boolean\n                    example: false\n                  errorText:\n                    description: Описание ошибки\n                    type: string\n                    example: ''\n                  additionalErrors:\n                    description: Дополнительные ошибки\n                    nullable: true\n                    type: string\n                    example: ''\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError400'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError403'\n        '429':\n          $ref: '#/components/responses/429'\n  /content/v2/object/all:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: content\n      security:\n        - HeaderApiKey: []\n      summary: Список предметов\n      description: |\n        Метод возвращает список названий [родительских категорий предметов](/openapi/work-with-products#tag/categoriesSubcategoriesAndCharacteristics/paths/~1content~1v2~1object~1parent~1all/get) и их предметов с ID. Например, у категории `Игрушки` будут предметы `Калейдоскопы`, `Куклы`, `Мячики`.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Контент</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 100 запросов | 600 мс | 5 запросов |\n\n        Исключение — методы:\n\n        <ul>\n            <li><a href=\"/openapi/work-with-products#tag/listingItems/paths/~1content~1v2~1cards~1upload/post\">создания карточек товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/listingItems/paths/~1content~1v2~1cards~1upload~1add/post\">создания карточек товаров с присоединением</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/listings/paths/~1content~1v2~1cards~1update/post\">редактирования карточек товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/listings/paths/~1content~1v2~1cards~1recover/post\">восстановления карточек товаров из корзины</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/recommendations/operation/postV1RecommendationsList\">получения списка рекомендаций в карточках товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/recommendations/operation/postV1RecommendationsSet\">установки рекомендаций для товаров</a></li>\n        </ul>\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      tags:\n        - Категории, предметы и характеристики\n      parameters:\n        - name: locale\n          in: query\n          schema:\n            type: string\n            example: en\n          description: |\n            Язык полей ответа:\n              - `ru` — русский\n              - `en` — английский\n              - `zh` — китайский\n\n            Не используется в песочнице. Данные песочницы возвращаются только на русском языке\n        - name: name\n          in: query\n          schema:\n            type: string\n            example: Носки\n          description: Поиск по названию предмета (Носки), поиск работает по подстроке, искать можно на любом из поддерживаемых языков\n        - name: limit\n          in: query\n          schema:\n            type: integer\n            example: 1000\n            default: 30\n          description: Количество предметов, максимум 1000\n        - name: offset\n          in: query\n          schema:\n            type: integer\n            example: 5000\n            default: 0\n          description: Сколько элементов пропустить. Например, для значения `10` ответ начнется с 11 элемента\n        - name: parentID\n          in: query\n          schema:\n            type: integer\n            example: 1000\n          description: ID родительской категории предмета\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    type: array\n                    description: Предметы\n                    items:\n                      type: object\n                      properties:\n                        subjectID:\n                          type: integer\n                          description: ID предмета\n                        parentID:\n                          type: integer\n                          description: ID родительской категории\n                        subjectName:\n                          type: string\n                          description: Название предмета\n                        parentName:\n                          type: string\n                          description: Название родительской категории\n                  error:\n                    type: boolean\n                    description: Флаг наличия ошибки\n                  errorText:\n                    type: string\n                    description: Текст ошибки\n                  additionalErrors:\n                    nullable: true\n                    description: Дополнительные ошибки\n                    type: string\n              example:\n                data:\n                  - subjectID: 2560\n                    parentID: 479\n                    subjectName: 3D очки\n                    parentName: Электроника\n                  - subjectID: 1152\n                    parentID: 858\n                    subjectName: 3D-принтеры\n                    parentName: Оргтехника\n                error: false\n                errorText: ''\n                additionalErrors: null\n        '401':\n          $ref: '#/components/responses/401'\n        '429':\n          $ref: '#/components/responses/429'\n  /content/v2/object/charcs/{subjectId}:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: content\n      security:\n        - HeaderApiKey: []\n      summary: Характеристики предмета\n      description: |\n        Метод возвращает параметры характеристик предмета: названия, типы данных, единицы измерения и так далее. В запросе необходимо указать ID [предмета](/openapi/work-with-products#tag/categoriesSubcategoriesAndCharacteristics/paths/~1content~1v2~1object~1all/get).\n\n        <div class=\"description_important\">\n          Для получения значений характеристик <a href=\"/openapi/work-with-products#tag/categoriesSubcategoriesAndCharacteristics/paths/~1content~1v2~1directory~1colors/get\">Цвет</a>, <a href=\"/openapi/work-with-products#tag/categoriesSubcategoriesAndCharacteristics/paths/~1content~1v2~1directory~1kinds/get\">Пол</a>, <a href=\"/openapi/work-with-products#tag/categoriesSubcategoriesAndCharacteristics/paths/~1content~1v2~1directory~1countries/get\">Страна производства</a>, <a href=\"/openapi/work-with-products#tag/categoriesSubcategoriesAndCharacteristics/paths/~1content~1v2~1directory~1seasons/get\">Сезон</a>, <a href=\"/openapi/work-with-products#tag/categoriesSubcategoriesAndCharacteristics/paths/~1content~1v2~1directory~1vat/get\">Ставка НДС</a> и <a href=\"/openapi/work-with-products#tag/categoriesSubcategoriesAndCharacteristics/paths/~1content~1v2~1directory~1tnved/get\">ТНВЭД-код</a> используйте отдельные методы\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Контент</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 100 запросов | 600 мс | 5 запросов |\n\n        Исключение — методы:\n\n        <ul>\n            <li><a href=\"/openapi/work-with-products#tag/listingItems/paths/~1content~1v2~1cards~1upload/post\">создания карточек товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/listingItems/paths/~1content~1v2~1cards~1upload~1add/post\">создания карточек товаров с присоединением</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/listings/paths/~1content~1v2~1cards~1update/post\">редактирования карточек товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/listings/paths/~1content~1v2~1cards~1recover/post\">восстановления карточек товаров из корзины</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/recommendations/operation/postV1RecommendationsList\">получения списка рекомендаций в карточках товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/recommendations/operation/postV1RecommendationsSet\">установки рекомендаций для товаров</a></li>\n        </ul>\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      tags:\n        - Категории, предметы и характеристики\n      parameters:\n        - name: subjectId\n          in: path\n          required: true\n          description: ID предмета\n          schema:\n            type: integer\n            example: 105\n        - name: locale\n          in: query\n          description: |\n            Язык полей ответа `subjectName` и `name`:\n              - `ru` — русский\n              - `en` — английский\n              - `zh` — китайский\n\n            Не используется в песочнице. Данные песочницы возвращаются только на русском языке\n          schema:\n            type: string\n            example: en\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    type: array\n                    description: Данные\n                    items:\n                      type: object\n                      properties:\n                        charcID:\n                          type: integer\n                          description: ID характеристики\n                        subjectName:\n                          type: string\n                          description: Название предмета\n                        subjectID:\n                          type: integer\n                          description: ID предмета\n                        name:\n                          type: string\n                          description: Название характеристики\n                        required:\n                          type: boolean\n                          description: |\n                            - `true` — характеристику необходимо обязательно указать в карточке товара\n                            - `false` — характеристику необязательно указывать\n                        unitName:\n                          type: string\n                          description: Единица измерения\n                        maxCount:\n                          type: integer\n                          description: |\n                            Максимальное количество значений, которое можно присвоить характеристике при [создании](./work-with-products#tag/listingItems) или [редактировании](./work-with-products#tag/listings/paths/~1content~1v2~1cards~1update/post) карточек товаров.\n                            <br>\n                            Используется только для характеристик с `\"charcType\":1` — массив строк.\n                            <br>\n                            Характеристикам с `\"charcType\":4` — число, можно присвоить только одно значение.\n                            <br><br>\n                            Если `\"maxCount\":0`, количество значений не ограничено\n                        popular:\n                          description: Характеристика популярна у пользователей (true - да, false - нет)\n                          type: boolean\n                        charcType:\n                          type: integer\n                          description: |\n                            Тип данных характеристики, который необходимо использовать при [создании](./work-with-products#tag/listingItems) или [редактировании](./work-with-products#tag/listings/paths/~1content~1v2~1cards~1update/post) карточек товаров:\n                              -  `1` — массив строк\n                              -  `4` — число (целое либо с десятичной дробью)\n                              -  `0` — характеристика не используется\n                        hasFilter:\n                          type: boolean\n                          description: |\n                            Ключевая характеристика. Является ли характеристика значимой для покупателей:\n                              - `true` — да\n                              - `false` — нет\n                        isVariable:\n                          type: boolean\n                          description: |\n                            Признак [меняющейся характеристики](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov). Значение размечает характеристики, по которым варианты отличаются друг от друга:\n                              -  `true` — варианты товара отличаются по этой характеристике\n                              -  `false` — варианты товара не отличаются по этой характеристике\n                        existNamedField:\n                          type: boolean\n                          description: \"Как передать характеристику в запросах на\\_[cоздание](./work-with-products#tag/listingItems/paths/~1content~1v2~1cards~1upload/post),\\_[создание с присоединением](./work-with-products#tag/listingItems/paths/~1content~1v2~1cards~1upload~1add/post)\\_и\\_[редактирование](./work-with-products#tag/listings/paths/~1content~1v2~1cards~1update/post) карточек товара:\\n  -  `true` — в соответствующем параметре запроса\\n  -  `false` — внутри массива `characteristics`\\n\"\n                  error:\n                    type: boolean\n                    description: Флаг наличия ошибки\n                  errorText:\n                    type: string\n                    description: Текст ошибки\n                  additionalErrors:\n                    type: string\n                    description: Дополнительные ошибки\n                    nullable: true\n                example:\n                  data:\n                    - charcID: 54337\n                      subjectName: Кроссовки\n                      subjectID: 105\n                      name: Размер\n                      required: false\n                      unitName: см\n                      maxCount: 0\n                      popular: false\n                      charcType: 4\n                      hasFilter: true\n                      isVariable: true\n                      existNamedField: true\n                  error: false\n                  errorText: ''\n                  additionalErrors: null\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError400'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError403'\n        '429':\n          $ref: '#/components/responses/429'\n  /content/v2/directory/colors:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: content\n      security:\n        - HeaderApiKey: []\n      summary: Цвет\n      description: |\n        Метод возвращает возможные значения [характеристики](/openapi/work-with-products#tag/categoriesSubcategoriesAndCharacteristics/paths/~1content~1v2~1object~1charcs~1%7BsubjectId%7D/get) предмета `Цвет`.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>Характеристик</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Сервисный | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Базовый с секретом | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n\n        </div>\n      tags:\n        - Категории, предметы и характеристики\n      parameters:\n        - name: locale\n          in: query\n          description: |\n            Язык полей ответа `subjectName` и `name`:\n              - `ru` — русский\n              - `en` — английский\n              - `zh` — китайский\n\n            Не используется в песочнице. Данные песочницы возвращаются только на русском языке\n 
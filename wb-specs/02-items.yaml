r\n                  description: Остаток\n          code:\n            description: Код ошибки\n            type: string\n          message:\n            description: Описание ошибки\n            type: string\n    TaskCreated:\n      type: object\n      properties:\n        data:\n          type: object\n          description: Данные ответа\n          properties:\n            id:\n              type: integer\n              description: ID загрузки\n            alreadyExists:\n              type: boolean\n              description: \"Флаг дублирования загрузки: `true`\\_— такая загрузка уже есть\\n\"\n              example: false\n        error:\n          description: Флаг ошибки\n          type: boolean\n          example: false\n        errorText:\n          description: Текст ошибки\n          type: string\n          example: ''\n    Items:\n      type: array\n      description: \"Товары, цены и скидки для них. Максимум 1\\_000\\_товаров. Цена и скидка не могут быть пустыми одновременно.\\n<br><br>\\nЕсли новая цена со скидкой будет хотя бы в\\_3 раза меньше старой, она попадёт в\\_[карантин](https://seller.wildberries.ru/instructions/ru/ru/material/price-quarantine) и товар будет продаваться по\\_старой цене. Ошибка об\\_этом будет в\\_ответах методов состояний загрузок.\\n<br><br>\\nВы можете изменить цену или скидку с помощью API либо вывести товар из\\_карантина в\\_[личном кабинете](https://seller.wildberries.ru/discount-and-prices/quarantine)\\n\"\n      items:\n        $ref: '#/components/schemas/Good'\n    Good:\n      type: object\n      required:\n        - nmID\n      properties:\n        nmID:\n          type: integer\n          example: 123\n          description: Артикул WB\n        price:\n          type: integer\n          nullable: true\n          example: 999\n          description: Цена. Валюту можно получить с помощью методов [Получить товары с ценами](./work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1filter/get) и [Получить товары с ценами по артикулам](./work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1filter/post), поле `currencyIsoCode4217`\n        discount:\n          type: integer\n          nullable: true\n          example: 30\n          description: \"Скидка,\\_%\"\n    SizeItemsBody:\n      description: \"Размеры и цены для них. Максимум 1\\_000 размеров.\\n<br><br>\\nДля товаров с поразмерной установкой цен [карантин](https://seller.wildberries.ru/instructions/ru/ru/material/price-quarantine) не применяется\\n\"\n      type: array\n      items:\n        $ref: '#/components/schemas/SizeGoodReq'\n    SizeGoodReq:\n      type: object\n      required:\n        - nmID\n        - sizeID\n        - price\n      properties:\n        nmID:\n          type: integer\n          example: 123\n          description: Артикул WB\n        sizeID:\n          type: integer\n          example: 98989887\n          description: ID размера. Можно получить с помощью методов [Получить товары с ценами](./work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1filter/get) и [Получить товары с ценами по артикулам](./work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1filter/post), поле `sizeID`. В методах Контента это поле `chrtID`\n        price:\n          type: integer\n          example: 999\n          description: Цена. Валюту можно получить с помощью методов [Получить товары с ценами](./work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1filter/get) и [Получить товары с ценами по артикулам](./work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1filter/post), поле `currencyIsoCode4217`\n    ClubDisc:\n      type: array\n      description: \"Товары и скидки WB Клуба для них. Максимум 1\\_000\\_товаров.\\n\"\n      items:\n        $ref: '#/components/schemas/ClubDiscReq'\n    ClubDiscReq:\n      type: object\n      required:\n        - nmID\n        - clubDiscount\n      properties:\n        nmID:\n          type: integer\n          example: 123\n          description: Артикул WB\n        clubDiscount:\n          type: integer\n          example: 5\n          description: \"Скидка WB Клуба,\\_%\"\n    B2BWholesale:\n      type: array\n      description: Товары и оптовые скидки для B2B\n      minItems: 1\n      maxItems: 1000\n      items:\n        type: object\n        required:\n          - nmId\n          - wholesaleDiscountThreshold\n        properties:\n          nmId:\n            type: integer\n            description: Артикул WB\n            example: 694707813\n          wholesaleDiscountThreshold:\n            type: array\n            description: Оптовые скидки разных уровней для B2B\n            items:\n              $ref: '#/components/schemas/WholesaleDiscountThresholdReq'\n    WholesaleDiscountThresholdReq:\n      type: object\n      required:\n        - minQuantity\n        - wholesaleDiscount\n        - level\n      properties:\n        minQuantity:\n          description: Минимальное количество единиц товара для скидки\n          type: integer\n          example: 10\n        wholesaleDiscount:\n          description: Скидка, %.<br>Чтобы удалить скидку, укажите `0`. Такой запрос одновременно удалит скидки на этом уровне и на всех более высоких уровнях `level` — вне зависимости от указания их в запросе\n          type: integer\n          example: 10\n        level:\n          description: Уровень скидки\n          type: integer\n          example: 1\n    WholesaleDiscountThresholdRes:\n      type: object\n      required:\n        - minQuantity\n        - wholesaleDiscount\n        - level\n      properties:\n        minQuantity:\n          description: Минимальное количество единиц товара для скидки\n          type: integer\n          example: 10\n        wholesaleDiscount:\n          description: Скидка, %\n          type: integer\n          example: 10\n        level:\n          description: Уровень скидки\n          type: integer\n          example: 1\n    ItemsList:\n      type: object\n      description: Размеры товара\n      properties:\n        nmID:\n          type: integer\n          description: Артикул WB\n          example: 98486\n        vendorCode:\n          type: string\n          description: Артикул продавца\n          example: '07326060'\n        sizes:\n          type: array\n          description: Размер\n          items:\n            type: object\n            required:\n              - sizeID\n              - price\n              - discountedPrice\n              - clubDiscountedPrice\n              - techSizeName\n            properties:\n              sizeID:\n                type: integer\n                description: ID размера. В методах Контента это поле `chrtID`\n                format: int64\n                example: 3123515574\n              price:\n                type: integer\n                description: Цена\n                example: 500\n              discountedPrice:\n                type: number\n                description: Цена со скидкой\n                example: 350\n              clubDiscountedPrice:\n                type: number\n                description: Цена со скидкой, включая скидку WB Клуба\n                example: 332.5\n              techSizeName:\n                description: Размер товара\n                type: string\n                example: '42'\n        currencyIsoCode4217:\n          type: string\n          description: Валюта, по стандарту ISO 4217\n          example: RUB\n        discount:\n          type: integer\n          description: \"Скидка,\\_%\"\n          example: 30\n        clubDiscount:\n          type: integer\n          example: 5\n          description: \"Скидка WB Клуба,\\_%\"\n        editableSizePrice:\n          description: |\n            Можно ли устанавливать цены отдельно для разных размеров (зависит от категории товара):\n              - `true` — можно\n              - `false` — нельзя\n          type: boolean\n          example: true\n        wholesaleDiscountThreshold:\n          type: array\n          description: Оптовые скидки разных уровней для B2B\n          items:\n            $ref: '#/components/schemas/WholesaleDiscountThresholdRes'\n        isBadTurnover:\n          description: |\n            Признак неликвидного товара:\n              - `true` — неликвидный товар с [низким индексом остатка](https://seller.wildberries.ru/instructions/ru/ru/material/stocks-index?categoryId=e324ce0f-9a2a-4b8d-8fd1-72f751b09b3b&goBackOption=prevRoute#%D1%83%D1%80%D0%BE%D0%B2%D0%BD%D0%B8-%D0%B8%D0%BD%D0%B4%D0%B5%D0%BA%D1%81%D0%B0-%D0%BE%D1%81%D1%82%D0%B0%D1%82%D0%BA%D0%B0)\n              - Поле отсутствует — ликвидный товар\n          type: boolean\n          example: true\n    SizeGood:\n      type: object\n      description: \"Информация о\\_размере\"\n      properties:\n        nmID:\n          type: integer\n          example: 123\n          description: Артикул WB\n        sizeID:\n          description: \"ID размера. Можно получить с помощью метода [Получение списка товаров по\\_артикулам](./work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1filter/get), поле `sizeID`. В методах Контента это поле `chrtID`\"\n          type: integer\n          example: 98989887\n        vendorCode:\n          type: string\n          example: '34552332'\n          description: Артикул продавца\n        price:\n          type: integer\n          example: 1000\n          description: Цена\n        currencyIsoCode4217:\n          type: string\n          description: Валюта, по стандарту ISO 4217\n          example: RUB\n        discountedPrice:\n          type: number\n          example: 700\n          description: \"Цена со\\_скидкой\"\n        clubDiscountedPrice:\n          type: number\n          description: Цена со скидкой, включая скидку WB Клуба\n          example: 665\n        discount:\n          description: \"Скидка,\\_%\"\n          type: integer\n          example: 30\n        clubDiscount:\n          type: integer\n          example: 5\n          description: \"Скидка WB Клуба,\\_%\"\n        techSizeName:\n          description: Размер товара\n          type: string\n          example: '42'\n        editableSizePrice:\n          description: |\n            Можно ли устанавливать цены отдельно для разных размеров (зависит от категории товара):\n              - `true` — можно\n              - `false` — нельзя\n          type: boolean\n          example: true\n        isBadTurnover:\n          description: |\n            Признак неликвидного товара:\n              - `true` — неликвидный товар с [низким индексом остатка](https://seller.wildberries.ru/instructions/ru/ru/material/stocks-index?categoryId=e324ce0f-9a2a-4b8d-8fd1-72f751b09b3b&goBackOption=prevRoute#%D1%83%D1%80%D0%BE%D0%B2%D0%BD%D0%B8-%D0%B8%D0%BD%D0%B4%D0%B5%D0%BA%D1%81%D0%B0-%D0%BE%D1%81%D1%82%D0%B0%D1%82%D0%BA%D0%B0)\n              - Поле отсутствует — ликвидный товар\n          type: boolean\n          example: true\n    GoodBufferHistory:\n      type: object\n      properties:\n        nmID:\n          type: integer\n          example: 544833232\n          description: Артикул WB\n        vendorCode:\n          type: string\n          example: '34552332'\n          description: Артикул продавца\n        sizeID:\n          type: integer\n          example: 54483342\n          description: ID размера. В методах Контента это поле `chrtID`\n        techSizeName:\n          type: string\n          example: XXL\n          description: Размер\n        price:\n          type: integer\n          example: 1500\n          description: Цена\n        currencyIsoCode4217:\n          type: string\n          example: RUB\n          description: Валюта, по стандарту ISO 4217\n        discount:\n          type: integer\n          example: 25\n          description: \"Скидка,\\_%\"\n        clubDiscount:\n          type: integer\n          example: 5\n          description: \"Скидка WB Клуба,\\_%\"\n        status:\n          $ref: '#/components/schemas/ItemStatusBuffer'\n        errorText:\n          type: string\n          example: null\n          description: Текст ошибки\n          nullable: true\n    GoodHistory:\n      type: object\n      properties:\n        nmID:\n          type: integer\n          example: 544833232\n          description: Артикул WB\n        vendorCode:\n          type: string\n          example: '34552332'\n          description: Артикул продавца\n        sizeID:\n          type: integer\n          nullable: true\n          example: 54483342\n          description: ID размера. В методах Контента это поле `chrtID`\n        techSizeName:\n          type: string\n          example: '42'\n          description: Размер\n        price:\n          type: integer\n          nullable: true\n          example: 1500\n          description: Цена\n        currencyIsoCode4217:\n          type: string\n          example: RUB\n          description: Валюта, по стандарту ISO 4217\n        discount:\n          type: integer\n          example: 25\n          description: \"Скидка,\\_%\"\n        clubDiscount:\n          type: integer\n          example: 5\n          description: \"Скидка WB Клуба,\\_%\"\n          nullable: true\n        status:\n          $ref: '#/components/schemas/ItemStatus'\n        errorText:\n          type: string\n          nullable: true\n          example: You can't change the item price. Item was added to the Sale due to high inventory\n          description: \"Текст ошибки. Например:\\n  - `You can't change the item price. Item was added to the Sale due to high inventory` — ошибка возникает, если товар попал под распродажу по [индексу остатка](https://seller.wildberries.ru/instructions/ru/ru/material/A-1159).\\n  - `The new price is several times lower than the current price. Item has been moved to Price Quarantine` — ошибка возникает, если новая цена со скидкой хотя бы в\\_3 раза меньше старой. Вы можете изменить цену или скидку с помощью API либо вывести товар из\\_карантина в\\_[личном кабинете](https://seller.wildberries.ru/discount-and-prices/quarantine).\\n\"\n    SellerTaskMetadata:\n      type: object\n      nullable: true\n      description: Данные ответа\n      properties:\n        uploadID:\n          type: integer\n          example: 395643565\n          description: ID загрузки\n        status:\n          $ref: '#/components/schemas/TaskStatus'\n        uploadDate:\n          $ref: '#/components/schemas/Date'\n        activationDate:\n          $ref: '#/components/schemas/Date1'\n        overAllGoodsNumber:\n          description: Всего товаров\n          type: integer\n        successGoodsNumber:\n          description: Товаров без ошибок\n          type: integer\n    SellerTaskMetadataBuffer:\n      nullable: true\n      type: object\n      description: Данные ответа\n      properties:\n        uploadID:\n          type: integer\n          example: 395643565\n          description: ID загрузки\n        status:\n          $ref: '#/components/schemas/TaskStatusBuffer'\n        uploadDate:\n          $ref: '#/components/schemas/Date'\n        activationDate:\n          $ref: '#/components/schemas/Date1'\n        overAllGoodsNumber:\n          description: Всего товаров\n          type: integer\n          example: 100\n        successGoodsNumber:\n          description: Товаров без ошибок (0, потому что загрузка в обработке)\n          type: integer\n          example: 0\n    Date:\n      type: string\n      example: '2022-08-21T22:00:13+02:00'\n      format: date-time\n      description: Дата и время, когда загрузка создана\n    Date1:\n      type: string\n      example: '2022-08-21T22:00:13+02:00'\n      format: date-time\n      description: \"Дата и время, когда загрузка отправляется в\\_обработку\"\n    TaskStatus:\n      description: \"Статус загрузки:\\n  * `3`\\_— обработана, в товарах нет ошибок, цены и скидки обновились\\n  * `4`\\_— отменена\\n  * `5`\\_— обработана, но в\\_товарах есть ошибки. Для товаров без ошибок цены и скидки обновились, а ошибки в\\_остальных товарах можно получить с\\_помощью метода [Детализация обработанной загрузки](./work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1history~1goods~1task/get)\\n  * `6`\\_— обработана, но\\_во всех товарах есть ошибки. Их тоже можно получить с\\_помощью метода [Детализация обработанной загрузки](./work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1history~1goods~1task/get)\\n\"\n      type: integer\n      example: 3\n    TaskStatusBuffer:\n      description: \"Статус загрузки: `1`\\_— в обработке\\n\"\n      type: integer\n      example: 1\n    ItemStatus:\n      description: \"Статус товара:\\n  * `2`\\_— товар без ошибок, цена и/или скидка обновилась\\n  * `3`\\_— есть ошибки, данные не обновились\\n\"\n      type: integer\n      example: 1\n    ItemStatusBuffer:\n      description: \"Статус товара: `1`\\_— в обработке\\n\"\n      type: integer\n      example: 1\n    Error:\n      type: object\n      nullable: false\n      properties:\n        code:\n          type: string\n          description: Код ошибки\n          nullable: false\n        message:\n          type: string\n          description: Описание ошибки\n          nullable: false\n        data:\n          type: object\n          description: Дополнительные данные ошибки\n          nullable: true\n    QuarantineItems:\n      type: object\n      properties:\n        nmID:\n          type: integer\n          example: 206025152\n          description: Артикул WB\n        sizeID:\n          description: Не используется\n          type: integer\n          example: null\n          nullable: true\n        techSizeName:\n          description: Не используется\n          type: string\n          example: ''\n        currencyIsoCode4217:\n          type: string\n          description: Валюта по стандарту ISO 4217\n          example: RUB\n        newPrice:\n          type: number\n          format: float\n          nullable: true\n          example: 134\n          description: Новая цена продавца до скидки\n        oldPrice:\n          type: number\n          format: float\n          example: 4000\n          description: Текущая цена продавца до скидки\n        newDiscount:\n          type: integer\n          example: 25\n          nullable: true\n          description: Новая скидка продавца, %\n        oldDiscount:\n          type: integer\n          example: 25\n          description: Текущая скидка продавца, %\n        priceDiff:\n          type: number\n          format: float\n          description: 'Разница: `newPrice` * (1 - `newDiscount` / 100) - `oldPrice` * (1 - `oldDiscount` / 100)'\n          example: -2899.5\n    Office:\n      type: object\n      description: Данные о складе WB\n      properties:\n        address:\n          type: string\n          nullable: false\n          description: Адрес\n          example: ул. Троицкая, Подольск, Московская обл.\n        name:\n          type: string\n          nullable: false\n          description: Название\n          example: Коледино\n        city:\n          type: string\n          nullable: false\n          description: Город\n          example: Москва\n        id:\n          type: integer\n          format: int64\n          nullable: false\n          description: ID\n          example: 15\n        longitude:\n          type: number\n          format: float64\n          nullable: false\n          description: Долгота\n          example: 55.386871\n        latitude:\n          type: number\n          format: float64\n          nullable: false\n          description: Широта\n          example: 37.588898\n        cargoType:\n          description: |\n            Тип товара, который принимает склад:\n              - `1` — малогабаритный товар (МГТ)\n              - `3` — крупногабаритный товар (КГТ+)\n          type: integer\n          enum:\n            - 1\n            - 3\n          example: 1\n        deliveryType:\n          type: integer\n          description: |\n            Тип доставки, который принимает склад:\n              - `1` — доставка на склад WB (FBS)\n              - `2` — доставка силами продавца (DBS)\n              - `3` — доставка курьером WB (DBW)\n              - `5` — самовывоз (C&C)\n              - `6` — экспресс-доставка силами продавца (ЕDBS)\n          enum:\n            - 1\n            - 2\n            - 3\n            - 5\n            - 6\n          example: 1\n        federalDistrict:\n          type: string\n          nullable: true\n          example: Центральный\n          description: Федеральный округ склада WB. Если `null`, склад находится за пределами РФ или федеральный округ не указан\n        selected:\n          type: boolean\n          nullable: false\n          description: Признак того, что склад уже выбран продавцом\n    Warehouse:\n      type: object\n      description: Данные о складе продавца\n      properties:\n        name:\n          type: string\n          nullable: false\n          description: Название склада продавца\n          example: ул. Троицкая, Подольск, Московская обл.\n        officeId:\n          type: integer\n          format: int64\n          nullable: false\n          description: ID склада WB\n          example: 15\n        id:\n          type: integer\n          format: int64\n          nullable: false\n          description: ID склада продавца\n          example: 1\n        cargoType:\n          description: |\n            Тип товара:\n              - `1` — малогабаритный товар (МГТ)\n              - `2` — сверхгабаритный товар (СГТ)\n              - `3` — крупногабаритный товар (КГТ+)\n          type: integer\n          enum:\n            - 1\n            - 2\n            - 3\n          example: 1\n        deliveryType:\n          type: integer\n          description: |\n            Тип доставки, который принимает склад:\n              - `1` — доставка на склад WB (FBS)\n              - `2` — доставка силами продавца (DBS)\n              - `3` — доставка курьером WB (DBW)\n              - `5` — самовывоз (C&C)\n              - `6` — экспресс-доставка силами продавца (ЕDBS)\n          enum:\n            - 1\n            - 2\n            - 3\n            - 5\n            - 6\n          example: 1\n        isDeleting:\n          type: boolean\n          nullable: false\n          description: |\n            Склад удаляется:\n              - `false` — нет\n              - `true` — да\n\n            После удаления склад пропадёт из списка\n          example: false\n        isProcessing:\n          type: boolean\n          nullable: false\n          description: |\n            Данные склада обновляются:\n              - `false` — нет\n              - `true` — да, обновление и удаление остатков недоступно\n\n            Обновление данных может занимать несколько минут\n          example: true\n    responsePublicViewerPublicErrorsTableListV2:\n      type: object\n      required:\n        - data\n        - error\n        - errorText\n        - additionalErrors\n      properties:\n        data:\n          $ref: '#/components/schemas/models.ErrorTableListPublicRespV2'\n        error:\n          description: Флаг ошибки\n          type: boolean\n        errorText:\n          description: Описание ошибки\n          type: string\n        additionalErrors:\n          nullable: true\n          description: Дополнительные ошибки\n          type: object\n    models.ErrorTableListPublicRespV2:\n      type: object\n      description: Данные ответа\n      required:\n        - items\n        - cursor\n      properties:\n        items:\n          type: array\n          description: Пакеты данных\n          items:\n            $ref: '#/components/schemas/models.ErrorTableListPublicRespV2Item'\n        cursor:\n          $ref: '#/components/schemas/viewer_contract.PublicErrorsCursorOutput'\n    models.ErrorTableListPublicRespV2Item:\n      type: object\n      required:\n        - batchUUID\n        - subjects\n        - brands\n        - vendorCodes\n        - errors\n        - updatedAt\n      properties:\n        batchUUID:\n          type: string\n          format: UUID\n          description: ID пакета\n        subjects:\n          type: object\n          description: Предметы. Разбивка по `vendorCodes`\n          additionalProperties:\n            $ref: '#/components/schemas/models.ErrorSubcategory'\n        brands:\n          type: object\n          description: Бренды. Разбивка по `vendorCodes`\n          additionalProperties:\n            $ref: '#/components/schemas/models.ErrorBrand'\n        vendorCodes:\n          type: array\n          description: Артикулы продавца\n          items:\n            type: string\n        errors:\n          type: object\n          description: Ошибки. Разбивка по `vendorCodes`\n          additionalProperties:\n            type: array\n            items:\n              type: string\n        updatedAt:\n          type: string\n          format: date-time\n          description: Дата и время создания или редактирования пакета\n    viewer_contract.PublicErrorsCursorOutput:\n      type: object\n      required:\n        - next\n        - updatedAt\n        - batchUUID\n      description: Пагинатор\n      properties:\n        next:\n          type: boolean\n          description: |\n            Есть ли ещё черновики:\n              - `false` — нет\n              - `true` — да\n        updatedAt:\n          type: string\n          format: date-time\n          description: Дата и время формирования последнего пакета в ответе\n        batchUUID:\n          type: string\n          format: UUID\n          description: ID последнего пакета в ответе\n    models.ErrorSubcategory:\n      type: object\n      required:\n        - id\n        - name\n      properties:\n        id:\n          type: number\n          format: uint64\n          description: ID предмета\n        name:\n          type: string\n          description: Название предмета\n    models.ErrorBrand:\n      type: object\n      properties:\n        id:\n          type: number\n          format: uint64\n          description: ID бренда\n        name:\n          type: string\n          description: Бренд\n    requestPublicViewerPublicErrorsTableListV2:\n      type: object\n      properties:\n        cursor:\n          $ref: '#/components/schemas/swagger.PublicErrorsCursorInput'\n        order:\n          $ref: '#/components/schemas/swagger.PublicErrorsOrderV2'\n    swagger.PublicErrorsCursorInput:\n      type: object\n      description: Пагинатор\n      properties:\n        limit:\n          type: number\n          format: int\n          description: Количество пакетов в ответе\n          maximum: 100\n          default: 100\n        updatedAt:\n          type: string\n          format: date-time\n          description: Дата и время формирования последнего пакета в ответе на предыдущий запрос\n        batchUUID:\n          type: string\n          format: UUID\n          description: ID последнего пакета в ответе на предыдущий запрос\n    swagger.PublicErrorsOrderV2:\n      type: object\n      description: Порядок выдачи пакетов\n      properties:\n        ascending:\n          type: boolean\n          description: |\n            - `false` — сортировка по убыванию\n            - `true` — сортировка по возрастанию\n          default: true\n    GetRecomReq:\n      type: object\n      description: Запрос для получения рекомендаций\n      properties:\n        brandNames:\n          description: Бренды\n          type: array\n          maxItems: 30\n          items:\n            type: string\n          example:\n            - Comma\n        limit:\n          description: Количество товаров в ответе\n          type: integer\n          default: 20\n          maximum: 5000\n          minimum: 0\n        next:\n          description: Курсор. Последний `nmId` в ответе\n          type: integer\n          default: 0\n          example: 123\n        search:\n          description: |\n            Поиск:\n              - по артикулу WB `nmId` — полное совпадение\n              - по артикулу продавца `vendorCode` — частичное совпадение\n          type: string\n          maxLength: 72\n          example: '410'\n        subjectIds:\n          description: ID предметов\n          type: array\n          maxItems: 30\n          items:\n            type: integer\n          example:\n            - 123\n            - 5231\n    GetRecomRes:\n      type: object\n      description: Товары с рекомендациями\n      required:\n        - data\n        - next\n      properties:\n        data:\n          type: array\n          description: Данные о товарах и их рекомендациях\n          items:\n            type: object\n            required:\n              - brandName\n              - imtId\n              - nmId\n              - pic\n              - picsCount\n              - recomCount\n              - recomPics\n              - recomNms\n              - subjectName\n              - title\n              - vendorCode\n            properties:\n              nmId:\n                description: Артикул WB\n                type: integer\n                example: 5870243\n              imtId:\n                description: ID для [объединённых](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточек товаров\n                format: int64\n                type: integer\n                example: 619043112\n              vendorCode:\n                description: Артикул продавца\n                type: string\n                example: 41058/transparent\n              brandName:\n                description: Бренд\n                type: string\n                example: Comma\n              updatedAt:\n                description: Дата и время последнего обновления рекомендаций\n                type: string\n                format: date-time\n                nullable: true\n                example: '2025-11-13T12:56:15.778591Z'\n              picsCount:\n                description: Количество изображений в карточке товара\n                type: integer\n                example: 4\n              title:\n                description: Название товара\n                type: string\n                example: Transparent phone case\n              subjectName:\n                description: Предмет\n                type: string\n                example: Phone cases\n              pic:\n                description: URL основного изображения в карточке товара\n                type: string\n                example: https://basket-01.wbbasket.ru/vol58/part5870/5870243/images/c516x688/1.webp\n              recomCount:\n                description: Количество рекомендуемых товаров\n                type: integer\n                example: 2\n              recomPics:\n                description: Список URL основных изображений рекомендуемых товаров\n                type: array\n                items:\n                  type: string\n                example:\n                  - https://basket-02.wbbasket.ru/vol174/part17405/17405826/images/tm/1.webp\n                  - https://basket-02.wbbasket.ru/vol174/part17420/17420062/images/tm/1.webp\n              recomNms:\n                description: Список `nmId` рекомендуемых товаров\n                type: array\n                items:\n                  type: integer\n                example:\n                  - 17405826\n                  - 17420062\n        next:\n          description: Курсор. Последний `nmId` в ответе\n          type: integer\n          example: 143\n    response400GetRecom:\n      type: object\n      required:\n        - detail\n        - origin\n        - requestId\n        - title\n      properties:\n        requestId:\n          description: ID запроса\n          type: string\n          example: a03341a9-7b2c-41fd-9902-12a2705f0d24\n        origin:\n          description: ID внутреннего сервиса WB\n          type: string\n          example: recoms\n        title:\n          description: Заголовок ошибки\n          type: string\n          example: Bad Request\n        detail:\n          description: Детали ошибки\n          type: string\n          example: Search string length limit exceeded, maximum 72 required\n    SetRecomReq:\n      type: object\n      description: Запрос на добавление или замену рекомендаций\n      required:\n        - recList\n      properties:\n        recList:\n          type: array\n          description: Список рекомендаций для товаров\n          maxItems: 5000\n          minItems: 1\n          items:\n            type: object\n            properties:\n              nmId:\n                description: Артикул WB\n                type: integer\n                default: 0\n                example: 5870243\n              recommendations:\n                description: |\n                  Рекомендуемые товары.\n                  <br>\n                  Укажите `recomNm` товаров, чтобы добавить их в рекомендации к указанному `nmId`.\n                  <br>\n                  При отправке пустого массива `[]` все текущие рекомендации для указанного `nmId` будут удалены.\n                type: array\n                maxItems: 20\n                minItems: 0\n                items:\n                  type: object\n                  properties:\n                    recomNm:\n                      description: Артикул WB рекомендуемого товара\n                      type: integer\n                      default: 0\n                      example: 5870244\n                    sort:\n                      description: |\n                        Позиция товара в списке рекомендаций.\n\n                         Допустимые значения:\n                         - `1`–`20` — фиксированная позиция:\n                           - при создании или замене (`replace: true`) задаёт порядок отображения\n                           - при добавлении (`replace: false`) вставляет товар на указанную позицию, существующие сдвигаются\n                         - `0` — автоматическая сортировка товаров:\n                           - при создании или замене (`replace: true`) — в порядке расположения товаров в массиве `recommendations`\n                           - при добавлении (`replace: false`) — в конец списка существующих рекомендаций, сохраняя порядок из массива `recommendations`\n                      type: integer\n                      default: 20\n                      maximum: 20\n                      minimum: 0\n                      example: 1\n        replace:\n          description: |\n            Действие в запросе:\n              - `false` — добавить новые рекомендации к существующим\n              - `true` — заменить существующие рекомендации новыми\n          type: boolean\n          default: false\n          example: true\n    SetRecomRes:\n      type: object\n      required:\n        - isError\n      properties:\n        isError:\n          description: |\n            Есть ли ошибки:\n              - `false` — ошибок нет. Запрос полностью успешен\n              - `true` — ошибки есть\n          type: boolean\n          example: true\n        errors:\n          description: Ошибки. При `\"isError\":true`\n          type: array\n          items:\n            type: object\n            description: Ошибки установки рекомендаций\n            required:\n              - mainNm\n              - message\n              - recomNm\n            properties:\n              mainNm:\n                description: Значение параметра `nmId`\n                type: string\n                example: '5870243'\n              recomNm:\n                description: Значение параметра `recomNm`\n                type: string\n                example: '5870244'\n              message:\n                description: Сообщение об ошибке\n                type: string\n                example: The item has no photo\n    response208SetRecom:\n      type: object\n      required:\n        - detail\n        - origin\n        - requestId\n        - title\n      properties:\n        requestId:\n          description: ID запроса\n          type: string\n          example: a03341a9-7b2c-41fd-9902-12a2705f0d24\n        origin:\n          description: ID внутреннего сервиса WB\n          type: string\n          example: recoms\n        title:\n          description: Заголовок ответа\n          type: string\n          example: Already Reported\n        detail:\n          description: Детали ответа\n          type: string\n          example: Recommendations already set\n    response400SetRecom:\n      type: object\n      required:\n        - detail\n        - origin\n        - requestId\n        - title\n      properties:\n        requestId:\n          description: ID запроса\n          type: string\n          example: a03341a9-7b2c-41fd-9902-12a2705f0d24\n        origin:\n          description: ID внутреннего сервиса WB\n          type: string\n          example: recoms\n        title:\n          description: Заголовок ошибки\n          type: string\n          example: Bad Request\n        detail:\n          description: Детали ошибки\n          type: string\n          example: incorrect request body format\n    Response403General:\n      type: object\n      properties:\n        title:\n          type: string\n          description: Заголовок ошибки\n          example: forbidden\n        detail:\n          type: string\n          description: Детали ошибки\n          example: base token is not allowed\n        code:\n          type: string\n          description: Внутренний код ошибки\n          example: base token is not allowed for this path\n        requestId:\n          type: string\n          description: ID запроса\n          example: 722199b2e15bbca48cc1d488a7989976\n        origin:\n          type: string\n          description: ID внутреннего сервиса WB\n          example: s2s-finance\n        status:\n          type: number\n          description: HTTP статус-код\n          example: 403\n        statusText:\n          type: string\n          description: Расшифровка HTTP статус-кода\n          example: Forbidden\n        timestamp:\n          type: string\n          format: date-time\n          description: Дата и время запроса\n          example: '2026-05-25T02:47:09Z'\n  parameters:\n    Warehouse:\n      name: warehouseId\n      in: path\n      required: true\n      description: ID склада продавца\n      schema:\n        type: integer\n        format: int64\n        example: 1\n    uploadID:\n      in: query\n      name: uploadID\n      description: ID загрузки\n      required: true\n      schema:\n        type: integer\n        example: 146567\n    limit:\n      in: query\n      name: limit\n      description: Сколько элементов вывести на одной странице (пагинация)\n      schema:\n        type: integer\n        format: uint\n        maximum: 1000\n        example: 10\n      required: true\n    offset:\n      in: query\n      name: offset\n      description: Сколько элементов пропустить. Например, для значения `10` ответ начнется с 11 элемента\n      schema:\n        type: integer\n        format: uint\n        minimum: 0\n        example: 0\n    nmID:\n      in: query\n      name: nmID\n      description: Артикул WB\n      schema:\n        type: integer\n        example: 1\n      required: true\n    filterNmID:\n      in: query\n      description: Артикул WB для поиска товара\n      name: filterNmID\n      schema:\n        type: integer\n      example: 44589768676\n  requestBodies:\n    SellerTaskRequest:\n      required: true\n      content:\n        application/json:\n          schema:\n            type: object\n            required:\n              - data\n            properties:\n              data:\n                $ref: '#/components/schemas/Items'\n    SellerTaskRequestSize:\n      required: true\n      content:\n        application/json:\n          schema:\n            type: object\n            required:\n              - data\n            properties:\n              data:\n                $ref: '#/components/schemas/SizeItemsBody'\n    SellerTaskRequestClubDisc:\n      required: true\n      content:\n        application/json:\n          schema:\n            type: object\n            required:\n              - data\n            properties:\n              data:\n                $ref: '#/components/schemas/ClubDisc'\n    B2BWholesaleTaskRequest:\n      required: true\n      description: Установка оптовых скидок для B2B\n      content:\n        application/json:\n          schema:\n            type: object\n            required:\n              - data\n            properties:\n              data:\n                $ref: '#/components/schemas/B2BWholesale'\n          example:\n            data:\n              - nmId: 1\n                wholesaleDiscountThreshold:\n                  - minQuantity: 10\n                    wholesaleDiscount: 10\n                    level: 1\n              - nmId: 694707813\n                wholesaleDiscountThreshold:\n                  - minQuantity: 11\n                    wholesaleDiscount: 14\n                    level: 1\n                  - minQuantity: 18\n                    wholesaleDiscount: 19\n                    level: 3\n    FilterPost:\n      required: true\n      content:\n        application/json:\n          schema:\n            type: object\n            required:\n              - nmList\n            properties:\n              nmList:\n                description: Артикулы WB для поиска товара\n                type: array\n                minItems: 1\n                maxItems: 1000\n                items:\n                  type: integer\n          example:\n            nmList:\n              - 26613989\n              - 1348041\n  responses:\n    '401':\n      description: Не авторизован\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки\n              code:\n                type: string\n                description: Внутренний код ошибки\n              requestId:\n                type: string\n                description: Уникальный ID запроса\n              origin:\n                type: string\n                description: ID внутреннего сервиса WB\n              status:\n                type: number\n                description: HTTP статус-код\n              statusText:\n                type: string\n                description: Расшифровка HTTP статус-кода\n              timestamp:\n                type: string\n                format: date-time\n                description: Дата и время запроса\n          example:\n            title: unauthorized\n            detail: 'token problem; token is malformed: could not base64 decode signature: illegal base64 data at input byte 84'\n            code: 07e4668e--a53a3d31f8b0-[UK-oWaVDUqNrKG]; 03bce=277; 84bd353bf-75\n            requestId: 7b80742415072fe8b6b7f7761f1d1211\n            origin: s2s-api-auth-catalog\n            status: 401\n            statusText: Unauthorized\n            timestamp: '2024-09-30T06:52:38Z'\n    '402':\n      description: Требуется платёж\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки. Ошибка возвращается только сервисам из [Каталога решений для бизнеса](/business-solutions)\n          example:\n            title: payment required\n            detail: wb solution for business has insufficient funds on its balance. please top up the balance in the company's personal account https://dev.wildberries.ru/company\n    '403':\n      description: Доступ запрещён\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки\n              code:\n                type: string\n                description: Внутренний код ошибки\n              requestId:\n                type: string\n                description: ID запроса\n              origin:\n                type: string\n                description: ID внутреннего сервиса WB\n              status:\n                type: number\n                description: HTTP статус-код\n              statusText:\n                type: string\n                description: Расшифровка HTTP статус-кода\n              timestamp:\n                type: string\n                format: date-time\n                description: Дата и время запроса\n          example:\n            title: forbidden\n            detail: base token is not allowed\n            code: base token is not allowed for this path\n            requestId: 722199b2e15bbca48cc1d488a7989976\n            origin: s2s-finance\n            status: 403\n            statusText: Forbidden\n            timestamp: '2026-05-25T02:47:09Z'\n    '429':\n      description: Слишком много запросов\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки\n              code:\n                type: string\n                description: Внутренний код ошибки\n              requestId:\n                type: string\n                description: Уникальный ID запроса\n              origin:\n                type: string\n                description: ID внутреннего сервиса WB\n              status:\n                type: number\n                description: HTTP статус-код\n              statusText:\n                type: string\n                description: Расшифровка HTTP статус-кода\n              timestamp:\n                type: string\n                format: date-time\n                description: Дата и время запроса\n          example:\n            title: too many requests\n            detail: limited by c122a060-a7fb-4bb4-abb0-32fd4e18d489\n            code: 07e4668e-ac2242c5c8c5-[UK-4dx7JUdskGZ]\n            requestId: 9d3c02cc698f8b041c661a7c28bed293\n            origin: s2s-api-auth-catalog\n            status: 429\n            statusText: Too Many Requests\n            timestamp: '2024-09-30T06:52:38Z'\n    NotFound:\n      description: Не найдено\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n          example:\n            code: NotFound\n            message: ''\n    AccessDenied:\n      description: Доступ запрещён\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n          example:\n            code: AccessDenied\n            message: ''\n    ResponseItemsLists:\n      description: Успешно\n      content:\n        application/json:\n          schema:\n            type: object\n            required:\n              - data\n              - error\n              - errorText\n            properties:\n              data:\n                type: object\n                description: Данные ответа\n                required:\n                  - listGoods\n                properties:\n                  listGoods:\n                    description: Информация о товарах\n                    type: array\n                    items:\n                      $ref: '#/components/schemas/ItemsList'\n              error:\n                type: boolean\n                description: Флаг ошибки\n                example: false\n              errorText:\n                type: string\n                description: Текст ошибки\n                example: ''\n    ResponseGoodHistories:\n      description: Успешно\n      content:\n        application/json:\n          schema:\n            type: object\n            properties:\n              data:\n                type: object\n                description: Данные ответа\n                properties:\n                  uploadID:\n                    type: integer\n                    nullable: true\n                    description: ID загрузки\n                    example: 3235236546\n                  historyGoods:\n                    type: array\n                    nullable: true\n                    description: Информация о товарах в загрузке\n                    items:\n                      $ref: '#/components/schemas/GoodHistory'\n    ResponseGoodBufferHistories:\n      description: Успешно\n      content:\n        application/json:\n          schema:\n            type: object\n            properties:\n              data:\n                type: object\n                description: Данные ответа\n                properties:\n                  uploadID:\n                    type: integer\n                    description: ID загрузки\n                    example: 3235236546\n                    nullable: true\n                  bufferGoods:\n                    type: array\n                    nullable: true\n                    description: Информация о товарах в загрузке\n                    items:\n                      $ref: '#/components/schemas/GoodBufferHistory'\n              error:\n                type: boolean\n                description: Флаг ошибки\n                example: false\n              errorText:\n                type: string\n                description: Текст ошибки\n                example: ''\n    ResponseTaskHistory:\n      description: Успешно\n      content:\n        application/json:\n          schema:\n            type: object\n            properties:\n              data:\n                $ref: '#/components/schemas/SellerTaskMetadata'\n              error:\n                type: boolean\n                description: Флаг ошибки\n                example: false\n              errorText:\n                description: Текст ошибки\n                type: string\n                example: ''\n    ResponseTaskBuffer:\n      description: Успешно\n      content:\n        application/json:\n          schema:\n            type: object\n            properties:\n              data:\n                $ref: '#/components/schemas/SellerTaskMetadataBuffer'\n              error:\n                type: boolean\n                description: Флаг ошибки\n                example: false\n              errorText:\n                type: string\n                description: Текст ошибки\n                example: ''\n    ResponseSizeLists:\n      description: Успешно\n      content:\n        application/json:\n          schema:\n            type: object\n            properties:\n              data:\n                type: object\n                description: Данные ответа\n                properties:\n                  listGoods:\n                    description: Размеры товара\n                    type: array\n                    nullable: true\n                    items:\n                      $ref: '#/components/schemas/SizeGood'\n              error:\n                description: Флаг ошибки\n                type: boolean\n                example: false\n              errorText:\n                description: Текст ошибки\n                type: string\n    SuccessTaskResponse:\n      description: Успешно\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/TaskCreated'\n    SuccessTaskResponseV3:\n      description: Успешно\n      content:\n        application/json:\n          schema:\n            type: object\n            required:\n              - id\n              - alreadyExists\n              - results\n            properties:\n              id:\n                type: integer\n                description: ID загрузки\n              alreadyExists:\n                type: boolean\n                description: \"Дублирование загрузки: `true`\\_— такая загрузка уже есть\\n\"\n                example: false\n              results:\n                type: array\n                description: Результаты обработки запроса\n                items:\n                  type: object\n                  required:\n                    - nmId\n                    - success\n                  properties:\n                    nmId:\n                      type: integer\n                      description: Артикул WB\n                      example: 1\n                    success:\n                      type: boolean\n                      description: |\n                        Успешна ли установка скидки на товар:\n                          - `false` — неуспешна\n                          - `true` — успешна\n                      example: false\n                    error:\n                      type: object\n                      required:\n                        - status\n                        - title\n                        - detail\n                      description: Ошибка. При `\"success\":false`\n                      properties:\n                        status:\n                          type: integer\n                          description: HTTP статус-код\n                          example: 400\n                        title:\n                          type: string\n                          description: Заголовок ошибки\n                          example: Bad Request\n                        detail:\n                          type: string\n                          description: Детали ошибки\n                          example: Number of items must increase with each level\n          examples:\n            MultiItemResponse:\n              $ref: '#/components/examples/MultiItemResponse'\n            SuccessTrue:\n              $ref: '#/components/examples/SuccessTrue'\n            InvalidItemNo:\n              $ref: '#/components/examples/InvalidItemNoV3'\n            NewDiscountOutsideAllowedRange:\n              $ref: '#/components/examples/NewDiscountOutsideAllowedRange'\n            NewNumberItemsOutsideAllowedRange:\n              $ref: '#/components/examples/NewNumberItemsOutsideAllowedRange'\n            NumberItemsMustIncreaseWithEachLevel:\n              $ref: '#/components/examples/NumberItemsMustIncreaseWithEachLevel'\n            DiscountMustIncreaseWithEachLevel:\n              $ref: '#/components/examples/DiscountMustIncreaseWithEachLevel'\n            MaximumNumberOfLevels:\n              $ref: '#/components/examples/MaximumNumberOfLevels'\n            DiscountMustInteger:\n              $ref: '#/components/examples/DiscountMustInteger'\n    ResponseQuarantineItems:\n      description: Успешно\n      content:\n        application/json:\n          schema:\n            type: object\n            properties:\n              data:\n                nullable: true\n                type: object\n                description: Данные ответа\n                properties:\n                  quarantineGoods:\n                    description: Информация о товарах в карантине\n                    type: array\n                    items:\n                      $ref: '#/components/schemas/QuarantineItems'\n              error:\n                description: Флаг ошибки\n                type: boolean\n                example: false\n              errorText:\n                description: Текст ошибки\n                type: string\n                example: ''\n    Response208:\n      description: Такая загрузка уже
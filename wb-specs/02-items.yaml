ек | 10 запросов | 600 мс | 5 запросов |\n        | Сервисный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Базовый с секретом | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Базовый | 1 ч | 4 запроса | 15 мин | 1 запрос |\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      requestBody:\n        $ref: '#/components/requestBodies/SellerTaskRequestClubDisc'\n      responses:\n        '200':\n          $ref: '#/components/responses/SuccessTaskResponse'\n        '208':\n          $ref: '#/components/responses/Response208'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                CheckTheWBClubDiscount:\n                  $ref: '#/components/examples/CheckTheWBClubDiscount'\n                DiscountsAreTheSameAsThoseAlreadySet:\n                  $ref: '#/components/examples/DiscountsAreTheSameAsThoseAlreadySet'\n                AllItemNosAreSpecifiedIncorrectlyOrDiscounts:\n                  $ref: '#/components/examples/AllItemNosAreSpecifiedIncorrectlyOrDiscounts'\n                InvalidDiscountValue:\n                  $ref: '#/components/examples/InvalidDiscountValue'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                AccessDenied:\n                  $ref: '#/components/examples/Result403'\n        '409':\n          description: Ошибка при конвертации валюты\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                CurrencySwitchingError:\n                  $ref: '#/components/examples/Result409'\n        '422':\n          description: Неожидаемый результат\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                UnexpectedResult:\n                  $ref: '#/components/examples/UnexpectedResult'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/discounts-prices/v1/upload/task/b2b/wholesale:\n    servers:\n      - url: https://discounts-prices-api.wildberries.ru\n    post:\n      x-readonly-method: false\n      x-category: discountsandprices\n      x-token-types:\n        - personal\n        - service\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Цены и скидки\n      summary: Установить оптовые скидки для B2B-продаж\n      operationId: postV1UploadTaskB2bWholesale\n      description: |\n\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену, \n                <strong>Сервисному</strong> токену\n        </div>\n\n        Метод устанавливает [оптовые скидки для бизнеса](https://seller.wildberries.ru/instructions/ru/ru/material/how-to-enable-wholesale-discounts-for-business)\n\n        <div class=\"description_important\">\n          Получить информацию о процессе установки цен и скидок можно с помощью методов <a href=\"/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1history~1tasks/get\">состояния</a> и <a href=\"/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1history~1goods~1task/get\">детализации</a> обработанной загрузки.\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Цены и скидки</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Сервисный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n\n        </div>\n      requestBody:\n        $ref: '#/components/requestBodies/B2BWholesaleTaskRequest'\n      responses:\n        '200':\n          $ref: '#/components/responses/SuccessTaskResponseV3'\n        '208':\n          $ref: '#/components/responses/Response208V3'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseErrorV3'\n              examples:\n                UploadLimitExceeded:\n                  $ref: '#/components/examples/UploadLimitExceededV3'\n                InvalidDataFormat:\n                  $ref: '#/components/examples/InvalidDataFormatV3'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseErrorV3'\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/Response403General'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/history/tasks:\n    servers:\n      - url: https://discounts-prices-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://discounts-prices-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: discountsandprices\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Цены и скидки\n      summary: Состояние обработанной загрузки\n      description: |\n        Метод возвращает информацию об обработанной загрузке цен и скидок.\n\n        <div class=\"description_important\">\n          Обработанная загрузка — это загрузка цен и скидок для <a href=\"/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1upload~1task/post\">товаров</a>, цен для <a href=\"/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1upload~1task~1size/post\">размеров товаров</a>, <a href=\"/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1upload~1task~1club-discount/post\">скидок WB Клуба</a> и <a href=\"/openapi/work-with-products#tag/Ceny-i-skidki/operation/postV1UploadTaskB2bWholesale\">оптовых скидок для B2B-продаж</a>.\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Цены и скидки</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Сервисный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Базовый с секретом | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Базовый | 1 ч | 4 запроса | 15 мин | 1 запрос |\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/uploadID'\n      responses:\n        '200':\n          $ref: '#/components/responses/ResponseTaskHistory'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                InvalidRequestParameters:\n                  $ref: '#/components/examples/InvalidRequestParameters'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                AccessDenied:\n                  $ref: '#/components/examples/Result403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/history/goods/task:\n    servers:\n      - url: https://discounts-prices-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://discounts-prices-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: discountsandprices\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Цены и скидки\n      summary: Детализация обработанной загрузки\n      description: |\n        Метод возвращает информацию о товарах и об ошибках в товарах в обработанной загрузке.\n\n        <div class=\"description_important\">\n          Обработанная загрузка — это загрузка цен и скидок для <a href=\"/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1upload~1task/post\">товаров</a>, цен для <a href=\"/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1upload~1task~1size/post\">размеров товаров</a> <a href=\"/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1upload~1task~1club-discount/post\">скидок WB Клуба</a> и <a href=\"/openapi/work-with-products#tag/Ceny-i-skidki/operation/postV1UploadTaskB2bWholesale\">оптовых скидок для B2B-продаж</a>.\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Цены и скидки</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Сервисный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Базовый с секретом | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Базовый | 1 ч | 4 запроса | 15 мин | 1 запрос |\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/limit'\n        - $ref: '#/components/parameters/offset'\n        - $ref: '#/components/parameters/uploadID'\n      responses:\n        '200':\n          $ref: '#/components/responses/ResponseGoodHistories'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                InvalidRequestParameters:\n                  $ref: '#/components/examples/InvalidRequestParameters'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                AccessDenied:\n                  $ref: '#/components/examples/Result403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/buffer/tasks:\n    servers:\n      - url: https://discounts-prices-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://discounts-prices-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: discountsandprices\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Цены и скидки\n      summary: Состояние необработанной загрузки\n      description: |\n        Метод возвращает информацию про загрузку скидок в обработке.\n\n        <div class=\"description_important\">\n          Необработанная загрузка — это загрузка скидок в <a href=\"/openapi/promotion#tag/promoCalendar\">календаре акций</a>. Такие скидки применятся к товарам только в момент старта акции.\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Цены и скидки</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Сервисный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Базовый с секретом | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Базовый | 1 ч | 4 запроса | 15 мин | 1 запрос |\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/uploadID'\n      responses:\n        '200':\n          $ref: '#/components/responses/ResponseTaskBuffer'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                InvalidRequestParameters:\n                  $ref: '#/components/examples/InvalidRequestParameters'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                AccessDenied:\n                  $ref: '#/components/examples/Result403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/buffer/goods/task:\n    servers:\n      - url: https://discounts-prices-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://discounts-prices-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: discountsandprices\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Цены и скидки\n      summary: Детализация необработанной загрузки\n      description: |\n        Метод возвращает информацию о товарах и ошибках в товарах из загрузки в обработке.\n\n        <div class=\"description_important\">\n          Необработанная загрузка — это загрузка скидок в <a href=\"/openapi/promotion#tag/promoCalendar\">календаре акций</a>. Такие скидки применятся к товарам только в момент старта акции.\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Цены и скидки</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Сервисный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Базовый с секретом | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Базовый | 1 ч | 4 запроса | 15 мин | 1 запрос |\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/limit'\n        - $ref: '#/components/parameters/offset'\n        - $ref: '#/components/parameters/uploadID'\n      responses:\n        '200':\n          $ref: '#/components/responses/ResponseGoodBufferHistories'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                InvalidRequestParameters:\n                  $ref: '#/components/examples/InvalidRequestParameters'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                AccessDenied:\n                  $ref: '#/components/examples/Result403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/list/goods/filter:\n    servers:\n      - url: https://discounts-prices-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://discounts-prices-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: discountsandprices\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Цены и скидки\n      summary: Получить товары с ценами\n      description: |\n        Метод возвращает информацию о товарах: цены, валюту, общие скидки, [скидки WB Клуба](/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1upload~1task~1club-discount/post) и [оптовые скидки для B2B-продаж](/openapi/work-with-products#tag/Ceny-i-skidki/operation/postV1UploadTaskB2bWholesale).\n        <br><br>\n        В одном запросе можно указать только один артикул.\n        <br><br>\n        Чтобы получить информацию обо всех товарах продавца, не указывая артикулы, установите `limit=1000`, в параметре `offset` установите смещение по количеству записей. Количество нужно рассчитать по формуле: `offset` плюс `limit` из предыдущего запроса. Повторяйте запрос, пока вы не получите ответ с пустым массивом.<br><br>\n        Используйте отдельные методы, чтобы получить информацию:\n          - о [нескольких товарах по артикулам](/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1filter/post)\n          - о [размерах товара](/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1size~1nm/get)\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Цены и скидки</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Сервисный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Базовый с секретом | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Базовый | 1 ч | 4 запроса | 15 мин | 1 запрос |\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/limit'\n        - $ref: '#/components/parameters/offset'\n        - $ref: '#/components/parameters/filterNmID'\n      responses:\n        '200':\n          $ref: '#/components/responses/ResponseItemsLists'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                SortError:\n                  $ref: '#/components/examples/SortError'\n                InvalidRequestParameters:\n                  $ref: '#/components/examples/InvalidRequestParameters'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                AccessDenied:\n                  $ref: '#/components/examples/Result403'\n        '429':\n          $ref: '#/components/responses/429'\n    post:\n      x-readonly-method: true\n      x-category: discountsandprices\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Цены и скидки\n      summary: Получить товары с ценами по артикулам\n      description: |\n        Метод возвращает информацию о товарах по их артикулам: цены, валюту, общие скидки, [скидки WB Клуба](/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1upload~1task~1club-discount/post) и [оптовые скидки для B2B-продаж](/openapi/work-with-products#tag/Ceny-i-skidki/operation/postV1UploadTaskB2bWholesale).\n        <br><br>\n        В одном запросе можно указать более одного артикула.\n        <br><br>\n        Используйте отдельные методы, чтобы получить информацию:\n          - обо [всех товарах продавца, не указывая артикулы](/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1filter/get)\n          - о [размерах товара](/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1size~1nm/get)\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Цены и скидки</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Сервисный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Базовый с секретом | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Базовый | 1 ч | 4 запроса | 15 мин | 1 запрос |\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      requestBody:\n        $ref: '#/components/requestBodies/FilterPost'\n      responses:\n        '200':\n          $ref: '#/components/responses/ResponseItemsLists'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                InvalidRequestParameters:\n                  $ref: '#/components/examples/InvalidRequestParameters'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                AccessDenied:\n                  $ref: '#/components/examples/Result403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/list/goods/size/nm:\n    servers:\n      - url: https://discounts-prices-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://discounts-prices-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: discountsandprices\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Цены и скидки\n      summary: Получить размеры товара с ценами\n      description: |\n        Метод возвращает информацию обо всех размерах одного товара: цены, валюту, общие скидки и скидки для [WB Клуба](/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1upload~1task~1club-discount/post).\n        <br><br>\n        Работает только для товаров из категорий, где можно устанавливать цены отдельно для разных размеров. Для таких товаров `\"editableSizePrice\":true`.\n        <br><br>\n        Чтобы получить информацию о самом товаре, используйте [отдельный метод](/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1filter/get).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Цены и скидки</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Сервисный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Базовый с секретом | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Базовый | 1 ч | 4 запроса | 15 мин | 1 запрос |\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/limit'\n        - $ref: '#/components/parameters/offset'\n        - $ref: '#/components/parameters/nmID'\n      responses:\n        '200':\n          $ref: '#/components/responses/ResponseSizeLists'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                InvalidRequestParameters:\n                  $ref: '#/components/examples/InvalidRequestParameters'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                AccessDenied:\n                  $ref: '#/components/examples/Result403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/quarantine/goods:\n    servers:\n      - url: https://discounts-prices-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://discounts-prices-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: discountsandprices\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Цены и скидки\n      summary: Получить товары в карантине\n      description: \"Метод возвращает информацию о товарах в карантине.\\n<br><br>\\nЕсли новая цена товара со скидкой будет минимум в\\_3 раза меньше старой, товар попадёт в\\_[карантин](https://seller.wildberries.ru/instructions/ru/ru/material/price-quarantine) и будет продаваться по\\_старой цене. Ошибка об\\_этом будет в\\_ответах методов [состояний загрузок](/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1history~1tasks/get).\\n<br><br>\\nВы можете изменить цену или скидку с помощью API либо вывести товар из\\_карантина в\\_[личном кабинете](https://seller.wildberries.ru/discount-and-prices/quarantine).\\n<br><br>\\nДля товаров с [поразмерной установкой цен](/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1upload~1task~1size/post) карантин не применяется.\\n<br><br>\\nВ [песочнице](/sandbox) товары автоматически удаляются из карантина через 3 дня.\\n\\n<div class=\\\"description_limit\\\">\\n<a href=\\\"/openapi/api-information#tag/introduction/Limity-zaprosov\\\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Цены и скидки</strong>:\\n\\n\\n| Тип | Период | Лимит | Интервал | Всплеск |\\n| --- | --- | --- | --- | --- |\\n| Персональный | 6 сек | 10 запросов | 600 мс | 5 запросов |\\n| Сервисный | 6 сек | 10 запросов | 600 мс | 5 запросов |\\n| Базовый с секретом | 6 сек | 10 запросов | 600 мс | 5 запросов |\\n| Базовый | 1 ч | 4 запроса | 15 мин | 1 запрос |\\n\\n<hr>\\n\\nВ <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\\n\\n</div>\\n\"\n      parameters:\n        - $ref: '#/components/parameters/limit'\n        - $ref: '#/components/parameters/offset'\n      responses:\n        '200':\n          $ref: '#/components/responses/ResponseQuarantineItems'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                InvalidRequestParameters:\n                  $ref: '#/components/examples/InvalidRequestParameters'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                AccessDenied:\n                  $ref: '#/components/examples/Result403'\n        '422':\n          description: Неожидаемый результат\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                UnexpectedResult:\n                  $ref: '#/components/examples/UnexpectedResult'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/stocks/{warehouseId}:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    put:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Остатки на складах продавца\n      summary: Обновить остатки товаров\n      description: |\n        Метод обновляет количество остатков товаров продавца [в списке](/openapi/work-with-products#tag/Ostatki-na-skladah-prodavca/paths/~1api~1v3~1stocks~1%7BwarehouseId%7D/post).\n\n        <div class=\"description_important\">\n          Названия параметров запроса не валидируются. При отправке некорректных названий вы получите успешный ответ (<code>204</code>), но остатки не обновятся.\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>остатков на складах продавца</strong> кроме метода <a href=\"/openapi/work-with-products#tag/Ostatki-na-skladah-prodavca/paths/~1api~1v3~1stocks~1%7BwarehouseId%7D/delete\">удаления остатков</a>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Warehouse'\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - stocks\n              properties:\n                stocks:\n                  type: array\n                  minItems: 1\n                  maxItems: 1000\n                  description: Массив ID размеров товаров и их остатков\n                  items:\n                    type: object\n                    properties:\n                      chrtId:\n                        type: integer\n                        description: ID размера товара\n                        example: 12345678\n                      amount:\n                        type: integer\n                        maximum: 100000\n                        description: Остаток\n                        example: 10\n      responses:\n        '204':\n          description: Обновлено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n                SKUUploadDisabled:\n                  $ref: '#/components/examples/SKUUploadDisabled'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '406':\n          description: Обновление остатков заблокировано\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/UpdateBlocked'\n              examples:\n                StatusNotAcceptable:\n                  $ref: '#/components/examples/StatusNotAcceptable'\n                WarehouseStocksUpdateBlock:\n                  $ref: '#/components/examples/WarehouseStocksUpdateBlock'\n        '409':\n          description: Ошибка обновления остатков\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/StocksWarehouseError'\n              examples:\n                UploadDataLimit:\n                  $ref: '#/components/examples/UploadDataLimit'\n                CargoWarehouseRestrictionMGT:\n                  $ref: '#/components/examples/CargoWarehouseRestrictionMGT'\n                CargoWarehouseRestrictionSGT:\n                  $ref: '#/components/examples/CargoWarehouseRestrictionSGT'\n                CargoWarehouseRestrictionSGTKGTPlus:\n                  $ref: '#/components/examples/CargoWarehouseRestrictionSGTKGTPlus'\n                CargoWarehouseRestrictionKGTPlus:\n                  $ref: '#/components/examples/CargoWarehouseRestrictionKGTPlus'\n                NotFound:\n                  $ref: '#/components/examples/NotFound'\n                StoreIsProcessing:\n                  $ref: '#/components/examples/StoreIsProcessing1'\n                ItemPropertyConflict:\n                  $ref: '#/components/examples/ItemPropertyConflict'\n                DeliveryTypeRestriction:\n                  $ref: '#/components/examples/DeliveryTypeRestriction'\n        '429':\n          $ref: '#/components/responses/429'\n    delete:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Остатки на складах продавца\n      summary: Удалить остатки товаров\n      description: |\n        Метод удаляет запись об остатках товаров продавца из [списка остатков](/openapi/work-with-products#tag/Ostatki-na-skladah-prodavca/paths/~1api~1v3~1stocks~1%7BwarehouseId%7D/post).\n\n        <div class=\"description_important\">\n          <strong>Действие необратимо</strong>. Удаленный остаток будет необходимо загрузить повторно для возобновления продаж.\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 10 запросов | 6 сек | 2 запроса |\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Warehouse'\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                chrtIds:\n                  type: array\n                  nullable: false\n                  minItems: 1\n                  maxItems: 1000\n                  description: Массив ID размеров товаров\n                  items:\n                    type: integer\n                    nullable: false\n                    example: 123456789\n              required:\n                - chrtIds\n      responses:\n        '204':\n          description: Удалено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n                IncorrectSkuParameter:\n                  $ref: '#/components/examples/SKUUploadDisabled'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          description: Не найдено\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              example:\n                code: NotFound\n                message: ''\n                data:\n                  skuTest1: ''\n                  skuTest2: ''\n        '409':\n          description: Ошибка удаления остатков\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                StoreIsProcessing:\n                  $ref: '#/components/examples/StoreIsProcessing'\n        '429':\n          $ref: '#/components/responses/429'\n    post:\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Остатки на складах продавца\n      summary: Получить остатки товаров\n      description: |\n        Метод возвращает данные об остатках товаров на [складах продавца](/openapi/work-with-products#tag/Sklady-prodavca).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>остатков на складах продавца</strong> кроме метода <a href=\"/openapi/work-with-products#tag/Ostatki-na-skladah-prodavca/paths/~1api~1v3~1stocks~1%7BwarehouseId%7D/delete\">удаления остатков</a>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Warehouse'\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              nullable: false\n              properties:\n                chrtIds:\n                  type: array\n                  maxItems: 1000\n                  description: Массив ID размеров товаров\n                  items:\n                    type: integer\n                    example: 12345678\n              required:\n                - chrtIds\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  stocks:\n                    type: array\n                    nullable: false\n                    items:\n                      type: object\n                      properties:\n                        chrtId:\n                          type: integer\n                          description: ID размера товара\n                          example: 12345678\n                        amount:\n                          type: integer\n                          nullable: false\n                          description: Остаток\n                          example: 10\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n                IncorrectSkuParameter:\n                  $ref: '#/components/examples/SKUUploadDisabled'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/offices:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Склады продавца\n      summary: Получить список складов WB\n      description: |\n        Метод возвращает список складов WB для привязки к складу продавца при его [создании](/openapi/work-with-products#tag/Sklady-prodavca/paths/~1api~1v3~1warehouses/post) или [редактировании](/openapi/work-with-products#tag/Sklady-prodavca/paths/~1api~1v3~1warehouses~1%7BwarehouseId%7D/put).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>складов продавца</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: array\n                nullable: false\n                description: Список складов WB\n                items:\n                  $ref: '#/components/schemas/Office'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/warehouses:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Склады продавца\n      summary: Получить список складов продавца\n      description: |\n        Метод возвращает список всех складов продавца. Может использоваться для работы с [остатками товаров](/openapi/work-with-products#tag/Ostatki-na-skladah-prodavca).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>складов продавца</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: array\n                nullable: false\n                description: Список складов продавца\n                items:\n                  $ref: '#/components/schemas/Warehouse'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n    post:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Склады продавца\n      summary: Создать склад продавца\n      description: |\n        Метод создаёт склад продавца для работы с [остатками товаров](/openapi/work-with-products#tag/Ostatki-na-skladah-prodavca), кроме сверхгабаритных (СГТ), по модели [FBS](/openapi/orders-fbs) (Fulfillment by Seller).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>складов продавца</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                name:\n                  type: string\n                  nullable: false\n                  minLength: 1\n                  maxLength: 200\n                  description: Имя склада продавца\n                  example: Склад Коледино\n                officeId:\n                  type: integer\n                  nullable: false\n                  minimum: 1\n                  description: ID [склада WB](./work-with-products#tag/Sklady-prodavca/paths/~1api~1v3~1offices/get).<br>Нельзя привязывать склад WB, который уже используется\n                  example: 15\n              required:\n                - name\n                - officeId\n      responses:\n        '201':\n          description: Создано\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  id:\n                    type: integer\n                    nullable: false\n                    description: ID склада продавца\n                    example: 2\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                WarehouseNameInvalid:\n                  $ref: '#/components/examples/WarehouseNameInvalid'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '409':\n          description: Ошибка создания нового склада\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/warehouses/{warehouseId}:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    put:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Склады продавца\n      summary: Обновить склад продавца\n      description: |\n        Метод обновляет данные [склада продавца](/openapi/work-with-products#tag/Sklady-prodavca/paths/~1api~1v3~1warehouses/get), кроме складов для сверхгабаритных товаров (СГТ, `\"cargoType\":2`).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>складов продавца</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Warehouse'\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                name:\n                  type: string\n                  nullable: false\n                  minLength: 1\n                  maxLength: 200\n                  description: Имя склада продавца\n                  example: Склад Коледино\n                officeId:\n                  type: integer\n                  nullable: false\n                  minimum: 1\n                  description: ID [склада WB](./work-with-products#tag/Sklady-prodavca/paths/~1api~1v3~1offices/get).<br>Нельзя привязывать склад WB, который уже используется.<br>Можно менять не чаще одного раза в сутки\n                  example: 15\n              required:\n                - name\n                - officeId\n      responses:\n        '204':\n          description: Обновлено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                WarehouseNameInvalid:\n                  $ref: '#/components/examples/WarehouseNameInvalid'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '409':\n          description: Ошибка обновления склада\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n        '429':\n          $ref: '#/components/responses/429'\n    delete:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Склады продавца\n      summary: Удалить склад продавца\n      description: |\n        Метод удаляет [склад продавца](/openapi/work-with-products#tag/Sklady-prodavca/paths/~1api~1v3~1warehouses/get).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>складов продавца</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Warehouse'\n      responses:\n        '204':\n          description: Удалено\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/dbw/warehouses/{warehouseId}/contacts:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    get:\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Склады продавца\n      summary: Список контактов\n      description: |\n        Метод возвращает список контактов, привязанных к [складу продавца](/openapi/work-with-products#tag/Sklady-prodavca/paths/~1api~1v3~1warehouses/get).\n        <br>\n        Только для складов с типом доставки `3` — доставка курьером WB ([DBW](/openapi/orders-dbw)).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для следующих методов DBW:\n        <ul>\n            <li>получение и обновление списка контактов</li>\n            <li>получение и удаление идентификаторов маркировки</li>\n            <li>методы сборочных заданий</li>\n        </ul> \n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Warehouse'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                nullable: false\n                description: Список контактов склада продавца\n                properties:\n                  contacts:\n                    type: array\n                    items:\n                      type: object\n                      properties:\n                        comment:\n                          type: string\n                          nullable: false\n                          description: Комментарий\n                          example: Иванов Иван Иванович. Звонить с 10 до 21 часа.\n                          maxLength: 1000\n                        phone:\n                          type: string\n                          nullable: false\n                          description: Номер телефона\n                          example: '+79998887766'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n    put:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Склады продавца\n      summary: Обновить список контактов\n      parameters:\n        - $ref: '#/components/parameters/Warehouse'\n      description: |\n        Метод обновляет список контактов [склада продавца](/openapi/work-with-products#tag/Sklady-prodavca/paths/~1api~1v3~1warehouses/get).\n\n        <div class=\"description_important\">\n          Список контактов перезаписывается при обновлении. Поэтому в запросе нужно передать <strong>все</strong> параметры списка контактов, в том числе те, которые вы не собираетесь обновлять.\n        </div>\n\n        Только для складов с типом доставки `3` — курьером WB (DBW).\n        <br><br>\n        К складу можно добавить максимум 5 контактов. Чтобы удалить контакты, отправьте пустой массив `contacts`.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для следующих методов DBW:\n        <ul>\n            <li>получение и обновление списка контактов</li>\n            <li>получение и удаление идентификаторов маркировки</li>\n            <li>методы сборочных заданий</li>\n        </ul> \n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/StoreContactRequestBody'\n      responses:\n        '204':\n          description: Обновлено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                UploadDataLimitDbw:\n                  $ref: '#/components/examples/UploadDataLimitDbw'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\ncomponents:\n  schemas:\n    BrandsResponse:\n      type: object\n      required:\n        - brands\n        - total\n      properties:\n        brands:\n          type: array\n          items:\n            type: object\n            required:\n              - id\n              - logoUrl\n              - name\n            properties:\n              id:\n                description: ID бренда\n                example: 9007199254\n                type: integer\n              logoUrl:\n                description: URL логотипа бренда\n                type: string\n              name:\n                description: Название бренда\n                type: string\n                example: Brand\n        next:\n          type: integer\n          description: Параметр пагинации. Укажите это значение в запросе, чтобы получить следующий пакет данных. Если поле отсутствует, вы получили все данные\n          example: 1212\n        total:\n          type: integer\n          description: Общее количество брендов предмета\n          example: 344534\n    BrandsResponseError:\n      type: object\n      required:\n        - title\n        - detail\n        - origin\n        - requestId\n      properties:\n        title:\n          type: string\n          description: Заголовок ошибки\n        detail:\n          type: string\n          description: Детали ошибки\n        origin:\n          type: string\n          description: ID внутреннего сервиса WB\n        requestId:\n          type: string\n          description: Уникальный ID запроса\n        errors:\n          type: array\n          items:\n            type: object\n            properties:\n              message:\n                type: string\n                description: Текст ошибки\n              location:\n                type: string\n                description: Параметр, где произошла ошибка\n              value:\n                description: Значение параметра, где произошла ошибка\n    StoreContactRequestBody:\n      type: object\n      description: Контакты склада продавца\n      properties:\n        contacts:\n          type: array\n          maxItems: 5\n          items:\n            type: object\n            properties:\n              comment:\n                type: string\n                nullable: false\n                description: Комментарий\n                example: Иванов Иван Иванович. Звонить с 10 до 21 часа.\n                maxLength: 1000\n              phone:\n                type: string\n                nullable: false\n                description: |\n                  Номер телефона.<br>Поддерживаются коды стран:\n                    - `+7` — Россия, Казахстан\n                    - `+374` — Армения\n                    - `+375` — Беларусь\n                    - `+996` — Кыргызстан\n                example: '+79998887766'\n    responseItemList:\n      type: object\n      properties:\n        data:\n          type: object\n          nullable: true\n          example: null\n          description: Данные ответа\n        error:\n          description: Флаг ошибки\n          type: boolean\n        errorText:\n          description: Описание ошибки\n          type: string\n        additionalErrors:\n          description: Дополнительные ошибки\n          oneOf:\n            - type: object\n              nullable: true\n              properties:\n                string:\n                  type: string\n              additionalProperties: false\n            - type: string\n              nullable: true\n            - type: object\n              properties:\n                error:\n                  type: string\n              required:\n                - error\n    requestMoveNmsImtConn:\n      type: object\n      required:\n        - targetIMT\n        - nmIDs\n      properties:\n        targetIMT:\n          description: Существующий `imtID`, под которым необходимо [объединить](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточки товаров\n          type: integer\n          example: 123\n        nmIDs:\n          description: |\n            `nmID`, которые необходимо объединить\n          minimum: 1\n          maximum: 30\n          type: array\n          items:\n            type: integer\n          example:\n            - 837459235\n            - 828572090\n    requestMoveNmsImtDisconn:\n      type: object\n      required:\n        - nmIDs\n      properties:\n        nmIDs:\n          description: |\n            `nmID`, которые необходимо разъединить\n          minimum: 1\n          maximum: 30\n          type: array\n          items:\n            type: integer\n          example:\n            - 837459235\n            - 828572090\n      additionalProperties: false\n    responseIncorrectDate:\n      type: object\n      properties:\n        error:\n          type: string\n      additionalProperties: false\n    responseBodyContentError400:\n      type: object\n      properties:\n        data:\n          type: object\n          nullable: true\n          description: Данные ошибки\n        error:\n          description: Флаг ошибки\n          type: boolean\n        errorText:\n          description: Текст ошибки\n          type: string\n        additionalErrors:\n          nullable: true\n          description: Дополнительные ошибки\n          type: object\n    responseBodyContentError403:\n      type: object\n      properties:\n        data:\n          type: object\n          nullable: true\n          description: Данные ошибки\n        error:\n          description: Флаг ошибки\n          type: boolean\n        errorText:\n          description: Текст ошибки\n          type: string\n        additionalErrors:\n          nullable: true\n          description: Дополнительные ошибки\n          type: string\n      example:\n        data: null\n        error: true\n        errorText: Access denied\n        additionalErrors: Access denied\n    responseContentError:\n      type: object\n      properties:\n        data:\n          type: object\n          nullable: true\n          description: Данные ошибки\n        error:\n          description: Флаг ошибки\n          type: boolean\n        errorText:\n          description: Текст ошибки\n          type: string\n        additionalErrors:\n          description: Дополнительные ошибки\n          type: string\n          nullable: true\n      example:\n        data: null\n        error: false\n        errorText: ''\n        additionalErrors: null\n    mediaErrors:\n      type: object\n      properties:\n        additionalErrors:\n          description: Дополнительные ошибки\n          nullable: true\n          type: object\n        data:\n          type: object\n          nullable: true\n          description: Данные ошибки\n        error:\n          description: Флаг ошибки\n          type: boolean\n        errorText:\n          description: Текст ошибки\n          type: string\n      example:\n        additionalErrors: null\n        data: null\n        error: true\n        errorText: Error text\n    ResponseError:\n      type: object\n      properties:\n        data:\n          type: object\n          nullable: true\n          description: Данные ошибки\n        error:\n          type: boolean\n          description: Флаг ошибки\n        errorText:\n          type: string\n          description: Текст ошибки\n    ResponseErrorV3:\n      type: object\n      required:\n        - status\n        - title\n        - detail\n        - requestId\n        - origin\n      properties:\n        status:\n          type: integer\n          description: HTTP статус-код\n          example: 400\n        title:\n   
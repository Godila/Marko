h-products#tag/recommendations/operation/postV1RecommendationsList\">получения списка рекомендаций в карточках товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/recommendations/operation/postV1RecommendationsSet\">установки рекомендаций для товаров</a></li>\n        </ul>\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      tags:\n        - Категории, предметы и характеристики\n      parameters:\n        - name: subjectID\n          in: query\n          required: true\n          description: ID предмета\n          schema:\n            type: integer\n            example: 105\n        - name: search\n          in: query\n          description: Поиск по ТНВЭД-коду. Работает только в паре с `subjectID`\n          schema:\n            type: integer\n            example: 6106903000\n        - name: locale\n          in: query\n          description: |\n            Язык полей ответа:\n              - `ru` — русский\n              - `en` — английский\n              - `zh` — китайский\n\n            Не используется в песочнице. Данные песочницы возвращаются только на русском языке\n          schema:\n            type: string\n            example: en\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    description: Данные\n                    type: array\n                    items:\n                      type: object\n                      properties:\n                        tnved:\n                          type: string\n                          description: ТНВЭД-код\n                        isKiz:\n                          type: boolean\n                          description: |\n                            - `true` — код маркировки [Честного знака](https://честныйзнак.рф/) требуется\n                            - `false` — код маркировки [Честного знака](https://честныйзнак.рф/) не требуется\n                  error:\n                    type: boolean\n                    description: Флаг наличия ошибки\n                    example: false\n                  errorText:\n                    type: string\n                    description: Текст ошибки\n                  additionalErrors:\n                    nullable: true\n                    type: string\n                    description: Дополнительные ошибки\n              example:\n                data:\n                  - tnved: '6106903000'\n                    isKiz: true\n                error: false\n                errorText: ''\n                additionalErrors: null\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError400'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/content/v1/brands:\n    servers:\n      - url: https://content-api.wildberries.ru\n    get:\n      x-readonly-method: true\n      x-category: content\n      security:\n        - HeaderApiKey: []\n      summary: Бренды\n      description: |\n        Метод возвращает список брендов по ID предмета.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 сек | 1 запрос | 1 сек | 5 запросов |\n        | Сервисный | 1 сек | 1 запрос | 1 сек | 5 запросов |\n        | Базовый с секретом | 1 сек | 1 запрос | 1 сек | 5 запросов |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      tags:\n        - Категории, предметы и характеристики\n      parameters:\n        - name: subjectId\n          in: query\n          schema:\n            type: integer\n            example: 1234\n          description: ID предмета\n          required: true\n        - name: next\n          in: query\n          schema:\n            type: integer\n            example: 1234\n          description: Параметр пагинации. Используйте значение `next` из ответа, чтобы получить следующий пакет данных\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/BrandsResponse'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/BrandsResponseError'\n              examples:\n                BrandsResponseBadRequest1:\n                  $ref: '#/components/examples/BrandsResponseBadRequest1'\n                BrandsResponseBadRequest2:\n                  $ref: '#/components/examples/BrandsResponseBadRequest2'\n        '401':\n          $ref: '#/components/responses/401'\n        '404':\n          description: Не найдено\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/BrandsResponseError'\n              examples:\n                BrandsResponseNotFound:\n                  $ref: '#/components/examples/BrandsResponseNotFound'\n        '429':\n          $ref: '#/components/responses/429'\n  /content/v2/tags:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: content\n      security:\n        - HeaderApiKey: []\n      summary: Список ярлыков\n      description: |\n        Метод возвращает список и характеристики всех ярлыков продавца для группировки и фильтрации товаров.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>Ярлыков</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Сервисный | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Базовый с секретом | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      tags:\n        - Ярлыки\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    properties:\n                      id:\n                        description: Числовой ID ярлыка\n                        type: integer\n                      color:\n                        description: Цвет ярлыка\n                        type: string\n                      name:\n                        description: Имя ярлыка\n                        type: string\n                  error:\n                    description: Флаг ошибки\n                    type: boolean\n                    example: false\n                  errorText:\n                    description: Описание ошибки\n                    type: string\n                    example: ''\n                  additionalErrors:\n                    description: Дополнительные ошибки\n                    nullable: true\n                    type: string\n                    example: ''\n              example:\n                data:\n                  - id: 1\n                    color: D1CFD7\n                    name: Sale\n                error: false\n                errorText: ''\n                additionalErrors: ''\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError403'\n        '429':\n          $ref: '#/components/responses/429'\n  /content/v2/tag:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: false\n      x-category: content\n      security:\n        - HeaderApiKey: []\n      summary: Создание ярлыка\n      description: |\n        Метод добавляет один ярлык продавца. Можно создать максимум 15 ярлыков для одного продавца. Максимальная длина ярлыка — 15 символов.\n        <br>Созданный ярлык можно получить в общем [списке](/openapi/work-with-products#tag/labels/paths/~1content~1v2~1tags/get).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>Ярлыков</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Сервисный | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Базовый с секретом | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      tags:\n        - Ярлыки\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                color:\n                  description: |\n                    Цвет ярлыка.\n\n                    Доступные цвета:\n                      - `D1CFD7` — серый\n                      - `FEE0E0` — красный\n                      - `ECDAFF` — фиолетовый\n                      - `E4EAFF` — синий\n                      - `DEF1DD` — зеленый\n                      - `FFECC7` — желтый\n                  type: string\n                  example: D1CFD7\n                name:\n                  description: Имя ярлыка\n                  type: string\n                  example: Sale\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseContentError'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError400'\n              examples:\n                responseBodyContentError400:\n                  $ref: '#/components/examples/responseBodyContentError400'\n                responseBody400LenName:\n                  $ref: '#/components/examples/responseBody400LenName'\n                responseBodyLimitLabel:\n                  $ref: '#/components/examples/responseBodyLimitLabel'\n                responseBodyNameNotExist:\n                  $ref: '#/components/examples/responseBodyNameNotExist'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError403'\n        '429':\n          $ref: '#/components/responses/429'\n  /content/v2/tag/{id}:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    patch:\n      x-readonly-method: false\n      x-category: content\n      security:\n        - HeaderApiKey: []\n      summary: Изменение ярлыка\n      description: |\n        Метод заменяет данные ярлыка: имя и цвет.\n        <br>Новые данные можно получить в общем [списке](/openapi/work-with-products#tag/labels/paths/~1content~1v2~1tags/get).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>Ярлыков</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Сервисный | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Базовый с секретом | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      tags:\n        - Ярлыки\n      parameters:\n        - name: id\n          in: path\n          schema:\n            type: integer\n            example: 1\n          description: Числовой ID ярлыка\n          required: true\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                color:\n                  description: Цвет ярлыка\n                  type: string\n                  example: D1CFD7\n                name:\n                  description: Имя ярлыка\n                  type: string\n                  example: Sale\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseContentError'\n              examples:\n                responseNotFound200:\n                  $ref: '#/components/examples/responseNotFound200'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError400'\n              examples:\n                responseBodyContentError400:\n                  $ref: '#/components/examples/responseBodyContentError400'\n                responseBody400LenName:\n                  $ref: '#/components/examples/responseBody400LenName'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError403'\n        '429':\n          $ref: '#/components/responses/429'\n    delete:\n      x-readonly-method: false\n      x-category: content\n      security:\n        - HeaderApiKey: []\n      summary: Удаление ярлыка\n      description: |\n        Метод удаляет ярлык из [списка ярлыков](/openapi/work-with-products#tag/labels/paths/~1content~1v2~1tags/get) продавца.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>Ярлыков</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Сервисный | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Базовый с секретом | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      tags:\n        - Ярлыки\n      parameters:\n        - name: id\n          in: path\n          schema:\n            type: integer\n            example: 1\n          description: Числовой ID ярлыка\n          required: true\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseContentError'\n              examples:\n                responseNotFound200Del:\n                  $ref: '#/components/examples/responseNotFound200Del'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError400'\n              examples:\n                responseBodyContentError400:\n                  $ref: '#/components/examples/responseBodyContentError400'\n                responseBodyLabelNotExist:\n                  $ref: '#/components/examples/responseBodyLabelNotExist'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError403'\n        '429':\n          $ref: '#/components/responses/429'\n  /content/v2/tag/nomenclature/link:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: false\n      x-category: content\n      security:\n        - HeaderApiKey: []\n      summary: Управление ярлыками в карточке товара\n      description: |\n        Метод добавляет или снимает ярлык с карточки товара. К карточке можно добавить максимум 15 ярлыков.<br>\n        При удалении ярлыка из карточки товара он не удаляется из [списка ярлыков](/openapi/work-with-products#tag/labels/paths/~1content~1v2~1tags/get) продавца.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>Ярлыков</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Сервисный | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Базовый с секретом | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      tags:\n        - Ярлыки\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                nmID:\n                  description: Артикул WB\n                  type: integer\n                tagsIDs:\n                  description: |\n                    Массив числовых ID ярлыков.<br>\n                    Что бы снять ярлыки с карточки товара, необходимо передать пустой массив.<br>\n                    Чтобы добавить ярлыки к уже имеющимся в карточке товара, необходимо в запросе передать новые ярлыки и ярлыки, которые уже есть в карточке товара.\n                  type: array\n                  items:\n                    type: integer\n                    description: Числовой ID ярлыка.\n            example:\n              nmID: 179891389\n              tagsIDs:\n                - 123456\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseContentError'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseContentError'\n              examples:\n                IncorrectRequestNm:\n                  $ref: '#/components/examples/IncorrectRequestNm'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError403'\n        '429':\n          $ref: '#/components/responses/429'\n  /content/v2/get/cards/list:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: true\n      x-category: content\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Карточки товаров\n      summary: Список карточек товаров\n      description: |\n        Метод возвращает список созданных карточек товаров.\n\n        <div class=\"description_important\">\n          В ответе метода не будет карточек, находящихся в корзине. Получить такие карточки можно через <a href=\"/openapi/work-with-products#tag/listings/paths/~1content~1v2~1get~1cards~1trash/post\">отдельный метод</a>\n        </div>\n\n        Чтобы получить **больше 100** карточек товаров, используйте пагинацию:\n          1. Сделайте первый запрос: <br>\n              <pre style=\"background-color: rgb(38 50 56 / 5%); color: #e53935\">\n                {\n                  \"settings\": {\n                    \"sort\": {\n                      \"ascending\": true\n                    },\n                    \"cursor\": {\n                      \"limit\": 100\n                    },\n                    \"filter\": {\n                      \"withPhoto\": -1\n                    }\n                  }\n                }</pre>\n             Чтобы после выгрузки получать только новые или обновлённые карточки товаров, используйте сортировку по возрастанию: `\"sort\":{\"ascending\":true}`.\n          2. Скопируйте `\"updatedAt\":\"***\",\"nmID\":\"***\"` из `cursor` ответа и вставьте в `cursor` запроса.\n          3. Повторите запрос.\n          4. Повторяйте пункты 2 и 3, пока значение `total` в ответе не станет меньше, чем значение `limit` в запросе. Это будет означать, что вы получили все карточки.\n\n        Чтобы получать только карточки товаров, которые были созданы или обновлены после предыдущей выгрузки данных:\n          1. Сохраните поля `\"cursor\":{\"updatedAt\":\"***\",\"nmID\":\"***\"}` из последнего ответа предыдущей выгрузки. При выгрузке используйте сортировку по возрастанию: `\"sort\":{\"ascending\":true}`.\n          2. Укажите в первом запросе сохранённые поля `\"cursor\":{\"updatedAt\":\"***\",\"nmID\":\"***\"}`. Продолжайте использовать сортировку по возрастанию.\n          3. Сохраните поля `\"cursor\":{\"updatedAt\":\"***\",\"nmID\":\"***\"}` из последнего ответа текущей выгрузки.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        </div>\n      parameters:\n        - name: locale\n          in: query\n          schema:\n            type: string\n            example: ru\n          description: |\n            Язык полей ответа `name`, `value` и `object`:\n              - `ru` — русский\n              - `en` — английский\n              - `zh` — китайский\n\n            Не используется в песочнице. Данные песочницы возвращаются только на русском языке\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                settings:\n                  type: object\n                  description: Настройки\n                  properties:\n                    sort:\n                      description: Параметр сортировки\n                      type: object\n                      properties:\n                        ascending:\n                          type: boolean\n                          default: false\n                          description: |\n                            Сортировать по полю `updatedAt`:\n                              - `false` — по убыванию\n                              -  `true` — по возрастанию\n                    filter:\n                      description: Параметры фильтрации\n                      type: object\n                      properties:\n                        withPhoto:\n                          type: integer\n                          enum:\n                            - -1\n                            - 0\n                            - 1\n                            - 2\n                          description: \"Фильтр по\\_фото:\\n  * `-1`\\_— любые карточки товаров\\n  * `0`\\_— только карточки без фото. С [16 июня](/release-notes?id=531) — любые карточки товаров\\n  * `1`\\_— только карточки с\\_фото\\n  * `2` — только карточки без фото. С [16 июня](/release-notes?id=531)\\n\"\n                          default: 0\n                        textSearch:\n                          type: string\n                          description: Поиск по артикулу продавца, артикулу WB, баркоду\n                        tagIDs:\n                          type: array\n                          description: Поиск по ID ярлыков\n                          items:\n                            type: integer\n                        allowedCategoriesOnly:\n                          description: \"Фильтр по категории:\\n  - `true` — только разрешённые\\n  - `false` — все\\n\\n  Не\\_используется в\\_песочнице\\n\"\n                          type: boolean\n                        objectIDs:\n                          type: array\n                          description: Поиск по ID предметов\n                          items:\n                            type: integer\n                        brands:\n                          type: array\n                          description: Поиск по брендам\n                          items:\n                            type: string\n                        imtID:\n                          description: Поиск по [ID для объединённых карточек товаров](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov)\n                          type: integer\n                          format: int64\n                    cursor:\n                      description: |\n                        Курсор\n                      type: object\n                      properties:\n                        limit:\n                          type: integer\n                          maximum: 100\n                          default: 10\n                          description: Сколько карточек товаров выдать в ответе\n                        updatedAt:\n                          type: string\n                          nullable: true\n                          description: Дата и время изменения\n                        nmID:\n                          type: integer\n                          description: Артикул WB, с которого надо запрашивать следующий список карточек товаров\n            example:\n              settings:\n                sort:\n                  ascending: false\n                filter:\n                  textSearch: '4603743187500888'\n                  allowedCategoriesOnly: true\n                  tagIDs:\n                    - 345\n                    - 415\n                  objectIDs:\n                    - 235\n                    - 67\n                  brands:\n                    - уллу\n                    - EkkE\n                  imtID: 328632\n                  withPhoto: 0\n                cursor:\n                  updatedAt: '2023-12-06T11:17:00.96577Z'\n                  nmID: 370870300\n                  limit: 11\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  cards:\n                    type: array\n                    description: Список карточек товаров\n                    items:\n                      type: object\n                      properties:\n                        nmID:\n                          type: integer\n                          description: Артикул WB\n                        imtID:\n                          type: integer\n                          description: ID для [объединённых](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточек товаров.<br>Един для всех артикулов WB группы объединённых карточек.<br>У каждой карточки товара есть `imtID`, даже если она не объединена с другими карточками<br>\n                          format: int64\n                        nmUUID:\n                          type: string\n                          format: UUID\n                          description: Внутренний технический ID карточки товара\n                        subjectID:\n                          type: integer\n                          description: ID предмета\n                        subjectName:\n                          type: string\n                          description: Название предмета\n                        vendorCode:\n                          type: string\n                          description: Артикул продавца\n                        brand:\n                          type: string\n                          description: Бренд\n                        title:\n                          type: string\n                          description: Наименование товара\n                        description:\n                          type: string\n                          description: Описание товара\n                        needKiz:\n                          description: |\n                            Требуется ли код маркировки [Честного знака](https://честныйзнак.рф/) для этого товара:\n                              - `false` — не требуется\n                              - `true` — требуется\n                          type: boolean\n                        kizMarked:\n                          type: boolean\n                          default: false\n                          nullable: false\n                          description: |\n                            Есть ли подтверждение от продавца, что обязательный код маркировки [Честного знака](https://честныйзнак.рф/) нанесён на товар:\n                              - `true` — да\n                              - `false` — нет\n\n                            Является ли код маркировки [Честного знака](https://честныйзнак.рф/) обязательным, указано в поле `needKiz`\n                        photos:\n                          type: array\n                          description: Массив фото\n                          items:\n                            type: object\n                            properties:\n                              big:\n                                description: URL фото `900x1200`\n                                type: string\n                              c246x328:\n                                description: URL фото `248x328`\n                                type: string\n                              c516x688:\n                                description: URL фото `516x688`\n                                type: string\n                              square:\n                                description: URL фото `600x600`\n                                type: string\n                              tm:\n                                description: URL фото `75x100`\n                                type: string\n                        video:\n                          type: string\n                          description: URL видео\n                        wholesale:\n                          type: object\n                          description: Оптовая продажа\n                          properties:\n                            enabled:\n                              type: boolean\n                              description: Предназначена ли карточка товара для оптовой продажи\n                            quantum:\n                              type: number\n                              format: uint64\n                              description: Количество единиц товара в упаковке\n                        dimensions:\n                          description: Габариты и вес товара c упаковкой, см и кг\n                          type: object\n                          properties:\n                            length:\n                              type: integer\n                              description: Длина, см\n                            width:\n                              type: integer\n                              description: Ширина, см\n                            height:\n                              type: integer\n                              description: Высота, см\n                            weightBrutto:\n                              type: number\n                              description: Вес, кг<br>Количество знаков после запятой <=3\n                            isValid:\n                              type: boolean\n                              description: |\n                                Потенциальная некорректность габаритов товара:\n\n                                - `true` — не выявлена. `\"isValid\":true` не гарантирует, что размеры указаны корректно. В отдельных случаях (например, при создании новой категории товаров) `\"isValid\":true` будет возвращаться при любых значениях, кроме нулевых.\n\n                                - `false` — указанные габариты значительно отличаются от средних по категории (предмету). Рекомендуется перепроверить, правильно ли указаны размеры товара в упаковке в `сантиметрах`. Функциональность карточки товара, в том числе начисление логистики и хранения, при этом ограничена не будет. Логистика и хранение продолжают начисляться — по текущим габаритам. Также `\"isValid\":false` возвращается при отсутствии значений или нулевом значении любой стороны.\n                        characteristics:\n                          type: array\n                          description: Характеристики\n                          items:\n                            type: object\n                            properties:\n                              id:\n                                type: integer\n                                description: ID характеристики\n                              name:\n                                type: string\n                                description: Название характеристики\n                              value:\n                                description: Значение характеристики. Тип значения зависит от типа характеристики\n                        sizes:\n                          type: array\n                          description: Размеры товара\n                          items:\n                            type: object\n                            properties:\n                              chrtID:\n                                type: integer\n                                description: Числовой ID размера для данного артикула WB\n                              techSize:\n                                type: string\n                                description: Размер товара (А, XXL, 57 и др.)\n                              wbSize:\n                                type: string\n                                description: Российский размер товара\n                              skus:\n                                type: array\n                                description: Баркод товара\n                                items:\n                                  type: string\n                                  example: 12345Ejf5\n                        tags:\n                          description: Ярлыки\n                          type: array\n                          items:\n                            type: object\n                            properties:\n                              id:\n                                type: integer\n                                description: ID ярлыка\n                              name:\n                                type: string\n                                description: Название ярлыка\n                              color:\n                                type: string\n                                description: |\n                                  Цвет ярлыка. <br>\n                                  Доступные цвета:\n                                  - `D1CFD7` — серый\n                                  - `FEE0E0` — красный\n                                  - `ECDAFF` — фиолетовый\n                                  - `E4EAFF` — синий\n                                  - `DEF1DD` — зеленый\n                                  - `FFECC7` — желтый\n                        createdAt:\n                          type: string\n                          description: Дата и время создания\n                        updatedAt:\n                          type: string\n                          description: Дата и время изменения\n                  cursor:\n                    type: object\n                    description: Пагинатор\n                    properties:\n                      updatedAt:\n                        type: string\n                        description: Дата и время, с которых надо запрашивать следующий список карточек товаров\n                      nmID:\n                        type: integer\n                        description: Артикул WB, с которого надо запрашивать следующий список карточек товаров\n                      total:\n                        type: integer\n                        description: Количество возвращённых карточек товаров\n              example:\n                cards:\n                  - nmID: 12345678\n                    imtID: 123654789\n                    nmUUID: 01bda0b1-5c0b-736c-b2be-d0a6543e9be\n                    subjectID: 7771\n                    subjectName: AKF системы\n                    vendorCode: wb7f6mumjr1\n                    kizMarked: true\n                    brand: Тест\n                    title: Тест-система\n                    description: Тестовое описание\n                    needKiz: false\n                    photos:\n                      - big: https://basket-10.wbbasket.ru/vol1592/part159206/159206280/images/big/1.webp\n                        c246x328: https://basket-10.wbbasket.ru/vol1592/part159206/159206280/images/c246x328/1.webp\n                        c516x688: https://basket-10.wbbasket.ru/vol1592/part159206/159206280/images/c516x688/1.webp\n                        square: https://basket-10.wbbasket.ru/vol1592/part159206/159206280/images/square/1.webp\n                        tm: https://basket-10.wbbasket.ru/vol1592/part159206/159206280/images/tm/1.webp\n                    video: https://videonme-basket-12.wbbasket.ru/vol137/part22557/225577433/hls/1440p/index.m3u8\n                    wholesale:\n                      enabled: true\n                      quantum: 112\n                    dimensions:\n                      length: 55\n                      width: 40\n                      height: 15\n                      weightBrutto: 6.24\n                      isValid: false\n                    characteristics:\n                      - id: 14177449\n                        name: Цвет\n                        value:\n                          - красно-сиреневый\n                    sizes:\n                      - chrtID: 316399238\n                        techSize: '0'\n                        skus:\n                          - '987456321654'\n                    tags:\n                      - id: 592569\n                        name: Популярный\n                        color: D1CFD7\n                    createdAt: '2023-12-06T11:17:00.96577Z'\n                    updatedAt: '2023-12-06T11:17:00.96577Z'\n                cursor:\n                  updatedAt: '2023-12-06T11:17:00.96577Z'\n                  nmID: 123654123\n                  total: 1\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError400'\n            plain/text:\n              example: Request body can not be decoded\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError403'\n        '429':\n          $ref: '#/components/responses/429'\n  /content/v2/cards/error/list:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: true\n      x-category: content\n      security:\n        - HeaderApiKey: []\n      summary: Список несозданных карточек товаров с ошибками\n      description: |\n        Метод возвращает список карточек товаров ([черновиков](https://seller.wildberries.ru/new-goods/error-cards)), при создании или редактировании которых произошли ошибки, с описанием этих ошибок.\n        <br><br>\n        Данные в ответе возвращаются пакетами `batch`. Один пакет содержит:\n          - все ошибки по одному массиву `variants` одного запроса при [создании](/openapi/work-with-products#tag/listingItems/paths/~1content~1v2~1cards~1upload/post) карточек товаров\n          - все ошибки одного запроса при [создании с присоединением](/openapi/work-with-products#tag/listingItems/paths/~1content~1v2~1cards~1upload~1add/post) или [редактировании](/openapi/work-with-products#tag/listings/paths/~1content~1v2~1cards~1update/post) карточек товаров\n        <br><br>\n        Чтобы получить более 100 пакетов, используйте пагинацию:\n          1. Сделайте первый запрос: <br>\n              <pre style=\"background-color: rgb(38 50 56 / 5%); color: #e53935\">\n                {\n                  \"cursor\": {\n                    \"limit\": 100\n                  },\n                  \"order\": {\n                    \"ascending\": true\n                  }\n                }</pre>\n          2. Скопируйте `\"updatedAt\":\"***\",\"batchUUID\":\"***\" `из `cursor` ответа и вставьте в `cursor` запроса.\n          3. Повторите запрос.\n          4. Повторяйте пункты 2 и 3, пока не получите в ответе `\"next\":false`. Это будет означать, что вы получили все пакеты.\n\n        <div class=\"description_important\">\n          Чтобы удалить карточку товара из списка, сделайте ещё один запрос на создание, создание с присоединением или редактирование карточки товара с исправленными ошибками\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов:\n\n        <ul>\n            <li><a href=\"/openapi/work-with-products#tag/listingItems/paths/~1content~1v2~1cards~1limits/get\">получения лимитов карточек товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/listings/paths/~1content~1v2~1cards~1error~1list/post\">получения несозданных карточек товаров с ошибками</a></li>\n        </ul>\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 10 запросов | 6 сек | 5 запросов |\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      tags:\n        - Карточки товаров\n      parameters:\n        - name: locale\n          in: query\n          schema:\n            type: string\n            example: en\n          description: |\n            Язык названий предметов:\n              - `ru` — русский\n              - `en` — английский\n              - `zh` — китайский\n\n            Не используется в песочнице\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/requestPublicViewerPublicErrorsTableListV2'\n            example:\n              cursor:\n                limit: 31\n                updatedAt: '2025-08-05T17:54:40+08:00'\n                batchUUID: bca3744c-1c8b-4588-b345-62af3b2899ae\n              order:\n                ascending: true\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responsePublicViewerPublicErrorsTableListV2'\n              example:\n                data:\n                  items:\n                    - batchUUID: b15fecaf-57fd-4b63-ab6f-18d630b8793e\n                      subjects:\n                        wb15j2kjk9:\n                          id: 8827\n                          name: Автомобили с пробегом\n                        wb3g6advyh:\n                          id: 8827\n                          name: Автомобили с пробегом\n                        wb3g7xx8g9:\n                          id: 8827\n                          name: Автомобили с пробегом\n                        wb4uphjn61:\n                          id: 8827\n                          name: Автомобили с пробегом\n                        wb64nayozt:\n                          id: 8827\n                          name: Автомобили с пробегом\n                      brands: {}\n                      vendorCodes:\n                        - wb64nayozt\n                        - wb15j2kjk9\n                        - wb3g7xx8g9\n                        - wb3g6advyh\n                        - wb4uphjn61\n                      errors:\n                        wb15j2kjk9:\n                          - 'Поле Наименование не должно содержать запрещенные символы: 😈 😊 🤨'\n                        wb3g6advyh:\n                          - 'Поле Наименование не должно содержать запрещенные символы: 😊 🤨 😈'\n                        wb3g7xx8g9:\n                          - 'Поле Наименование не должно содержать запрещенные символы: 🤯'\n                        wb4uphjn61:\n                          - 'Поле Наименование не должно содержать запрещенные символы: 😊 🤨 😈'\n                        wb64nayozt:\n                          - 'Поле Наименование не должно содержать запрещенные символы: 😈 😊 🤨'\n                      updatedAt: '2025-12-19T23:59:59Z'\n                    - batchUUID: 30aa42ec-fb49-45ec-86d5-ddf9911e7e3f\n                      subjects:\n                        test_pasha1:\n                          id: 184\n                          name: Рубашки\n                      brands: {}\n                      vendorCodes:\n                        - test_pasha1\n                      errors:\n                        test_pasha1:\n                          - Запрещено использовать E-Mail в поле Наименование\n                          - Запрещено использовать E-Mail в поле Описание\n                      updatedAt: '2025-12-20T23:59:59Z'\n                  cursor:\n                    next: true\n                    updatedAt: '2025-12-20T23:59:59Z'\n                    batchUUID: 1cd79751-de1f-46c8-a444-a941d35dde56\n                error: false\n                errorText: ''\n                additionalErrors: null\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError400'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError403'\n        '429':\n          $ref: '#/components/responses/429'\n  /content/v2/cards/update:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: false\n      x-category: content\n      tags:\n        - Карточки товаров\n      summary: Редактирование карточек товаров\n      description: |\n        Метод обновляет данные карточек товаров. Также используйте его, чтобы добавлять новые размеры.\n\n        <div class=\"description_important\">\n          Карточка товара перезаписывается при обновлении. Поэтому в запросе нужно передать в том числе те параметры карточки, которые вы не собираетесь обновлять. Их значения можно получить в <a href=\"/openapi/work-with-products#tag/listings/paths/~1content~1v2~1get~1cards~1list/post\">списке карточек товаров</a> и <a href=\"/openapi/work-with-products#tag/listings/paths/~1content~1v2~1get~1cards~1trash/post\">списке карточек товаров в корзине</a>.\n        </div>\n\n        С помощью этого метода нельзя обновлять или удалять:\n          - баркоды размеров товара. Можно только добавить дополнительные баркоды\n          - параметры `photos`, `video` и `tags`\n          - цены товаров. Цену можно задать, только если вы добавляете новые размеры\n\n        При добавлении нового размера укажите его цену через параметр `price`. Если в запросе не указан `price`, цена размера будет `0` — в этом случае изменить её можно будет с помощью методов:\n          - [Установить цены и скидки](/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1upload~1task/post), если у [товара](/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1filter/get) `\"editablePriceSize\":false`\n          - [Установить цены для размеров](/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1upload~1task~1size/post), если у [товара](/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1filter/get) `\"editablePriceSize\":true`\n\n        Габариты товаров можно указать только в `сантиметрах`, вес товара с упаковкой — в `килограммах`.\n        <br><br>\n        Одним запросом можно отредактировать максимум 3000 карточек товаров (`nmID`). Максимальный размер запроса 10 Мб.<br>\n        Если ответ `Успешно` (`200`), но какие-то карточки не обновились, проверьте [список несозданных карточек товаров](/openapi/work-with-products#tag/listings/paths/~1content~1v2~1cards~1error~1list/post).<br>\n        Синхронизация данных с сервисами может занимать до 30 минут. В течение этого времени невозможно добавить остатки на склады и настроить цены. <br>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 10 запросов | 6 сек | 5 запросов |\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: array\n              items:\n                type: object\n                required:\n                  - nmID\n                  - vendorCode\n                  - sizes\n                minimum: 1\n                maximum: 3000\n                properties:\n                  nmID:\n                    type: integer\n                    description: Артикул WB\n                  vendorCode:\n                    type: string\n                    description: Артикул продавца\n                  kizMarked:\n                    type: boolean\n                    default: false\n                    description: |\n                      Подтверждение, что на товар нанесён обязательный код маркировки [Честного знака](https://честныйзнак.рф/):\n                        - `true` — продавец подтверждает, что на товар нанесён обязательный код маркировки.\n                        - `false` — продавец подтверждает, что на товар нанесён обязательный код маркировки. Передайте в запросе `true`, чтобы подтвердить наличие на товаре обязательного кода маркировки. Карточка товара не пройдёт модерацию, если нет подтверждения продавца о том, что обязательный код маркировки нанесён на товар.\n\n                      Чтобы проверить, является ли код маркировки [Честного знака](https://честныйзнак.рф/) обязательным, используйте метод [Список карточек товаров](./work-with-products#tag/listings/paths/~1content~1v2~1get~1cards~1list/post), поле ответа `needKiz`\n                  brand:\n                    type: string\n                    description: Бренд\n                  title:\n                    type: string\n                    description: Наименование товара\n                    maxLength: 60\n                  description:\n                    type: string\n                    description: |\n                      Описание товара.<br>\n                      Максимальное количество символов зависит от категории товара<br>\n                      Стандарт — 2000, минимум — 1000, максимум — 5000<br>\n                      Подробно о **правилах заполнения карточки товара** в [Справочном центре](https://seller.wildberries.ru/instructions/ru/ru/material/how-to-create-card) на портале продавцов\n                  dimensions:\n                    description: |\n                      Габариты и вес товара **c упаковкой**.<br>\n                      Укажите в `сантиметрах` и `килограммах` для любого товара.<br>\n                      Синхронизация новых данных с сервисом может занимать до 30 минут\n                    type: object\n                    properties:\n                      length:\n                        type: integer\n                        description: Длина, см\n                      width:\n                        type: integer\n                        description: Ширина, см\n                      height:\n                        type: integer\n                        description: Высота, см\n                      weightBrutto:\n                        type: number\n                        description: Вес, кг<br>Количество знаков после запятой <=3\n                  characteristics:\n                    type: array\n                    description: |\n                      Характеристики товара.\n                      <br>\n                      Можно получить методом [Характеристики предмета](./work-with-products#tag/categoriesSubcategoriesAndCharacteristics/paths/~1content~1v2~1object~1charcs~1%7BsubjectId%7D/get)\n                    items:\n                      type: object\n                      required:\n                        - id\n                        - value\n                      properties:\n                        id:\n                          type: integer\n                          description: ID характеристики\n                        value:\n                          description: |\n                            Значения характеристики.\n                            <br>\n                            Тип данных — массив строк или число — зависит от типа характеристики, см. описание поля `charcType` в методе [Характеристики предмета](./work-with-products#tag/categoriesSubcategoriesAndCharacteristics/paths/~1content~1v2~1object~1charcs~1%7BsubjectId%7D/get).\n                            <br>\n                            Допустимое количество значений отображено в поле `maxCount` того же метода\n                  sizes:\n                    type: array\n                    description: |\n                      Массив размеров<br>\n                      Для безразмерного товара всё равно нужно передавать данный массив без параметров (wbSize и techSize), но с баркодом\n                    items:\n                      type: object\n                      properties:\n                        chrtID:\n                          type: integer\n                          description: |\n                            ID размера для данного артикула WB<br>\n                            Обязателен к заполнению для существующих размеров<br>\n                            Для добавляемых размеров не указывается\n                        techSize:\n                          type: string\n                          description: Размер товара (например, XL, S, 45)\n                        wbSize:\n                          type: string\n                          description: Российский размер товара\n                        price:\n                          type: integer\n                          description: |\n                            Цена товара, ₽<br>\n                            Указывается при добавлении размера\n                        skus:\n                          type: array\n                          items:\n                            type: string\n                          description: Баркоды\n              example:\n                - nmID: 11111111\n                  vendorCode: wbiz72wmro\n                  kizMarked: true\n                  brand: ''\n                  title: Свитер женский оверсайз с горлом\n                  description: '12345'\n                  dimensions:\n                    length: 35\n                    width: 40\n                    height: 15\n                    weightBrutto: 3\n                  characteristics:\n                    - id: 14177450\n                      value:\n                        - хлопок 50% акрил 50%\n                    - id: 50\n                      value:\n                        - свободный крой\n                  sizes:\n                    - chrtID: 12345678\n                      techSize: ONE SIZE\n                      wbSize: 78-90\n                      skus:\n                        - '123487653460134'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseItemList'\n              example:\n                data: null\n                error: false\n                errorText: ''\n                additionalErrors: {}\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError400'\n              examples:\n                MissingRequiredCharacteristics:\n                  $ref: '#/components/examples/MissingRequiredCharacteristics'\n                NonUniqueCharacteristicsInOneGroupAdd:\n                  $ref: '#/components/examples/NonUniqueCharacteristicsInOneGroupAdd'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError403'\n        '413':\n          description: Превышен лимит объёма данных в запросе\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  title:\n                    type: string\n                    description: Заголовок ошибки\n                  detail:\n                    type: string\n                    description: Детали ошибки\n                  code:\n                    type: string\n                    description: Внутренний код ошибки\n                  requestId:\n                    type: string\n                    description: Уникальный ID запроса\n                  origin:\n                    type: string\n                    description: ID внутреннего сервиса WB\n                  status:\n                    type: number\n                    description: HTTP статус-код\n                  statusText:\n                    type: string\n                    description: Расшифровка HTTP статус-кода\n              example:\n                title: request body too long\n                detail: https://openapi.wildberries.ru/content/api/ru/\n                code: 71d3de1b-001e-488f-bbf5-55c31254fbeb\n                requestId: MN8usr6RfrzWHZfucSvNgb\n                origin: s2s-api-auth-content\n                status: 413\n                statusText: Request Entity Too Large\n        '429':\n          $ref: '#/components/responses/429'\n  /content/v2/cards/moveNm:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: false\n      x-category: content\n      tags:\n        - Карточки товаров\n      summary: Объединение и разъединение карточек товаров\n      description: |\n        Метод [объединяет и разъединяет](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточки товаров. Карточки товаров являются объединёнными, если у них одинаковый `imtID`.\n        <br><br>\n        Для объединения карточек товаров сделайте запрос **с указанием** `imtID`. Можно объединять не более 30 карточек товаров.<br>\n        Для разъединения карточек товаров сделайте запрос **без указания** `imtID`. Для разъединенных карточек будут сгенерированы новые `imtID`.\n        <br><br>\n        Если вы разъедините одновременно несколько карточек товаров, эти карточки объединятся в одну и получат новый `imtID`.<br>\n        Чтобы присвоить каждой карточке товара уникальный `imtID`, необходимо передавать по одной карточке товара за запрос.<br>\n        <br>\n        Максимальный размер запроса 10 Мб.\n\n        <div class=\"description_important\">\n          Объединить можно карточки товаров только в рамках одного предмета\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Контент</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 100 запросов | 600 мс | 5 запросов |\n\n        Исключение — методы:\n\n        <ul>\n            <li><a href=\"/openapi/work-with-products#tag/listingItems/paths/~1content~1v2~1cards~1upload/post\">создания карточек товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/listingItems/paths/~1content~1v2~1cards~1upload~1add/post\">создания карточек товаров с присоединением</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/listings/paths/~1content~1v2~1cards~1update/post\">редактирования карточек товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/listings/paths/~1content~1v2~1cards~1recover/post\">восстановления карточек товаров из корзины</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/recommendations/operation/postV1RecommendationsList\">получения списка рекомендаций в карточках товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/recommendations/operation/postV1RecommendationsSet\">установки рекомендаций для товаров</a></li>\n        </ul>\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              oneOf:\n                - $ref: '#/components/schemas/requestMoveNmsImtConn'\n                - $ref: '#/components/schemas/requestMoveNmsImtDisconn'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseItemList'\n              example:\n                data: null\n                error: false\n                errorText: ''\n                additionalErrors: {}\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                oneOf:\n                  - $ref: '#/components/schemas/responseItemList'\n                  - $ref: '#/components/schemas/responseIncorrectDate'\n              examples:\n                responseExceededLimit:\n                  $ref: '#/components/examples/responseExceededLimit'\n                responseCombining:\n                  $ref: '#/components/examples/responseCombining'\n                responseIncorrectRequestFormat:\n                  $ref: '#/components/examples/responseIncorrectRequestFormat'\n                responseNonExistentNmId:\n                  $ref: '#/components/examples/responseNonExistentNmId'\n                responseNonExistentImt:\n                  $ref: '#/components/examples/responseNonExistentImt'\n                responseItemList1:\n                  $ref: '#/components/examples/responseItemList1'\n                responseDuplicateRequests:\n                  $ref: '#/components/examples/responseDuplicateRequests'\n                responseAllListingsInSameGroup:\n                  $ref: '#/components/examples/responseAllListingsInSameGroup'\n                responseIncorrectBeginDate:\n                  $ref: '#/components/examples/responseIncorrectBeginDate'\n                responseIncorrectEndDate:\n                  $ref: '#/components/examples/responseIncorrectEndDate'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseItemList'\n        '413':\n          description: Превышен лимит объёма данных в запросе\n          content:\n            application/json:\n              schema:\n                type: string\n              examples:\n                BodySizeExceedsTheGivenLimit:\n                  $ref: '#/components/examples/BodySizeExceedsTheGivenLimit'\n        '429':\n          $ref: '#/components/responses/429'\n  /content/v2/cards/delete/trash:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: false\n      x-category: content\n      security:\n        - HeaderApiKey: []\n      summary: Перенос карточек товаров в корзину\n      description: |\n        Метод переносит [карточки товаров в корзину](/openapi/work-with-products#tag/listings/paths/~1content~1v2~1get~1cards~1trash/post). При этом карточки товаров не удаляются, их можно [восстановить](/openapi/work-with-products#tag/listings/paths/~1content~1v2~1cards~1recover/post).\n\n        <div class=\"description_important\">\n          После переноса в корзину карточке товара присваивается новый <code>imtID</code> — ID для <a href=\"/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov\">объединённых</a> карточек товаров\n        </div>\n\n        Карточки товаров удаляются автоматически, если лежат в корзине больше 30 дней, и на них нет остатков. Очистка корзины происходит каждую ночь по московскому времени.<br>\n        Карточки товаров можно удалить в любое время в [личном кабинете](https://seller.wildberries.ru/new-goods/basket-cards).\n        <br><br>\n        Карточка будет продаваться, пока по ней есть остатки на складе, даже если её переместили в корзину. Чтобы полностью снять карточку с продажи, обнулите остатки.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Сервисный | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Базовый с секретом | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n        </div>\n      tags:\n        - Карточки товаров\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                nmIDs:\n                  description: Артикулы WB\n                  minimum: 1\n                  maximum: 1000\n                  type: array\n                  items:\n                    type: integer\n            example:\n              nmIDs:\n                - 123456789\n                - 987654321\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    type: object\n                    nullable: true\n                  error:\n                    description: Флаг ошибки\n                    type: boolean\n                  errorText:\n                    description: Описание ошибки\n                    type: string\n                  additionalErrors:\n                    nullable: true\n                    description: Дополнительные ошибки\n                    type: object\n              example:\n                data: null\n                error: false\n                errorText: ''\n                additionalErrors: {}\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError400'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError403'\n        '429':\n          $ref: '#/components/responses/429'\n  /content/v2/cards/recover:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: false\n      x-category: content\n      security:\n        - HeaderApiKey: []\n      summary: Восстановление карточек товаров из корзины\n      description: |\n        Метод восстанавливает [карточки товаров из корзины](/openapi/work-with-products#tag/listings/paths/~1content~1v2~1get~1cards~1trash/post).\n\n        <div class=\"description_important\">\n          Карточка товара сохраняет тот же <code>imtID</code> — ID для <a href=\"/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov\">объединённых</a> карточек товаров — что был присвоен ей при <a href=\"/openapi/work-with-products#tag/listings/paths/~1content~1v2~1cards~1delete~1trash/post\">перемещении в корзину</a>\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 3 запроса | 20 сек | 5 запросов |\n        | Сервисный | 1 мин | 3 запроса | 20 сек | 5 запросов |\n        | Базовый с секретом | 1 мин | 3 запроса | 20 сек | 5 запросов |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n        </div>\n      tags:\n        - Карточки товаров\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                nmIDs:\n                  description: Артикулы WB\n                  type: array\n                  minimum: 1\n                  maximum: 1000\n                  items:\n                    type: integer\n            example:\n              nmIDs:\n                - 123456789\n                - 987654321\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    type: object\n                    nullable: true\n                  error:\n                    description: Флаг ошибки\n                    type: boolean\n                  errorText:\n                    description: Описание ошибки\n                    type: string\n                  additionalErrors:\n                    nullable: true\n                    description: Дополнительные ошибки\n                    type: object\n              example:\n                data: null\n                error: false\n                errorText: ''\n                additionalErrors: {}\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError400'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError403'\n        '429':\n          $ref: '#/components/responses/429'\n  /content/v2/get/cards/trash:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: true\n      x-category: content\n      security:\n        - HeaderApiKey: []\n      summary: Список карточек товаров в корзине\n      description: |\n        Метод возвращает список карточек товаров в корзине.<br><br>\n\n        Чтобы получить **больше 100** карточек товаров, используйте пагинацию.\n          1. Сделайте первый запрос: <br>\n              <pre style=\"background-color: rgb(38 50 56 / 5%); color: #e53935\">\n                {\n                  \"settings\": {\n                    \"sort\": {\n                      \"ascending\": true\n                    },\n                    \"cursor\": {\n                      \"limit\": 100\n                    }\n                  }\n                }</pre>\n             Чтобы получать только карточки товаров, которые были перенесены в корзину после выгрузки, используйте сортировку по возрастанию: `\"sort\":{\"ascending\":true}`.\n          2. Скопируйте `\"trashedAt\":\"***\",\"nmID\":***` из `cursor` ответа и вставьте в `cursor` запроса.\n          3. Повторите запрос.\n          4. Повторяйте пункты 2 и 3, пока значение `total` в ответе не станет меньше, чем значение `limit` в запросе. Это будет означать, что вы получили все карточки.\n\n        Чтобы получать только карточки товаров, которые были перенесены в корзину после предыдущей выгрузки данных:\n          1. Сохраните поля `\"cursor\":{\"trashedAt\":\"***\",\"nmID\":***}` из последнего ответа предыдущей выгрузки. При выгрузке используйте сортировку по возрастанию: `\"sort\":{\"ascending\":true}`.\n          2. Укажите в первом запросе сохранённые поля `\"cursor\":{\"trashedAt\":\"***\",\"nmID\":\"***\"}`. Продолжайте использовать сортировку по возрастанию.\n          3. Сохраните поля `\"cursor\":{\"trashedAt\":\"***\",\"nmID\":***}` из последнего ответа текущей выгрузки.\n\n          <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Контент</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 100 запросов | 600 мс | 5 запросов |\n\n        Исключение — методы:\n\n        <ul>\n            <li><a href=\"/openapi/work-with-products#tag/listingItems/paths/~1content~1v2~1cards~1upload/post\">создания карточек товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/listingItems/paths/~1content~1v2~1cards~1upload~1add/post\">создания карточек товаров с присоединением</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/listings/paths/~1content~1v2~1cards~1update/post\">редактирования карточек товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/listings/paths/~1content~1v2~1cards~1recover/post\">восстановления карточек товаров из корзины</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/recommendations/operation/postV1RecommendationsList\">получения списка рекомендаций в карточках товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/recommendations/operation/postV1RecommendationsSet\">установки рекомендаций для товаров</a></li>\n        </ul>\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      tags:\n        - Карточки товаров\n      parameters:\n        - name: locale\n          in: query\n          schema:\n            type: string\n            enum:\n              - ru\n              - en\n              - zh\n          description: |\n            Язык полей ответа `name`, `value` и `object`:\n              - `ru` — русский\n              - `en` — английский\n              - `zh` — китайский\n\n            Не используется в песочнице. Данные песочницы возвращаются только на русском языке\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                settings:\n                  type: object\n                  description: Настройки\n                  properties:\n                    sort:\n                      description: Параметр сортировки\n                      type: object\n                      properties:\n                        ascending:\n                          type: boolean\n                          default: false\n                          description: |\n                            Сортировать по `trashedAt`:\n                              - `false` — по убыванию\n                              - `true` — по возрастанию\n                    cursor:\n                      description: Пагинатор\n                      type: object\n                      properties:\n                        limit:\n                          type: integer\n                          maximum: 100\n                          default: 10\n                          description: Сколько карточек товаров выдать в ответе\n                        trashedAt:\n                          type: string\n                          description: Дата и время помещения в корзину\n                        nmID:\n                          type: integer\n                          description: Артикул WB, с которого надо запрашивать следующий список карточек товаров\n                    filter:\n                      description: Параметры фильтрации\n                      type: object\n                      properties:\n                        textSearch:\n                          type: string\n                          description: Поиск по артикулу продавца, артикулу WB, баркоду\n            example:\n              settings:\n                sort:\n                  ascending: false\n                filter:\n                  textSearch: '4603743187500888'\n                cursor:\n                  trashedAt: '2023-12-06T11:17:00.96577Z'\n                  nmID: 370870300\n                  limit: 11\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  cards:\n                    description: Массив карточек товаров\n                    type: array\n                    items:\n                      type: object\n                      properties:\n                        nmID:\n                          type: integer\n                          description: Артикул WB\n                        vendorCode:\n                          type: string\n                          description: Артикул продавца\n                        kizMarked:\n                          type: boolean\n                          default: false\n                          nullable: false\n                          description: |\n                            Есть ли подтверждение от продавца, что обязательный код маркировки [Честного знака](https://честныйзнак.рф/) нанесён на товар:\n                              - `true` — да\n                              - `false` — нет\n\n                            Чтобы проверить, является ли код маркировки [Честного знака](https://честныйзнак.рф/) обязательным, используйте метод [Список карточек товаров](./work-with-products#tag/listings/paths/~1content~1v2~1get~1cards~1list/post), поле ответа `needKiz`\n                        subjectID:\n                          type: integer\n                          description: ID предмета\n                        subjectName:\n                          type: string\n                          description: Название предмета\n                        photos:\n                          type: array\n                          description: Массив фото\n                          items:\n                            type: object\n                            properties:\n                              big:\n                                description: URL фото `900x1200`\n                                type: string\n                              c246x328:\n                                description: URL фото `248x328`\n                                type: string\n                              c516x688:\n                                description: URL фото `516x688`\n                                type: string\n                              square:\n                                description: URL фото `600x600`\n                                type: string\n                              tm:\n                                description: URL фото `75x100`\n                                type: string\n                        video:\n                          type: string\n                          description: URL видео\n                        wholesale:\n                          type: object\n                          description: Оптовая продажа\n                          properties:\n                            enabled:\n                              type: boolean\n                              description: Предназначена ли карточка товара для оптовой продажи\n                            quantum:\n                              type: number\n                              format: uint64\n                              description: Количество единиц товара в упаковке\n                        sizes:\n                          type: array\n                          description: Массив размеров\n                          items:\n                            type: object\n                            properties:\n                              chrtID:\n                                type: integer\n                                description: ID размера\n                              techSize:\n                                type: string\n                                description: Размер товара\n                              wbSize:\n                                type: string\n                                description: Российский размер товара\n                              skus:\n                                type: array\n                                description: Массив баркодов\n                                items:\n                                  type: string\n                                  example: 12345Ejf5\n                        dimensions:\n                          type: object\n                          description: Габариты и вес товара c упаковкой, см и кг\n                          properties:\n                            length:\n                              type: integer\n                              description: Длина, см\n                            width:\n                              type: integer\n                              description: Ширина, см\n                            height:\n                              type: integer\n                              description: Высота, см\n                            weightBrutto:\n                              type: number\n                              description: Вес, кг<br>Количество знаков после запятой <=3\n                            isValid:\n                              type: boolean\n                              description: |\n                                Потенциальная некорректность габаритов товара:\n\n                                - `true` — не выявлена. `\"isValid\":true` не гарантирует, что размеры указаны корректно. В отдельных случаях (например, при создании новой категории товаров) `\"isValid\":true` будет возвращаться при любых значениях, кроме нулевых.\n\n                                - `false` — указанные габариты значительно отличаются от средних по категории (предмету). Рекомендуется перепроверить, правильно ли указаны размеры товара в упаковке в `сантиметрах`. Функциональность карточки товара, в том числе начисление логистики и хранения, при этом ограничена не будет. Логистика и хранение продолжают начисляться — по текущим габаритам. Также `\"isValid\":false` возвращается при отсутствии значений или нулевом значении любой стороны.\n                        characteristics:\n                          nullable: true\n                          type: array\n                          description: Характеристики\n                          items:\n                            type: object\n                            properties:\n                              id:\n                                type: integer\n                                description: ID характеристики\n                              name:\n                                type: string\n                                description: Название характеристики\n                              value:\n                                description: Значение характеристики. Тип значения зависит от типа характеристики\n                        createdAt:\n                          type: string\n                          description: Date and time the item was listed\n                        trashedAt:\n                          type: string\n                          description: Дата и время помещения в корзину\n                  cursor:\n                    type: object\n                    description: Пагинатор\n                    properties:\n                      trashedAt:\n                        type: string\n                        description: Дата и время, с которых надо запрашивать следующий список карточек товаров\n                      nmID:\n                        type: integer\n                        description: Артикул WB, с которого надо запрашивать следующий список карточек товаров\n                      total:\n                        type: integer\n                        description: Количество возвращённых карточек товаров\n              example:\n                cards:\n                  - nmID: 1234567\n                    vendorCode: wb5xsy5ftj\n                    kizMarked: true\n                    subjectID: 1436\n                    subjectName: Ведра хозяйственные\n                    photos:\n                      - big: https://basket-10.wbbasket.ru/vol1592/part159206/159206280/images/big/1.webp\n                        c246x328: https://basket-10.wbbasket.ru/vol1592/part159206/159206280/images/c246x328/1.webp\n                        c516x688: https://basket-10.wbbasket.ru/vol1592/part159206/159206280/images/c516x688/1.webp\n                        square: https://basket-10.wbbasket.ru/vol1592/part159206/159206280/images/square/1.webp\n                        tm: https://basket-10.wbbasket.ru/vol1592/part159206/159206280/images/tm/1.webp\n                    video: https://videonme-basket-12.wbbasket.ru/vol137/part22557/225577433/hls/1440p/index.m3u8\n                    wholesale:\n                      enabled: true\n                      quantum: 114\n                    sizes:\n                      - chrtID: 111111111\n                        techSize: '0'\n                        skus:\n                          - xxxxxxxxxxxx\n                    dimensions:\n                      length: 35\n                      width: 40\n                      height: 15\n                      weightBrutto: 2.9\n                      isValid: false\n                    createdAt: '2023-12-05T14:55:09.323462Z'\n                    trashedAt: '2023-12-06T10:57:42.193028Z'\n                cursor:\n                  trashedAt: '2023-12-06T10:57:42.193028Z'\n                  nmID: 194128521\n                  total: 1\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError400'\n            plain/text:\n              example: Request body can not be decoded\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError403'\n        '429':\n          $ref: '#/components/responses/429'\n  /content/v2/cards/limits:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: content\n      security:\n        - HeaderApiKey: []\n      summary: Лимиты карточек товаров\n      description: |\n        Возвращает бесплатные и платные лимиты продавца на [создание карточек товаров](/openapi/work-with-products#tag/listingItems/paths/~1content~1v2~1cards~1upload/post).<br><br>\n\n        Формула для получения количества карточек, которые можно создать:\n\n        > (`freeLimits` + `paidLimits`) - количество созданных карточек\n\n        Созданными считаются карточки, которые можно получить через методы [список карточек товаров](/openapi/work-with-products#tag/listings/paths/~1content~1v2~1get~1cards~1list/post) и [список карточек товаров в корзине](/openapi/work-with-products#tag/listings/paths/~1content~1v2~1get~1cards~1trash/post).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов:\n\n        <ul>\n            <li><a href=\"/openapi/work-with-products#tag/listingItems/paths/~1content~1v2~1cards~1limits/get\">получения лимитов карточек товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/listings/paths/~1content~1v2~1cards~1error~1list/post\">получения несозданных карточек товаров с ошибками</a></li>\n        </ul>\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Сервисный | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Базовый с секретом | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      tags:\n        - Создание карточек товаров\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    type: object\n                    properties:\n                      freeLimits:\n                        description: Количество бесплатных лимитов\n                        type: integer\n                      paidLimits:\n                        description: Количество оплаченных лимитов\n                        type: integer\n                  error:\n                    description: Флаг ошибки\n                    type: boolean\n                  errorText:\n                    description: Описание ошибки\n                    type: string\n                  additionalErrors:\n                    description: Дополнительные ошибки\n                    type: string\n                    nullable: true\n              example:\n                data:\n                  freeLimits: 1500\n                  paidLimits: 10\n                error: false\n                errorText: ''\n                additionalErrors: null\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError403'\n        '429':\n          $ref: '#/components/responses/429'\n  /content/v2/barcodes:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: false\n      x-category: content\n      security:\n        - HeaderApiKey: []\n      summary: Генерация баркодов\n      description: |\n        Метод генерирует массив уникальных баркодов для создания размера в [карточке товара](/openapi/work-with-products#tag/listingItems/paths/~1content~1v2~1cards~1upload/post). Можно использовать, если у вас нет собственных баркодов.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Контент</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 100 запросов | 600 мс | 5 запросов |\n\n        Исключение — методы:\n\n        <ul>\n            <li><a href=\"/openapi/work-with-products#tag/listingItems/paths/~1content~1v2~1cards~1upload/post\">создания карточек товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/listingItems/paths/~1content~1v2~1cards~1upload~1add/post\">создания карточек товаров с присоединением</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/listings/paths/~1content~1v2~1cards~1update/post\">редактирования карточек товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/listings/paths/~1content~1v2~1cards~1recover/post\">восстановления карточек товаров из корзины</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/recommendations/operation/postV1RecommendationsList\">получения списка рекомендаций в карточках товаров</a></li>\n            <li><a href=\"/openapi/work-with-products#tag/recommendations/operation/postV1RecommendationsSet\">установки рекомендаций для товаров</a></li>\n        </ul>\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      tags:\n        - Создание карточек товаров\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                count:\n                  description: Кол-во баркодов которые надо сгенерировать, максимальное доступное количество баркодов для генерации - `5 000`\n                  type: integer\n                  example: 100\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    description: Массив сгенерированных баркодов\n                    type: array\n                    items:\n                      type: string\n                      example: '5032781145187'\n                  error:\n                    description: Флаг ошибки\n                    type: boolean\n                    example: false\n                  errorText:\n                    description: Описание ошибки\n                    type: string\n                    example: ''\n                  additionalErrors:\n                    description: Дополнительные ошибки\n                    nullable: true\n                    type: string\n                    example: ''\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError403'\n        '429':\n          $ref: '#/components/responses/429'\n  /content/v2/cards/upload:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: false\n      x-category: content\n      tags:\n        - Создание карточек товаров\n      summary: Создание карточек товаров\n      description: \"Метод создаёт карточки товаров c указанием описаний и характеристик товаров.<br>\\n\\n<div class=\\\"description_important\\\">\\n  Есть две формы запроса: для создания отдельных и объединённых карточек товаров\\n</div>\\n\\nГабариты товаров можно указать только в `сантиметрах`, вес товара с упаковкой — в `килограммах`.\\n<br><br>\\nСоздание карточки товара происходит асинхронно. Синхронизация новой карточки с сервисами может занимать до 30 минут. В течение этого времени невозможно добавить остатки на склады и настроить цены. <br>\\nОдним запросом можно создать максимум 100 отдельных карточек товаров или 100 групп [объединённых](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточек\\_товаров по\\_30 карточек в\\_каждой. Максимальный размер запроса 10 Мб.<br>\\nЕсли ответ `Успешно` (`200`), но какие-то карточки не создались, проверьте [список несозданных карточек товаров](/openapi/work-with-products#tag/listings/paths/~1content~1v2~1cards~1error~1list/post).<br><br>\\n\\nВ песочнице карточка товара создаётся сразу, без ожидания.\\n\\n<div class=\\\"description_limit\\\">\\n<a href=\\\"/openapi/api-information#tag/introduction/Limity-zaprosov\\\">Лимит запросов</a> на один аккаунт продавца:\\n\\n| Период | Лимит | Интервал | Всплеск |\\n| --- | --- | --- | --- |\\n| 1 мин | 10 запросов | 6 сек | 5 запросов |\\n</div>\\n\"\n      requestBody:\n        content:\n          application/json:\n            schema:\n              description: Отдельные карточки товаров или группы объединённых карточек товаров\n              type: array\n              items:\n                type: object\n                required:\n                  - subjectID\n                  - variants\n                minimum: 1\n                maximum: 100\n                properties:\n                  subjectID:\n                    type: integer\n                    description: ID предмета\n                  variants:\n                    description: |\n                      [Объединённые](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточки товаров.<br>Чтобы создать отдельную карточку, передайте только один объект\n                    type: array\n                    items:\n                      type: object\n                      required:\n                        - vendorCode\n                      minimum: 1\n                      maximum: 30\n                      properties:\n                        brand:\n                          type: string\n                          description: Бренд\n                        title:\n                          type: string\n                          description: Наименование товара\n                          maxLength: 60\n                        description:\n                          type: string\n                          description: |\n                            Описание товара.<br>\n                            Максимальное количество символов зависит от категории товара<br>\n                            Стандарт — 2000, минимум — 1000, максимум — 5000<br>\n                            Подробно о **правилах заполнения карточки товара** в [Справочном центре](https://seller.wildberries.ru/instructions/ru/ru/material/how-to-create-card) на портале продавцов\n                        vendorCode:\n                          type: string\n                          description: Артикул продавца\n                          maxLength: 72\n                        kizMarked:\n                          type: boolean\n                          default: false\n                          description: |\n                            Подтверждение, что на товар нанесён обязательный код маркировки [Честного знака](https://честныйзнак.рф/):\n                              - `true` — продавец подтверждает, что на товар нанесён обязательный код маркировки.\n                              - `false` — продавец не подтверждает, что на товар нанесён обязательный код маркировки. Передайте в запросе `true`, чтобы подтвердить наличие на товаре обязательного кода маркировки. Карточка товара не пройдёт модерацию, если нет подтверждения продавца о том, что обязательный код маркировки нанесён на товар.\n\n                            Чтобы проверить, является ли код маркировки [Честного знака](https://честныйзнак.рф/) обязательным, используйте метод [Список карточек товаров](./work-with-products#tag/listings/paths/~1content~1v2~1get~1cards~1list/post), поле ответа `needKiz`\n                        wholesale:\n                          type: object\n                          description: Оптовая продажа\n                          properties:\n                            enabled:\n                              type: boolean\n                              description: Предназначена ли карточка товара для оптовой продажи\n                            quantum:\n                              type: number\n                              format: uint64\n                              description: Количество единиц товара в упаковке\n                        dimensions:\n                          description: |\n                            Габариты и вес товара **c упаковкой**.<br>\n                            Укажите в `сантиметрах` и `килограммах` для любого товара.<br>\n                            Если данные не указаны, автоматически сгенерируются нулевые значения длины, ширины, высоты и веса.<br>\n                            Синхронизация данных новой карточки с сервисом может занимать до 30 минут\n                          type: object\n                          properties:\n                            length:\n                              type: integer\n                              description: Длина, см\n                            width:\n                              type: integer\n                              description: Ширина, см\n                            height:\n                              type: integer\n                              description: Высота, см\n                            weightBrutto:\n                              type: number\n                              description: Вес, кг<br>Количество знаков после запятой <=3\n                        sizes:\n                          type: array\n                          description: |\n                            Массив размеров.<br>\n                            Если не указать для размерного товара (обувь, одежда и др.), сгенерируется автоматически с `techSize` = \"A\", `wbSize` = \"1\" и баркодом\n                          items:\n                            type: object\n                            properties:\n                              techSize:\n                                type: string\n                                description: Размер товара (например, XL, 45)\n                              wbSize:\n                                type: string\n                                description: Российский размер товара\n                              price:\n                                type: integer\n                                description: Цена товара\n                              skus:\n                                type: array\n                                items:\n                                  type: string\n                                description: |\n                                  Массив баркодов для размера. <br>\n                                  Если не указать, сгенерируется автоматически. <br>\n                                  Позволяет связать несколько баркодов с одним размером, например, для разных партий товара\n                        characteristics:\n                          type: array\n                          description: |\n                            Характеристики товара.\n                            <br>\n                            Можно получить методом [Характеристики предмета](./work-with-products#tag/categoriesSubcategoriesAndCharacteristics/paths/~1content~1v2~1object~1charcs~1%7BsubjectId%7D/get)\n                          items:\n                            type: object\n                            required:\n                              - id\n                              - value\n                            properties:\n                              id:\n                                type: integer\n                                description: ID характеристики\n                              value:\n                                description: |\n                                  Значения характеристики.\n                                  <br>\n                                  Тип данных — массив строк или число — зависит от типа характеристики, см. описание поля `charcType` в методе [Характеристики предмета](./work-with-products#tag/categoriesSubcategoriesAndCharacteristics/paths/~1content~1v2~1object~1charcs~1%7BsubjectId%7D/get).\n                                  <br>\n                                  Допустимое количество значений отображено в поле `maxCount` того же метода\n            examples:\n              creatingOneListing:\n                $ref: '#/components/examples/creatingOneListing'\n              creatingMergedListings:\n                $ref: '#/components/examples/creatingMergedListings'\n              creatingGroupOfIndividualListings:\n                $ref: '#/components/examples/creatingGroupOfIndividualListings'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseItemList'\n              example:\n                data: null\n                error: false\n                errorText: ''\n                additionalErrors: {}\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError400'\n              examples:\n                InvalidRequestFormatContent:\n                  $ref: '#/components/examples/InvalidRequestFormatContent'\n                ItemListedWithoutVendorCode:\n                  $ref: '#/components/examples/ItemListedWithoutVendorCode'\n                ListingsVendorCodeUsedInOtherListings:\n                  $ref: '#/components/examples/ListingsVendorCodeUsedInOtherListings'\n                ThisCategoryDoesNotExist:\n                  $ref: '#/components/examples/ThisCategoryDoesNotExist'\n                MissingRequiredCharacteristics:\n                  $ref: '#/components/examples/MissingRequiredCharacteristics'\n                NonUniqueCharacteristicsInOneGroupCreate:\n                  $ref: '#/components/examples/NonUniqueCharacteristicsInOneGroupCreate'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '413':\n          description: Превышен лимит объёма данных в запросе\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  title:\n                    type: string\n                    description: Заголовок ошибки\n                  detail:\n                    type: string\n                    description: Детали ошибки\n                  code:\n                    type: string\n                    description: Внутренний код ошибки\n                  requestId:\n                    type: string\n                    description: Уникальный ID запроса\n                  origin:\n                    type: string\n                    description: ID внутреннего сервиса WB\n                  status:\n                    type: number\n                    description: HTTP статус-код\n                  statusText:\n                    type: string\n                    description: Расшифровка HTTP статус-кода\n              example:\n                title: request body too long\n                detail: https://openapi.wildberries.ru/content/api/ru/\n                code: 71d3de1b-001e-488f-bbf5-55c31254fbeb\n                requestId: MN8usr6RfrzWHZfucSvNgb\n                origin: s2s-api-auth-content\n                status: 413\n                statusText: Request Entity Too Large\n        '429':\n          $ref: '#/components/responses/429'\n  /content/v2/cards/upload/add:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: false\n      x-category: content\n      tags:\n        - Создание карточек товаров\n      summary: Создание карточек товаров с присоединением\n      description: |\n        Метод создаёт карточки товаров, присоединяя их к существующим отдельным карточкам и группам [объединённых](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточек. В одной группе объединённых карточек товаров может быть не более 30 карточек, соответственно, создать с присоединением можно не более 29 карточек товаров за один запрос.\n\n        Габариты товаров можно указать только в `сантиметрах`, вес товара с упаковкой — в `килограммах`.\n        <br><br>\n        Если ответ `Успешно` (`200`), но какие-то карточки не создались, проверьте [список несозданных карточек товаров](/openapi/work-with-products#tag/listings/paths/~1content~1v2~1cards~1error~1list/post).<br>\n        Создание карточки товара происходит асинхронно. Синхронизация новой карточки с сервисами может занимать до 30 минут. В течение этого времени невозможно добавить остатки на склады и настроить цены.<br><br>\n\n        В песочнице карточка товара создаётся сразу, без ожидания.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 10 запросов | 6 сек | 5 запросов |\n        | Сервисный | 1 мин | 10 запросов | 6 сек | 5 запросов |\n        | Базовый с секретом | 1 мин | 10 запросов | 6 сек | 5 запросов |\n        | Базовый | 2 ч | 1 запрос | 2 ч | 1 запрос |\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                imtID:\n                  type: integer\n                  format: int64\n                  description: |\n                    `imtID` отдельной карточки товара или группы [объединённых](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточек товаров, к которой присоединяются создаваемые карточки\n                cardsToAdd:\n                  description: Добавляемые карточки товаров\n                  type: array\n                  items:\n                    type: object\n                    required:\n                      - vendorCode\n                    minimum: 1\n                    maximum: 29\n                    properties:\n                      brand:\n                        type: string\n                        description: Бренд\n                      vendorCode:\n                        type: string\n                        description: Артикул продавца\n                        maxLength: 72\n                      kizMarked:\n                        type: boolean\n                        default: false\n                        description: |\n                          Подтверждение, что на товар нанесён обязательный код маркировки [Честного знака](https://честныйзнак.рф/):\n                            - `true` — продавец подтверждает, что на товар нанесён обязательный код маркировки.\n                            - `false` — продавец не подтверждает, что на товар нанесён обязательный код маркировки. Передайте в запросе `true`, чтобы подтвердить наличие на товаре обязательного кода маркировки. Карточка товара не пройдёт модерацию, если нет подтверждения продавца о том, что обязательный код маркировки нанесён на товар.\n\n                          Чтобы проверить, является ли код маркировки [Честного знака](https://честныйзнак.рф/) обязательным, используйте метод [Список карточек товаров](./work-with-products#tag/listings/paths/~1content~1v2~1get~1cards~1list/post), поле ответа `needKiz`\n                      wholesale:\n                        type: object\n                        description: Оптовая продажа\n                        properties:\n                          enabled:\n                            type: boolean\n                            description: Предназначена ли карточка товара для оптовой продажи\n                          quantum:\n                            type: number\n                            format: uint64\n                            description: Количество единиц товара в упаковке\n                      title:\n                        type: string\n                        description: Наименование товара\n                        maxLength: 60\n                      description:\n                        type: string\n                        description: |\n                          Описание товара.<br>\n                          Максимальное количество символов зависит от категории товара<br>\n                          Стандарт — 2000, минимум — 1000, максимум — 5000<br>\n                          Подробно о **правилах заполнения карточки товара** в [Справочном центре](https://seller.wildberries.ru/instructions/ru/ru/material/how-to-create-card) на портале продавцов\n                      dimensions:\n                        description: |\n                          Габариты и вес товара **c упаковкой**.<br>\n                          Укажите в `сантиметрах` и `килограммах` для любого товара. <br>\n                          Если данные не указаны, автоматически сгенерируются нулевые значения длины, ширины, высоты и веса. <br>\n                          Синхронизация данных с сервисом может занимать до 30 минут\n                        type: object\n                        properties:\n                          length:\n                            type: integer\n                            description: Длина, см\n                          width:\n                            type: integer\n                            description: Ширина, см\n                          height:\n                            type: integer\n                            description: Высота, см\n                          weightBrutto:\n                            type: number\n                            description: Вес, кг<br>Количество знаков после запятой <=3\n                      sizes:\n                        type: array\n                        description: |\n                          Массив размеров.<br>\n                          Если не указать для размерного товара (обувь, одежда и др.), сгенерируется автоматически с `techSize` = \"A\", `wbSize` = \"1\" и баркодом\n                        items:\n                          type: object\n                          properties:\n                            techSize:\n                              type: string\n                              description: Размер товара (например, XL, 45)\n                            wbSize:\n                              type: string\n                              description: Российский размер товара\n                            price:\n                              type: integer\n                              description: Цена товара\n                            skus:\n                              type: array\n                              items:\n                                type: string\n                              description: Баркод. Если не указать, сгенерируется автоматически\n                      characteristics:\n                        type: array\n                        description: |\n                          Характеристики товара.\n                          <br>\n                          Можно получить методом [Характеристики предмета](./work-with-products#tag/categoriesSubcategoriesAndCharacteristics/paths/~1content~1v2~1object~1charcs~1%7BsubjectId%7D/get)\n                        items:\n                          type: object\n                          required:\n                            - id\n                            - value\n                          properties:\n                            id:\n                              type: integer\n                              description: ID характеристики\n                            value:\n                              description: |\n                                Значения характеристики.\n                                <br>\n                                Тип данных — массив строк или число — зависит от типа характеристики, см. описание поля `charcType` в методе [Характеристики предмета](./work-with-products#tag/categoriesSubcategoriesAndCharacteristics/paths/~1content~1v2~1object~1charcs~1%7BsubjectId%7D/get).\n                                <br>\n                                Допустимое количество значений отображено в поле `maxCount` того же метода\n            example:\n              imtID: 987654321\n              cardsToAdd:\n                - vendorCode: myVariant1\n                  kizMarked: true\n                  wholesale:\n                    enabled: true\n                    quantum: 243\n                  title: Наименование товара\n                  description: Описание товара\n                  brand: Бренд\n                  dimensions:\n                    length: 9\n                    width: 6\n                    height: 3\n                    weightBrutto: 0.893\n                  characteristics:\n                    - id: 12\n                      value:\n                        - Russian flag\n                    - id: 25471\n                      value: 1300\n                    - id: 14177449\n                      value:\n                        - blue\n                  sizes:\n                    - skus:\n                        - '12345678'\n                - vendorCode: myVariant2\n                  title: Наименование товара\n                  description: Описание товаров\n                  brand: Бренд\n                  dimensions:\n                    length: 8\n                    width: 8\n                    height: 8\n                    weightBrutto: 1.04\n                  characteristics:\n                    - id: 12\n                      value:\n                        - Russian flag\n                    - id: 25471\n                      value: 1300\n                    - id: 14177449\n                      value:\n                        - blue\n                  sizes:\n                    - skus:\n                        - '222222222222'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseItemList'\n              example:\n                data: null\n                error: false\n                errorText: ''\n                additionalErrors: {}\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseBodyContentError400'\n              examples:\n                InvalidRequestFormatContent:\n                  $ref: '#/components/examples/InvalidRequestFormatContent'\n                ItemListedWithoutVendorCode:\n                  $ref: '#/components/examples/ItemListedWithoutVendorCode'\n                ListingsVendorCodeUsedInOtherListings:\n                  $ref: '#/components/examples/ListingsVendorCodeUsedInOtherListings'\n                ThisCategoryDoesNotExist:\n                  $ref: '#/components/examples/ThisCategoryDoesNotExist'\n                MissingRequiredCharacteristics:\n                  $ref: '#/components/examples/MissingRequiredCharacteristics'\n                NonUniqueCharacteristicsInOneGroupAdd:\n                  $ref: '#/components/examples/NonUniqueCharacteristicsInOneGroupAdd'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '413':\n          description: Превышен лимит объёма данных в запросе\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  title:\n                    type: string\n                    description: Заголовок ошибки\n                  detail:\n                    type: string\n                    description: Детали ошибки\n                  code:\n                    type: string\n                    description: Внутренний код ошибки\n                  requestId:\n                    type: string\n                    description: Уникальный ID запроса\n                  origin:\n                    type: string\n                    description: ID внутреннего сервиса WB\n                  status:\n                    type: number\n                    description: HTTP статус-код\n                  statusText:\n                    type: string\n                    description: Расшифровка HTTP статус-кода\n              example:\n                title: request body too long\n                detail: https://openapi.wildberries.ru/content/api/ru/\n                code: 71d3de1b-001e-488f-bbf5-55c31254fbeb\n                requestId: MN8usr6RfrzWHZfucSvNgb\n                origin: s2s-api-auth-content\n                status: 413\n                statusText: Request Entity Too Large\n        '429':\n          $ref: '#/components/responses/429'\n  /content/v3/media/file:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: false\n      x-category: content\n      security:\n        - HeaderApiKey: []\n      summary: Загрузить медиафайл\n      description: \"Метод загружает и добавляет один медиафайл к карточке товара.\\n\\nТребования к изображениям:\\n  * максимум изображений для одной карточки товара\\_— 30\\n  * минимальное разрешение — 700x900 px\\n  * максимальный размер\\_— 32\\_Мб\\n  * минимальное качество\\_— 65%\\n  * форматы\\_— JPG, PNG, BMP, GIF (статичные), WebP\\n\\nТребования к видео:\\n  * максимум одно\\_видео для одной карточки товара\\n  * максимальный размер\\_— 50\\_Мб\\n  * форматы\\_— MOV, MP4\\n\\n<div class=\\\"description_limit\\\">\\n<a href=\\\"/openapi/api-information#tag/introduction/Limity-zaprosov\\\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>Медиафайлов</strong>:\\n\\n\\n| Тип | Период | Лимит | Интервал | Всплеск |\\n| --- | --- | --- | --- | --- |\\n| Персональный | 1 мин | 100 запросов | 600 мс | 5 запросов |\\n| Сервисный | 1 мин | 100 запросов | 600 мс | 5 запросов |\\n| Базовый с секретом | 1 мин | 100 запросов | 600 мс | 5 запросов |\\n| Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\\n\\n<hr>\\n\\nВ <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\\n\\n</div>\\n\"\n      tags:\n        - Медиафайлы\n      parameters:\n        - name: X-Nm-Id\n          in: header\n          description: Артикул WB\n          schema:\n            type: string\n            example: '213864079'\n          required: true\n        - name: X-Photo-Number\n          in: header\n          description: \"Номер медиафайла на загрузку, начинается с\\_`1`. При загрузке видео всегда указывайте `1`.\\n\\nЧтобы добавить изображение к уже загруженным, номер медиафайла должен быть больше количества уже загруженных медиафайлов.\\n\"\n          schema:\n            type: integer\n            example: 2\n          required: true\n      requestBody:\n        required: true\n        content:\n          multipart/form-data:\n            schema:\n              type: object\n              properties:\n                uploadfile:\n                  type: string\n                  format: binary\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    type: object\n                  error:\n                    description: Флаг ошибки\n                    type: boolean\n                  errorText:\n                    description: Описание ошибки\n                    type: string\n                  additionalErrors:\n                    nullable: true\n                    description: Дополнительные ошибки\n                    type: object\n              example:\n                data: {}\n                error: false\n                errorText: ''\n                additionalErrors: null\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/mediaErrors'\n            plain/text:\n              example: Invalid 'boundary' for 'multipart/form-data' request\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/mediaErrors'\n        '429':\n          $ref: '#/components/responses/429'\n  /content/v3/media/save:\n    servers:\n      - url: https://content-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://content-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: false\n      x-category: content\n      security:\n        - HeaderApiKey: []\n      summary: Загрузить медиафайлы по ссылкам\n      description: \"Метод загружает набор медиафайлов в карточку товара через указание ссылок в запросе.\\n\\n<div class=\\\"description_important\\\">\\n  Новые медиафайлы полностью заменяют старые. Чтобы добавить новые медиафайлы, укажите в запросе ссылки одновременно на новые и старые медиафайлы.\\n</div>\\n\\nТребования к ссылкам:\\n  * ссылка должна вести прямо на файл. Убедитесь, что ссылка не ведёт на страницу предпросмотра или авторизации, например. Если по ссылке открывается текстовая страница TXT или HTML, ссылка считается некорректной\\n  * для доступа к файлу по ссылке не нужна авторизация\\n\\nТребования к изображениям:\\n  * максимум изображений для одной карточки товара\\_— 30\\n  * минимальное разрешение — 700×900 px\\n  * максимальный размер\\_— 32\\_Мб\\n  * минимальное качество\\_— 65%\\n  * форматы\\_— JPG, PNG, BMP, GIF (статичные), WebP\\n\\nТребования к видео:\\n  * максимум одно\\_видео для одной карточки товара\\n  * максимальный размер\\_— 50\\_Мб\\n  * форматы\\_— MOV, MP4\\n\\nЕсли видео или хотя бы одно изображение в запросе не соответствует требованиям, то даже при успешном ответе (`200`) ни одно изображение/видео не загрузится.\\n\\n<div class=\\\"description_limit\\\">\\n<a href=\\\"/openapi/api-information#tag/introduction/Limity-zaprosov\\\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>Медиафайлов</strong>:\\n\\n\\n| Тип | Период | Лимит | Интервал | Всплеск |\\n| --- | --- | --- | --- | --- |\\n| Персональный | 1 мин | 100 запросов | 600 мс | 5 запросов |\\n| Сервисный | 1 мин | 100 запросов | 600 мс | 5 запросов |\\n| Базовый с секретом | 1 мин | 100 запросов | 600 мс | 5 запросов |\\n| Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |\\n\\n<hr>\\n\\nВ <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\\n\\n</div>\\n\"\n      tags:\n        - Медиафайлы\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                nmId:\n                  description: Артикул WB\n                  type: integer\n                data:\n                  description: \"Ссылки на изображения в том порядке, в котором они будут в\\_карточке товара, и на видео, на любой позиции массива\"\n                  type: array\n                  items:\n                    type: string\n            example:\n              nmId: 213864079\n              data:\n                - https://basket-stage-02.dasec.ru/vol669/part66964/66964260/images/big/2.jpg\n                - https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_mb.mp4\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    type: object\n                  error:\n                    description: Флаг ошибки\n                    type: boolean\n                  errorText:\n                    description: Описание ошибки\n                    type: string\n                  additionalErrors:\n                    nullable: true\n                    description: Дополнительные ошибки\n                    type: object\n              example:\n                data: {}\n                error: false\n                errorText: ''\n                additionalErrors: null\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/mediaErrors'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/mediaErrors'\n        '409':\n          description: Ошибка сохранения части ссылок\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/mediaErrors'\n        '422':\n          description: Отсутствует параметр nmId\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/mediaErrors'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/content/v1/recommendations/list:\n    servers:\n      - url: https://content-api.wildberries.ru\n    post:\n      x-readonly-method: true\n      x-category: content\n      x-token-types:\n        - personal\n        - service\n      tags:\n        - Рекомендации\n      summary: Список рекомендаций в карточках товаров\n      operationId: postV1RecommendationsList\n      description: |\n\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену, \n                <strong>Сервисному</strong> токену\n        </div>\n\n        Метод возвращает список [рекомендаций](https://seller.wildberries.ru/recommendations-v3) в карточках товаров.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/GetRecomReq'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/GetRecomRes'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/response400GetRecom'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          $ref: '#/components/responses/403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/content/v1/recommendations/set:\n    servers:\n      - url: https://content-api.wildberries.ru\n    post:\n      x-category: content\n      x-token-types:\n        - personal\n        - service\n      tags:\n        - Рекомендации\n      summary: Установить рекомендации для товаров\n      operationId: postV1RecommendationsSet\n      description: |\n\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену, \n                <strong>Сервисному</strong> токену\n        </div>\n\n        Метод обновляет, добавляет или удаляет [рекомендации](https://seller.wildberries.ru/recommendations-v3) для товаров.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 100 запросов | 600 мс | 5 запросов |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/SetRecomReq'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/SetRecomRes'\n        '208':\n          description: Уже отправлено\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/response208SetRecom'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/response400SetRecom'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          $ref: '#/components/responses/403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/upload/task:\n    servers:\n      - url: https://discounts-prices-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://discounts-prices-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: false\n      x-category: discountsandprices\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Цены и скидки\n      summary: Установить цены и скидки\n      description: |\n        Метод устанавливает цены и скидки для товаров.\n        <br><br>\n        Чтобы установить цены для размеров товара, используйте [отдельный метод](/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1upload~1task~1size/post).\n\n        <div class=\"description_important\">\n          Получить информацию о процессе установки цен и скидок можно с помощью методов <a href=\"/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1history~1tasks/get\">состояния</a> и <a href=\"/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1history~1goods~1task/get\">детализации</a> обработанной загрузки.\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Цены и скидки</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Сервисный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Базовый с секретом | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Базовый | 1 ч | 4 запроса | 15 мин | 1 запрос |\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      requestBody:\n        $ref: '#/components/requestBodies/SellerTaskRequest'\n      responses:\n        '200':\n          $ref: '#/components/responses/SuccessTaskResponse'\n        '208':\n          $ref: '#/components/responses/Response208'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                UploadLimitExceeded:\n                  $ref: '#/components/examples/UploadLimitExceeded'\n                DuplicateItemNos:\n                  $ref: '#/components/examples/DuplicateItemNos'\n                TheSpecifiedPricesAndDiscountsAreAlreadySet:\n                  $ref: '#/components/examples/TheSpecifiedPricesAndDiscountsAreAlreadySet'\n                InvalidDataFormat:\n                  $ref: '#/components/examples/InvalidDataFormat'\n                PriceShouldBeAWholeNumber:\n                  $ref: '#/components/examples/PriceShouldBeAWholeNumber'\n                InvalidPriceValue:\n                  $ref: '#/components/examples/InvalidPriceValue'\n                InvalidDiscountValue:\n                  $ref: '#/components/examples/InvalidDiscountValue'\n                InvalidItemNo:\n                  $ref: '#/components/examples/InvalidItemNo'\n                PriceAndDiscountNotSpecified:\n                  $ref: '#/components/examples/PriceAndDiscountNotSpecified'\n                EmptyData:\n                  $ref: '#/components/examples/EmptyData'\n                AllItemNosAreSpecifiedIncorrectlyOrPricesAndDiscounts:\n                  $ref: '#/components/examples/AllItemNosAreSpecifiedIncorrectlyOrPricesAndDiscounts'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                AccessDenied:\n                  $ref: '#/components/examples/Result403'\n        '409':\n          description: Ошибка при конвертации валюты\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                CurrencySwitchingError:\n                  $ref: '#/components/examples/Result409'\n        '422':\n          description: Неожидаемый результат\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResponseError'\n              examples:\n                UnexpectedResult:\n                  $ref: '#/components/examples/UnexpectedResult'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v2/upload/task/size:\n    servers:\n      - url: https://discounts-prices-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://discounts-prices-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: false\n      x-category: discountsandprices\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Цены и скидки\n      summary: Установить цены для размеров\n      description: |\n        Метод устанавливает цены отдельно для размеров товаров.\n\n        Работает только для товаров из категорий, где можно устанавливать цены отдельно для разных размеров. Для [таких товаров](/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1size~1nm/get) `\"editableSizePrice\":true`.\n\n        Чтобы установить цены и скидки для самих товаров, используйте [отдельный метод](/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1upload~1task/post).\n\n        <div class=\"description_important\">\n          Получить информацию о процессе установки цен и скидок можно с помощью методов <a href=\"/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1history~1tasks/get\">состояния</a> и <a href=\"/openapi/work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1history~1goods~1task/get\">детализации</a> обработанной загрузки.\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Цены и скидки</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Сервисный | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Базовый с секретом | 6 сек | 10 запросов | 600 мс | 5 запросов |\n        | Базовый | 1 ч | 4 запроса | 15 мин | 1 запрос |\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Контента</strong>.\n\n        </div>\n      requestBody:\n        $ref: '#/components/requestBodies/SellerTaskRequestSize'\n      responses:\n        '200':\n          $ref: '#/components/responses/SuccessTaskResponse'\n        '208':\n          $ref: '#/components/responses/Response208'\n        '400':\n          descripti
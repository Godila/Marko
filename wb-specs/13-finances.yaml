: number\n          description: Размер снижения кВВ из-за акции, %\n        ppvzSalesCommission:\n          example: '23.74'\n          type: string\n          description: Вознаграждение с продаж до вычета услуг поверенного, без НДС\n        forPay:\n          example: '376.99'\n          type: string\n          description: К перечислению продавцу за реализованный товар\n        ppvzReward:\n          example: '0'\n          type: string\n          description: Возмещение за выдачу и возврат товаров на ПВЗ\n        acquiringFee:\n          example: '14.89'\n          type: string\n          description: Компенсация платёжных услуг/Комиссия за интеграцию платёжных сервисов\n        acquiringPercent:\n          example: 4.06\n          type: number\n          description: Размер компенсации платёжных услуг/Комиссии за интеграцию платёжных сервисов, %\n        paymentProcessing:\n          example: Комиссия за организацию платежа с НДС\n          type: string\n          description: 'Тип платежа: компенсация платёжных услуг/Комиссия за интеграцию платёжных сервисов'\n        acquiringBank:\n          example: Тинькофф\n          type: string\n          description: Наименование банка-эквайера\n        vw:\n          example: '22.25'\n          type: string\n          description: Вознаграждение Вайлдберриз (ВВ), без НДС\n        vwNds:\n          example: '4.45'\n          type: string\n          description: НДС с вознаграждения Вайлдберриз\n        ppvzOfficeName:\n          example: Москва Москва Очаковское шоссе 6к2\n          type: string\n          description: Наименование офиса доставки\n        ppvzOfficeId:\n          example: 105383\n          type: integer\n          description: ID офиса доставки\n        ppvzSupplierName:\n          example: ИП Жасмин\n          type: string\n          description: Партнёр\n        ppvzSupplierInn:\n          example: '010101010101'\n          type: string\n          description: ИНН партнёра\n        declarationNumber:\n          example: ''\n          type: string\n          description: Номер таможенной декларации\n        bonusTypeName:\n          example: Штраф МП. Невыполненный заказ (отмена клиентом после недовоза)\n          type: string\n          description: Виды логистики, штрафов и корректировок ВВ\n        stickerId:\n          example: '1964038895'\n          type: string\n          description: Стикер МП\n        country:\n          example: Россия\n          type: string\n          description: Страна продажи\n        srvDbs:\n          example: true\n          type: boolean\n          description: Признак услуги платной доставки\n        penalty:\n          example: '231.35'\n          type: string\n          description: Общая сумма штрафов\n        additionalPayment:\n          example: '0'\n          type: string\n          description: Корректировка Вознаграждения Вайлдберриз (ВВ)\n        rebillLogisticCost:\n          example: '1.349'\n          type: string\n          description: Возмещение издержек по перевозке/по складским операциям с товаром\n        rebillLogisticOrg:\n          example: ИП Иванов Иван Иванович(123456789012)\n          type: string\n          description: Организатор перевозки\n        paidStorage:\n          type: string\n          description: Хранение\n          example: '12647.29'\n        deduction:\n          type: string\n          description: Удержания\n          example: '6354'\n        paidAcceptance:\n          type: string\n          description: Операции на приёмке\n          example: '865'\n        orderId:\n          type: integer\n          description: ID сборочного задания\n          example: 2816993144\n        kiz:\n          type: string\n          description: Код маркировки [Честного знака](https://честныйзнак.рф/)\n          example: \"0102900000376311210G2CIS?ehge)S\\x1D91002A\\x1D92F9Qof4FDo/31Icm14kmtuVYQzLypxm3HWkC1vQ/+pVVjm1dNAth1laFMoAGn7yEMWlTjxIe7lQnJqZ7TRZhlHQ==\"\n        isB2b:\n          type: boolean\n          description: Признак B2B-продажи\n          example: false\n        trbxId:\n          type: string\n          description: ID короба для обработки товара\n          example: WB-TRBX-1234567\n        installmentCofinancingAmount:\n          type: string\n          description: Скидка по программе софинансирования\n          example: '0'\n        wibesDiscountPercent:\n          type: number\n          description: Скидка Wibes, %\n          example: 1\n        cashbackAmount:\n          type: string\n          description: Сумма, удержанная за начисленные баллы программы лояльности\n          example: '2'\n        cashbackDiscount:\n          type: string\n          description: Компенсация скидки по программе лояльности\n          example: '19'\n        cashbackCommissionChange:\n          type: string\n          description: Стоимость участия в программе лояльности\n          example: '0.2'\n        paymentSchedule:\n          type: string\n          description: Разовое изменение срока перечисления денежных средств\n          example: '-1'\n        deliveryMethod:\n          type: string\n          description: Способ продажи и тип товара\n          example: FBS, (МГТ)\n        sellerPromoId:\n          type: integer\n          description: ID собственной акции продавца с дополнительной скидкой\n          example: 14350\n        sellerPromoDiscount:\n          type: number\n          description: Размер дополнительной скидки по собственной акции продавца, %\n          example: 3\n        loyaltyId:\n          type: integer\n          description: ID скидки лояльности от продавца\n          example: 0\n        loyaltyDiscount:\n          type: number\n          description: Размер скидки лояльности от продавца, %\n          example: 0\n        uuidPromocode:\n          type: string\n          description: ID промокода\n          example: ''\n        salePricePromocodeDiscountPrc:\n          type: number\n          description: Скидка за промокод, %\n          example: 0\n        articleSubstitution:\n          type: string\n          description: ID подменного артикула\n          example: ''\n        salePriceAffiliatedDiscountPrc:\n          type: number\n          description: Скидка по подменному артикулу, %\n          example: 0\n        agencyVat:\n          type: number\n          description: Удержание Агентского НДС, %.<br>Только для продавцов из Кыргызстана\n          example: 0\n        salePriceWholesaleDiscountPrc:\n          type: number\n          description: Оптовая скидка для бизнеса, %\n          example: 0\n        b2bCustomerTin:\n          type: string\n          description: ИНН B2B-покупателя\n          example: '010101010101'\n        paidWithSocialCertificate:\n          type: boolean\n          description: Оплата социальным сертификатом\n          example: false\n        warehouseLogisticsCoeff:\n          type: number\n          description: Коэффициент логистики\n          example: 0\n        orderUid:\n          type: string\n          description: |\n            ID корзины заказа — транзакции.<br>Заказы в одной корзине покупателя будут иметь одинаковый `orderUid`\n          example: id375f16c4bec295d9995393af803ff7b\n        srid:\n          example: 0f1c3999172603062979867564654dac5b702849\n          type: string\n          description: |\n            ID заказа.<br>В ответах методов сборочных заданий [FBS](./orders-fbs#tag/Sborochnye-zadaniya-FBS), [DBW](./orders-dbw#tag/dbwAssemblyOrders), [DBS](./orders-dbs#tag/dbsAssemblyOrders) и [Самовывоз](./in-store-pickup#tag/inStorePickupAssemblyOrders) `srid` равен `rid`\n    AcquiringReportListReq:\n      type: object\n      description: Параметры запроса\n      required:\n        - dateFrom\n        - dateTo\n      properties:\n        dateFrom:\n          type: string\n          description: |\n            Начальная дата отчёта.<br>Можно передать дату или дату со временем. Время можно указывать с точностью до секунд или миллисекунд.<br>Дата передаётся в формате [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339), время — в часовом поясе Москва `UTC+3`.<br>Примеры:\n              - `2025-06-20`\n              - `2025-06-20T23:59:59`\n              - `2025-06-20T00:00:00.12345`\n              - `2025-06-20T00:00:00`\n          example: '2026-03-17'\n        dateTo:\n          type: string\n          description: |\n            Конечная дата отчёта.<br>Дата в формате [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339). Можно передать дату или дату со временем. Время можно указывать с точностью до секунд или миллисекунд.<br>Время передаётся в часовом поясе Москва `UTC+3`.<br>Примеры:\n              - `2025-06-20`\n              - `2025-06-20T23:59:59`\n              - `2025-06-20T00:00:00.12345`\n              - `2025-06-20T00:00:00`\n          example: '2026-03-20'\n        limit:\n          type: integer\n          maximum: 1000\n          default: 1000\n          description: Количество отчётов в ответе\n          example: 211\n        offset:\n          type: integer\n          default: 0\n          description: Сколько элементов пропустить. Например, для значения `10` ответ начнётся с 11 элемента\n          example: 345\n    AcquiringReportListRes:\n      type: object\n      description: Список отчётов об издержках на приём платежей\n      required:\n        - reportId\n        - sellerFinanceName\n        - dateFrom\n        - dateTo\n        - createDate\n        - currency\n        - acquiringFeeSum\n        - acquiringFeeVatSum\n      properties:\n        reportId:\n          type: integer\n          format: int64\n          description: ID отчёта\n          example: 307401554\n        sellerFinanceName:\n          type: string\n          description: Наименование продавца\n          example: ИП Кружинин В. Р.\n        dateFrom:\n          type: string\n          format: date\n          description: Дата начала отчётного периода\n          example: '2026-03-16'\n        dateTo:\n          type: string\n          format: date\n          description: Дата конца отчётного периода\n          example: '2026-03-22'\n        createDate:\n          type: string\n          format: date\n          description: Дата формирования отчёта\n          example: '2026-03-31'\n        currency:\n          type: string\n          description: Валюта отчёта\n          example: RUB\n        acquiringFeeSum:\n          type: string\n          description: Сумма издержек по эквайрингу\n          example: '258'\n        acquiringFeeVatSum:\n          type: string\n          description: В том числе НДС\n          example: '83.79'\n    AcquiringReportsDetailedReq:\n      type: object\n      description: Параметры запроса\n      required:\n        - dateFrom\n        - dateTo\n      properties:\n        dateFrom:\n          type: string\n          description: |\n            Начальная дата отчёта.<br>Можно передать дату или дату со временем. Время можно указывать с точностью до секунд или миллисекунд.<br>Дата передаётся в формате [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339), время — в часовом поясе Москва `UTC+3`.<br>Примеры:\n              - `2025-06-20`\n              - `2025-06-20T23:59:59`\n              - `2025-06-20T00:00:00.12345`\n              - `2025-06-20T00:00:00`\n          example: '2026-03-17'\n        dateTo:\n          type: string\n          description: |\n            Конечная дата отчёта.<br>Дата в формате [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339). Можно передать дату или дату со временем. Время можно указывать с точностью до секунд или миллисекунд.<br>Время передаётся в часовом поясе Москва `UTC+3`.<br>Примеры:\n              - `2025-06-20`\n              - `2025-06-20T23:59:59`\n              - `2025-06-20T00:00:00.12345`\n              - `2025-06-20T00:00:00`\n          example: '2026-03-20'\n        limit:\n          type: integer\n          maximum: 100000\n          default: 100000\n          description: Количество строк в ответе\n          example: 21100\n        rrdId:\n          type: integer\n          default: 0\n          description: |\n            ID строки ответа. Необходим для получения отчёта частями.<br>Начинайте загрузку отчёта с `\"rrdid\":0`. В последующих запросах передавайте значение `rrdId` из последней строки предыдущего ответа.<br>Повторяйте запрос, пока не получите ответ `204`\n        fields:\n          type: array\n          items:\n            type: string\n          description: Список полей, которые вернутся в ответе. Если параметр не указан, возвращаются все поля\n          example:\n            - rrdId\n            - nmId\n            - docTypeName\n            - retailAmount\n            - acquiringFee\n            - srid\n    AcquiringReportsDetailedRes:\n      type: object\n      description: Детализации к отчётам об издержках на приём платежей\n      required:\n        - reportId\n        - currency\n        - rrdId\n        - nmId\n        - docTypeName\n        - retailAmount\n        - saleDate\n        - acqDate\n        - shkId\n        - acquiringFee\n        - acquiringFeeVat\n        - acquiringBank\n        - tin\n        - taxRegistrationReasonCode\n        - invoiceNumber\n        - invoiceDate\n        - srid\n      properties:\n        rrdId:\n          example: 1232610467\n          type: integer\n          description: ID строки\n        reportId:\n          example: 1234567\n          type: integer\n          format: int64\n          description: ID отчёта\n        acqDate:\n          example: '2026-03-21'\n          type: string\n          description: Дата операции\n        acquiringBank:\n          example: Тинькофф\n          type: string\n          description: Наименование банка-эквайера\n        tin:\n          example: '010101010101'\n          type: string\n          description: ИНН\n        taxRegistrationReasonCode:\n          example: '7701123301'\n          type: string\n          description: КПП\n        saleDate:\n          example: '2026-03-21'\n          type: string\n          description: Дата продажи\n        srid:\n          example: D0.r3f80c3eec6f845c6840128b4c19986f9.0.0\n          type: string\n          description: |\n            ID заказа.<br>В ответах методов сборочных заданий [FBS](./orders-fbs#tag/Sborochnye-zadaniya-FBS), [DBW](./orders-dbw#tag/dbwAssemblyOrders), [DBS](./orders-dbs#tag/dbsAssemblyOrders) и [Самовывоз](./in-store-pickup#tag/inStorePickupAssemblyOrders) `srid` равен `rid`\n        docTypeName:\n          example: Продажа\n          type: string\n          description: Тип документа\n        nmId:\n          example: 1234567\n          type: integer\n          description: Артикул WB\n        retailAmount:\n          example: '367'\n          type: string\n          description: Вайлдберриз реализовал Товар (Пр)\n        acquiringFee:\n          example: '14.89'\n          type: string\n          description: Размер комиссии за эквайринг, в том числе НДС\n        acquiringFeeVat:\n          example: '4.06'\n          type: string\n          description: Сумма НДС\n        invoiceNumber:\n          type: string\n          description: Номер счёта-фактуры\n          example: С/Ф 123\n        invoiceDate:\n          type: string\n          description: Дата счёта-фактуры\n          example: '2026-03-20'\n        shkId:\n          example: 1239159661\n          type: integer\n          description: Штрихкод\n        currency:\n          type: string\n          description: Валюта отчёта\n          example: RUB\n  responses:\n    '401':\n      description: Не авторизован\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки\n              code:\n                type: string\n          
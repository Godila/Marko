"openapi: 3.0.1\ninfo:\n  version: finances\n  title: Документы и бухгалтерия\n  description: |\n    <div class=\"description_important\">\n      Узнать больше о документах и бухгалтерии можно в <a href=\"https://seller.wildberries.ru/instructions/category/ba929b64-1f89-4426-82d7-ce998ee552bd?goBackOption=prevRoute&categoryId=3c971375-9939-45e8-ab82-376019be8942\">справочном центре</a>\n    </div>\n\n    <div class=\"api-block\">\n\n    Просмотр [баланса](/openapi/financial-reports-and-accounting#tag/balance), [финансовых отчётов](/openapi/financial-reports-and-accounting#tag/financialReports) и [документов](/openapi/financial-reports-and-accounting#tag/documents) продавца.\n\n    </div>\n  x-file-name: finances\nsecurity:\n  - HeaderApiKey: []\ntags:\n  - name: Баланс\n    x-displayName: Баланс\n    description: ''\n  - name: Финансовые отчёты\n    x-displayName: Финансовые отчёты\n    description: ''\n  - name: Документы\n    x-displayName: Документы\n    description: ''\npaths:\n  /api/v1/account/balance:\n    servers:\n      - url: https://finance-api.wildberries.ru\n    get:\n      operationId: getV1AccountBalance\n      x-readonly-method: true\n      x-category: finance\n      security:\n        - HeaderApiKey: []\n      summary: Получить баланс продавца\n      description: |\n        Метод возвращает данные виджета баланса на [главной странице](https://seller.wildberries.ru) портала продавцов.\n        <br><br>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        | Сервисный | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        | Базовый с секретом | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        | Базовый | 24 ч | 1 запрос | 24 ч | 1 запрос |\n        </div>\n      tags:\n        - Баланс\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  currency:\n                    example: RUB\n                    type: string\n                    description: Валюта\n                  current:\n                    example: 10196.21\n                    type: number\n                    description: Текущий баланс продавца\n                  for_withdraw:\n                    example: 6395.8\n                    type: number\n                    description: Сумма, доступная к выводу\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/finance/v1/sales-reports/list:\n    servers:\n      - url: https://finance-api.wildberries.ru\n    post:\n      x-readonly-method: true\n      x-category: finance\n      x-token-types:\n        - personal\n        - service\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Финансовые отчёты\n      summary: Список отчётов реализации\n      operationId: postV1SalesReportsList\n      description: |\n\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену, \n                <strong>Сервисному</strong> токену\n        </div>\n\n        Метод возвращает список отчётов релизации по формату [таблицы отчётов](https://seller.wildberries.ru/suppliers-mutual-settlements).\n        <br><br>\n        Данные доступны с 1 января 2025 года.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/SalesReportListReq'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: '#/components/schemas/SalesReportListRes'\n        '204':\n          description: Нет данных\n        '400':\n          $ref: '#/components/responses/response400FinancialReports'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          $ref: '#/components/responses/403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/finance/v1/sales-reports/detailed/{reportId}:\n    servers:\n      - url: https://finance-api.wildberries.ru\n    post:\n      x-readonly-method: true\n      x-category: finance\n      x-token-types:\n        - personal\n        - service\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Финансовые отчёты\n      summary: Детализации к отчётам реализации по ID отчётов\n      operationId: postV1SalesReportsDetailedReportId\n      description: |\n\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену, \n                <strong>Сервисному</strong> токену\n        </div>\n\n        Метод возвращает детализации к [отчётам реализации](https://seller.wildberries.ru/suppliers-mutual-settlements) по ID отчётов.\n        <br><br>\n        Данные доступны с 1 января 2025 года.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        </div>\n      parameters:\n        - name: reportId\n          in: path\n          description: ID отчёта.<br>Для ежедневных отчётов вместо стандартной десериализации рекомендуем использовать нестандартные библиотеки с поддержкой [BigInt](https://www.npmjs.com/package/json-bigint)\n          required: true\n          schema:\n            type: integer\n            format: int64\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/FinancialReportsDetailedReportIdReq'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: '#/components/schemas/SalesReportsDetailedRes'\n        '204':\n          description: Нет данных\n        '400':\n          $ref: '#/components/responses/response400FinancialReports'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/finance/v1/sales-reports/detailed:\n    servers:\n      - url: https://finance-api.wildberries.ru\n    post:\n      x-readonly-method: true\n      x-category: finance\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Финансовые отчёты\n      summary: Детализации к отчётам реализации за период\n      operationId: postV1SalesReportsDetailed\n      description: |\n        Метод возвращает детализации к [отчётам реализации](https://seller.wildberries.ru/suppliers-mutual-settlements) за указанный период.\n        <br><br>\n        Данные доступны с 29 января 2024 года.\n\n        <div class=\"description_important\">\n          Вы можете выгрузить данные в <a href=\"/knowledge-base/articles/019d49a4-650c-7b04-9596-ba441936f9d3\">Google Таблицы</a>\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        | Сервисный | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        | Базовый с секретом | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        | Базовый | 24 ч | 2 запроса | 12 ч | 1 запрос |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/SalesReportsDetailedReq'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: '#/components/schemas/SalesReportsDetailedRes'\n        '204':\n          description: Нет данных\n        '400':\n          $ref: '#/components/responses/response400FinancialReports'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/finance/v1/acquiring/list:\n    servers:\n      - url: https://finance-api.wildberries.ru\n    post:\n      x-readonly-method: true\n      x-category: finance\n      x-token-types:\n        - personal\n        - service\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Финансовые отчёты\n      summary: Список отчётов об издержках на приём платежей\n      operationId: postV1AcquiringList\n      description: |\n\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену, \n                <strong>Сервисному</strong> токену\n        </div>\n\n        Метод возвращает список отчётов об издержках на приём платежей по формату [таблицы отчётов](https://seller.wildberries.ru/suppliers-mutual-settlements/reports-implementations/acquiring-reports).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/AcquiringReportListReq'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: '#/components/schemas/AcquiringReportListRes'\n        '204':\n          description: Нет данных\n        '400':\n          $ref: '#/components/responses/response400FinancialReports'\n        '401':\n          $ref: '#/components/responses/401'\n        '403':\n          $ref: '#/components/responses/403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/finance/v1/acquiring/detailed/{reportId}:\n    servers:\n      - url: https://finance-api.wildberries.ru\n    post:\n      x-readonly-method: true\n      x-category: finance\n      x-token-types:\n        - personal\n        - service\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Финансовые отчёты\n      summary: Детализации к отчётам об издержках на приём платежей по ID отчётов\n      operationId: postV1AcquiringDetailedReportId\n      description: |\n\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену, \n                <strong>Сервисному</strong> токену\n        </div>\n\n        Метод возвращает детализации к [отчётам об издержках на приём платежей](https://seller.wildberries.ru/suppliers-mutual-settlements/reports-implementations/acquiring-reports) по ID отчётов.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        </div>\n      parameters:\n        - name: reportId\n          in: path\n          description: ID отчёта\n          required: true\n          schema:\n            type: integer\n            format: int64\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/FinancialReportsDetailedReportIdReq'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: '#/components/schemas/AcquiringReportsDetailedRes'\n        '204':\n          description: Нет данных\n        '400':\n          $ref: '#/components/responses/response400FinancialReports'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/finance/v1/acquiring/detailed:\n    servers:\n      - url: https://finance-api.wildberries.ru\n    post:\n      x-readonly-method: true\n      x-category: finance\n      x-token-types:\n        - personal\n        - service\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Финансовые отчёты\n      summary: Детализации к отчётам об издержках на приём платежей за период\n      operationId: postV1AcquiringDetailed\n      description: |\n\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену, \n                <strong>Сервисному</strong> токену\n        </div>\n\n        Метод возвращает детализации к [отчётам об издержках на приём платежей](https://seller.wildberries.ru/suppliers-mutual-settlements/reports-implementations/acquiring-reports) за указанный период.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 1 запрос | 1 мин | 1 запрос |\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/AcquiringReportsDetailedReq'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: '#/components/schemas/AcquiringReportsDetailedRes'\n        '204':\n          description: Нет данных\n        '400':\n          $ref: '#/components/responses/response400FinancialReports'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/documents/categories:\n    servers:\n      - url: https://documents-api.wildberries.ru\n    get:\n      operationId: getV1DocumentsCategories\n      x-readonly-method: true\n      x-category: documents\n      tags:\n        - Документы\n      security:\n        - HeaderApiKey: []\n      summary: Категории документов\n      description: |\n        Метод возвращает категории документов для получения [списка документов продавца](/openapi/financial-reports-and-accounting#tag/documents/operation/getV1DocumentsList).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 10 сек | 1 запрос | 10 сек | 5 запросов |\n        | Сервисный | 10 сек | 1 запрос | 10 сек | 5 запросов |\n        | Базовый с секретом | 10 сек | 1 запрос | 10 сек | 5 запросов |\n        | Базовый | 24 ч | 1 запрос | 24 ч | 1 запрос |\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/LocaleCat'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/GetCategories'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/documents/list:\n    servers:\n      - url: https://documents-api.wildberries.ru\n    get:\n      operationId: getV1DocumentsList\n      x-readonly-method: true\n      x-category: documents\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Документы\n      summary: Список документов\n      description: |\n        Метод возвращает список документов продавца. Вы можете получить [один](/openapi/financial-reports-and-accounting#tag/documents/operation/getV1DocumentsDownload) или [несколько](/openapi/financial-reports-and-accounting#tag/documents/operation/postV1DocumentsDownloadAll) документов из полученного списка.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 10 сек | 1 запрос | 10 сек | 5 запросов |\n        | Сервисный | 10 сек | 1 запрос | 10 сек | 5 запросов |\n        | Базовый с секретом | 10 сек | 1 запрос | 10 сек | 5 запросов |\n        | Базовый | 24 ч | 1 запрос | 24 ч | 1 запрос |\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/LocaleList'\n        - in: query\n          name: beginTime\n          schema:\n            type: string\n            format: date\n            example: '2024-07-09'\n          description: Начало периода. Только вместе с `endTime`\n        - in: query\n          name: endTime\n          schema:\n            type: string\n            format: date\n            example: '2024-07-15'\n          description: Конец периода. Только вместе с `beginTime`\n        - in: query\n          name: sort\n          schema:\n            type: string\n            enum:\n              - date\n              - category\n            default: date\n            example: category\n          description: |\n            Сортировка:\n              - `date` — по дате создания документа\n              - `category` — по категории (только при `locale=ru`)\n\n            Только вместе с `order`\n        - in: query\n          name: order\n          schema:\n            type: string\n            enum:\n              - desc\n              - asc\n            default: desc\n            example: asc\n          description: |\n            Сортировка:\n              - `desc` — по убыванию\n              - `asc` — по возрастанию\n\n            Только вместе с `sort`\n        - in: query\n          name: category\n          schema:\n            type: string\n            example: redeem-notification\n          description: ID [категории документов](./financial-reports-and-accounting#tag/documents/operation/getV1DocumentsCategories) из поля `name`\n        - in: query\n          name: serviceName\n          schema:\n            type: string\n            example: redeem-notification-44841941\n          description: Уникальный ID документа\n        - in: query\n          name: limit\n          schema:\n            type: integer\n            default: 50\n            maximum: 50\n            example: 10\n          description: Максимальное количество строк ответа\n        - in: query\n          name: offset\n          schema:\n            type: integer\n            default: 0\n            example: 90\n          description: После какой строки выдавать данные\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/GetList'\n        '400':\n          $ref: '#/components/responses/Responses400List'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/documents/download:\n    servers:\n      - url: https://documents-api.wildberries.ru\n    get:\n      operationId: getV1DocumentsDownload\n      x-readonly-method: true\n      x-category: documents\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Документы\n      summary: Получить документ\n      description: |\n        Метод загружает один документ из [списка документов продавца](/openapi/financial-reports-and-accounting#tag/documents/operation/getV1DocumentsList).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 10 сек | 1 запрос | 10 сек | 5 запросов |\n        | Сервисный | 10 сек | 1 запрос | 10 сек | 5 запросов |\n        | Базовый с секретом | 10 сек | 1 запрос | 10 сек | 5 запросов |\n        | Базовый | 24 ч | 1 запрос | 24 ч | 1 запрос |\n        </div>\n      parameters:\n        - in: query\n          required: true\n          name: serviceName\n          schema:\n            type: string\n            example: redeem-notification-44841941\n          description: Уникальный ID документа\n        - in: query\n          required: true\n          name: extension\n          schema:\n            type: string\n            example: zip\n          description: Формат документа\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/GetDoc'\n        '400':\n          $ref: '#/components/responses/Responses400Download'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/documents/download/all:\n    servers:\n      - url: https://documents-api.wildberries.ru\n    post:\n      operationId: postV1DocumentsDownloadAll\n      x-readonly-method: true\n      x-category: documents\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Документы\n      summary: Получить документы\n      description: |\n        Метод загружает несколько документов из [списка документов продавца](/openapi/financial-reports-and-accounting#tag/documents/operation/getV1DocumentsList).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 5 мин | 1 запрос | 5 мин | 5 запросов |\n        | Сервисный | 5 мин | 1 запрос | 5 мин | 5 запросов |\n        | Базовый с секретом | 5 мин | 1 запрос | 5 мин | 5 запросов |\n        | Базовый | 24 ч | 1 запрос | 24 ч | 1 запрос |\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/requestDownload'\n            example:\n              params:\n                - extension: zip\n                  serviceName: redeem-notification-44841941\n                - extension: xlsx\n                  serviceName: act-income-mp-392460936\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/GetDocs'\n        '400':\n          $ref: '#/components/responses/Responses400DownloadAll'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\ncomponents:\n  parameters:\n    LocaleCat:\n      name: locale\n      in: query\n      schema:\n        type: string\n        example: ru\n        default: en\n      description: |\n        Язык поля `title`:\n          - `ru` — русский\n          - `en` — английский\n          - `zh` — китайский\n    LocaleList:\n      name: locale\n      in: query\n      schema:\n        type: string\n        example: ru\n        default: en\n      description: |\n        Язык поля `category`:\n          - `ru` — русский\n          - `en` — английский\n          - `zh` — китайский\n  schemas:\n    requestDownload:\n      type: object\n      properties:\n        params:\n          type: array\n          maxItems: 50\n          minItems: 1\n          items:\n            type: object\n            properties:\n              extension:\n                type: string\n                description: Формат документа\n              serviceName:\n                type: string\n                description: Уникальный ID документа\n    GetCategories:\n      properties:\n        data:\n          type: object\n          properties:\n            categories:\n              description: Категории документов\n              type: array\n              items:\n                type: object\n                properties:\n                  name:\n                    type: string\n                    example: redeem-notification\n                    description: ID категории документа из параметра [запроса](./financial-reports-and-accounting#tag/documents/operation/getV1DocumentsList) `category`\n                  title:\n                    type: string\n                    example: Уведомление о выкупе\n                    description: Название категории документа из поля [ответа](./financial-reports-and-accounting#tag/documents/~1api~1v1~1documents~1list/get) `category`\n    GetList:\n      properties:\n        data:\n          type: object\n          properties:\n            documents:\n              description: Категории документов\n              type: array\n              items:\n                type: object\n                properties:\n                  serviceName:\n                    type: string\n                    example: redeem-notification-44841941\n                    description: Уникальный ID документа\n                  name:\n                    type: string\n                    example: redeem-notification\n                    description: Название документа\n                  category:\n                    type: string\n                    example: Уведомление о выкупе\n                    description: Название [категории документов](./financial-reports-and-accounting#tag/documents/operation/getV1DocumentsCategories) из поля ответа `title`\n                  extensions:\n                    type: array\n                    items:\n                      type: string\n                      example: zip\n                    description: Форматы документа\n                  creationTime:\n                    type: string\n                    example: '2023-10-03T00:18:06.879Z'\n                    description: Дата и время создания документа\n                  viewed:\n                    type: boolean\n                    example: false\n                    description: Выгружен ли документ в личном кабинете\n    GetDoc:\n      properties:\n        data:\n          type: object\n          properties:\n            fileName:\n              type: string\n              example: Notice of redemption 44841941.zip\n              description: Название документа\n            extension:\n              type: string\n              example: zip\n              description: Формат документа\n            document:\n              type: string\n              example: ...\n              description: Документ в кодировке base64\n    GetDocs:\n      properties:\n        data:\n          type: object\n          properties:\n            fileName:\n              type: string\n              example: documents.zip\n              description: Название документа\n            extension:\n              type: string\n              example: zip\n              description: Формат документа\n            document:\n              type: string\n              example: ...\n              description: Документ в кодировке base64\n    SalesReportListReq:\n      type: object\n      description: Параметры запроса\n      required:\n        - dateFrom\n        - dateTo\n      properties:\n        dateFrom:\n          type: string\n          description: |\n            Начальная дата отчёта.<br>Можно передать дату или дату со временем. Время можно указывать с точностью до секунд или миллисекунд.<br>Дата передаётся в формате [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339), время — в часовом поясе Москва `UTC+3`.<br>Примеры:\n              - `2025-06-20`\n              - `2025-06-20T23:59:59`\n              - `2025-06-20T00:00:00.12345`\n              - `2025-06-20T00:00:00`\n          example: '2026-03-17'\n        dateTo:\n          type: string\n          description: |\n            Конечная дата отчёта.<br>Дата в формате [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339). Можно передать дату или дату со временем. Время можно указывать с точностью до секунд или миллисекунд.<br>Время передаётся в часовом поясе Москва `UTC+3`.<br>Примеры:\n              - `2025-06-20`\n              - `2025-06-20T23:59:59`\n              - `2025-06-20T00:00:00.12345`\n              - `2025-06-20T00:00:00`\n          example: '2026-03-20'\n        limit:\n          type: integer\n          maximum: 1000\n          default: 1000\n          description: Количество отчётов в ответе\n          example: 211\n        offset:\n          type: integer\n          default: 0\n          description: Сколько элементов пропустить. Например, для значения `10` ответ начнётся с 11 элемента\n          example: 345\n        period:\n          type: string\n          enum:\n            - daily\n            - weekly\n          description: |\n            Периодичность отчётов:\n              - `weekly` — еженедельные\n              - `daily` — ежедневные\n          default: weekly\n          example: daily\n    SalesReportListRes:\n      type: object\n      description: Список отчётов реализации\n      required:\n        - reportId\n        - sellerFinanceName\n        - dateFrom\n        - dateTo\n        - createDate\n        - currency\n        - reportType\n        - retailAmountSum\n        - forPaySum\n        - avgSalePercent\n        - deliveryServiceSum\n        - paidStorageSum\n        - paidAcceptanceSum\n        - deductionSum\n        - penaltySum\n        - additionalPaymentSum\n        - cashbackAmountSum\n        - cashbackDiscountSum\n        - cashbackCommissionChangeSum\n        - paymentSchedule\n        - bankPaymentSum\n      properties:\n        reportId:\n          type: integer\n          format: int64\n          description: ID отчёта\n          example: 307401554\n        sellerFinanceName:\n          type: string\n          description: Наименование продавца\n          example: ИП Кружинин В. Р.\n        dateFrom:\n          type: string\n          format: date\n          description: Дата начала отчётного периода\n          example: '2026-03-16'\n        dateTo:\n          type: string\n          format: date\n          description: Дата конца отчётного периода\n          example: '2026-03-22'\n        createDate:\n          type: string\n          format: date\n          description: Дата формирования отчёта\n          example: '2026-03-23'\n        currency:\n          type: string\n          description: Валюта отчёта\n          example: RUB\n        reportType:\n          type: integer\n          enum:\n            - 1\n            - 2\n            - 3\n          description: \"Тип отчёта:\\n  - `1`\\_— основной\\n  - `2`\\_— по\\_выкупам\\n  - `3` — по выкупам для Грузии\\n\"\n          example: 1\n        retailAmountSum:\n          type: string\n          description: Продажа\n          example: '258'\n        forPaySum:\n          type: string\n          description: К перечислению за товар\n          example: '183.79'\n        avgSalePercent:\n          type: number\n          description: Согласованная скидка, %\n          example: 0\n        deliveryServiceSum:\n          type: string\n          description: Стоимость логистики\n          example: '2558.47'\n        paidStorageSum:\n          type: string\n          description: Стоимость хранения\n          example: '626.84'\n        paidAcceptanceSum:\n          type: string\n          description: Стоимость операций при приёмке\n          example: '243.81'\n        deductionSum:\n          type: string\n          description: Прочие удержания и выплаты\n          example: '150'\n        penaltySum:\n          type: string\n          description: Общая сумма штрафов\n          example: '1457.61'\n        additionalPaymentSum:\n          type: string\n          description: Корректировка Вознаграждения Вайлдберриз (ВВ)\n          example: '9509.71'\n        cashbackAmountSum:\n          type: string\n          description: Сумма, удержанная за начисленные баллы программы лояльности\n          example: '2'\n        cashbackDiscountSum:\n          type: string\n          description: Компенсация скидки по программе лояльности\n          example: '19'\n        cashbackCommissionChangeSum:\n          type: string\n          description: Стоимость участия в программе лояльности\n          example: '0.2'\n        paymentSchedule:\n          type: string\n          description: Разовое изменение срока перечисления денежных средств\n          example: '-1'\n        bankPaymentSum:\n          type: string\n          description: Итого к оплате\n          example: '5172.94'\n    FinancialReportsDetailedReportIdReq:\n      type: object\n      description: Параметры запроса\n      properties:\n        limit:\n          type: integer\n          maximum: 100000\n          default: 100000\n          description: Количество строк в ответе\n          example: 21100\n        rrdId:\n          type: integer\n          default: 0\n          description: |\n            ID строки ответа. Необходим для получения отчёта частями.<br>Начинайте загрузку отчёта с `\"rrdid\":0`. В последующих запросах передавайте значение `rrdId` из последней строки предыдущего ответа.<br>Повторяйте запрос, пока не получите ответ `204`\n        fields:\n          type: array\n          items:\n            type: string\n          description: Список полей, которые вернутся в ответе. Если параметр не указан, возвращаются все поля\n          example:\n            - rrdId\n            - nmId\n            - docTypeName\n            - retailAmount\n            - acquiringFee\n            - srid\n    SalesReportsDetailedReq:\n      type: object\n      description: Параметры запроса\n      required:\n        - dateFrom\n        - dateTo\n      properties:\n        dateFrom:\n          type: string\n          description: |\n            Начальная дата отчёта.<br>Можно передать дату или дату со временем. Время можно указывать с точностью до секунд или миллисекунд.<br>Дата передаётся в формате [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339), время — в часовом поясе Москва `UTC+3`.<br>Примеры:\n              - `2025-06-20`\n              - `2025-06-20T23:59:59`\n              - `2025-06-20T00:00:00.12345`\n              - `2025-06-20T00:00:00`\n          example: '2026-03-17'\n        dateTo:\n          type: string\n          description: |\n            Конечная дата отчёта.<br>Дата в формате [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339). Можно передать дату или дату со временем. Время можно указывать с точностью до секунд или миллисекунд.<br>Время передаётся в часовом поясе Москва `UTC+3`.<br>Примеры:\n              - `2025-06-20`\n              - `2025-06-20T23:59:59`\n              - `2025-06-20T00:00:00.12345`\n              - `2025-06-20T00:00:00`\n          example: '2026-03-20'\n        limit:\n          type: integer\n          maximum: 100000\n          default: 100000\n          description: Количество строк в ответе\n          example: 21100\n        rrdId:\n          type: integer\n          default: 0\n          description: |\n            ID строки ответа. Необходим для получения отчёта частями.<br>Начинайте загрузку отчёта с `\"rrdid\":0`. В последующих запросах передавайте значение `rrdId` из последней строки предыдущего ответа.<br>Повторяйте запрос, пока не получите ответ `204`\n        period:\n          type: string\n          enum:\n            - daily\n            - weekly\n          description: |\n            Периодичность отчётов:\n              - `weekly` — еженедельные\n              - `daily` — ежедневные\n          default: weekly\n          example: daily\n        fields:\n          type: array\n          items:\n            type: string\n          description: Список полей, которые вернутся в ответе. Если параметр не указан, возвращаются все поля\n          example:\n            - rrdId\n            - nmId\n            - docTypeName\n            - retailAmount\n            - acquiringFee\n            - srid\n    SalesReportsDetailedRes:\n      type: object\n      description: Детализации к отчётам реализации\n      required:\n        - reportId\n        - dateFrom\n        - dateTo\n        - createDate\n        - currency\n        - reportType\n        - rrdId\n        - giId\n        - dlvPrc\n        - fixTariffDateFrom\n        - fixTariffDateTo\n        - subjectName\n        - nmId\n        - brandName\n        - vendorCode\n        - title\n        - techSize\n        - sku\n        - docTypeName\n        - quantity\n        - retailPrice\n        - retailAmount\n        - salePercent\n        - commissionPercent\n        - officeName\n        - sellerOperName\n        - orderDt\n        - saleDt\n        - rrDate\n        - shkId\n        - retailPriceWithDisc\n        - deliveryAmount\n        - returnAmount\n        - deliveryService\n        - giBoxTypeName\n        - productDiscountForReport\n        - sellerPromo\n        - spp\n        - kvwBase\n        - kvw\n        - supRatingUp\n        - isKgvpV2\n        - ppvzSalesCommission\n        - forPay\n        - ppvzReward\n        - acquiringFee\n        - acquiringPercent\n        - paymentProcessing\n        - acquiringBank\n        - vw\n        - vwNds\n        - ppvzOfficeName\n        - ppvzOfficeId\n        - ppvzSupplierName\n        - ppvzSupplierInn\n        - declarationNumber\n        - stickerId\n        - country\n        - srvDbs\n        - penalty\n        - additionalPayment\n        - rebillLogisticCost\n        - paidStorage\n        - deduction\n        - paidAcceptance\n        - orderId\n        - isB2b\n        - trbxId\n        - installmentCofinancingAmount\n        - wibesDiscountPercent\n        - cashbackAmount\n        - cashbackDiscount\n        - cashbackCommissionChange\n        - paymentSchedule\n        - deliveryMethod\n        - sellerPromoId\n        - sellerPromoDiscount\n        - loyaltyId\n        - loyaltyDiscount\n        - uuidPromocode\n        - salePricePromocodeDiscountPrc\n        - articleSubstitution\n        - salePriceAffiliatedDiscountPrc\n        - salePriceWholesaleDiscountPrc\n        - b2bCustomerTin\n        - paidWithSocialCertificate\n        - warehouseLogisticsCoeff\n        - orderUid\n        - srid\n      properties:\n        reportId:\n          example: 1234567\n          type: integer\n          format: int64\n          description: ID отчёта\n        dateFrom:\n          type: string\n          format: date\n          description: Дата начала отчётного периода\n          example: '2026-03-16'\n        dateTo:\n          type: string\n          format: date\n          description: Дата конца отчётного периода\n          example: '2026-03-22'\n        createDate:\n          type: string\n          format: date\n          description: Дата формирования отчёта\n          example: '2026-03-23'\n        currency:\n          type: string\n          description: Валюта отчёта\n          example: RUB\n        reportType:\n          type: integer\n          enum:\n            - 1\n            - 2\n            - 3\n          description: \"Тип отчёта:\\n  - `1`\\_— основной\\n  - `2`\\_— по\\_выкупам\\n  - `3` — по выкупам для Грузии\\n\"\n          example: 1\n        rrdId:\n          example: 1232610467\n          type: integer\n          description: ID строки\n        giId:\n          example: 123456\n          type: integer\n          description: ID поставки\n        dlvPrc:\n          example: 1.8\n          type: number\n          description: Фиксированный коэффициент склада по поставке\n        fixTariffDateFrom:\n          example: '2026-03-18'\n          type: string\n          format: date\n          description: Дата начала действия фиксации\n        fixTariffDateTo:\n          example: '2026-03-19'\n          type: string\n          format: date\n          description: Дата конца действия фиксации\n        subjectName:\n          example: Мини-печи\n          type: string\n          description: Предмет\n        nmId:\n          example: 1234567\n          type: integer\n          description: Артикул WB\n        brandName:\n          example: BlahBlah\n          type: string\n          description: Бренд\n        vendorCode:\n          example: MAB123\n          type: string\n          description: Артикул продавца\n        title:\n          example: ДС тарелка\n          type: string\n          description: Название товара\n        techSize:\n          example: '0'\n          type: string\n          description: Размер\n        sku:\n          example: '1231312352310'\n          type: string\n          description: Баркод\n        docTypeName:\n          example: Продажа\n          type: string\n          description: Тип документа\n        quantity:\n          type: integer\n          example: 1\n          description: Количество\n        retailPrice:\n          example: '1249'\n          type: string\n          description: Цена розничная\n        retailAmount:\n          example: '367'\n          type: string\n          description: Вайлдберриз реализовал Товар (Пр)\n        salePercent:\n          example: 0\n          type: integer\n          description: Согласованный продуктовый дисконт, %\n        commissionPercent:\n          example: 24\n          type: number\n          description: Размер кВВ, %\n        officeName:\n          example: Склад WB\n          type: string\n          description: Склад\n        sellerOperName:\n          example: 
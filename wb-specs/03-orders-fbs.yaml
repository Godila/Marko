"openapi: 3.0.1\ninfo:\n  title: Заказы FBS\n  version: order\n  description: |\n    <div class=\"api-block\">\n\n    С помощью методов раздела Заказы FBS (Fulfillment by Seller) вы можете:\n      - получать информацию о [сборочных заданиях](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS) и их статусах, отменять сборочные задания, получать стикеры\n      - добавлять, редактировать и удалять [идентификаторы маркировки](/openapi/orders-fbs#tag/fbsLabelIdentifiers) сборочных заданий\n      - управлять [поставками](/openapi/orders-fbs#tag/Postavki-FBS)\n      - создавать, редактировать и удалять [пропуска](/openapi/orders-fbs#tag/Propuska-FBS) на склады WB\n\n    Вы можете протестировать методы заказов FBS в [песочнице](/sandbox). Также в песочнице доступны [специальные методы](/docs/openapi-other/sandbox-environment#tag/Marketplejs-FBS) для эмуляции действий пользователя\n\n    </div>\n\n\n    <div class=\"description_ref\">\n      Узнать, как использовать методы в бизнес-кейсах, можно в <a href=\"/knowledge-base/articles/019d49a4-0771-7571-aea9-11d5b597f34c/zakazy-fbs\">инструкции</a> по работе с <strong>заказами FBS</strong>\n    </div>\n\n\n    <div class=\"description_important\">\n      Узнать больше о заказах FBS можно в <a href=\"https://seller.wildberries.ru/instructions/ru/ru/category/b3e60238-fd4c-49ce-8668-ff688725a12d\">справочном центре</a>\n    </div>\n  x-file-name: orders-fbs\nsecurity:\n  - HeaderApiKey: []\ntags:\n  - name: Сборочные задания FBS\n    description: ''\n  - name: Идентификаторы маркировки FBS\n    x-displayName: Идентификаторы маркировки FBS\n    description: ''\n  - name: Поставки FBS\n    description: ''\n  - name: Пропуска FBS\n    description: ''\n  - name: Настройки автовозврата\n    x-displayName: Настройки автовозврата\n    description: ''\npaths:\n  /api/v3/passes/offices:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Пропуска FBS\n      summary: Получить список складов, для которых требуется пропуск\n      description: |\n        Метод возвращает список складов для привязки к [пропуску продавца](/openapi/orders-fbs#tag/Propuska-FBS/paths/~1api~1v3~1passes/get).\n\n        <div class=\"description_important\">\n          Данные, которые возвращает метод, могут меняться. Рекомендуем периодически синхронизировать список\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: array\n                nullable: false\n                description: Список складов\n                items:\n                  $ref: '#/components/schemas/PassOffice'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/passes:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Пропуска FBS\n      summary: Получить список пропусков\n      description: |\n        Метод возвращает список всех [созданных](/openapi/orders-fbs#tag/Propuska-FBS/paths/~1api~1v3~1passes/post) пропусков продавца.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: array\n                nullable: false\n                description: Список пропусков продавца\n                items:\n                  $ref: '#/components/schemas/Pass'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n    post:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Пропуска FBS\n      summary: Создать пропуск\n      description: |\n        Метод создаёт [пропуск продавца](/openapi/orders-fbs#tag/Propuska-FBS/paths/~1api~1v3~1passes/get) с привязкой к складу WB.\n\n        Пропуск действует 48 часов со времени создания.\n\n        <div class=\"description_limit\">\n          Максимум 1 запрос в 10 <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">минут</a> на один аккаунт продавца.\n\n          Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n          <hr>\n\n          В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        required: true\n        description: Общая длина ФИО ограничена от 6 до 100 символов. В номере машины могут быть только буквы и цифры\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                firstName:\n                  type: string\n                  nullable: false\n                  minLength: 1\n                  description: Имя водителя\n                  example: Александр\n                lastName:\n                  type: string\n                  nullable: false\n                  minLength: 1\n                  description: Фамилия водителя\n                  example: Петров\n                carModel:\n                  type: string\n                  nullable: false\n                  minLength: 1\n                  maxLength: 100\n                  description: Марка машины\n                  example: Lamborghini\n                carNumber:\n                  type: string\n                  nullable: false\n                  minLength: 6\n                  maxLength: 9\n                  description: Номер машины\n                  example: A456BC123\n                officeId:\n                  type: integer\n                  format: int64\n                  nullable: false\n                  minimum: 1\n                  description: ID склада\n                  example: 15\n              required:\n                - firstName\n                - lastName\n                - carModel\n                - carNumber\n                - officeId\n      responses:\n        '201':\n          description: Создано\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  id:\n                    type: integer\n                    nullable: false\n                    description: ID пропуска продавца\n                    example: 2\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/passes/{passId}:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    put:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Пропуска FBS\n      summary: Обновить пропуск\n      description: |\n        Метод обновляет данные [пропуска продавца](/openapi/orders-fbs#tag/Propuska-FBS/paths/~1api~1v3~1passes/get). В том числе, можно обновить данные привязанного склада WB.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Pass'\n      requestBody:\n        required: true\n        description: Общая длина ФИО ограничена от 6 до 100 символов. В номере машины могут быть только буквы и цифры.\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                firstName:\n                  type: string\n                  nullable: false\n                  minLength: 1\n                  description: Имя водителя\n                  example: Александр\n                lastName:\n                  type: string\n                  nullable: false\n                  minLength: 6\n                  description: Фамилия водителя\n                  example: Петров\n                carModel:\n                  type: string\n                  nullable: false\n                  minLength: 1\n                  maxLength: 100\n                  description: Марка машины\n                  example: Lamborghini\n                carNumber:\n                  type: string\n                  nullable: false\n                  minLength: 6\n                  maxLength: 9\n                  description: Номер машины\n                  example: A456BC123\n                officeId:\n                  type: integer\n                  format: int64\n                  nullable: false\n                  minimum: 1\n                  description: ID склада\n                  example: 15\n              required:\n                - firstName\n                - lastName\n                - carModel\n                - carNumber\n                - officeId\n      responses:\n        '204':\n          description: Обновлено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                WarehouseNameInvalid:\n                  $ref: '#/components/examples/WarehouseNameInvalid'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '429':\n          $ref: '#/components/responses/429'\n    delete:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Пропуска FBS\n      summary: Удалить пропуск\n      description: |\n        Метод удаляет пропуск продавца [из списка](/openapi/orders-fbs#tag/Propuska-FBS/paths/~1api~1v3~1passes/get).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Pass'\n      responses:\n        '204':\n          description: Удалено\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/orders/new:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Сборочные задания FBS\n      summary: Получить список новых сборочных заданий\n      description: |\n        Метод возвращает список всех новых [сборочных заданий](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders/get), которые есть у продавца на момент запроса.\n\n        <div class=\"description_important\">\n        Наличие в сборочных заданиях идентификаторов маркировки, указанных в полях <code>requiredMeta</code> и <code>optionalMeta</code>, влияет только на возможность перевести поставку в доставку. Если ваш товар подлежит обязательной <a href =\"https://seller.wildberries.ru/instructions/ru/ru/material/items-labeling-in-fbs\">маркировке</a> средствами\n        идентификации, необходимо указывать идентификаторы маркировки независимо от того, в каком поле они были получены (п. 4.6 <a href =\"https://seller.wildberries.ru/confirm-offer-condition/product/view\">Оферты</a>).\n        <br>\n        Рекомендуем добавлять в сборочные задания все идентификаторы маркировки, полученные в полях <code>requiredMeta</code> и <code>optionalMeta</code>\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                nullable: false\n                properties:\n                  orders:\n                    type: array\n                    nullable: false\n                    description: Список новых сборочных заданий\n                    items:\n                      $ref: '#/components/schemas/OrderNew'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/orders:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Сборочные задания FBS\n      summary: Получить информацию о сборочных заданиях\n      description: |\n        Метод возвращает информацию о сборочных заданиях, созданных не более 3 месяцев назад, без их актуального [статуса](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders~1status/post).\n\n        Чтобы получить данные за период, укажите в запросе даты начала и окончания периода. Максимум 30 календарных дней одним запросом.\n        В ответе метода будут сборочные задания, созданные в указанный период.<br><br>\n        Чтобы получить сборочные задания, созданные более 3 месяцев назад, используйте метод получения [списка архивных заказов](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1marketplace~1v3~1fbs~1orders~1archive/get).\n\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Limit'\n        - $ref: '#/components/parameters/Next'\n        - name: dateFrom\n          in: query\n          schema:\n            type: integer\n          description: |\n            Дата начала периода в формате Unix timestamp. По умолчанию — дата за 30 дней до запроса. Часовой пояс — UTC\n        - name: dateTo\n          in: query\n          schema:\n            type: integer\n          description: Дата конца периода в формате Unix timestamp. Часовой пояс — UTC\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                nullable: false\n                properties:\n                  next:\n                    $ref: '#/components/schemas/Next'\n                  orders:\n                    type: array\n                    nullable: false\n                    items:\n                      $ref: '#/components/schemas/Order'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/orders/status:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Сборочные задания FBS\n      summary: Получить статусы сборочных заданий\n      description: |\n        Метод возвращает статусы [сборочных заданий](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders/get) по их ID.\n        <br><br>\n        `supplierStatus` — статус сборочного задания. Триггер его изменения — действие самого продавца.\n\n        Возможные значения `supplierStatus`:\n\n        | Статус   | Описание            | Как перевести сборочное задание в данный статус |\n        |-------|----------------------|--------------------------------------|\n        | `new`      | **Новое сборочное задание** |  |\n        | `confirm`  | **На сборке** |[Добавить сборочное задание к поставке](/openapi/orders-fbs#tag/Postavki-FBS/paths/~1api~1marketplace~1v3~1supplies~1%7BsupplyId%7D~1orders/patch)\n        | `complete` | **В доставке** | [Передать поставку в доставку](/openapi/orders-fbs#tag/Postavki-FBS/paths/~1api~1v3~1supplies~1%7BsupplyId%7D~1deliver/patch) |\n        | `cancel`   | **Отменено продавцом**   | [Отменить сборочное задание](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders~1%7BorderId%7D~1cancel/patch)|\n        | `cancel_carrier`   | **Отменено перевозчиком** <br>Только для трансграничных поставок   | Переводится перевозчиком |\n\n        <br><br>\n        `wbStatus` — статус системы Wildberries.\n\n        Возможные значения `wbStatus`:\n        - `waiting` — сборочное задание в работе\n        - `sorted` — сборочное задание отсортировано\n        - `sold` — заказ получен покупателем\n        - `canceled` — отмена сборочного задания\n        - `canceled_by_client` — покупатель отменил заказ при получении\n        - `declined_by_client` — покупатель отменил заказ. Отмена доступна покупателю в первый час с момента заказа, если заказ не переведён на сборку\n        - `defect` — отмена заказа по причине брака\n        - `ready_for_pickup` — заказ прибыл на пункт выдачи заказов (ПВЗ)\n        - `accepted_by_carrier` — продавец передал заказ в службу доставки в своей стране\n        - `sent_to_carrier` — заказ отправлен на склад службы доставки в стране продавца\n        - `canceled_by_carrier` — заказ отменён перевозчиком. Только для трансграничных поставок\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - orders\n              properties:\n                orders:\n                  type: array\n                  minItems: 1\n                  maxItems: 1000\n                  description: Список ID сборочных заданий\n                  items:\n                    type: integer\n                    format: int64\n                    example: 5632423\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  orders:\n                    type: array\n                    nullable: false\n                    items:\n                      type: object\n                      properties:\n                        id:\n                          type: integer\n                          format: int64\n                          nullable: false\n                          description: ID сборочного задания\n                          example: 5632423\n                        isCancellable:\n                          type: boolean\n                          nullable: false\n                          description: |\n                            Доступна ли [отмена](./orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders~1%7BorderId%7D~1cancel/patch) сборочного задания:\n                            - `false` — недоступна\n                            - `true` — доступна\n                          example: false\n                        supplierStatus:\n                          type: string\n                          nullable: false\n                          description: Статус сборочного задания, установленный продавцом\n                          enum:\n                            - new\n                            - confirm\n                            - complete\n                            - cancel\n                          example: new\n                        wbStatus:\n                          type: string\n                          nullable: false\n                          description: Статус сборочного задания в системе Wildberries\n                          enum:\n                            - waiting\n                            - sorted\n                            - sold\n                            - canceled\n                            - canceled_by_client\n                            - declined_by_client\n                            - defect\n                            - ready_for_pickup\n                            - postponed_delivery\n                            - accepted_by_carrier\n                            - sent_to_carrier\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/supplies/orders/reshipment:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Сборочные задания FBS\n      summary: Получить все сборочные задания для повторной отгрузки\n      description: |\n        Метод возвращает все [сборочные задания](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders/get), требующие повторной отгрузки.\n        <br><br>\n        Повторная отгрузка требуется, если поставка была отсканирована в пункте приёмки, но при этом в ней всё ещё есть неотсканированные товары. Спустя определённое время необходимо доставить эти товары заново. Данные сборочные задания можно перевести в [другую активную поставку](/openapi/orders-fbs#tag/Postavki-FBS/paths/~1api~1marketplace~1v3~1supplies~1%7BsupplyId%7D~1orders/patch).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  orders:\n                    description: Список сборочных заданий\n                    type: array\n                    items:\n                      type: object\n                      properties:\n                        supplyID:\n                          description: ID поставки\n                        orderID:\n                          description: ID сборочного задания\n              example:\n                orders:\n                  - supplyID: WB-GI-1234567\n                    orderID: 5632423\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/orders/{orderId}/cancel:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    patch:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Сборочные задания FBS\n      summary: Отменить сборочное задание\n      description: |\n        Метод отменяет [сборочное задание](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders/get) и переводит в [статус](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders~1status/post) `cancel` — отменено продавцом.\n\n        <div class=\"description_important\">\n        Сборочное задание можно отменить до его передачи Wildberries.\n        Чтобы проверить, можно ли отменить сборочное задание, используйте метод <a href =\"/docs/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders~1status/post\">POST /api/v3/orders/status</a>, поле <code>isCancellable</code>.\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 100 запросов | 600 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Order'\n      responses:\n        '204':\n          description: Отменено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '409':\n          description: Ошибка обновления статуса\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                StatusMismatch:\n                  $ref: '#/components/examples/StatusMismatch'\n                StatusChangeNotAllowed:\n                  $ref: '#/components/examples/StatusChangeNotAllowed'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/orders/stickers:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Сборочные задания FBS\n      summary: Получить стикеры сборочных заданий\n      description: |\n        Метод возвращает список стикеров для [сборочных заданий](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS) в [статусах](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders~1status/post) `confirm` — на сборке и `complete` — в доставке. <br><br>\n        Если за сборочным заданием не закреплён обязательный [номер декларации на товары (ДТ)](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1marketplace~1v3~1orders~1%7BorderId%7D~1meta~1customs-declaration/put), получить стикеры для этого сборочного задания невозможно.<br><br>\n        За один запрос можно получить максимум 100 стикеров. <br>\n        Можно получить стикер в форматах:\n          - SVG\n          - ZPLV (вертикальный)\n          - ZPLH (горизонтальный)\n          - PNG\n\n        Доступны размеры:\n          - 580x400 px при `width=58&height=40` в запросе\n          - 400x300 px при `width=40&height=30` в запросе\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - name: type\n          in: query\n          required: true\n          description: Тип стикера\n          schema:\n            type: string\n            enum:\n              - svg\n              - zplv\n              - zplh\n              - png\n        - name: width\n          in: query\n          required: true\n          description: Ширина стикера\n          schema:\n            type: integer\n            enum:\n              - 58\n              - 40\n        - name: height\n          in: query\n          required: true\n          description: Высота стикера\n          schema:\n            type: integer\n            enum:\n              - 40\n              - 30\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                orders:\n                  type: array\n                  minItems: 1\n                  maxItems: 100\n                  description: Список ID сборочных заданий\n                  items:\n                    type: integer\n                    format: int64\n                    example: 5346346\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  stickers:\n                    type: array\n                    nullable: false\n                    items:\n                      type: object\n                      properties:\n                        orderId:\n                          type: integer\n                          format: int64\n                          nullable: false\n                          description: ID сборочного задания\n                          example: 5346346\n                        partA:\n                          type: string\n                          nullable: false\n                          description: Первая часть ID стикера для печати подписи\n                          example: '231648'\n                        partB:\n                          type: string\n                          nullable: false\n                          description: Вторая часть ID стикера для печати подписи\n                          example: '9753'\n                        barcode:\n                          type: string\n                          nullable: false\n                          description: Закодированное значение стикера\n                          example: '!uKEtQZVx'\n                        file:\n                          type: string\n                          nullable: false\n                          description: Полное представление стикера в заданном формате\n                          example: \n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '409':\n          description: Конфликт\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                CustomsDeclarationIsRequired:\n                  $ref: '#/components/examples/CustomsDeclarationIsRequired'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/orders/meta:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Идентификаторы маркировки FBS\n      summary: Получить идентификаторы маркировки сборочных заданий\n      description: |\n        Метод возвращает идентификаторы маркировки [сборочных заданий](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders/get) и статусы их проверки.\n        <br><br>\n        Перечень идентификаторов маркировки, доступных для сборочного задания, можно получить в [списке новых сборочных заданий](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders~1new/get), поля `requiredMeta` и `optionalMeta`. Если поля `requiredMeta` и `optionalMeta` не содержат какой-либо идентификатор маркировки, значит, у сборочного задания не может быть этого идентификатора — и добавить его нельзя.<br>\n        Возможные идентификаторы маркировки:\n          - `imei` — [IMEI](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1v3~1orders~1%7BorderId%7D~1meta~1imei/put)\n          - `uin` — [УИН](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1v3~1orders~1%7BorderId%7D~1meta~1uin/put)\n          - `gtin` — [GTIN](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1v3~1orders~1%7BorderId%7D~1meta~1gtin/put)\n          - `sgtin` — [код маркировки Честного знака](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1v3~1orders~1%7BorderId%7D~1meta~1sgtin/put)\n          - `expiration` — [срок годности товара](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1v3~1orders~1%7BorderId%7D~1meta~1expiration/put)\n          - `customsDeclaration` — [номер ДТ](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1marketplace~1v3~1orders~1%7BorderId%7D~1meta~1customs-declaration/put)\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>получения и удаления идентификаторов маркировки FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/v3.GetMetaMultiRequest'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/v3.OrdersMetaAPI'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/v3.APIError'\n              example:\n                code: BadRequest\n                message: Неправильный запрос\n                data: {}\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/v3.APIError'\n              example:\n                code: AccessDenied\n                message: Доступ запрещён\n                data: {}\n        '404':\n          description: Не найдено\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/v3.APIError'\n              example:\n                code: NotFound\n                message: Не найдено\n                data: {}\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/orders/{orderId}/meta:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    delete:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Идентификаторы маркировки FBS\n      summary: Удалить идентификаторы маркировки сборочного задания\n      description: |\n        Метод удаляет значение [идентификаторов маркировки сборочного задания](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1marketplace~1v3~1orders~1meta/post) для переданного ключа.\n        <br><br>\n        Возможные идентификаторы маркировки:\n          - `imei` — [IMEI](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1v3~1orders~1%7BorderId%7D~1meta~1imei/put)\n          - `uin` — [УИН](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1v3~1orders~1%7BorderId%7D~1meta~1uin/put)\n          - `gtin` — [GTIN](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1v3~1orders~1%7BorderId%7D~1meta~1gtin/put)\n          - `sgtin` — [код маркировки Честного знака](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1v3~1orders~1%7BorderId%7D~1meta~1sgtin/put)\n          - `customsDeclaration` — [номер ДТ](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1marketplace~1v3~1orders~1%7BorderId%7D~1meta~1customs-declaration/put)\n\n        Можно передать только один ключ.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>получения и удаления идентификаторов маркировки FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Order'\n        - name: key\n          in: query\n          required: true\n          schema:\n            type: string\n            enum:\n              - imei\n              - uin\n              - gtin\n              - sgtin\n              - customsDeclaration\n          description: Название идентификаторов маркировки для удаления. Передаётся только одно значение.\n      responses:\n        '204':\n          description: Удалено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '409':\n          description: Ошибка удаления идентификаторов маркировки\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                FailedToUpdateMeta:\n                  $ref: '#/components/examples/FailedToUpdateMeta'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/orders/{orderId}/meta/sgtin:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    put:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Идентификаторы маркировки FBS\n      summary: Закрепить код маркировки Честного знака за сборочным заданием\n      description: |\n        Метод обновляет код маркировки [Честного знака](https://честныйзнак.рф/) в идентификаторах маркировки [сборочного задания](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders/get).\n        <br>\n        Закрепить код маркировки Честного знака можно только за сборочным заданием в [статусе](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders~1status/post) `confirm` и если в [идентификаторах маркировки сборочного задания](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1marketplace~1v3~1orders~1meta/post) есть поле `sgtin`.\n        <br><br>\n        Получить загруженные маркировки можно в [идентификаторах маркировки сборочного задания](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1marketplace~1v3~1orders~1meta/post).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>закрепления идентификаторов маркировки FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 1000 запросов | 60 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Order'\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - sgtins\n              properties:\n                sgtins:\n                  type: array\n                  example:\n                    - \"0104630568317423215EirD_orEif7X\\x1D91EE12\\x1D92VygELprJ87wrc/qF/Vq/KEFUVpZm4vDPQt2kqUw308Y=\"\n                  description: |\n                    Массив кодов маркировки [Честного знака](https://честныйзнак.рф/). <br>\n                    Вы [можете передать](https://seller.wildberries.ru/instructions/ru/ru/material/kiz-common-errors#bfd5fce8-e0fd-4f15-9d8b-e616fac02c2e) коды маркировки:\n                      - полностью — с GS-разделителями и кодом проверки подлинности (криптохвостом)\n                      - в коротком формате — с GS-разделителями без кода проверки подлинности (криптохвоста)\n\n                      GS-разделители необходимо передавать в кодировке Unicode с экранированием — `\\u001D`\n                  minItems: 1\n                  maxItems: 100\n                  items:\n                    type: string\n                    description: Код маркировки [Честного знака](https://честныйзнак.рф/) на упаковке. От 16 до 135 символов\n      responses:\n        '204':\n          description: Отправлено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '409':\n          description: Ошибка добавления маркировки\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                FailedToUpdateMeta:\n                  $ref: '#/components/examples/FailedToUpdateMeta'\n                MetaKeyNotRequired:\n                  $ref: '#/components/examples/MetaKeyNotRequired'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/orders/{orderId}/meta/uin:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    put:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Идентификаторы маркировки FBS\n      summary: Закрепить УИН за сборочным заданием\n      description: |\n        Метод обновляет УИН, уникальный идентификационный номер, в [идентификаторах маркировки сборочного задания](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1marketplace~1v3~1orders~1meta/post).\n        У одного сборочного задания может быть только один УИН.<br>\n        Закрепить УИН можно только за сборочным заданием в [статусе](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders~1status/post) `confirm` и если в [идентификаторах маркировки сборочного задания](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1marketplace~1v3~1orders~1meta/post) есть поле `uin`.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>закрепления идентификаторов маркировки FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 1000 запросов | 60 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Order'\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                uin:\n                  type: string\n                  minLength: 16\n                  maxLength: 16\n                  description: УИН\n                  example: '1234567890123456'\n              required:\n                - uin\n      responses:\n        '204':\n          description: Обновлено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '409':\n          description: Ошибка обновления идентификаторов маркировки\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                FailedToUpdateMeta:\n                  $ref: '#/components/examples/FailedToUpdateMeta'\n                MetaKeyNotRequired:\n                  $ref: '#/components/examples/MetaKeyNotRequired'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/orders/{orderId}/meta/imei:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    put:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Идентификаторы маркировки FBS\n      summary: Закрепить IMEI за сборочным заданием\n      description: |\n        Метод обновляет IMEI в [идентификаторах маркировки сборочного задания](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1marketplace~1v3~1orders~1meta/post).<br>\n        У одного сборочного задания может быть только один IMEI. Если у устройства два IMEI — **IMEI** и **IMEI2** или **IMEI1** и **IMEI2** — укажите только **IMEI** или **IMEI1**. **IMEI2** указывать не нужно.<br>\n        Закрепить IMEI можно только за сборочным заданием в [статусе](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders~1status/post) `confirm` и если в [идентификаторах маркировки сборочного задания](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1marketplace~1v3~1orders~1meta/post) есть поле `imei`.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>закрепления идентификаторов маркировки FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 1000 запросов | 60 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Order'\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                imei:\n                  type: string\n                  minLength: 15\n                  maxLength: 15\n                  description: IMEI\n                  example: '123456789012345'\n              required:\n                - imei\n      responses:\n        '204':\n          description: Обновлено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '409':\n          description: Ошибка обновления идентификаторов маркировки\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                FailedToUpdateMeta:\n                  $ref: '#/components/examples/FailedToUpdateMeta'\n                MetaKeyNotRequired:\n                  $ref: '#/components/examples/MetaKeyNotRequired'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/orders/{orderId}/meta/gtin:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    put:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Идентификаторы маркировки FBS\n      summary: Закрепить GTIN за сборочным заданием\n      description: |\n        Метод обновляет GTIN, уникальный ID товара в Беларуси, в [идентификаторах маркировки сборочного задания](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1marketplace~1v3~1orders~1meta/post).\n        У одного сборочного задания может быть только один GTIN.<br>\n         Закрепить GTIN можно только за сборочным заданием в [статусе](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders~1status/post) `confirm` и если в [идентификаторах маркировки сборочного задания](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1marketplace~1v3~1orders~1meta/post) есть поле `gtin`.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>закрепления идентификаторов маркировки FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 1000 запросов | 60 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Order'\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                gtin:\n                  type: string\n                  minLength: 13\n                  maxLength: 13\n                  description: GTIN\n                  example: '1234567890123'\n              required:\n                - gtin\n      responses:\n        '204':\n          description: Обновлено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '409':\n          description: Ошибка обновления идентификаторов маркировки\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                FailedToUpdateMeta:\n                  $ref: '#/components/examples/FailedToUpdateMeta'\n                MetaKeyNotRequired:\n                  $ref: '#/components/examples/MetaKeyNotRequired'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/orders/{orderId}/meta/expiration:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    put:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Идентификаторы маркировки FBS\n      summary: Закрепить за сборочным заданием срок годности товара\n      description: |\n        Метод закрепляет за [сборочным заданием](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders/get) срок годности товара. Товар годен до указанной даты. <br>\n        Закрепить срок годности можно только за сборочным заданием в [статусе](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders~1status/post) `confirm` и если в [идентификаторах маркировки сборочного задания](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1marketplace~1v3~1orders~1meta/post) есть поле `expiration`.\n        <br><br>\n        Получить загруженные данные можно в [идентификаторах маркировки сборочного задания](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1marketplace~1v3~1orders~1meta/post).<br>\n        Чтобы изменить срок годности, отправьте запрос с новой датой. Удалить срок годности сборочного задания невозможно.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>закрепления идентификаторов маркировки FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 1000 запросов | 60 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Order'\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - expiration\n              properties:\n                expiration:\n                  type: string\n                  description: Дата, до которой годен товар. Не менее 30 дней с текущей даты\n                  format: date (dd.mm.yyyy)\n                  example: 12.09.2030\n      responses:\n        '204':\n          description: Отправлено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                LowExpirationDate:\n                  $ref: '#/components/examples/LowExpirationDate'\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '409':\n          description: Ошибка добавления срока годности\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                FailedToUpdateMeta:\n                  $ref: '#/components/examples/FailedToUpdateMeta'\n                MetaKeyNotRequired:\n                  $ref: '#/components/examples/MetaKeyNotRequired'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/orders/{orderId}/meta/customs-declaration:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    put:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Идентификаторы маркировки FBS\n      summary: Закрепить номер ДТ за сборочным заданием\n      description: |\n        Метод обновляет номер ДТ — декларации на товары — в [идентификаторах маркировки сборочного задания](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1marketplace~1v3~1orders~1meta/post). У одного сборочного задания может быть только один номер ДТ. <br>\n        Закрепить номер ДТ можно только за сборочным заданием в [статусе](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders~1status/post) `confirm` и если в [идентификаторах маркировки сборочного задания](/openapi/orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1marketplace~1v3~1orders~1meta/post) есть поле `customsDeclaration`.\n\n        <div class=\"description_important\">\n        Продавцам из Армении необходимо обязательно указывать номер декларации на товары (ДТ), произведённые вне ЕАЭС, если заказ из Армении доставляется в РФ.\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов <strong>закрепления идентификаторов маркировки FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 1000 запросов | 60 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Order'\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - customsDeclaration\n              properties:\n                customsDeclaration:\n                  type: string\n                  minLength: 17\n                  maxLength: 29\n                  description: Номер ДТ\n                  example: 10704010/010624/0000302\n      responses:\n        '204':\n          description: Обновлено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '409':\n          description: Ошибка обновления номера ДТ\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                FailedToUpdateMeta:\n                  $ref: '#/components/examples/FailedToUpdateMeta'\n                MetaKeyNotRequired:\n                  $ref: '#/components/examples/MetaKeyNotRequired'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/orders/stickers/cross-border:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    post:\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Сборочные задания FBS\n      summary: Получить стикеры сборочных заданий трансграничных поставок\n      description: |\n        Метод возвращает список стикеров [сборочных заданий](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders/get) трансграничных поставок в формате PDF.<br><br>\n\n        Для каждого сборочного задания в ответе указывается статус генерации стикера:\n          - `awaitingTrackNumber` — стикер не готов. Ожидается трек-номер от перевозчика.\n          - `ready` — стикер готов\n\n        <div class=\"description_important\">\n          Стикер может генерироваться с задержкой. Повторяйте запрос, пока не получите статус <code>ready</code>.\n        </div>\n\n        Ограничения:\n          - За один запрос можно получить максимум 100 стикеров.\n          - Можно получить стикеры только для сборочных заданий, находящихся на сборке или в доставке — [статусы](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders~1status/post) `confirm`, `complete`.\n\n        В песочнице этот метод всегда возвращает ответ <code>200</code>.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                orders:\n                  type: array\n                  minItems: 1\n                  maxItems: 100\n                  description: Список ID сборочных заданий\n                  items:\n                    type: integer\n                    format: int64\n                    example: 3869227998\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  stickers:\n                    type: array\n                    nullable: false\n                    items:\n                      type: object\n                      properties:\n                        orderId:\n                          type: integer\n                          nullable: false\n                          description: ID сборочного задания\n                          example: 3869227998\n                        status:\n                          type: string\n                          nullable: false\n                          enum:\n                            - awaitingTrackNumber\n                            - ready\n                          description: |\n                            Статус генерации стикера:\n                              - `awaitingTrackNumber` — стикер не готов. Ожидается трек-номер от перевозчика.\n                              - `ready` — стикер готов\n                          example: ready\n                        parcelId:\n                          type: string\n                          description: Трек-номер в стикере для отслеживания сборочного задания\n                          example: WB0000000001\n                        file:\n                          type: string\n                          format: byte\n                          nullable: false\n                          description: Стикер в формате PDF, кодировка base64\n                          example: \n                        partA:\n                          type: string\n                          nullable: false\n                          description: Первая часть ID стикера для печати подписи\n                          example: '231648'\n                        partB:\n                          type: string\n                          nullable: false\n                          description: Вторая часть ID стикера для печати подписи\n                          example: '9753'\n                        barcode:\n                          type: string\n                          nullable: false\n                          description: Закодированное значение стикера\n                          example: '!uKEtQZVx'\n              example:\n                stickers:\n                  - orderId: 987654320\n                    status: awaitingTrackNumber\n                    parcelId: ''\n                    file: ''\n                    partA: ''\n                    partB: ''\n                    barcode: ''\n                  - orderId: 123456789\n                    status: ready\n                    parcelId: WB0000000001\n                    file: \n                    partA: '231648'\n                    partB: '9753'\n                    barcode: '!uKEtQZVx'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n                IncorrectRequest:\n                  $ref: '#/components/examples/IncorrectRequest'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/orders/status/history:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Сборочные задания FBS\n      summary: История статусов для сборочных заданий трансграничных поставок\n      description: |\n        Метод возвращает историю [статусов](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders~1status/post) для [сборочных заданий](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders/get) трансграничных поставок.\n\n        В песочнице этот метод всегда возвращает ответ <code>200</code>.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                orders:\n                  description: ID сборочных заданий\n                  type: array\n                  items:\n                    type: integer\n                  maxItems: 100\n                  minItems: 1\n                  example:\n                    - 123456789\n                    - 987654321\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  orders:\n                    type: array\n                    description: Список сборочных заданий\n                    items:\n                      type: object\n                      properties:\n                        deliveryDate:\n                          type: string\n                          format: date-time\n                          description: Планируемая дата доставки, [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339)\n                        statuses:\n                          description: Статусы\n                          type: array\n                          items:\n                            type: object\n                            properties:\n                              date:\n                                type: string\n                                description: Дата присвоения статуса\n                                nullable: true\n                                example: null\n                              code:\n                                type: string\n                                description: |\n                                  Статус-код сборочного задания/заказа:\n                                    - `dispatched_to_delivery_service` — Продавец передал заказ в службу доставки в своей стране\n                                    - `on_way_to_delivery_service` — Заказ едет на склад службы доставки в стране продавца\n                                    - `accepted_by_carrier` — Товар принят перевозчиком\n                                    - `assembling` — Отправлен на сборку\n                                    - `assembled` — Собран на складе\n                                    - `sorted` — Отсортирован\n                                    - `replaced_at_warehouse` — Замена на складе\n                                    - `prepared_for_shipment` — Подготовлен к отгрузке\n                                    - `in_search` — На поиске\n                                    - `arrived_at_dct` — Поступил в распределительный центр-транзит\n                                    - `arrived_at_sct` — Поступил в сортировочный центр-транзит\n                                    - `arrived_at_dc` — Поступил в распределительный центр\n                                    - `arrived_at_sc` — Поступил в сортировочный центр\n                                    - `prepared_for_shipment_at_sc` — Подготовлен к отгрузке в сортировочном центре\n                                    - `shipped_at_sc` — Отгружено сортировочным центром\n                                    - `shipped_at_dct` — Отгружен распределительным центром — транзит\n                                    - `shipped_at_dc` — Отгружен распределительным центром\n                                    - `delivered_at_sc` — Доставлен в сортировочный/распределительный центр (СЦ/РЦ)\n                                    - `on_way_to_sc` — В пути в сортировочный центр\n                                    - `on_way_to_dc` — В пути в распределительный центр\n                                    - `on_way_to_pp` — В пути на пункт выдачи\n                                    - `arrived_at_pp` — Прибыл на пункт выдачи\n                                    - `accepted_at_pp` — Приёмка в пункте выдачи\n                                    - `ready_for_pick_up` — Готов к выдаче\n                                    - `arrived_at_pp` — Поступил на пункт выдачи заказов (ПВЗ)\n                                    - `received_by_client` — Получен клиентом\n                                    - `delivered_at_parcel_locker` — Доставлен в постамат\n                                    - `canceled_by_client` — Покупатель отменил заказ при получении\n                                    - `cancel_after_expiration` — Отмена по сроку хранения\n                                    - `at_courier` — Передан курьеру\n                                    - `moved_to_return_box` — Перемещен в возвратную коробку\n                                    - `accepted_for_return` — Принят к возврату на ПВЗ\n                                    - `created` — Оформлен\n                                    - `canceled_by_seller` — Отменен продавцом\n                                    - `dispatched_by_seller` — Отгружено по данным продавца\n                                    - `delivered` — Заказ выдан\n                                    - `on_way` — В пути\n                                    - `arrived_at_wb_wh` — Поступил на склад WB\n                                    - `dispatched_from_wh` — Отправлен со склада\n                                    - `customs_clearance` — Таможенное оформление\n                                    - `customs_clearance_completed` — Выпущен таможней\n                                    - `departed_from_origin_country` — Отправлен из страны продавца\n                                    - `arrived_in_destination_country` — Прибытие в страну назначения\n                                    - `on_way_to_wb_sc` — Отправлен до сортировочного центра (СЦ) WB\n                                    - `accepted_at_wb_sc` — Принят СЦ WB\n                                    - `canceled` — Отмена\n                                    - `failed_to_reach_client` — Не дозвонились до клиента\n                                example: SORTED\n                        orderID:\n                          description: ID сборочного задания\n                          type: integer\n                          example: 123456789\n        '400':\n          description: Неправильный запрос\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/orders/client:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      summary: Заказы с информацией по клиенту\n      tags:\n        - Сборочные задания FBS\n      description: |\n        Метод позволяет получать информацию о покупателе по ID сборочного задания.\n\n        Только для трансграничных поставок из **Турции**.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/OrdersRequestAPI'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/CrossborderTurkeyClientInfoResp'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/supplies:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Поставки FBS\n      summary: Создать новую поставку\n      description: |\n        Метод создаёт новую [поставку](/openapi/orders-fbs#tag/Postavki-FBS/paths/~1api~1v3~1supplies~1%7BsupplyId%7D/get).\n\n        Ограничения:\n        - Только для [сборочных заданий](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders/get) по модели FBS.\n        - При добавлении в поставку все передаваемые сборочные задания в [статусе](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders~1status/post) `new` будут автоматически переведены в статус `confirm` — на сборке.\n        - Если вы переведёте сборочное задание в статус `cancel` — отмена продавцом, прикрепленное сборочное задание автоматически удалится из поставки.\n        - Поставку можно собрать только из сборочных заданий (заказов) одного габаритного типа `cargoType`. Новая поставка не обладает габаритным признаком, она приобретает габаритный признак первого заказа, добавленного в поставку.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                name:\n                  type: string\n                  minLength: 1\n                  maxLength: 128\n                  description: Наименование поставки\n                  example: Тестовая поставка\n      responses:\n        '201':\n          description: Создано\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  id:\n                    type: string\n                    nullable: false\n                    description: ID поставки\n                    example: WB-GI-1234567\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectRequestBody:\n                  $ref: '#/components/examples/IncorrectRequestBody'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n    get:\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Поставки FBS\n      summary: Получить список поставок\n      description: |\n        Метод возвращает список [поставок](/openapi/orders-fbs#tag/Postavki-FBS/paths/~1api~1v3~1supplies~1%7BsupplyId%7D/get).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Limit'\n        - $ref: '#/components/parameters/Next'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                nullable: false\n                properties:\n                  next:\n                    $ref: '#/components/schemas/Next'\n                  supplies:\n                    type: array\n                    nullable: false\n                    description: Список поставок\n                    items:\n                      $ref: '#/components/schemas/Supply'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/supplies/{supplyId}/orders:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    patch:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Поставки FBS\n      summary: Добавить сборочные задания к поставке\n      description: |\n        Метод добавляет до 100 [сборочных заданий](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders/get) к поставке и переводит их в [статус](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders~1status/post) `confirm` — на сборке.\n\n        Может перемещать сборочные задания:\n          - между активными поставками\n          - из закрытой поставки в активную, если сборочные задания требуют [повторной отгрузки](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1supplies~1orders~1reshipment/get)\n\n        <div class=\"description_important\">\n          В пустую поставку можно добавить сборочные задания любого габаритного типа. Поставка приобретает габаритный тип первого добавленного сборочного задания <a href =\"./orders-fbs#tag/Postavki-FBS/paths/~1api~1v3~1supplies~1%7BsupplyId%7D/get\">из поля</a> <code>cargoType</code>.\n          <br>\n          После этого в поставку можно добавить сборочные задания только того же габаритного типа, что и у поставки.\n         </div>\n\n        <div class=\"description_important\">\n        В поставку нельзя добавить сборочные задания, поступившие на разные склады.\n        </div>\n        <div class=\"description_important\">\n        В пустую поставку можно добавить сборочные задания трансграничных или внутренних поставок.\n        После этого поставка приобретает тип первого добавленного сборочного задания из поля <code>crossBorderType</code>.\n        Далее в неё можно добавить только сборочные задания такого же типа.\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Supply'\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                orders:\n                  type: array\n                  minItems: 1\n                  maxItems: 100\n                  description: ID сборочных заданий\n                  example:\n                    - 5632423\n                    - 3453452\n                    - 7654533\n                    - 4529544\n                  items:\n                    type: integer\n      responses:\n        '204':\n          description: Сборочные задания закреплены за поставкой\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '409':\n          description: Ошибка добавления сборочного задания к поставке\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                FailedToAddSupplyOrder:\n                  $ref: '#/components/examples/FailedToAddSupplyOrder'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/supplies/{supplyId}:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Поставки FBS\n      summary: Получить информацию о поставке\n      description: |\n        Метод возвращает подробную информацию о поставке.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Supply'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Supply'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '429':\n          $ref: '#/components/responses/429'\n    delete:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Поставки FBS\n      summary: Удалить поставку\n      description: |\n        Метод удаляет [поставку](/openapi/orders-fbs#tag/Postavki-FBS/paths/~1api~1v3~1supplies~1%7BsupplyId%7D/get), если она активна и за ней не закреплено ни одно [сборочное задание](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders/get).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Supply'\n      responses:\n        '204':\n          description: Удалено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '409':\n          description: За поставкой закреплены сборочные задания\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                SupplyHasOrders:\n                  $ref: '#/components/examples/SupplyHasOrders'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/supplies/{supplyId}/order-ids:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: marketplace\n      tags:\n        - Поставки FBS\n      summary: Получить ID сборочных заданий поставки\n      description: |\n        Метод возвращает список ID сборочных заданий, закреплённых за поставкой.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - name: supplyId\n          in: path\n          description: ID поставки\n          required: true\n          schema:\n            type: string\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/v3.SupplyOrderIDsAPI'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/supplies/{supplyId}/deliver:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    patch:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Поставки FBS\n      summary: Передать поставку в доставку\n      description: |\n        Метод закрывает [поставку](/openapi/orders-fbs#tag/Postavki-FBS/paths/~1api~1v3~1supplies~1%7BsupplyId%7D/get) и переводит все [сборочные задания](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders/get) в ней в [статус](/openapi/orders-fbs#tag/Sborochnye-zadaniya-FBS/paths/~1api~1v3~1orders~1status/post) `complete` — в доставке. После закрытия поставки добавить новые сборочные задания к ней нельзя.\n        <br><br>\n        Если поставка не была передана в доставку, то при приёмке первого товара поставка автоматически закроется.\n        <br><br>\n        Передать поставку в доставку можно, только если в ней:\n          - есть хотя бы одно сборочное задание\n          - для всех сборочных заданий указана обязательная маркировка\n          - маркировка всех сборочных заданий прошла проверку\n\n        Если поставка содержит сборочные задания с обязательным УИН, убедитесь, что вы заранее создали и загрузили спецификацию с договором на доставку. [ГИИС ДМДК](https://minfin.gov.ru/ru/perfomance/jewels/dmdk) требуется около 30 минут для обработки изменений в статусах УИН.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Supply'\n      responses:\n        '204':\n          description: Передано в доставку\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '409':\n          description: Ошибка закрытия поставки\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/409SupplyDeliverError'\n              examples:\n                SupplyHasZeroOrders:\n                  $ref: '#/components/examples/SupplyHasZeroOrders'\n                MetaValidationFail:\n                  $ref: '#/components/examples/MetaValidationFail'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/supplies/{supplyId}/barcode:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Поставки FBS\n      summary: Получить QR-код поставки\n      description: |\n        Метод возвращает QR-код [поставки](/openapi/orders-fbs#tag/Postavki-FBS/paths/~1api~1v3~1supplies~1%7BsupplyId%7D/get) в форматах:\n          - SVG\n          - ZPLV (вертикальный)\n          - ZPLH (горизонтальный)\n          - PNG\n\n        QR-код поставки можно получить, только если поставка [передана в доставку](/openapi/orders-fbs#tag/Postavki-FBS/paths/~1api~1v3~1supplies~1%7BsupplyId%7D~1deliver/patch).\n        <br><br>\n        Размер — 580x400 px.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Supply'\n        - name: type\n          in: query\n          required: true\n          description: Тип стикера\n          schema:\n            type: string\n            enum:\n              - svg\n              - zplv\n              - zplh\n              - png\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                nullable: false\n                properties:\n                  barcode:\n                    type: string\n                    nullable: false\n                    description: Закодированное значение стикера (ID поставки)\n                    example: WB-GI-12345678\n                  file:\n                    type: string\n                    format: byte\n                    nullable: false\n                    description: Полное представление стикера в заданном формате (кодировка base64)\n                    example: U3dhZ2dlciByb2Nrcw==\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '409':\n          description: Ошибка запроса данных\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                SupplyNotClosed:\n                  $ref: '#/components/examples/SupplyNotClosed'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/supplies/{supplyId}/trbx:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Поставки FBS\n      summary: Получить список грузомест поставки\n      description: |\n        Возвращает список грузомест поставки.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Supply'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  trbxes:\n                    type: array\n                    items:\n                      $ref: '#/components/schemas/SupplyTrbx'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '429':\n          $ref: '#/components/responses/429'\n    post:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Поставки FBS\n      summary: Добавить грузоместа к поставке\n      description: |\n        Метод добавляет требуемое количество [грузомест](/openapi/orders-fbs#tag/Postavki-FBS/paths/~1api~1v3~1supplies~1%7BsupplyId%7D~1trbx/get) в [поставку](/openapi/orders-fbs#tag/Postavki-FBS/paths/~1api~1v3~1supplies~1%7BsupplyId%7D/get).\n        <br>\n        <br>\n        Грузоместа необходимо добавлять только в поставки, отгружаемые на ПВЗ.\n        <br>\n        Грузоместа можно добавить только в открытую поставку. Вы можете добавить столько же грузомест, сколько всего товаров в поставке, плюс ещё один.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Supply'\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - amount\n              properties:\n                amount:\n                  type: integer\n                  minimum: 1\n                  maximum: 1000\n                  description: Количество грузомест, которые необходимо добавить к поставке\n                  example: 4\n      responses:\n        '201':\n          description: Создано\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  trbxIds:\n                    type: array\n                    description: Список ID грузомест, которые были созданы\n                    minItems: 1\n                    items:\n                      type: string\n                      example: WB-TRBX-1234567\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '429':\n          $ref: '#/components/responses/429'\n    delete:\n      x-readonly-method: false\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Поставки FBS\n      summary: Удалить грузоместа из поставки\n      description: |\n        Метод удаляет грузоместа из поставки.\n        <br><br>\n        Можно удалить только пока поставка на сборке.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Supply'\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - trbxIds\n              properties:\n                trbxIds:\n                  type: array\n                  description: Список ID грузомест, которые необходимо удалить\n                  items:\n                    type: string\n                    example: WB-TRBX-1234567\n      responses:\n        '204':\n          description: Удалено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v3/supplies/{supplyId}/trbx/stickers:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://marketplace-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      x-readonly-method: true\n      x-category: marketplace\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Поставки FBS\n      summary: Получить стикеры грузомест поставки\n      description: |\n        Метод возвращает QR-стикеры в форматах:\n          - SVG\n          - ZPLV (вертикальный)\n          - ZPLH (горизонтальный)\n          - PNG\n        <br><br>\n        Размер стикеров — 580x400 px.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов.\n\n        <hr>\n\n        В <a href='/sandbox'>песочнице</a> — максимум 1 запрос в секунду суммарно для всех методов <strong>Маркетплейса</strong>.\n\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/Supply'\n        - name: type\n          in: query\n          required: true\n          description: Тип стикера\n          schema:\n            type: string\n            enum:\n              - svg\n              - zplv\n              - zplh\n              - png\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - trbxIds\n              properties:\n                trbxIds:\n                  type: array\n                  description: Список ID грузомест, по которым необходимо вернуть стикеры\n                  items:\n                    type: string\n                    example: WB-TRBX-1234567\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                nullable: false\n                properties:\n                  stickers:\n                    type: array\n                    minItems: 1\n                    items:\n                      $ref: '#/components/schemas/TrbxStickers'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              examples:\n                IncorrectParameter:\n                  $ref: '#/components/examples/IncorrectParameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          $ref: '#/components/responses/AccessDenied'\n        '404':\n          $ref: '#/components/responses/NotFound'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/fbs/orders/archive:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n    get:\n      tags:\n        - Сборочные задания FBS\n      summary: Получить список архивных сборочных заданий\n      x-readonly-method: true\n      x-category: marketplace\n      description: |\n        Метод возвращает сборочные задания, созданные более 3 месяцев назад.<br>\n        Часть сборочных заданий попадает в архив позже, чем через 3 месяца после создания, так как поставка переходит в архив только после того, как все заказы в ней будут завершены.\n        Например, так происходит, если продавец не доставил один из заказов в поставке и заказ был отменён автоматически через несколько дней.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n\n        </div>\n      parameters:\n        - name: year\n          in: query\n          description: Год создания заказа\n          example: 2023\n          required: true\n          schema:\n            type: integer\n        - name: month\n          in: query\n          description: Месяц создания заказа\n          example: 2\n          required: true\n          schema:\n            type: integer\n            minimum: 1\n            maximum: 12\n        - name: next\n          in: query\n          description: Параметр пагинации. Устанавливает значение, с которого надо получить следующий пакет данных. Для получения полного списка данных должен быть равен `0` в первом запросе. Для следующих запросов необходимо брать значения из одноимённого поля в ответе.\n          required: true\n          example: 0\n          schema:\n            type: integer\n            format: int64\n        - name: limit\n          in: query\n          description: Количество сборочных заданий в ответе\n          required: true\n          example: 150\n          schema:\n            type: integer\n            format: int32\n            minimum: 100\n            maximum: 1000\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/v3.ArchiveOrders'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/v3.APIErrorV2'\n              examples:\n                BadRequest:\n                  $ref: '#/components/examples/APIError400V2'\n        '401':\n          $ref: '#/components/responses/401-2'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/v3.APIErrorV2'\n              examples:\n                AccessDenied:\n                  $ref: '#/components/examples/APIError403V2'\n        '429':\n          $ref: '#/components/responses/429-2'\n  /api/marketplace/v3/fbs/settings/autoreturns:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n    get:\n      x-readonly-method: true\n      x-token-types:\n        - personal\n      x-category: marketplace\n      operationId: getMarketplaceV3FbsSettingsAutoreturns\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Настройки автовозврата\n      summary: Получить настройки автовозврата продавца\n      description: |\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену\n        </div>\n\n        Метод возвращает информацию о настройках автовозврата, установленных продавцом.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n\n        </div>\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                required:\n                  - type\n                properties:\n                  type:\n                    type: string\n                    example: allToWarehouse\n                    nullable: false\n                    description: |\n                      Тип автовозврата:\n                        - `allToWarehouse` — все товары отправляются на склад WB, кроме товаров тех [предметов](/openapi/orders-fbs#tag/autoreturnSettings/operation/getMarketplaceV3FbsSettingsAutoreturnsSubcategoriesRestricted), которые автоматически возвращаются в ПВЗ\n                        - `allToPickupPoint` — все товары отправляются на пункт выдачи заказов\n                        - `manual` — используются ручные настройки\n                    enum:\n                      - allToWarehouse\n                      - allToPickupPoint\n                      - manual\n        '401':\n          $ref: '#/components/responses/401'\n        '429':\n          $ref: '#/components/responses/429'\n    patch:\n      x-readonly-method: false\n      x-token-types:\n        - personal\n      x-category: marketplace\n      operationId: patchMarketplaceV3FbsSettingsAutoreturns\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Настройки автовозврата\n      summary: Обновить настройки автовозврата продавца\n      description: |\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену\n        </div>\n\n        Метод устанавливает настройки автовозврата продавца для малогабаритных товаров — `\"cargoType\":1`.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - type\n              properties:\n                type:\n                  type: string\n                  example: allToWarehouse\n                  description: |\n                    Тип автовозврата малогабаритных товаров:\n                      - `allToWarehouse` — отправлять все товары на склад WB, кроме товаров тех [предметов](/openapi/orders-fbs#tag/autoreturnSettings/operation/getMarketplaceV3FbsSettingsAutoreturnsSubcategoriesRestricted), которые автоматически возвращаются в ПВЗ\n                      - `allToPickupPoint` — отправлять все товары на пункт выдачи заказов\n                      - `manual` — использовать ручные настройки\n                  enum:\n                    - allToWarehouse\n                    - allToPickupPoint\n                    - manual\n      responses:\n        '204':\n          description: Обновлено\n        '400':\n          description: Неправильный запрос\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/AutoreturnError400'\n              examples:\n                BadRequest:\n                  $ref: '#/components/examples/AutoreturnError400'\n        '401':\n          $ref: '#/components/responses/401'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/fbs/settings/autoreturns/items:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n    post:\n      x-readonly-method: true\n      x-token-types:\n        - personal\n      x-category: marketplace\n      operationId: postMarketplaceV3FbsSettingsAutoreturnsItems\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Настройки автовозврата\n      summary: Получить настройки автовозврата товаров\n      description: |\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену\n        </div>\n\n        Метод возвращает настройки автовозврата товаров.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - chrtIds\n              properties:\n                chrtIds:\n                  type: array\n                  example:\n                    - 111111\n                    - 222222\n                  minItems: 1\n                  maxItems: 1000\n                  description: Список ID размеров товаров в системе WB\n                  items:\n                    type: integer\n                    format: int64\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                required:\n                  - results\n                example:\n                  results:\n                    - success: true\n                      chrtId: 111111\n                      type: byWarehouse\n                      changeable: true\n                    - error:\n                        - code: 404\n                          detail: NotFound\n                      chrtId: 222222\n                properties:\n                  results:\n                    type: array\n                    items:\n                      type: object\n                      required:\n                        - chrtId\n                      properties:\n                        success:\n                          type: boolean\n                          description: |\n                            - `true` — настройки автовозврата товара успешно получены\n                        chrtId:\n                          type: integer\n                          description: ID размера товара в системе WB\n                        type:\n                          type: string\n                          enum:\n                            - auto\n                            - byWarehouse\n                            - byPickupPoint\n                            - byCourier\n                          description: |\n                            Куда будет возвращён товар:\n                              - `auto` — место возврата определяется автоматически\n                              - `byWarehouse` — на склад WB\n                              - `byPickupPoint` — на пункт выдачи заказов\n                              - `byCourier` — продавцу курьером. Всегда для товаров тех [предметов](/openapi/orders-fbs#tag/autoreturnSettings/operation/getMarketplaceV3FbsSettingsAutoreturnsSubcategoriesRestricted), которые автоматически возвращаются в ПВЗ\n                        changeable:\n                          type: boolean\n                          description: |\n                            - `true` — настройки автовозврата товара можно изменить\n                        error:\n                          items:\n                            type: object\n                            required:\n                              - code\n                              - detail\n                            properties:\n                              code:\n                                type: integer\n                                description: Код ошибки\n                              detail:\n                                type: string\n                                description: |\n                                  Дополнительная информация об ошибке\n                          type: array\n                          description: Детали ошибки\n        '400':\n          description: Неправильный запрос\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/AutoreturnError400'\n              examples:\n                BadRequest:\n                  $ref: '#/components/examples/AutoreturnError400'\n        '401':\n          $ref: '#/components/responses/401'\n        '429':\n          $ref: '#/components/responses/429'\n    patch:\n      x-readonly-method: false\n      x-token-types:\n        - personal\n      x-category: marketplace\n      operationId: patchMarketplaceV3FbsSettingsAutoreturnsItems\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Настройки автовозврата\n      summary: Обновить настройки автовозврата товаров\n      description: |\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену\n        </div>\n\n        Метод устанавливает настройки автовозврата малогабаритных товаров — `\"cargoType\":1`.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - type\n                - chrtIds\n              properties:\n                chrtIds:\n                  type: array\n                  maxItems: 1000\n                  example:\n                    - 111111\n                    - 222222\n                  description: |\n                    Список ID размеров товаров в системе WB\n                  items:\n                    type: integer\n                type:\n                  type: string\n                  example: byWarehouse\n                  description: |\n                    Тип автовозврата малогабаритных товаров:\n                      - `byWarehouse` — все товары отправляются на склад WB\n                      - `byPickupPoint` — все товары отправляются на пункт выдачи заказов\n                  enum:\n                    - byWarehouse\n                    - byPickupPoint\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                required:\n                  - results\n                example:\n                  results:\n                    - success: true\n                      chrtId: 111111\n                    - error:\n                        - code: 404\n                          detail: Not Found\n                      chrtId: 222222\n                properties:\n                  results:\n                    type: array\n                    items:\n                      type: object\n                      required:\n                        - chrtId\n                      properties:\n                        chrtId:\n                          type: integer\n                          description: ID размера товара в системе WB\n                        error:\n                          items:\n                            type: object\n                            required:\n                              - code\n                              - detail\n                            properties:\n                              code:\n                                type: integer\n                                description: Код ошибки\n                              detail:\n                                type: string\n                                description: |\n                                  Дополнительная информация об ошибке:\n                                    - `Not Found` — ID размера товара не найден или указан ID размера немалогабаритного товара\n                          description: Детали ошибки\n                        success:\n                          type: boolean\n                          description: |\n                            - `true` — настройки автовозврата товара обновлены\n        '400':\n          description: Неправильный запрос\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/AutoreturnError400'\n              examples:\n                BadRequest:\n                  $ref: '#/components/examples/AutoreturnError400'\n                SupplierSettingMustBeManual:\n                  $ref: '#/components/examples/SupplierSettingMustBeManual'\n        '401':\n          $ref: '#/components/responses/401'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/marketplace/v3/fbs/settings/autoreturns/subcategories/restricted:\n    servers:\n      - url: https://marketplace-api.wildberries.ru\n        description: |\n          **Prod**\n    get:\n      x-readonly-method: true\n      x-token-types:\n        - personal\n      x-category: marketplace\n      operationId: getMarketplaceV3FbsSettingsAutoreturnsSubcategoriesRestricted\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Настройки автовозврата\n      summary: Получить предметы, которые не хранятся на складах WB\n      description: |\n        <div class=\"description_token\">\n            Метод <a href=\"/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API\">доступен</a> по\n                <strong>Персональному</strong> токену\n        </div>\n\n        Метод возвращает список ID предметов, товары которых не могут храниться на складах WB и будут возвращены в ПВЗ автоматически.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для методов <strong>сборочных заданий, поставок, пропусков и настроек автовозврата FBS</strong>:\n\n        | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- |\n        | 1 мин | 300 запросов | 200 мс | 20 запросов |\n\n        Один запрос с кодами ответов <code>4XX</code> учитывается как 10 запросов\n\n        </div>\n      parameters:\n        - name: next\n          in: query\n          description: Параметр пагинации. Устанавливает значение, с которого надо получить следующий пакет данных. Для получения полного списка данных должен быть равен `0` в первом запросе. Для следующих запросов необходимо брать значения из одноимённого поля в ответе.\n          required: true\n          example: 0\n          schema:\n            type: integer\n            format: int64\n        - name: limit\n          in: query\n          description: Количество предметов в ответе\n          required: true\n          example: 1000\n          schema:\n            type: integer\n            format: int32\n            minimum: 100\n            maximum: 1000\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                required:\n                  - next\n                  - data\n                example:\n                  next: 300\n                  data:\n                    - subjectId: 406\n                    - subjectId: 3109\n                    - subjectId: 4556\n                properties:\n                  next:\n                    description: Параметр пагинации. Содержит значение, которое необходимо указать в запросе для получения следующего пакета данных\n                    type: integer\n                    format: int64\n                    nullable: true\n                  data:\n                    type: array\n                    description: Список ID предметов, товары которых не хранятся на складах WB\n                    items:\n                      type: object\n                      required:\n                        - subjectId\n                      properties:\n                        subjectId:\n                          type: integer\n                          description: ID предмета\n        '400':\n          description: Неправильный запрос\n          content:\n            application/problem+json:\n              schema:\n                $ref: '#/components/schemas/AutoreturnError400'\n              examples:\n                BadRequest:\n                  $ref: '#/components/examples/AutoreturnError400Parameter'\n        '401':\n          $ref: '#/components/responses/401'\n        '429':\n          $ref: '#/components/responses/429'\ncomponents:\n  securitySchemes:\n    HeaderApiKey:\n      type: apiKey\n      name: Authorization\n      in: header\n  parameters:\n    Supply:\n      name: supplyId\n      in: path\n      required: true\n      description: ID поставки\n      schema:\n        type: string\n        example: WB-GI-1234567\n    Order:\n      name: orderId\n      in: path\n      required: true\n      description: ID сборочного задания\n      schema:\n        type: integer\n        format: int64\n        example: 5632423\n    Pass:\n      name: passId\n      in: path\n      required: true\n      description: ID пропуска\n      schema:\n        type: integer\n        format: int64\n        example: 45\n    Next:\n      name: next\n      in: query\n      required: true\n      schema:\n        type: integer\n        format: int64\n      description: Параметр пагинации. Устанавливает значение, с которого надо получить следующий пакет данных. Для получения полного списка данных должен быть равен `0` в первом запросе. Для следующих запросов необходимо брать значения из одноимённого поля в ответе.\n    Limit:\n      name: limit\n      in: query\n      required: true\n      schema:\n        type: integer\n        minimum: 1\n        maximum: 1000\n      description: Параметр пагинации. Устанавливает предельное количество возвращаемых данных.\n  examples:\n    LowExpirationDate:\n      description: Указан срок меньше допустимого\n      value:\n        code: LowExpirationDate\n        message: Не удалось обновить срок годности. Указан срок меньше допустимого\n    IncorrectRequestBody:\n      value:\n        code: IncorrectRequestBody\n        message: Некорректное тело запроса\n    WarehouseNameInvalid:\n      value:\n        code: WarehouseNameInvalid\n        message: Некорректное имя склада\n    IncorrectRequest:\n      value:\n        code: IncorrectRequest\n        message: Переданы некорректные данные\n    IncorrectParameter:\n      value:\n        code: IncorrectParameter\n        message: Передан некорректный параметр\n    MetaKeyNotRequired:\n      description: Указанный идентификатор маркировки недопустим для этого сборочного задания. Вы можете закрепить за сборочным заданием только доступные для него идентификаторы маркировки.\n      value:\n        code: MetaKeyNotRequired\n        message: Order doesn't require ID\n    CustomsDeclarationIsRequired:\n      value:\n        code: CustomsDeclarationIsRequired\n        message: Customs declaration is required\n    FailedToUpdateMeta:\n      value:\n        code: FailedToUpdateMeta\n        message: Failed to update the label identifiers of the assembly order. Make sure the assembly order meets all the necessary requirements.\n    SupplyHasOrders:\n      value:\n        code: SupplyHasOrders\n        message: Не удалось обработать поставку. Убедитесь, что за ней не осталось закреплённых сборочных заданий.\n    SupplyHasZeroOrders:\n      value:\n        code: SupplyHasZeroOrders\n        message: Не удалось обработать поставку. Убедитесь, что за ней закреплён хотя бы одно сборочное задание.\n    MetaValidationFail:\n      description: Идентификаторы маркировки не прошли валидацию\n      value:\n        code: MetaValidationFail\n        message: Fix them to dispatch items\n        data:\n          orders:\n            - id: 123456789\n              metaDetails:\n                - key: uin\n                  value: 'null'\n                  decision: uinBadStatus\n    SupplyNotClosed:\n      value:\n        code: SupplyNotClosed\n        message: Поставка не передана в доставку\n    FailedToAddSupplyOrder:\n      value:\n        code: FailedToAddSupplyOrder\n        message: Не удалось закрепить сборочное задание за поставкой. Убедитесь, что сборочное задание и поставка удовлетворяют всем необходимым требованиям.\n    StatusMismatch:\n      value:\n        code: StatusMismatch\n        message: Несоответствие статусов, проверьте их правильность\n    StatusChangeNotAllowed:\n      value:\n        code: StatusChangeNotAllowed\n        message: Задание перейдёт в завершенные после сканирования на пункте выдачи заказов (ПВЗ)\n    APIError400V2:\n      value:\n        code: BadRequest\n        detail: Incorrect parameter\n        errors:\n          - location: query.next\n            message: expected integer\n            value: 1w\n        origin: marketplace-public-api\n        requestId: a0b5907c-2978-4db6-9a59-00666e8b8d54\n        status: 400\n        title: IncorrectParameter\n    AutoreturnError400:\n      value:\n        detail: Incorrect required body\n        title: IncorrectRequestBody\n    AutoreturnError400Parameter:\n      value:\n        detail: Incorrect parameter\n        title: IncorrectParameter\n    SupplierSettingMustBeManual:\n      value:\n        detail: Supplier auto-return setting must be in `manual` mode\n        title: SupplierSettingMustBeManual\n    APIError403V2:\n      value:\n        code: AccessDenied\n        detail: ''\n        errors:\n          - location: ''\n            message: ''\n            value: 0\n        origin: marketplace-public-api\n        requestId: a0b5907c-2978-4db6-9a59-00666e8b8d54\n        status: 403\n        title: AccessDenied\n  responses:\n    '401':\n      description: Не авторизован\n      content:\n        application/json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки\n              code:\n                type: string\n                description: Внутренний код ошибки\n              requestId:\n                type: string\n                description: Уникальный ID запроса\n              origin:\n                type: string\n                description: ID внутреннего сервиса WB\n              status:\n                type: number\n                description: HTTP статус-код\n              statusText:\n                type: string\n                description: Расшифровка HTTP статус-кода\n              timestamp:\n                type: string\n                format: date-time\n                description: Дата и время запроса\n          example:\n            title: unauthorized\n            detail: 'token problem; token is malformed: could not base64 decode signature: illegal base64 data at input byte 84'\n            code: 07e4668e--a53a3d31f8b0-[UK-oWaVDUqNrKG]; 03bce=277; 84bd353bf-75\n            requestId: 7b80742415072fe8b6b7f7761f1d1211\n            origin: s2s-api-auth-catalog\n            status: 401\n            statusText: Unauthorized\n            timestamp: '2024-09-30T06:52:38Z'\n    '402':\n      description: Требуется платёж\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки. Ошибка возвращается только сервисам из [Каталога решений для бизнеса](/business-solutions)\n          example:\n            title: payment required\n            detail: wb solution for business has insufficient funds on its balance. please top up the balance in the company's personal account https://dev.wildberries.ru/company\n    '429':\n      description: Слишком много запросов\n      content:\n        application/json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки\n              code:\n                type: string\n                description: Внутренний код ошибки\n              requestId:\n                type: string\n                description: Уникальный ID запроса\n              origin:\n                type: string\n                description: ID внутреннего сервиса WB\n              status:\n                type: number\n                description: HTTP статус-код\n              statusText:\n                type: string\n                description: Расшифровка HTTP статус-кода\n              timestamp:\n                type: string\n                format: date-time\n                description: Дата и время запроса\n          example:\n            title: too many requests\n            detail: limited by c122a060-a7fb-4bb4-abb0-32fd4e18d489\n            code: 07e4668e-ac2242c5c8c5-[UK-4dx7JUdskGZ]\n            requestId: 9d3c02cc698f8b041c661a7c28bed293\n            origin: s2s-api-auth-catalog\n            status: 429\n            statusText: Too Many Requests\n            timestamp: '2024-09-30T06:52:38Z'\n    NotFound:\n      description: Не найдено\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n          example:\n            code: NotFound\n            message: Не найдено\n    AccessDenied:\n      description: Доступ запрещён\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n          example:\n            code: AccessDenied\n            message: Доступ запрещён\n    401-2:\n      description: Не авторизован\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки\n              code:\n                type: string\n                description: Внутренний код ошибки\n              requestId:\n                type: string\n                description: Уникальный ID запроса\n              origin:\n                type: string\n                description: ID внутреннего сервиса WB\n              status:\n                type: number\n                description: HTTP статус-код\n              statusText:\n                type: string\n                description: Расшифровка HTTP статус-кода\n              timestamp:\n                type: string\n                format: date-time\n                description: Дата и время запроса\n          example:\n            title: unauthorized\n            detail: 'token problem; token is malformed: could not base64 decode signature: illegal base64 data at input byte 84'\n            code: 07e4668e--a53a3d31f8b0-[UK-oWaVDUqNrKG]; 03bce=277; 84bd353bf-75\n            requestId: 7b80742415072fe8b6b7f7761f1d1211\n            origin: s2s-api-auth-catalog\n            status: 401\n            statusText: Unauthorized\n            timestamp: '2024-09-30T06:52:38Z'\n    429-2:\n      description: Слишком много запросов\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки\n              code:\n                type: string\n                description: Внутренний код ошибки\n              requestId:\n                type: string\n                description: Уникальный ID запроса\n              origin:\n                type: string\n                description: ID внутреннего сервиса WB\n              status:\n                type: number\n                description: HTTP статус-код\n              statusText:\n                type: string\n                description: Расшифровка HTTP статус-кода\n              timestamp:\n                type: string\n                format: date-time\n                description: Дата и время запроса\n          example:\n            title: too many requests\n            detail: limited by c122a060-a7fb-4bb4-abb0-32fd4e18d489\n            code: 07e4668e-ac2242c5c8c5-[UK-4dx7JUdskGZ]\n            requestId: 9d3c02cc698f8b041c661a7c28bed293\n            origin: s2s-api-auth-catalog\n            status: 429\n            statusText: Too Many Requests\n            timestamp: '2024-09-30T06:52:38Z'\n  schemas:\n    v3.ArchiveOrders:\n      type: object\n      description: Список архивных сборочных заданий\n      required:\n        - orders\n        - next\n      properties:\n        next:\n          description: Параметр пагинации. Содержит значение, которое необходимо указать в запросе для получения следующего пакета данных\n          type: integer\n          format: int64\n          nullable: true\n        orders:\n          description: Архивные сборочные задания\n          type: array\n          items:\n            $ref: '#/components/schemas/v3.ArchiveOrder'\n    v3.ArchiveOrder:\n      type: object\n      description: Архивное сборочное задание\n      required:\n        - cargoType\n        - colorCode\n        - createdAt\n        - crossBorder\n        - crossBorderType\n        - id\n        - isZeroOrder\n        - metaDetails\n        - options\n        - orderUid\n        - priceInfo\n        - product\n        - rid\n        - scanPrice\n        - status\n        - stickerId\n        - supplyId\n        - warehouseId\n      properties:\n        cargoType:\n          description: |\n            Тип товара:\n              - `mgt` — малогабаритный товар (МГТ)\n              - `sgt` — сверхгабаритный товар (СГТ)\n              - `kgtPlus` — крупногабаритный товар (КГТ+)\n          type: string\n          example: mgt\n        colorCode:\n          description: Код цвета для колеруемых товаров\n          type: string\n          example: RAL 3017\n          nullable: true\n        createdAt:\n          description: Дата создания заказа\n          type: string\n          example: '2022-05-04'\n        crossBorder:\n          description: Информация о заказе по модели кроссбордер\n          type: object\n          nullable: true\n          properties:\n            parcel:\n              description: ID посылки\n              type: string\n              example: 1Z999AA10123456784\n        crossBorderType:\n          description: |\n            Тип сборочного задания:\n              - `local` — внутренняя поставка\n              - `crossBorder` — трансграничная поставка\n          type: string\n          example: crossBorder\n        id:\n          description: ID сборочного задания\n          type: integer\n          example: 1234567890\n        isZeroOrder:\n          description: |\n            Признак заказа товара с нулевым остатком:\n              - `false` — заказ сделан на товар с ненулевым остатком\n              - `true` — заказ сделан на товар с нулевым остатком\n          type: boolean\n          example: false\n        metaDetails:\n          allOf:\n            - $ref: '#/components/schemas/MetaDetails'\n            - description: Идентификаторы маркировки сборочного задания\n            - {}\n        options:\n          description: Опции заказа\n          type: object\n          properties:\n            isB2B:\n              description: |\n                Признак B2B-продажи:\n                  - `false` — не B2B-продажа\n                  - `true` — B2B-продажа\n              type: boolean\n              example: false\n        orderUid:\n          description: ID транзакции для группировки сборочных заданий. Сборочные задания в одной корзине покупателя будут иметь одинаковый `orderUid`\n          type: string\n          example: 165918930_629fbc924b984618a44354475ca58675\n        priceInfo:\n          description: Информация о цене заказа\n          type: object\n          required:\n            - convertedCurrencyCode\n            - convertedPrice\n            - currencyCode\n            - price\n          properties:\n            convertedCurrencyCode:\n              description: Код валюты страны продавца\n              type: integer\n              example: 643\n            convertedPrice:\n              description: Цена в валюте страны продавца с учетом всех скидок, кроме скидки по WB Кошельку, умноженная на 100\n              type: integer\n              example: 1020\n            currencyCode:\n              description: Код валюты продажи\n              type: integer\n              example: 643\n            price:\n              description: Цена в валюте продажи с учетом всех скидок, кроме скидки по WB Кошельку, умноженная на 100\n              type: integer\n              example: 1020\n        product:\n          description: Информация о товаре\n          type: object\n          required:\n            - article\n            - chrtId\n            - nmId\n            - skus\n          properties:\n            article:\n              description: Артикул продавца\n              type: string\n              example: wv1702fyjh\n            chrtId:\n              description: ID размера товара в системе WB\n              type: integer\n              example: 12345678\n            nmId:\n              description: Артикул WB\n              type: integer\n              example: 370870300\n            skus:\n              description: Список баркодов\n              items:\n                type: string\n              type: array\n              example:\n                - 12345Ejf5\n                - 12345Ejf6\n                - 12345Ejf7\n        rid:\n          description: |\n            Уникальный ID заказа. <br>\n            Примечание: `rid` — это `srid` в ответах методов:\n              - [Заявки покупателей на возврат](./user-communication#tag/buyersReturns/operation/getV1Claims)\n              - [Лента заказов](./analytics#tag/orderFeed/operation/postV1OrderFeed)\n              - [Заказы](./reports#tag/mainReports/operation/getV1SupplierOrders)\n              - [Продажи](./reports#tag/mainReports/operation/getV1SupplierSales)\n              - [Отчёт о возвратах и перемещении товаров](./reports#tag/returnsAndItemMovementReport)\n              - [Детализации к отчётам реализации по ID отчётов](./financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailedReportId)\n              - [Детализации к отчётам реализации за период](./financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailed)\n              - [Детализации к отчётам об издержках на приём платежей по ID отчётов](./financial-reports-and-accounting#tag/financialReports/operation/postV1AcquiringDetailedReportId)\n              - [Детализации к отчётам об издержках на приём платежей за период](./financial-reports-and-accounting#tag/financialReports/operation/postV1AcquiringDetailed)\n          type: string\n          example: f884001e44e511edb8780242ac120002\n        scanPrice:\n          description: Цена приёмки заказа в копейках\n          type: integer\n          nullable: true\n          example: 5200\n        status:\n          description: Последние статусы сборочного задания\n          required:\n            - supplierStatus\n            - wbStatus\n          properties:\n            supplierStatus:\n              description: Статус сборочного задания, установленный продавцом\n              example: complete\n              type: string\n            wbStatus:\n              description: Статус сборочного задания в системе Wildberries\n              example: sent_to_carrier\n              type: string\n          type: object\n        stickerId:\n          description: ID стикера\n          example: 33811984302\n          type: integer\n        supplyId:\n          description: ID поставки\n          example: WB-GI-1234588\n          type: string\n          nullable: true\n        warehouseId:\n          description: ID склада продавца, с которого был отгружен товар\n          example: 55684681\n          type: integer\n    v3.SupplyOrderIDsAPI:\n      type: object\n      properties:\n        orderIds:\n          type: array\n          description: ID сборочных заданий\n          items:\n            type: integer\n          example:\n            - 132334\n            - 203984\n            - 403543\n            - 598349\n    PassOffice:\n      type: object\n      description: Данные о складе, для которого требуется пропуск\n      properties:\n        name:\n          type: string\n          nullable: false\n          description: Название\n          example: Коледино\n        address:\n          type: string\n          nullable: false\n          description: Адрес\n          example: г. Подольск, д. Коледино, ул. Троицкая\n        id:\n          type: integer\n          format: int64\n          nullable: false\n          description: ID\n          example: 1\n    Error:\n      type: object\n      nullable: false\n      properties:\n        code:\n          type: string\n          description: Код ошибки\n          nullable: false\n        message:\n          type: string\n          description: Описание ошибки\n          nullable: false\n        data:\n          type: object\n          description: Дополнительные данные ошибки\n          nullable: true\n    v3.APIErrorV2:\n      required:\n        - title\n        - detail\n      properties:\n        code:\n          description: Код ошибки\n          type: string\n        detail:\n          description: Детали ошибки\n          type: string\n        errors:\n          description: Информация об ошибке\n          items:\n            properties:\n              location:\n                description: Параметр, где произошла ошибка\n                type: string\n              message:\n                description: Текст ошибки\n                type: string\n              value:\n                description: Значение параметра, где произошла ошибка\n            type: object\n          type: array\n        origin:\n          description: ID внутреннего сервиса WB\n          type: string\n        requestId:\n          description: Уникальный ID запроса\n          type: string\n        status:\n          description: HTTP статус-код ответа\n          type: integer\n        title:\n          description: Заголовок ошибки\n          type: string\n      type: object\n    AutoreturnError400:\n      required:\n        - title\n        - detail\n      properties:\n        detail:\n          description: Детали ошибки\n          type: string\n        title:\n          description: Заголовок ошибки\n          type: string\n      type: object\n    409SupplyDeliverError:\n      type: object\n      nullable: false\n      properties:\n        code:\n          type: string\n          description: Код ошибки\n          nullable: false\n        message:\n          type: string\n          description: Описание ошибки\n          nullable: false\n        data:\n          type: object\n          description: Дополнительные данные ошибки\n          nullable: true\n          properties:\n            orders:\n              type: array\n              description: Сборочные задания, идентификаторы маркировки которых не прошли или ещё не завершили проверку\n              items:\n                type: object\n                properties:\n                  id:\n                    type: integer\n                    description: ID сборочного задания\n                  metaDetails:\n                    type: array\n                    description: Информация об ошибках\n                    items:\n                      type: object\n                      properties:\n                        key:\n                          type: string\n                          description: Идентификатор маркировки\n                        value:\n                          type: string\n                          description: Значение идентификатора маркировки\n                        decision:\n                          type: string\n                          description: |\n                            [Статус проверки](/knowledge-base/articles/019e9273-118b-7b69-a25a-ea1d756f05d9/rabota-s-markirovkoi-po-modeli-fbs):\n                            - `imei`\n                              - `pending` — Проверка маркировки продолжается. Дождитесь изменения статуса проверки\n                              - `required` — Маркировка обязательна и не закреплена за сборочным заданием\n                              - `imeiInvalidFormat` — Неверный формат маркировки\n                              - `imeiAlreadySold` — Товар с этим IMEI уже продан\n                            - `uin`\n                              - `required` — Маркировка обязательна и не закреплена за сборочным заданием\n                              - `pending` — Проверка маркировки продолжается. Дождитесь изменения статуса проверки\n                              - `uinInvalidFormat` — Неверный формат маркировки\n                              - `uinBadStatus` — Некорректный статус партии\n                              - `uinBadProcess` — Некорректная стадия обработки\n                              - `uinBadStatusAndBadProcess` — Некорректный статус партии. Некорректная стадия обработки\n                              - `uinNotFound` — Не найден в [ГИИС](https://minfin.gov.ru/ru/perfomance/jewels/dmdk).\n                                При получении этой ошибки убедитесь, что УИН:\n                                  - указан в загруженной спецификации с договором на доставку. Если спецификация загружена более 30 минут назад, [удалите УИН](./orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1v3~1orders~1%7BorderId%7D~1meta/delete) из сборочного задания и [добавьте его](./orders-fbs#tag/fbsLabelIdentifiers/paths/~1api~1v3~1orders~1%7BorderId%7D~1meta~1uin/put) заново\n                                  - зарегистрирован в ГИИС ДМДК\n                                  - указан корректно и считывается с бирки без ошибок\n                                  - находится в обороте\n                            - `sgtin`\n                              - `required` — Маркировка обязательна и не закреплена за сборочным заданием\n                              - `pending` — Проверка маркировки продолжается. Дождитесь изменения статуса проверки\n                              - `sgtinInvalidFormat` — Неверный формат маркировки\n                              - `sgtinNoGS` — Маркировка не содержит GS-разделитель `\\u001d`\n                              - `sgtinHasInvalidSymbols` — Маркировка содержит некорректные символы или пробелы\n                              - `sgtinHasNonLatinSymbols` — Маркировка содержит символы, не относящиеся к специальным или латинице\n                              - `sgtinInvalidPattern` — Структура маркировки некорректна\n                              - `sgtinNotFound` — Маркировка не найдена в [Честном знаке](https://chestnyznak.ru)\n                              - `sgtinEmitted` —  Маркировка эмитирована\n                              - `sgtinApplied` — Не пройдена процедура Ввод в оборот\n                              - `sgtinWrittenOff` — Списан\n                              - `sgtinRetired` — Выбыл\n                              - `sgtinWithdrawn` — Выбыл\n                              - `sgtinDisaggregation` — Расформирован\n                              - `sgtinDisaggregated` — Расформирован\n                              - `sgtinAppliedNotPaid` — Не оплачен\n                            - `gtin`\n                              - `required` — Маркировка обязательна и не закреплена за сборочным заданием\n                            - `expiration`\n                              - `required` — Маркировка обязательна и не закреплена за сборочным заданием\n                            - `customsDeclaration`\n                              - `required` — Маркировка обязательна и не закреплена за сборочным заданием\n    Next:\n      type: integer\n      format: int64\n      nullable: false\n      description: Параметр пагинации. Содержит значение, которое необходимо указать в запросе для получения следующего пакета данных\n      example: 13833711\n    Order:\n      type: object\n      properties:\n        address:\n          type: object\n          nullable: true\n          description: Точный адрес покупателя для доставки, если применимо. Из-за особенностей адреса некоторые поля могут быть пустыми\n          properties:\n            fullAddress:\n              description: Адрес доставки\n              type: string\n              example: Челябинская область, г. Челябинск, 51-я улица Арабкира, д. 10А, кв. 42\n            longitude:\n              type: number\n              format: float64\n              nullable: false\n              description: Долгота\n              example: 44.519068\n            latitude:\n              type: number\n              format: float64\n              nullable: false\n              description: Широта\n              example: 40.20192\n        scanPrice:\n          type: number\n          format: uint32\n          nullable: true\n          description: Цена приёмки в копейках. Отображается после фактической приёмки заказа\n          example: 1500\n        deliveryType:\n          type: string\n          nullable: false\n          description: |\n            Тип доставки:\n            - `fbs` — доставка на склад Wildberries (FBS)\n          enum:\n            - fbs\n        supplyId:\n          type: string\n          description: ID поставки. Возвращается, если заказ закреплён за поставкой\n          example: WB-GI-92937123\n        orderUid:\n          type: string\n          description: ID транзакции для группировки сборочных заданий. Сборочные задания в одной корзине покупателя будут иметь одинаковый `orderUid`\n          example: 165918930_629fbc924b984618a44354475ca58675\n        article:\n          type: string\n          nullable: false\n          description: Артикул продавца\n          example: one-ring-7548\n        colorCode:\n          type: string\n          nullable: false\n          description: Код цвета (только для колеруемых товаров)\n          example: RAL 3017\n        rid:\n          type: string\n          nullable: false\n          description: |\n            Уникальный ID заказа. <br>\n            Примечание: `rid` — это `srid` в ответах методов:\n              - [Заявки покупателей на возврат](./user-communication#tag/buyersReturns/operation/getV1Claims)\n              - [Лента заказов](./analytics#tag/orderFeed/operation/postV1OrderFeed)\n              - [Заказы](./reports#tag/mainReports/operation/getV1SupplierOrders)\n              - [Продажи](./reports#tag/mainReports/operation/getV1SupplierSales)\n              - [Отчет о возвратах и перемещении товаров](./reports#tag/returnsAndItemMovementReport)\n              - [Детализации к отчётам реализации по ID отчётов](./financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailedReportId)\n              - [Детализации к отчётам реализации за период](./financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailed)\n              - [Детализации к отчётам об издержках на приём платежей по ID отчётов](./financial-reports-and-accounting#tag/financialReports/operation/postV1AcquiringDetailedReportId)\n              - [Детализации к отчётам об издержках на приём платежей за период](./financial-reports-and-accounting#tag/financialReports/operation/postV1AcquiringDetailed)\n          example: f884001e44e511edb8780242ac120002\n        createdAt:\n          type: string\n          format: date-time\n          nullable: false\n          description: Дата создания сборочного задания (RFC3339). Часовой пояс — UTC\n          example: '2022-05-04T07:56:29Z'\n        offices:\n          type: array\n          nullable: true\n          description: Список офисов, куда следует привезти товар\n          items:\n            type: string\n            example: Калуга\n        skus:\n          type: array\n          nullable: false\n          description: Список баркодов\n          items:\n            type: string\n            example: '6665956397512'\n        id:\n          type: integer\n          format: int64\n          nullable: false\n          description: ID сборочного задания\n          example: 13833711\n        warehouseId:\n          type: integer\n          nullable: false\n          description: ID склада продавца, на который поступило сборочное задание\n          example: 658434\n        officeId:\n          type: integer\n          format: int64\n          nullable: false\n          description: ID склада WB, к которому привязан склад продавца\n          example: 123\n        nmId:\n          type: integer\n          nullable: false\n          description: Артикул WB\n          example: 12345678\n        chrtId:\n          type: integer\n          nullable: false\n          description: ID размера товара в системе WB\n          example: 987654321\n        price:\n          type: integer\n          nullable: false\n          description: |\n            Цена в валюте продажи с учётом всех скидок, кроме скидки по WB Кошельку, умноженная на 100. Код валюты продажи — в поле `currencyCode`. Предоставляется в информационных целях\n          example: 1014\n        convertedPrice:\n          type: integer\n          nullable: false\n          description: Цена в валюте страны продавца с учетом всех скидок, кроме скидки по WB Кошельку, умноженная на 100. Предоставляется в информационных целях\n          example: 28322\n        currencyCode:\n          type: integer\n          nullable: false\n          description: Код валюты продажи\n          format: ISO 4217\n          example: 933\n        convertedCurrencyCode:\n          type: integer\n          nullable: false\n          description: Код валюты страны продавца\n          format: ISO 4217\n          example: 643\n        cargoType:\n          type: integer\n          nullable: false\n          description: |\n            Тип товара:\n              - `1` — малогабаритный товар (МГТ)\n              - `2` — сверхгабаритный товар (СГТ)\n              - `3` — крупногабаритный товар (КГТ+)\n          enum:\n            - 1\n            - 2\n            - 3\n        crossBorderType:\n          description: |\n            Тип сборочного задания:\n              - `0` — внутренняя поставка\n              - `1` — трансграничная поставка\n          enum:\n            - 0\n            - 1\n          format: int32\n          type: integer\n          example: 1\n          nullable: false\n        comment:\n          description: Комментарий покупателя\n          type: string\n          nullable: false\n          maxLength: 300\n          example: Упакуйте в плёнку, пожалуйста\n        isZeroOrder:\n          type: boolean\n          description: |\n            Признак заказа товара с нулевым остатком:\n              - `false` — заказ сделан на товар с ненулевым остатком\n              - `true` — заказ сделан на товар с нулевым остатком. Такой заказ можно отменить без штрафа за отмену\n          example: false\n        options:\n          type: object\n          description: Опции заказа\n          properties:\n            isB2B:\n              type: boolean\n              description: |\n                Признак B2B-продажи:\n                  - `false` — не B2B-продажа\n                  - `true` — B2B-продажа\n    Supply:\n      type: object\n      properties:\n        id:\n          type: string\n          nullable: false\n          description: ID поставки\n          example: WB-GI-1234567\n        isB2b:\n          type: boolean\n          nullable: true\n          description: |\n            Признак B2B-продажи:\n              - `true` — B2B-продажа\n              - `false` — не B2B-продажа\n              - `null` — признак отсутствует, сборочные задания не добавлены к поставке\n        isPickupPointShipmentAllowed:\n          type: boolean\n          nullable: false\n          example: true\n          description: |\n            Можно ли отгрузить заказ на ПВЗ:\n              - `false` — нет\n              - `true` — да\n        done:\n          type: boolean\n          nullable: false\n          description: |\n            Флаг закрытия поставки:\n              - `true` — закрыта\n              - `false` — открыта\n        createdAt:\n          type: string\n          format: date-time\n          nullable: false\n          description: Дата создания поставки (RFC3339)\n          example: '2022-05-04T07:56:29Z'\n        closedAt:\n          type: string\n          format: date-time\n          nullable: true\n          description: Дата закрытия поставки (RFC3339)\n          example: '2022-05-04T07:56:29Z'\n        scanDt:\n          type: string\n          nullable: true\n          format: date-time\n          description: Дата сканирования поставки или первого заказа (RFC3339)\n          example: '2022-05-04T07:56:29Z'\n        name:\n          type: string\n          nullable: false\n          description: Наименование поставки\n          example: Тестовая поставка\n        cargoType:\n          type: integer\n          nullable: false\n          description: |\n            Тип товара:\n              - `1` — малогабаритный товар (МГТ)\n              - `2` — сверхгабаритный товар (СГТ)\n              - `3` — крупногабаритный товар (КГТ+)\n          enum:\n            - 0\n            - 1\n            - 2\n            - 3\n        crossBorderType:\n          description: |\n            Тип поставки:\n              - `0` — внутренняя поставка\n              - `1` — трансграничная поставка\n              - `null` — значение отсутствует\n          enum:\n            - 0\n            - 1\n          format: int32\n          type: integer\n          example: 1\n          nullable: true\n        destinationOfficeId:\n          type: integer\n          format: int64\n          nullable: true\n          description: ID склада назначения поставки. Если `null`, склад назначения не указан\n          example: 123\n        recommendedWhId:\n          type: integer\n          format: int64\n          description: |\n            ID рекомендуемого склада для приёмки поставки для Москвы и МО. <br>\n            Рекомендуется ближайший к покупателям склад, который определяется автоматически при передаче поставки в доставку с учётом параметров всех сборочных заданий в поставке.<br>\n            Если `0`, рекомендуемый склад не определён\n          example: 123569\n    OrderNew:\n      type: object\n      properties:\n        address:\n          type: object\n          nullable: true\n          description: Точный адрес покупателя для доставки, если применимо. Из-за особенностей адреса некоторые поля могут быть пустыми\n          properties:\n            fullAddress:\n              description: Адрес доставки\n              type: string\n              example: Челябинская область, г. Челябинск, 51-я улица Арабкира, д. 10А, кв. 42\n            longitude:\n              type: number\n              format: float64\n              nullable: false\n              description: Долгота\n              example: 44.519068\n            latitude:\n              type: number\n              format: float64\n              nullable: false\n              description: Широта\n              example: 40.20192\n        ddate:\n          type: string\n          description: |\n            Планируемая дата доставки заказа покупателю.<br>\n            Поле отображается для сборочных заданий со сверхгабаритными товарами `СГТ`, `cargoType: 2`\n          nullable: false\n          example: 17.05.2024\n        sellerDate:\n          type: string\n          nullable: true\n          description: |\n            Рекомендуемая дата доставки СГТ в сортировочный центр или на склад. <br>\n            Поле отображается для сборочных заданий со сверхгабаритными товарами `СГТ`, `cargoType: 2`\n          example: 02.06.2025\n        salePrice:\n          description: |\n            Цена продавца в валюте продажи с учётом скидки продавца, без учёта скидки WB Клуба, умноженная на 100. Предоставляется в информационных целях\n          type: integer\n          nullable: true\n          example: 504600\n        requiredMeta:\n          description: |\n            Список идентификаторов маркировки, которые [необходимо добавить](/knowledge-base/articles/019e9273-118b-7b69-a25a-ea1d756f05d9/rabota-s-markirovkoi-po-modeli-fbs) в сборочное задание, чтобы поставку с этим сборочным заданием можно было перевести в доставку\n          type: array\n          nullable: true\n          items:\n            type: string\n          example:\n            - uin\n        optionalMeta:\n          description: |\n            Список идентификаторов маркировки, которые [можно добавить](/knowledge-base/articles/019e9273-118b-7b69-a25a-ea1d756f05d9/rabota-s-markirovkoi-po-modeli-fbs) в сборочное задание.<br>\n            Поставку со сборочным заданием без этих идентификаторов маркировки можно перевести в доставку, но они могут потребоваться, например, при возврате товара покупателем\n          items:\n            type: string\n          type: array\n          nullable: true\n          example:\n            - sgtin\n        deliveryType:\n          type: string\n          nullable: false\n          description: |\n            Тип доставки:\n            - `fbs` — доставка на склад Wildberries (FBS)\n          enum:\n            - fbs\n        comment:\n          description: Комментарий покупателя\n          type: string\n          nullable: false\n          maxLength: 300\n          example: Упакуйте в плёнку, пожалуйста\n        scanPrice:\n          description: Цена приёмки в копейках. Отображается после фактической приёмки заказа. Для данного метода всегда будет возвращаться `null`. Предоставляется в информационных целях\n          type: number\n          format: uint32\n          nullable: true\n          example: null\n        orderUid:\n          type: string\n          description: ID транзакции для группировки сборочных заданий. Сборочные задания в одной корзине покупателя будут иметь одинаковый `orderUid`\n          example: 165918930_629fbc924b984618a44354475ca58675\n        article:\n          type: string\n          nullable: false\n          description: Артикул продавца\n          example: one-ring-7548\n        colorCode:\n          description: Код цвета (только для колеруемых товаров)\n          type: string\n          nullable: false\n          example: RAL 3017\n        rid:\n          type: string\n          nullable: false\n          description: |\n            Уникальный ID заказа. <br>\n            Примечание: `rid` — это `srid` в ответах методов:\n              - [Заявки покупателей на возврат](./user-communication#tag/buyersReturns/operation/getV1Claims)\n              - [Лента заказов](./analytics#tag/orderFeed/operation/postV1OrderFeed)\n              - [Заказы](./reports#tag/mainReports/operation/getV1SupplierOrders)\n              - [Продажи](./reports#tag/mainReports/operation/getV1SupplierSales)\n              - [Отчёт о возвратах и перемещении товаров](./reports#tag/returnsAndItemMovementReport)\n              - [Детализации к отчётам реализации по ID отчётов](./financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailedReportId)\n              - [Детализации к отчётам реализации за период](./financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailed)\n              - [Детализации к отчётам об издержках на приём платежей по ID отчётов](./financial-reports-and-accounting#tag/financialReports/operation/postV1AcquiringDetailedReportId)\n              - [Детализации к отчётам об издержках на приём платежей за период](./financial-reports-and-accounting#tag/financialReports/operation/postV1AcquiringDetailed)\n          example: f884001e44e511edb8780242ac120002\n        createdAt:\n          type: string\n          format: date-time\n          nullable: false\n          description: Дата создания сборочного задания (RFC3339)\n          example: '2022-05-04T07:56:29Z'\n        offices:\n          type: array\n          nullable: true\n          description: Список офисов, куда следует привезти товар\n          items:\n            type: string\n            example: Калуга\n        skus:\n          type: array\n          nullable: false\n          description: Список баркодов\n          items:\n            type: string\n            example: '6665956397512'\n        id:\n          type: integer\n          format: int64\n          nullable: false\n          description: ID сборочного задания\n          example: 13833711\n        warehouseId:\n          type: integer\n          nullable: false\n          description: ID склада продавца, на который поступило сборочное задание\n          example: 658434\n        officeId:\n          type: integer\n          format: int64\n          nullable: false\n          description: ID склада WB, к которому привязан склад продавца\n          example: 123\n        nmId:\n          type: integer\n          nullable: false\n          description: Артикул WB\n          example: 123456789\n        chrtId:\n          type: integer\n          nullable: false\n          description: ID размера товара в системе WB\n          example: 987654321\n        price:\n          type: integer\n          nullable: false\n          description: |\n            Цена в валюте продажи с учётом всех скидок, кроме скидки по WB Кошельку, умноженная на 100. Код валюты продажи — в поле `currencyCode`. Предоставляется в информационных целях\n          example: 1014\n        finalPrice:\n          description: Сумма к оплате покупателем в валюте продажи с учетом всех скидок, умноженная на 100. Код валюты продажи указан в поле `currencyCode`. Предоставляется в информационных целях\n          type: integer\n          example: 1014\n        convertedPrice:\n          type: integer\n          nullable: false\n          description: Цена в валюте страны продавца с учетом всех скидок, кроме скидки по WB Кошельку, умноженная на 100. Предоставляется в информационных целях\n          example: 28322\n        convertedFinalPrice:\n          description: Сумма к оплате покупателем в валюте страны продавца с учетом всех скидок, умноженная на 100. Предоставляется в информационных целях\n          type: integer\n          example: 1014\n        currencyCode:\n          type: integer\n          nullable: false\n          description: Код валюты продажи\n          format: ISO 4217\n          example: 933\n        convertedCurrencyCode:\n          type: integer\n          nullable: false\n          description: Код валюты страны продавца\n          format: ISO 4217\n          example: 643\n        cargoType:\n          type: integer\n          nullable: false\n          description: |\n            Тип товара:\n              - `1` — малогабаритный товар (МГТ)\n              - `2` — сверхгабаритный товар (СГТ)\n              - `3` — крупногабаритный товар (КГТ+)\n          enum:\n            - 1\n            - 2\n            - 3\n        crossBorderType:\n          description: |\n            Тип сборочного задания:\n              - `0` — внутренняя поставка\n              - `1` — трансграничная поставка\n          enum:\n            - 0\n            - 1\n          format: int32\n          type: integer\n          example: 1\n          nullable: false\n        isZeroOrder:\n          type: boolean\n          description: |\n            Признак заказа товара с нулевым остатком:\n              - `false` — заказ сделан на товар с ненулевым остатком\n              - `true` — заказ сделан на товар с нулевым остатком. Такой заказ можно отменить без штрафа за отмену\n          example: false\n        isPickupPointShipmentAllowed:\n          type: boolean\n          nullable: false\n          example: true\n          description: |\n            Можно ли отгрузить заказ на ПВЗ:\n              - `false` — нет\n              - `true` — да\n        options:\n          type: object\n          description: Опции заказа\n          properties:\n            isB2B:\n              type: boolean\n              description: |\n                Признак B2B-продажи:\n                  - `false` — не B2B-продажа\n                  - `true` — B2B-продажа\n    SupplyTrbx:\n      type: object\n      properties:\n        id:\n          description: ID грузоместа\n          type: string\n          example: WB-TRBX-1234567\n    TrbxStickers:\n      type: object\n      properties:\n        barcode:\n          type: string\n          minLength: 1\n          description: Закодированное значение стикера\n          example: $WBMP:1:123:1234567\n        file:\n          type: string\n          format: byte\n          minLength: 1\n          description: Полное представление стикера в заданном формате (кодировка base64)\n          example: U3dhZ2dlciByb2Nrcw==\n    MetaDetails:\n      type: array\n      description: Детали маркировки\n      items:\n        type: object\n        properties:\n          key:\n            type: string\n            example: uin\n            description: Идентификатор маркировки\n          value:\n            nullable: true\n            type: string\n            example: null\n            description: Значение идентификатора маркировки\n          decision:\n            type: string\n            example: uinMaySell\n            description: |\n              [Статусы проверки идентификаторов маркировки](/knowledge-base/articles/019e9273-118b-7b69-a25a-ea1d756f05d9/rabota-s-markirovkoi-po-modeli-fbs). <br><br>\n              Статусы проверки `imei`, с которыми поставку можно перевести в доставку:\n                - `filled` — Маркировка закреплена за сборочным заданием, проверка не требуется\n                - `optional` — Маркировка не закреплена за сборочным заданием и не обязательна\n                - `deadlineExceeded` — Проверка маркировки не завершена и будет продолжена. Проверка может завершиться и успешно, и неуспешно\n                - `imeiMaySell` — Товар допущен к продаже. Проверка пройдена\n                - `imeiSoldB2B` — Товар продан покупателю B2B, допущен к продаже повторно. Проверка пройдена\n\n              <br><br>\n              Статусы проверки `imei`, с которыми поставку нельзя перевести в доставку:\n                - `required` — Маркировка обязательна и не закреплена за сборочным заданием. Проверка не пройдена\n                - `pending` — Проверка маркировки продолжается. Дождитесь изменения статуса проверки\n                - `imeiInvalidFormat` — Указан неверный формат маркировки. Проверка не пройдена\n                - `imeiAlreadySold` — Товар с этим IMEI уже продан. Проверка не пройдена\n\n              <br><br>\n              Статусы проверки `uin`, с которыми поставку можно перевести в доставку:\n                - `filled` — Маркировка закреплена за сборочным заданием, проверка не требуется\n                - `deadlineExceeded` — Проверка маркировки не завершена и будет продолжена. Проверка может завершиться и успешно, и неуспешно\n                - `optional` — Маркировка не закреплена за сборочным заданием и не обязательна\n                - `uinMaySell` — Товар допущен к продаже. Проверка пройдена\n\n              <br><br>\n              Статусы проверки `uin`, с которыми поставку нельзя перевести в доставку:\n                - `required` — Маркировка обязательна и не закреплена за сборочным заданием. Проверка не пройдена\n                - `pending` — Проверка маркировки продолжается. Дождитесь изменения статуса проверки\n                - `uinBadStatus` — Некорректный статус партии. Проверка не пройдена\n                - `uinBadProcess` — Некорректная стадия обработки. Проверка не пройдена\n                - `uinBadStatusAndBadProcess` — Некорректный статус партии. Некорректная стадия обработки. Проверка не пройдена\n                - `uinInvalidFormat` — Неверный формат маркировки. Проверка не пройдена\n                - `uinNotFound` — Не найден в [ГИИС](https://minfin.gov.ru/ru/perfomance/jewels/dmdk). Проверка не пройдена.\n                  Статус может означать, что УИН:\n                    - не указан в загруженной спецификации с договором на доставку\n                    - не зарегистрирован в ГИИС ДМДК\n                    - указан некорректно и считывается с бирки с ошибками\n                    - не находится в обороте\n\n              <br><br>\n              Статусы проверки `sgtin`, с которыми поставку можно перевести в доставку:\n                - `filled` — Маркировка закреплена за сборочным заданием, проверка не требуется\n                - `deadlineExceeded` — Проверка маркировки не завершена и будет продолжена. Проверка может завершиться и успешно, и неуспешно\n                - `optional` — Маркировка не закреплена за сборочным заданием и не обязательна\n                - `sgtinIntroduced` — Товар допущен к продаже. Проверка пройдена\n                - `sgtinSoldB2B` — Товар продан покупателю B2B, допущен к продаже повторно. Проверка пройдена\n\n              <br><br>\n              Статусы проверки `sgtin`, с которыми поставку нельзя перевести в доставку:\n                - `required` — Маркировка обязательна и не закреплена за сборочным заданием. Проверка не пройдена\n                - `pending` — Проверка маркировки продолжается. Дождитесь изменения статуса проверки\n                - `sgtinInvalidFormat` — Неверный формат маркировки. Проверка не пройдена\n                - `sgtinNoGS` — Маркировка не содержит GS-разделитель `\\u001d`. Проверка не пройдена\n                - `sgtinHasInvalidSymbols` — Маркировка содержит некорректные символы или пробелы. Проверка не пройдена\n                - `sgtinHasNonLatinSymbols` — Маркировка содержит символы, не относящиеся к специальным или латинице. Проверка не пройдена\n                - `sgtinInvalidPattern` — Структура маркировки некорректна. Проверка не пройдена\n                - `sgtinNotFound` — Маркировка не найдена в [Честном знаке](https://chestnyznak.ru). Проверка не пройдена\n                - `sgtinEmitted` —  Маркировка эмитирована. Проверка не пройдена\n                - `sgtinApplied` — Не пройдена процедура Ввод в оборот. Проверка не пройдена\n                - `sgtinWrittenOff` — Списан. Проверка не пройдена\n                - `sgtinWithdrawn` — Выбыл. Проверка не пройдена\n                - `sgtinRetired` — Выбыл. Проверка не пройдена\n                - `sgtinDisaggregated` — Расформирован. Проверка не пройдена\n                - `sgtinDisaggregation` — Расформирован. Проверка не пройдена\n                - `sgtinAppliedNotPaid` — Не оплачен. Проверка не пройдена\n\n              <br><br>\n              Статусы проверки `gtin`, с которыми поставку можно перевести в доставку:\n                - `filled` — Маркировка закреплена за сборочным заданием, проверка не требуется\n                - `optional` — Маркировка не закреплена за сборочным заданием и не обязательна\n                - `required` — Маркировка обязательна и не закреплена за сборочным заданием. Проверка не пройдена\n\n              <br><br>\n              Статусы проверки `expiration`, с которыми поставку можно перевести в доставку:\n                - `filled` — Маркировка закреплена за сборочным заданием, проверка не требуется\n                - `optional` — Маркировка не закреплена за сборочным заданием и не обязательна\n                - `required` — Маркировка обязательна и не закреплена за сборочным заданием. Проверка не пройдена\n\n              <br><br>\n              Статусы проверки `customsDeclaration`, с которыми поставку нельзя перевести в доставку:\n                - `required` — Маркировка обязательна и не закреплена за сборочным заданием. Проверка не пройдена\n\n              <br><br>\n              Статусы проверки `customsDeclaration`, с которыми поставку можно перевести в доставку:\n                - `filled` — Маркировка закреплена за сборочным заданием, проверка не требуется\n                - `optional` — Маркировка не закреплена за сборочным заданием и не обязательна\n    v3.GetMetaMultiRequest:\n      type: object\n      description: ID сборочных заданий\n      required:\n        - orders\n      properties:\n        orders:\n          items:\n            type: integer\n          type: array\n          maxItems: 100\n          example:\n            - 123456\n            - 234567\n            - 345678\n    v3.OrdersMetaAPI:\n      properties:\n        orders:\n          items:\n            $ref: '#/components/schemas/v3.OrderMetaAPI'\n          type: array\n      type: object\n    v3.OrderMetaAPI:\n      type: object\n      properties:\n        id:\n          type: integer\n          description: ID сборочного задания\n        metaDetails:\n          allOf:\n            - $ref: '#/components/schemas/MetaDetails'\n            - description: Идентификаторы маркировки сборочного задания\n            - {}\n    Pass:\n      type: object\n      description: Данные о пропуске продавца\n      properties:\n        firstName:\n          type: string\n          nullable: false\n          description: Имя водителя\n          example: Александр\n        dateEnd:\n          type: string\n          nullable: false\n          description: Дата окончания действия пропуска\n          example: '2022-07-31 17:53:13+00:00'\n        lastName:\n          type: string\n          nullable: false\n          description: Фамилия водителя\n          example: Петров\n        carModel:\n          type: string\n          nullable: false\n          description: Марка машины\n          example: Lamborghini\n        carNumber:\n          type: string\n          nullable: false\n          description: Номер машины\n          example: A456BC123\n        officeName:\n          type: string\n          nullable: false\n          description: Название склада\n          example: Коледино\n        officeAddress:\n          type: string\n          nullable: false\n          description: Адрес склада\n          example: г. Подольск, д. Коледино, ул. Троицкая\n        officeId:\n          type: integer\n          format: int64\n          nullable: false\n          description: ID склада\n          example: 15\n        id:\n          type: integer\n          format: int64\n          nullable: false\n          description: ID пропуска\n          example: 1\n    CrossborderTurkeyClientInfo:\n      properties:\n        firstName:\n          type: string\n          description: Имя клиента\n          example: Иван\n        fullName:\n          type: string\n          description: Фамилия, Имя, Отчество\n          example: Андреев Иван Васильевич\n        lastName:\n          type: string\n          description: Фамилия клиента\n          example: Андреев\n        middleName:\n          type: string\n          description: Отчество клиента\n          example: Васильевич\n        orderID:\n          type: integer\n          description: Номер заказа\n          example: 134567\n        phone:\n          type: string\n          description: Телефон для связи с клиентом\n          example: '79871234567'\n        phoneCode:\n          type: string\n          description: Не используется\n          example: '0'\n    CrossborderTurkeyClientInfoResp:\n      properties:\n        orders:\n          description: Информация по клиенту для трансграничных поставок из Турции\n          nullable: true\n          items:\n            $ref: '#/components/schemas/CrossborderTurkeyClientInfo'\n          type: array\n      type: object\n    OrdersRequestAPI:\n      properties:\n        orders:\n          description: Список заказов\n          items:\n            type: integer\n          type: array\n      type: object\n      example:\n        orders:\n          - 987654321\n          - 123456789\n    v3.APIError:\n      type: object\n      properties:\n        code:\n          type: string\n          description: Код ошибки\n        message:\n          type: string\n          description: Описание ошибки\n        data:\n          type: object\n          description: Дополнительные данные ошибки\n"
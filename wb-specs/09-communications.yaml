ек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый с секретом | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый | 1 ч | 5 запросов | 12 мин | 1 запрос |\n        </div>\n      tags:\n        - Отзывы\n      parameters:\n        - name: isAnswered\n          in: query\n          required: true\n          description: |\n            Вернуть только обработанные отзывы:\n              - `true` — да\n              - `false` — нет\n          schema:\n            type: boolean\n            example: false\n        - name: nmId\n          in: query\n          description: Артикул WB\n          schema:\n            type: integer\n            example: 5870243\n        - name: take\n          in: query\n          required: true\n          description: Количество отзывов (max. 5 000)\n          schema:\n            type: integer\n            example: 1\n        - name: skip\n          in: query\n          required: true\n          description: Количество отзывов для пропуска (max. 199990)\n          schema:\n            type: integer\n            example: 0\n        - name: order\n          in: query\n          description: Сортировка отзывов по дате (dateAsc/dateDesc)\n          schema:\n            type: string\n            enum:\n              - dateAsc\n              - dateDesc\n        - name: dateFrom\n          in: query\n          description: Дата начала периода в формате Unix timestamp\n          schema:\n            type: integer\n            example: 1688465092\n        - name: dateTo\n          in: query\n          description: Дата конца периода в формате Unix timestamp\n          schema:\n            type: integer\n            example: 1688465092\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    type: object\n                    properties:\n           
lse\n          - feedbackId: DibuRAImknLyiqgzvGcU\n            pinMethod: tariff\n            pinOn: imt\n            isErrors: true\n            errors:\n              - status: itemNotFound\n                title: item not found\n                detail: item not found or does not belong to seller\n                requestId: 0414dc48df701618e0a3bfc414fe3136\n                origin: pin-open-api\n      properties:\n        data:\n          type: array\n          items:\n            type: object\n            properties:\n              feedbackId:\n                type: string\n                description: ID отзыва\n              pinId:\n                type: integer\n                description: |\n                  ID операции закрепления. Если поле отсутствует — закрепить отзыв не удалось\n              pinMethod:\n                type: string\n                description: |\n                  Метод закрепления:\n                    - `subscription` — подписка Джем\n                    - `tariff` — тарифная опция\n                enum:\n                  - tariff\n                  - subscription\n              pinOn:\n                type: string\n                description: |\n                  Место закрепления отзыва:\n                    - `nm` — карточка товара\n                    - `imt` — группа [объединённых](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточек товаров\n                enum:\n                  - nm\n                  - imt\n              isErrors:\n                type: boolean\n                description: Есть ли ошибки\n              errors:\n                type: array\n                description: Детали ошибок\n                items:\n                  $ref: '#/components/schemas/openapi.ResultErr'\n                example:\n                  - status: itemNotFound\n                    title: item not found\n                    detail: item not found or does not belong to seller\n                    requestId: 0414dс48df701618e0а3bfc414fe3136\n                    origin: pin-open-api\n            required:\n              - feedbackId\n              - isErrors\n              - pinMethod\n              - pinOn\n    openapi.PinnedReviewItemResult:\n      type: object\n      properties:\n        changeStateAt:\n          type: string\n          description: Дата и время закрепления или открепления\n          format: date-time\n          example: '2020-01-01T15:04:05Z'\n        imtId:\n          type: integer\n          description: ID для [объединённых](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточек товаров\n          example: 256971531\n        nmId:\n          type: integer\n          description: Артикул WB\n          example: 177974151\n        pinId:\n          type: integer\n          description: ID операции закрепления отзыва\n          example: 1857762\n        pinMethod:\n          type: string\n          description: |\n            Метод закрепления:\n              - `subscription` — подписка Джем\n              - `tariff` — тарифная опция\n          example: subscription\n          allOf:\n            - $ref: '#/components/schemas/domain.ReviewPinMethod'\n        pinOn:\n          type: string\n          description: |\n            Место закрепления отзыва:\n              - `nm` — карточка товара\n              - `imt` — группа [объединённых](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточек товаров\n          example: imt\n          allOf:\n            - $ref: '#/components/schemas/domain.ReviewPinOn'\n        feedbackId:\n          type: string\n          description: ID отзыва\n          example: DibuRAImknLyiqgzvGcU\n        state:\n          type: string\n          description: |\n            Закреплён ли отзыв:\n              - `pinned` — да\n              - `unpinned` — нет\n          example: unpinned\n          allOf:\n            - $ref: '#/components/schemas/domain.ReviewState'\n        unpinnedCause:\n          type: string\n          description: |\n            Причина открепления отзыва:\n              - `sysTariffUnpinned` — закончилась подписка или тарифная опция\n              - `sysLimitReached` — закончился общий лимит по подписке\n              - `sysNoratingUnpinned` — отзыв исключён из рейтинга. Например, удалён или забанен\n              - `sysAdditionalSlot` — к карточке или к группе [объединённых](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточек прикреплено максимальное количество отзывов\n          example: sysTariffUnpinned\n          enum:\n            - sysTariffUnpinned\n            - sysLimitReached\n            - sysNoratingUnpinned\n            - sysAdditionalSlot\n      required:\n        - changeStateAt\n        - feedbackId\n        - imtId\n        - nmId\n        - pinId\n        - pinMethod\n        - pinOn\n        - state\n    openapi.ResultErr:\n      type: object\n      properties:\n        origin:\n          type: string\n          description: ID внутреннего сервиса WB\n        detail:\n          type: string\n          description: Детали ошибки\n        requestId:\n          type: string\n          example: req-12345\n          description: ID запроса\n        status:\n          type: string\n          example: feedbackNotFound\n          enum:\n            - feedbackNotFound\n            - itemNotFound\n            - feedbackMismatch\n            - itemNoImages\n            - feedbackExcluded\n            - imtNotDisplayed\n            - globalLimitReached\n            - unitLimitReached\n            - tariffRestriction\n            - subscriptionRestriction\n            - alreadyPinned\n            - bodyNotValid\n          description: Статус\n        title:\n          type: string\n          example: feedbackNotFound\n          description: Заголовок ошибки\n      required:\n        - origin\n        - requestId\n        - status\n        - title\n    openapi.SellerLimit:\n      properties:\n        perUnitLimit:\n          type: integer\n          description: Максимальное количество закреплённых отзывов в одной карточке товара или в группе [объединённых](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточек\n          example: 2\n        remaining:\n          type: integer\n          description: Сколько ещё отзывов можно закрепить\n          example: 5\n        totalLimit:\n          type: integer\n          description: Общий лимит закреплений\n          example: 15\n        unlimited:\n          type: boolean\n          description: |\n            Количество закреплённых отзывов не ограничено:\n              - `true` — да\n              - `false` — нет\n          example: false\n        used:\n          type: integer\n          description: Текущее количество закреплённых отзывов\n          example: 10\n      required:\n        - perUnitLimit\n        - remaining\n        - totalLimit\n        - unlimited\n        - used\n    openapi.SellerLimitsResponse:\n      type: object\n      properties:\n        data:\n          type: object\n          properties:\n            subscription:\n              type: object\n              nullable: true\n              allOf:\n                - $ref: '#/components/schemas/openapi.SellerLimit'\n                - description: Лимиты по подписке\n            tariff:\n              type: object\n              nullable: true\n              allOf:\n                - $ref: '#/components/schemas/openapi.SellerLimit'\n                - description: Лимиты по тарифной опции\n    respond.ResultErr:\n      type: object\n      properties:\n        detail:\n          type: string\n          description: Детали ошибки\n        origin:\n          type: string\n          description: ID внутреннего сервиса WB\n        requestId:\n          type: string\n          description: ID запроса\n        status:\n          type: integer\n          description: HTTP статус-код\n        title:\n          type: string\n          description: Заголовок ошибки\n      required:\n        - origin\n        - requestId\n        - status\n        - title\n    respond.SuccessResponse:\n      type: object\n      properties:\n        data:\n          type: object\n      required:\n        - data\n  responses:\n    '401':\n      description: Не авторизован\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки\n              code:\n                type: string\n                description: Внутренний код ошибки\n              requestId:\n                type: string\n                description: Уникальный ID запроса\n              origin:\n                type: string\n                description: ID внутреннего сервиса WB\n              status:\n                type: number\n                description: HTTP статус-код\n              statusText:\n                type: string\n                description: Расшифровка HTTP статус-кода\n              timestamp:\n                type: string\n                format: date-time\n                description: Дата и время запроса\n          example:\n            title: unauthorized\n            detail: 'token problem; token is malformed: could not base64 decode signature: illegal base64 data at input byte 84'\n            code: 07e4668e--a53a3d31f8b0-[UK-oWaVDUqNrKG]; 03bce=277; 84bd353bf-75\n            requestId: 7b80742415072fe8b6b7f7761f1d1211\n            origin: s2s-api-auth-catalog\n            status: 401\n            statusText: Unauthorized\n            timestamp: '2024-09-30T06:52:38Z'\n    '402':\n      description: Требуется платёж\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки. Ошибка возвращается только сервисам из [Каталога решений для бизнеса](/business-solutions)\n          example:\n            title: payment required\n            detail: wb solution for business has insufficient funds on its balance. please top up the balance in the company's personal account https://dev.wildberries.ru/company\n    '429':\n      description: Слишком много запросов\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: Заголовок ошибки\n              detail:\n                type: string\n                description: Детали ошибки\n              code:\n                type: string\n                description: Внутренний код ошибки\n              requestId:\n                type: string\n                description: Уникальный ID запроса\n              origin:\n                type: string\n                description: ID внутреннего сервиса WB\n              status:\n                type: number\n                description: HTTP статус-код\n              statusText:\n                type: string\n                description: Расшифровка HTTP статус-кода\n              timestamp:\n                type: string\n                format: date-time\n                description: Дата и время запроса\n          example:\n            title: too many requests\n            detail: limited by c122a060-a7fb-4bb4-abb0-32fd4e18d489\n            code: 07e4668e-ac2242c5c8c5-[UK-4dx7JUdskGZ]\n            requestId: 9d3c02cc698f8b041c661a7c28bed293\n            origin: s2s-api-auth-catalog\n            status: 429\n            statusText: Too Many Requests\n            timestamp: '2024-09-30T06:52:38Z'\n    GetClaimsSuccessResponse:\n      description: Успешно\n      content:\n        application/json:\n          schema:\n            type: object\n            example:\n              claims:\n                - id: fe3e9337-e9f9-423c-8930-946a8ebef80\n                  claim_type: 1\n                  status: 2\n                  status_ex: 8\n                  nm_id: 196320101\n                  user_comment: Длина провода не соответствует описанию\n                  wb_comment: Продавец одобрил вашу заявку. Для возврата средств необходимо вернуть товар продавцу. Укажите дату, когда вам удобно принять курьера.\n                  dt: '2025-03-26T17:06:12.245611'\n                  imt_name: Кабель 0.5 м, 3797\n                  order_dt: '2024-10-27T05:18:56'\n                  dt_update: '2025-05-10T18:01:06.999613'\n                  photos:\n                    - //photos.wbstatic.net/claim/fe3e9337-e9f9-423c-8930-946a8ebef80/1.webp\n                    - //photos.wbstatic.net/claim/fe3e9337-e9f9-423c-8930-946a8ebef80/2.webp\n                  video_paths:\n                    - //video.wbstatic.net/claim/fe3e9337-e9f9-423c-8930-946a8ebef80/1.mp4\n                  actions:\n                    - autorefund1\n                    - approve1\n                  price: 157\n                  currency_code: '643'\n                  srid: v5o_7143225816503318733.0.0\n                  origin_id_info: IMEI 359889346153011, указанный покупателем в  заявке на возврат, не совпадает с IMEI 359889346238986, указанным продавцом или отсканированным на складе Wildberries\n                  delivery_dt: '2025-04-09T14:36:07'\n              total: 31\n            properties:\n              claims:\n                type: array\n                description: Заявки\n                items:\n                  type: object\n                  properties:\n                    id:\n                      type: string\n                      description: ID заявки\n                      format: UUID\n                    claim_type:\n                      type: integer\n                      description: |\n                        Источник заявки:\n                          * `1` — портал покупателей\n                          * `3` — чат\n                    status:\n                      type: integer\n                      description: |\n                        Решение по возврату покупателю:\n                          * `0` — на рассмотрении\n                          * `1` — отказ\n                          * `2` — одобрено\n                    status_ex:\n                      type: integer\n                      description: |\n                        Статус товара:\n                          * `0` — заявка на рассмотрении\n                          * `1` — товар остается у покупателя (Заявка отклонена)\n                          * `2` — покупатель сдает товар на WB, товар отправляется в утиль\n                          * `5` — товар остается у покупателя (Заявка одобрена)\n                          * `8` — товар будет возвращён в реализацию после проверки WB\n                          * `10` — товар возвращается продавцу\n                    nm_id:\n                      type: integer\n                      description: Артикул WB\n                    user_comment:\n                      type: string\n                      maxLength: 1000\n                      description: Комментарий покупателя\n                    wb_comment:\n                      nullable: true\n                      type: string\n                      maxLength: 10000\n                      description: Ответ покупателю\n                    dt:\n                      type: string\n                      description: Дата и время оформления заявки покупателем. UTC+3\n                    imt_name:\n                      nullable: true\n                      type: string\n                      description: Название товара\n                    order_dt:\n                      type: string\n                      description: Дата и время заказа\n                    dt_update:\n                      type: string\n                      description: Дата и время рассмотрения заявки. Для нерассмотренной заявки — дата и время оформления. UTC+3\n                    photos:\n                      type: array\n                      description: Фотографии из заявки покупателя\n                      minItems: 0\n                      maxItems: 10\n                      items:\n                        type: string\n                        format: WEBP\n                    video_paths:\n                      type: array\n                      description: Видео из заявки покупателя\n                      minItems: 0\n                      maxItems: 1\n                      items:\n                        type: string\n                        format: MP4\n                    actions:\n                      type: array\n                      description: |\n                        Варианты [ответа продавца на заявку](./user-communication#tag/buyersReturns/operation/patchV1Claim).<br>Отклонённые заявки можно пересмотреть. Если массив пуст, с заявкой работать нельзя.\n                          * `approve1` — одобрить с проверкой брака.<br>Деньги вернутся покупателю после возврата товара. Товар будет проверен на складе. При подтверждении брака/ошибки вложения товар будет отправлен продавцу. Если брак/ошибка вложения не подтвердятся, товар будет возвращён в продажу.<br>Неприменимо при модели <strong>[Самовывоз](./in-store-pickup)</strong>.\n                          * `approve2` — одобрить и забрать товар.<br> Деньги вернутся покупателю после возврата товара. Товар будет отправлен продавцу.<br>Неприменимо при модели <strong>[Самовывоз](./in-store-pickup)</strong>.\n                          * `autorefund1` — одобрить без возврата товара.<br> Товар останется у покупателя. Деньги за него будут возвращены покупателю без возврата товара.\n                          * `reject1` — отклонить с шаблоном ответа: <details><summary><strong>Брак не обнаружен</strong></summary>Пришлось отклонить заявку — подтвердить производственный брак не получилось. Можете отнести товар на независимую экспертизу или в сервисный центр. Если брак подтвердится, создайте новую заявку с такой же причиной, ещё раз опишите проблему и добавьте фото заключения. А если остались вопросы, задайте их в чате: нажмите кнопку «Написать продавцу».</details>\n                          * `reject2` — отклонить с шаблоном ответа: <details><summary><strong>Добавить фото/видео</strong></summary>Пришлось отклонить заявку — нужно чуть больше информации. Создайте новую заявку с такой же причиной возврата, подробно опишите проблему и добавьте фото, на которых хорошо видно: сам товар целиком, брак, бирку или этикетку, упаковку со штрихкодом Wildberries, если она осталась. Желательно добавить видео — это поможет разобраться.</details>\n                          * `reject3` — отклонить с шаблоном ответа: <details><summary><strong>Направить в сервисный центр</strong></summary>Пришлось отклонить заявку — подтвердить производственный брак не получилось. Вы можете отнести товар в сервисный центр: адрес есть на сайте производителя или в гарантийном талоне. Там всё проверят и выдадут заключение. Если производственный брак подтвердится, создайте новую заявку с такой же причиной, ещё раз опишите проблему и добавьте фото заключения.</details>\n                          * `rejectcustom` — отклонить с комментарием.<br>Комментарий передаётся в параметре `comment`.\n                          * `approvecc1` — одобрить заявку с возвратом товара в магазин продавца.<br>Можно передать комментарий (например, телефон для связи или время работы своего отдела возвратов) в параметре `comment`. По итогу возврата необходимо ответить на заявку с `\"action\":\"confirmreturngoodcc1\"` или `\"action\":\"rejectcustom\"`.<br>Применимо только при модели <strong>[Самовывоз](./in-store-pickup)</strong>.\n                          * `confirmreturngoodcc1` — подтвердить приёмку товара от покупателя.<br>Применимо только при модели <strong>[Самовывоз](./in-store-pickup)</strong>.\n                      items:\n                        type: string\n                    price:\n                      type: number\n                      description: Фактическая цена с учетом всех скидок. Взимается с покупателя\n                    currency_code:\n                      type: string\n                      description: Код валюты цены\n                    srid:\n                      type: string\n                      description: Уникальный ID заказа, по товару которого создана заявка\n                    origin_id_info:\n                      type: string\n                      description: Результат сверки [IMEI](https://seller.wildberries.ru/instructions/ru/ru/material/items-labeling-in-fbs#imei) для возврата через ПВЗ Wildberries.<br>Значение показывает, совпадает ли IMEI, который был указан продавцом или отсканирован при приёмке на складе Wildberries, с IMEI из заявки покупателя, что позволяет эффективнее [обрабатывать заявки](./user-communication#tag/buyersReturns/operation/patchV1Claim).<br>Применимо только для товаров **Apple** предмета `Смартфоны` (`\"subjectId\":515`) с ценой от 40000 рублей, учитывая скидку продавца ([только](./work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1upload~1task/post) параметры и поля `price` и `discount`)\n                      nullable: true\n                    delivery_dt:\n                      type: string\n                      description: Дата и время получения заказа покупателем\n              total:\n                type: integer\n                description: Количество заявок, соответствующих параметрам запроса. Без учёта `limit` и `offset`\n    Error400GetClaims:\n      description: Неправильный запрос\n      content:\n        application/problem+json:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: ID ошибки\n                example: Invalid query params\n              detail:\n                description: Описание ошибки\n                type: string\n                example: 'Failed to deserialize query string: missing field `is_archive`'\n              requestId:\n                description: ID запроса\n                type: string\n                example: e0aedc10-9789-49c1-9a83-d8422b4703dc\n    Error400PatchClaim:\n      description: Неправильный запрос\n      content:\n        application/json; charset=utf-8:\n          schema:\n            type: object\n            properties:\n              title:\n                type: string\n                description: ID ошибки\n                example: Validation error\n              detail:\n                description: Описание ошибки\n                type: string\n                example: 'Input model is not valid; Details: The Action field is required.'\n              requestId:\n                description: ID запроса\n                type: string\n                example: 0HN3PI6JUGFSL:00000004\n  requestBodies:\n    PatchClaimReq:\n      required: true\n      description: Ответ на заявку\n      content:\n        application/json:\n          schema:\n            type: object\n            properties:\n              id:\n                description: ID заявки\n                type: string\n                format: UUID\n                example: fe3e9337-e9f9-423c-8930-946a8ebef80\n              action:\n                description: Действие с заявкой.<br>Используйте одно из значений массива `actions` — ответа [метода получения заявок](./user-communication#tag/buyersReturns/operation/getV1Claims)\n                type: string\n                example: rejectcustom\n              comment:\n                description: Комментарий.<br>Применимо только при `\"action\":\"rejectcustom\"` или `\"action\":\"approvecc1\"`. При `\"action\":\"rejectcustom\"` параметр обязателен\n                type: string\n                minLength: 10\n                maxLength: 1000\n                example: Фото не имеет отношения к товару в заявке\n            required:\n              - id\n              - action\n  parameters:\n    limit:\n      in: query\n      name: limit\n      description: Количество заявок в ответе\n      schema:\n        type: integer\n        format: uint\n        default: 50\n        minimum: 1\n        maximum: 200\n        example: 50\n    offset:\n      in: query\n      name: offset\n      description: После какого элемента выдавать данные\n      schema:\n        type: integer\n        format: uint\n        default: 0\n        minimum: 0\n        example: 0\n    is_archive:\n      in: query\n      name: is_archive\n      description: |\n        Состояние заявки:\n          * `false` — на рассмотрении\n          * `true` — в архиве\n      required: true\n      schema:\n        type: boolean\n        example: true\n    id:\n      in: query\n      name: id\n      description: ID заявки\n      schema:\n        type: string\n        format: UUID\n        example: fe3e9337-e9f9-423c-8930-946a8ebef80\n    nm_id:\n      in: query\n      name: nm_id\n      description: Артикул WB\n      schema:\n        type: integer\n        example: 196320101\n  securitySchemes:\n    HeaderApiKey:\n      type: apiKey\n      name: Authorization\n      in: header\n"
}
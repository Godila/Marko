азовый с секретом | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый | 1 ч | 5 запросов | 12 мин | 1 запрос |\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - id\n                - text\n              properties:\n                id:\n                  type: string\n                  description: ID отзыва\n                  example: J2FMRjUj6hwvwCElqssz\n                text:\n                  type: string\n                  description: Текст ответа\n                  example: Спасибо за Ваш отзыв!\n                  minimum: 2\n                  maximum: 5000\n      responses:\n        '204':\n          description: Успешно\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/standardizedFQError'\n              examples:\n                contentTypeHeaderNotSpecified:\n                  $ref: '#/components/examples/contentTypeHeaderNotSpecified'\n                incorrectContentTypeHeader:\n                  $ref: '#/components/examples/incorrectContentTypeHeader'\n                incorrectContentType:\n                  $ref: '#/components/examples/incorrectContentType'\n                invalidJsonSyntax:\n                  $ref: '#/components/examples/invalidJsonSyntax'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n    patch:\n      operationId: patchV1FeedbacksAnswer\n      x-readonly-method: false\n      x-category: questionsandfeedback\n      tags:\n        - Отзывы\n      security:\n        - HeaderApiKey: []\n      summary: Отредактировать ответ на отзыв\n      description: |\n        Метод позволяет отредактировать уже отправленный [ответ на отзыв](/openapi/user-communication#tag/feedbacks/operation/postV1FeedbacksAnswer) покупателя.\n        <br><br>\n        Отредактировать ответ можно только один раз в течение 60 дней c момента отправки.\n\n        <div class=\"description_important\">\n          ID отзыва не валидируется. Если в запросе вы передали некорректный ID, вы не получите ошибку.\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Вопросы и отзывы</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Сервисный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый с секретом | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый | 1 ч | 5 запросов | 12 мин | 1 запрос |\n        </div>\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              required:\n                - id\n                - text\n              properties:\n                id:\n                  type: string\n                  description: ID отзыва\n                  example: J2FMRjUj6hwvwCElqssz\n                text:\n                  type: string\n                  description: Текст ответа\n                  example: Спасибо за Ваш отзыв, он очень важен для нас!\n                  minimum: 2\n                  maximum: 5000\n      responses:\n        '204':\n          description: Успешно\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/feedbacks/order/return:\n    servers:\n      - url: https://feedbacks-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://feedbacks-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    post:\n      operationId: postV1FeedbacksOrderReturn\n      x-readonly-method: false\n      x-category: questionsandfeedback\n      security:\n        - HeaderApiKey: []\n      summary: Возврат товара по ID отзыва\n      description: |\n        Метод запрашивает возврат товара, по которому оставлен [отзыв](/openapi/user-communication#tag/feedbacks/operation/getV1Feedbacks).\n        <br><br>\n        Возврат доступен для отзывов с полем `\"isAbleReturnProductOrders\": true`.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Вопросы и отзывы</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Сервисный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый с секретом | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый | 1 ч | 5 запросов | 12 мин | 1 запрос |\n        </div>\n      tags:\n        - Отзывы\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                feedbackId:\n                  type: string\n                  description: ID отзыва\n            example:\n              feedbackId: absdfgerrrfff1234\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    type: object\n                    nullable: true\n                  error:\n                    type: boolean\n                    description: Есть ли ошибка\n                  errorText:\n                    type: string\n                    description: Описание ошибки\n                  additionalErrors:\n                    description: Дополнительные ошибки\n                    nullable: true\n                    type: array\n                    items:\n                      type: string\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseFeedbackQuestionErr'\n              examples:\n                FeedbackErr400:\n                  $ref: '#/components/examples/ResponseDoNotGetFeedback400'\n                RequestBodyErr400:\n                  $ref: '#/components/examples/RequestBodyErr400'\n                RequestIDErr400:\n                  $ref: '#/components/examples/RequestIDErr400'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '422':\n          description: Ошибка обработки параметров запроса\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseFeedbackQuestionErr'\n              examples:\n                responseInaccessibleBackGoodError422:\n                  $ref: '#/components/examples/responseInaccessibleBackGoodError422'\n                responseUnsuccessfullyBackGoodError422:\n                  $ref: '#/components/examples/responseUnsuccessfullyBackGoodError422'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/feedback:\n    servers:\n      - url: https://feedbacks-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://feedbacks-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      operationId: getV1Feedback\n      x-readonly-method: true\n      x-category: questionsandfeedback\n      security:\n        - HeaderApiKey: []\n      summary: Получить отзыв по ID\n      description: |\n        Метод возвращает данные [отзыва](/openapi/user-communication#tag/feedbacks/operation/getV1Feedbacks) по его ID.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Вопросы и отзывы</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Сервисный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый с секретом | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый | 1 ч | 5 запросов | 12 мин | 1 запрос |\n        </div>\n      tags:\n        - Отзывы\n      parameters:\n        - name: id\n          in: query\n          required: true\n          description: ID отзыва\n          schema:\n            type: string\n            example: G7Y9Y1kBAtKOitoBT_lV\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    type: object\n                    properties:\n                      id:\n                        type: string\n                        description: ID отзыва\n                      text:\n                        type: string\n                        description: Текст отзыва\n                      pros:\n                        type: string\n                        description: Достоинства товара\n                        nullable: false\n                      cons:\n                        type: string\n                        description: Недостатки товара\n                        nullable: false\n                      matchingSize:\n                        type: string\n                        description: |\n                          Соответствие заявленного размера реальному.\n                          <br>Возможные значения:\n                          - ` ` - для безразмерных товаров\n                          - `ок` - соответствует размеру\n                          - `smaller` - маломерит\n                          - `bigger` - большемерит\n                      productValuation:\n                        type: integer\n                        description: Оценка товара\n                      createdDate:\n                        type: string\n                        format: date-time\n                        description: Дата и время создания отзыва\n                      answer:\n                        nullable: true\n                        type: object\n                        description: Структура ответа\n                        properties:\n                          text:\n                            type: string\n                            description: Текст ответа\n                          state:\n                            type: string\n                            description: |\n                              Статус:\n                                - `none` — новый\n                                - `wbRu`— отображается на сайте\n                                - `reviewRequired` — ответ проходит проверку\n                                - `rejected` — ответ отклонён\n                          editable:\n                            type: boolean\n                            description: |\n                              Можно ли отредактировать ответ:\n                                - `false` — нет\n                                - `true` — да\n                      state:\n                        type: string\n                        description: |\n                          Статус отзыва:\n                            - `none` - не обработан (новый)\n                            - `wbRu` - обработан\n                      productDetails:\n                        description: Item information\n                        type: object\n                        properties:\n                          nmId:\n                            type: integer\n                            description: Артикул WB\n                          imtId:\n                            type: integer\n                            description: ID для [объединённых](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточек товаров\n                          productName:\n                            type: string\n                            description: Название товара\n                          supplierArticle:\n                            type: string\n                            nullable: true\n                            description: Артикул продавца\n                          supplierName:\n                            type: string\n                            nullable: true\n                            description: Имя продавца\n                          brandName:\n                            type: string\n                            nullable: true\n                            description: Бренд товара\n                          size:\n                            type: string\n                            description: Размер товара (`techSize` в КТ)\n                      photoLinks:\n                        nullable: true\n                        description: Массив структур фотографий\n                        type: array\n                        items:\n                          type: object\n                          properties:\n                            fullSize:\n                              type: string\n                              description: Адрес фотографии полного размера\n                            miniSize:\n                              type: string\n                              description: Адрес фотографии маленького размера\n                      userName:\n                        type: string\n                        description: Имя автора отзыва\n                        nullable: false\n                      orderStatus:\n                        type: string\n                        description: |\n                          Статус заказа.\n                          <br>Возможные значения:\n                          - `buyout` — выкуплен\n                          - `rejected` — отказались\n                          - `returned` — возврат\n                          - `notSpecified` — статус не присвоен\n                      video:\n                        nullable: true\n                        description: Структура видео\n                        type: object\n                        properties:\n                          previewImage:\n                            type: string\n                            description: Ссылка на обложку видео\n                          link:\n                            type: string\n                            description: Ссылка на файл плейлиста видео (доступно по протоколу hls)\n                          durationSec:\n                            type: integer\n                            description: Общая продолжительность видео\n                      wasViewed:\n                        type: boolean\n                        description: Просмотрен ли отзыв\n                      isAbleSupplierFeedbackValuation:\n                        description: |\n                          Доступна ли продавцу возможность оставить жалобу на отзыв:\n                            - `true`— да\n                            - `false` — нет\n                        type: boolean\n                      supplierFeedbackValuation:\n                        description: |\n                          Ключ причины жалобы на отзыв\n                        type: integer\n                      isAbleSupplierProductValuation:\n                        description: Доступна ли продавцу возможность сообщить о проблеме с товаром  (`true` - доступна, `false` - не доступна)\n                        type: boolean\n                      supplierProductValuation:\n                        description: |\n                          Ключ проблемы с товаром\n                        type: integer\n                      isAbleReturnProductOrders:\n                        description: |\n                          Опция возврата товара:\n                            - `true` — доступна\n                            - `false` — недоступна\n                        type: boolean\n                      returnProductOrdersDate:\n                        nullable: true\n                        description: Дата и время, когда на запрос возврата был получен ответ со статус-кодом 200.\n                        type: string\n                      bables:\n                        nullable: true\n                        description: Список тегов покупателя\n                        type: array\n                        items:\n                          type: string\n                      lastOrderShkId:\n                        type: integer\n                        description: Штрихкод единицы товара\n                      lastOrderCreatedAt:\n                        type: string\n                        description: Дата покупки\n                      color:\n                        type: string\n                        description: Цвет товара\n                      subjectId:\n                        type: integer\n                        description: ID предмета\n                      subjectName:\n                        type: string\n                        description: Название предмета\n                      parentFeedbackId:\n                        type: string\n                        description: ID начального отзыва (`null`, если этот отзыв начальный)\n                        nullable: true\n                      childFeedbackId:\n                        type: string\n                        nullable: true\n                        description: ID дополненного отзыва (`null`, если этот отзыв дополненный)\n                  error:\n                    type: boolean\n                    description: Есть ли ошибка\n                  errorText:\n                    type: string\n                    description: Описание ошибки\n                  additionalErrors:\n                    description: Дополнительные ошибки\n                    nullable: true\n                    type: array\n                    items:\n                      type: string\n              example:\n                data:\n                  id: YX52RZEBhH9mrcYdEJuD\n                  text: Спасибо, всё подошло\n                  pros: Удобный\n                  cons: Нет\n                  productValuation: 5\n                  createdDate: '2024-09-26T10:20:48+03:00'\n                  answer:\n                    text: Пожалуйста. Ждём вас снова!\n                    state: wbRu\n                    editable: false\n                  state: wbRu\n                  productDetails:\n                    imtId: 123456789\n                    nmId: 987654321\n                    productName: ВАЗ\n                    supplierArticle: DP02/черный\n                    supplierName: ГП Реклама и услуги\n                    brandName: Бест Трикотаж\n                    size: '0'\n                  video:\n                    previewImage: https://videofeedback01.wbbasket.ru/8defc853-7f62-4d6d-b236-8a16cfb63128/preview.webp\n                    link: https://videofeedback01.wbbasket.ru/8defc853-7f62-4d6d-b236-8a16cfb63128/index.m3u8\n                    durationSec: 10\n                  wasViewed: true\n                  photoLinks:\n                    - fullSize: https://feedback04.wbbasket.ru/vol1333/part133337/123456789/photos/fs.webp\n                      miniSize: https://feedback04.wbbasket.ru/vol1333/part133337/123456789/photos/ms.webp\n                    - fullSize: https://feedback04.wbbasket.ru/vol1508/part150887/12345678
      summary: Необработанные отзывы\n      description: |\n        Метод возвращает:\n          - количество необработанных [отзывов](/openapi/user-communication#tag/feedbacks/operation/getV1Feedbacks) за сегодня и за всё время\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Вопросы и отзывы</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Сервисный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый с секретом | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый | 1 ч | 5 запросов | 12 мин | 1 запрос |\n        </div>\n      tags:\n        - Отзывы\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    type: object\n                    properties:\n                      countUnanswered:\n                        type: integer\n                        description: Количество необработанных отзывов\n                        example: 1\n                      countUnansweredToday:\n                        type: integer\n                        description: Количество необработанных отзывов за сегодня\n                        example: 0\n                  error:\n                    type: boolean\n                    description: Есть ли ошибка\n                    example: false\n                  errorText:\n                    type: string\n                    description: Описание ошибки\n                    example: ''\n                  additionalErrors:\n                    description: Дополнительные ошибки\n                    nullable: true\n                    type: array\n                    items:\n                      type: string\n                    example: null\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseFeedbackQuestionErr'\n              examples:\n                FeedbackErr403:\n                  $ref: '#/components/examples/FeedbackErr403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/feedbacks/count:\n    servers:\n      - url: https://feedbacks-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://feedbacks-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      operationId: getV1FeedbacksCount\n      x-readonly-method: true\n      x-category: questionsandfeedback\n      security:\n        - HeaderApiKey: []\n      summary: Количество отзывов\n      description: |\n        Метод возвращает количество обработанных или необработанных [отзывов](/openapi/user-communication#tag/feedbacks/operation/getV1Feedbacks) за заданный период.\n        Отзыв считается обработанным, если выполняется одно из условий:\n          - на отзыв получен ответ\n          - отзыв содержит только оценку (без текста и фото)\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Вопросы и отзывы</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Сервисный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый с секретом | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый | 1 ч | 5 запросов | 12 мин | 1 запрос |\n        </div>\n      tags:\n        - Отзывы\n      parameters:\n        - name: dateFrom\n          in: query\n          description: Дата начала периода в формате Unix timestamp\n          schema:\n            type: integer\n            example: 1688465092\n        - name: dateTo\n          in: query\n          description: Дата конца периода в формате Unix timestamp\n          schema:\n            type: integer\n            example: 1688465092\n        - name: isAnswered\n          in: query\n          required: true\n          description: |\n            Вернуть только обработанные отзывы:\n              - `true` — да\n              - `false` — нет\n          schema:\n            type: boolean\n            example: false\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    type: integer\n                    description: Количество отзывов\n                    example: 724583\n                  error:\n                    type: boolean\n                    description: Есть ли ошибка\n                    example: false\n                  errorText:\n                    type: string\n                    description: Описание ошибки\n                    example: ''\n                  additionalErrors:\n                    description: Дополнительные ошибки\n                    nullable: true\n                    type: array\n                    items:\n                      type: string\n                    example: null\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseFeedbackQuestionErr'\n              examples:\n                IsAnsweredErr400:\n                  $ref: '#/components/examples/IsAnsweredErr400'\n    
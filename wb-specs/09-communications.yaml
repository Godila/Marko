i-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      operationId: getV1FeedbacksArchive\n      x-readonly-method: true\n      x-category: questionsandfeedback\n      security:\n        - HeaderApiKey: []\n      summary: Список архивных отзывов\n      description: |\n        Метод возвращает список архивных [отзывов](/openapi/user-communication#tag/feedbacks/operation/getV1Feedbacks).\n        <br><br>\n        Отзыв становится архивным, если:\n          - на отзыв получен ответ\n          - на отзыв не получен ответ в течение 30 дней\n          - в отзыве нет текста и фото\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Вопросы и отзывы</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Сервисный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый с секретом | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый | 1 ч | 5 запросов | 12 мин | 1 запрос |\n        </div>\n      tags:\n        - Отзывы\n      parameters:\n        - name: nmId\n          in: query\n          description: Артикул WB\n          schema:\n            type: integer\n            example: 14917842\n        - name: take\n          in: query\n          required: true\n          description: Количество отзывов (max. 5 000)\n          schema:\n            type: integer\n            example: 1\n        - name: skip\n          in: query\n          required: true\n          description: Количество отзывов для пропуска\n          schema:\n            type: integer\n            example: 0\n        - name: order\n          in: query\n          description: Сортировка отзывов по дате (dateAsc/dateDesc)\n          schema:\n            type: string\n            enum:\n              - dateAsc\n              - dateDesc\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    type: object\n                    properties:\n                      feedbacks:\n                        $ref: '#/components/schemas/responseFeedback'\n                  error:\n                    type: boolean\n                    description: Есть ли ошибка\n                  errorText:\n                    type: string\n                    description: Описание ошибки\n                  additionalErrors:\n                    description: Дополнительные ошибки\n                    nullable: true\n                    type: array\n                    items:\n                      type: string\n              example:\n                data:\n                  feedbacks:\n                    - id: YX52RZEBhH9mrcYdEJuD\n                      text: Спасибо, всё подошло\n                      pros: Удобный\n                      cons: Нет\n                      productValuation: 5\n                      createdDate: '2024-09-26T10:20:48+03:00'\n                      answer:\n                        text: Пожалуйста. Ждём вас снова!\n                        state: wbRu\n                        editable: false\n                      state: wbRu\n                      productDetails:\n                        imtId: 123456789\n                        nmId: 987654321\n                        productName: ВАЗ\n                        supplierArticle: DP02/черный\n                        supplierName: ГП Реклама и услуги\n                        brandName: Бест Трикотаж\n                        size: '0'\n                      video:\n                        previewImage: https://videofeedback01.wbbasket.ru/8defc853-7f62-4d6d-b236-8a16cfb63128/preview.webp\n                        link: https://videofeedback01.wbbasket.ru/8defc853-7f62-4d6d-b236-8a16cfb63128/index.m3u8\n                        durationSec: 10\n                      wasViewed: true\n                      photoLinks:\n                        - fullSize: https://feedback04.wbbasket.ru/vol1333/part133337/123456789/photos/fs.webp\n                          miniSize: https://feedback04.wbbasket.ru/vol1333/part133337/123456789/photos/ms.webp\n                        - fullSize: https://feedback04.wbbasket.ru/vol1508/part150887/123456789/photos/fs.webp\n                          miniSize: https://feedback04.wbbasket.ru/vol1508/part150887/123456789/photos/ms.webp\n                        - fullSize: https://feedback04.wbbasket.ru/vol1486/part148682/123456789/photos/fs.webp\n                          miniSize: https://feedback04.wbbasket.ru/vol1486/part148682/123456789/photos/ms.webp\n                      userName: Николай\n                      orderStatus: returned\n                      matchingSize: ok\n                      isAbleSupplierFeedbackValuation: false\n                      supplierFeedbackValuation: 1\n                      isAbleSupplierProductValuation: false\n                      supplierProductValuation: 2\n                      isAbleReturnProductOrders: false\n                      returnProductOrdersDate: '2024-08-20T16:39:49Z'\n                      bables:\n                        - цена\n                      lastOrderShkId: 123456789\n                      lastOrderCreatedAt: '2024-08-12T10:20:48+03:00'\n                      color: colorless\n                      subjectId: 219\n                      subjectName: Футболки-поло\n                      parentFeedbackId: null\n                      childFeedbackId: bIjTCZDvJni7NGnLbUlf\n                error: false\n                errorText: ''\n                additionalErrors: null\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseFeedbackQuestionErr'\n              examples:\n                FeedbackErr400:\n                  $ref: '#/components/examples/FeedbackErr400'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseFeedbackQuestionErr'\n              examples:\n                FeedbackErr403:\n                  $ref: '#/components/examples/FeedbackErr403'\n        '422':\n          description: Ошибка обработки параметров запроса\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseFeedbackQuestionErr'\n              examples:\n                ResponseGetFeedbackArchive:\n                  $ref: '#/components/examples/ResponseGetFeedbackArchive'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/feedbacks/v1/pins:\n    servers:\n      - url: https://feedbacks-api.wildberries.ru\n    get:\n      operationId: getFeedbacksV1Pins\n      x-readonly-method: true\n      x-category: questionsandfeedback\n      security:\n        - HeaderApiKey: []\n      summary: Список закреплённых и откреплённых отзывов\n      description: |\n        Метод предоставляет список закреплённых и откреплённых отзывов.\n        <br>\n        Откреплёнными считаются только отзывы, которые были откреплены автоматически по причинам, указанным в ответе в поле `unpinnedCause`.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Вопросы и отзывы</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Сервисный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый с секретом | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый | 1 ч | 5 запросов | 12 мин | 1 запрос |\n        </div>\n      tags:\n        - Закреплённые отзывы\n      parameters:\n        - name: state\n          in: query\n          description: |\n            Закреплён ли отзыв:\n              - `pinned` — да\n              - `unpinned` — нет\n          schema:\n            type: string\n            enum:\n              - pinned\n              - unpinned\n            example: pinned\n        - name: pinOn\n          in: query\n          description: |\n            Место закрепления отзыва:\n              - `nm` — карточка товара\n              - `imt` — группа [объединённых](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточек товаров\n          schema:\n            type: string\n            enum:\n              - nm\n              - imt\n            example: nm\n        - name: imtId\n          in: query\n          description: |\n            ID для [объединённых](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточек товаров.<br>Един для всех артикулов WB группы объединённых карточек.<br>У каждой карточки товара есть `imtId`, даже если она не объединена с другими карточками<br>\n          schema:\n            type: integer\n            example: 256972151\n        - name: nmId\n          in: query\n          description: Артикул WB\n          schema:\n            type: integer\n            example: 177974151\n        - name: feedbackId\n          in: query\n          description: ID отзыва\n          schema:\n            type: integer\n            example: 789\n        - name: dateFrom\n          in: query\n          description: Дата закрепления первого отзыва в списке\n          schema:\n            type: string\n            format: date-time\n            example: '2020-01-01T15:04:05Z'\n        - name: dateTo\n          in: query\n          description: Дата закрепления последнего отзыва в списке\n          schema:\n            type: string\n            format: date-time\n            example: '2020-02-01T15:04:05Z'\n        - name: next\n          in: query\n          description: ID последней операции закрепления (пагинатор)\n          schema:\n            type: integer\n            example: 741\n        - name: limit\n          in: query\n          description: Количество отзывов на одной странице (пагинация)\n          schema:\n            type: integer\n            default: 500\n            example: 100\n            maximum: 500\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                allOf:\n                  - $ref: '#/components/schemas/respond.SuccessResponse'\n                  - type: object\n                    properties:\n                      data:\n                        type: array\n                        items:\n                          $ref: '#/components/schemas/openapi.PinnedReviewItemResult'\n                      next:\n                        type: integer\n                        description: Параметр пагинации. Укажите это значение в запросе, чтобы получить следующий пакет данных. Если поле отсутствует, вы получили все данные\n                        example: 200\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/respond.ResultErr'\n              example:\n                status: 400\n                title: Bad Request\n                detail: state must be one of the values 'pinned', 'unpinned'\n                requestId: 7b64у8ffc3523450d613723fwу61873e\n                origin: pin-open-api\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n    post:\n      operationId: postFeedbacksV1Pins\n      x-readonly-method: false\n      x-category: questionsandfeedback\n      security:\n        - HeaderApiKey: []\n      summary: Закрепить отзывы\n      description: |\n        Метод позволяет закрепить отзывы в карточке товара или в группе [объединённых](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточек. <br>\n        Чтобы получить ID отзывов, используйте метод [Список закреплённых и откреплённых отзывов](/openapi/user-communication#tag/pinnedFeedbacks/operation/getFeedbacksV1Pins).<br>\n        <br>\n        Метод доступен по [подписке Джем](https://seller.wildberries.ru/monetization/jam) или c [тарифной опцией](https://seller.wildberries.ru/tariff-constructor) **Закрепление отзыва**.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Вопросы и отзывы</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Сервисный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый с секретом | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый | 1 ч | 5 запросов | 12 мин | 1 запрос |\n        </div>\n      tags:\n        - Закреплённые отзывы\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: array\n              example:\n                - pinMethod: subscription\n                  pinOn: imt\n                  feedbackId: VlbkVVl7mtw37wуWkJZz\n                - pinMethod: tariff\n                  pinOn: imt\n                  feedbackId: DibuRAImknLyiqgzvGcU\n              maxItems: 500\n              items:\n                $ref: '#/components/schemas/openapi.PinReviewItem'\n        required: true\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                allOf:\n                  - $ref: '#/components/schemas/respond.SuccessResponse'\n                  - $ref: '#/components/schemas/openapi.PinReviewItemResult'\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/respond.ResultErr'\n              example:\n                detail: invalid request body\n                origin: pin-open-api\n                requestId: 7b64у8ffc3523450d613723fwу61873e\n                status: 400\n                title: Bad Request\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/respond.ResultErr'\n              example:\n                origin: pin-open-api\n                requestId: 7b64у8ffc3523450d613723fwу61873e\n                status: 403\n                title: no active subscription or tariff\n                detail: this feature requires active subscription or active tariff\n        '429':\n          $ref: '#/components/responses/429'\n    delete:\n      operationId: deleteFeedbacksV1Pins\n      x-readonly-method: false\n      x-category: questionsandfeedback\n      security:\n        - HeaderApiKey: []\n      summary: Открепить отзывы\n      description: |\n        Метод позволяет открепить отзывы в карточке товара или в группе [объединённых](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточек.<br>\n        Чтобы получить `pinId` — ID операций закрепления, используйте метод [Список закреплённых и откреплённых отзывов](/openapi/user-communication#tag/pinnedFeedbacks/operation/getFeedbacksV1Pins).<br>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Вопросы и отзывы</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Сервисный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый с секретом | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый | 1 ч | 5 запросов | 12 мин | 1 запрос |\n        </div>\n      tags:\n        - Закреплённые отзывы\n      requestBody:\n        description: Список `pinId` — ID операций закрепления отзывов\n        content:\n          application/json:\n            schema:\n              type: array\n              maxItems: 500\n              items:\n                type: integer\n              example:\n                - 123456\n                - 234567\n                - 345678\n        required: true\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                allOf:\n                  - $ref: '#/components/schemas/respond.SuccessResponse'\n                  - type: object\n                    properties:\n                      data:\n                        type: array\n                        description: Список `pinId` — ID операций закрепления отзывов, которые были успешно откреплены\n                        example:\n                          - 123456\n                          - 234567\n                          - 345678\n                        items:\n                          type: integer\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/respond.ResultErr'\n              example:\n                detail: invalid request body\n                origin: pin-open-api\n                requestId: 7b64у8ffc3523450d613723fwу61873e\n                status: 400\n                title: Bad Request\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/feedbacks/v1/pins/count:\n    servers:\n      - url: https://feedbacks-api.wildberries.ru\n    get:\n      operationId: getFeedbacksV1PinsCount\n      x-readonly-method: true\n      x-category: questionsandfeedback\n      security:\n        - HeaderApiKey: []\n      summary: Количество закреплённых и откреплённых отзывов\n      description: |\n        Метод возвращает количество закреплённых и откреплённых отзывов за заданный период.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Вопросы и отзывы</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Сервисный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый с секретом | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый | 1 ч | 5 запросов | 12 мин | 1 запрос |\n        </div>\n      tags:\n        - Закреплённые отзывы\n      parameters:\n        - name: state\n          in: query\n          description: |\n            Закреплён ли отзыв:\n              - `pinned` — да\n              - `unpinned` — нет\n          schema:\n            type: string\n            enum:\n              - pinned\n              - unpinned\n            example: pinned\n        - name: pinOn\n          in: query\n          description: |\n            Место закрепления отзыва:\n              - `nm` — карточка товара\n              - `imt` — группа [объединённых](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточек товаров\n          schema:\n            type: string\n            enum:\n              - nm\n              - imt\n            example: nm\n        - name: imtId\n          in: query\n          description: |\n            ID для [объединённых](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточек товаров.<br>Един для всех артикулов WB группы объединённых карточек.<br>У каждой карточки товара есть `imtId`, даже если она не объединена с другими карточками<br>\n          schema:\n            type: integer\n            example: 256971531\n        - name: nmId\n          in: query\n          description: Артикул WB\n          schema:\n            type: integer\n            example: 177974151\n        - name: feedbackId\n          in: query\n          description: ID отзыва\n          schema:\n            type: integer\n            example: 789\n        - name: dateFrom\n          in: query\n          description: Дата закрепления первого отзыва в списке\n          schema:\n            type: string\n            format: date-time\n            example: '2020-01-01T15:04:05Z'\n        - name: dateTo\n          in: query\n          description: Дата закрепления последнего отзыва в списке\n          schema:\n            type: string\n            format: date-time\n            example: '2020-02-01T15:04:05Z'\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                allOf:\n                  - $ref: '#/components/schemas/respond.SuccessResponse'\n                  - type: object\n                    properties:\n                      data:\n                        type: integer\n                        description: Количество отзывов\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/respond.ResultErr'\n              example:\n                status: 400\n                title: Bad Request\n                detail: state must be one of the values 'pinned', 'unpinned'\n                requestId: 7b64у8ffc3523450d613723fwу61873e\n                origin: pin-open-api\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/feedbacks/v1/pins/limits:\n    servers:\n      - url: https://feedbacks-api.wildberries.ru\n    get:\n      operationId: getFeedbacksV1PinsLimits\n      x-readonly-method: true\n      x-category: questionsandfeedback\n      security:\n        - HeaderApiKey: []\n      summary: Лимиты закреплённых отзывов\n      description: |\n        Метод возвращает лимиты закреплённых отзывов по тарифу и подписке.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Вопросы и отзывы</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Сервисный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый с секретом | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый | 1 ч | 5 запросов | 12 мин | 1 запрос |\n        </div>\n      tags:\n        - Закреплённые отзывы\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                allOf:\n                  - $ref: '#/components/schemas/respond.SuccessResponse'\n                  - $ref: '#/components/schemas/openapi.SellerLimitsResponse'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/seller/chats:\n    get:\n      operationId: getV1SellerChats\n      x-readonly-method: true\n      x-category: buyerchat\n      servers:\n        - url: https://buyer-chat-api.wildberries.ru\n      security:\n        - HeaderApiKey: []\n      summary: Список чатов\n      description: |\n        Метод возвращает список всех чатов продавца. По этим данным можно получить [события чатов](/openapi/user-communication#tag/buyersChat/operation/getV1SellerEvents) или [отправить сообщение покупателю](/openapi/user-communication#tag/buyersChat/operation/postV1SellerMessage).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 10 сек | 10 запросов | 1 сек | 10 запросов |\n        | Сервисный | 10 сек | 10 запросов | 1 сек | 10 запросов |\n        | Базовый с секретом | 10 сек | 10 запросов | 1 сек | 10 запросов |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      tags:\n        - Чат с покупателями\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ChatsResponse'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/seller/events:\n    get:\n      operationId: getV1SellerEvents\n      x-readonly-method: true\n      x-category: buyerchat\n      servers:\n        - url: https://buyer-chat-api.wildberries.ru\n      security:\n        - HeaderApiKey: []\n      summary: События чатов\n      description: |\n        Метод возвращает список событий всех [чатов с покупателями](/openapi/user-communication#tag/buyersChat/operation/getV1SellerChats).\n\n        Чтобы получить все события:\n          1. Сделайте первый запрос без параметра `next`.\n          2. Повторяйте запрос со значением параметра `next` из ответа на предыдущий запрос, пока `totalEvents` не станет равным `0`. Это будет означать, что вы получили все события.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 10 сек | 10 запросов | 1 сек | 10 запросов |\n        | Сервисный | 10 сек | 10 запросов | 1 сек | 10 запросов |\n        | Базовый с секретом | 10 сек | 10 запросов | 1 сек | 10 запросов |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      tags:\n        - Чат с покупателями\n      parameters:\n        - name: next\n          in: query\n          description: |\n            Пагинатор. С какого момента получить следующий пакет данных.<br>Формат Unix timestamp **с миллисекундами**\n          schema:\n            type: integer\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/EventsResponse'\n              example:\n                result:\n                  next: 1698045576000\n                  newestEventTime: '2023-10-23T07:19:36Z'\n                  oldestEventTime: '2023-10-23T05:02:20Z'\n                  totalEvents: 4\n                  events:\n                    - chatID: 1:1e265a58-a120-b178-008c-60af2460207c\n                      eventID: 55adee45-11f0-33b6-a847-6ccc7c78b2ec\n                      eventType: message\n                      isNewChat: true\n                      message:\n                        attachments:\n                          goodCard:\n                            nmID: 12345678\n                            price: 500\n                            priceCurrency: RUB\n                            rid: 2fb52cd9e25e52538a5f05994e688ae5\n                            size: '0'\n                          files:\n                            - contentType: application/pdf\n                              date: '2023-10-23T08:02:19.594Z'\n                              downloadID: ecaeb056-a4ee-45b4-ae45-666811755d38\n                              name: Чек.pdf\n                              url: https://chat-basket-01.wbbasket.ru/vol0/part3265/fb25c9e9-cae8-52db-b68e-736c1896a3f5/pdf/0380e781-281e-41b5-8ae1-ce281f15a4a7.pdf\n                              size: 1046143\n                          images:\n                            - date: '2023-10-23T08:02:20.717Z'\n                              downloadID: fd6be4e3-5447-41d7-a1e6-b2d3e06c3b05\n                              url: https://chat-basket-01.wbbasket.ru/vol0/part2345/fb89c9e9-cae8-52db-b68e-736c1466a3f5/jpg/0823ff24-821e-40e9-8cdf-0a2b5fd86a32.jpg\n                        text: Здравствуйте! У меня вопрос по товару \"Альбом, бренд Эконом, артикул 13480414, товар получен 18.10.2023\"\n                      source: rusite\n                      addTimestamp: 1698037340000\n                      addTime: '2023-10-23T05:02:20Z'\n                      replySign: 1:1e265a58-a120-b178-008c-60af2460207c:66f136e919a8207e136757754f253189bfb9ae1ad9da9170c9d5c478626663908888c370216525bef51c0ca8d77952e05c9c17f9b63ab00374c5555b42efc07d\n                      sender: client\n                      clientName: Алёна\n                    - chatID: 1:1e265a58-a120-b178-008c-60af2460207c\n                      eventID: cef95d3c-0345-4dc9-b6df-4c8c57a176a9\n                      eventType: message\n                      message:\n                        text: Здравствуйте! Пришёл не тот цвет. Можно вернуть и заказать другой товар?\n                      source: rusite\n                      addTimestamp: 1698037387000\n                      addTime: '2023-10-23T05:03:07Z'\n                      sender: client\n                      clientName: Алёна\n                    - chatID: 1:1e265a58-a120-b178-008c-60af2460207c\n                      eventID: fd22e5bf-64fd-43f7-b3a0-ad29uu027f97\n                      eventType: message\n                      message:\n                        text: Здравствуйте. Да, сейчас оформим возврат.\n                      source: seller-public-api\n                      addTimestamp: 1698038124000\n                      addTime: '2023-10-23T05:15:24Z'\n                      sender: seller\n                    - chatID: 1:1e265a58-a120-b178-008c-60af2460207c\n                      eventID: cef95d3c-0345-4dc9-b6df-4c8c75a176a7\n                      eventType: message\n                      addTimestamp: 1698045576000\n                      addTime: '2023-10-23T07:19:36Z'\n                      sender: seller\n                errors: null\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  status:\n                    type: number\n                    description: HTTP статус-код\n                  title:\n                    type: string\n                    description: Заголовок ошибки\n                  origin:\n                    type: string\n                    description: ID внутреннего сервиса WB\n                  detail:\n                    type: string\n                    description: Детали ошибки\n                  requestId:\n                    type: string\n                    description: Уникальный ID запроса\n                  error:\n                    type: string\n                    description: Текст ошибки\n              examples:\n                IncorrectNextParameter:\n                  description: Тип данных или значение некорректны\n                  value:\n                    status: 400\n                    title: Bad Request\n                    origin: proxy-chats\n                    detail: Invalid number\n                    requestId: 62f59a4ce21064f20b1bbc28c85f38d8\n                    error: Invalid number\n                IncorrectNextParameter1:\n                  description: Недопустимое значение 0\n                  value:\n                    status: 400\n                    title: Bad Request\n                    origin: proxy-chats\n                    detail: Invalid value for \"next\"\n                    requestId: 62f59a4ce21064f20b1bbc28c85f38d8\n                    error: Invalid value for \"next\"\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/seller/message:\n    post:\n      operationId: postV1SellerMessage\n      x-readonly-method: false\n      x-category: buyerchat\n      servers:\n        - url: https://buyer-chat-api.wildberries.ru\n      security:\n        - HeaderApiKey: []\n      summary: Отправить сообщение\n      description: |\n        Метод отправляет сообщения в [чат с покупателем](/openapi/user-communication#tag/buyersChat/operation/getV1SellerChats).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 10 сек | 10 запросов | 1 сек | 10 запросов |\n        | Сервисный | 10 сек | 10 запросов | 1 сек | 10 запросов |\n        | Базовый с секретом | 10 сек | 10 запросов | 1 сек | 10 запросов |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      tags:\n        - Чат с покупателями\n      requestBody:\n        content:\n          multipart/form-data:\n            schema:\n              required:\n                - replySign\n              type: object\n              properties:\n                replySign:\n                  maxLength: 255\n                  type: string\n                  description: |\n                    Подпись чата. Можно получить из [информации по чату](./user-communication#tag/buyersChat/operation/getV1SellerChats) или [данных события](./user-communication#tag/buyersChat/operation/getV1SellerEvents), если в событии есть поле `\"isNewChat\": true`.\n                message:\n                  maxLength: 1000\n                  type: string\n                  description: Текст сообщения. Максимум 1000 символов.\n                file:\n                  type: array\n                  description: |\n                    Файлы, формат JPEG, PDF или PNG, максимальный размер — 5 Мб каждый. Максимальный суммарный размер файлов — 30 Мб.\n                  items:\n                    type: string\n                    format: binary\n        required: true\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/MessageResponse'\n              example:\n                result:\n                  addTime: 1712848270018\n                  chatID: 1:641b623c-5c0e-295b-db03-3d5b4d484c32\n                errors: []\n        '400':\n          description: Неправильный запрос\n          content:\n            application/problem+json:\n              schema:\n                type: object\n                properties:\n                  status:\n                    type: number\n                    description: HTTP статус-код\n                  title:\n                    type: string\n                    description: Заголовок ошибки\n                  origin:\n                    type: string\n                    description: ID внутреннего сервиса WB\n                  detail:\n                    type: string\n                    description: Детали ошибки\n                  requestId:\n                    type: string\n                    description: Уникальный ID запроса\n                  error:\n                    type: string\n                    description: Текст ошибки\n              examples:\n                InvalidSignature:\n                  description: Подпись некорректна\n                  value:\n                    status: 400\n                    title: Bad Request\n                    origin: proxy-chats\n                    detail: Invalid signature\n                    requestId: 1b21cad4833a0c9244dc294a000f6149\n                    error: Invalid signature\n                InvalidFileSize:\n                  description: Размер файла превышает допустимый\n                  value:\n                    status: 400\n                    title: Bad Request\n                    origin: proxy-chats\n                    detail: 'A24FA09844E: attachment too big. Max size: 5MiB'\n                    requestId: 1b21cad4833a0c9244dc294a000f6149\n                    error: 'A24FA09844E: attachment too big. Max size: 5MiB'\n                UnsupportedFilesType:\n                  description: Тип файла не поддерживается\n                  value:\n                    status: 400\n                    title: Bad Request\n                    origin: proxy-chats\n                    detail: '4A9F2544E29: \"video_2023-07-25_10-54-09.mp4\" has unsupported mime type'\n                    requestId: 1b21cad4833a0c9244dc294a000f6149\n                    error: '4A9F2544E29: \"video_2023-07-25_10-54-09.mp4\" has unsupported mime type'\n                InvalidMessage:\n                  description: Значение параметра message некорректно\n                  value:\n                    status: 400\n                    title: Bad Request\n                    origin: proxy-chats\n                    detail: Invalid value for \"message\"\n                    requestId: 1b21cad4833a0c9244dc294a000f6149\n                    error: Invalid value for \"message\"\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/seller/download/{id}:\n    get:\n      operationId: getV1SellerDownloadId\n      x-readonly-method: true\n      x-category: buyerchat\n      servers:\n        - url: https://buyer-chat-api.wildberries.ru\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Чат с покупателями\n      summary: Получить файл из сообщения\n      description: |\n        Метод возвращает файл или изображение из сообщения по его ID.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 10 сек | 10 запросов | 1 сек | 10 запросов |\n        | Сервисный | 10 сек | 10 запросов | 1 сек | 10 запросов |\n        | Базовый с секретом | 10 сек | 10 запросов | 1 сек | 10 запросов |\n        | Базовый | 1 ч | 10 запросов | 6 мин | 1 запрос |\n        </div>\n      parameters:\n        - name: id\n          in: path\n          description: ID файла, см. значение поля `downloadID` в методе [События чатов](./user-communication#tag/buyersChat/operation/getV1SellerEvents)\n          required: true\n          schema:\n            type: string\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/pdf:\n              schema:\n                type: string\n                format: binary\n            image/jpeg:\n              schema:\n                type: string\n                format: binary\n            image/png:\n              schema:\n                type: string\n                format: binary\n        '202':\n          description: Файл на модерации\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  moderationState:\n                    type: string\n                    description: Статус модерации\n                    example: pending\n                  retrySeconds:\n                    type: integer\n                    description: Секунд до следующей попытки запроса файла\n                    example: 30\n                required:\n                  - moderationState\n                  - retrySeconds\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  status:\n                    type: number\n                    description: HTTP статус-код\n                  title:\n                    type: string\n                    description: Заголовок ошибки\n                  origin:\n                    type: string\n                    description: ID внутреннего сервиса WB\n                  detail:\n                    type: string\n                    description: Детали ошибки\n                  requestId:\n                    type: string\n                    description: Уникальный ID запроса\n                  error:\n                    type: string\n                    description: Текст ошибки\n              examples:\n                IncorrectNextParameter:\n                  description: Недействительный ID файла\n                  value:\n                    status: 400\n                    title: invalid fileID\n                    origin: proxy-chats\n                    detail: invalid fileID\n                    requestId: 62f59a4ce21064f20b1bbc28c85f38d8\n                    error: invalid fileID\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n        '451':\n          description: Файл не прошёл модерацию\n          content:\n            application/problem+json:\n              schema:\n                type: object\n                properties:\n                  status:\n                    type: integer\n                    description: HTTP статус-код\n                    example: 451\n                  title:\n                    type: string\n                    description: Заголовок ошибки\n                    example: Unavailable for Legal Reasons\n                  origin:\n                    type: string\n                    description: ID внутреннего сервиса WB\n                    example: proxy-chats\n                  detail:\n                    type: string\n                    description: Детали ошибки\n                    example: moderation error\n                  requestId:\n                    type: string\n                    description: ID запроса\n                    example: 62f59a4ce21064f20b1bbc28c85f38d8\n  /api/v1/claims:\n    servers:\n      - url: https://returns-api.wildberries.ru\n    get:\n      operationId: getV1Claims\n      x-readonly-method: true\n      x-category: returns\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Возвраты покупателями\n      summary: Заявки покупателей на возврат\n      description: |\n        Метод возвращает заявки покупателей на возврат товаров за последние 14 дней. Вы можете [отвечать на эти заявки](/openapi/user-communication#tag/buyersReturns/operation/patchV1Claim).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 20 запросов | 3 сек | 10 запросов |\n        | Сервисный | 1 мин | 20 запросов | 3 сек | 10 запросов |\n        | Базовый с секретом | 1 мин | 20 запросов | 3 сек | 10 запросов |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      parameters:\n        - $ref: '#/components/parameters/is_archive'\n        - $ref: '#/components/parameters/id'\n        - $ref: '#/components/parameters/limit'\n        - $ref: '#/components/parameters/offset'\n        - $ref: '#/components/parameters/nm_id'\n      responses:\n        '200':\n          $ref: '#/components/responses/GetClaimsSuccessResponse'\n        '400':\n          $ref: '#/components/responses/Error400GetClaims'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/claim:\n    servers:\n      - url: https://returns-api.wildberries.ru\n    patch:\n      operationId: patchV1Claim\n      x-readonly-method: false\n      x-category: returns\n      security:\n        - HeaderApiKey: []\n      tags:\n        - Возвраты покупателями\n      summary: Ответ на заявку покупателя\n      description: |\n        Метод отправляет ответ на [заявку](/openapi/user-communication#tag/buyersReturns/operation/getV1Claims) покупателя на возврат товаров.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 мин | 20 запросов | 3 сек | 10 запросов |\n        | Сервисный | 1 мин | 20 запросов | 3 сек | 10 запросов |\n        | Базовый с секретом | 1 мин | 20 запросов | 3 сек | 10 запросов |\n        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |\n        </div>\n      requestBody:\n        $ref: '#/components/requestBodies/PatchClaimReq'\n      responses:\n        '200':\n          description: Успешно\n        '400':\n          $ref: '#/components/responses/Error400PatchClaim'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '429':\n          $ref: '#/components/responses/429'\ncomponents:\n  examples:\n    contentTypeHeaderNotSpecified:\n      description: Не указан заголовок Content-Type\n      value:\n        title: bad request\n        requestId: e6c4100223db8bf5818b2e5f12705891\n        origin: fbapi\n        detail: content-type header not specified\n    incorrectContentTypeHeader:\n      description: Некорректный заголовок Content-Type\n      value:\n        title: bad request\n        requestId: e3676d061de748d9beaaa752d53e1670\n        origin: fbapi\n        detail: 'content-type is not a valid mime-type: u'\n    incorrectContentType:\n      description: Указан неверный тип данных в заголовке Content-Type\n      value:\n        title: bad request\n        requestId: cb4e8b210b4841ce9a3424946b497cb3\n        origin: fbapi\n        detail: 'not a json content-type: application/javascript'\n    invalidJsonSyntax:\n      description: Неверный синтаксис JSON\n      value:\n        title: bad request\n        requestId: 7f5a4faf91634812de5e143955ca0371\n        origin: fbapi\n        detail: Неверный синтаксис JSON\n    FeedbackErr400:\n      description: Неправильный запрос\n      value:\n        data: null\n        error: true\n        errorText: Something went wrong\n        additionalErrors: null\n        requestId: 734c9ea8-39e5-45c9-8cad-f03c13f733e9\n    IsAnsweredErr400:\n      description: Неправильный запрос\n      value:\n        data: null\n        error: true\n        errorText: Плохой формат isAnswered\n        additionalErrors: null\n        requestId: 734c9ea8-39e5-45c9-8cad-f03c13f733e9\n    DateFromErr400:\n      description: Неправильный запрос\n      value:\n        data: null\n        error: true\n        errorText: Плохой формат dateFrom\n        additionalErrors: null\n        requestId: 734c9ea8-39e5-45c9-8cad-f03c13f733e9\n    DateToErr400:\n      description: Неправильный запрос\n      value:\n        data: null\n        error: true\n        errorText: Плохой формат dateTo\n        additionalErrors: null\n        requestId: 734c9ea8-39e5-45c9-8cad-f03c13f733e9\n    FeedbackErr403:\n      description: Доступ запрещён\n      value:\n        data: null\n        error: true\n        errorText: Ошибка авторизации\n        additionalErrors: null\n        requestId: 734c9ea8-39e5-45c9-8cad-f03c13f733e9\n    FeedbackErr404:\n      description: Не найдено\n      value:\n        data: null\n        error: true\n        errorText: Не найден отзыв\n        additionalErrors: null\n        requestId: 734c9ea8-39e5-45c9-8cad-f03c13f733e9\n    responseInaccessibleBackGoodError422:\n      description: Запрос на возврат покупок недоступен\n      value:\n        data: null\n        error: true\n        errorText: Запрос на возврат покупок недоступен\n        additionalErrors: null\n        requestId: f551e94d-9bd5-431d-a4b6-b78106fe6348\n    responseUnsuccessfullyBackGoodError422:\n      description: Не удалось выполнить запрос на возврат покупок\n      value:\n        data: null\n        error: true\n        errorText: Не удалось выполнить запрос на возврат покупок\n        additionalErrors: null\n        requestId: 93ea349d-d0ec-41b0-aaac-a8f5f137a109\n    ResponseGetQuestionByIdErrEx:\n      description: Не удалось получить вопрос по ID\n      value:\n        data: null\n        error: true\n        errorText: Невозможно получить вопрос по id\n        additionalErrors: null\n        requestId: 87a2fe4d-d28b-4bae-b824-c0f498c72702\n    ResponseGetFeedbackByIdErrEx:\n      description: Не удалось получить отзыв по ID\n      value:\n        data: null\n        error: true\n        errorText: Невозможно получить отзыв по id\n        additionalErrors: null\n        requestId: 87a2fe4d-d28b-4bae-b824-c0f498c72702\n    ResponseGetFeedbackArchive:\n      description: Не удалось получить архивные отзывы по фильтру\n      value:\n        data: null\n        error: true\n        errorText: Не удалось получить архивные отзывы по фильтру\n        additionalErrors: null\n        requestId: 87a2fe4d-d28b-4bae-b824-c0f498c72702\n    ResponsePatchQuestion:\n      description: Не удалось отредактировать вопрос\n      value:\n        data: null\n        error: true\n        errorText: Не удалось отредактировать вопрос\n        additionalErrors: null\n        requestId: 87a2fe4d-d28b-4bae-b824-c0f498c72702\n    ResponseDoNotGetFeedback400:\n      description: Неправильный запрос\n      value:\n        data: null\n        error: true\n        errorText: Не удалось получить отзыв\n        additionalErrors: null\n        requestId: 958d9676-b50c-41d6-b7ce-3c9f0bc3b822\n    RequestBodyErr400:\n      description: Неправильный запрос\n      value:\n        data: null\n        error: true\n        errorText: failed to decode JSON request.\n        additionalErrors: null\n        requestId: 958d9676-b50c-41d6-b7ce-3c9f0bc3b822\n    RequestIDErr400:\n      description: Неправильный запрос\n      value:\n        data: null\n        error: true\n        errorText: Неправильный id в запросе\n        additionalErrors: null\n        requestId: 958d9676-b50c-41d6-b7ce-3c9f0bc3b822\n  schemas:\n    standardizedFQError:\n      type: object\n      properties:\n        title:\n          type: string\n          description: Заголовок ошибки\n        requestId:\n          type: string\n          description: Уникальный ID запроса\n        origin:\n          type: string\n          description: ID внутреннего сервиса WB\n        detail:\n          type: string\n          description: Детали ошибки\n    responseFeedbackQuestionErr:\n      type: object\n      properties:\n        data:\n          type: object\n          nullable: true\n        error:\n          description: Есть ли ошибка\n          type: boolean\n        errorText:\n          description: Описание ошибки\n          type: string\n        additionalErrors:\n          description: Дополнительные ошибки\n          nullable: true\n          type: array\n          items:\n            type: string\n        requestId:\n          description: ''\n          type: string\n    responseFeedback:\n      description: Массив отзывов\n      type: array\n      items:\n        type: object\n        properties:\n          id:\n            type: string\n            description: ID отзыва\n          text:\n            type: string\n            description: Текст отзыва\n            nullable: false\n          pros:\n            type: string\n            description: Достоинства товара\n            nullable: false\n          cons:\n            type: string\n            description: Недостатки товара\n            nullable: false\n          productValuation:\n            type: integer\n            description: Оценка товара\n          createdDate:\n            type: string\n            format: date-time\n            description: Дата и время создания отзыва\n          answer:\n            nullable: true\n            type: object\n            description: Структура ответа\n            properties:\n              text:\n                type: string\n                description: Текст ответа\n              state:\n                type: string\n                description: |\n                  Статус:\n                    - `none` — новый\n                    - `wbRu` — отображается на сайте\n                    - `reviewRequired` — ответ проходит проверку\n                    - `rejected` — ответ отклонён\n              editable:\n                type: boolean\n                description: |\n                  Можно ли отредактировать ответ:\n                    - `false` — нет\n                    - `true` — да\n          state:\n            type: string\n            description: |\n              Статус отзыва:\n                - `none` - не обработан (новый)\n                - `wbRu` - обработан\n          productDetails:\n            description: Информация о товаре\n            type: object\n            properties:\n              nmId:\n                type: integer\n                description: Артикул WB\n              imtId:\n                type: integer\n                description: ID для [объединённых](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточек товаров\n              productName:\n                type: string\n                description: Название товара\n              supplierArticle:\n                type: string\n                nullable: true\n                description: Артикул продавца\n              supplierName:\n                type: string\n                nullable: true\n                description: Имя продавца\n              brandName:\n                type: string\n                nullable: true\n                description: Бренд товара\n              size:\n                type: string\n                description: Размер товара (`techSize` в КТ)\n          photoLinks:\n            nullable: true\n            description: Массив структур фотографий\n            type: array\n            items:\n              type: object\n              properties:\n                fullSize:\n                  type: string\n                  description: Адрес фотографии полного размера\n                miniSize:\n                  type: string\n                  description: Адрес фотографии маленького размера\n          video:\n            nullable: true\n            description: Структура видео\n            type: object\n            properties:\n              previewImage:\n                type: string\n                description: Ссылка на обложку видео\n              link:\n                type: string\n                description: Ссылка на файл плейлиста видео (доступно по протоколу HLS)\n              durationSec:\n                type: integer\n                description: Общая продолжительность видео\n          wasViewed:\n            type: boolean\n            description: Просмотрен ли отзыв\n          userName:\n            type: string\n            description: Имя автора отзыва\n          orderStatus:\n            type: string\n            description: |\n              Статус заказа.\n              <br>Возможные значения:\n              - `buyout` — выкуплен\n              - `rejected` — отказались\n              - `returned` — возврат\n              - `notSpecified` — статус не присвоен\n          matchingSize:\n            type: string\n            description: |\n              Соответствие заявленного размера реальному.\n              <br>Возможные значения:\n              - ` ` — для безразмерных товаров\n              - `ок` — соответствует размеру\n              - `smaller` — маломерит\n              - `bigger` — большемерит\n          isAbleSupplierFeedbackValuation:\n            description: Доступна ли продавцу возможность оставить жалобу на отзыв (`true` — доступна, `false` — не доступна)\n            type: boolean\n          supplierFeedbackValuation:\n            description: |\n              Ключ причины жалобы на отзыв\n            type: integer\n          isAbleSupplierProductValuation:\n            description: |\n              Доступна ли продавцу возможность сообщить о проблеме с товаром:\n                - `true` — да\n                - `false` — нет\n            type: boolean\n          supplierProductValuation:\n            description: |\n              Ключ проблемы с товаром\n            type: integer\n          isAbleReturnProductOrders:\n            description: |\n              Опция возврата товара:\n               - `true` — доступна\n               - `false` — недоступна\n            type: boolean\n          returnProductOrdersDate:\n            nullable: true\n            description: Дата и время, когда на запрос возврата был получен ответ со статус-кодом 200.\n            type: string\n          bables:\n            nullable: true\n            description: Список тегов покупателя\n            type: array\n            items:\n              type: string\n          lastOrderShkId:\n            type: integer\n            description: Штрихкод единицы товара\n          lastOrderCreatedAt:\n            type: string\n            description: Дата покупки\n          color:\n            type: string\n            description: Цвет товара\n          subjectId:\n            type: integer\n            description: ID предмета\n          subjectName:\n            type: string\n            description: Название предмета\n          parentFeedbackId:\n            type: string\n            description: ID начального отзыва (`null`, если этот отзыв начальный)\n            nullable: true\n          childFeedbackId:\n            type: string\n            nullable: true\n            description: ID дополненного отзыва (`null`, если этот отзыв дополненный)\n    Chat:\n      type: object\n      properties:\n        chatID:\n          type: string\n          description: ID чата\n          example: 1:4019cd7d-cca8-4e90-8b11-f78afbea42e3\n        replySign:\n          type: string\n          description: |\n            Подпись чата. Требуется при [отправке сообщения](./user-communication#tag/buyersChat/operation/postV1SellerMessage)\n          example: 1:4019cd7d-cca8-4e90-8b11-f78afbea42e3:54828159:bc3a4c04079f5956cff170b25e73523aa1208b5c0bd7aea1e520a64ae3e212b1ebae6712661f3afd27520fa785fa3042254e8a3100ce00644322054ae7cfcd0e\n        clientName:\n          type: string\n          description: Имя покупателя\n          example: Иван\n        goodCard:\n          $ref: '#/components/schemas/Listing'\n        lastMessage:\n          description: Последнее сообщение в чате\n          allOf:\n            - $ref: '#/components/schemas/LastMessage'\n    ChatsResponse:\n      type: object\n      properties:\n        result:\n          type: array\n          items:\n            $ref: '#/components/schemas/Chat'\n        errors:\n          description: Ошибки, если есть\n          nullable: true\n          type: array\n          example: null\n          items:\n            type: string\n    Event:\n      type: object\n      properties:\n        chatID:\n          type: string\n          description: ID чата\n        eventID:\n          type: string\n          description: ID события\n        eventType:\n          $ref: '#/components/schemas/EventType'\n        isNewChat:\n          type: boolean\n          description: |\n            Признак нового чата:\n            - `false` — чат не новый\n            - `true` — чат новый\n        message:\n          type: object\n          description: Данные сообщения\n          properties:\n            attachments:\n              $ref: '#/components/schemas/EventAttachments'\n            text:\n              type: string\n              description: Текст сообщения\n        source:\n          type: string\n          description: |\n            Источник отправки сообщения:\n            - `seller-portal` — портал продавцов\n            - `seller-public-api` — API Чата с покупателями\n            - `rusite` — портал покупателей\n            - `global` — портал `global.wildberries.ru`\n            - `ios` —  мобильная операционная система от **Apple**\n            - `android` — операционная система **Android** от **Google**\n        addTimestamp:\n          type: integer\n          description: Время появления события на сервере. Формат Unix timestamp\n        addTime:\n          type: string\n          description: Время появления события на сервере в UTC\n        replySign:\n          type: string\n          description: |\n            Подпись чата. Доступна только при `\"isNewChat\": true`. Требуется при [отправке сообщения](./user-communication#tag/buyersChat/operation/postV1SellerMessage)\n        sender:\n          $ref: '#/components/schemas/Sender'\n        clientName:\n          type: string\n          description: Имя покупателя\n    EventAttachments:\n      type: object\n      description: Вложения\n      properties:\n        goodCard:\n          $ref: '#/components/schemas/Listing'\n        files:\n          type: array\n          description: Файлы\n          items:\n            $ref: '#/components/schemas/File'\n        images:\n          type: array\n          description: Изображения\n          items:\n            $ref: '#/components/schemas/Image'\n    EventType:\n      type: string\n      description: |\n        Тип события:\n        - `message` — сообщение\n      enum:\n        - message\n    File:\n      type: object\n      properties:\n        contentType:\n          type: string\n          description: Тип файла\n        date:\n          type: string\n          description: Дата загрузки файла\n        downloadID:\n          description: ID файла. [Получить файл](./user-communication#tag/buyersChat/operation/getV1SellerDownloadId)\n          type: string\n        name:\n          type: string\n          description: Название файла\n        url:\n          type: string\n          description: URL для получения файла\n          nullable: false\n        size:\n          type: integer\n          description: Размер файла в байтах\n    Listing:\n      type: object\n      description: Информация о заказе\n      properties:\n        nmID:\n          type: integer\n          description: Артикул WB\n        price:\n          type: integer\n          description: Фактическая цена с учетом всех скидок. Взимается с покупателя\n        priceCurrency:\n          type: string\n          description: Валюта\n        rid:\n          type: string\n          description: |\n            Уникальный ID заказа. <br>\n            Примечание: `rid` — это `srid` в ответах методов:\n              - [Заявки покупателей на возврат](./user-communication#tag/buyersReturns/operation/getV1Claims)\n              - [Лента заказов](./analytics#tag/orderFeed/operation/postV1OrderFeed)\n              - [Заказы](./reports#tag/mainReports/operation/getV1SupplierOrders)\n              - [Продажи](./reports#tag/mainReports/operation/getV1SupplierSales)\n              - [Отчёт о возвратах и перемещении товаров](./reports#tag/returnsAndItemMovementReport)\n              - [Детализации к отчётам реализации по ID отчётов](./financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailedReportId)\n              - [Детализации к отчётам реализации за период](./financial-reports-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailed)\n              - [Детализации к отчётам об издержках на приём платежей по ID отчётов](./financial-reports-and-accounting#tag/financialReports/operation/postV1AcquiringDetailedReportId)\n              - [Детализации к отчётам об издержках на приём платежей за период](./financial-reports-and-accounting#tag/financialReports/operation/postV1AcquiringDetailed)\n        size:\n          type: string\n          description: Размер товара, соответствует `wbSize` в [карточке товара](./work-with-products#tag/listings/paths/~1content~1v2~1get~1cards~1list/post)\n    LastMessage:\n      type: object\n      example:\n        text: Можно заказать 100 штук?\n        addTimestamp: 1766138234889\n      properties:\n        text:\n          type: string\n          description: Текст сообщения\n        addTimestamp:\n          type: integer\n          description: Время сообщения\n    Image:\n      type: object\n      description: Изображение\n      properties:\n        date:\n          type: string\n          description: Дата загрузки изображения\n        downloadID:\n          description: ID файла. [Получить файл](./user-communication#tag/buyersChat/operation/getV1SellerDownloadId)\n          type: string\n        url:\n          type: string\n          description: URL для получения изображения\n    MessageResponse:\n      type: object\n      properties:\n        errors:\n          type: array\n          description: Ошибки загрузки файлов, если есть\n          items:\n            type: string\n        result:\n          type: object\n          properties:\n            addTime:\n              type: integer\n              description: Дата и время создания чата\n              format: Unix Timestamp в миллисекундах\n            chatID:\n              type: string\n              description: ID чата\n            sign:\n              type: string\n              description: Подпись чата\n    Sender:\n      type: string\n      description: |\n        Отправитель:\n        - `client` — покупатель\n        - `seller` — продавец\n        - `wb` — Wildberries\n      enum:\n        - client\n        - seller\n        - wb\n    EventsResponse:\n      type: object\n      properties:\n        result:\n          $ref: '#/components/schemas/EventsResult'\n        errors:\n          description: Ошибки, если есть\n          nullable: true\n          type: array\n          items:\n            type: string\n    EventsResult:\n      type: object\n      properties:\n        next:\n          type: integer\n          description: Пагинатор. Значение поля необходимо указать в запросе для получения следующего пакета данных\n          format: Unix timestamp\n        newestEventTime:\n          description: Время новейшего события в ответе\n          type: string\n          format: date-time\n        oldestEventTime:\n          description: Время
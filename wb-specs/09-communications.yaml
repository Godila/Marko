{
  "status": 200,
  "body": "openapi: 3.0.1\ninfo:\n  title: Общение с покупателями\n  version: communication\n  description: |+\n    <div class=\"description_important\">\n      Узнать больше об общении с покупателями можно в <a href=\"https://seller.wildberries.ru/instructions/category/f7f6c465-dd12-422d-80a0-a6d9562115d5?goBackOption=prevRoute&categoryId=30817062-14cc-4a82-bc78-3600c2b0685b\">справочном центре</a>\n    </div>\n\n    <div class=\"api-block\">\n\n    С помощью методов общения с покупателями вы можете работать с:\n      1. [Вопросами](/openapi/user-communication#tag/questions) и [отзывами](/openapi/user-communication#tag/feedbacks) покупателей\n      2. [Закреплёнными отзывами](/openapi/user-communication#tag/pinnedFeedbacks)\n      3. [Чатами с покупателями](/openapi/user-communication#tag/buyersChat)\n      4. [Заявками покупателей на возврат](/openapi/user-communication#tag/buyersReturns)\n\n    Вы можете протестировать методы общения с покупателями в [песочнице](/sandbox). Также в песочнице доступны [специальные методы](/docs/openapi-other/sandbox-environment#tag/Voprosy-i-otzyvy) для управления тестовыми вопросами и отзывами\n\n    </div>\n\n\n    <div class=\"description_ref\">\n      Узнать, как использовать методы в бизнес-кейсах, можно в <a href=\"/knowledge-base/articles/019d49a4-0b26-7620-8d0b-e3050b7cd01d/obshchenie-s-pokupateliami\">инструкции</a> по работе с разделом <strong>Общение с покупателями</strong>\n    </div>\n\n  x-file-name: communications\nsecurity:\n  - HeaderApiKey: []\ntags:\n  - name: Вопросы\n    x-displayName: Вопросы\n    description: ''\n  - name: Отзывы\n    x-displayName: Отзывы\n    description: ''\n  - name: Закреплённые отзывы\n    x-displayName: Закреплённые отзывы\n    description: ''\n  - name: Чат с покупателями\n    x-displayName: Чат с покупателями\n    description: ''\n  - name: Возвраты покупателями\n    x-displayName: Возвраты покупателями\n    description: ''\npaths:\n  /api/v1/new-feedbacks-questions:\n    servers:\n      - url: https://feedbacks-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://feedbacks-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      operationId: getV1NewFeedbacksQuestions\n      x-readonly-method: true\n      x-category: questionsandfeedback\n      security:\n        - HeaderApiKey: []\n      summary: Непросмотренные отзывы и вопросы\n      description: |\n        Метод проверяет наличие непросмотренных [вопросов](/openapi/user-communication#tag/questions/operation/getV1Questions) и [отзывов](/openapi/user-communication#tag/feedbacks/operation/getV1Feedbacks) от покупателей. Если у продавца есть непросмотренные вопросы или отзывы, возвращает `true`.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Вопросы и отзывы</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Сервисный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый с секретом | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый | 1 ч | 5 запросов | 12 мин | 1 запрос |\n        </div>\n      tags:\n        - Вопросы\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    type: object\n                    properties:\n                      hasNewQuestions:\n                        type: boolean\n                        description: |\n                          Есть ли непросмотренные вопросы:\n                             - `true` — да\n                             - `false` — нет\n                        example: true\n                      hasNewFeedbacks:\n                        type: boolean\n                        description: |\n                          Есть ли непросмотренные отзывы:\n                           - `true` — да\n                           - `false` — нет\n                        example: false\n                  error:\n                    type: boolean\n                    description: Есть ли ошибка\n                    example: false\n                  errorText:\n                    type: string\n                    description: Описание ошибки\n                    example: ''\n                  additionalErrors:\n                    description: Дополнительные ошибки\n                    nullable: true\n                    type: array\n                    items:\n                      type: string\n                    example: null\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseFeedbackQuestionErr'\n              examples:\n                FeedbackErr403:\n                  $ref: '#/components/examples/FeedbackErr403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/questions/count-unanswered:\n    servers:\n      - url: https://feedbacks-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://feedbacks-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      operationId: getV1QuestionsCountUnanswered\n      x-readonly-method: true\n      x-category: questionsandfeedback\n      security:\n        - HeaderApiKey: []\n      summary: Неотвеченные вопросы\n      description: |\n        Метод возвращает общее количество неотвеченных [вопросов](/openapi/user-communication#tag/questions/operation/getV1Questions) и количество неотвеченных вопросов за сегодня.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Вопросы и отзывы</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Сервисный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый с секретом | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый | 1 ч | 5 запросов | 12 мин | 1 запрос |\n        </div>\n      tags:\n        - Вопросы\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    type: object\n                    properties:\n                      countUnanswered:\n                        type: integer\n                        description: Количество неотвеченных вопросов\n                        example: 24\n                      countUnansweredToday:\n                        type: integer\n                        description: Количество неотвеченных вопросов за сегодня\n                        example: 0\n                  error:\n                    type: boolean\n                    description: Есть ли ошибка\n                    example: false\n                  errorText:\n                    type: string\n                    description: Описание ошибки\n                    example: ''\n                  additionalErrors:\n                    description: Дополнительные ошибки\n                    nullable: true\n                    type: array\n                    items:\n                      type: string\n                    example: null\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseFeedbackQuestionErr'\n              examples:\n                FeedbackErr403:\n                  $ref: '#/components/examples/FeedbackErr403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/questions/count:\n    servers:\n      - url: https://feedbacks-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://feedbacks-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      operationId: getV1QuestionsCount\n      x-readonly-method: true\n      x-category: questionsandfeedback\n      security:\n        - HeaderApiKey: []\n      summary: Количество вопросов\n      description: |\n        Метод возвращает количество отвеченных или неотвеченных [вопросов](/openapi/user-communication#tag/questions/operation/getV1Questions) за заданный период.\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Вопросы и отзывы</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Сервисный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый с секретом | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый | 1 ч | 5 запросов | 12 мин | 1 запрос |\n        </div>\n      tags:\n        - Вопросы\n      parameters:\n        - name: dateFrom\n          in: query\n          description: Дата начала периода в формате Unix timestamp\n          schema:\n            type: integer\n            example: 1688465092\n        - name: dateTo\n          in: query\n          description: Дата конца периода в формате Unix timestamp\n          schema:\n            type: integer\n            example: 1688465092\n        - name: isAnswered\n          in: query\n          description: |\n            Есть ли ответ на вопрос:\n              - `true` — да\n              - `false` — нет\n          schema:\n            type: boolean\n            default: true\n            example: false\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    type: integer\n                    description: Количество вопросов\n                    example: 77\n                  error:\n                    type: boolean\n                    description: Есть ли ошибка\n                    example: false\n                  errorText:\n                    type: string\n                    description: Описание ошибки\n                    example: ''\n                  additionalErrors:\n                    description: Дополнительные ошибки\n                    nullable: true\n                    type: array\n                    items:\n                      type: string\n                    example: null\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseFeedbackQuestionErr'\n              examples:\n                IsAnsweredErr400:\n                  $ref: '#/components/examples/IsAnsweredErr400'\n                DateFromErr400:\n                  $ref: '#/components/examples/DateFromErr400'\n                DateToErr400:\n                  $ref: '#/components/examples/DateToErr400'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseFeedbackQuestionErr'\n              examples:\n                FeedbackErr403:\n                  $ref: '#/components/examples/FeedbackErr403'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/questions:\n    servers:\n      - url: https://feedbacks-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://feedbacks-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      operationId: getV1Questions\n      x-readonly-method: true\n      x-category: questionsandfeedback\n      security:\n        - HeaderApiKey: []\n      summary: Список вопросов\n      description: |\n        Метод возвращает список вопросов по заданным фильтрам. Вы можете:\n          - получить данные отвеченных и неотвеченных вопросов\n          - сортировать вопросы по дате\n          - настроить пагинацию и количество вопросов в ответе\n\n        <div class=\"description_important\">\n          Можно получить максимум 10 000 вопросов в одном ответе\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Вопросы и отзывы</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Сервисный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый с секретом | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый | 1 ч | 5 запросов | 12 мин | 1 запрос |\n        </div>\n      tags:\n        - Вопросы\n      parameters:\n        - name: isAnswered\n          in: query\n          description: |\n            Есть ли ответ на вопрос:\n              - `true` — да\n              - `false` — нет\n          schema:\n            type: boolean\n          required: true\n        - name: nmId\n          in: query\n          description: Артикул WB\n          schema:\n            type: integer\n        - name: take\n          in: query\n          description: |\n            Количество запрашиваемых вопросов (максимально допустимое значение для параметра - 10 000,\n            при этом сумма значений параметров `take` и `skip` не должна превышать 10 000)\n          schema:\n            type: integer\n          required: true\n        - name: skip\n          in: query\n          description: |\n            Количество вопросов для пропуска (максимально допустимое значение для параметра - 10 000,\n            при этом сумма значений параметров `take` и `skip` не должна превышать 10 000)\n          schema:\n            type: integer\n          required: true\n        - name: order\n          in: query\n          description: Сортировка вопросов по дате (`dateAsc`/`dateDesc`)\n          schema:\n            type: string\n        - name: dateFrom\n          allowEmptyValue: true\n          in: query\n          description: Дата начала периода в формате Unix timestamp\n          schema:\n            type: integer\n            example: 1688465092\n        - name: dateTo\n          in: query\n          description: Дата конца периода в формате Unix timestamp\n          schema:\n            type: integer\n            example: 1688465092\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    type: object\n                    properties:\n                      countUnanswered:\n                        type: integer\n                        description: Количество неотвеченных вопросов\n                      countArchive:\n                        type: integer\n                        description: Количество отвеченных вопросов\n                      questions:\n                        description: Вопросы\n                        type: array\n                        items:\n                          type: object\n                          properties:\n                            id:\n                              type: string\n                              description: id вопроса\n                            text:\n                              type: string\n                              description: Текст вопроса\n                            createdDate:\n                              type: string\n                              format: date-time\n                              description: Дата и время создания вопроса\n                            state:\n                              type: string\n                              description: |\n                                Статус вопроса:\n                                  - `none` — вопрос отклонён продавцом (такой вопрос не отображается на портале покупателей)\n                                  - `wbRu` — ответ предоставлен, вопрос отображается на сайте покупателей\n                                  - `suppliersPortalSynch` - новый вопрос\n                            answer:\n                              description: Структура ответа\n                              nullable: true\n                              type: object\n                              properties:\n                                text:\n                                  type: string\n                                  description: Текст ответа\n                                editable:\n                                  type: boolean\n                                  description: Можно ли отредактировать ответ (`false` - нельзя, `true` - можно)\n                                createDate:\n                                  type: string\n                                  format: date-time\n                                  description: Дата и время создания ответа\n                            productDetails:\n                              type: object\n                              description: Информация о товаре\n                              properties:\n                                nmId:\n                                  type: integer\n                                  description: Артикул WB\n                                imtId:\n                                  type: integer\n                                  description: ID для [объединённых](/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/rabota-s-tovarami#obuedinenie-i-razuedinenie-kartochek-tovarov) карточек товаров\n                                productName:\n                                  type: string\n                                  description: Название товара\n                                supplierArticle:\n                                  type: string\n                                  description: Артикул продавца\n                                supplierName:\n                                  type: string\n                                  description: Имя продавца\n                                brandName:\n                                  type: string\n                                  description: Название бренда\n                            wasViewed:\n                              type: boolean\n                              description: Просмотрен ли вопрос\n                            isWarned:\n                              type: boolean\n                              description: |\n                                Признак подозрительного вопроса.<br>\n                                Если `true`, то вопрос опубликован, но на портале продавцов вы увидите баннер **Сообщение подозрительное**\n                  error:\n                    type: boolean\n                    description: Есть ли ошибка\n                    example: false\n                  errorText:\n                    type: string\n                    description: Описание ошибки\n                    example: ''\n                  additionalErrors:\n                    description: Дополнительные ошибки\n                    nullable: true\n                    type: array\n                    items:\n                      type: string\n              example:\n                data:\n                  countUnanswered: 24\n                  countArchive: 508\n                  questions:\n                    - id: 2ncBtX4B9I0UHoornoqG\n                      text: Question text\n                      createdDate: '2022-02-01T11:18:08.769513469Z'\n                      state: suppliersPortalSynch\n                      answer: null\n                      productDetails:\n                        imtId: 11157265\n                        nmId: 14917842\n                        productName: Coffee\n                        supplierArticle: '123401'\n                        supplierName: ' ГП Реклама и услуги'\n                        brandName: Nescafe\n                      wasViewed: false\n                      isWarned: false\n                error: false\n                errorText: ''\n                additionalErrors: null\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseFeedbackQuestionErr'\n              examples:\n                FeedbackErr400:\n                  $ref: '#/components/examples/FeedbackErr400'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseFeedbackQuestionErr'\n              examples:\n                FeedbackErr403:\n                  $ref: '#/components/examples/FeedbackErr403'\n        '429':\n          $ref: '#/components/responses/429'\n    patch:\n      operationId: patchV1Questions\n      x-readonly-method: false\n      x-category: questionsandfeedback\n      security:\n        - HeaderApiKey: []\n      summary: Работа с вопросами\n      description: |\n        В зависимости от тела запроса, метод позволяет:\n          - отметить [вопрос](/openapi/user-communication#tag/questions/operation/getV1Questions) как просмотренный\n          - отклонить вопрос\n          - ответить на вопрос или отредактировать ответ\n\n        <div class=\"description_important\">\n        Все ответы продавцов проходят предварительную модерацию перед публикацией\n        </div>\n\n        <div class=\"description_important\">\n          Отредактировать ответ на вопрос можно 1 раз в течение 60 дней после отправки ответа\n        </div>\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Вопросы и отзывы</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Сервисный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый с секретом | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый | 1 ч | 5 запросов | 12 мин | 1 запрос |\n        </div>\n      tags:\n        - Вопросы\n      requestBody:\n        content:\n          application/json:\n            schema:\n              oneOf:\n                - type: object\n                  required:\n                    - id\n                    - wasViewed\n                  properties:\n                    id:\n                      description: Id вопроса\n                      type: string\n                      example: n5um6IUBQOOSTxXoo0gV\n                    wasViewed:\n                      description: Просмотрен ли вопрос\n                      type: boolean\n                      example: true\n                - type: object\n                  required:\n                    - id\n                    - answer\n                    - state\n                  properties:\n                    id:\n                      type: string\n                      description: Id вопроса\n                      example: n5um6IUBQOOSTxXoo0gV\n                    answer:\n                      type: object\n                      required:\n                        - text\n                      properties:\n                        text:\n                          type: string\n                          description: Текст ответа\n                          example: текст ответа\n                    state:\n                      type: string\n                      description: |\n                        Статус вопроса:\n                          - `none` - вопрос отклонён продавцом (такой вопрос не отображается на портале покупателей)\n                          - `wbRu` - ответ предоставлен, вопрос отображается на сайте покупателей.\n            examples:\n              ViewQuestion:\n                description: Просмотреть вопрос\n                value:\n                  id: n5um6IUBQOOSTxXoo0gV\n                  wasViewed: true\n              RejectQuestion:\n                description: Отклонить вопрос\n                value:\n                  id: n5um6IUBQOOSTxXoo0gV\n                  answer:\n                    text: текст ответа\n                  state: none\n              AnswerQuestionOrEditAnswer:\n                description: Ответить на вопрос или отредактировать ответ\n                value:\n                  id: n5um6IUBQOOSTxXoo0gV\n                  answer:\n                    text: текст ответа\n                  state: wbRu\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    type: object\n                    nullable: true\n                  error:\n                    type: boolean\n                    description: Есть ли ошибка\n                  errorText:\n                    type: string\n                    description: Описание ошибки\n                  additionalErrors:\n                    description: Дополнительные ошибки\n                    nullable: true\n                    type: array\n                    items:\n                      type: string\n              example:\n                data: null\n                error: false\n                errorText: ''\n                additionalErrors: null\n        '400':\n          description: Неправильный запрос\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseFeedbackQuestionErr'\n              examples:\n                FeedbackErr400:\n                  $ref: '#/components/examples/FeedbackErr400'\n        '401':\n          $ref: '#/components/responses/401'\n        '402':\n          $ref: '#/components/responses/402'\n        '403':\n          description: Доступ запрещён\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseFeedbackQuestionErr'\n              examples:\n                FeedbackErr403:\n                  $ref: '#/components/examples/FeedbackErr403'\n        '404':\n          description: Не найдено\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseFeedbackQuestionErr'\n              examples:\n                FeedbackErr404:\n                  $ref: '#/components/examples/FeedbackErr404'\n        '422':\n          description: Ошибка обработки параметров запроса\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/responseFeedbackQuestionErr'\n              examples:\n                ResponsePatchQuestion:\n                  $ref: '#/components/examples/ResponsePatchQuestion'\n        '429':\n          $ref: '#/components/responses/429'\n  /api/v1/question:\n    servers:\n      - url: https://feedbacks-api.wildberries.ru\n        description: |\n          **Prod**\n      - url: https://feedbacks-api-sandbox.wildberries.ru\n        description: |\n          **Sandbox**\n    get:\n      operationId: getV1Question\n      x-readonly-method: true\n      x-category: questionsandfeedback\n      security:\n        - HeaderApiKey: []\n      summary: Получить вопрос по ID\n      description: |\n        Метод возвращает данные [вопроса](/openapi/user-communication#tag/questions/operation/getV1Questions) по его ID. Далее вы можете [работать с этим вопросом](/openapi/user-communication#tag/questions/operation/patchV1Questions).\n\n        <div class=\"description_limit\">\n        <a href=\"/openapi/api-information#tag/introduction/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Вопросы и отзывы</strong>:\n\n\n        | Тип | Период | Лимит | Интервал | Всплеск |\n        | --- | --- | --- | --- | --- |\n        | Персональный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Сервисный | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый с секретом | 1 сек | 3 запроса | 333 мс | 6 запросов |\n        | Базовый | 1 ч | 5 запросов | 12 мин | 1 запрос |\n        </div>\n      tags:\n        - Вопросы\n      parameters:\n        - name: id\n          in: query\n          required: true\n          description: ID вопроса\n          schema:\n            type: string\n            example: ljAVapEBL38RyMdRln61\n      responses:\n        '200':\n          description: Успешно\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  data:\n                    type: object\n                    properties:\n                      id:\n                        type: string\n                        description: ID вопроса\n                      text:\n                        type: string\n                        description: Текст вопроса\n                      createdDate:\n                        type: string\n                        format: date-time\n                        description: Дата и время создания вопроса\n                      state:\n                        type: string\n                        description: |\n                          Статус вопроса:\n                            - `none` - вопрос отклонён продавцом (такой вопрос не отображается на портале покупателей)\n                            - `wbRu` - ответ предоставлен, вопрос отображается на сайте покупателей\n                            - `suppliersPortalSynch` - новый вопрос\n                      answer:\n                        description: Ответ\n                        type: object\n                        nullable: true\n                        properties:\n                          text:\n                            type: string\n                            description: Текст ответа\n                          editable:\n                            type: boolean\n                            description: Можно ли отредактировать ответ (`false` - нельзя, `true` - можно)\n                          createDate:\n                            type: string\n                            format: date-time\n                            description: Дата и время создания ответа\n                      productDetails:\n                        type: object\n                        description: Item information\n                        properties:\n                          nmId:\n                            type: integer\n                            description: Артикул WB\n                          imtId:\n          